[[layer]]
id = "statements"
order = 10
status = "stable"
teaches = "SoundC: Γ with the step closure has a model and every step is entailed. CompleteC: every successor the theory forces is a step. The two theorems, with their two hypotheses"
file = "KcoreSpec/SoundDefs.lean, Sound.lean, Statements.lean"
declarations = ["KCore.SoundC", "KCore.CompleteC", "KCore.StepIs", "KCore.StepFn", "KCore.sound_hyp", "KCore.complete_hyp"]
examples = "every package states coreOK_defn, sound_hyp and complete_hyp in NAME/Sound.lean (peano, ref-kimp); peano's instances are in examples/peano/User/Course.lean"
note = "Sound d := SoundC d.sem and Complete d ref := CompleteC d.sem ref are aliases over a Definition; mention them in one line as the forms older text uses"

[[layer]]
id = "well-formedness"
order = 11
status = "stable"
teaches = "coreOK, the decidable check on the semantics, as six conjuncts, each in words with its Lean text. sortedOK: subsorts a strict partial order whose upper sorts are user sorts or library constructor sorts, every clause and every rule well sorted; a token sort of the definition has its literals as values and no constructors. faithCoreOK: twelve naming and numbering conditions, each closing a way the theory Γ would otherwise have no model. hooksApart, predsApart, idsOK: names apart and numbering. overloadsOK: each overloading symbol is declared once, plainly named, over constructors, earlier overloading symbols or functions of the definition, with coherent overloads, and lists every function it reaches along the overloads; no pattern applies a symbol that overloads a function. What coreOK does not ask, because no proof of either theorem reads it: that every sort has a value, that signatures are over declared sorts, that a map pattern has one frame, that a function without clauses is never applied"
file = "KcoreSpec/Statements.lean (coreOK), Tie.lean (sortedOK), DefinitionWf.lean (subsortsOK, libConsSorts, clauseSorted, ruleSorted), FaithOK.lean (faithCoreOK), NamesApart.lean"
declarations = ["KCore.Semantics.coreOK", "sortedOK", "subsortsOK", "libConsSorts", "clauseSorted", "ruleSorted", "faithCoreOK", "hooksApart", "predsApart", "idsOK", "overloadsOK"]
examples = "kernel-checked definitions that meet every other condition and FnHyp yet whose Γ has no model: ModelKindsWitness (a hook also listed as a constructor), ModelSortsWitness (an unnumbered token sort sharing the default name with a user sort), ModelOvlTwiceWitness (one overloading symbol listed twice), ModelInstConstWitness (a constant plainly named by the head of an instance-named symbol), ModelInstArityWitness (instance names of one head at one sort and at two), ModelInstInjWitness (an instance name of the head inj); test/LibrarySubsort.lean (a user sort below JSON: a value and a step)"
except = [
  { declaration = "inside overloadsOK: an overloading symbol is not named like an instance of a sort-parametric symbol (instDecode?), in particular not like ite at a sort", status = "stable", reason = "Term.kore writes an application of a symbol named like ite at a sort X as Lblite applied to the sort symbol of X, while a value and the constructor and overload items write it under its own name, and Γc relates the two heads nowhere: test/OvlIteSoundC.lean kernel-checks a semantics failing this conjunct alone (every other condition of coreOK, and FnHyp, hold) whose Γc with the step closure has a model (consistent) and for which SoundC fails (not_sound)", relabelled = "stable as asked for soundness, not for a model: no semantics failing it alone whose Γ has no model was found (test/witnesses.toml, overloadsOK.3), and without it the kernel-checked counterexample would meet coreOK and FnHyp and falsify sound_hyp; no entry of rows.toml (rows, cases, also_refused, split, [C3]) is refused or parameter because of it", leaves = "no construct depends on it" },
  { declaration = "inside faithCoreOK: the first leaf of itesApart (every sort name of an instance name names a numbered sort)", status = "provisional", reason = "no example shows this leaf is needed for Γ to have a model or for soundness: it is not implied by the others (test/ItesNumbered.lean, kernel-checked: a parameter named Lblite{Foo}, Foo naming no sort, meets every other condition of coreOK and FnHyp), and Γ of that semantics has a model (argued: the semantics with Foo made an own sort of no constructor meets coreOK and FnHyp and has its value model, kernel-checked, and that model meets the items of the first; for another head or number of sorts the same construction is the argument; test/witnesses.toml, itesApart.1). It is read by the value model's construction, which interprets a sort symbol by its name among the numbered sorts (ModelSig.lean instSorts_numbered, ModelDomains.lean HypModelCore.iteSorted). The other three leaves are witnessed and are not under this entry: ModelInstArityWitness (all instance names of one head are at one number of sorts), ModelInstInjWitness (no instance name has the head inj), ModelInstConstWitness (no symbol of no arguments is plainly named by the head of an instance name). Two instance names with one decoding are one name, so no two symbols are at one head and the same sorts under namesApartK (FaithOK.lean, instsApart), and that is no conjunct", ticket = "WIT.manifest" },
]
note = "okAll and wf d (which also check inhabited sorts, declared signatures, the presentation, the certificates and the printer) are not core: wf implies coreOK and is what the tie to a KORE text and the executable matcher use. A package can be generated from coreOK alone (kcore gen --core); it states sound_hyp and complete_hyp and never wf"

[not_core]
# Checked by the kernel against the core; never taught as something to review.
items = [
  "every proof",
  "the reader (Parse) and the tie to the KORE text: trusted only when a definition is read without the tie",
  "the generator and every generated package",
  "the test system: test/integration.sh per merged batch (pins of the statements, axioms of every declaration, cone diff, witnesses, corpus, round trip, agreement with reference backends on cases) and test/release.sh (every example package, KEVM, mir)",
  "the deciders and the executable evaluators (the one for collection patterns is proved to list exactly Step's successors: KCore.CExec.step_iff)",
  "theorem kinds (invariants, determinism, noninterference), certificates, the symbolic layer: taught later as uses of the core, each when its interface is stable",
]
