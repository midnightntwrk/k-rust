statement = "∀ (H : HookParams) {n : Nat} {x : Config (defn.sem.withHooks H)} (_hfu : CExec.outOfFuel (defn.sem.withHooks H) n x.val = false), Consistent (defn.sem.withHooks H) ∧ ((Γ (defn.sem.withHooks H) ∪ Γstep (defn.sem.withHooks H)) ⊧ (den (defn.sem.withHooks H) x.val ⇒ KoreAML.allNext (KoreAML.disjList ((CExec.successorsN (defn.sem.withHooks H) n x.val).map (den (defn.sem.withHooks H)))))) ∧ ∀ y ∈ CExec.successorsN (defn.sem.withHooks H) n x.val, (Γ (defn.sem.withHooks H) ⊧ (den (defn.sem.withHooks H) x.val ⇒ KoreAML.sNext (den (defn.sem.withHooks H) y)))"
