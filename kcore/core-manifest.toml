[[layer]]
id = "values"
order = 3
status = "stable"
teaches = "which ground terms are values of which sort; configurations as well-sorted terms of the top sort"
file = "KcoreSpec/Value.lean"
declarations = ["sortOf", "sortsOf", "KCore.Value", "KCore.Config", "WellSorted (KcoreSpec/Evaluation.lean)"]

[[layer]]
id = "matching"
order = 4
status = "stable"
teaches = "when a pattern matches a value under a substitution, including map, list and set patterns (a set pattern that concatenates matches a disjoint split) and a pattern headed by an overloading symbol, as a relation"
examples = "peano for variables, constructors, injections; kimp's rules for a map pattern (K |-> V M); colls-list for a list pattern"
file = "KcoreSpec/Evaluation.lean"
declarations = ["KCore.PatVal", "KCore.PatVals"]

[[layer]]
id = "evaluation"
order = 5
status = "stable"
teaches = "function evaluation as a relation between a function, argument values and a result, which is a value or undefined: a clause decides where it applies (its patterns match, its requires evaluates to true and its premise predicate holds) and every clause of a smaller priority that is not aside fails; the result is then that clause's right side's: its right-hand side's where its ensures evaluates to true and its right-side predicate holds, undefined where its ensures has another result, and for a clause with existential variables the one value its instances give, undefined where it has an instance and none gives a value; where every clause fails the result is the function's rest (Semantics.fnRest), the interpretation's value of the function at those arguments, kept when it has the result sort, undefined where the interpretation gives none; a call with an undefined argument is undefined; the order of clauses has no meaning"
file = "KcoreSpec/Evaluation.lean"
declarations = ["KCore.Eval", "KCore.EvalTerm", "KCore.EvalTerms", "KCore.Fails", "KCore.ReqFails", "KCore.Holds", "KCore.InstIs", "KCore.Semantics.fnRest"]
except = [
