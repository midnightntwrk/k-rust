# The core of KCore: what a reader must understand to know what `sound` and `complete` say.
# Everything outside it is checked by Lean's kernel against it and needs no review.
#
# This file drives two things:
#   - the docs-site Lean course: the doc owner writes about entries with status = "stable" only,
#     and is told when a status changes, never when code changes;
#   - the freeze: a stable entry changes only through a ticket that names it.
#
# status = "stable":      the declaration's text is expected to stay; teach it.
# status = "provisional": named reason and the ticket that settles it; the course gives it one line
#                         ("not settled: <reason>") and no explanation. None is admitted at the
#                         freeze: kcore-spec/test/constructs/provisional.py fails on one, except
#                         while its allowance names the entry with a pending ticket its `ticket` names.
# relabelled = "...":     on a stable entry whose subject is not resolved, why it is stable; with
#                         `leaves`, the rows.toml entries it leaves refused or parameter
#                         ("<list> <row key>[, case <name>]", as "E6 hook:INT.and:Lbl'UndsAnd-'Int'Unds'"),
#                         or the sentence "no construct depends on it", which the gate checks is true.
#                         provisional.py checks that each named entry is refused or parameter.
# rows = [...]:           on any entry, the rows.toml entries it names, of any status, in the same
#                         form; provisional.py checks that each is an entry of rows.toml.
#
# The entries are the review cone of the roots below, grouped in teaching order. The cone is computed
# by `#review_cone` (KcoreSpec/ReviewCone.lean): types of reached declarations, values of reached
# definitions, proofs not entered.

[tree]
# commit: the git tree at which cone_size was computed (kcore-spec/test/ConeV.lean, cone (v)); no release run
# has yet passed on a git tree, so it names no release-gated tree
commit = "fc6544cc1"
# frozen_at: the git trees the review cone was frozen at, in order: the release freeze, then each
# re-freeze after a cone declaration is fixed. Its last entry is the revision named by core-cone.txt's
# `# computed at git REV` line, which kcore-spec/test/cone-row.sh (integration's cone row) checks
# before comparing the cone by the text of its declarations, read at that tree. Empty while the cone
# is not frozen: core-cone.txt is then a baseline, rewritten by kcore-spec/test/cone-freeze.sh.
