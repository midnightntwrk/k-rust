# left_out: what the statements of C9, C10 and C14 mention, or what the cone's rules would reach, that
# kcore-spec/test/roots.toml does not make a root (or reads as opaque), each with its reason
# (DONE-0 C5 part 3). roots above names the roots of the committed cone (core-cone.txt);
# test/roots.toml holds the list it is next computed from.
left_out = [
  { declaration = "KCore.Parse.parse", reason = "R-15: C14 is stated per text on the literal d and re-proved by the kernel on each text, so the reader needs no trust and no freeze; no statement of C9, C10 or C14 mentions it" },
  { declaration = "KCore.Definition.emit", reason = "R-15: as Parse.parse; Tied, which unfolds it, is required of no row (TIE-1 D2) and no root mentions it" },
  { declaration = "KCore.wf", reason = "R-15: a package states coreOK_defn (coreOK is a root), which wf implies; wf is checked per text" },
  { declaration = "KCore.CExec.successorsN", reason = "read as opaque (test/roots.toml [opaque]): a term of run_exact's conclusion, which holds of the list it gives; its body cannot change what run_exact says (findings/ROOTS-run-exact-decision.md 1.2). Evidence: CExec.step_iff_at, pinned in test/Pins.lean (under execReady, FnDet and outOfFuel = false, Step c x y iff y.val is in successorsN c n x.val), and ref-kimp's run instance (examples/ref-kimp/User/RunInstance.lean, run_instance: run_exact at one configuration with the list written out and no CExec name)" },
  { declaration = "KCore.CExec.outOfFuel", reason = "read as opaque: a hypothesis of run_exact at one configuration and one fuel; a body true too often makes run_exact say less, never something false (findings/ROOTS-run-exact-decision.md 1.3). run_exact says nothing at a configuration where outOfFuel is true at every fuel tried, and which configurations those are is not reviewed. Evidence: ref-kimp's run instance, where it is false at fuel 100 by decide" },
  { declaration = "the packages' declarations (RefKimp.defn, RefKimp.Syntax's constructors, the kk package's)", reason = "generated per text, not library: the rows' statements name them, and C14 ties each package's literal to its KORE text, per text" },
  { declaration = "KCore.KK.sig, KCore.KK.emb, KCore.KK.embD, KCore.KK.embSt (examples/ref-kk/User/Sig.lean, User/Emb.lean)", reason = "the instance kore.k's three statements are proved at (KK.succs_sound : SuccsSound KK.sig and the two others; the propositions over Sig are roots); package declarations, hand-written over the symbol numbers of the pinned kore.k text, which the cone, computed over the library, cannot name. A body cannot make a statement false: each concludes a Step or a NotApplies of d₀ d, or names kore.k's result. It can make one say less, which succs_name, emb_sorted, embD_sorted, emb_injective and embSt_injective, pinned in test/PinsKk.lean with sig equal to its seven fields, and the instance at ref-kimp exclude (findings/work/decision-kk-decide-roots.md, decision-roots-final.md 2.3)" },
  { declaration = "KCore.KK.enc (KcoreSpec/KKEnc.lean)", reason = "a term of the three statements, as above; KK.enc_injective (pinned in test/PinsKk.lean: under encDef d = some E, two configurations of d₀ d with one encoding are one) makes `enc y = y'` name one configuration" },
  { declaration = "KCore.KK.encDef (KcoreSpec/KKEncDef.lean)", reason = "a decided hypothesis of the three statements: a body that is none too often makes them apply to fewer definitions, never something false. Which definitions it accepts is not reviewed in the cone (stated limit): it is KK.encodable (KK.encDef_isSome and encodable's eleven conjuncts, pinned in test/PinsKk.lean), kk/COVERAGE.toml and the kernel-decided instance at ref-kimp" },
  { declaration = "the declarations of the plain step: SoundC₀, CompleteC₀, StepIs₀, Step₀, NotApplies₀, RuleReqFails₀, applies₀, prioRuleK₀, fnItems₀ (KcoreSpec/StepOld.lean), Eval₀, EvalTerm₀, Fails₀ (EvalOld.lean), Semantics.plain, Obligations", reason = "mentioned only by theorems test/Pins.lean pins about plain definitions: that each declaration is the earlier one there (step_plain, sound₀, complete₀, sound_hyp₀, complete_hyp₀, eval_plain, evalTerm_plain, fails_plain, fnItems_plain, prioRuleK_plain, applies_of_binds, notApplies_of_binds), and sound_at, complete_at and readsConfined at a plain definition (sound_at_plain, complete_at_plain, readsConfined_of_plain, whose one name outside the cone is Semantics.plain); no statement of C9, C10 or C14 mentions them. Their texts are cone (vi) of test/ReviewCone.lean, which is not frozen; SoundC₀, CompleteC₀, StepIs₀, NotApplies₀, applies₀, prioRuleK₀ and Semantics.plain are pinned by body, the others by nothing" },
  { declaration = "KCore.CoherentPlain", reason = "the other side of coherent_iff_noExs (pinned), an equivalence with Coherent, which is in the cone and is what CoherentAll means; pinned by body in test/Pins.lean" },
  { declaration = "KCore.Definition.laws, KCore.Definition.totalParams (KcoreSpec/Definition.lean, ParamsTotal.lean)", reason = "the lists a tie's hypotheses FnLaws c defn.laws and ParamsTotal c defn.totalParams H range over (FnLaws and ParamsTotal are roots): terms computed from the literal text, as Parse.parse's result is (R-15). Each tie that takes one writes its value out by a kernel decision (law_text: the laws' patterns are the translations of the text's law sentences; total_params: the parameter names), so what the hypothesis asks is read from the tie, not from the body; a body giving another list changes those decisions, never a statement into a false one" },
]
headline = ["KCore.sound_hyp (c) (h : c.coreOK = true) (hf : FnHyp c) : SoundC c", "KCore.complete_hyp (c) (ref) (h : c.coreOK = true) (hf : FnHyp c) : CompleteC c ref"]
cone_size = "7,119 lines in 1,169 declarations"
declarations_authority = "core-cone.txt beside this file lists every declaration of the cone by module with its line range (cone (v), which kcore-spec/test/ReviewCone.lean writes to kcore-spec/.lake/review-cone-core-hyp.txt and kcore-spec/test/ConeV.lean to kcore-spec/.lake/cone-v.txt, the NEW that kcore-spec/test/cone.py compares with this file, at the commit); the declarations fields below name the main ones of each layer"
changed = "silent points: where `hook` gives an interpreted symbol no value at a silent point (silent, by silentTable: 47 keys at the tree of `commit`), the value is the interpretation's (Semantics.fallback, Semantics.hookRes) and Γ states it, ⊥ where the interpretation gives none (Faithful.ΓFallback); EvalTerm's hook case, Faithful.Γ, ΓDomains and Semantics.paramVal read them. The mechanism was added on 2026-11-14 from 82f6879b with an empty table (release run passed on c68b1a1a; release gate by a Fable agent: PASS), under which every definition meant what it meant at 82f6879b; the 47 keys were added since, so a definition that applies a key at a silent point has the interpretation's value there. The headline strings are that release's; what SoundC, CompleteC, coreOK and FnHyp say at the tree of `commit` is the layers' text below"

[[layer]]
id = "terms"
order = 1
status = "stable"
teaches = "what a configuration is: ground terms, patterns with variables, sorts and symbols as numbers"
file = "KcoreSpec/Core.lean (GroundTerm, Term, Lit); KcoreSpec/FixedSignature.lean (Srt, Sym and CtorSig only); KcoreSpec/Evaluation.lean (Subst)"
declarations = ["KCore.GroundTerm", "KCore.Term", "Srt", "Sym", "KCore.Subst"]
note = "a literal is an integer, a boolean, a token or a float (Lit; a Bytes value is a token, note_literals): Lit.float p e bits is the IEEE 754 encoding at precision p and exponent width e with one NaN per format, so equal values are equal terms (KcoreSpec/FloatDomain.lean, KFloat.ok)"
note_literals = "a String is its sequence of Unicode scalar values and a Bytes value one character per byte below 256; both forms are canonical and settled"

[[layer]]
id = "signature"
order = 2
status = "stable"
teaches = "a definition as a Lean value: sorts, constructors, subsorts, functions as clauses with priorities (a clause has patterns, a requires, a right-hand side and an ensures, the variables its right side binds by an existential, a predicate of its premise and one of its right side, and may be aside, in which case it blocks no clause), rules with priorities (a left side, a requires, a right-hand side, an ensures, existential variables and the two predicates), parameter symbols and their interpretation, collections, overloading symbols (a symbol at larger sorts whose application at arguments an overload covers is the value of the symbol it overloads there, a constructor, an overloading symbol listed before it or a function of the definition, injected into its result sort)"
file = "KcoreSpec/Core.lean"
declarations = ["KCore.Semantics", "KCore.CtorSig (KcoreSpec/FixedSignature.lean)", "KCore.Fn", "KCore.Clause", "KCore.Rule", "KCore.CollSig", "KCore.CollKind", "KCore.OvlSig"]
