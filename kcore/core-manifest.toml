[[layer]]
id = "statements"
order = 10
status = "stable"
teaches = "SoundC: Γc with the step's closure (Γstep) has a model, and for every step of Step from x to y, by a rule under a substitution, Γc entails that x has a successor among the instances of that application (the rule's right side with every variable but its existential ones fixed to its value) and that y is one of those instances. CompleteC: where ref lists the outcomes at each configuration (OutIs: exactly Step's successors by the rules whose left side binds every variable, and for each other rule a family for each match no rule of a smaller priority blocks), Γc with Γstep entails that every successor of x is in an outcome ref lists at x. The two theorems, sound_hyp and complete_hyp, each from the two hypotheses coreOK and FnHyp"
file = "KcoreSpec/SoundDefs.lean, Sound.lean, Statements.lean"
declarations = ["KCore.SoundC", "KCore.CompleteC", "KCore.StepBy", "KCore.Faithful.famEx", "KCore.OutIs", "KCore.OutFn", "KCore.Outcome", "KCore.Faithful.famOpen", "KCore.StepIs", "KCore.StepFn", "KCore.sound_hyp", "KCore.complete_hyp"]
examples = "every package states coreOK_defn, sound_hyp and complete_hyp: peano and ref-kimp in NAME/Sound.lean, and ref-kk, generated from coreOK alone, coreOK_defn in RefKk/CoreOK.lean and the two others in RefKk/Sound.lean; peano's instances are in examples/peano/User/Course.lean"
note = "Sound d := SoundC d.sem and Complete d ref := CompleteC d.sem ref are aliases over a Definition; mention them in one line as the forms older text uses. StepIs c ref says that a step function ref lists exactly Step's successors; CompleteC is stated over OutIs, not over it"

[[layer]]
id = "well-formedness"
order = 11
status = "stable"
teaches = "coreOK, the decidable check on the semantics, as five conjuncts, each in words with its Lean text. sortedOK, six conjuncts: subsorts a strict partial order whose upper sorts are user sorts or library constructor sorts (subsortsOK); every clause and every rule well sorted, each of its variables occurring in it (clauseSorted, ruleSorted); the rules, the clauses and the parameters plain (rulesPlain, clausesPlain, paramsPlain: which variables a left side may leave open, the existential variables and the right-side predicate of a clause, the shape of an open generator). faithCoreOK: twelve conditions on names, numbering, generated values and collections (genWf among them: a constructor's result sort holds no domain value and is no collection sort, so a token sort, whose values are its literals, has no constructors); most close a way the theory Γ would otherwise have no model, and the others are kept for soundness or for a proof that reads them (test/witnesses.toml gives each leaf its witness or its ruling). predsApart, idsOK: names apart and numbering; that no constructor and no function of the definition is named like an interpreted hook (hooksApart) follows from faithCoreOK and is no conjunct. overloadsOK: each overloading symbol is declared once, plainly named, of a constructor sort, over constructors, earlier overloading symbols or functions of the definition, each of its arity at sorts at most its own, with coherent overloads, and lists every function it reaches along the overloads; no pattern applies a symbol that overloads a function (ovlPatsOK, the last conjunct of overloadsOK: sortedOK implies it, and it is kept because proofs read it with overloadsOK alone). What coreOK does not ask, because no proof of either theorem reads it: that every sort has a value, that signatures are over declared sorts, that a map pattern has one frame, that a function without clauses is never applied, that the sorts hooked to a library carrier are well formed (carriersOK, which wf asks beside paramsPlain). It does ask five clauses that no proof reads, kept for the reading of the data (test/witnesses.toml, rulings of idsOK.3, .4, .5, .7 and the note of sortedOK.6): in idsOK, that there are at least as many symbol names as sort names, that no function of the definition bears a registry number, that no registry sort is listed twice among the user sorts (read by NamesApart.own_sorts alone, for a conclusion no proof takes), and that a constructor of the definition is numbered outside the registry or is a generated one; in paramsPlain, that a parameter that is no open generator has no law attribute"
file = "KcoreSpec/Statements.lean (coreOK), Tie.lean (sortedOK, clauseSorted, ruleSorted, rulesPlain, clausesPlain, paramsPlain, predsApart), DefinitionWf.lean (subsortsOK, libConsSorts, idsOK), FaithOK.lean (faithCoreOK, overloadsOK)"
declarations = ["KCore.Semantics.coreOK", "sortedOK", "subsortsOK", "libConsSorts", "clauseSorted", "ruleSorted", "rulesPlain", "clausesPlain", "paramsPlain", "faithCoreOK", "predsApart", "idsOK", "overloadsOK"]
examples = "the witness modules (KcoreSpec/Model*Witness.lean; test/witnesses.toml gives each leaf of coreOK its module, or none with the ruling that keeps it, and each module's note says how much it shows). Kernel-checked definitions failing one condition whose Γ has no model, by the leaf failed: in sortedOK, ModelExShadowWitness (clausesPlain: a clause listing a variable of its left side among its existential variables) and ModelRawBoundWitness (paramsPlain: an open generator numbered inside the registry); in faithCoreOK, ModelLibIntWitness (genWf: a library constructor of result Int), ModelCollUnitWitness (collsOK: a list collection whose unit is implemented by the library list's element symbol), ModelNamesWitness (namesApartK: two constructors with one name), ModelLitsWitness (LitsApart: a library token sort Int), ModelSortsWitness (sortsNumbered: an unnumbered token sort sharing the default name with a user sort), ModelKindsWitness (kindsApart: a hook also listed as a constructor), ModelDupCtorWitness (ctorsOnce: a constructor listed twice), ModelFnCtorWitness (fnsApart: a function named like a constructor), ModelInstArityWitness (itesApart: instance names of one head at one sort and at two), ModelInstInjWitness (itesApart: an instance name of the head inj), ModelInstConstWitness (itesApart: a constant plainly named by the head of an instance-named symbol); ModelPredTwiceWitness (predsApart: two functions under one own sort's predicate number); in idsOK, ModelOvlTwiceWitness (one overloading symbol listed twice); in overloadsOK, ModelOvlLibCtorWitness (an overloading symbol that is also a library constructor), ModelOvlIncohWitness (two constructors of one signature overloaded by one symbol, whose overload equations make them equal), ModelOvlClosedWitness (an overloading symbol that does not list a function it reaches). Of the hypotheses of consistent_of: ModelFnDetWitness (FnDet), ModelFnSolvesWitness (FnSolves), test/CeNoModel.lean (ClausePostDecided). The other witness modules are of the theory's form, not of a condition of coreOK: ModelItesWitness (two parameters whose names differ in the closing brace of the sort list: coreOK holds and the semantics is sound), ModelJunkWitness and ModelJunkNonemptyWitness (ΓSig must not say that every sort is inhabited), ModelPrioTextWitness (Γ reads the priorities of a function's equations), ModelSetIdemWitness (Γ refutes the idempotence axiom of set concatenation), ModelUndefRhsWitness (the premise ⌈rhs⌉ of a rule's axiom). test/LibrarySubsort.lean (a user sort below JSON: a value and a step)"
except = [
  { declaration = "inside overloadsOK: an overloading symbol is not named like an instance of a sort-parametric symbol (instDecode?), in particular not like ite at a sort", status = "stable", reason = "Term.kore writes an application of a symbol named like ite at a sort X as Lblite applied to the sort symbol of X, while a value and the constructor and overload items write it under its own name, and Γc relates the two heads nowhere: test/OvlIteSoundC.lean kernel-checks a semantics failing this conjunct alone (every other condition of coreOK, and FnHyp, hold) whose Γc with the step closure has a model (consistent) and for which SoundC fails (not_sound)", relabelled = "stable as asked for soundness, not for a model: no semantics failing it alone whose Γ has no model was found (test/witnesses.toml, overloadsOK.3), and without it the kernel-checked counterexample would meet coreOK and FnHyp and falsify sound_hyp; no entry of rows.toml (rows, cases, also_refused, split, [C3]) is refused or parameter because of it", leaves = "no construct depends on it" },
  { declaration = "inside faithCoreOK: the first leaf of itesApart (every sort name of an instance name names a numbered sort)", status = "stable", reason = "kept for its reader (test/witnesses.toml, itesApart.1, ruling; findings/work/decision-wit-decide.md section 6): the value model's construction interprets a sort symbol by its name among the numbered sorts, and reads this leaf for it (ModelSig.lean instSorts_numbered, which instHead_app_inst takes). The other three leaves are witnessed and are not under this entry: ModelInstArityWitness (all instance names of one head are at one number of sorts), ModelInstInjWitness (no instance name has the head inj), ModelInstConstWitness (no symbol of no arguments is plainly named by the head of an instance name). Two instance names with one decoding are one name, so no two symbols are at one head and the same sorts under namesApartK (FaithOK.lean, instsApart), and that is no conjunct", relabelled = "stable as kept with its reason, not witnessed: no example shows this leaf is needed for Γ to have a model or for soundness. It is not implied by the others (test/ItesNumbered.lean, kernel-checked: a parameter named Lblite{Foo}, Foo naming no sort, meets every other condition of coreOK and FnHyp), and Γ of that semantics has a model (argued: the semantics with Foo made an own sort of no constructor meets coreOK and FnHyp and has its value model, kernel-checked, and that model meets the items of the first; for another head or number of sorts the same construction is the argument). No entry of rows.toml (rows, cases, also_refused, split, [C3]) is refused or parameter because of it", leaves = "no construct depends on it" },
]
note = "okAll and wf d (which also check inhabited sorts, declared signatures, the presentation, the certificates and the printer) are not core: wf implies coreOK and is what the tie to a KORE text and the executable matcher use. A package can be generated from coreOK alone (kcore gen --core); it states sound_hyp and complete_hyp and never wf"

[not_core]
# Checked by the kernel against the core; never taught as something to review.
items = [
  "every proof",
  "the reader (Parse) and each text's tie to its KORE text, a proof per text: the reader is trusted only when a definition is read without the tie. What a tie states is in the cone: the theory and the translation of a text and the definitions the tie's statements are written with are roots (test/roots.toml, C14)",
  "the generator and every generated package",
  "the test system: test/integration.sh per merged batch (pins of the statements, axioms of every declaration, cone diff, witnesses, corpus, round trip, agreement with reference backends on cases) and test/release.sh (the integration run, then the committed example packages built as they stand with their user's modules, the pins of C10's statements on kore.k's package, the axioms of the examples' statements and the tripwire; no step builds a KEVM or mir package)",
  "the deciders and the executable evaluators (the one for collection patterns is proved to list exactly Step's successors under CExec.execReady and FnDet: KCore.CExec.step_iff). Of them the cone holds CExec.execReady, a decided hypothesis of the rows' statements, by its value, and successorsN and outOfFuel by their types ([tree].left_out)",
  "theorem kinds (invariants, determinism, noninterference), certificates, the symbolic layer: taught later as uses of the core, each when its interface is stable. All-path reachability over Step (Reachability.AllPath) is in the cone, as the imp consumer's statement is written with it",
]

# A cell of the release scoreboard (designs/DONE-0-definition-of-done.md section 3: a row of
# `scoreboard_rows` by a column of `scoreboard_columns`) with the theorem that meets it and how that
# theorem is checked. A cell is not an entry of the review cone: its theorem is a use of the core,
# proved over generated packages, and is neither taught nor frozen by this file.
[[cell]]
row = "KORE in K"
column = "consumer"
criterion = "DONE-0 C10 part 4 (reading R-6): encDef at ref-kimp's semantics by computation, and one concrete imp configuration whose successor succs_sound gives as a named Step"
theorem = "KCore.KK.KimpInst.step_named"
statement = "Step (RefKimp.defn.sem.withHooks HookParams.none) ⟨x₀, x₀_sorted⟩ ⟨y₀, y₀_sorted⟩"
file = "kcore-spec/examples/ref-kk/User/KimpInst.lean"
through = [
  "KCore.KK.KimpInst.encDef_kimp : encDef RefKimp.defn.sem = some E₀",
  "KCore.KK.KimpInst.succs_at : Eval KK.c₀ 510 [embD E₀, t₀] (some r₀)",
  "KCore.KK.succs_sound (kcore-spec/examples/ref-kk/User/KkThree.lean)",
]
meaning = "x₀ is kimp's configuration `while (!($n <= 0)) { $s = $s + $n; $n = $n + -1; }` before .K, with $n ↦ 3, $s ↦ 0 and the counter 0 (the loop of K's claim sum-spec at N = 3, S = 0); y₀ is the loop unfolded by the rule while, the store and the counter unchanged. E₀, x₀, y₀, t₀ and r₀ are literals, and the statements of encDef_kimp, succs_at and step_named name no encoding of a configuration and no embedding of a term or of a result"
checked_by = [
  "examples/run.sh with ref-kimp and ref-kk both selected (its default list, or `examples/run.sh ref-kimp ref-kk`): gen/build.sh --only --with examples/ref-kimp examples/ref-kk User.KimpInst, whose own #eval fails the build when encDef_kimp, succs_at, step_named, x₀_sorted, y₀_sorted, t₀_tie or r₀_tie reaches an axiom other than propext, Classical.choice, Quot.sound, or when the statement of encDef_kimp, succs_at or step_named names KCore.KK.enc, KCore.KK.emb or KCore.KK.embSt",
  "test/release.sh, step axioms-kkinst: #print axioms of KCore.KK.KimpInst.encDef_kimp, succs_at and step_named over the built packages ref-kimp and ref-kk, failing on an axiom other than propext, Classical.choice, Quot.sound",
]

[[cell]]
row = "imp"
column = "consumer"
criterion = "DONE-0 C9 part 5: the statement k2lean generates from K's claim sum-spec equals the statement of the claim's KORE sentence fixed beforehand, the stronger statement fixed beforehand from the claim's text is proved about the package's Step with no hypothesis on the functions, and one concrete configuration meets its hypotheses"
theorem = "RefKimp.Claims.sum_spec_holds"
statement = "Expected.«sum-spec»"
file = "kcore-spec/examples/ref-kimp/User/SumSpecHolds.lean"
through = [
  "RefKimp.Claims.sum_spec_run_withHooks (the run from the left side to the right side under every H)",
  "RefKimp.Claims.loop_runs_withHooks (the induction on $n, the claim's circularity)",
  "RefKimp.deterministic (kcore-spec/examples/ref-kimp/RefKimp/Kinds/Det.lean)",
  "KCore.Reachability.allPath_of_star",
]
meaning = "RefKimp.Claims.Expected.«sum-spec» (kcore-spec/examples/ref-kimp/User/SumSpecStmt.lean, written from the claim's text before any generator ran) is: for every interpretation H, integers N ≥ 0, S, rest K of the k cell and counter C, AllPath (Step (RefKimp.defn.sem.withHooks H)) from the configuration with the loop `while (!($n <= 0)) { $s = $s + $n; $n = $n + -1; }` before K, $n ↦ N, $s ↦ S and the counter C, to the configuration with K alone, $n ↦ 0, $s ↦ S + ((N + 1) * N).tdiv 2 and the counter C; its hypotheses are N ≥ 0 alone. RefKimp.Claims.ExpectedKore.«sum-spec» (the claim's KORE sentence: the target's counter existential) follows from it (RefKimp.Claims.sum_spec_kore), and RefKimp.Claims.Generated.«sum-spec» (kcore-spec/examples/ref-kimp/User/SumSpecGen.lean, written by k2lean kcore-claims) is ExpectedKore.«sum-spec» by rfl (kcore-spec/test/PinsKimp.lean). RefKimp.Claims.sum_spec_instance (kcore-spec/examples/ref-kimp/User/SumSpecInstance.lean) is the claim at N = 3, S = 0, .K and the counter 0, a configuration under every H by RefKimp.Claims.instSorted, every complete path from it passing through $n ↦ 0, $s ↦ 6"
