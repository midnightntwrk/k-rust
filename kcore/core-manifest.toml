criterion = "DONE-0 C9 part 3, complete_at: where the evaluations the step at x reads have results, every successor of x is one of a list holding Step's successors, concluding Consistent, for every interpretation H"
theorem = "RefKimp.complete_at"
statement = "∀ (H : HookParams) (x : Config (defn.sem.withHooks H)) (_hd : StepDecided (defn.sem.withHooks H) x.val) (ys : List GroundTerm) (_hys : ∀ y : Config (defn.sem.withHooks H), Step (defn.sem.withHooks H) x y → y.val ∈ ys), Consistent (defn.sem.withHooks H) ∧ ((Γ (defn.sem.withHooks H) ∪ Γstep (defn.sem.withHooks H)) ⊧ (den (defn.sem.withHooks H) x.val ⇒ KoreAML.allNext (KoreAML.disjList (ys.map (den (defn.sem.withHooks H))))))"
file = "kcore-spec/examples/ref-kimp/RefKimp/FnHyp.lean"
through = [
