[[layer]]
id = "step"
order = 6
status = "stable"
teaches = "one step: a rule whose left side matches the configuration under a well-sorted substitution, whose requires evaluates to true and whose left-side predicate holds, whose right-hand side has the successor as its value, whose ensures evaluates to true and whose right-side predicate holds, and no rule of a smaller priority applies; a rule does not apply (NotApplies) where at every match of its left side its requires is not true or its left-side predicate is false, its right side not being read"
file = "KcoreSpec/Step.lean"
declarations = ["KCore.Step", "KCore.NotApplies", "KCore.RuleReqFails", "what Step.lean reads of rules: the left side, requires, the right-hand side, ensures, the two predicates and the priority"]

[[layer]]
id = "hypothesis"
order = 7
status = "stable"
teaches = "what the theorems assume of a definition's functions (FnHyp), as six statements. Four about evaluation: every function has a result at every argument list of its sorts; every [total] function has a value there; two clauses of one function that compete (of one priority, or the one of the smaller priority aside) are coherent where both decide: the same instance of one right side, or one result; two matches of one clause at one argument list give one result, and a clause with existential variables has a result at each match where it decides. Two about what the patterns leave open: every closed condition over variables the patterns do not bind is decided by the text, satisfied by some values or refuted in every model (OpenDecided); the interpretation satisfies the associativity and idempotence laws the text writes for its open generators (OpenLaws)"
file = "KcoreSpec/Obligations.lean (FnHyp), EvalFunctionalDefs.lean (Coherent, MatchIndependent), ClausesAgree.lean, Faithful.lean (OpenDecided, OpenLaws)"
declarations = ["KCore.FnHyp", "KCore.Coherent", "KCore.MatchIndependent", "KCore.ClausesAgree", "KCore.OpenDecided", "KCore.OpenLaws"]
examples = "fprio: the two clauses of ag agree (examples/fprio/User/Values.lean, ag_agree)"
not_core = "how a package meets FnHyp: decidable checks confirm most of it and name the rest as a short list (Obligations, CoreObligations, the decider lists); with an empty list the package states sound and complete with no premise. One paragraph at most, as machinery the kernel checks. The lazy (short-circuit) obligations are used by neither headline theorem and are not taught here"

[[layer]]
id = "matching-logic"
order = 8
status = "stable"
teaches = "patterns, models and Γ ⊧ φ of applicative matching logic, as much as the statements use"
file = "aml-port: MatchingLogic/Pattern.lean, Semantics.lean, Definedness.lean"
declarations = ["ML.Pattern", "ML.Interpretation", "the entailment Γ ⊧ φ", "definedness", "KoreAML.sNext", "KoreAML.allNext"]

[[layer]]
id = "theory"
order = 9
status = "stable"
teaches = "the theory Γ a definition denotes, built from the Lean value and its interpretation of the parameter symbols, in seven parts: the signature (sorts, arities, definedness, next and domain values; no sort is said to be inhabited); constructors over sorts and subsorts (no confusion, no junk, injections composing along subsorts), with the overloading symbols (each overload as an equation; distinctness of uncovered applications; functionality and injectivity at uncovered arguments only for a symbol that overloads a function) and the laws of the open generators; the domains (ΓDomains, below); collections (four map axioms, five list axioms, four set axioms, as for maps, with concatenation defined on disjoint sets; none for a range map); function equations in priority form, one per clause with the clauses of a smaller priority that are not aside negated, which say nothing where no clause applies; rule axioms, the rules of a smaller priority negated, each under the premise that its right side is defined; and what the interpretation decides where the text is silent (ΓFallback: an interpreted symbol's value at its silent points and a function's rest where every clause fails, ⊥ where the interpretation gives none). The statements are about Γc: Γ, and, for a definition that reads a confined sort and whose Bool holds only its literals, the axiom that every element of Bool is true or false (Γcl). Γstep, the step's closure axiom (every successor of a configuration is one a rule gives), is no part of Γ and is stated beside it. And the denotation of a configuration"
file = "KcoreSpec/Faithful.lean, Kore/Translate.lean, Kore/Signature.lean, Kore/Gamma.lean"
