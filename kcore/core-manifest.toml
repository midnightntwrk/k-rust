id = "signature"
order = 2
status = "stable"
teaches = "a definition as a Lean value: sorts, constructors, subsorts, functions as clauses with priorities, rules with priorities, collections, overloading symbols (a symbol at larger sorts that agrees with constructors at smaller sorts on injected arguments)"
