# What kk.k reads of KCore's data, one row per constructor (or field) of KCore's Clause, Rule,
# Term and Lit types and of the KORE Pattern type its reader reads (kcore-spec: KcoreSpec/Core.lean,
# KcoreSpec/Parse.lean, KcoreSpec/Kore/Read.lean; Pattern from kore-lean's KoreParser/AST.lean, which
# KcoreSpec reads as Kore.Pattern). The rows indexed by an attribute stay with the catalogue's
# encoder, in krs/semantics/kore/COVERAGE.toml.
#
# status = "covered": kk.k (through the catalogue's encoder, krs/semantics/kore/tools/korek.py) reads
#          it; `rules` names the kk.k rules that read it and `cases` the catalogue's cases that
#          exercise it.
# status = "refused": KK.encDef (KcoreSpec/KKEncDef.lean) has no form for it; `bool` names the conjunct
#          of KK.encodable that fails where the reader puts it into a Semantics, or "reader" where
#          the reader refuses the form, so that no Semantics holds it and no conjunct is reached;
#          `note` says why.
# A covered row with `note` and no `rules` is one kk.k needs nothing of (`note` says why).
# A row is never blank. The rows of kcore-spec's rows.toml are the table [rows] below, which
# kk/coverage.py gen writes.

# --- Clause (a function equation) -----------------------------------------------------------

[[row]]
type = "Clause"
item = "vars"
status = "covered"
note = "a variable is written vr(i) and binds any value (m-var); kk.k needs no sort of it: on a well-sorted definition the value at a variable's position has its sort"

[[row]]
type = "Clause"
item = "pats"
status = "covered"
rules = ["try", "ms-cons", "m-var", "m-app", "m-inj-same", "m-inj-sub"]
cases = ["c01-fn-prio", "c06-nonlinear", "c24-map-fn-pattern"]

[[row]]
type = "Clause"
item = "req"
status = "covered"
rules = ["try-holds", "try-refuted"]
cases = ["c01-fn-prio", "c14-fn-undef-requires", "c48-fn-undef-requires-larger"]

[[row]]
type = "Clause"
item = "rhs"
status = "covered"
rules = ["try-holds", "result-some"]
cases = ["c01-fn-prio", "c07-strict-args"]

[[row]]
type = "Clause"
item = "prio"
status = "covered"
rules = ["cprio", "prio-given", "prio-owise", "ta-take", "ta-skip", "ncl-cons", "ei-next"]
cases = ["c01-fn-prio", "c45-fn-owise-recursion", "c48-fn-undef-requires-larger"]

[[row]]
type = "Clause"
item = "ens"
status = "covered"
rules = ["ev-en", "ensure-holds", "ensure-fails", "inst-en", "try-holds"]
cases = ["c50-fn-ensures", "c51-fn-ensures-owise"]
note = "the field REVIEW-FA D1 decides (not yet in kcore-merge's Core.lean, whose Clause has vars, pats, req, rhs, prio); encoded in the right side as en(R, E); mutation ensures-as-requires, killed by c51"

[[row]]
type = "Clause"
item = "opens"
status = "refused"
bool = "shapesOK"
note = "KK.shapesOK (KcoreSpec/KKStatements.lean) requires of every rule and clause opens = [], exs = [], pre and post \\top and, of a clause, not aside"

[[row]]
type = "Clause"
item = "exs"
status = "refused"
bool = "shapesOK"
note = "KK.shapesOK (KcoreSpec/KKStatements.lean) requires of every rule and clause opens = [], exs = [], pre and post \\top and, of a clause, not aside"

[[row]]
type = "Clause"
item = "pre"
status = "refused"
bool = "shapesOK"
note = "KK.shapesOK (KcoreSpec/KKStatements.lean) requires of every rule and clause opens = [], exs = [], pre and post \\top and, of a clause, not aside: cl holds one requires term"

[[row]]
type = "Clause"
item = "post"
status = "refused"
bool = "shapesOK"
note = "KK.shapesOK (KcoreSpec/KKStatements.lean) requires of every rule and clause opens = [], exs = [], pre and post \\top and, of a clause, not aside: cl holds the ensures as a term in en(R, E)"

[[row]]
type = "Clause"
item = "aside"
status = "refused"
bool = "shapesOK"
note = "KK.shapesOK (KcoreSpec/KKStatements.lean) requires of every rule and clause opens = [], exs = [], pre and post \\top and, of a clause, not aside"

# --- Rule (a rewrite rule) ------------------------------------------------------------------

[[row]]
type = "Rule"
item = "vars"
status = "covered"
note = "as Clause.vars: a variable is vr(i); kk.k needs no sort of it"

[[row]]
type = "Rule"
item = "lhs"
status = "covered"
rules = ["fire", "m-app", "m-var"]
cases = ["c02-rule-prio", "c15-nonlinear-rule", "c34-cells-several"]

[[row]]
type = "Rule"
item = "req"
status = "covered"
rules = ["fire-holds", "fire-refuted"]
cases = ["c02-rule-prio", "c09-undef-requires"]

[[row]]
type = "Rule"
item = "rhs"
status = "covered"
rules = ["fire-holds", "step-some"]
cases = ["c02-rule-prio", "c08-undef-rhs-blocks", "c47-undef-rhs-same-prio"]

[[row]]
type = "Rule"
item = "ens"
status = "covered"
rules = ["ev-en", "ensure-holds", "ensure-fails"]
cases = ["c43-ensures", "c44-ensures-priority"]

[[row]]
type = "Rule"
item = "prio"
status = "covered"
rules = ["rprio", "prio-given", "prio-owise", "fa-take", "fa-skip", "nrl-cons", "step-next"]
cases = ["c02-rule-prio", "c46-prio-nonterm-requires"]

[[row]]
type = "Rule"
item = "opens"
status = "refused"
bool = "shapesOK"
note = "KK.shapesOK (KcoreSpec/KKStatements.lean) requires of every rule and clause opens = [], exs = [], pre and post \\top and, of a clause, not aside"

[[row]]
type = "Rule"
item = "exs"
status = "refused"
bool = "shapesOK"
note = "KK.shapesOK (KcoreSpec/KKStatements.lean) requires of every rule and clause opens = [], exs = [], pre and post \\top and, of a clause, not aside"

[[row]]
type = "Rule"
item = "pre"
status = "refused"
bool = "shapesOK"
note = "KK.shapesOK (KcoreSpec/KKStatements.lean) requires of every rule and clause opens = [], exs = [], pre and post \\top and, of a clause, not aside: rl holds one requires term"

[[row]]
type = "Rule"
item = "post"
status = "refused"
bool = "shapesOK"
note = "KK.shapesOK (KcoreSpec/KKStatements.lean) requires of every rule and clause opens = [], exs = [], pre and post \\top and, of a clause, not aside: rl holds the ensures as a term in en(R, E)"

# --- Term -----------------------------------------------------------------------------------

[[row]]
type = "Term"
item = "var"
status = "covered"
rules = ["m-var", "bind-new", "bind-same", "bind-clash", "inst-var"]
cases = ["c06-nonlinear", "c15-nonlinear-rule"]

[[row]]
type = "Term"
item = "app"
status = "covered"
rules = ["ev-app", "apply-ctor", "apply-fn", "ev-hook", "ev-col", "m-app", "m-col"]
cases = ["c01-fn-prio", "c05-hooks", "c19-map-choice", "c22-map-hooks"]
note = "a constructor or function as ap, a hooked symbol of the listed hooks as hk, a collection symbol as cb; a parameter symbol (impl = none) and any other hook are refused by the encoder"

[[row]]
type = "Term"
item = "inj"
status = "covered"
rules = ["ev-inj", "inj-compose", "inj-new", "m-inj-same", "m-inj-sub", "leq-up"]
cases = ["c04-subsort", "c13-inj-bool"]

[[row]]
type = "Term"
item = "as"
status = "covered"
rules = ["m-as", "as-bind"]
cases = ["c40-as-patterns"]

[[row]]
type = "Term"
item = "dv"
status = "covered"
rules = ["ev-int", "ev-bool", "ev-tok", "m-int", "m-bool", "m-tok"]
cases = ["c05-hooks", "c16-bool-pattern", "c39-tokens-preds", "c49-string-bool-eq"]

# --- Lit (the literal of a Term.dv) ---------------------------------------------------------

[[row]]
type = "Lit"
item = "int"
status = "covered"
rules = ["ev-int", "m-int", "op-add"]
cases = ["c05-hooks", "c18-div-signs"]

[[row]]
type = "Lit"
item = "bool"
status = "covered"
rules = ["ev-bool", "m-bool", "op-and"]
cases = ["c05-hooks", "c16-bool-pattern"]

[[row]]
type = "Lit"
item = "tok"
status = "covered"
rules = ["ev-tok", "m-tok", "op-str-eq", "op-str-lt", "cmp-tok"]
cases = ["c39-tokens-preds", "c49-string-bool-eq"]

[[row]]
type = "Lit"
item = "float"
status = "refused"
bool = "litsOK"
note = "KK.litsOK refuses a definition whose signatures, collections or subsorts name Float, and KK.encLit has no form for a Float literal"

# --- Kore.Pattern (the KORE text the encoder reads) -----------------------------------------

[[row]]
type = "Pattern"
item = "var"
status = "covered"
rules = ["m-var", "inst-var"]
cases = ["c06-nonlinear"]

[[row]]
type = "Pattern"
item = "app"
status = "covered"
rules = ["ev-app", "m-app"]
cases = ["c01-fn-prio"]

[[row]]
type = "Pattern"
item = "string"
status = "covered"
rules = ["ev-tok", "m-tok"]
cases = ["c39-tokens-preds", "c49-string-bool-eq"]
note = "read as the text of a \\dv and as attribute arguments"

[[row]]
type = "Pattern"
item = "top"
status = "covered"
rules = ["try-holds", "fire-holds"]
cases = ["c01-fn-prio", "c02-rule-prio"]
note = "a \\top requires or ensures is read as none (requires bv(true), no en); \\top ends an equation's argument list"

[[row]]
type = "Pattern"
item = "bottom"
status = "covered"
rules = ["apply-bot", "hook-bot", "init-bot"]
cases = ["c12-undef-init"]
note = "\\bottom in a term is bot; the \\bottom inside an [owise] premise's \\or is not read"

[[row]]
type = "Pattern"
item = "not"
status = "covered"
rules = ["prio-owise"]
cases = ["c01-fn-prio", "c51-fn-ensures-owise"]
note = "only as the [owise] premise of an equation, which the encoder reads through the owise attribute, not by its text; elsewhere refused (a connective in a term)"

[[row]]
type = "Pattern"
item = "and"
status = "covered"
rules = ["m-as", "ev-en", "fire"]
cases = ["c40-as-patterns", "c43-ensures", "c50-fn-ensures"]
note = "\\and(P, V) in a left side is an as-pattern; \\and(lhs, req) and \\and(rhs, ens) are a rule's or an equation's structure"

[[row]]
type = "Pattern"
item = "or"
status = "refused"
bool = "shapesOK"
note = "the reader reads \\or into a predicate (Parse.condOf: Cond.or), which is a rule's or clause's pre or post other than \\top; rows.E4.\"tree:Pattern.or\" (fixture base, where no \\or is read into a predicate) is the row's computed entry"

[[row]]
type = "Pattern"
item = "implies"
status = "covered"
rules = ["try"]
cases = ["c01-fn-prio"]
note = "the shape of an equation axiom"

[[row]]
type = "Pattern"
item = "iff"
status = "refused"
bool = "reader"
note = "the reader refuses it (rows.toml E4 tree:Pattern.iff is refused), so no Semantics holds it and no conjunct of KK.encodable is reached"

[[row]]
type = "Pattern"
item = "exist"
status = "refused"
bool = "shapesOK"
note = "the reader reads \\exists into a rule's or clause's exs, or into a predicate (Cond.ex, Cond.exMatch); rows.E4.\"tree:Pattern.exist\" is the row's computed entry"

[[row]]
type = "Pattern"
item = "forall"
status = "covered"
note = "the reader reads it only in a requires or ensures of predicates, as the literal false (predicateAtBool), which kk.k writes bv(false); elsewhere the reader refuses it (rows.toml E4 tree:Pattern.forall); rows.E4.\"tree:Pattern.forall#cases[0]\" is the computed entry"

[[row]]
type = "Pattern"
item = "mu"
status = "refused"
bool = "reader"
note = "the reader refuses it (rows.toml E4 tree:Pattern.mu is refused), so no Semantics holds it and no conjunct of KK.encodable is reached"

[[row]]
type = "Pattern"
item = "nu"
status = "refused"
bool = "reader"
note = "the reader refuses it (rows.toml E4 tree:Pattern.nu is refused), so no Semantics holds it and no conjunct of KK.encodable is reached"

[[row]]
type = "Pattern"
item = "ceil"
status = "refused"
bool = "shapesOK"
note = "the reader reads \\ceil into a predicate (Parse.condOf: Cond.ceil); rows.E4.\"tree:Pattern.ceil\" and its cases are the row's computed entries"

[[row]]
type = "Pattern"
item = "floor"
status = "covered"
note = "the reader reads it only in a requires or ensures of predicates, as the literal false (predicateAtBool), which kk.k writes bv(false); elsewhere the reader refuses it (rows.toml E4 tree:Pattern.floor); rows.toml names no fixture of that case, so it has no computed entry"

[[row]]
type = "Pattern"
item = "equals"
status = "covered"
rules = ["try", "try-holds"]
cases = ["c01-fn-prio"]
note = "an equation's conclusion f(X) = rhs, and a requires or ensures R = true"

[[row]]
type = "Pattern"
item = "in"
status = "covered"
rules = ["try", "ms-cons"]
cases = ["c01-fn-prio"]
note = "an equation's argument patterns \\in(X0, P0)"

[[row]]
type = "Pattern"
item = "next"
status = "refused"
bool = "reader"
note = "the reader refuses it (rows.toml E4 tree:Pattern.next is refused), so no Semantics holds it and no conjunct of KK.encodable is reached"

[[row]]
type = "Pattern"
item = "rewrites"
status = "covered"
rules = ["fire", "succs"]
cases = ["c02-rule-prio"]
note = "the shape of a rule axiom"

[[row]]
type = "Pattern"
item = "dv"
status = "covered"
rules = ["ev-int", "ev-bool", "ev-tok"]
cases = ["c05-hooks", "c39-tokens-preds"]

[[row]]
type = "Pattern"
item = "leftAssoc"
status = "refused"
bool = "reader"
note = "the reader refuses it (rows.toml E4 tree:Pattern.leftAssoc is refused), so no Semantics holds it and no conjunct of KK.encodable is reached"

[[row]]
type = "Pattern"
item = "rightAssoc"
status = "refused"
bool = "reader"
note = "the reader refuses it (rows.toml E4 tree:Pattern.rightAssoc is refused), so no Semantics holds it and no conjunct of KK.encodable is reached"

# ---- generated by kk/coverage.py gen from rows.toml and `kcore encodable`; do not edit below ----
