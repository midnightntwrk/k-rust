# The pin of kk.k, the K text the statement kk_step is about (kk/compare.py checks kk_sha256).
#
# kk.k is krs/semantics/kore/kore.k of the k-rust commit `copied_at`, with a first line that says
# so. Its kompiled text is fixture kore-k's (test/constructs/fixtures/kore-k: kfix.py kompiles kk.k
# with --main-module KORE --syntax-module KORE-SYNTAX), whose kompile.txt records the SHA-256 of the
# kk.k it kompiled (its `external` line); kk/compare.py checks that it is kk_sha256. No hash of the
# kompiled text is pinned here: kompile's text of kk.k depends on the directory it is kompiled in
# (the order and numbering of the quantifiers it generates for the [owise] premises change with the
# path, also after kfix's normalisation and stripping), so a recorded hash holds in one tree only.
# `catalogue_compared` is the commit of the catalogue (krs/semantics/kore) kk/compare.py last ran
# against, with the result recorded in catalogue-differences.toml.
kk_sha256 = "44c41e1e1bcb659c5ff24906eda07e814bfb107ec1ccc9f40b45b4e871f7aa24"
copied_from = "krs/semantics/kore/kore.k"
copied_at = "e1e21f9055f9aabf50f2cad6ae670fff6e5de709"
kompiled_fixture = "kore-k"
catalogue_compared = "8b8a15424aa74fba8580f93d6baeaef07d928dd6"
#
# Final (R2-release.post-KK-pin, 2026-11-20): this is the pin DONE-0 C10 counts ("the pin moves once
# more, node KK-pin"); after it nothing edits kk.k. No commit of k-rust main up to `final_checked_at`
# changes krs/semantics/kore/kore.k after `copied_at`, and kk.k without its first line is that file,
# so post-KK-pin-text's steps were not repeated. At `final_checked_at` (the published build of
# main) the package examples/ref-kk regenerates identically from the pinned kompiled text and its
# User modules of the spike (examples/run.sh's ref-kk line) build. `catalogue_compared` is not part
# of the pin (compare.py's catalogue comparison lists differences, never failures) and was not rerun.
final = true
final_checked_at = "b6f026077ce011431d12de02d6d55721e9bd3961"
