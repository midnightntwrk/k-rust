# The leaf conjuncts of coreOK and the hypotheses FnDet, FnSolves, ClausePreDecided and
# ClausePostDecided, each with the witness module that shows it cannot be dropped (a semantics
# meeting the others whose Γ has no model), or `none` with the reason. A witness that is no library
# module is a test file with its theorems (`test/X.lean: thm, thm`). A row is witnessed or kept: a
# `none` row carries `ruling`, `kept: ` and why the conjunct is asked: the proofs that read it; or
# what implies it and the proof that reads it without that; or that no proof reads it and what it
# is kept for. Keys and texts are computed by test/Witnesses.lean from the definitions: coreOK,
# sortedOK, faithCoreOK, predsApart, idsOK, overloadsOK and itesApart are unfolded, `&&` is split,
# and List.all lambdas, single-alternative matches and lets are entered; Witnesses.lean fails when
# a leaf has no row or its text differs, and when a `none` row has no ruling. `evidence`: files
# with the kernel-checked part of a `none` row. `note`: what a witness shows, where it is less than
# every other conjunct of coreOK.

