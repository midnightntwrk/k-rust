# The leaf conjuncts of coreOK and the hypotheses FnDet and FnSolves, each with the witness module
# that shows it cannot be dropped (a semantics meeting the others whose Γ has no model), or `none`
# with the reason. Keys and texts are computed by test/Witnesses.lean from the definitions:
# coreOK, sortedOK, faithCoreOK, hooksApart, predsApart, idsOK, overloadsOK and itesApart are
# unfolded, `&&` is split, and List.all lambdas, single-alternative matches and lets are entered;
# Witnesses.lean fails when a leaf has no row or its text differs. `evidence`: files with the
# kernel-checked part of a `none` row. `note`: what a witness module shows, where it is less than
# every other conjunct of coreOK.

