# Row KORE in K, tied (DONE-0 C14 part 3 and closure (a); [goal] column "tied"): kore.k's text as
# kompile wrote it (examples/ref-kk/RefKk/definition.kore, the pinned text of kk/PIN.toml), user
# module KORE, 834 sentences. Per class of the account (test/TieKk.lean `classes`, `account`,
# `account_sizes`), in the order of `tieClasses`: its count, its direction, and how many of its
# sentences are kernel-checked on this text in that direction (`proved`), entailed at values for
# every H (`at_values`), entailed at values for every H meeting a named condition on H
# (`hypothesis`, the condition in `condition`), refuted (`refuted`) or without direction
# (`no_direction`, the side condition `absent_closed` checked); the rest is `remainder`, with its
# reason, and for it the reader and the hook interpretations are trusted. The theorems named are in
# `file` (kcore-spec-relative), or in FILE where a name is written FILE::NAME. Where a class names
# `indices`, those theorems state the list of the sentences it ties, and with `remainder_indices`
# they partition the class's list in test/TieKk.lean. test/kk-tie.sh checks this record by text
# against those files (test/imp-tie.sh's checks); test/kk-tie-atvalues.sh builds the generated
# package and checks the files that import it.

text = "examples/ref-kk/RefKk/definition.kore"
sentences = 834

[layer1]
file = "test/TieKk.lean"
theorems = ["userAxioms_eq", "userAxioms_length", "indices_eq", "account", "account_sizes",
  "account_classes", "account_absent", "absent_closed", "absent_proj_below"]
core_file = "examples/ref-kk/RefKk/CoreOK.lean"
core_theorems = ["coreOK_defn"]
attrs_file = "test/TieKkAttrs.lean"
attrs_theorems = ["attrs_ctors", "attrs_fns", "attrs_hooks", "attrs_colls", "attrs_prios", "attrs_agree"]
sig_file = "test/TieKkSig.lean"
sig_theorems = ["sig_origin", "sig_sizes"]
registry_file = "test/TieKkRegistry.lean"
registry_theorems = ["registry_detached", "registry_names_detached", "surplus_registry", "kk_registry_everyH"]
note = "the package is generated with --core: coreOK_defn (decided in the kernel), not wf; the registry family's guard detachedB is decided on the text (registry_detached), and kk_registry_everyH gives the family's conservativity at every H meeting FnHyp"

# Row 19: the declarations, which are not sentences of the account.
[declarations]
file = "test/TieKkDecls.lean"
theorems = ["decl_lengths", "decl_params", "sorts_in_sig", "syms_in_sig", "noSym_count", "decls_entailed", "lib_decls_entailed"]
sorts = 33
symbols = 311
proved = 281
note = "the item of each of the 32 sort declarations without sort parameters and of the 249 symbol declarations without sort parameters of a symbol Gamma has is one of sigItems c, so Gamma entails it for every H; the other 63 have no direction: SortMInt{Width}, the 5 symbol declarations with sort parameters (inj, List:getMInt, List:setMInt, ite, sizeMInt) and 57 of symbols Gamma does not have"

# Consistent at one H only: an entailment for every H counts at it (closure (a)).
[consistent]
file = "examples/ref-kk/User/Consistent.lean"
theorems = ["consistent"]
pinned = "test/PinsKk.lean"
reached = "Consistent (defn.sem.withHooks HookParams.none) is kernel-checked (KK.consistent, by consistent_of: coreOK, FnDet, FnSolves, ClausePreDecided, OpenLaws at HookParams.none), at no other H; FnHyp at every H rests on the 17 facts the package names, the termination of 14 functions and the agreement of 3 (RefKk.namedFacts; RefKk.fnHyp_withHooks_defn under OblH H). So the classes tied for every H count at HookParams.none. The 5 sentences tied under libAdmitted (202, 321, 341 of hooked functional, 795, 802 of library) are tied at HookParams.lib (funS_lib, ev795_lib, ev802_lib), where Consistent is not proved; at HookParams.none, where it is, the three functional sentences of countAllOccurrences, replaceAll and substrString ask a value at the symbols' silent points, where Gamma (cH HookParams.none) gives none"

