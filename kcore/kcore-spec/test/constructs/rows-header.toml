# The construct table of DONE-0 C1 and C2: one row per key of the eight lists E1 to E8 that
# test/constructs/extract.sh writes from K 7.1.337. test/constructs.sh fails unless each list's
# keys here are exactly the extracted ones. The table [C3] beside them is DONE-0 C3's: one entry per
# unordered pair of meaning-carrying modifiers, keyed "A x B", with the fields of a row (status, or
# `independent` with `declarations`, the two declarations that read A and B), `core = true` on the
# pairs DONE-0 C3 names, which are never independent and each have a fixture; checked by
# test/constructs/modifiers.py check, which also checks the sentences of its `cases`.
# modifiers.py run computes which fixtures differ from their companions (same_as, differs_from) in
# the user module's sentences or in a field of Fn, Clause or Rule (`kcore sem-fields`), and prints
# each text difference with no Semantics difference.
#
# A row: status, evidence, and optionally note, kimp, kore; a row of E1, E2, E3, E7, E8 also
# fixture and either sentence or no_sentence, and optionally fixture_note.
#   status    supported | parameter | inert | erased | refused | pending-fixture | not-handled.
#             `not-handled` means that no recorded place gives the row a status; TRIAGE decides it.
#             `pending-fixture`: TRIAGE leaves the row undecided until a fixture is made; `triage`
#             names the entry and `pending` quotes why.
#   evidence  the place that gives the status: findings/K-coverage.md's row (measured at
#             kcore-reader 57f851ec, carried where its dated note records no change), or the library
#             at this tree (FixedSignature.regHookNames, BuiltinData.modules, Builtins.libParams).
#             It is the status's source, not yet DONE-0 C2's evidence (fixtures, theorems).
#   kimp      the construct occurs in kimp (imp-semantics src/kimp/kdist/imp-semantics imp.k, calc.k,
#             expr.k; for E4 and E6, its kompiled text f2-examples/ref-kimp.kore): true / false.
#   kore      the same for kcore-spec's kk/kk.k (K sources for the K-level lists; for E4 and E6
#             its kompiled text, fixture kore-k, through extract.sh's uses-kore.E4 / uses-kore.E6).
#             kimp / kore absent: not checked for that row. The checks are textual (seed-rows.py):
#             a keyword, attribute or terminal found in the text, not a parse of it.
#             An E2 row of the classes rule, equation, simplification is marked from K's `rule`
#             sentences, which the check does not tell apart: all three or none.
#   fixture   a directory of test/constructs/fixtures/: a K text, kompile's report (kompile.txt), the
#             sentences the text adds to an empty module (kore.txt) and `kcore account` of the text
#             (account.txt); test/constructs/kfix.py says how they are written. "none": no fixture,
#             the reason names a place in K's sources.
#   sentence  substrings of the fixture's kore.txt (or kompile.txt) that locate the sentences
#             carrying the row (kfix.py check finds each).
#   no_sentence  "CLASS: reason" when no sentence of a kompiled text carries the row: erased (the
#             fixture equals its same_as pair), rejected (kompile's error is the fixture), or the
#             class the reason names.
#   fixture_note  what the fixture shows beyond its sentences. These fields are evidence for TRIAGE,
#             not a status.
#   notes     on a row or a `cases` entry of any list: a table from a constructor of
#             Parse.ReadingNote to a fixture directory whose account.txt prints the note (a read
#             class, a per-sentence reading, or a count above 0); kfix.py check fails unless each
#             is so and every constructor is named once at least.
#   kk, kk_sha  on a row or a `cases` entry of any list: kk the Kore-in-K entries (ids of
#             krs/semantics/kore/texts or cases, findings/KK-redesign.md section 5.2) whose reading the
#             row rests on, and kk_sha a table from each id to the entry's ruling hash when the row was
#             written (krs/semantics/kore/tools/check.py --ruling-sha ID). test/constructs/kklink.py
#             fails on an id that names no entry and reports a row whose hash is not current as stale.
#   reasons   on a row or a nested table (cases, also_refused, split) of any list: a list of
#             "RefusalReason.x", "InertReason.x", "UnreadReason.x" or "ReadingNote.x", constructors
#             of the four inductives of KcoreSpec/Parse.lean: what the reader answers on the
#             entry's construct. For an entry with no fixture of its own (the rows of E4, E5, E6);
#             an entry with a fixture names what its account.txt prints. test/constructs/closed.py
#             fails on a name that is no constructor, on a refused entry of E4, E5 or E6 with
#             neither a fixture nor reasons, and on a name that no account.txt of the fixtures the
#             entry's evidence names (`fixtures/NAME`, `FX/NAME`, `fixture NAME` in evidence,
#             reader_today, refused_by, place or note) prints, outside its pinned allowance.
#             The item "none (scope): option" names no constructor: on an E8 option row of class R-b
#             or scope, the option (the row's key) is outside R-12's option set (`kompile --backend
#             haskell`), which refuses the row whatever the reader answers on the text the option
#             gives; test/constructs/rest.py accepts it in place of a RefusalReason where a fixture
#             of the entry has kompile.txt's command passing the option outside that set.
# First written by test/constructs/seed-rows.py (its docstring states how each status was carried).
# Then test/constructs/apply-triage.py applies findings/TRIAGE-*.toml, copying each decision's fields
# as written (names made one vocabulary; its docstring gives the renaming). Fields it adds:
#   triage    the TRIAGE entry that decides the row (file and table).
#   reason, reversal  the decision's reason and its reversal criterion.
#   class     for refused: R-a (outside the fragment by a recorded decision), R-b (a quoted passage of
#             K's documentation or of the KORE syntax document puts the form outside the language),
#             R-c (the kernel has no notion for it), or scope (nothing excludes the form, but no
#             text in scope holds it; fields place, reversal, shape or meaning, below); DONE-0 C2,
#             findings/EX-KPROV-decision.md D5-D8. A `cases` entry (or a table of also_refused,
#             split) carrying class is checked as a row is.
#   cone      the cone declaration that changes (R-c; supported needing one), or "none ..." as TRIAGE
#             writes it ("none (reader only)", "none (reader already reads it)").
#   evidence  the decision's evidence where it gives one; evidence_seed then keeps the earlier one.
#   notion, place, refused_by, reader, reader_today, reader_does_it, reader_reason, inert_class,
#   confidence, settle, decided  the decision's fields of those names (confidence: TRIAGE-A's
#             `confidence`, TRIAGE-B's `sure`).
#   also_refused, in_simplification, elsewhere, split, cases  shapes of the row whose status differs
#             from the row's (DONE-0 C2 (b)); `cases` a list of tables with case and status.
#   was       the status recorded before TRIAGE, where TRIAGE changes or questions it.
#   triage_note  the decision's notes, caveats and todos, as a list.
#   pending   for pending-fixture: TRIAGE's `why`.
#   planned   for class R-c: the lane of designs/CN-3-merged-constructs.md section 4 that supports it
#             before R2 (owner, 2026-11-15: every R-c row is supported before R2).
#   planned_refused  the shape of the row CN-3 section 5 keeps refused, with its reason.
#   also_planned  for a row of another status: the CN-3 lane of an R-c (or undecided) shape inside it.
# Field of the work plan (test/constructs/units.py, run by test/constructs.sh):
#   unit      for a row of status refused and for a row of class R-c (on a row of another status,
#             optional and checked the same way): the id of the ticket (`[ticket."ID"]` of
#             progress/tickets-*.toml) or of the unit (`[unit]` of progress/units.toml; the main
#             checkout's progress/ where the tree has none) that supports
#             the row or the refused shape; for a row not of class R-c that no ticket supports, one
#             of these, the word in parentheses the entry's own class:
#               "none (R-a)", optionally followed by ": " and the reason;
#               "none (R-b): shape at <list> <row key>[, case <name>]" (a passage of K's
#                 documentation; the row that decides the KORE shape the form would be) or
#               "none (R-b): no shape (ill-formed)" (a passage of the KORE syntax document);
#               "none (scope): rejected", "none (scope): never written", "none (scope): option" or
#               "none (scope): not delivered".
#             A class R-c row always names a ticket or unit. units.py walks the rows and the tables
#             nested in them (cases, also_refused, split), and fails on an entry without it, an id of
#             neither file, another form, a class the unit does not name, or a `shape at` key that
#             is no key of the list.
# Grounds of a scope entry: rejected (kompile writes no definition for the K text), never written
#   (no emit site writes the KORE form), option (only an option value outside R-12 produces it), and
#   not delivered (KPROV-reopen-decision R2): a sentence kompile's frontend wrote and its validation
#   step refused; the text exists, but the command delivers no definition, so no kompiled definition
#   carries the sentence, and the reader's verdict is on a hand-written KORE text holding it.
# Fields of a scope entry (EX-KPROV-decision D6, KPROV-reopen-decision R2; units.py checks each by
# the ground):
#   place     "DONE-0 R-10" (rejected, not delivered), "DONE-0 R-1" (never written), "DONE-0 R-12"
#             (option).
#   reversal  the event that ends the scope.
#   shape     rejected and option: "<list> <row key>[, case <name>]", the row that decides the KORE
#             shape the form would be, or "none: <emitter file>:<lines>: <what the site shows>".
#   meaning   never written: "<path>:<line>: \"<passage>\"", the passage of the KORE syntax document
#             that gives the form a meaning.
#   refused_by  "kompile" (rejected); the reason the reader prints on the form (never written, not
#             delivered).
#   evidence  rejected: kompile.txt's exit and error; never written: the emitter's sites, the corpus
#             count and a hand-written KORE fixture's account line; option: the command; not
#             delivered: "fixtures/<dir>/kompile.txt: exit <n>, <validator> <version> <error class>
#             at <location>: <the sentence>" and the hand-written fixture's account line
#             ("fixtures/<dir>/account.txt: ...").
# Field of DONE-0 C7 (checked by test/provenance.sh), on a row or a nested table:
#   derived   the row's evidence theorems, a list of tables: form ("a", "b", "c" or "r": a Lean
#             proof from the translated text, a derivation written by hand, the pair of models
#             showing the text entails no value, or a Lean proof that the text's sentences have no
#             model), for form (a) kind ("from sentences", "through the reading" or "in a model"; the
#             second with family, the family it goes through; the third for sentences of the
#             no-direction class, `no_direction` below: the theorem states, for every H, an
#             interpretation that satisfies the theory, whose steps are Step's, in which those
#             sentences hold at values) and sentences (the indices of the sentences that
#             determine it), theorem (full name) and file (relative to kcore-spec) for forms (a), (c)
#             and (r), derivation (a file) for form (b). The theorem's statement mentions H (a name of
#             type HookParams) and no AtNone file or namespace holds it.
#             Form (r), for a text without a model (it is not a substitute for (a) where a model
#             exists): theorem states, for every H, that the premise set form (a) would use (each
#             sentence as written where its class is E by equality, Γ's item with its W1 theorem
#             otherwise, the named families) has no model; sentences the indices of the sentences
#             the refutation uses; family (required) the families of the reading it uses beside them,
#             each named, so that it is not read as "from sentences alone"; kind optional, "through
#             the reading" where only the reading's theory is refuted (the sentence-level statement
#             then owed, named in the row); owed_refuted optional, the full name of a theorem of the
#             same file refuting the fact the package names as owed (stated for every H). The
#             entry's status stays the reading's (`supported` where the reading agrees with the
#             text that it has no model); K-coverage.md prints "(no model)" beside it and lists
#             such entries with their fixtures. An owed_refuted is the state "refuted" of an owed fact
#             (owed_state below, one rule for both): it puts the entry in the group false unless
#             another of its owed facts is proved or open, K-coverage.md prints the group beside the
#             status and lists the entry with the refuted owed facts.
# Fields of DONE-0 C2's evidence (test/constructs/rest.py, whose docstring gives each form's items):
#   tie       on a row or a nested table: the C14 tie modules of the entry's fixture, a list of
#             files test/X.lean that test/integration.sh builds.
#   tie_theorems  the theorems of those modules the entry rests on (C14's statement for its class,
#             the tie of its sentence), full names, each declared in a file of `tie`; with the
#             `theorem` of each `derived` table, the theorems the entry names.
#   node_sentence  on a supported E4 or E5 row or `cases` entry whose node is a sentence kore.txt
#             leaves out (a builtin file's sentence, whose Source is K's): a substring of the first
#             line of that sentence in the fixture's kompiled definition (the text kompile.txt's
#             `definition.kore sha256` names, read from kfix.py's cache). The node check (e4e5.py
#             check, rest.py's item node) then parses that definition and requires the sentence
#             the string locates to hold the row's node, instead of looking in kore.txt; absent,
#             the node is looked up in kore.txt (or the `kore` fixture's text). Only an entry whose
#             sentence kore.txt leaves out carries it: every kompiled definition holds the library's
#             sentences, so the definition alone would hold most nodes on any fixture.
#   inert_class  for inert: the constructor of InertReason (KcoreSpec/Parse.lean) its sentence is
#             classed under, or "use" (DONE-0 C1's class use, with `reason` C1's reason).
#   no_direction  on a supported row or nested table: the indices (AxiomDecl.index, the numbering of
#             the tie's classes) of the entry's sentences that are of the no-direction class of its
#             fixture's tie (owed-sentence rule item 7). The class is read from the tie's `classes`
#             (the file of tie that reads f2-examples/FIXTURE.kompile.kore), never from whether a
#             sentence applies a symbol. rest.py accepts such an entry only where tie_theorems names
#             that file's account, account_absent and absent_closed, every index is in its
#             no-direction class, every sentence `sentence` locates there is listed, and a `derived`
#             table of form (a), kind "in a model", has exactly these indices as its sentences; it
#             refuses a supported entry of which a sentence `sentence` locates is of that class and
#             that has no such field and table. A declaration is no axiom and has no class: a
#             `sentence` locating no axiom counts neither way; one not in the tie's text is refused
#             (its class is not read).
#   For erased, the forms of findings/work/decision-fixrest-erased-forms.md section 2, at least one,
#   each checked (kfix.py check, rest.py; K-coverage.md prints their letters beside the status):
#   pair      P: the fixture (or a list of them, each checked) whose kompile.txt records the entry's
#             `same_as OTHER: equal after stripping` (without it, the first of the entry's fixtures
#             recording one).
#   absent    S: a pattern, or a list of them, that no attribute list of a kompiled text in scope
#             (every fixture's kompiled text and the corpus of the reference cache, parsed by `kcore
#             sentence-heads`) matches: "[KIND ]attribute HEAD[ without OTHER]" (HEAD as KORE writes
#             it, OTHER a head the list does not have; KIND a sentence keyword, or module, definition), "source FILE A-B" (a sentence whose Source is
#             K's builtin FILE and whose Location starts at a line from A to B), "module other than
#             M1, M2, ... and the main module". Admitted only where no pair exists.
#   other_file, witness  O: the sibling file of definition.kore (syntaxDefinition.kore, macros.kore)
#             whose lines the entry's fixture keeps in other.txt (fixture.toml other_file), and the
#             strings that occur there and in no sentence of the fixture's definition.kore.
#   carried_by  C: "<list> <row key>", a row that is not erased, has its own evidence and whose
#             fixture holds the entry's `sentence`.
#   A parameter entry's param_undetermined instance is a `derived` table of form (c); a supported
#   hook's in-domain value a `derived` table of form (a). A parameter entry whose fixture's text has
#   no model has no such instance: a `derived` table of form (r) stands in its place, and rest.py
#   counts the entry apart (form "parameter (no model)").
#   A supported table nested in an E6 `hook:` row whose fixture's reading takes the row's symbol for a
#   symbol of the text (its params.txt lists no parameter implemented by the symbol) is not the hook:
#   its evidence is a supported K-level row's (fixture, clean account, tie, theorems; rest.py).
#   inert_class "use" holds DONE-0 C1's content only: proof tasks, solver encodings, parsing and
#             unparsing of programs (a use of a definition, not part of its meaning); rest.py refuses
#             it on an entry whose fixture differs from a companion (fixture.toml differs_from) or that
#             has attr_pairs. inert_class "attribute": an attribute of a read sentence or declaration to
#             which K gives no meaning; its evidence (rest.py) is the tie of the fixture's own text (a
#             file of `tie` other than test/InertSemPairs.lean that reads f2-examples/FIXTURE.kompile.kore, or a
#             text f2-examples/*.kore byte for byte the one the fixture's kompile.txt records, its paths
#             restored as tiegen writes it),
#             KCore.InertSemPairs.trS_attrs among tie_theorems, the fields below, and `reason` saying
#             why K gives the attribute no meaning.
#   attribute the attribute's head as KORE writes it (UNIQUE'Unds'ID, cool-like, unit).
#   attr_pairs  pairs [TEXT, COMPANION] of texts f2-examples/*.kore that differ and are equal once
#             every attribute of that head is removed (and kfix.py's stripped applied to both).
#   reader_tests  theorems that test the reader on the entry (a pair's sem_eq: the reader builds one
#             semantics from both texts); evidence of nothing about the text, never counted as such.
#   removed   on a row whose option removes sentences of a reference text: per sentence (its index,
#             counted from 1 over the reference text's axioms as AxiomDecl.index counts them, of a
#             sentence of its user module), its tie class and direction there, the theorem and its
#             companion, and the file. rest.py checks it against f2-examples/REFERENCE.kompile.kore
#             (the fixture's differs_from) and the fixture's own text: each sentence is in the
#             reference and absent from the fixture's text, every axiom of the reference the
#             fixture's text lacks is listed, and the theorems are declared in a file reading the
#             reference.
# Field of an owed CondDecided (checked by test/constructs/rest.py check; DONE-0 C2, C7):
#   owed_state  on a row or a nested table: a table from a fixture directory to the state of the
#             CondDecided its account.txt prints as owed (`CondDecided open, over V`, for each clause
#             and rule the account lists under "clauses whose CondDecided is owed" and "rules whose
#             CondDecided is owed"), one string:
#               "proved: THEOREM[ (FILE)]"   a theorem proving the CondDecided of every clause and
#                                            rule the account lists (OpenDecided, or the clauses'
#                                            hypothesis where only clauses are listed);
#               "refuted: THEOREM[ (FILE)]"  a theorem refuting the CondDecided of one of them;
#               "open: REASON"               neither is shown; REASON says why and what is known.
#             THEOREM a full name declared in FILE, a test/X.lean that test/integration.sh builds,
#             or, without FILE, in a file of the entry's `tie`. It is stated of the semantics the
#             reader builds from that fixture's own text (the fact the account lists, the package's
#             `Owed`), not of another text, however close: a fixture whose text equals another's after
#             stripping is open until a theorem is stated on its text. Required keys: each fixture
#             of the entry (`fixture`, `also_fixtures`) whose account prints `CondDecided open`;
#             other keys: a fixture whose account prints it and that the entry's text (evidence,
#             reader_today, refused_by, place, note, reading, no_sentence, reason) names, a companion
#             the entry's status rests on; and a fixture the entry's text names whose account prints
#             no `CondDecided open` and whose state is "proved: THEOREM (FILE)" with THEOREM stated
#             as a MatchIndependent (the owed fact of a clause, `matchObligationsL`) and every text
#             FILE reads that fixture's (its kompiled text: f2-examples/FIXTURE.kompile.kore, or a
#             text whose declarations carry the Source of fixtures/FIXTURE's own .k file), a
#             companion of the same shape whose owed fact is proved. Any other key whose account
#             prints no `CondDecided open` fails, and so does a fixture printing it that no entry keys.
#             The entry's status stays the reading's: the account refuses nothing for the fact
#             (CondDecided is Witnessed or Refuted, which no terminating check decides in general),
#             so a false owed fact is no refusal and no class. Where it is false, the headline
#             statements, whose hypothesis FnHyp holds OpenDecided, state nothing of Step at that
#             text; the fixture is a recorded limit of the hypothesis, not the evidence of the status
#             under them.
#             An entry is grouped by its best fixture: proved where one of its states is proved, else
#             open where one is open, else false (an owed_refuted is a false state). An entry none of
#             whose states is proved names, as a further key, a fixture of the same shape whose fact
#             is proved (a companion its text names, with the theorem), or one of its states ends
#             "; no fixture of this shape has it proved: REASON", REASON saying why none exists;
#             rest.py check fails on an entry with neither, and on that ending beside a proved state
#             (it reads owed_state: an entry whose only owed fact is an owed_refuted is grouped false
#             and not checked).
#             K-coverage.md prints "(owed fact proved)", "(owed fact open)" or "(owed fact false)",
#             the entry's group, beside the status, counts the entries by group, names apart the
#             supported entries of the group proved (those counted as supported under the headline
#             statements; the groups open and false are counted apart), and lists every false or open
#             owed fact with its fixture and its entry's group: a fixture with a false owed fact is a
#             recorded limit of the hypothesis.
# The rule for a sentence of the text that the reader does not put in Γ (decision owed-sentence,
# findings/work/review-no-fable-window.md section 15 items 1 to 5; DONE-0 C2, C6, C8, C14):
#   1. it is owed: entailed by Γ (the inert lemma classes, C14 direction entailed or at values; for a
#      lemma of a user's file that applies no parameter symbol without impl, the classes user lemma,
#      direction entailed, and user lemma at values, direction at values) or a
#      hypothesis on the definition (FnHyp for a functional sentence, FnLaws for a function's law,
#      and, for a lemma that applies a parameter symbol without impl (class parameter lemma), one H
#      that meets FnObligations and at which each sentence of the class holds at values,
#      EntailsAtValues (c.withHooks H) s (tr s), Γ giving a parameter's graph at values only;
#      direction hypothesis);
#   2. the reader neither claims it true nor refuses it for being false (in general it can decide
#      neither); the account's word for it is "owed";
#   3. a user's sentence that applies no symbol whose value H gives is proved for every H, at every
#      valuation (class user lemma) or, where it rests on an interpreted symbol's graph, at the
#      valuations sending its variables to values (class user lemma at values), or Γ with it has no
#      model and the text is not tied; one that applies a parameter without impl is a
#      hypothesis on H (class parameter lemma), and the tie shows an H at which the text's hypotheses
#      hold. Only trusted base (4)'s refuted library sentences are recorded instead of failing;
#   4. a row's status is shown on a fixture where the owed sentence holds; a fixture where it fails is
#      a test of the check (DONE-0 C8), named so (note, reader_tests), never the row's evidence and
#      never a reason for not-handled;
#   5. sem_eq with a companion text is a reader test (reader_tests), evidence of nothing about the text.
#   7. (findings/work/decision-dec4.md section 5 as amended by findings/work/decision-nodir-applied.md
#      section 5 and findings/work/decision-lacked-projection.md section 5; Kore-in-K entry
#      t231-generated-symbol-definition) A sentence that applies a symbol Γ does not have is not owed:
#      it defines that symbol and no statement of Γ is it. Its class is no direction; the tie on the
#      text states which sentences those are (`account_absent`) and that no sentence with a direction
#      applies such a symbol (`absent_closed`). Which generated symbols Γ lacks is the reader's
#      numbering, not whether a sentence applies them: the counter's getter, and an initializer of the
#      top cell tree that no user sentence and no equation of a function of Γ applies. A projection is
#      lacked where no user sentence and no equation of a function of Γ applies it. Every other
#      generated function with an equation (an initializer of a cell below a cell collection) is Γ's
#      with the text's equation, applied or not, and is not under this item. The defining equation's
#      right side may apply Γ's symbols, its functions included: it gives the lacked symbol's value
#      from theirs. Where the left side is at a constructor pattern (a projection's
#      kseq(inj{X,KItem}(K), dotk), the getter's top cell), the equation also states that the pattern
#      builds no element at two values of its variables. Γ entails that from Cons-Fun and Cons-Inj of
#      the pattern's generators (kseq, inj{X,KItem}, the top cell's constructor), so it is not owed
#      either. For a projection this holds where its sort X is K, KItem or below KItem in Γ, which
#      the tie on the text decides for each projection the no-direction class defines
#      (`absent_proj_below`: `GenEqs.projBelowB` of each such X, whence `GenEqs.projSel_fun` and
#      `GenEqs.projSel_inj`, the pattern functional and injective on X in every model of Γ). A
#      `functional` axiom of the lacked symbol states with the equation that this right side is
#      defined; the account takes it only where that follows from Γ's constructors and total
#      interpreted symbols and from the `functional` axioms of the initializers below, and refuses it
#      otherwise (`initFunctionalOK`). A supported row whose sentence it is also names a model of Γ
#      with `Step`'s steps in which the text's sentences of those symbols hold together at values
#      (DONE-0 C2's floor; field no_direction, a `derived` table of kind "in a model"). Where no such
#      model exists the sentences contradict Γ or one another: the text is not tied.
#   7, library parameters (findings/work/decision-lib-param-unapplied.md). Γ also lacks a parameter
#      symbol of an imported module that no rule and no function clause of the reading applies. Such
#      a symbol is a function or hooked symbol of the library that no registry hook interprets
#      (`Builtins.libParams`); for the use test see `Parse.usedLibParams`. A library equation or
#      lemma is not such a use. Its declaration, its `functional` axiom, and every sentence of the
#      text that applies it are of the no-direction class and are not owed.
