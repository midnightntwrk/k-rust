[mutant."hook-equation-owed"]
summary = "a user's equation of a symbol whose value the registry gives is refused again (regLemmaEqn false): hookEquation"
breaks = "the owed reading of the equation (Parse.regLemmaEqn): plus(X, 0) => X of a symbol hooked to INT.add is a user's sentence about values the registry gives, which the reader leaves out of Γ, neither claiming it true nor refusing it for being false, and the account lists it owed at values (user lemma at values); refused, the text is not read"
row = 'C3 hook x equation'
fixture = "c3-hook-eq"
expect = "killed"
killed_by = "not run yet (expected: account, the line `1 user lemma at values [user]` gone and the stage refusal `1 hookEquation` back on c3-hook-eq)"
patch = '''
--- a/KcoreSpec/Parse.lean
+++ b/KcoreSpec/Parse.lean
@@ -5594,3 +5594,3 @@
 def regLemmaEqn (S : Scan) (e : RawEqn) : Bool :=
-  !e.dom && !hasAttr e.attrs "symbol-overload" && isUserSource e.attrs &&
+  false && !e.dom && !hasAttr e.attrs "symbol-overload" && isUserSource e.attrs &&
     (regSymNames.contains e.fn || (eqnHookedHead? S e).any (fun h => (attrStr? h.attributes "hook").isSome))
'''

