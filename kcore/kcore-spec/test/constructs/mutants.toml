# Reader mutants (DONE-0 C8 part 1): each a named change of the reader, as a patch, run by
# test/mutants.sh on its row's fixture. A mutant is killed when, built natively in a scratch copy,
# its account of the fixture's text differs from the reader's, or the row's theorem module, checked
# against the text as the mutant reads it, fails (the failing declarations are recorded).
#
# [mutant."NAME"]
#   summary   what the mutant reads differently
#   breaks    the reading it breaks, and what that reading states
#   row       the rows.toml entry it is a mutant of: "<list> <row key>"
#   fixture   a directory of test/constructs/fixtures/ (its account.txt is the reader's account,
#             its kompiled text read from kfix.py's cache), or a KORE text relative to kcore-spec
#             (the reader's account is computed with this tree's kcore)
#   theorems  the row's theorem module, a Lean file relative to kcore-spec that reads the fixture's
#             text at elaboration (`definition_of`); checked when the account does not change
#   expect    "killed" (the run fails otherwise) or "survives", with `why` (an equivalent mutant)
#   patch     a unified diff, paths relative to kcore-spec (a/..., b/...), applied with `patch -p1`;
#             it may change the reader's sources only (KcoreSpec/Parse*.lean, KcoreSpec/Account.lean,
#             KcoreSpec/ReadFns.lean, KcoreSpec/Kore/Read.lean)
#   killed_by what the last run recorded: "account" or "theorems: <declaration>, ..." (written by
#             hand from test/mutants.sh's output; the run does not compare it)

[mutant."ensures-as-requires"]
summary = "an equation's ensures is read as a conjunct of its requires: the clause applies only where the ensures is true, and where it is not the next clause, or the function's rest, decides"
breaks = "Clause.ens: an equation f(X) = t ∧ (C = true) states that f(X) is t where C is true and has no value where it is not (Eval.ensFails); read into the requires, f(X) is the interpretation's value there"
row = 'E3 REQUIRES-ENSURES:#RuleContent::=#RuleBody "ensures" Bool'
fixture = "f2-examples/ens.kompile.kore"
theorems = "test/TieEns.lean"
expect = "killed"
killed_by = "theorems: fn_shape, half_neg4, run_stuck (test/TieEns.lean; the account of the text unchanged; 2026-11-18)"
patch = '''
--- a/KcoreSpec/Parse.lean
+++ b/KcoreSpec/Parse.lean
@@ -2281,7 +2281,7 @@
   -- a `non-executable` equation: a clause that no `[owise]` premise negates (`Clause.aside`)
   let aside := nonExec e
   match excl with
-  | none => pure ({ vars := ← varSorts N vs, pats, req, rhs, ens, prio, aside },
+  | none => pure ({ vars := ← varSorts N vs, pats, req := conjTerms (req.toList ++ ens.toList), rhs, ens := none, prio, aside },
       ⟨vs.map (·.name), m, vs.map (·.name), attrStr? e.attrs "label", srcOver msrc e.attrs, explicit.isSome⟩)
   | some ex =>
     let (bs, body) := binders eqnFuel ex
'''
