# Reader mutants of the constructors named by the entries of E1, E2 and E3's #Exists row that
# test/constructs/rest.py `core` holds: each a change of one reader line, the line that gives the
# constructor or decides the reading it names (for Account.unconsumed also the same line of
# unconsumedIdx, the form the compiled code runs), on a fixture whose account names the
# constructor. No reader mutant is given for ruleRightDefined (its premise ⌈rhs ∧ ens⌉ is Γ's,
# Faithful.prioRuleK) or
# overloadFunction (the restriction to uncovered arguments is Γ's, KoreAML.Cons.funUncItem,
# injUncItem, distUncItem): a change of the reader cannot reach either. manyValuedRightSide's
# mutant is at manyValued?'s \not arm: no fixture and no f2-examples text reaches its \exists
# sites (Parse.ceRead's hasExists and orManyValued? checks, Parse.exRead's alternative count and
# boundByArgs, manyValued?'s \exists arm), so a mutant there survives on every text.

