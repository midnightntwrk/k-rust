fixture = "c3-eq-req-prio-comp"
theorems = "test/C3EqReqPrioComp.lean"
expect = "killed"
killed_by = "account: the line `function equations read with the premise that no clause of a smaller priority applies (equationPriority): 1` gone, agree_named `0:` becomes `1: f` (c3-eq-req-prio-comp; 2026-11-18)"
patch = '''
--- a/KcoreSpec/Parse.lean
+++ b/KcoreSpec/Parse.lean
@@ -2304,6 +2304,7 @@
       pure (rhs, if cs.isEmpty then ens else conjTerms (ens.toList ++ cs), vs)
   let m ← need (eqnInfo? e.attrs) .sentenceInfo
   let (explicit, prio) := eqnPrio e
+  let prio := if req.isSome && explicit.isSome then 50 else prio
   -- a `non-executable` equation: a clause that no `[owise]` premise negates (`Clause.aside`)
   let aside := nonExec e
   match excl with
'''

