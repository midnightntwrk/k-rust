fixture = "c3-hook-eq"
expect = "killed"
killed_by = "account: the stage refusal `1 hookEquation` gone (c3-hook-eq; 2026-11-18)"
patch = '''
--- a/KcoreSpec/Parse.lean
+++ b/KcoreSpec/Parse.lean
@@ -4124,7 +4124,7 @@
         if (attrStr? h.attributes "hook").isNone then "without a hook attribute"
         else if (regHookOf hk).isSome then s!"hook {hk} interpreted by the registry"
         else s!"hook {hk}, a unit, element or concatenation symbol of a collection sort")
-    if hooked.isSome then hooked
+    if false then hooked
     else if isUserSource e.attrs && regSymNames.contains e.fn then
       some (.hookEquation, s!"{e.fn}: a symbol of the registry")
     else if isCtor e.fn then
'''

[mutant."simplification-read-owise"]
summary = "a [simplification] equation is read as an equation of its function, beside an [owise] equation"
breaks = "InertReason.simplification: f(f(X)) => f(X) [simplification] is a lemma the other equations entail, no clause of f; read as one, it is a clause the [owise] equation does not negate"
row = 'C3 owise x simplification'
fixture = "c3-owise-simp"
theorems = "test/C3OwiseSimp.lean"
expect = "killed"
killed_by = "account: the lines `1 inert simplification [user]` and `[generated]` gone (c3-owise-simp; 2026-11-18)"
patch = '''
--- a/KcoreSpec/Parse.lean
+++ b/KcoreSpec/Parse.lean
@@ -3870,7 +3870,7 @@
   else if isCellCollAxiom N.cellPairs a then .unread .cellCollectionInjection
   -- a `\rewrites` axiom carrying `simplification` states a step: it is read, and `ruleBody`
   -- refuses it (`ruleAttrFault?`) instead of the step being dropped as an inert lemma
-  else if hasAttr a.attributes "simplification" && (scanRewrite s).isNone then .inert .simplification
+  else if false && hasAttr a.attributes "simplification" && (scanRewrite s).isNone then .inert .simplification
   -- an equation applying its function to a set variable on the left side (`lhsSetVar?`)
   else if (lhsSetVar? a).isSome then .refused .setVariable
   else if hasAttr a.attributes "symbol-overload" then
'''

