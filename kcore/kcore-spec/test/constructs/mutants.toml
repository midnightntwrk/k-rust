breaks = "Clause.prio: the text's priority{}(n) on an equation orders it before the equations of a larger priority whatever its requires (an equation of priority n applies first where its requires is true, and the others under the negation of it); read at 50, it and an equation of default priority are of one priority, neither under the negation of the other"
