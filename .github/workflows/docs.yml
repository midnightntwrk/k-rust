name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "Krs.lock"
      - "crates/**"
      - "docs-plan/**"
      - "docs-site/**"
      - "semantics/**"
      - "tests/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: starstream-fv/krs
    steps:
      - name: Check out KRS in its workspace layout
        uses: actions/checkout@v4
        with:
          path: starstream-fv/krs

      - name: Check out the pinned native frontend
        working-directory: .
        shell: bash
        run: |
          mkdir -p starstream-fv/inspirations/midnightntwrk
          git clone --filter=blob:none https://github.com/midnightntwrk/k-rust.git starstream-fv/inspirations/midnightntwrk/k-rust-krs-main
          commit="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("starstream-fv/krs/Krs.lock").read_text())["k_rust"]["commit"])')"
          git -C starstream-fv/inspirations/midnightntwrk/k-rust-krs-main checkout --detach "$commit"

      - name: Install the pinned solver library
        run: |
          python3 -m venv "$RUNNER_TEMP/krs-z3"
          "$RUNNER_TEMP/krs-z3/bin/pip" install --disable-pip-version-check z3-solver==4.12.5.0
          "$RUNNER_TEMP/krs-z3/bin/python" -c 'import pathlib,z3; print("KRS_Z3_LIB=" + str(pathlib.Path(z3.__file__).parent / "lib"))' >> "$GITHUB_ENV"

      - name: Select Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Select current stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Select Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install locked site dependencies
        run: bun install --cwd docs-site --frozen-lockfile

      - name: Run the documentation release gate
        run: bun run --cwd docs-site build
