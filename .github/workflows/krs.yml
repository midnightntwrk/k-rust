name: KRS

# The CI workflow already builds, lints, formats, and tests every workspace crate, KRS's
# (krs/crates/*) included, on the declared minimum and current Rust. This workflow adds the
# checks KRS owns: its tour verifiers, gate support tests, repository hygiene, the feature and
# target variants of its crates, its documentation, the separate semantics workspace, and the
# browser worker.

on:
  pull_request:
    paths:
      - ".github/actions/krs-z3/**"
      - ".github/workflows/krs.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "krs/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tours:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: krs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Provide the pinned solver library
        uses: ./.github/actions/krs-z3

      - name: Select Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Select current stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check that every tour is still correct KRS
        run: |
          python3 tests/tour-minimal/verify.py
          python3 tests/tour-imp/verify.py
          python3 tests/tour-composition/verify.py
          python3 tests/tour-negatives/verify.py
          python3 tests/tour-proof-evidence/verify.py

      - name: Check the definitions the tours reference
        run: |
          cargo check --locked --manifest-path tests/imp/rust-definition/Cargo.toml --lib
          cargo check --locked --offline --manifest-path crates/krs-macros/tests/fixtures/positive/Cargo.toml
          cargo check --locked --offline --manifest-path semantics/Cargo.toml -p krs-kevm-semantics

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: krs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Provide the pinned solver library
        uses: ./.github/actions/krs-z3

      - name: Put the solver library on the link and load paths
        run: |
          echo "LIBRARY_PATH=$KRS_Z3_LIB" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$KRS_Z3_LIB" >> "$GITHUB_ENV"

      - name: Select the minimum supported Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Select current stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Fetch locked dependencies
        run: |
          cargo +stable fetch --locked
          cargo +stable fetch --locked --manifest-path semantics/Cargo.toml

      - name: Check repository hygiene
        run: python3 tests/repo-hygiene/verify.py

      - name: Test the gate support package
        working-directory: krs/tests
        run: python3 -m unittest discover support

      - name: Check the compile-performance harness matrix without measuring
        run: |
          python3 -m unittest discover -s tests/perf -t tests
          python3 tests/perf/bench.py --dry-run

      - name: Check KRS documentation
        run: cargo +stable doc -p 'krs*' --no-deps --locked --offline
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Lint KRS without default features
        run: cargo +stable clippy -p krs --no-default-features --all-targets --locked --offline -- -D warnings

      - name: Lint lesson policy without default features
        run: cargo +stable clippy -p krs-lesson-policy --no-default-features --all-targets --locked --offline -- -D warnings

      - name: Lint the expansion module for WebAssembly
        run: cargo +stable clippy --target wasm32-unknown-unknown -p krs-expand-wasm --locked --offline -- -D warnings

      - name: Lint lesson policy for WebAssembly
        run: cargo +stable clippy --target wasm32-unknown-unknown -p krs-lesson-policy --locked --offline -- -D warnings

      - name: Check KRS without default features on the minimum supported Rust
        run: cargo +1.99.0 check -p krs --no-default-features --locked --offline

      - name: Test the semantics workspace
        run: cargo +stable test --manifest-path semantics/Cargo.toml --locked --offline --workspace

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: krs/browser/worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install locked worker dependencies
        run: bun install --frozen-lockfile

      - name: Type-check the worker and the backend suite page
        run: bun run typecheck

      - name: Test the worker without a pack
        run: bun run test
