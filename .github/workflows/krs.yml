name: KRS tours

on:
  pull_request:
    paths:
      - ".github/workflows/krs.yml"
      - "Krs.lock"
      - "crates/**"
      - "docs-site/src/pages/**"
      - "semantics/**"
      - "tests/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tours:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: starstream-fv/krs
    steps:
      - name: Check out KRS in its workspace layout
        uses: actions/checkout@v4
        with:
          path: starstream-fv/krs

      - name: Check out the pinned native frontend
        working-directory: .
        shell: bash
        run: |
          mkdir -p starstream-fv/inspirations/midnightntwrk
          git clone --filter=blob:none https://github.com/midnightntwrk/k-rust.git starstream-fv/inspirations/midnightntwrk/k-rust-krs-main
          commit="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("starstream-fv/krs/Krs.lock").read_text())["k_rust"]["commit"])')"
          git -C starstream-fv/inspirations/midnightntwrk/k-rust-krs-main checkout --detach "$commit"

      - name: Install the pinned solver library
        run: |
          python3 -m venv "$RUNNER_TEMP/krs-z3"
          "$RUNNER_TEMP/krs-z3/bin/pip" install --disable-pip-version-check z3-solver==4.12.5.0
          "$RUNNER_TEMP/krs-z3/bin/python" -c 'import pathlib,z3; print("KRS_Z3_LIB=" + str(pathlib.Path(z3.__file__).parent / "lib"))' >> "$GITHUB_ENV"

      - name: Select Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Select current stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check that every tour is still correct KRS
        run: |
          python3 tests/tour-minimal/verify.py
          python3 tests/tour-imp/verify.py
          python3 tests/tour-composition/verify.py
          python3 tests/tour-negatives/verify.py
          python3 tests/tour-proof-evidence/verify.py

      - name: Check the definitions the tours reference
        run: |
          cargo check --locked --manifest-path tests/m4/rust-definition/Cargo.toml --lib
          cargo check --locked --offline --manifest-path crates/krs-macros/tests/fixtures/positive/Cargo.toml
          cargo check --locked --offline --manifest-path semantics/Cargo.toml -p krs-kevm-semantics
