name: KRS

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/krs.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Krs.lock"
      - "crates/**"
      - "docs-site/src/pages/**"
      - "semantics/**"
      - "tests/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tours:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: starstream-fv/krs
    steps:
      - name: Check out KRS in its workspace layout
        uses: actions/checkout@v4
        with:
          path: starstream-fv/krs

      - name: Provide the pinned k-rust checkout and solver library
        uses: ./starstream-fv/krs/.github/actions/krs-inputs

      - name: Select Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Select current stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check that every tour is still correct KRS
        run: |
          python3 tests/tour-minimal/verify.py
          python3 tests/tour-imp/verify.py
          python3 tests/tour-composition/verify.py
          python3 tests/tour-negatives/verify.py
          python3 tests/tour-proof-evidence/verify.py

      - name: Check the definitions the tours reference
        run: |
          cargo check --locked --manifest-path tests/m4/rust-definition/Cargo.toml --lib
          cargo check --locked --offline --manifest-path crates/krs-macros/tests/fixtures/positive/Cargo.toml
          cargo check --locked --offline --manifest-path semantics/Cargo.toml -p krs-kevm-semantics

  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: starstream-fv/krs
    steps:
      - name: Check out KRS in its workspace layout
        uses: actions/checkout@v4
        with:
          path: starstream-fv/krs

      - name: Provide the pinned k-rust checkout and solver library
        uses: ./starstream-fv/krs/.github/actions/krs-inputs

      - name: Put the solver library on the link and load paths
        run: |
          echo "LIBRARY_PATH=$KRS_Z3_LIB" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$KRS_Z3_LIB" >> "$GITHUB_ENV"

      - name: Select the minimum supported Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Select current stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Fetch locked dependencies
        run: |
          cargo +stable fetch --locked
          cargo +stable fetch --locked --manifest-path semantics/Cargo.toml

      - name: Check repository hygiene
        run: python3 tests/repo-hygiene/verify.py

      - name: Test the gate support package
        working-directory: starstream-fv/krs/tests
        run: python3 -m unittest discover support

      - name: Test the workspace
        run: cargo +stable test --workspace --locked --offline

      - name: Lint the workspace
        run: cargo +stable clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Check the workspace on the minimum supported Rust
        run: cargo +1.88.0 check --workspace --all-targets --locked --offline

      - name: Test the semantics workspace
        run: cargo +stable test --manifest-path semantics/Cargo.toml --locked --offline --workspace
