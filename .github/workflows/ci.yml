name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            crates/k-rust-napi/package-lock.json
            crates/k-rust-wasm/package-lock.json

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build native targets
        run: cargo build --workspace --all-targets --locked

      - name: Run Clippy with native Z3 inference
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests with native Z3 inference
        run: cargo test --workspace --locked

      - name: Smoke-test the unified in-process backend
        run: scripts/backend-smoke.sh

      - name: Install Node-API development dependencies
        run: npm ci
        working-directory: crates/k-rust-napi

      - name: Build and typecheck Node-API bindings
        run: npm run build:debug
        working-directory: crates/k-rust-napi

      - name: Test Node-API bindings
        run: npm test
        working-directory: crates/k-rust-napi

      - name: Install WebAssembly package dependencies
        run: npm ci
        working-directory: crates/k-rust-wasm

      - name: Build and typecheck WebAssembly bindings
        run: npm run build:dev
        working-directory: crates/k-rust-wasm

      - name: Test WebAssembly bindings
        run: npm test
        working-directory: crates/k-rust-wasm

      - name: Check portable feature set
        run: cargo clippy -p k-rust -p k-rust-wasm --all-targets --no-default-features --locked -- -D warnings

      - name: Test portable feature set
        run: cargo test -p k-rust -p k-rust-wasm --no-default-features --locked

      - name: Check WebAssembly compatibility
        run: cargo build -p k-rust-wasm --target wasm32-unknown-unknown --locked
