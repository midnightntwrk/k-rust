name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which path-triggered checks this push or pull request needs. Those checks run in
  # `path-triggered` below, and every night on main (nightly.yml).
  changes:
    name: Select path-triggered checks
    runs-on: ubuntu-latest
    outputs:
      portable-suite: ${{ steps.select.outputs.portable-suite }}
      z3-acquisition: ${{ steps.select.outputs.z3-acquisition }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare the changed paths with each check's triggers
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT_NAME" in
            push)
              forced=()
              if [[ $PUSH_FORCED == true ]]; then forced=(--forced); fi
              scripts/ci-changed-paths.sh --push "$PUSH_BEFORE" "$GITHUB_SHA" "${forced[@]}" >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              scripts/ci-changed-paths.sh --pull-request "$PULL_REQUEST_BASE" "$PULL_REQUEST_HEAD" >> "$GITHUB_OUTPUT"
              ;;
            *)
              scripts/ci-changed-paths.sh --all >> "$GITHUB_OUTPUT"
              ;;
          esac

  # A check whose trigger paths did not change is skipped at the job level, which GitHub reports
  # as a skipped check that counts as passing, so a required check never waits for it.
  path-triggered:
    name: Path-triggered
    needs: changes
    uses: ./.github/workflows/nightly.yml
    with:
      portable-suite: ${{ needs.changes.outputs.portable-suite == 'true' }}
      z3-acquisition: ${{ needs.changes.outputs.z3-acquisition == 'true' }}

  msrv:
    name: Rust 1.99 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check all targets at the declared minimum
        run: cargo check --workspace --all-targets --locked

  scripts:
    name: Script unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run the Python unit tests of the scripts
        run: scripts/script-unit-tests.sh

  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            crates/k-rust-napi/package-lock.json
            crates/k-rust-wasm/package-lock.json

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build native targets
        run: cargo build --workspace --all-targets --locked

      # The registry must parse, and every cached reference measurement must still match its
      # workload's reference command (a changed paired command needs `kbench reference` on a host).
      - name: Check benchmark registry
        run: |
          cargo run --locked --quiet -p k-rust-bench -- validate
          cargo run --locked --quiet -p k-rust-bench -- run --tier heavy --dry-run --no-history > /dev/null

      - name: Run Clippy with native Z3 inference
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # nextest runs each test in its own process; it does not run doc-tests. Checked inference
      # runs both engines on every parse and fails on a disagreement; `measure_ratchet`, which
      # pins one engine's work, is left out by the profile and runs in the next step instead.
      - name: Run tests with native Z3 inference under checked sort inference
        run: cargo nextest run --workspace --locked --no-fail-fast --profile ci-checked
        env:
          KRUST_TYPE_INFERENCE_MODE: checked

      # Under checked inference an ambiguous forest the portable engine decides takes the checked
      # path, so the default Z3 build's own path for it runs only here. `inner_rules` pins the
      # parse of every rule shape; its self-rerun under checked inference already ran above.
      - name: Run the rule parser snapshots under the default sort inference
        run: >-
          cargo nextest run --workspace --locked --no-fail-fast --profile ci
          -E 'binary_id(k-rust::inner_rules) & not test(=every_rule_test_passes_under_checked_inference)'

      - name: Run doc-tests with native Z3 inference
        run: cargo test --doc --workspace --exclude k-rust-napi --locked

      # The canonical Float text against MPFR, an independent implementation of the rounding;
      # no other build links MPFR. The step fails unless exactly the oracle test ran and passed,
      # so a renamed test or feature cannot pass it by matching nothing.
      - name: Check the canonical Float text against MPFR
        shell: bash
        run: |
          cargo test --locked -p k-rust-backend --features mpfr-oracle --lib -- --exact \
            builtin::float::canonical::mpfr_oracle::the_backend_canonical_float_text_agrees_with_mpfr \
            | tee target/mpfr-oracle.log
          grep -q '^test result: ok. 1 passed' target/mpfr-oracle.log

      - name: Run native measurement ratchet
        run: scripts/measure-ratchet.sh --gh-release

      - name: Install Node-API development dependencies
        run: npm ci
        working-directory: crates/k-rust-napi

      - name: Build and typecheck Node-API bindings
        run: npm run build:debug
        working-directory: crates/k-rust-napi

      - name: Test Node-API bindings
        run: npm test
        working-directory: crates/k-rust-napi

      - name: Install WebAssembly package dependencies
        run: npm ci
        working-directory: crates/k-rust-wasm

      - name: Build and typecheck WebAssembly bindings
        run: npm run build:dev
        working-directory: crates/k-rust-wasm

      - name: Test WebAssembly bindings
        run: npm test
        working-directory: crates/k-rust-wasm

      - name: Check portable feature set
        run: cargo clippy -p k-rust -p k-rust-wasm --all-targets --no-default-features --locked -- -D warnings

      # The subset whose tests run only in the portable build; the full portable suite is
      # path-triggered and nightly (nightly.yml). Checked inference in the Z3 step compares the
      # portable engine's decisions with Z3's on every other parse.
      - name: Test the portable feature set's subset
        run: >-
          cargo nextest run --locked --no-fail-fast --profile ci --no-default-features
          -p k-rust -p k-rust-wasm --lib --test inner_parser --test definition_regex

      - name: Test the backend without Z3
        run: cargo nextest run --locked --no-fail-fast --profile ci -p k-rust-backend

      - name: Check WebAssembly compatibility
        run: cargo build -p k-rust-wasm --target wasm32-unknown-unknown --locked

      - name: Check the standalone regex crate stays dependency-free
        run: |
          cargo build -p k-rust-regex --target wasm32-unknown-unknown --locked
          test "$(cargo tree -p k-rust-regex -e normal --prefix none | wc -l)" -eq 1
