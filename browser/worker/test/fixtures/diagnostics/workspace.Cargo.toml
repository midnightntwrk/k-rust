[workspace]
members = ["anchor-probe", "overlap", "rust-expansion", "wrong-result"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.0.0"
publish = false

[workspace.dependencies]
krs-collector = { path = "../../../../crates/krs-collector" }
krs-ir = { path = "../../../../crates/krs-ir" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
k = { package = "krs", path = "../../../../crates/krs" }
