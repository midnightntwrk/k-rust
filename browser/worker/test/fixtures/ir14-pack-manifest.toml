  { pattern = "/pack\\-target/", class = "namespace-target", roles = ["proc-macro-metadata"], note = "host units get no RUSTFLAGS: the build namespace's target directory (fixed path, not a host path)" },
  { pattern = "/usr/bin/env$", class = "string-literal", roles = ["target-rlib"], note = "syn: the `#!/usr/bin/env` shebang literal" },
  { pattern = "/tmp/dep_graph\\.gv\\)$", class = "string-literal", roles = ["compiler"], note = "rustc: -Zdump-dep-graph default file name" },
  { pattern = "/(tmp|home|root)/[^\"`]*[\"`]", class = "string-literal", roles = ["sysroot-bundle"], note = "std rustdoc examples kept in metadata (a quote or backtick ends the literal)" },
]

