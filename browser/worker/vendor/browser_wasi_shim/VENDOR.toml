# Vendored browser_wasi_shim.
#
# The JavaScript files are the minified copy that Weblings vendors, plus the
# path_readlink patch (../browser_wasi_shim-readlink.patch), without which every
# non-root canonicalize fails with ENOTSUP.
# index.d.ts is written for this package and declares only the surface it uses.

schema = 1
name = "browser_wasi_shim"
upstream = "@bjorn3/browser_wasi_shim (no version marker in the vendored copy)"
source_repository = "https://github.com/AngelOnFira/weblings"
source_revision = "d0cd7a9f3af7d8249b3948ac0e19d2afc0d01633"
source_path = "app/public/vendor/browser_wasi_shim/"
staged_from = "/var/tmp/krs-browser-lessons-bl001-run-1/weblings-source (the browser toolchain baseline's stage-approved-assets.sh)"
patch = "../browser_wasi_shim-readlink.patch (OpenDirectory.path_readlink returns EINVAL for an existing non-link, the lookup errno otherwise)"
patched_files = ["fs_mem.js"]

[license]
# The Weblings copy ships no license file for the shim. LICENSE-MIT and
# LICENSE-APACHE are the upstream texts, fetched 2026-09-23 with Sebastien's
# approval from the upstream repository at the revision the vendored copy was
# built from (see [upstream_revision]). LICENSE-weblings is the Weblings
# repository license (MIT).
upstream_spdx = "MIT OR Apache-2.0"
upstream_spdx_basis = "package.json \"license\": \"MIT OR Apache-2.0\" at the upstream revision below"
upstream_text_present = true
container_license = "LICENSE-weblings"

