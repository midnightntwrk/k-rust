"LICENSE-MIT" = { url = "https://raw.githubusercontent.com/bjorn3/browser_wasi_shim/b068ec2c22d68581c48f2592f8cca1681bf71a98/LICENSE-MIT", sha256 = "23f18e03dc49df91622fe2a76176497404e46ced8a715d9d2b67a7446571cca3" }
