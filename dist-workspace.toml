[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# GitHub release archives hold the native executables: `krust` (package k-rust) and `krust-fuzz`
# (package k-rust-fuzz, which opts in with `[package.metadata.dist]`), released together under
# one `vX.Y.Z` tag because their versions agree. The binding crates build libraries, which dist
# does not package; npm packages them.
# CI backends to support
ci = "github"
# Authenticate build-script GitHub API requests with the workflow token.
github-build-setup = "../build-setup.yml"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "~/.local/bin/"]
# Whether to install an updater program
install-updater = true

[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
