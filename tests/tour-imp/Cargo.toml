[package]
name = "krs-tour-imp"
description = "Documentation-owned, chapter-sliced complete IMP fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "krs_tour_imp"
path = "src/lib.rs"

[dependencies]
k = { package = "krs", path = "../../crates/krs" }

[package.metadata.krs]
k-namespace = "KRS-TOUR-IMP"

[package.metadata.krs.definitions.main]

[workspace]
resolver = "3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

