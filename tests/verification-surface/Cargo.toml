[workspace]
members = [
    "packages/l21",
    "packages/l21-readable",
    "packages/trusted",
    "packages/trusted-ablation",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
