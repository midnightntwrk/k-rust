[package]
name = "krs-imp-state-rust-definition"
description = "Explicit Rust-authored KRS definition for the IMP state oracle"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "imp_state_calc"

[dependencies]
k = { package = "krs", path = "../../../crates/krs" }

[package.metadata.krs]
k-namespace = "KRS-IMP-STATE-CALC"

[package.metadata.krs.definitions.main]

[workspace]
resolver = "3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

