[workspace]
members = [
    "packages/dependency-rules",
    "packages/dependency-rules-base",
    "packages/format",
    "packages/kevm-case",
    "packages/layout",
    "packages/lists",
    "packages/strict-lists",
    "packages/memo",
    "packages/overload",
    "packages/overload-ambiguous",
    "packages/partition",
    "packages/prefer",
    "packages/program-warning",
    "packages/token-id",
    "packages/tokens",
    "packages/visibility",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
