[package]
name = "krs-m3d-rust-definition"
description = "Staged Rust-authored definition preflight for the M3D static and verification surface"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "m3d_imp"
path = "src/m3c.rs"

[dependencies]
k = { package = "krs", path = "../../../crates/krs" }

[package.metadata.krs]
k-namespace = "KRS-M3D-IMP"

[package.metadata.krs.definitions.main]
root = "crate"
syntax-root = "crate"

[workspace]
resolver = "3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
