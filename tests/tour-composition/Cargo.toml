[workspace]
members = [
    "packages/base-semantics",
    "packages/root-semantics",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tour_mode, values("extended"))'] }

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
