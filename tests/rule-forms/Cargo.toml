[workspace]
members = [
    "packages/anywhere",
    "packages/casts",
    "packages/contexts",
    "packages/contexts-evaluate",
    "packages/contexts-lvalue",
    "packages/fresh",
    "packages/heat-cool",
    "packages/heat-cool-strict",
    "packages/local-rewrite",
    "packages/local-term",
    "packages/macros",
    "packages/nondet",
    "packages/priority",
    "packages/restating-imp",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
