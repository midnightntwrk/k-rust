[workspace]
members = [
    "packages/bool-ops",
    "packages/bytes-ops",
    "packages/int-ops",
    "packages/int-sign",
    "packages/int-sign-unsigned",
    "packages/map-ops",
    "packages/set-ops",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
