[[behavior]]
id = "return-existing-local-zero"
program = "ListItem(basicBlock(.Statements, return)) .List"
locals = "0 |-> mirInt(7)"
expected_locals = "0 |-> mirInt(7)"
expected_return = "return(mirInt(7))"
expected_block_count = 1

[[behavior]]
id = "constant-assignment"
program = "ListItem(basicBlock(assign(local(0), use(const(mirInt(9)))) ; .Statements, return)) .List"
locals = ".Map"
expected_locals = "0 |-> mirInt(9)"
expected_return = "return(mirInt(9))"
expected_block_count = 1

[[behavior]]
id = "ordered-copy-assignment"
program = "ListItem(basicBlock(assign(local(1), use(const(mirInt(9)))) ; assign(local(0), use(copy(local(1)))) ; .Statements, return)) .List"
locals = ".Map"
expected_locals = "0 |-> mirInt(9) 1 |-> mirInt(9)"
expected_return = "return(mirInt(9))"
expected_block_count = 1

[[behavior]]
id = "integer-addition"
program = "ListItem(basicBlock(assign(local(1), use(const(mirInt(20)))) ; assign(local(2), use(const(mirInt(22)))) ; assign(local(0), add(copy(local(1)), copy(local(2)))) ; .Statements, return)) .List"
locals = ".Map"
expected_locals = "0 |-> mirInt(42) 1 |-> mirInt(20) 2 |-> mirInt(22)"
expected_return = "return(mirInt(42))"
expected_block_count = 1

[[behavior]]
id = "goto-next-block"
program = "ListItem(basicBlock(.Statements, goto(1))) ListItem(basicBlock(assign(local(0), use(const(mirInt(7)))) ; .Statements, return)) .List"
locals = ".Map"
expected_locals = "0 |-> mirInt(7)"
expected_return = "return(mirInt(7))"
expected_block_count = 2

[[behavior]]
id = "switch-true"
program = "ListItem(basicBlock(.Statements, switchInt(const(mirBool(true)), 1, 2))) ListItem(basicBlock(assign(local(0), use(const(mirInt(1)))) ; .Statements, return)) ListItem(basicBlock(assign(local(0), use(const(mirInt(2)))) ; .Statements, return)) .List"
locals = ".Map"
expected_locals = "0 |-> mirInt(1)"
expected_return = "return(mirInt(1))"
expected_block_count = 3

[[behavior]]
id = "switch-false"
program = "ListItem(basicBlock(.Statements, switchInt(const(mirBool(false)), 1, 2))) ListItem(basicBlock(assign(local(0), use(const(mirInt(1)))) ; .Statements, return)) ListItem(basicBlock(assign(local(0), use(const(mirInt(2)))) ; .Statements, return)) .List"
locals = ".Map"
expected_locals = "0 |-> mirInt(2)"
expected_return = "return(mirInt(2))"
