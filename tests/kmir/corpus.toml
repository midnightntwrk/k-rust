[[behavior]]
id = "read-before-overwrite"
program = "ListItem(basicBlock(assign(local(0), add(copy(local(0)), const(mirInt(2)))) ; .Statements, return)) .List"
locals = "0 |-> mirInt(5)"
expected_locals = "0 |-> mirInt(7)"
expected_return = "return(mirInt(7))"
