[[behavior]]
id = "list-indexed-third-block"
program = "ListItem(basicBlock(.Statements, goto(2))) ListItem(basicBlock(.Statements, return)) ListItem(basicBlock(assign(local(0), use(const(mirInt(7)))) ; .Statements, return)) .List"
locals = ".Map"
expected_locals = "0 |-> mirInt(7)"
