[[behavior]]
id = "combined-true-path"
program = "ListItem(basicBlock(assign(local(1), use(const(mirInt(20)))) ; assign(local(2), use(const(mirInt(22)))) ; assign(local(3), add(copy(local(1)), copy(local(2)))) ; assign(local(4), use(const(mirBool(true)))) ; .Statements, goto(1))) ListItem(basicBlock(.Statements, switchInt(copy(local(4)), 2, 3))) ListItem(basicBlock(assign(local(0), use(copy(local(3)))) ; .Statements, return)) ListItem(basicBlock(assign(local(0), use(const(mirInt(0)))) ; .Statements, return)) .List"
locals = ".Map"
expected_locals = "0 |-> mirInt(42) 1 |-> mirInt(20) 2 |-> mirInt(22) 3 |-> mirInt(42) 4 |-> mirBool(true)"
expected_return = "return(mirInt(42))"
expected_block_count = 4

[[behavior]]
id = "combined-false-path"
program = "ListItem(basicBlock(assign(local(1), use(const(mirInt(20)))) ; assign(local(2), use(const(mirInt(22)))) ; assign(local(3), add(copy(local(1)), copy(local(2)))) ; assign(local(4), use(const(mirBool(false)))) ; .Statements, goto(1))) ListItem(basicBlock(.Statements, switchInt(copy(local(4)), 2, 3))) ListItem(basicBlock(assign(local(0), use(copy(local(3)))) ; .Statements, return)) ListItem(basicBlock(assign(local(0), use(const(mirInt(0)))) ; .Statements, return)) .List"
locals = ".Map"
expected_locals = "0 |-> mirInt(0) 1 |-> mirInt(20) 2 |-> mirInt(22) 3 |-> mirInt(42) 4 |-> mirBool(false)"
expected_return = "return(mirInt(0))"
expected_block_count = 4
