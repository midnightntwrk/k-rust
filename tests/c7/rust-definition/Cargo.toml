[package]
name = "krs-c7-associativity"
description = "Behavioral fixture for readable precedence associativity"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "krs_c7_associativity"
path = "src/lib.rs"

[dependencies]
k = { package = "krs", path = "../../../crates/krs" }

[package.metadata.krs]
k-namespace = "KRS-C7-ASSOCIATIVITY"

[package.metadata.krs.definitions.main]
root = "crate"
syntax-root = "crate"

[workspace]
resolver = "3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
