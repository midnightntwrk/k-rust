schema = 1
observe = ["instrs", "valstack"]

[expect]
instrs = ".K"

[report]
instrs = "instrs"
valstack = "valstack"

[[source_evidence]]
path = "pykwasm/src/pykwasm/kdist/wasm-semantics/wasm-data.md"
contract = "IValType, IVal, ValStack, undefined, integer bounds, and chop"

[[source_evidence]]
path = "pykwasm/src/pykwasm/kdist/wasm-semantics/numeric.md"
contract = "IBinOp and add, sub, mul, and guarded div_u equations"

[[source_evidence]]
path = "pykwasm/src/pykwasm/kdist/wasm-semantics/wasm.md"
contract = "Instrs, integer instructions, configuration cells, value transfer, operand loading, and trap generation"

[[source_evidence]]
path = "tests/simple/arithmetic.wast"
contract = "direct and nested arithmetic programs"

[[source_evidence]]
path = "tests/proofs/simple-arithmetic-spec.k"
contract = "constant and addition claim shapes"

[[behavior]]
id = "i32-zero"
program = "i32.const 0 ; .Instrs"
expect.valstack = "< i32 > 0 : .ValStack"

[[behavior]]
id = "i64-zero"
program = "i64.const 0 ; .Instrs"
expect.valstack = "< i64 > 0 : .ValStack"

[[behavior]]
id = "i32-add"
search = true
program = "i32.const 20 ; i32.const 22 ; i32.add ; .Instrs"
expect.valstack = "< i32 > 42 : .ValStack"

[[behavior]]
id = "i64-add"
program = "i64.const 20 ; i64.const 22 ; i64.add ; .Instrs"
expect.valstack = "< i64 > 42 : .ValStack"

[[behavior]]
id = "i32-sub"
program = "i32.const 9 ; i32.const 4 ; i32.sub ; .Instrs"
expect.valstack = "< i32 > 5 : .ValStack"

[[behavior]]
id = "i64-sub"
program = "i64.const 9 ; i64.const 4 ; i64.sub ; .Instrs"
expect.valstack = "< i64 > 5 : .ValStack"

[[behavior]]
id = "i32-mul"
program = "i32.const 7 ; i32.const 9 ; i32.mul ; .Instrs"
expect.valstack = "< i32 > 63 : .ValStack"

[[behavior]]
id = "i64-mul"
program = "i64.const 7 ; i64.const 9 ; i64.mul ; .Instrs"
expect.valstack = "< i64 > 63 : .ValStack"

[[behavior]]
id = "i32-operand-order"
program = "i32.const 3 ; i32.const 5 ; i32.sub ; .Instrs"
expect.valstack = "< i32 > 4294967294 : .ValStack"

[[behavior]]
id = "i64-operand-order"
program = "i64.const 3 ; i64.const 5 ; i64.sub ; .Instrs"
expect.valstack = "< i64 > 18446744073709551614 : .ValStack"

[[behavior]]
id = "i32-nesting"
program = "i32.const 1 ; i32.const 2 ; i32.add ; i32.const 3 ; i32.mul ; .Instrs"
expect.valstack = "< i32 > 9 : .ValStack"

[[behavior]]
id = "i64-nesting"
program = "i64.const 2 ; i64.const 3 ; i64.mul ; i64.const 4 ; i64.add ; .Instrs"
expect.valstack = "< i64 > 10 : .ValStack"

[[behavior]]
id = "i32-maximum"
program = "i32.const 4294967295 ; .Instrs"
expect.valstack = "< i32 > 4294967295 : .ValStack"

[[behavior]]
id = "i64-maximum"
program = "i64.const 18446744073709551615 ; .Instrs"
expect.valstack = "< i64 > 18446744073709551615 : .ValStack"

[[behavior]]
id = "i32-negative-constant"
program = "i32.const -1 ; .Instrs"
expect.valstack = "< i32 > 4294967295 : .ValStack"

[[behavior]]
id = "i64-negative-constant"
program = "i64.const -1 ; .Instrs"
expect.valstack = "< i64 > 18446744073709551615 : .ValStack"

[[behavior]]
id = "i32-add-wrap"
program = "i32.const 4294967295 ; i32.const 1 ; i32.add ; .Instrs"
expect.valstack = "< i32 > 0 : .ValStack"

[[behavior]]
id = "i64-add-wrap"
program = "i64.const 18446744073709551615 ; i64.const 1 ; i64.add ; .Instrs"
expect.valstack = "< i64 > 0 : .ValStack"

[[behavior]]
id = "i32-sub-wrap"
program = "i32.const 0 ; i32.const 1 ; i32.sub ; .Instrs"
expect.valstack = "< i32 > 4294967295 : .ValStack"

[[behavior]]
id = "i64-sub-wrap"
program = "i64.const 0 ; i64.const 1 ; i64.sub ; .Instrs"
expect.valstack = "< i64 > 18446744073709551615 : .ValStack"

[[behavior]]
id = "i32-mul-wrap"
program = "i32.const 4294967295 ; i32.const 4294967295 ; i32.mul ; .Instrs"
expect.valstack = "< i32 > 1 : .ValStack"

[[behavior]]
id = "i64-mul-wrap"
program = "i64.const 18446744073709551615 ; i64.const 18446744073709551615 ; i64.mul ; .Instrs"
expect.valstack = "< i64 > 1 : .ValStack"

[[behavior]]
id = "i32-div-u"
program = "i32.const 84 ; i32.const 2 ; i32.div_u ; .Instrs"
expect.valstack = "< i32 > 42 : .ValStack"

[[behavior]]
id = "i64-div-u"
program = "i64.const 126 ; i64.const 3 ; i64.div_u ; .Instrs"
expect.valstack = "< i64 > 42 : .ValStack"

[[behavior]]
id = "i32-div-u-operand-order"
program = "i32.const 3 ; i32.const 5 ; i32.div_u ; .Instrs"
expect.valstack = "< i32 > 0 : .ValStack"

[[behavior]]
id = "i64-div-u-operand-order"
program = "i64.const 3 ; i64.const 5 ; i64.div_u ; .Instrs"
expect.valstack = "< i64 > 0 : .ValStack"

[[behavior]]
id = "i32-div-u-truncation"
program = "i32.const 7 ; i32.const 2 ; i32.div_u ; .Instrs"
expect.valstack = "< i32 > 3 : .ValStack"

[[behavior]]
id = "i64-div-u-truncation"
program = "i64.const 7 ; i64.const 2 ; i64.div_u ; .Instrs"
expect.valstack = "< i64 > 3 : .ValStack"

[[behavior]]
id = "i32-div-u-unsigned-maximum"
program = "i32.const 4294967295 ; i32.const 2 ; i32.div_u ; .Instrs"
expect.valstack = "< i32 > 2147483647 : .ValStack"

[[behavior]]
id = "i64-div-u-unsigned-maximum"
program = "i64.const 18446744073709551615 ; i64.const 2 ; i64.div_u ; .Instrs"
expect.valstack = "< i64 > 9223372036854775807 : .ValStack"

[[behavior]]
id = "i32-div-u-zero"
search = true
program = "i32.const 7 ; i32.const 0 ; i32.div_u ; .Instrs"
expect.instrs = "trap ~> .Instrs"
expect.valstack = ".ValStack"

[[behavior]]
id = "i64-div-u-zero"
program = "i64.const 7 ; i64.const 0 ; i64.div_u ; .Instrs"
expect.instrs = "trap ~> .Instrs"
expect.valstack = ".ValStack"
