[[behavior]]
id = "i32-zero"
program = "i32.const 0 ; .Instrs"
expected_type = "i32"
expected_value = "0"

[[behavior]]
id = "i64-zero"
program = "i64.const 0 ; .Instrs"
expected_type = "i64"
expected_value = "0"

[[behavior]]
id = "i32-add"
program = "i32.const 20 ; i32.const 22 ; i32.add ; .Instrs"
expected_type = "i32"
expected_value = "42"

[[behavior]]
id = "i64-add"
program = "i64.const 20 ; i64.const 22 ; i64.add ; .Instrs"
expected_type = "i64"
expected_value = "42"

[[behavior]]
id = "i32-sub"
program = "i32.const 9 ; i32.const 4 ; i32.sub ; .Instrs"
expected_type = "i32"
expected_value = "5"

[[behavior]]
id = "i64-sub"
program = "i64.const 9 ; i64.const 4 ; i64.sub ; .Instrs"
expected_type = "i64"
expected_value = "5"

[[behavior]]
id = "i32-mul"
program = "i32.const 7 ; i32.const 9 ; i32.mul ; .Instrs"
expected_type = "i32"
expected_value = "63"

[[behavior]]
id = "i64-mul"
program = "i64.const 7 ; i64.const 9 ; i64.mul ; .Instrs"
expected_type = "i64"
expected_value = "63"

[[behavior]]
id = "i32-operand-order"
program = "i32.const 3 ; i32.const 5 ; i32.sub ; .Instrs"
expected_type = "i32"
expected_value = "4294967294"

[[behavior]]
id = "i64-operand-order"
program = "i64.const 3 ; i64.const 5 ; i64.sub ; .Instrs"
expected_type = "i64"
expected_value = "18446744073709551614"

[[behavior]]
id = "i32-nesting"
program = "i32.const 1 ; i32.const 2 ; i32.add ; i32.const 3 ; i32.mul ; .Instrs"
