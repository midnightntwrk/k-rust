[workspace]
members = [
    "packages/aliases",
    "packages/alternatives",
    "packages/matches",
    "packages/lets",
    "packages/contexts",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
