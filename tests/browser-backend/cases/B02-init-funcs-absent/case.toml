schema = 1
id = "B02-init-funcs-absent"
behavior = "inventory-style `.init_array` registration from a library crate, plus the registration crate's object inspected for a WASM_INIT_FUNCS subsection."
basis = "spikes/BL-003 backend-control/init-array.rs and the original collector-ab (inventory); IR-03 M1/M2, IR-06 finding"
# Recorded limitation: clif2wasm drops .init_array, so rustc.wasm gives zero
# registrations and an object without init functions. It flips to the twin's
# result only when IR-22 lands, which must be recorded as an intentional expectation change.
expected_status = "limitation"
gap = { class = "backend", ticket = "IR-22", summary = "clif2wasm emits no WASM_INIT_FUNCS for .init_array statics; riwl's __wasm_call_ctors therefore calls nothing from browser-compiled code", root_cause = "fork clif2wasm object writer: no init-funcs subsection is produced for `#[link_section = \".init_array\"]` data (results/BL-003/backend-limitations.md; IR-03 M0/M2 init_funcs_in_object = false)" }

[[crate]]
name = "b02_registry"
src = "registry.rs"
type = "rlib"

[[crate]]
name = "b02_registrations"
src = "registrations.rs"
type = "rlib"
externs = ["b02_registry"]

[[crate]]
name = "b02_registrations_object"
src = "registrations.rs"
type = "obj"
externs = ["b02_registry"]
inspect = "init-funcs"

[[crate]]
name = "b02_collector"
src = "main.rs"
type = "bin"
externs = ["b02_registry", "b02_registrations"]

[[run]]
name = "default"
bin = "b02_collector"
