[package]
name = "krs-imp-control-flow-rust-definition"
description = "Explicit Rust-authored KRS definition for the IMP control-flow oracle"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "imp_control_flow"

[dependencies]
k = { package = "krs", path = "../../../crates/krs" }

[package.metadata.krs]
k-namespace = "KRS-IMP-CONTROL-FLOW-IMP"

[package.metadata.krs.definitions.main]
root = "crate"
syntax-root = "crate"

[workspace]
resolver = "3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
