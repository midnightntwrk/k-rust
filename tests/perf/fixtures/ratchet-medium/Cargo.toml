[package]
name = "krs-perf-synth"
description = "Synthetic KRS definition for counter ratchets"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "krs_perf_synth"
path = "src/lib.rs"

[dependencies]
k = { package = "krs", path = "../../../../crates/krs" }

[package.metadata.krs]
k-namespace = "KRS-PERF-SYNTH"

[package.metadata.krs.definitions.main]

[workspace]
resolver = "3"
