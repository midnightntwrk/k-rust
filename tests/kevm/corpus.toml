contract = "configuration, #next/#exec/#pc/#gas pipeline, PUSH, ADD, PC, STOP, INVALID, and exceptional statuses"

[[source_evidence]]
path = "kevm-pyk/src/kevm_pyk/kproj/evm-semantics/word.md"
contract = "Word, WordStack, and modulo-2^256 chop"

[[source_evidence]]
path = "kevm-pyk/src/kevm_pyk/kproj/evm-semantics/schedule.md"
contract = "Shanghai Gzero, Gbase, and Gverylow costs"

[[source_evidence]]
path = "kevm-pyk/src/kevm_pyk/kproj/evm-semantics/summaries/push-summary.k"
contract = "direct PUSH transition over program, stack, PC, and gas"

[[source_evidence]]
path = "kevm-pyk/src/kevm_pyk/kproj/evm-semantics/summaries/add-summary.k"
contract = "direct ADD transition with 256-bit normalization"

[[source_evidence]]
path = "kevm-pyk/src/kevm_pyk/kproj/evm-semantics/summaries/pc-summary.k"
contract = "direct PC observation transition"

[[source_evidence]]
path = "kevm-pyk/src/kevm_pyk/kproj/evm-semantics/summaries/gas-summary.k"
contract = "gas observation and deduction ordering"

[[source_evidence]]
path = "kevm-pyk/src/kevm_pyk/kproj/evm-semantics/summaries/stop-summary.k"
contract = "successful halt status"

[[source_evidence]]
path = "kevm-pyk/src/kevm_pyk/kproj/evm-semantics/summaries/invalid-summary.k"
contract = "invalid-instruction exceptional status"

[[behavior]]
id = "empty-program"
program = ".EvmProgram"
stack = ".WordStack"
pc = "0"
gas = "0"
expected_program = ".EvmProgram"
expected_stack = ".WordStack"
expected_pc = "0"
expected_gas = "0"
expected_status = "EVMC_SUCCESS"

[[behavior]]
id = "push-width-one"
program = "PUSH(1, 42) ; STOP ; .EvmProgram"
stack = ".WordStack"
pc = "0"
gas = "3"
expected_program = ".EvmProgram"
expected_stack = "42 : .WordStack"
expected_pc = "2"
expected_gas = "0"
expected_status = "EVMC_SUCCESS"

