[package]
name = "krs-imp-static-authored-surface"
description = "Intentional compile-fail package spelling the intended IMP static semantics authored surface"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "imp_static_semantics_authored_surface"

[dependencies]
k = { package = "krs", path = "../../../../crates/krs" }

[package.metadata.krs]
k-namespace = "KRS-IMP-STATIC-AUTHORED"

[package.metadata.krs.definitions.main]
root = "crate"
syntax-root = "crate"

[workspace]
resolver = "3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
