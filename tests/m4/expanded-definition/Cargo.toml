[package]
name = "krs-m4-expanded-imp"
description = "Replacement-crate validation for the reviewed KRS layer-2 IMP expansion"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "krs_m4_expanded_imp"
path = "src/lib.rs"

[dependencies]
k = { package = "krs", path = "../../../crates/krs" }

[package.metadata.krs]
k-namespace = "KRS-M4-COMPLETE-IMP"

[package.metadata.krs.definitions.main]
root = "crate"
syntax-root = "crate"

[workspace]
resolver = "3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
