version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
k = { package = "krs", path = "../../../../crates/krs" }
k-rust = { version = "=0.4.0", path = "../../../../../inspirations/midnightntwrk/k-rust-krs-main/crates/k-rust", default-features = false, features = ["z3-inference"] }
krs-compiler = { path = "../../../../crates/krs-compiler" }
