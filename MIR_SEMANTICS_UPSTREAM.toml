[[issue]]
id = "constant-index-from-end-read-write-disagreement"
status = "local-correction"
area = "kmir/src/kmir/kdist/mir-semantics/rt/data.md"
summary = "The from-end ConstantIndex traversal reads a different element than it records for persistent writes"
reproduction = "Traverse Range([7, 8, 9]) with projectionElemConstantIndex(1, 3, true), first as a copied read and then as the target of a write."
documented = "The ProjectionElem description states that from_end indexes from the end, and the traversal context records MINLEN -Int OFFSET."
observed = "The read value is getValue(ELEMENTS, OFFSET), selecting element 1, while CtxIndex records MINLEN -Int OFFSET, selecting element 2 when rebuilding a write."
impact = "The same valid Stable MIR place denotes different elements for reads and writes whenever the end-relative offset differs from its front-relative position."
local_fix = "KRS selects MINLEN -Int OFFSET for both reads and persistent writes, requires MINLEN ==Int size(ELEMENTS), and qualifies offsets 1 and 2 through K-Rust."
upstream_action = "Change the from-end traversal read to getValue(ELEMENTS, MINLEN -Int OFFSET) and add paired read/write regressions over an asymmetric three-element Range."
