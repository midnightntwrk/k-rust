# The guide "Mutation testing a KRS specification" (/verification/mutation-testing): the story's
# package. Steps 1-3 run the story's corpus story/plus/kink/ (its four cases) with the guide's
# mutation files (--mutations guide/mutations); step 4 and after run the guide's corpus
# story/plus/guide/ (the story's cases plus t5). Step 1 also shows story-kink-results. The JSON
# documents of results and check name k-rust's build, so only one member of each is recorded:
# results' summary, check's mutations.
[[output]]
id = "mutation-testing-results"
fixture = "story/plus"
package = "story-plus"
definition = "main"
args = ["kink", "results", "--locked"]
select = "summary"

[[output]]
id = "mutation-testing-check"
fixture = "story/plus"
package = "story-plus"
definition = "main"
args = ["kink", "check", "--mutations", "guide/mutations", "--locked"]
select = "mutations"

[[output]]
id = "mutation-testing-check-refused"
fixture = "story/plus"
package = "story-plus"
definition = "main"
args = ["kink", "check", "--corpus", "guide", "--mutations", "guide/refused.toml", "--locked"]
select = "mutations"

[[output]]
id = "mutation-testing-run-before"
fixture = "story/plus"
package = "story-plus"
definition = "main"
args = ["kink", "run", "--mutations", "guide/mutations", "--full", "--output", "verdicts", "--locked"]

# fuzz reads the last run document of the corpus, run-before's above, for the survivor's
# witnesses; its document names k-rust's build, so only the mutation's row as fuzz read it
# (status and witnesses) and the case it found are recorded.
[[output]]
id = "mutation-testing-fuzz"
fixture = "story/plus"
package = "story-plus"
definition = "main"
args = ["kink", "fuzz", "--templates", "guide/TEMPLATES.toml", "--template", "t4-second", "--kill", "survivors/one", "--mutations", "guide/mutations", "--locked"]
select = ["template.last_run.mutation", "program"]

[[output]]
id = "mutation-testing-run-after"
fixture = "story/plus"
package = "story-plus"
definition = "main"
args = ["kink", "run", "--corpus", "guide", "--full", "--output", "verdicts", "--locked"]

[[output]]
id = "mutation-testing-run-refused"
fixture = "story/plus"
package = "story-plus"
definition = "main"
args = ["kink", "run", "--corpus", "guide", "--mutations", "guide/refused.toml", "--output", "verdicts", "--locked"]

[[output]]
id = "mutation-testing-emit-check"
fixture = "story/plus"
package = "story-plus"
definition = "main"
args = ["kink", "emit", "--corpus", "guide", "--check"]
