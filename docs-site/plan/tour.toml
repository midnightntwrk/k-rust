schema = 2
title = "K tour"
audience = "Rust developers who do not know K; KRS is the teaching language"

# The tour teaches the 44 K concepts in dependency order: lessons in Parts, the IMP milestone, and a
# KRS side track. A topic is one implemented construct or semantic distinction (the review checklist of
# "comprehensive"); each belongs to a K concept, a side-track lesson, or a reference page.
# A topic's destination is its lesson's route once the lesson is accepted, and its `page` until then.

[status]
current = "Implemented and evidenced by production tests or a canonical semantics port"
qualified = "Implemented for a bounded shape; the page must state the boundary"
reference = "Implemented explicit/reference surface; not the preferred first spelling"
unqualified = "Accepted by some parser or API surface but lacks a positive end-to-end specimen"
open = "A current design question; do not resolve silently"
unsupported = "Not a current public language feature"

[coverage]
tour = "Taught by the lesson of its K concept"
krs = "Taught by a KRS side-track lesson"
reference = "Documented by the feature and builtin reference"
limitation = "Documented by the boundaries page as a limitation or open question"

[lesson_status]
planned = "No page yet; the topic's page is its destination"
drafting = "A page exists and is being written; it is in the sidebar"
in-review = "Written and awaiting Sebastien's reading"
accepted = "Reviewed; the lesson's route is the destination of its topics"

[surface_review]
cli_commands = ["fmt", "check", "expand", "emit-k", "build", "parse", "run", "search", "prove"]
metadata_keys = ["k-namespace", "int-literals", "allow-raw-k", "profile"]
macro_exports = ["alias", "anonymous", "associativity", "bracket", "bytes", "cell", "cells", "claim", "configuration", "constructor", "constructors", "context", "context_alias", "desugar", "ensures", "equation", "exists", "fragment", "fresh", "function", "id", "init", "is", "k", "layout", "lexeme", "lexical", "map", "matches", "or_bool", "precedence", "priority", "project", "raw_k", "requires", "rewrite", "rule", "rules", "seqstrict", "simplification", "sort", "sorts", "spec_module", "strict", "subsort", "symbol", "syntax_list", "term", "token"]
builtin_operations = ["abs", "add", "and", "and_then", "big_endian", "bit_and", "bit_not", "bit_or", "bit_range", "bit_xor", "ceil", "chr", "concat", "contains", "difference", "div", "div_euclid", "divides", "empty", "eq", "exponent_bits", "find", "floor", "from_bool", "from_int", "from_int_no_len", "from_list", "from_string", "ge", "get", "get_or_default", "gt", "implies", "in_keys", "intersect", "is_infinite", "is_nan", "is_subset", "ite", "item", "keys", "keys_list", "le", "length", "little_endian", "log", "log2", "lt", "make", "max", "max_value", "min", "mul", "ne", "neg", "not", "or", "or_else", "ord", "pad_left", "pad_right", "pow", "pow_mod", "precision", "putc", "range", "rem", "rem_euclid", "remove", "remove_all", "replace_at", "reverse", "root", "round", "shift_left", "shift_right", "sign", "sign_extend_bit_range", "signed", "size", "sqrt", "sub", "substr", "to_bool", "to_int", "to_list", "to_string", "trunc", "union", "unsigned", "update", "update_all", "values", "write", "xor"]
topic_status_sha256 = "45b4c2143945ce0d88de4dc7a68f7e9f047ef50900ecd0301a8053245dd20893"

# Browser lessons: pages that compile a checked fixture in the reader's browser.
# `seed` is the docs-site mirror the editor starts from; sync-snippets.mjs keeps
# it byte-identical to `fixture`. A published lesson is in the primary sidebar;
# a deferred one must stay out of it.
[[browser_lesson]]
id = "tour-minimal-browser"
route = "/lessons/tour-minimal"
status = "published"
fixture = "tests/tour-minimal/src/lib.rs"
seed = "../docs-site/src/snippets/tour-minimal.rs"

[[synthesis]]
id = "five-minute-theory"
route = "/start/five-minute-theory"
status = "published"
requires = [
    "host-object-split",
    "symbolic-terms",
    "declarative-relational-rules",
    "open-sorts",
    "subsort-membership",
    "framework-sorts",
    "core-builtins",
    "constructor-families",
    "syntax-templates",
    "precedence-associativity",
    "fixed-configurations",
    "configuration-init",
    "single-item-sequence",
    "rule-tables",
]
note = "Publish only after every required concept has a canonical destination and the page's hover/focus glosses and links are generated from this ledger rather than maintained as a second glossary."

