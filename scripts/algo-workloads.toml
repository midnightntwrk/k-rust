# IMP summation loop; the loop runs n + 1 times and the result binds sum to n(n + 1)/2.
[[workload]]
name = "imp-krun-sum"
command = "krun"
weight = "light"
prepare = ["imp-definition"]
pins = ["k", "imp"]
args = [
  "--definition", "${prepared}/imp-definition",
  "--sort", "Stmt",
  "-c", "ENV=.Map",
  "${input}",
]
[workload.ladder]
param = "n"
values = [10, 100, 1000, 3000, 10000]
stop_seconds = 120
input = """
sum = 0;
n = ${n};
k = 0;
while (k <= n) {
  sum = sum + k;
  k = k + 1;
}
"""
[workload.check]
expect = "n * (n + 1) // 2"
stdout_squeezed = ['inj{SortId{},SortKItem{}}(\dv{SortId{}}("sum")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}"))']

# FUN untyped programs from K's tutorial: ackermann.fun and the single-branch controls.
# Each check requires the one result to bind V to the integer the tutorial's expected output names.
[[workload]]
name = "fun-ackermann"
command = "krun"
weight = "light"
prepare = ["fun-untyped"]
pins = ["k"]
args = [
  "--definition", "${prepared}/fun-untyped",
  "--sort", "Exp",
  "--pattern", "<k> V:K </k>",
  "${k}/pyk/regression-new/pl-tutorial/2_languages/3_fun/programs/ackermann.fun",
]
[workload.check]
expect_out = "${k}/pyk/regression-new/pl-tutorial/2_languages/3_fun/1_untyped/1_environment/tests/ackermann.fun.out"
stdout_squeezed = ['\equals{SortK{},SortGeneratedTopCell{}}(VarV:SortK{},kseq{}(inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}")),dotk{}()))']
stdout_absent = ['\or{']

