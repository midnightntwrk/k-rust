# constructor-list-length with the list built by the program: length (build n) is n, and the
# list of n constructors is the growing input.
# The printed result carries the whole <store>, every closure the run allocated: 39 MB at n=100,
# 1.3 GB at n=300, 34 GB at n=1000.
# krun writes it as it renders, and the recorder reads it as a stream, keeping its size, SHA-256 and first 64 KiB.
# Search filters the externalized result without copying it, so peak RSS is about one copy of that pattern:
# with krust at ca771053, n=1000 measured 62.4 s and 1.09 GiB and printed 33 659 357 067 bytes;
# n=300 measured 2.9 s and 0.19 GiB.
[[workload]]
name = "fun-build-list-length"
command = "krun"
weight = "light"
prepare = ["fun-untyped"]
pins = ["k"]
args = [
  "--definition", "${prepared}/fun-untyped",
  "--sort", "Exp",
  "--pattern", "<k> V:K </k>",
  "${input}",
]
[workload.ladder]
param = "n"
values = [10, 30, 100, 300, 1000]
stop_seconds = 120
input = """
datatype 'a mylist = Nil | Cons('a, 'a mylist)

letrec build = fun 0 -> Nil | n -> Cons(n, build (n - 1))
and length = fun Nil -> 0 | Cons(h,t) -> 1 + length t
in length (build ${n})
"""
[workload.check]
expect = "n"
stdout_squeezed = ['\equals{SortK{},SortGeneratedTopCell{}}(VarV:SortK{},kseq{}(inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}")),dotk{}()))']
stdout_absent = ['\or{']

# Heavy compiles: benchmark.sh's KEVM compile phase and the WASM and MIR cases of
# scripts/reference-differential.toml in both pairings. The haskell/rust pairing (--backend rust,
# with --md-selector "k & ! concrete") peaked at 20.5 GiB (WASM) and 29.2 GiB (MIR) at 9c81f35b,
# almost all of it while writing execution.json, so those two
# workloads carry a 40 GiB scope.
[[workload]]
name = "kevm-compile"
command = "kcompile"
weight = "heavy"
pins = ["k", "kevm", "kevm-plugin"]
args = [
  "${evm}/tests/specs/functional/slot-updates-spec.k",
  "--main-module", "VERIFICATION",
  "--syntax-module", "VERIFICATION",
  "--for-proving",
  "--output-directory", "${run}/compiled",
  "--builtin-directory", "${builtin}",
  "-I", "${evm}/kevm-pyk/src/kevm_pyk/kproj/evm-semantics",
  "-I", "${evm}/kevm-pyk/src/kevm_pyk/kproj/plugin",
  "--hook-namespaces", "JSON,KRYPTO",
  "--md-selector", "k & ! concrete",
]
[workload.check]
files = ["${run}/compiled/definition.kore", "${run}/compiled/krust.json"]

[[workload]]
