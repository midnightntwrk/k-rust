# constructor-list-length with the list built by the program: length (build n) is n, and the
# list of n constructors is the growing input.
# The printed result carries the whole <store>, every closure the run allocated: 39 MB at n=100,
# 1.3 GB at n=300, 34 GB at n=1000.
# krun writes it as it renders, and the recorder reads it as a stream, keeping its size, SHA-256 and first 64 KiB.
# The store's closures share their environments in the backend term, and the KORE text writes each shared
# subterm out at every use, so the text grows much faster than the term. Search filters, orders and prints
# the result by reading the backend terms node by node (backend.search.output), never as a KORE tree:
# n=1000 prints 33 659 357 067 bytes with a peak RSS of about 80 MiB (1.05 GiB when the tree was built);
# with stdout sent to /dev/null it takes about 3 s, so a recorder that hashes the text is bound by hashing.
[[workload]]
name = "fun-build-list-length"
command = "krun"
weight = "light"
prepare = ["fun-untyped"]
pins = ["k"]
args = [
  "--definition", "${prepared}/fun-untyped",
  "--sort", "Exp",
  "--pattern", "<k> V:K </k>",
  "${input}",
]
[workload.ladder]
param = "n"
values = [10, 30, 100, 300, 1000]
stop_seconds = 120
input = """
datatype 'a mylist = Nil | Cons('a, 'a mylist)

letrec build = fun 0 -> Nil | n -> Cons(n, build (n - 1))
and length = fun Nil -> 0 | Cons(h,t) -> 1 + length t
in length (build ${n})
"""
[workload.check]
expect = "n"
stdout_squeezed = ['\equals{SortK{},SortGeneratedTopCell{}}(VarV:SortK{},kseq{}(inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}")),dotk{}()))']
stdout_absent = ['\or{']

