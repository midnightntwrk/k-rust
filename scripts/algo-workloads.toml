# Workloads recorded by scripts/algo-receipt.sh as algorithm cost receipts.
#
# Placeholders: the checkout roots of scripts/reference-manifest.py (${workspace}, ${k}, ${imp},
# ${wasm}, ${evm}, ${mir}, each overridable by the same environment variable), ${builtin} (K's
# builtin directory), and three directories the recorder supplies:
#   ${prepared}  prepare-step outputs, shared by the workloads and keyed by the krust binary's
#                digest, so a rebuilt binary prepares again;
#   ${run}       the measured command's scratch directory (compiled output), emptied per run;
#   ${input}     the generated input file of a ladder workload.
# A ladder workload also substitutes its parameter by name (for example ${n}).
#
# Keys of a [[workload]]:
#   command     kcompile, kprove, krun or kore-rpc; the recorder adds --timings, --trace-aggregate and
#               KRUST_COUNTERS and redirects standard input from /dev/null
#   weight      light (recorded with --repeat 3) or heavy (once, under the memory guard)
#   memory_gib  heavy only: the guard's scope in GiB instead of its 16 GiB default
#   pins        [reference.*] sections of scripts/reference-differential.toml whose checkouts must
#               be at their pinned revision (k, imp, kevm, kevm-plugin, wasm, mir)
#   args        the measured command's arguments after the subcommand
#   prepare     names of [[prepare]] steps, run in order before the measured command; a step has
#               a command, its args, and the file it creates, and is skipped when that file exists
#   [workload.check]      the output check: exit status (default 0), stdout substrings,
#               stdout_squeezed substrings (compared with all whitespace removed from stdout),
#               stdout_absent substrings, and files that must exist and be non-empty;
#               ${expect} is the value of `expect` (an integer expression in the ladder parameter)
#               or, with `expect_out`, the integer that K's `V:K #Equals <int> ~> .K` output file
#               binds
#   [workload.ladder]     param, values (ascending), stop_seconds (a run slower than this ends the
#               ladder), and input: the template written to ${input} for each value

version = 1

# Unmeasured steps a workload names in `prepare`, run in order before it is measured.
[[prepare]]
name = "imp-proof-definition"
command = "kcompile"
creates = "${prepared}/imp-proof-definition/parsed.provenance.json"
args = [
  "${imp}/src/kimp/kdist/imp-semantics/imp.k",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--for-proving",
  "--output-directory", "${prepared}/imp-proof-definition",
  "--builtin-directory", "${builtin}",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]

[[prepare]]
name = "imp-specification"
command = "kcompile"
creates = "${prepared}/imp-specification/krust.json"
args = [
  "${imp}/examples/specs/imp-simple-spec.k",
  "--compiled-definition", "${prepared}/imp-proof-definition",
  "--main-module", "IMP-SIMPLE-SPEC",
  "--definition-module", "IMP-VERIFICATION",
  "--for-proving",
  "--output-directory", "${prepared}/imp-specification",
  "--builtin-directory", "${builtin}",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]

[[prepare]]
name = "imp-definition"
command = "kcompile"
creates = "${prepared}/imp-definition/runtime.json"
args = [
  "${imp}/src/kimp/kdist/imp-semantics/imp.k",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--output-directory", "${prepared}/imp-definition",
  "--builtin-directory", "${builtin}",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]

[[prepare]]
name = "fun-untyped"
