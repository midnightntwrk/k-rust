"""
[workload.check]
stdout = ['"result"']
files = ["${run}/response.json", "${run}/rpc-metrics.json"]

# Heavy compiles: benchmark.sh's KEVM compile phase and the WASM and MIR cases of
# scripts/reference-differential.toml in both pairings. The haskell/rust pairing (--backend rust,
# with --md-selector "k & ! concrete") peaked at 20.5 GiB (WASM) and 29.2 GiB (MIR) at 9c81f35b,
# almost all of it while writing execution.json, so those two
# workloads carry a 40 GiB scope.
[[workload]]
name = "kevm-compile"
command = "kcompile"
weight = "heavy"
pins = ["k", "kevm", "kevm-plugin"]
args = [
  "${evm}/tests/specs/functional/slot-updates-spec.k",
  "--main-module", "VERIFICATION",
  "--syntax-module", "VERIFICATION",
  "--for-proving",
  "--output-directory", "${run}/compiled",
  "--builtin-directory", "${builtin}",
  "-I", "${evm}/kevm-pyk/src/kevm_pyk/kproj/evm-semantics",
  "-I", "${evm}/kevm-pyk/src/kevm_pyk/kproj/plugin",
  "--hook-namespaces", "JSON,KRYPTO",
  "--md-selector", "k & ! concrete",
]
[workload.check]
files = ["${run}/compiled/definition.kore", "${run}/compiled/krust.json"]

[[workload]]
name = "wasm-compile"
command = "kcompile"
weight = "heavy"
pins = ["k", "wasm"]
args = [
  "${wasm}/pykwasm/src/pykwasm/kdist/wasm-semantics/test.md",
  "--main-module", "WASM-TEST",
  "--backend", "llvm",
  "--output-directory", "${run}/compiled",
  "--emit-json",
  "--builtin-directory", "${builtin}",
]
[workload.check]
files = ["${run}/compiled/definition.kore"]

[[workload]]
name = "mir-compile"
command = "kcompile"
weight = "heavy"
pins = ["k", "mir"]
args = [
  "${mir}/kmir/src/kmir/kdist/mir-semantics/kmir.md",
  "--main-module", "KMIR",
  "--backend", "llvm",
  "--output-directory", "${run}/compiled",
  "--emit-json",
  "-I", "${mir}/kmir/src/kmir/kdist",
  "--md-selector", "k & ! concrete",
  "--syntax-module", "KMIR-AST",
  "--builtin-directory", "${builtin}",
]
[workload.check]
files = ["${run}/compiled/definition.kore"]

[[workload]]
name = "wasm-compile-rust"
command = "kcompile"
weight = "heavy"
pins = ["k", "wasm"]
args = [
  "${wasm}/pykwasm/src/pykwasm/kdist/wasm-semantics/test.md",
  "--main-module", "WASM-TEST",
  "--backend", "rust",
  "--output-directory", "${run}/compiled",
  "--emit-json",
  "--md-selector", "k & ! concrete",
  "--builtin-directory", "${builtin}",
]
[workload.check]
files = ["${run}/compiled/definition.kore", "${run}/compiled/execution.json"]

[[workload]]
name = "mir-compile-rust"
command = "kcompile"
weight = "heavy"
pins = ["k", "mir"]
args = [
  "${mir}/kmir/src/kmir/kdist/mir-semantics/kmir.md",
  "--main-module", "KMIR",
  "--backend", "rust",
  "--output-directory", "${run}/compiled",
  "--emit-json",
  "-I", "${mir}/kmir/src/kmir/kdist",
  "--md-selector", "k & ! concrete",
  "--syntax-module", "KMIR-AST",
  "--builtin-directory", "${builtin}",
]
[workload.check]
files = ["${run}/compiled/definition.kore", "${run}/compiled/execution.json"]
