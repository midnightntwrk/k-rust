# IMP summation loop; the loop runs n + 1 times and the result binds sum to n(n + 1)/2.
[[workload]]
name = "imp-krun-sum"
command = "krun"
weight = "light"
prepare = ["imp-definition"]
pins = ["k", "imp"]
args = [
  "--definition", "${prepared}/imp-definition",
  "--sort", "Stmt",
  "-c", "ENV=.Map",
  "${input}",
]
[workload.ladder]
param = "n"
values = [10, 100, 1000, 3000, 10000]
stop_seconds = 120
input = """
sum = 0;
n = ${n};
k = 0;
while (k <= n) {
  sum = sum + k;
  k = k + 1;
}
"""
[workload.check]
expect = "n * (n + 1) // 2"
stdout_squeezed = ['inj{SortId{},SortKItem{}}(\dv{SortId{}}("sum")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}"))']

