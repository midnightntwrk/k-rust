version = 1

# This register is the authority for every equivalence or exclusion applied by
# the reference gates. Each entry names the contract that permits it. Revisit
# oracle-specific exceptions when their reference pin changes; see docs/compatibility.md.

[[normalisation]]
id = "N1"
gate = "compile and conformance kompile"
anchor = "crates/k-rust/tests/reference_differential.rs:strip_source_metadata"
anchor_symbol = "strip_source_metadata"
anchor_helpers = ["strip_attributes"]
rule = "Drop Location and Source attributes from definitions, modules, and sentences."
justification = "Scratch checkout paths and byte offsets differ by construction."

[[normalisation]]
id = "N3"
gate = "compile semantic KORE"
anchor = "crates/k-rust/tests/reference_differential.rs:multi_alias_freezer"
anchor_symbol = "multi_alias_freezer"
anchor_helpers = [
  "strip_multi_alias_freezer_ids",
  "strip_symbol_family_ids",
  "strip_unique_id_attributes",
]
rule = "Ignore UNIQUE_ID only for freezer axioms whose shared hint has multiple generated suffixes."
justification = "Scala HashSet iteration over contexts carrying Source and Location determines the reference suffix assignment; the port retains deterministic declaration order. The limited exclusion and its counted scope are defined in docs/compatibility.md#comparison-contract."

[[normalisation]]
id = "N4"
gate = "compile and execution"
anchor = "crates/k-rust/tests/reference_differential.rs:rename_generated_variables"
anchor_symbol = "rename_generated_variables"
anchor_helpers = [
  "generated_stem",
  "rename_execution_variables",
  "execution_generated_name",
  "existential_generated_name",
  "counted_stem",
  "GeneratedNames",
  "rule_existential_name",
  "port_request_existentials",
  "port_minted_name",
  "declared_existential",
  "normalize_execution_pattern_with",
  "normalize_execution_pattern_fixing",
  "compare_paired_constraints",
  "constraint_variable_renamings",
  "canonicalize_quantifier_chains",
  "alpha_normalize_bound_variables",
  "is_canonical_free_name",
]
rule = "Alpha-normalize bound variables independently in each scope. Rename remaining generated variables by the first-occurrence index of each original name, preserving each variable's sort and distinct-name multiplicity. Definitions rename the frontend's Var'Unds'<stem>N names and keep the stem. Execution results rename, in a canonical traversal (term first, conjuncts in name-erased order, quantifier chains by renamed binder), the Var'Unds'<stem>N names, the reference's Var'Ques'<stem>N instances of rule existentials and, when K_DIFFERENTIAL_PATTERN_EXISTENTIALS lists the search pattern's ? variables (empty for a run without one), every other Var'Ques' variable (a rule existential's instance under its rule name); a Var'Ques' variable whose K name is listed or that the port result prints without a marker or counter (a search-pattern or request variable) is compared by name whatever its shape, including a <stem>N one, the NewUnifier's VarAC<n>'Unds'<counter> remainder, the port's names whose decoded spelling has an Ex#/Eq#/Rule# marker or a ! counter and, when K_DIFFERENTIAL_INITIAL_PATTERN names the initial pattern, every variable that is not free in it (rule variables Kore leaves free in a result)."
justification = "Alpha-renaming is irrelevant, but collapsing two names into one changes the pattern; the reference and the port choose different names for the same rule and remainder variables (VarAC1'Unds'1 versus Ex-hFrame-b0, VarI versus Ex-hVarI-b0); K's ? existentials are refreshed with a fresh counter by both engines and the surviving unification representative is engine-chosen (Var'Ques'Tx1 versus Var'Ques'T3 in the LAMBDA type inferencer), and only the initial pattern's variables are names both engines share."

[[normalisation]]
id = "N5"
gate = "compile and execution"
anchor = "crates/k-rust/tests/reference_differential.rs:canonicalize_existentials"
anchor_symbol = "canonicalize_existentials"
anchor_helpers = [
  "canonicalize_attributes",
  "canonicalize_pattern",
  "canonicalize_commuting_quantifier_chains",
]
rule = "For compiled definitions, sort same-kind existential and universal binder chains by canonical variable identity, sort, and kind before alpha-normalizing each scope. For execution results, enumerate blocks whose permutation count is at most 24, preserve the binding identity of every candidate, alpha-normalize each candidate, and retain the structurally least representative; larger blocks retain their original order and can only cause a conservative comparison failure."
justification = "The reference emits binders from unordered Scala sets."

[[normalisation]]
id = "N6"
gate = "compile"
anchor = "crates/k-rust/tests/reference_differential.rs:canonicalize_existentials"
anchor_symbol = "canonicalize_existentials"
rule = "Flatten and sort nested same-sort disjunctions in axioms."
justification = "Owise competitor order derives from an unordered reference set."

[[normalisation]]
id = "N7"
gate = "execution, symbolic execution, and MIR execution"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_execution_pattern"
anchor_symbol = "normalize_execution_pattern"
rule = "Flatten and sort top-level same-sort disjunctions while retaining multiplicity."
justification = "Disjunction order is semantically empty; duplicated branches remain observable."

[[normalisation]]
id = "N8"
gate = "execution, symbolic execution, and MIR execution"
anchor = "crates/k-rust/tests/reference_differential.rs:flatten_collection"
anchor_symbol = "flatten_collection"
anchor_helpers = ["normalize_execution_structure"]
rule = "Flatten, sort, and right-associate map and set concatenations."
justification = "The symbols are associative and commutative while the reference prints an internal order."

[[normalisation]]
id = "N9"
gate = "parsed-definition compile artifact"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_definition_json"
anchor_symbol = "normalize_definition_json"
anchor_helpers = [
  "normalize_definition_value",
  "canonical_regex",
  "canonical_regex_body",
]
rule = "Canonicalize regex languages, user lists, generated variables, and set-valued outer-syntax fields in parsed JSON."
justification = "The outer definition contains order-free collections and equivalent regex encodings."

[[normalisation]]
id = "N10"
gate = "kast"
anchor = "crates/k-rust/tests/reference_differential.rs:parsed_kast_matches_the_reference_frontend"
anchor_symbol = "parsed_kast_matches_the_reference_frontend"
rule = "Compare KAST JSON structurally after decoding both version-4 documents."
justification = "JSON object layout is not semantic and the reference-derived contract is structural."

[[normalisation]]
id = "N11"
gate = "rpc"
anchor = "scripts/reference-rpc-differential.sh:jq -S"
anchor_symbol = "jq -S"
rule = "Sort JSON object keys before comparing responses."
justification = "JSON object key order is not part of JSON-RPC."

[[normalisation]]
id = "N12"
gate = "proof"
anchor = "scripts/reference-proof-differential.sh:failure-claim"
anchor_symbol = "failure_claim"
rule = "Compare failure verdicts without comparing backend-specific counterexample framing."
justification = "Generated counter cells differ while the k-rust verdict word is the contract: disproved by default, or the manifest entry's failure-verdict with its failure-verdict-reason when the claim is not false (a vacuous claim is failed)."

[[normalisation]]
id = "N13"
gate = "compile"
anchor = "crates/k-rust/tests/reference_differential.rs:compare_stripped_definitions"
anchor_symbol = "compare_stripped_definitions"
anchor_helpers = ["canonical_sentence", "canonicalized_sentence"]
rule = "Compare sentences as a multiset per module while comparing module order and count exactly."
justification = "Reference sentence order follows unordered Scala collections."

[[normalisation]]
id = "N14"
gate = "concrete execution and rpc"
anchor = "scripts/reference-non-imp-execution-differential.sh:--smt none"
anchor_symbol = "--smt none"
rule = "Run the concrete reference program without SMT while the port uses its in-process solver."
justification = "Concrete cases do not need the solver; symbolic cases use the symbolic gate with both solvers enabled."

[[normalisation]]
id = "N15"
gate = "execution, symbolic execution, and MIR execution"
anchor = "crates/k-rust/tests/reference_differential.rs:compare_execution_modulo_implication"
anchor_symbol = "compare_execution_modulo_implication"
rule = "When K_DIFFERENTIAL_DEFINITION supplies a definition and structural comparison fails, pair equal term branches and prove both implications between their constraint sets."
justification = "Equivalent constraint spellings and solver-discharged requires clauses must compare equal."
env = "K_DIFFERENTIAL_DEFINITION"

[[normalisation]]
id = "N16"
gate = "execution and symbolic execution"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_execution_disjunct"
anchor_symbol = "normalize_execution_disjunct"
rule = "Drop the outer existential binders of a result disjunct that bind generated variables, stopping at the first binder of an initial-pattern variable, before generated-variable renaming."
justification = "A result variable that is not free in the initial pattern is existentially quantified over its disjunct, so an outer binder of such a variable denotes the same disjunct as its body; k-rust leaves that binder implicit. A binder of an initial-pattern variable changes the result's relation to the query's valuation, so it is kept and compared. Without an initial pattern, generated variables are recognized by the N4 name shapes. See docs/compatibility.md#execution-results."

[[normalisation]]
id = "N17"
gate = "symbolic execution"
anchor = "scripts/reference-symbolic-execution-differential.sh:gotstuck"
anchor_symbol = "gotstuck"
rule = "For a depth-bounded exec case marked gotstuck, require the reference leaves to be a sub-multiset of the port leaves."
justification = "A depth-bounded result covers every path up to the bound, so the port keeps a leaf reached at the bound when another branch halted; the reference graph traversal drops such leaves."

[[normalisation]]
id = "N18"
gate = "hook execution"
anchor = "scripts/reference-non-imp-execution-differential.sh:oracle-exception"
anchor_symbol = "oracle-exception"
rule = "Compare an adjudicated hook exception against committed port and reference expectations independently."
justification = "STRING.find must report the original-haystack index and BYTES.replaceAt must require the complete range to fit, as domains.md specifies. The separate committed expectations expose the pinned Kore deviations; see docs/compatibility.md#hook-specification-exceptions."

[[normalisation]]
id = "N19"
gate = "rpc"
anchor = "scripts/reference-rpc-differential.sh:oracle-exception"
anchor_symbol = "oracle-exception"
anchor_helpers = ["compare_simplified_implication"]
rule = "Compare an adjudicated response against committed port and reference expectations independently, require the two expectations to differ, and print the recorded reason. An exception that declares equivalence = \"simplified-implication\" must also be an equivalence: both implies responses carry an Implies payload, they are equal outside the payload, and the antecedents and the consequents of the two payloads, each simplified by krust kore-simplify against the reference definition and main module, print identically."
justification = "Known oracle-side proxy behavior must remain explicit rather than silently normalized. An exception records one specific difference, and its reason describes both sides of it. Pinning only the port lets the reference response change to something the reason no longer describes while the gate still passes; pinning both makes the recorded difference, not just its existence, the checked fact, and a change on either side a failure to adjudicate. An exception that claims the two responses are equal patterns is checked rather than asserted: simplification replaces a pattern by an equal one, so identical simplified antecedents and consequents make the two implications equal. The evidence depends on the port's simplifier, like C8. See docs/compatibility.md#rpc-behavior."

[[normalisation]]
id = "N20"
gate = "all Java-backed scripts"
anchor = "scripts/reference-memory-guard.sh:reference_default_k_opts"
anchor_symbol = "reference_default_k_opts"
rule = "Define the bounded JVM option string once in the shared guard and consume it from every Java-backed script."
justification = "One authority prevents memory-bound drift between gate scripts."

[[conformance]]
id = "C1"
rule = "Compare krun and search disjunctions as sorted multisets."
justification = "Disjunction order is not semantic; preserving multiplicity still detects duplicated branches. See docs/compatibility.md#search-results."

[[conformance]]
id = "C2"
rule = "Record K/KItem fallback separately and never fold it into the case verdict."
justification = "Parsing at K/KItem can diagnose a start-sort grammar limitation but cannot certify parsing at the requested sort."

[[conformance]]
id = "C3"
rule = "Record rejection message classes separately from verdicts."
justification = "Accept/reject parity can hide a rejection for the wrong reason."

[[conformance]]
id = "C4"
rule = "Verify each emitted definition.kore before comparing it."
justification = "A structurally comparable artifact can still violate KORE well-formedness."

[[conformance]]
id = "C5"
rule = "Compare proof verdicts without backend-specific counterexample text."
justification = "Counterexample framing is not the proof verdict."

[[conformance]]
id = "C6"
rule = "Record dropped K flags and classify untranslatable flags as unsupported."
justification = "The driver translates K recipes into the supported krust CLI contract; a missing equivalent remains unsupported. See docs/compatibility.md#cli-scope."

[[conformance]]
id = "C7"
anchor = "scripts/conformance/run.py:rename_existentials"
anchor_symbol = "rename_existentials"
anchor_helpers = [
  "pattern_existentials",
  "decoded_generated_name",
  "execution_text_diff",
  "EXISTENTIAL_TOKEN",
]
rule = "Compare kprint execution text modulo a bijective, sort-preserving renaming of existential variables, the `?Name:Sort` tokens outside string literals, renamed by first occurrence per disjunct before the C1 sort. Encoded names are decoded before indexing; a decoded Rule#/Ex#/Eq# marker or ! counter identifies a generated name. The reference's `Var'Ques'` existential shape remains recognized. Every other variable, including the search pattern's, is compared literally, and a `?` variable named in the recipe's --pattern text is fixed too."
justification = "`?` is K's marker for a rule existential and kprint prints that shape only for Var'Ques' names; the reference instantiates them through Kore's fresh counter and keeps an engine-chosen unification representative, which N4 already classes as engine-named. Renaming by first occurrence preserves sharing, so `?A -> ?A` and `?A -> ?B` stay distinct. See docs/compatibility.md#comparison-contract."

[[conformance]]
id = "C8"
anchor = "scripts/conformance/run.py:compare_simplified_kore"
anchor_symbol = "compare_simplified_kore"
anchor_helpers = [
  "reference_kore_args",
  "simplify_kore",
  "SIMPLIFIED_KORE_COMPARISON",
]
rule = "When the C7 text comparison of a krun or search step fails, re-run the reference recipe with --output kore, simplify that result and the krust result with `krust kore-simplify` against the reference kompiled definition and main module, and compare the two simplified patterns with reference_differential::executed_kore_matches_the_reference_backend without K_DIFFERENTIAL_DEFINITION, so N4 renaming applies and N15 does not; the driver passes the `?` variables of the recipe's --pattern in K_DIFFERENTIAL_PATTERN_EXISTENTIALS, so N4 renames every other `?` variable as a rule existential, as C7 does for `?` tokens. A step that matches only this way records a distinct comparison label and keeps the text difference; the checked-in .out stays the oracle, so the re-run's result must still print as the .out. An unavailable or failing reference re-run, simplification, or comparison leaves the text mismatch in place."
justification = "The pinned reference prints a rewrite result before its own simplification is complete: no-junk-macro retains a residual constraint the definition's smt-lemma axioms make valid and concrete-function leaves a function application over a term whose definedness is open unevaluated, while the port's rewriter discharges and applies them; both are equal patterns (docs/compatibility.md#comparison-contract). Simplifying both results with one simplifier makes the represented patterns comparable. The evidence is supplementary because it depends on the port's simplifier, like N15 (docs/testing.md#comparator-evidence)."

[[conformance]]
id = "C9"
anchor = "scripts/conformance/run.py:compare_stdout_buffer"
anchor_symbol = "compare_stdout_buffer"
anchor_helpers = ["C9_STDOUT_COMPARISON", "conformance_stdout_stream_buffers"]
rule = "For a plain krun --output none recipe with a non-empty checked-in output, execute krust under --io off, parse its KORE result structurally, require exactly one execution leaf in total, require that leaf to be unconstrained and to contain exactly one stdout stream of the form ListItem(#ostream(1)) ListItem(\"off\") ListItem(#buffer(S)), and compare the exact bytes of S with the checked-in output. Any constrained residual leaf is a reported mismatch rather than an ignored alternative. An explicit --io on recipe is not transformed. When krust reports that a STDIN-STREAM rule produced an undefined result and the input begins with a parse delimiter or contains adjacent parse delimiters under the compiled definition's delimiter set, retain the attributed C9 failure and drive an otherwise implicit recipe separately under pre-buffered --io on --output none."
justification = "The language tutorials' stream rules (domains.md:2805-2846) append the same strings to #buffer in both IO modes; the on mode flushes that buffer through IO.write while the off mode retains it. K itself selects off for search and debug (krun:442-448). The buffered and interactive tokenizations agree only without leading or adjacent delimiters: domains.md:2746-2754 consumes one delimiter after an integer from a complete buffer, while domains.md:2757-2765 trims a delimiter only when the interactive buffer contains at most one character. The buffered tokenization can pass an empty string to String2Int after adjacent delimiters, while the interactive tokenization does not. C9 therefore remains the independent definition-computed oracle wherever its input premise holds; the separate committed transcript drives only the recipe that violates that premise. See docs/compatibility.md#comparison-contract."

[[conformance]]
id = "C10"
anchor = "scripts/conformance/run.py:kore_output_comparison_environment"
anchor_symbol = "kore_output_comparison_environment"
anchor_helpers = ["KORE_OUTPUT_COMPARISON"]
rule = "Compare a krun or search step whose checked-in output is KORE (--output kore) with reference_differential::executed_kore_matches_the_reference_backend, passing the `?` variables of the recipe's --pattern in K_DIFFERENTIAL_PATTERN_EXISTENTIALS, empty when the recipe has none, so N4 renames every other `?` variable of either result as a rule existential by a bijective, sort-preserving renaming per disjunct, as C7 does for kprint's `?` tokens. A `?` variable the krust result prints without a marker or counter is a request variable and is compared by name on both sides, as are the search pattern's, whatever their shape (a `?X1` stays fixed rather than being read as a counted instance of a rule's `?X`). N15 applies when the reference kompiled definition exists."
justification = "K quantifies a rule's `?` variable existentially at the top of its right-hand side, so a result variable that instantiates it denotes some value and is quantified over its own disjunct (docs/compatibility.md#result-variables): only the initial pattern's variables are names a result shares with the query. Two results that differ by a consistent renaming of the other variables therefore denote the same configurations; identifying two of them, splitting one, or changing a sort changes the pattern and stays a difference. The port prints every variable it introduces with a marker or counter and every request variable verbatim (docs/compatibility.md#variable-names), which is how C10 keeps request `?` variables fixed. See docs/compatibility.md#comparison-contract."

[[normalisation]]
id = "N21"
gate = "execution, symbolic execution, and MIR execution"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_conjunctions"
anchor_symbol = "normalize_conjunctions"
rule = "Flatten and structurally order nested same-sort conjunctions of a result disjunct, then drop duplicated conjuncts before splitting it into term and constraints. Quantifier-block candidates are alpha-normalized before their conjunctions are ordered."
justification = "Kore prints a rewritten branch as \\and(\\and(term, predicate), substitution) with right-nested predicate conjunctions that repeat the AC solution's in_keys condition; conjunction is associative, commutative and idempotent."

[[normalisation]]
id = "N22"
gate = "symbolic execution"
anchor = "crates/k-rust/tests/reference_differential.rs:canonicalize_remainder_existentials"
anchor_symbol = "canonicalize_remainder_existentials"
rule = "Quantify, inside a negated existential constraint, every generated variable that is free in it and occurs nowhere else in the disjunct."
justification = "Kore/Rewrite/Remainder.hs existentiallyQuantifyRuleVariables quantifies only the rule variables of a unification solution and leaves the NewUnifier's fresh AC remainder free in the printed remainder; the port quantifies it, which is the reading under which the remainder excludes every instance of the rule."

[[normalisation]]
id = "N23"
gate = "compile and conformance kompile"
anchor = "crates/k-rust/tests/reference_differential.rs:strip_multi_suffix_lambda_ids"
anchor_symbol = "strip_multi_suffix_lambda_ids"
anchor_helpers = [
  "multi_suffix_lambda",
  "multi_suffix_lambda_family",
  "strip_symbol_family_ids",
  "strip_unique_id_attributes",
]
rule = "Collapse every generated `#lambda<h1>_<h2>_<n>` symbol of a multi-suffix family onto the family's unsuffixed name, in declarations and uses alike, and ignore UNIQUE_ID only for the axioms that mention such a family; single-suffix hints keep their identity. The collapsed axiom count is printed per case."
justification = "ResolveFun.getUniqueLambdaLabel numbers identical hints in `stream(m.localSentences())` order, a Scala HashSet order over sentence hashes that include the Source path, and the pinned reference assigns the suffixes differently from two checkout paths (issue-1528, let-test, record-llvm); the port keeps deterministic declaration order. The collapsed sentence multiset still compares every lambda's signature and rule body; docs/compatibility.md#comparison-contract records the scope and tradeoff."

[[normalisation]]
id = "N24"
gate = "execution, symbolic execution, and MIR execution"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_execution_equalities"
anchor_symbol = "normalize_execution_equalities"
rule = "Order the operands of ML equality. Rewrite equality of the generated total `LblisKResult` predicate with false as the negation of its equality with true."
justification = "ML equality is symmetric, and generated isKResult has a total two-valued SortBool result. The reference and the port choose different but equivalent orientations when they externalize residual isKResult conditions; arbitrary SortBool patterns remain unchanged because they may be partial."

[[normalisation]]
id = "N25"
gate = "generated Bison parser output"
anchor = "crates/k-rust/tests/reference_differential.rs:canonicalize_ambiguities"
anchor_symbol = "canonicalize_ambiguities"
anchor_helpers = [
  "ambiguity_stats",
  "valid_amb_sort",
  "flattened_amb_alternative_count",
  "pattern_children",
  "rebuild_bottom_up",
  "rebuild_pattern_node",
]
rule = "Only for a manifest row explicitly classified as ambiguous, require both parser outputs to be complete KORE patterns, recursively flatten same-sort binary Lblamb trees, retain duplicate alternatives, sort alternatives by compact KORE bytes, and rebuild a deterministic binary tree. Every unambiguous parser output must remain byte-identical."
justification = "Alternative order in a generated GLR grammar can change the nesting of an ambiguity tree without changing its alternatives. The manifest authorizes this test-only transformation only for individually reviewed ambiguous inputs; generated scanner and grammar source bytes are outside the compatibility contract."
env = "K_BISON_PARSER_COMPARISON=amb"

[[normalisation]]
id = "N46"
gate = "generated Bison parser output"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_location_positions"
anchor_symbol = "normalize_location_positions"
anchor_helpers = ["rebuild_bottom_up", "pattern_children", "rebuild_pattern_node"]
rule = "Only for a manifest row individually reviewed and classified as locations (bison-parser-library, locations, locations2 and locations3), require both parser outputs to be complete KORE patterns without Lblamb, require every Lbl'Hash'location application to have one sort parameter, six arguments and SortInt decimal literals as its last four, remove those four line and column arguments on both sides, and require the results to be equal and the reference to contain at least one location. The located terms, their file names and every other term remain compared; the comparison prints the number of locations."
justification = "Both parsers locate the same tokens, but number lines and columns by different conventions (docs/compatibility.md#generated-parser-locations), so the four integers cannot agree byte for byte. krust's numbers are checked against its own convention by the CLI location test (kast_gen_parser_locations_number_lines_and_columns_as_the_in_process_parser)."
env = "K_BISON_PARSER_COMPARISON=locations"

[[normalisation]]
id = "N48"
gate = "symbolic execution"
anchor = "crates/k-rust/tests/reference_differential.rs:reference_finds_no_instance"
anchor_symbol = "reference_finds_no_instance"
anchor_helpers = [
  "pair_disjuncts",
  "executed_kore_matches_the_reference_backend",
]
rule = "When the gate supplies the reference kore-exec (K_REFERENCE_KORE_EXEC), drop a reference result disjunct that pairs with no port disjunct only when the reference's own search mode, run from that disjunct (`kore-exec --search VarResult --searchType STAR --depth 0`), returns `\\bottom`, and log each one dropped. A port disjunct is never dropped, and no port tool decides the emptiness."
justification = "A pattern `t ∧ φ` denotes `⌈t⌉ ∧ t ∧ φ`, and the reference's search assumes its initial pattern defined, so `\\bottom` there means the disjunct's constraints refute its own term's definedness: it is empty, and the disjunction denotes the same configurations with or without it. The pinned reference's execute mode reports the instances of a symbolic initial configuration on which the configuration is itself undefined as a stuck leaf; k-rust reports no leaf for them and names the condition in a diagnostic. The decision is the reference's, so a branch the port loses is not excused by the port's own reasoning. See docs/compatibility.md#undefined-instances-of-the-initial-configuration."

[[normalisation]]
id = "N26"
gate = "execution"
anchor = "crates/k-rust/tests/reference_differential.rs:compare_execution_any_membership"
anchor_symbol = "compare_execution_any_membership"
anchor_helpers = [
  "pair_disjuncts",
  "executed_kore_matches_the_reference_backend",
]
rule = "For an any-strategy run, require the port result to be a non-empty sub-multiset of the reference all-strategy result: every port disjunct pairs with a distinct reference disjunct by equal term and N4/N15-equal constraints; unpaired reference disjuncts are allowed and counted."
justification = "A single-successor execution is one member of the successor set; which member an engine follows among equal-priority rules is engine-internal, exactly as docs/compatibility.md#search-results already states for --bound N. The port's --strategy all runs stay under the exact multiset comparison (N7)."
env = "K_DIFFERENTIAL_STRATEGY=any"

[[normalisation]]
id = "N27"
gate = "rpc"
anchor = "scripts/reference-rpc-differential.sh:next-states"
anchor_symbol = "normalize_rpc_response"
rule = "Compare the next-states array of an execute response as a multiset: sort both sides by canonical JSON (jq -S, tojson) before diffing; keep length and every element field."
justification = "Booster lists branches in its internal rule order and the port in its own; the successor set, not its order, is the RPC contract. See docs/compatibility.md#search-results."

[[normalisation]]
id = "N28"
gate = "rpc"
anchor = "scripts/reference-rpc-differential.sh:error-data"
anchor_symbol = "normalize_rpc_response"
anchor_helpers = ["normalize_backend_error_class"]
rule = "For a backend error response (error.code in 1..9), compare code, message, and each detail's error string; reduce every context array to its JSON type and drop term. Responses with a per-response reduction branch keep that stricter branch."
justification = "The context lines are Kore's error-context stack and Claim.hs diagnostic framing, and the extra simplify detail is Booster's two-interpretation attempt order; pyk joins context into an exception message and no client parses it. The class of a rejection (code, message, error sentence) is the contract, as C3 states for the conformance driver. See docs/compatibility.md#rpc-behavior."

[[normalisation]]
id = "N40"
gate = "rpc"
anchor = "scripts/reference-rpc-differential.sh:rule-substitution"
anchor_symbol = "normalize_rule_substitution_keys"
rule = "In every rule-substitution of a response, before N27, map the name of the variable on the left of each equality, the applied rule's variable, from the port's escaped marker spelling Rule-h<X> (with -- read as -, -h as #, -b as !, -a as @) and from Booster's Rule<X> to Rule#<X>, keeping a leading @ of a set variable. The bound values and every other name are compared as printed."
justification = "A rule-substitution relates the variables of the applied rule to terms over the state's variables in one predicate, so each engine prints a rule variable with a marker that keeps it apart from a state variable of the same name in the definition. Which marker spelling an engine uses is not part of the contract; the rule variable it denotes, the definition's name X, is. The port's spelling is the injective escape of docs/compatibility.md#variable-names; Booster's drops the #. See docs/compatibility.md#rpc-behavior."

[[normalisation]]
id = "N30"
gate = "compile"
anchor = "crates/k-rust/tests/reference_differential.rs:canonicalize_no_confusion_pairs"
anchor_symbol = "canonicalize_no_confusion_pairs"
anchor_helpers = ["is_application_over_variables", "no_confusion_conjunct_key"]
rule = "For the no-confusion axioms `\\not(\\and(P(X0..), Q(Y0..)))` (the `constructor{}()` family, identified by their shape: a top-level negated binary conjunction of two applications over variables), order the two conjuncts by symbol and argument sorts and rename the free variables by position before the N13 multiset comparison. The comparison prints the number of pairs canonicalised on both sides."
justification = "K emits one axiom per unordered pair of distinct constructors of a sort and puts the `Production.ord`-smaller production on the `X` side; the port puts the earlier-declared one there. `\\and` is commutative and the free names are alpha-equivalent under the axiom's closure, so the canonical form hides nothing semantic."

[[normalisation]]
id = "N31"
gate = "parsed-definition compile artifact"
anchor = "crates/k-rust/tests/reference_differential.rs:canonicalize_local_function"
anchor_symbol = "canonicalize_local_function"
rule = "In parsed JSON, rewrite every `#fun3` application with exactly three arguments `(L, R, A)` into `#fun2(L => R, A)` (a KRewrite body); label sort parameters are already erased by N9. A `#fun2` over a non-rewrite body, `#let`, and every other label are unchanged, so a difference in L, R or A remains visible."
justification = "parsed.json is the parse tree before any kompile pass. kompile lowers both labels through one path (resolve_fun.rs, resolve_application): `#fun3(L, R, A)` becomes the body `L => R` applied to `A` and `#fun2(B, A)` the body `B` applied to `A`, and the lambda depends only on that pair, never on the label's sort parameters. When both productions type a `#fun(L => R)(A)` bubble, `prefer` on `#fun2` selects it; the choice has no semantic content, and the semantic, syntax and macro KORE comparisons stay exact."

[[normalisation]]
id = "N32"
gate = "compile semantic KORE"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_unsupported_sort_predicates"
anchor_symbol = "normalize_unsupported_sort_predicates"
anchor_helpers = [
  "kore_sort",
  "sort_predicate_equation",
  "single_predicate_match",
  "injected_predicate_argument",
  "unsupported_sort_predicate_axiom",
  "owise_unsupported_disjunct",
  "kitem_subsorts",
]
rule = "On the reference side only, drop a generated sort-predicate true equation whose sole match places X:S at K through inj{S,KItem} in a one-element K sequence (or inj{S,K}), only when the KORE definition has no subsort{S,KItem} axiom. In its matching owise false equation, replace the negation of exactly that existential match disjoined with bottom by the negation of bottom; retain every other condition and sentence. A declared subsort{S,KItem} leaves both equations untouched."
justification = "A predicate takes a K argument, so isS(X:S) => true is well-sorted only if S is placeable there. Without an axiom embedding S in KItem, the injected match cannot denote a K term; its true equation is ill-sorted and its negated owise disjunct has no witness. See docs/compatibility.md#sorts-of-compiled-terms."

[[normalisation]]
id = "N33"
gate = "compile semantic and syntax KORE"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_withheld_injective"
anchor_symbol = "normalize_withheld_injective"
rule = "On the reference side only, drop `injective{}()` from a symbol declaration that also carries `anywhere{}()`, `macro{}()`, `macro-rec{}()`, `alias{}()` or `alias-rec{}()`, and only when the port declares the same symbol without `injective`. The comparison prints the number of declarations changed. Every other attribute, every symbol without one of those attributes, and a port declaration that carries `injective` stay compared."
justification = "`injective` is an axiom (equal applications have equal arguments). A symbol that heads an anywhere, overload or macro-like equation can have two applications with different arguments identified by that equation (`wrap(s(X)) = wrap(X)` gives `wrap(s(z)) = wrap(z)`), which with the constructor axioms of the arguments makes the declared theory inconsistent. The port withholds the attribute from every such head except an overload-greater production whose lesser productions are all equation-free constructors, where the overload equations preserve it. See docs/compatibility.md#anywhere-rules."

[[normalisation]]
id = "N34"
gate = "compile semantic KORE"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_withheld_overload_no_confusion"
anchor_symbol = "normalize_withheld_overload_no_confusion"
anchor_helpers = [
  "overload_greater",
  "constructor_family_symbols",
  "is_application_over_variables",
]
rule = "On the reference side only, drop the `constructor{}()` axioms of the injectivity shape `\\implies(\\and(g(X..), g(Y..)), g(..))` and of the pairwise no-confusion shape `\\not(\\and(P(X..), Q(Y..)))` that mention an overload-greater `g` (the first symbol of a `symbol-overload` attribute), only when the port declares `g` with `anywhere` and states no axiom of either shape for it. The no-junk axiom and every axiom that does not mention such a `g` stay compared. The comparison prints the number of axioms dropped."
justification = "An overload-greater `g` heads the equations `g(inj(x)) = inj(l(x))` for every production `l` below it. Its injectivity axiom holds only when every such `l` is locally injective (not a function, not assoc/comm/idem, heading no anywhere or macro-like equation); otherwise two applications of `g` with different arguments reach one value through `l`. Its disjointness axioms hold only when no production related to it in the overload order has its result sort head; otherwise an overload equation equates an application of `g` with an application of a same-sort production (`asNumber(inj(x)) = asInt(x)` against `\\not(asInt(X) ∧ asNumber(Y))`, which instantiated at `Y := inj(X)` denies the functional `asInt(X)`), or two greaters of one sort that share a lesser both equal `inj(l(x))`. The port withholds exactly those axioms, which are false in every model of the emitted equations. See docs/compatibility.md#anywhere-rules."

[[normalisation]]
id = "N35"
gate = "compile semantic and syntax KORE"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_withheld_sort_predicates"
anchor_symbol = "normalize_withheld_sort_predicates"
anchor_helpers = [
  "kitem_subsorts",
  "sort_predicate_declaration",
  "sentence_mentions_symbol",
  "constant_false_predicate_sentence",
]
rule = "On the reference side only, after N32, drop a sort predicate `LblisS{}(SortK{}) : SortBool{}` together with its functional axiom and its owise equation `LblisS(X:SortK) = false`, only when the port declares no symbol of that name, the reference declares the sort `SortS` and has no `subsort{SortS, SortKItem}` axiom, the owise equation's negated applicability disjunction is `\\bottom` and its match leaves `X` unconstrained, and no other sentence or attribute mentions the symbol. The comparison prints the number of predicates dropped. A predicate the port declares, a sort embedded in `KItem`, a remaining true equation, and any other mention leave the reference untouched."
justification = "`isS(T)` tests whether a K term is a term of `S`; without an embedding of `S` in `KItem` no K term is, so the predicate is false on every argument (N32 removes its ill-sorted true equation). The port generates sort predicates only for sorts of K terms: a numeral, a `#`-prefixed parser sort such as a user-declared `#Layout` token sort, and the kernel sorts of the term syntax and of the cell structure have none. A total function symbol that only its declaration, its functional axiom and its constant equation mention constrains nothing else in the theory, so its absence changes the meaning of no pattern that does not mention it. See docs/compatibility.md#sorts-of-compiled-terms."


[[normalisation]]
id = "N36"
gate = "compile semantic and syntax KORE"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_withheld_functional"
anchor_symbol = "normalize_withheld_functional"
anchor_helpers = ["functional_axiom_symbol"]
rule = "On the reference side, drop `functional{}()` from a symbol declaration that also carries `anywhere{}()`, `macro{}()`, `macro-rec{}()`, `alias{}()` or `alias-rec{}()`, together with that symbol's unconstrained functional axiom `\\exists{R}(Val, \\equals(Val, σ(K0..)))` whose only attribute is `functional{}()`, only when the port declares the same symbol with the same equation-head attribute, without `functional`, and states no functional axiom for it. On the k-rust side, remove the bare `value-production{}()` marker and any extra bare `function{}()` only for a matched reference value production without `function{}()`, accepting both the Rust target's marked function and the LLVM target's marked value declaration. An unmarked port value production, a malformed function in place of a bare function attribute, or a reference source function opposite a marked port value production leaves both definitions untouched. A source `function{}()` without `value-production{}()` remains compared; a partial source function heading a matching anywhere or macro equation is eligible only when the reference also carries `function{}()`. The comparison prints the number of changed declarations, removed value-production attributes and removed extra function attributes separately. Every other attribute and axiom stays compared."
justification = "An equation equates a head with its right-hand side wherever its condition holds, and a non-trivial ensures can make that right-hand side undefined. A compiler-added totality claim is justified only when every equation preserves definedness. Applications are evidently defined when their symbols are total and their arguments are defined; a self-reference or dependency cycle cannot supply evidence of its own totality, so equation heads are admitted by a least fixed point. Otherwise functional can contradict the equations by demanding a value where they state bottom. A value production's irreducible applications remain values. The Rust target's marker makes its backend retain that reading despite the extra function attribute required by equation-head verification; the external LLVM consumer does not read the marker, so the LLVM target omits function. Removing the marker and optional extra function for comparison restores the same reference value-production reading, without hiding a source function or any totality claim. See docs/compatibility.md#anywhere-rules."
[[normalisation]]
id = "N37"
gate = "compile semantic and syntax KORE, parsed definitions"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_configuration_value_transport"
anchor_symbol = "normalize_configuration_value_transport"
anchor_helpers = [
  "box_functional_axiom",
  "box_no_confusion_axiom",
  "configuration_decoder_equation",
  "remove_box_no_junk",
  "initializer_equation",
  "align_configuration_initializer_id",
  "normalize_configuration_read",
  "configuration_lookup",
  "unary_application",
  "has_kore_attribute",
  "kore_application",
  "parsed_transport_module",
  "normalize_configuration_transport_json",
  "normalize_parsed_configuration_read",
]
rule = "On the k-rust side only, remove the private #KConfigValue / #unboxKConfigValue declarations, the constructor's functional and no-confusion axioms, its no-junk alternative, and the sole inverse equation; translate only cell-initializer projections of decoded configuration-map lookups back to the reference's item transport, including its project:KItem singleton for a K read. For a translated initializer only, align its body-derived UNIQUE_ID with the reference only when the complete translated sentence matches under the existing comparison policy, excluding that identifier and source metadata. Apply the same removal to the exact private parsed module and its imports and translate only parsed initializer reads. Count rewrites and refuse the normalization if the reference declares or uses either private symbol."
justification = "The hooked Map carries KItem values, while a configuration declared at K can hold an entire K sequence. k-rust transports every normalized K payload through an ordinary private constructor and its partial decoder; the pinned reference's item transport cannot represent a whole K value soundly. The compile comparison excludes this declared transport-format difference, while every source-language equation and every other lookup, projection and constructor alternative remains compared. See docs/compatibility.md#configuration-value-transport."

[[normalisation]]
id = "N38"
gate = "reference-tool verification of kore/llvm compile output and of conformance --backend llvm recipes"
anchor = "scripts/reference-llvm-verification.py:normalize_llvm_value_productions"
anchor_symbol = "normalize_llvm_value_productions"
rule = "In a separate verification copy of the k-rust LLVM-target definition.kore (the kore/llvm compile pairing, and the conformance driver's kore-verify step of a --backend llvm recipe) only, add `function{}()` to exactly the symbol declarations carrying bare `value-production{}()`, and print the number changed. Refuse with exit 1 if a marked declaration already carries `function` or `functional`. The LLVM backend and the compile comparison consume the original definition. The Rust/Haskell pairing verifies its original definition without this normalization."
justification = "The equation-head verifier requires function or functional, but a partial value production has no evidence for functional. The external LLVM backend reads function to exclude irreducible applications from values and does not read value-production to restore them, so adding function to the executed LLVM definition would change its meaning. The verification copy supplies only the verifier's required head classification and retains the marker that the Rust target uses to restore the value reading; the original output preserves LLVM value applications. See docs/compatibility.md#anywhere-rules."

[[normalisation]]
id = "N47"
gate = "conformance kore-verify step"
anchor = "scripts/reference-llvm-verification.py:normalize_anywhere_injective"
anchor_symbol = "normalize_anywhere_injective"
anchor_helpers = ["edit_symbol_declarations"]
rule = "In the conformance driver's separate verification copy of a k-rust definition.kore only (either target; after N38 on an LLVM-target definition), add `injective{}()` to exactly the symbol declarations carrying `anywhere{}()` and no `injective` attribute, and log the number changed. The compile comparison and execution consume the original definition."
justification = "A function equation whose argument contains an anywhere head is a valid axiom, and it is consistent when its argument pattern is normal on every instance, which the compiler's critical-pair check decides and reports at load and compile time. The verifier admits such an argument only when the head is declared injective; `injective` states that equal applications have equal arguments, which an anywhere equation of the head may falsify, so the emitted definition withholds it. Supplying it in the verification copy only changes which equation arguments the verifier admits, while every other sentence and argument is still verified, so a verifier rejection is never excluded for it. See docs/compatibility.md#anywhere-heads-in-equation-arguments."

[[normalisation]]
id = "N39"
gate = "parsed-definition compile artifact"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_configuration_deferred_totality_json"
anchor_symbol = "normalize_configuration_deferred_totality_json"
rule = "On the reference side only, remove bare total from configuration-generated symbols whose totality judgement is deferred until compilation: a cell-map key projection identified by a local MAP.concat cellCollection, its wrapElement cell production and first key field, and its exact generated signature; or a nullary initializer identified by its expanded cell production (cellName, cell label, sort and cell terminals), the initializer label and result sort that cell generates (including its collection for multiplicity=*), its initializer marker, function attribute and exact nullary generated signature. Require each corresponding k-rust parsed production to be identical except for lacking total, and its sibling definition.kore to declare exactly one matching symbol with the same argument/result signature and bare total{}(). Refuse per symbol if parsed totality is already present, the parsed production differs otherwise, or compiled totality is absent. Sort and deduplicate the rewritten sentences. Count removed attributes; all other productions, attributes and final KORE claims remain compared."
justification = "A parsed definition records configuration expansion before compilation establishes totality evidence. A cell-map key projection is total only when SoleGenerator proves its equation covers every generator of the cell sort. A nullary initializer is total only when all of its equations have true ensures and defined right-hand sides, judged with the complete main-module equations and a least fixed point over child initializers. Removing the premature parsed claim aligns the stages while checking that the compiled definition still states totality; a genuinely partial initializer refuses normalization. Semantic KORE comparison continues to compare the final claim. See docs/compatibility.md#comparison-contract."

[[normalisation]]
id = "N41"
gate = "execution"
anchor = "scripts/reference-non-imp-execution-differential.sh:simplify_reference_result"
anchor_symbol = "simplify_reference_result"
anchor_helpers = ["reference-result-simplification-reason"]
rule = "For an execution case that carries reference-result-simplification-reason, and only for its program results, send the reference result (converted by the pinned kore-parser) as one simplify request to a fresh Haskell backend kore-rpc server on the case's reference definition and main module with --smt none, and compare the port's result against the state of the response (KORE JSON, which the comparator reads by its .json extension). Print the reason with the N41 label for each such comparison, and fail when the unsimplified reference result already compares equal (the step is no longer needed). scripts/reference-manifest.py refuses the key without a written reason, outside [[execution]], without programs, and beside search, any or oracle-exception. No comparison removes a disjunct on the port's own simplifier's say-so."
justification = "Simplification replaces a pattern by an equal one, so the reference's simplified result is the same pattern as its reported result, by the reference's own account; comparing the port's result against it keeps the comparison independent of the port. A reference run can report branches whose side condition it leaves in the result (star-cell-heating-set: isKResult(n) = false for an Int n, with KResult ::= Int, with or without SMT), which its own simplifier reduces to \\bottom. The step is opt-in per case because the reference's raw result is the stronger oracle form for every other case."

[[normalisation]]
id = "N42"
gate = "execution"
anchor = "scripts/reference-non-imp-execution-differential.sh:reference-kompile-options"
anchor_symbol = "reference-kompile-options"
rule = "Pass an execution case's reference-kompile-options to the reference kompile only, and print them with the case's reference-kompile-options-reason; scripts/reference-manifest.py refuses options without a reason and on any other section."
justification = "An option that changes the reference definition (--allow-anywhere-haskell removes [anywhere] rules, which the pinned Haskell kompile otherwise rejects) leaves the comparison sound only for programs that cannot reach what it changes; the reason states why that holds for the case's programs, as for star-cell-heating-set, whose programs never build a redex of its removed rule."

[[normalisation]]
id = "N43"
gate = "compile semantic KORE"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_derived_projection_totality"
anchor_symbol = "normalize_derived_projection_totality"
anchor_helpers = ["emitted_equation", "declare_totality_claim", "conjuncts"]
rule = "On the reference side only, give a field projection `project:S:f` (one argument of a sort without parameters, `function{}()` and no `functional`/`total`) the attributes `functional{}(), total{}()` after `function{}()` and its functional axiom `\\exists{R}(Val, \\equals(Val, project:S:f(K0)))` exactly when the reference itself states the no-junk axiom of `S` whose only alternative is `\\exists X0 ... . C(X0, ...)` for a declared constructor `C`, and exactly one equation for the projection, unconditional, `project:S:f(C(Y0, ...)) = Yi` over distinct variables. A projection whose derivation lacks a premise is compared unchanged; the comparison prints the number of declarations changed."
justification = "The no-junk axiom makes every value of `S` an application of `C`, and the equation gives each such application the value `Yi`, so the totality claim is a theorem of the reference definition and adding it does not change its models. The port states exactly this claim (its SoleGenerator evidence). A port that claims a projection the reference cannot derive, or omits a derivable claim, still differs. See docs/compatibility.md#comparison-contract."

[[normalisation]]
id = "N44"
gate = "compile semantic KORE"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_unsupported_lambda_totality"
anchor_symbol = "normalize_unsupported_lambda_totality"
anchor_helpers = ["emitted_equation", "functional_axiom_symbol"]
rule = "On the reference side only, remove `total{}()`, `functional{}()` and the bare functional axiom of a generated `#lambda` symbol (name prefix `Lbl'Hash'lambda`) whose reference equations do not support the claim: it does not have exactly one equation, unconditional, whose every argument pattern is a variable of the declared parameter sort, or its right-hand side applies a lambda whose claim is removed (least fixed point). A supported claim stays, and so does the claim of a lambda for which the definition states no equation (a syntax definition); the comparison prints the number of declarations changed."
justification = "A lambda is the function of one `#fun`/`#let` rule, and nothing in the definition gives a value to an argument that rule does not match, so a totality claim over a parameter sort the equation does not cover is not derivable; the port withholds it (docs/compatibility.md#configuration-value-transport). Withdrawing only unsupported claims keeps every supported one compared, so a port that withholds a supported claim still differs. See docs/compatibility.md#comparison-contract."

[[normalisation]]
id = "N45"
gate = "compile semantic KORE"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_lifted_cells"
anchor_symbol = "normalize_lifted_cells"
anchor_helpers = ["lifted_cells_from_environment", "LiftedCell", "CellLifting", "collect_variable_names"]
env = "K_DIFFERENTIAL_LIFTED_CELLS"
rule = "Only for the axioms a compile case lists in its lifted-cells manifest key (each entry a rule label and a cell name, the key refused by scripts/reference-manifest.py without a written lifted-cells-reason), and only on the k-rust side: walk the labelled axiom of each side in parallel through equal heads, and replace each application of the entry's cell symbol (declared with cell{}()) at a position where the reference has a variable of that cell's sort generated by its own cell completion (Var'Unds'<stem>N) by one fresh generated variable of that stem per reference variable, so N4 numbers it as the reference's; then compare the whole axiom as before. Refuse an entry when the labelled axiom is not unique on either side, when the reference names a variable at that position, and when it replaces nothing (the reference states the cell there: the entry is stale). The semantic KORE comparison prints the number of applications replaced and of listed axioms."
justification = "A cell written inside a cell that the configuration does not place it under is compiled into the instance of its configured parent that holds the cell it was written in, when that parent is a strict ancestor of the written one (docs/compatibility.md#cells-written-inside-another-cell). The written cell, and the update it states, are part of the rule's meaning: discarding it makes the rule match any value of the cell and leave it unchanged, a different rewrite relation. The pinned reference discards it, so where the port states the cell the reference has only the variable its completion generates for an unmentioned cell, and states nothing to compare the cell against. Replacing exactly that application by the reference's own variable checks that the port's axiom is the reference's axiom with the cell present: every other position, the sharing of the reference variable between the rule's sides, and every other axiom remain compared. The manifest entry and its reason, checked against the rule's source, say which cells the rule writes in the wrong parent; the port's own lifting is not trusted to say so. See docs/compatibility.md#comparison-contract."
