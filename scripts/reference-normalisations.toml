version = 1

# This register is the authority for every equivalence or exclusion applied by
# the reference gates. Each entry names the contract that permits it. Revisit
# oracle-specific exceptions when their reference pin changes; see docs/compatibility.md.

[[normalisation]]
id = "N1"
gate = "compile and conformance kompile"
anchor = "crates/k-rust/tests/reference_differential.rs:strip_source_metadata"
anchor_symbol = "strip_source_metadata"
anchor_helpers = ["strip_attributes"]
rule = "Drop Location and Source attributes from definitions, modules, and sentences."
justification = "Scratch checkout paths and byte offsets differ by construction."

[[normalisation]]
id = "N3"
gate = "compile semantic KORE"
anchor = "crates/k-rust/tests/reference_differential.rs:multi_alias_freezer"
anchor_symbol = "multi_alias_freezer"
anchor_helpers = [
  "strip_multi_alias_freezer_ids",
  "strip_symbol_family_ids",
  "strip_unique_id_attributes",
]
rule = "Ignore UNIQUE_ID only for freezer axioms whose shared hint has multiple generated suffixes."
justification = "Scala HashSet iteration over contexts carrying Source and Location determines the reference suffix assignment; the port retains deterministic declaration order. The limited exclusion and its counted scope are defined in docs/compatibility.md#comparison-contract."

[[normalisation]]
id = "N4"
gate = "compile and execution"
anchor = "crates/k-rust/tests/reference_differential.rs:rename_generated_variables"
anchor_symbol = "rename_generated_variables"
anchor_helpers = [
  "generated_stem",
  "rename_execution_variables",
  "execution_generated_name",
  "existential_generated_name",
  "counted_stem",
  "GeneratedNames",
  "normalize_execution_pattern_with",
  "normalize_execution_pattern_fixing",
  "compare_paired_constraints",
  "constraint_variable_renamings",
  "canonicalize_quantifier_chains",
  "alpha_normalize_bound_variables",
  "is_canonical_free_name",
]
rule = "Alpha-normalize bound variables independently in each scope. Rename remaining generated variables by the first-occurrence index of each original name, preserving each variable's sort and distinct-name multiplicity. Definitions rename the frontend's Var'Unds'<stem>N names and keep the stem. Execution results rename, in a canonical traversal (term first, conjuncts in name-erased order, quantifier chains by renamed binder), the Var'Unds'<stem>N names, the Var'Ques'<stem>N instances of rule existentials, the NewUnifier's VarAC<n>'Unds'<counter> remainder, the port's externalized Ex/Eq/Rule marker names and, when K_DIFFERENTIAL_INITIAL_PATTERN names the initial pattern, every variable that is not free in it (rule variables Kore leaves free in a result)."
justification = "Alpha-renaming is irrelevant, but collapsing two names into one changes the pattern; the reference and the port choose different names for the same rule and remainder variables (VarAC1'Unds'1 versus ExFrame0, VarI versus ExVarI0); K's ? existentials are refreshed with a fresh counter by both engines and the surviving unification representative is engine-chosen (Var'Ques'Tx1 versus Var'Ques'T3 in the LAMBDA type inferencer), and only the initial pattern's variables are names both engines share."

[[normalisation]]
id = "N5"
gate = "compile and execution"
anchor = "crates/k-rust/tests/reference_differential.rs:canonicalize_existentials"
anchor_symbol = "canonicalize_existentials"
anchor_helpers = [
  "canonicalize_attributes",
  "canonicalize_pattern",
  "canonicalize_commuting_quantifier_chains",
]
rule = "For compiled definitions, sort same-kind existential and universal binder chains by canonical variable identity, sort, and kind before alpha-normalizing each scope. For execution results, enumerate blocks whose permutation count is at most 24, preserve the binding identity of every candidate, alpha-normalize each candidate, and retain the structurally least representative; larger blocks retain their original order and can only cause a conservative comparison failure."
justification = "The reference emits binders from unordered Scala sets."

[[normalisation]]
id = "N6"
gate = "compile"
anchor = "crates/k-rust/tests/reference_differential.rs:canonicalize_existentials"
anchor_symbol = "canonicalize_existentials"
rule = "Flatten and sort nested same-sort disjunctions in axioms."
justification = "Owise competitor order derives from an unordered reference set."

[[normalisation]]
id = "N7"
gate = "execution, symbolic execution, and MIR execution"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_execution_pattern"
anchor_symbol = "normalize_execution_pattern"
rule = "Flatten and sort top-level same-sort disjunctions while retaining multiplicity."
justification = "Disjunction order is semantically empty; duplicated branches remain observable."

[[normalisation]]
id = "N8"
gate = "execution, symbolic execution, and MIR execution"
anchor = "crates/k-rust/tests/reference_differential.rs:flatten_collection"
anchor_symbol = "flatten_collection"
anchor_helpers = ["normalize_execution_structure"]
rule = "Flatten, sort, and right-associate map and set concatenations."
justification = "The symbols are associative and commutative while the reference prints an internal order."

[[normalisation]]
id = "N9"
gate = "parsed-definition compile artifact"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_definition_json"
anchor_symbol = "normalize_definition_json"
anchor_helpers = [
  "normalize_definition_value",
  "canonical_regex",
  "canonical_regex_body",
]
rule = "Canonicalize regex languages, user lists, generated variables, and set-valued outer-syntax fields in parsed JSON."
justification = "The outer definition contains order-free collections and equivalent regex encodings."

[[normalisation]]
id = "N10"
gate = "kast"
anchor = "crates/k-rust/tests/reference_differential.rs:parsed_kast_matches_the_reference_frontend"
anchor_symbol = "parsed_kast_matches_the_reference_frontend"
rule = "Compare KAST JSON structurally after decoding both version-4 documents."
justification = "JSON object layout is not semantic and the reference-derived contract is structural."

[[normalisation]]
id = "N11"
gate = "rpc"
anchor = "scripts/reference-rpc-differential.sh:jq -S"
anchor_symbol = "jq -S"
rule = "Sort JSON object keys before comparing responses."
justification = "JSON object key order is not part of JSON-RPC."

[[normalisation]]
id = "N12"
gate = "proof"
anchor = "scripts/reference-proof-differential.sh:failure-claim"
anchor_symbol = "failure_claim"
rule = "Compare failure verdicts without comparing backend-specific counterexample framing."
justification = "Generated counter cells differ while the disproved verdict is the contract."

[[normalisation]]
id = "N13"
gate = "compile"
anchor = "crates/k-rust/tests/reference_differential.rs:compare_stripped_definitions"
anchor_symbol = "compare_stripped_definitions"
anchor_helpers = ["canonical_sentence", "canonicalized_sentence"]
rule = "Compare sentences as a multiset per module while comparing module order and count exactly."
justification = "Reference sentence order follows unordered Scala collections."

[[normalisation]]
id = "N14"
gate = "concrete execution and rpc"
anchor = "scripts/reference-non-imp-execution-differential.sh:--smt none"
anchor_symbol = "--smt none"
rule = "Run the concrete reference program without SMT while the port uses its in-process solver."
justification = "Concrete cases do not need the solver; symbolic cases use the symbolic gate with both solvers enabled."

[[normalisation]]
id = "N15"
gate = "execution, symbolic execution, and MIR execution"
anchor = "crates/k-rust/tests/reference_differential.rs:compare_execution_modulo_implication"
anchor_symbol = "compare_execution_modulo_implication"
rule = "When K_DIFFERENTIAL_DEFINITION supplies a definition and structural comparison fails, pair equal term branches and prove both implications between their constraint sets."
justification = "Equivalent constraint spellings and solver-discharged requires clauses must compare equal."
env = "K_DIFFERENTIAL_DEFINITION"

[[normalisation]]
id = "N16"
gate = "execution and symbolic execution"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_execution_disjunct"
anchor_symbol = "normalize_execution_disjunct"
rule = "Drop only the outer existential prefix of each result disjunct before generated-variable renaming."
justification = "The reference leaves an AC remainder variable free where the port quantifies the corresponding variable."

[[normalisation]]
id = "N17"
gate = "symbolic execution"
anchor = "scripts/reference-symbolic-execution-differential.sh:gotstuck"
anchor_symbol = "gotstuck"
rule = "For a depth-bounded exec case marked gotstuck, require the reference leaves to be a sub-multiset of the port leaves."
justification = "The reference graph traversal drops Stop leaves when another leaf remains; the port keeps them."

[[normalisation]]
id = "N18"
gate = "hook execution"
anchor = "scripts/reference-non-imp-execution-differential.sh:oracle-exception"
anchor_symbol = "oracle-exception"
rule = "Compare an adjudicated hook exception against committed port and reference expectations independently."
justification = "STRING.find must report the original-haystack index and BYTES.replaceAt must require the complete range to fit, as domains.md specifies. The separate committed expectations expose the pinned Kore deviations; see docs/compatibility.md#hook-specification-exceptions."

[[normalisation]]
id = "N19"
gate = "rpc"
anchor = "scripts/reference-rpc-differential.sh:oracle-exception"
anchor_symbol = "oracle-exception"
rule = "Compare an adjudicated response against its committed port expectation and print the recorded reason."
justification = "Known oracle-side proxy behavior must remain explicit rather than silently normalized."

[[normalisation]]
id = "N20"
gate = "all Java-backed scripts"
anchor = "scripts/reference-memory-guard.sh:reference_default_k_opts"
anchor_symbol = "reference_default_k_opts"
rule = "Define the bounded JVM option string once in the shared guard and consume it from every Java-backed script."
justification = "One authority prevents memory-bound drift between gate scripts."

[[conformance]]
id = "C1"
rule = "Compare krun and search disjunctions as sorted multisets."
justification = "Disjunction order is not semantic; preserving multiplicity still detects duplicated branches. See docs/compatibility.md#search-results."

[[conformance]]
id = "C2"
rule = "Record K/KItem fallback separately and never fold it into the case verdict."
justification = "Parsing at K/KItem can diagnose a start-sort grammar limitation but cannot certify parsing at the requested sort."

[[conformance]]
id = "C3"
rule = "Record rejection message classes separately from verdicts."
justification = "Accept/reject parity can hide a rejection for the wrong reason."

[[conformance]]
id = "C4"
rule = "Verify each emitted definition.kore before comparing it."
justification = "A structurally comparable artifact can still violate KORE well-formedness."

[[conformance]]
id = "C5"
rule = "Compare proof verdicts without backend-specific counterexample text."
justification = "Counterexample framing is not the proof verdict."

[[conformance]]
id = "C6"
rule = "Record dropped K flags and classify untranslatable flags as unsupported."
justification = "The driver translates K recipes into the supported krust CLI contract; a missing equivalent remains unsupported. See docs/compatibility.md#cli-scope."

[[conformance]]
id = "C7"
anchor = "scripts/conformance/run.py:rename_existentials"
anchor_symbol = "rename_existentials"
anchor_helpers = ["pattern_existentials", "execution_text_diff", "EXISTENTIAL_TOKEN"]
rule = "Compare kprint execution text modulo a bijective, sort-preserving renaming of existential variables, the `?Name:Sort` tokens outside string literals, renamed by first occurrence per disjunct before the C1 sort. Every other variable, including the search pattern's, is compared literally, and a `?` variable named in the recipe's --pattern text is fixed too."
justification = "`?` is K's marker for a rule existential and kprint prints that shape only for Var'Ques' names; the reference instantiates them through Kore's fresh counter and keeps an engine-chosen unification representative, which N4 already classes as engine-named. Renaming by first occurrence preserves sharing, so `?A -> ?A` and `?A -> ?B` stay distinct. See docs/compatibility.md#comparison-contract."

[[normalisation]]
id = "N21"
gate = "execution, symbolic execution, and MIR execution"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_conjunctions"
anchor_symbol = "normalize_conjunctions"
rule = "Flatten and structurally order nested same-sort conjunctions of a result disjunct, then drop duplicated conjuncts before splitting it into term and constraints. Quantifier-block candidates are alpha-normalized before their conjunctions are ordered."
justification = "Kore prints a rewritten branch as \\and(\\and(term, predicate), substitution) with right-nested predicate conjunctions that repeat the AC solution's in_keys condition; conjunction is associative, commutative and idempotent."

[[normalisation]]
id = "N22"
gate = "symbolic execution"
anchor = "crates/k-rust/tests/reference_differential.rs:canonicalize_remainder_existentials"
anchor_symbol = "canonicalize_remainder_existentials"
rule = "Quantify, inside a negated existential constraint, every generated variable that is free in it and occurs nowhere else in the disjunct."
justification = "Kore/Rewrite/Remainder.hs existentiallyQuantifyRuleVariables quantifies only the rule variables of a unification solution and leaves the NewUnifier's fresh AC remainder free in the printed remainder; the port quantifies it, which is the reading under which the remainder excludes every instance of the rule."

[[normalisation]]
id = "N23"
gate = "compile and conformance kompile"
anchor = "crates/k-rust/tests/reference_differential.rs:strip_multi_suffix_lambda_ids"
anchor_symbol = "strip_multi_suffix_lambda_ids"
anchor_helpers = [
  "multi_suffix_lambda",
  "multi_suffix_lambda_family",
  "strip_symbol_family_ids",
  "strip_unique_id_attributes",
]
rule = "Collapse every generated `#lambda<h1>_<h2>_<n>` symbol of a multi-suffix family onto the family's unsuffixed name, in declarations and uses alike, and ignore UNIQUE_ID only for the axioms that mention such a family; single-suffix hints keep their identity. The collapsed axiom count is printed per case."
justification = "ResolveFun.getUniqueLambdaLabel numbers identical hints in `stream(m.localSentences())` order, a Scala HashSet order over sentence hashes that include the Source path, and the pinned reference assigns the suffixes differently from two checkout paths (issue-1528, let-test, record-llvm); the port keeps deterministic declaration order. The collapsed sentence multiset still compares every lambda's signature and rule body; docs/compatibility.md#comparison-contract records the scope and tradeoff."

[[normalisation]]
id = "N24"
gate = "execution, symbolic execution, and MIR execution"
anchor = "crates/k-rust/tests/reference_differential.rs:normalize_execution_equalities"
anchor_symbol = "normalize_execution_equalities"
rule = "Order the operands of ML equality. Rewrite equality of the generated total `LblisKResult` predicate with false as the negation of its equality with true."
justification = "ML equality is symmetric, and generated isKResult has a total two-valued SortBool result. The reference and the port choose different but equivalent orientations when they externalize residual isKResult conditions; arbitrary SortBool patterns remain unchanged because they may be partial."

[[normalisation]]
id = "N25"
gate = "generated Bison parser output"
anchor = "crates/k-rust/tests/reference_differential.rs:canonicalize_ambiguities"
anchor_symbol = "canonicalize_ambiguities"
anchor_helpers = [
  "ambiguity_stats",
  "valid_amb_sort",
  "flattened_amb_alternative_count",
  "pattern_children",
  "rebuild_pattern_node",
]
rule = "Only for a manifest row explicitly classified as ambiguous, require both parser outputs to be complete KORE patterns, recursively flatten same-sort binary Lblamb trees, retain duplicate alternatives, sort alternatives by compact KORE bytes, and rebuild a deterministic binary tree. Every unambiguous parser output must remain byte-identical."
justification = "Alternative order in a generated GLR grammar can change the nesting of an ambiguity tree without changing its alternatives. The manifest authorizes this test-only transformation only for individually reviewed ambiguous inputs; generated scanner and grammar source bytes are outside the compatibility contract."
env = "K_BISON_PARSER_ALLOW_AMBIGUITY=1"

[[normalisation]]
id = "N26"
gate = "execution"
anchor = "crates/k-rust/tests/reference_differential.rs:compare_execution_any_membership"
anchor_symbol = "compare_execution_any_membership"
anchor_helpers = ["pair_disjuncts", "executed_kore_matches_the_reference_backend"]
rule = "For an any-strategy run, require the port result to be a non-empty sub-multiset of the reference all-strategy result: every port disjunct pairs with a distinct reference disjunct by equal term and N4/N15-equal constraints; unpaired reference disjuncts are allowed and counted."
justification = "A single-successor execution is one member of the successor set; which member an engine follows among equal-priority rules is engine-internal, exactly as docs/compatibility.md#search-results already states for --bound N. The port's --strategy all runs stay under the exact multiset comparison (N7)."
env = "K_DIFFERENTIAL_STRATEGY=any"

[[normalisation]]
id = "N27"
gate = "rpc"
anchor = "scripts/reference-rpc-differential.sh:next-states"
anchor_symbol = "normalize_rpc_response"
rule = "Compare the next-states array of an execute response as a multiset: sort both sides by canonical JSON (jq -S, tojson) before diffing; keep length and every element field."
justification = "Booster lists branches in its internal rule order and the port in its own; the successor set, not its order, is the RPC contract. See docs/compatibility.md#search-results."

[[normalisation]]
id = "N28"
gate = "rpc"
anchor = "scripts/reference-rpc-differential.sh:error-data"
anchor_symbol = "normalize_rpc_response"
anchor_helpers = ["normalize_backend_error_class"]
rule = "For a backend error response (error.code in 1..9), compare code, message, and each detail's error string; reduce every context array to its JSON type and drop term. Responses with a per-response reduction branch keep that stricter branch."
justification = "The context lines are Kore's error-context stack and Claim.hs diagnostic framing, and the extra simplify detail is Booster's two-interpretation attempt order; pyk joins context into an exception message and no client parses it. The class of a rejection (code, message, error sentence) is the contract, as C3 states for the conformance driver. See docs/compatibility.md#rpc-behavior."

[[normalisation]]
id = "N30"
gate = "compile"
anchor = "crates/k-rust/tests/reference_differential.rs:canonicalize_no_confusion_pairs"
anchor_symbol = "canonicalize_no_confusion_pairs"
anchor_helpers = ["is_application_over_variables", "no_confusion_conjunct_key"]
rule = "For the no-confusion axioms `\\not(\\and(P(X0..), Q(Y0..)))` (the `constructor{}()` family, identified by their shape: a top-level negated binary conjunction of two applications over variables), order the two conjuncts by symbol and argument sorts and rename the free variables by position before the N13 multiset comparison. The comparison prints the number of pairs canonicalised on both sides."
justification = "K emits one axiom per unordered pair of distinct constructors of a sort and puts the `Production.ord`-smaller production on the `X` side; the port puts the earlier-declared one there. `\\and` is commutative and the free names are alpha-equivalent under the axiom's closure, so the canonical form hides nothing semantic."
