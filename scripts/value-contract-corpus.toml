# The value contract's full-definition gate (V12, scripts/value-contract-corpus.sh): for each
# definition, the load-time critical-pair check's verdict and counts (k_rust_backend::confluence).
# A conformance case is read from the conformance driver's work tree after it compiled the case;
# `wasm` is compiled by the script. Every key under [case.expected] is compared exactly; a change
# is a precision or cost change to explain, and the manifest is regenerated with --update.
# The counts are the load's (`CheckScope::Gate`, which classifies only the pairs with a relevant
# equation); the `full_` keys are the full check's (`CheckScope::All`), which also names the pairs
# that withdraw no claim. The harness fails when the two verdicts admit different claims (V9), or
# when either scope without the memo of condition simplifications (`ConditionMemo::Off`) differs in
# its verdict or in a count other than the memo's hits; `simplifier_calls` counts the conditions
# simplified or answered from the memo, `condition_memo_hits` those answered from it.

[[case]]
name = "fun"
definition = "conformance:tests/regression-new/pl-tutorial/2_languages/3_fun/1_untyped/1_environment/krust-kompiled/definition.kore"
[case.expected]
equations = 256
pairs = 94
overlaps = 22
separated = 13
refuted = 1
joined = 21
unjoined = 0
relevant = 0
violations = 0
heads = 13
tainted_heads = 0
tainted_symbols = 0
several_matches = 0
families = 7
confluent_families = 7
relevant_equations = 184
skipped = 14
full_pairs = 108
full_unjoined = 0
full_tainted_symbols = 0
simplifier_calls = 7
condition_memo_hits = 3
full_simplifier_calls = 12
full_condition_memo_hits = 4

