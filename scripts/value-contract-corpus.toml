# The value contract's full-definition gate (V12, scripts/value-contract-corpus.sh): for each
# definition, the load-time critical-pair check's verdict and counts (k_rust_backend::confluence).
# A conformance case is read from the conformance driver's work tree after it compiled the case;
# `wasm` is compiled by the script. Every key under [case.expected] is compared exactly; a change
# is a precision or cost change to explain, and the manifest is regenerated with --update.

[[case]]
name = "fun"
definition = "conformance:tests/regression-new/pl-tutorial/2_languages/3_fun/1_untyped/1_environment/krust-kompiled/definition.kore"
[case.expected]
equations = 256
pairs = 108
overlaps = 28
separated = 13
refuted = 6
joined = 22
unjoined = 0
relevant = 0
violations = 0
heads = 13
tainted_heads = 0
tainted_symbols = 0
families = 7
confluent_families = 7

