[[case]]
name = "spec-rule-application"
accepted_verdict = "mismatch"
accepted_stage = "kprove"
baseline_verdict = "mismatch"
baseline_stage = "kprove"
exclusion = ""
reason = "def02 requires claim narrowing. For def032, the remainder `not(exists Y. X = Y + -1)` is unsatisfiable and must be pruned before creating a proof state, as Kore/Rewrite/RewriteStep.hs filterMultiOr does. def62 proves after retaining the function cycle `X2 = incPos(X2 -Int 1)` as an equality for simplification under the path condition (Kore/Unification/SubstitutionNormalization.hs simplifiableCycle; revision b0f9093); rejecting it as a constructor occurs-check cycle is unsound. def61 and def81 retain their individually justified reference-incomplete-port-proves exclusions below."
step_exclusions = [
  { test = "def61-spec.k", exclusion = "reference-incomplete-port-proves", reason = "The trusted claim applies with Y1 = X1 and Y2 = X2 - 1: the subject constraints make incPos(Y1) - Y1 - 1 = 0 and incPos(Y2) = X2. It reaches the destination with the unchanged variable cell; see docs/compatibility.md#proof-oracle-incompleteness and the pinned def61-spec.k." },
  { test = "def81-spec.k", exclusion = "reference-incomplete-port-proves", reason = "The trusted claim applies with Y1 = X + 1 and Y2 = X + 2: X >= 0 gives incPos(Y1) - 1 = X + 1, and Y2 = Y1 + 1 holds. It reaches the exact destination without a remainder; see docs/compatibility.md#proof-oracle-incompleteness and the pinned def81-spec.k." },
]

