meaning = "Recorded acceptance floor from the last complete certification. Update individual accepted verdicts only after measuring and reviewing the change; local log resets and driver changes must not discard this progress."

[[category]]
id = "llvm-only"
decided_by = "docs/compatibility.md#backend-scope"
meaning = "LLVM-backend or bison behavior is outside the Haskell-backend semantics the port follows."

[[category]]
id = "reference-crash"
decided_by = "docs/compatibility.md#reference-evidence"
meaning = "The reference backend crashed and supplied no expected behavior; revisit at a pin move."

[[category]]
id = "reference-incomplete-port-proves"
decided_by = "docs/compatibility.md#proof-oracle-incompleteness"
meaning = "The reference misses an applicable circularity that the port applies soundly."

[[category]]
id = "both-reject"
decided_by = "docs/compatibility.md#reference-evidence"
meaning = "Both toolchains reject the input; differing diagnostic presentation is not semantic."

[[category]]
id = "presentation-only"
decided_by = "docs/compatibility.md#comparison-contract"
meaning = "The compared text differs while the represented result is semantically equal."

[[category]]
id = "stale-oracle"
decided_by = "docs/compatibility.md#reference-evidence"
meaning = "The checked-in output was not reproduced by the pinned reference toolchain."

[[category]]
id = "supported-superset"
decided_by = "docs/compatibility.md#anywhere-rules"
meaning = "The port intentionally supports anywhere rules that the K Haskell frontend rejects."

[[category]]
id = "declined-capability"
decided_by = "docs/compatibility.md#cli-scope"
meaning = "The step needs a K CLI capability outside krust's interface (the kompiled-directory contract or K-only flags); the driver has no krust equivalent to translate to."

