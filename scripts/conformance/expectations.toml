version = 1
source = "Versioned conformance measurements and acceptance floors, with explicit compatibility exclusions; see docs/testing.md and docs/compatibility.md."

# Case names identify directories under the pinned K checkout's k-distribution/tests/regression-new.
# step_exclusions test/out selectors match the upstream recipe's recorded strings exactly, including any ./ prefix.
# These upstream filenames are independent of the curated fixtures under crates/k-rust/tests/fixtures/reference.
# `budget` overrides the driver's 300 s case budget; `step_budget` caps one program execution inside it
# (a capped kill is that program's krust-error and the programs behind it still run).

[baseline]
timestamp_utc = "2026-09-02T08:17:59Z"
workspace_revision = "e12f1908f8e814b54f7eed11d9353241d30cadbe"
k_revision = "4a46d1231473b599c699160132fd6e76a5c46406"
