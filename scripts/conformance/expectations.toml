[[case]]
name = "no-junk-macro"
baseline_verdict = "krust-error"
baseline_stage = "kompile"
tickets = []
exclusion = "presentation-only"
reason = "krun 1.test: krust prints `<k> false </k>` alone where the reference keeps `{ true #Equals size(ListItem(?X) ?L) >=Int -1 }`. Mechanism (rewrite.rs:2599): the requires `I >=Int -1` of `rule I:Int => false requires I >=Int -1` on `I = size(ListItem(?X) ?L)` is undecidable syntactically, krust asks Z3 whether it is valid under the path condition with the definition's `smt-lemma` `size(L) >=Int 0` asserted, gets Valid and drops it; kore-exec only prunes unsatisfiable conditions (Kore/Rewrite/RewriteStep.hs:308-322, SMT.Evaluator.filterMultiOr) and never discharges a valid one, so it stays in the output. The constraint is entailed by the definition's own lemma, so the two final configurations are semantically equal and differ only in text: presentation-only, in the sense of the concrete-function disposition (decisions.toml pair `C2 deferred concrete-function`). Oracle confirmed under the systemd scope on 2026-09-06."
