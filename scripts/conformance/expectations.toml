[[case]]
name = "set_unification"
accepted_verdict = "match"
accepted_stage = "kprove"
baseline_verdict = "mismatch"
baseline_stage = "kprove"
exclusion = ""
reason = "The trusted claim preserves deferred collection pairs after shared-variable substitution, and apply_claim solves them with the rule-application solver. Implication cancels the shared set frame when solving destination `?G F` against `SetItem(I) (G2 F)`, following Kore AC unification. Claim #1 in a-spec.k proves; reduced variants without the existential frame are correctly refuted (revisions 6e9dc21 and b436a4a). Dropping the deferred pair loses the frame equality and produces a spurious refutation."

