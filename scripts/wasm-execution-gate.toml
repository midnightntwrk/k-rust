# The WASM execution gate (scripts/wasm-execution-gate.sh): the expected result of `krust krun`
# on each program of wasm-semantics/tests/simple and of `krust kprove` on each spec of
# wasm-semantics/tests/proofs, at the pinned wasm-semantics revision. Every key but `name`,
# `module` and `definition_module` is compared exactly; regenerate with --update and explain the
# change. A program's `stdout` is `success` when it equals wasm-execution-gate.success.kore, the
# final configuration upstream's passing tests reach (stacks, maps and stores empty, `<k>` and
# `<instrs>` `.K`), and otherwise the output's SHA-256 and size. A proof's `verdict` is its claim
# statuses with their state counts and, for a failed claim, where it stopped; a failed proof's
# `stdout` is the SHA-256 and size of its whole output, which holds the configuration it stopped on.
# A case whose recorded result is not a success (a program that does not exit 0 with `success`, a
# proof that does not exit 0) states why in `known_failure`: the upstream list of failing tests
# that names it, or a FOLLOWUPS item. A success carries no `known_failure`; the gate checks both.

