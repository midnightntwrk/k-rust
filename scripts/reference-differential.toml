[[execution]]
name = "imp"
source = "${imp}/src/kimp/kdist/imp-semantics/imp.k"
main-module = "IMP"
syntax-module = "IMP-SYNTAX"
sort = "Stmt"
configuration = ["ENV=.Map"]
depth = 10000
programs = [
  "${imp}/examples/sumto10.imp",
  "${imp}/examples/while-and-following.imp",
  "${imp}/examples/dangling-else.imp",
]

[[execution.search]]
name = "one"
program = "${imp}/examples/sumto10.imp"
mode = "--search-one-step"

[[execution.search]]
name = "star-depth-two"
program = "${imp}/examples/sumto10.imp"
mode = "--search-all"
depth = 2

[[execution]]
name = "crypto"
source = "${workspace}/crates/k-rust/tests/fixtures/reference/crypto-execution.k"
main-module = "CRYPTO-EXECUTION"
syntax-module = "CRYPTO-EXECUTION"
sort = "Input"
hook-namespaces = ["KRYPTO"]
depth = 10
programs = [
  "${workspace}/crates/k-rust/tests/fixtures/reference/keccak-empty.crypto",
]

[[execution]]
name = "bounded-search"
source = "${workspace}/crates/k-rust/tests/fixtures/reference/bounded-search.k"
main-module = "BOUNDED-SEARCH"
syntax-module = "BOUNDED-SEARCH"
sort = "State"
depth = 10

[[execution.search]]
name = "star-result-bound-ten"
program = "${workspace}/crates/k-rust/tests/fixtures/reference/start.state"
mode = "--search-all"
result-bound = 10

[[proof]]
name = "imp"
source = "${imp}/src/kimp/kdist/imp-semantics/imp.k"
main-module = "IMP"
syntax-module = "IMP-SYNTAX"
specification = "${imp}/examples/specs/imp-simple-spec.k"
spec-module = "IMP-SIMPLE-SPEC"
definition-module = "IMP-VERIFICATION"
depth = 100
claims = [
  "IMP-SIMPLE-SPEC.addition-1",
  "IMP-SIMPLE-SPEC.addition-2",
  "IMP-SIMPLE-SPEC.addition-var",
  "IMP-SIMPLE-SPEC.pre-branch-proved",
  "IMP-SIMPLE-SPEC.branching",
  "IMP-SIMPLE-SPEC.branching-program",
  "IMP-SIMPLE-SPEC.branching-deadcode",
  "IMP-SIMPLE-SPEC.while-cut-rule",
  "IMP-SIMPLE-SPEC.while-cut-rule-delayed",
  "IMP-SIMPLE-SPEC.sum-loop",
  "IMP-SIMPLE-SPEC.sum-N",
]
failure-claim = "IMP-SIMPLE-SPEC.bmc-loop-concrete"

[[rpc]]
name = "imp"
source = "${imp}/src/kimp/kdist/imp-semantics/imp.k"
program = "${imp}/examples/sumto10.imp"
main-module = "IMP"
syntax-module = "IMP-SYNTAX"
configuration = ["ENV=.Map"]
responses = ["execute", "simplify", "implies", "model", "add-module", "error"]
