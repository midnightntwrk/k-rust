# The three symbolic collection and injection cases compare one rewrite step of a symbolic collection or injection
# configuration against kore-exec. kore-exec's --depth N lists the leaves that are stuck within N
# steps; whenever a stuck leaf exists it drops the leaves that merely reached the limit
# (Kore/Exec/GraphTraversal.hs checkLeftUnproven prefers GotStuck over Stopped), so --depth 1
# prints only the unrewritten remainder and the rewritten branches are
# observable from --depth 2 on, where every branch is stuck. The comparator hands the initial
# pattern to the normaliser (N4) and pairs the reference's remainder shape (N21, N22).
