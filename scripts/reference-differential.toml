reason = "The pinned Haskell execution path fails in kore-expand-macros before producing a configuration. The pinned LLVM path bypasses macro expansion but cannot produce an executable because the pinned KEVM plugin checkout publishes no available krypto archive, so the local gate pins terminal KORE for a minimized copy of the pinned EVM-OPTIMIZATIONS.optimized.add rule."

[[excluded]]
