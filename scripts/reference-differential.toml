version = 1

# Manual real-semantics certification protocol (no CI job):
# Run every command below after a landing that changes frontend, definition, kompile, or KORE emission behavior.
# The scripts must use the clean manifest-pinned checkouts and matching K release enforced by reference-pins.sh.
# Record each named case's pass/fail result, wall time, and peak RSS in the landing PR description.
# Rust frontend processes default to a 6 GiB virtual-memory ceiling through RUST_DIFFERENTIAL_MEMORY_KIB.
# REFERENCE_DIFFERENTIAL_MEMORY_KIB independently controls the reference JVM and is unset by default.
# Raise either ceiling only after measuring current machine headroom; never disable both ceilings for a large-semantics run.
#
# scripts/reference-differential.sh wasm mir evm-equivalence
# scripts/reference-kast-differential.sh wasm mir evm-equivalence
# scripts/reference-non-imp-execution-differential.sh imp
# scripts/reference-proof-differential.sh imp
# scripts/reference-rpc-differential.sh imp

