source = "${workspace}/crates/k-rust/tests/fixtures/reference/deep-term.k"
main-module = "DEEP-TERM"
syntax-module = "DEEP-TERM"
sort = "Input"
depth = 193
programs = ["${workspace}/crates/k-rust/tests/fixtures/reference/deep.term"]

[[excluded]]
name = "ecdsa-invalid-execution"
section = "execution"
source = "${workspace}/crates/k-rust/tests/fixtures/reference/ecdsa-invalid.crypto"
disposition = "local-gate"
local_gate = "cargo test -p k-rust --test cli krun_executes_invalid_ecdsa_recovery_to_empty_bytes -- --exact"
reason = "The pinned Haskell backend crashes in Kore.Builtin.Krypto.encodePoint for bad recovery ids instead of returning a value, so it cannot serve as an oracle for k-rust's empty-Bytes invalid-input contract."

[[excluded]]
name = "fresh-constants-execution"
section = "execution"
source = "${workspace}/crates/k-rust/tests/fixtures/reference/fresh-constants.k"
disposition = "comparison-impossible"
local_gate = "cargo test -p k-rust --test cli krun_executes_fresh_constant_fixture_to_pinned_kore_result -- --exact"
reason = "Backend-generated fresh identities and counters are intentionally implementation-specific, so exact terminal KORE is not a portable cross-backend contract; the local gate pins k-rust's deterministic behavior."

[[excluded]]
name = "wasm-execution"
section = "execution"
source = "${wasm}/pykwasm/src/pykwasm/kdist/wasm-semantics/test.md"
disposition = "alternative-oracle"
local_gate = "cargo test -p k-rust --test cli krun_executes_float_fixture_to_pinned_kore_results -- --exact"
reason = "The pinned Haskell backend lacks the FLOAT.round hook required by the WASM semantics. The pinned LLVM backend compiles and executes when the differential runner does not impose its virtual-memory ceiling, so unbounded LLVM execution is the alternative oracle."

[[excluded]]
name = "evm-execution"
section = "execution"
source = "${evm}/kevm-pyk/src/kevm_pyk/kproj/evm-semantics/optimizations.md"
disposition = "local-gate"
local_gate = "cargo test -p k-rust --test cli krun_executes_evm_optimized_add_fixture_to_pinned_kore_result -- --exact"
reason = "The pinned Haskell execution path fails in kore-expand-macros before producing a configuration. The pinned LLVM path bypasses macro expansion but cannot produce an executable because the pinned KEVM plugin checkout publishes no available krypto archive, so the local gate pins terminal KORE for a minimized copy of the pinned EVM-OPTIMIZATIONS.optimized.add rule."

[[excluded]]
name = "mir-execution"
section = "execution"
source = "${mir}/kmir/src/kmir/kdist/mir-semantics/kmir.md"
disposition = "alternative-oracle"
local_gate = "K_KOMPILE=/path/to/pinned/bin/kompile KMIR_PYTHON=/path/to/pinned/kmir/python scripts/reference-mir-execution-differential.sh"
reason = "The pinned generic krun source interface cannot construct a MIR configuration from SMIR. The alternative oracle uses the pinned KMIR Python generator to produce one shared raw initial KORE pattern, then compares the pinned Haskell backend and k-rust terminal patterns."

[[excluded]]
name = "proof-counterexample-artifact"
section = "proof"
source = "${workspace}/crates/k-rust/tests/fixtures/reference/mini-spec.k"
disposition = "alternative-oracle"
local_gate = "K_KOMPILE=/path/to/pinned/bin/kompile scripts/reference-proof-differential.sh mini-proof"
reason = "The pinned prover emits a concrete generatedCounter cell containing a fresh Int variable, while k-rust reports an unconstrained generatedCounter cell variable; both identify the same stuck k cell, but exact KORE comparison would pin backend-internal framing. Verdicts are compared per claim instead."

[[proof]]
name = "imp"
requires = ["reference-toolchain"]
constructs = []
source = "${imp}/src/kimp/kdist/imp-semantics/imp.k"
main-module = "IMP"
syntax-module = "IMP-SYNTAX"
specification = "${imp}/examples/specs/imp-simple-spec.k"
spec-module = "IMP-SIMPLE-SPEC"
definition-module = "IMP-VERIFICATION"
depth = 100
claims = [
  "IMP-SIMPLE-SPEC.addition-1",
  "IMP-SIMPLE-SPEC.addition-2",
  "IMP-SIMPLE-SPEC.addition-var",
  "IMP-SIMPLE-SPEC.pre-branch-proved",
  "IMP-SIMPLE-SPEC.branching",
  "IMP-SIMPLE-SPEC.branching-program",
  "IMP-SIMPLE-SPEC.branching-deadcode",
  "IMP-SIMPLE-SPEC.while-cut-rule",
  "IMP-SIMPLE-SPEC.while-cut-rule-delayed",
  "IMP-SIMPLE-SPEC.sum-loop",
  "IMP-SIMPLE-SPEC.sum-N",
]
failure-claim = "IMP-SIMPLE-SPEC.bmc-loop-concrete"

[[proof]]
