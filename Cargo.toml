[workspace]
members = [
  "crates/kink-campaign",
  "crates/kink-corpus",
  "crates/kink-flow",
  "crates/kink-native",
  "crates/kink-patch",
  "crates/kink-pattern",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
k-rust = { version = "=0.4.0", path = "../k-rust-927b9ce6/crates/k-rust", default-features = false }
k-rust-backend = { version = "=0.3.0", path = "../k-rust-927b9ce6/crates/k-rust-backend", default-features = false }
kink-native = { path = "crates/kink-native" }
kink-campaign = { path = "crates/kink-campaign" }
kink-corpus = { path = "crates/kink-corpus" }
kink-flow = { path = "crates/kink-flow" }
kink-patch = { path = "crates/kink-patch" }
kink-pattern = { path = "crates/kink-pattern" }
serde_json = "1.0.149"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Dependencies (k-rust and its backend above all) are built optimised in the dev and
# test profiles: loading and compiling a definition is about 15 times faster, which
# dominates the test gate. Workspace crates keep the plain dev profile, and
# debug-assertions and overflow-checks stay on for every package (flow F-01).
[profile.dev.package."*"]
opt-level = 2
