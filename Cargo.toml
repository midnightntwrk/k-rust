[workspace]
members = [
  "crates/kink-campaign",
  "crates/kink-native",
  "crates/kink-patch",
  "crates/kink-pattern",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
k-rust = { version = "=0.4.0", path = "../inspirations/midnightntwrk/k-rust/crates/k-rust", default-features = false }
k-rust-backend = { version = "=0.3.0", path = "../inspirations/midnightntwrk/k-rust/crates/k-rust-backend", default-features = false }
kink-native = { path = "crates/kink-native" }
kink-patch = { path = "crates/kink-patch" }
kink-pattern = { path = "crates/kink-pattern" }
serde_json = "1.0.149"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
