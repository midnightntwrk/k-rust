[workspace]
members = [
  "crates/kink-campaign",
  "crates/kink-conformance",
  "crates/kink-contracts",
  "crates/kink-native",
  "crates/kink-patch",
  "crates/kink-pattern",
  "crates/kink-portable",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
kink-contracts = { path = "crates/kink-contracts" }
kink-patch = { path = "crates/kink-patch" }
kink-portable = { path = "crates/kink-portable" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
