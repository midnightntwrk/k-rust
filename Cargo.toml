[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
gmp-mpfr-sys = { version = "1.7.1", default-features = false, features = [
  "mpfr",
] }
indoc = "2.0.7"
indexmap = "2.14.0"
insta = "1.48.0"
k-rust-kore = { version = "0.4.0", path = "crates/k-rust-kore" }
k-rust-backend = { version = "0.3.0", path = "crates/k-rust-backend" }
k-rust-regex = { version = "0.4.0", path = "crates/k-rust-regex" }
lean-conformance = { path = "crates/lean-conformance" }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
napi = "3.4.0"
napi-build = "2.2.4"
napi-derive = "3.3.0"
num-bigint = "0.4.8"
num-traits = "0.2.19"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
proptest = "1.11.0"
regex = { version = "1.11.1", default-features = false, features = [
  "std",
  "unicode",
] }
regex-automata = { version = "0.4.18", default-features = false, features = [
  "std",
  "unicode",
  "meta",
  "perf",
] }
ripemd = "0.2.0"
rug = { version = "1.30.0", default-features = false, features = [
  "float",
  "integer",
  "std",
] }
rustc-hash = "2.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "unbounded_depth"] }
sha2 = "0.11.0"
sha3 = "0.12.0"
socket2 = { version = "0.6.5", features = ["all"] }
stacker = "0.1.21"
substrate-bn = "0.6.0"
toml = "0.8.23"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-chrome = "0.7.2"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["registry"] }
web-time = "1.1.0"
wasm-bindgen = "0.2.127"
z3 = { version = "0.20.2", default-features = false }

# The default build is mostly the test suite, whose compile-heavy tests run the kompile pipeline
# over the embedded prelude; unoptimized, that work dominates the suite's time. Debug assertions
# and overflow checks stay on at opt-level 1, so the kompile invariant checkers and the standard
# library's debug checks still run, and line tables keep file and line in panics and backtraces.
# Dependencies are rebuilt only when Cargo.lock changes, so they are optimized fully.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# The workspace unoptimized with full debug info, for debugger sessions that inspect local
# variables; dependencies keep the dev profile's opt-level 3. `cargo build --profile debugging`
# writes target/debugging.
[profile.debugging]
inherits = "dev"
opt-level = 0
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Release code with line tables so a sampling profiler resolves inlined frames.
# lto stays at the release default so the profile measures what the
# differential gates and scripts/benchmark.sh run.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
