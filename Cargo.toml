[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
indoc = "2.0.7"
insta = "1.48.0"
num-bigint = "0.4.8"
num-traits = "0.2.19"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
proptest = "1.11.0"
regex = { version = "1.11.1", default-features = false, features = ["std", "unicode"] }
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "unicode", "meta", "perf"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10.8"
z3 = { version = "0.20.2", features = ["vendored"] }
