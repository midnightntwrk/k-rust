[[concept]]
id = "host-object-split"
title = "Host Rust versus object language"
status = "current"
coverage = "spine"
chapter = "orientation"
prerequisites = []
evidence = ["crates/krs/src/lib.rs", "docs-plan/authoring-spec/decisions.md"]
note = "KRS declarations and symbolic terms are not host computations."
gloss = "Rust organizes and checks the definition; KRS declarations describe the object language rather than executing it."

