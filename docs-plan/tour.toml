schema = 1
title = "KRS language tour"
audience = "Semantics authors who know Rust but need not know K"

[status]
current = "Implemented and evidenced by production tests or a canonical semantics port"
qualified = "Implemented for a bounded shape; the page must state the boundary"
reference = "Implemented explicit/reference surface; not the preferred first spelling"
unqualified = "Accepted by some parser or API surface but lacks a positive end-to-end specimen"
open = "A current design question; do not resolve silently"
unsupported = "Not a current public language feature"

[coverage]
spine = "Required in the linear narrative"
advanced = "Required after the IMP spine"
reference = "Required in the feature index or API reference"
limitation = "Required in the limitations and capability material"

[surface_review]
cli_commands = ["fmt", "check", "expand", "emit-k", "build"]
metadata_keys = ["k-namespace", "root", "syntax-root"]
macro_exports = ["alias", "anonymous", "associativity", "bracket", "bytes", "cell", "cells", "claim", "configuration", "constructor", "constructors", "context_alias", "ensures", "equation", "exists", "fragment", "function", "id", "init", "k", "map", "or_bool", "precedence", "priority", "requires", "rule", "rules", "seqstrict", "simplification", "sort", "sorts", "strict", "subsort", "symbol", "term", "token"]
builtin_operations = ["add", "and", "bit_and", "bit_or", "bit_xor", "concat", "contains", "div", "empty", "eq", "ge", "get", "gt", "in_keys", "item", "le", "length", "log2", "lt", "make", "modulo", "mul", "ne", "not", "or", "pad_right", "pow_mod", "range", "shift_left", "shift_right", "size", "sub", "substr", "update", "update_all"]
concept_status_sha256 = "d5c8f2e29aa3c5a3ae4480fe1eb1548b9024a94f8687d86f6c664f9f6a075b78"

# Browser lessons: pages that compile a checked fixture in the reader's browser.
# `seed` is the docs-site mirror the editor starts from; sync-snippets.mjs keeps
# it byte-identical to `fixture`. A published lesson is in the primary sidebar;
# a deferred one must stay out of it.
[[lesson]]
id = "tour-minimal-browser"
route = "/lessons/tour-minimal"
status = "published"
fixture = "tests/tour-minimal/src/lib.rs"
seed = "docs-site/src/snippets/tour-minimal.rs"

[[synthesis]]
id = "five-minute-theory"
route = "/start/five-minute-theory"
status = "published"
requires = [
    "host-object-split",
    "symbolic-terms",
    "declarative-relational-rules",
    "open-sorts",
    "subsort-membership",
    "framework-sorts",
    "core-builtins",
    "constructor-families",
    "syntax-templates",
    "precedence-associativity",
    "fixed-configurations",
    "configuration-init",
    "single-item-sequence",
    "rule-tables",
]
note = "Publish only after every required concept has a canonical destination and the page's hover/focus glosses and links are generated from this ledger rather than maintained as a second glossary."

[[chapter]]
id = "orientation"
owner = "KRS language and documentation maintainers"
order = 0
route = "/start/what-krs-defines"
title = "What KRS defines"
outcome = "Distinguish host Rust, symbolic object-language terms, and declarative semantic sentences."
specimen = "tests/tour-minimal/src/lib.rs and its emitted foo-to-bar projection"

[[chapter]]
id = "project"
owner = "KRS language and documentation maintainers"
order = 1
route = "/start/definition-package"
title = "A definition is a Cargo package"
outcome = "Create a definition facet, run the formatter and checker, and understand modules and imports."
specimen = "new tour fixture"

[[chapter]]
id = "imp-sorts"
owner = "KRS language and documentation maintainers"
order = 2
route = "/imp/sorts-and-values"
title = "IMP expressions: sorts and values"
outcome = "Declare open sorts, membership, framework result membership, and builtin values."
specimen = "tests/m4/rust-definition/src/imp.rs"

[[chapter]]
id = "imp-grammar"
owner = "KRS language and documentation maintainers"
order = 3
route = "/imp/concrete-grammar"
title = "IMP expressions: concrete grammar"
outcome = "Declare constructor families, syntax templates, grouping brackets, formatting, precedence, and associativity."
specimen = "tests/m4/rust-definition/src/imp.rs"

[[chapter]]
id = "imp-evaluation"
owner = "KRS language and documentation maintainers"
order = 4
route = "/imp/evaluation"
title = "IMP expressions: evaluation"
outcome = "Define strict and sequential evaluation, symbolic builtin applications, and expression rules."
specimen = "tests/m4/rust-definition/src/imp.rs"

[[chapter]]
id = "imp-state"
owner = "KRS language and documentation maintainers"
order = 5
route = "/imp/configuration-and-state"
title = "IMP state: configurations and initialization"
outcome = "Add statement syntax, a computation cell, an environment cell, and a declarative initializer."
specimen = "tests/m4/rust-definition/src/imp.rs"

[[chapter]]
id = "imp-machine-rules"
owner = "KRS language and documentation maintainers"
order = 6
route = "/imp/machine-rules"
title = "IMP state: sequences, maps, and framing"
outcome = "Read and write multi-cell rules using sequence tails, map patterns, persistent updates, and implicit frames."
specimen = "tests/m4/rust-definition/src/imp.rs"

[[chapter]]
id = "imp-control"
owner = "KRS language and documentation maintainers"
order = 7
route = "/imp/control-flow"
title = "IMP control flow"
outcome = "Complete IMP with conditionals, loops, blocks, splice, erase, and deliberately non-strict constructs."
specimen = "tests/m4/rust-definition/src/imp.rs"

[[chapter]]
id = "applicability"
owner = "KRS language and documentation maintainers"
order = 8
route = "/semantics/applicability-and-failure"
title = "Applicability, fallback, and failure"
outcome = "Distinguish guards, overlap, fallback, stuck states, traps, authoring errors, and backend capability errors."
specimen = "tests/m3c-requires and current positive fixtures"

[[chapter]]
id = "lowering"
owner = "KRS language and documentation maintainers"
order = 9
route = "/semantics/lowering"
title = "Inspect what KRS builds"
outcome = "Follow one rule through readable Rust, expanded Rust, Definition IR, emitted K, and backend artifacts."
specimen = "docs-plan/authoring-spec/imp.rs and tests/m4/goldens/imp.expanded.rs"

[[chapter]]
id = "static-semantics"
owner = "KRS language and documentation maintainers"
order = 10
route = "/semantics/static-semantics"
title = "Functions and static semantics"
outcome = "Define total and partial functions, equations, equation priority, aliases, contexts, and simplifiers."
specimen = "tests/m4/rust-definition/src/static_adjunct.rs and verification.rs"

[[chapter]]
id = "verification"
owner = "KRS language and documentation maintainers"
order = 11
route = "/verification/reachability-claims"
title = "All-path reachability claims"
outcome = "State all-path claims with conditions, existential results, postconditions, anonymous values, and circularity."
specimen = "tests/m4/rust-definition/src/claims.rs"

[[chapter]]
id = "scale"
owner = "KRS language and documentation maintainers"
order = 12
route = "/advanced/language-scale"
title = "Language-scale state and builtins"
outcome = "Use nested and repeated cells, fragments, Bytes, List, Set, and the bounded hook catalog."
specimen = "semantics/kwasm, semantics/kmir, and semantics/kevm"

[[chapter]]
id = "composition"
owner = "KRS language and documentation maintainers"
order = 13
route = "/advanced/composition"
title = "Compose definitions"
outcome = "Use multiple packages, named facets, dependency facets, cfg values, stable symbols, and backend selection."
specimen = "new multi-package tour fixture"

[[chapter]]
id = "workflow"
owner = "KRS language and documentation maintainers"
order = 14
route = "/reference/workflow"
title = "Daily workflow"
outcome = "Use fmt, check, expand, emit-k, build, source maps, diagnostics, and rust-analyzer within their supported boundaries."
specimen = "crates/krs-cli tests and M4 LSP probes"

[[chapter]]
id = "reference"
owner = "KRS language and documentation maintainers"
order = 15
route = "/reference/language"
title = "Feature and builtin reference"
outcome = "Find every current macro, attribute, builtin sort, builtin operation, and explicit surface form."
