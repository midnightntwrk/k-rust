[workspace]
members = ["crates/span-probe-model", "crates/span-probe-macros", "crates/accepted"]
exclude = ["fixtures/rejected", "fixtures/unstable-api"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.40"
syn = { version = "2.0.117", features = ["full", "visit"] }
span-probe-model = { path = "crates/span-probe-model" }
span-probe-macros = { path = "crates/span-probe-macros" }

