[package]
name = "m3-builtin-ui"
edition = "2024"
rust-version = "1.88"
version = "0.0.0"

[dependencies]
dialect = { package = "m3-builtin-facade", path = "../crates/facade" }

[[bin]]
name = "ordinary_function"
path = "src/ordinary_function.rs"

[[bin]]
name = "unknown_alias"
path = "src/unknown_alias.rs"

[[bin]]
name = "wrong_arity"
path = "src/wrong_arity.rs"

[[bin]]
name = "wrong_operand"
path = "src/wrong_operand.rs"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[workspace]

