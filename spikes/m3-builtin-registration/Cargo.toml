[workspace]
members = [
    "crates/model",
    "crates/facade",
    "crates/macros",
    "crates/semantics",
    "crates/collector",
]
exclude = ["ui"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.0.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

