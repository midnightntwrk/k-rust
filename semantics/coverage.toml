[[tranche]]
priority = 1
name = "builtin associative List surface"
consumers = ["kwasm", "kmir"]
rationale = "removes both recursive body/list adapters and unlocks source-faithful indexing and typed locals"

[[tranche]]
priority = 2
name = "Bytes surface"
consumers = ["kwasm", "kevm"]
rationale = "unlocks real Wasm binary programs and KEVM opcode decoding"

[[tranche]]
priority = 3
name = "nested and collection configuration"
consumers = ["kwasm", "kevm", "kmir"]
rationale = "required for stores, frames, accounts, calls, and the source configurations"
