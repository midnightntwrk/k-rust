[[tranche]]
priority = 1
name = "Euclidean Int modulus"
consumers = ["kwasm", "kevm"]
status = "implemented"
rationale = "selects K's INT.mod directly for source-faithful word normalization, including negative SUB intermediates"

[[tranche]]
priority = 2
name = "builtin associative List surface"
consumers = ["kwasm", "kmir"]
status = "in_progress"
rationale = "implemented in shared KRS and KMIR; the remaining KWasm migration removes its recursive instruction and value-stack boundaries"

[[tranche]]
priority = 3
name = "Bytes surface"
consumers = ["kwasm", "kevm"]
status = "in_progress"
rationale = "unlocks real Wasm binary programs and KEVM opcode decoding"

[[tranche]]
priority = 4
name = "nested and collection configuration"
consumers = ["kwasm", "kevm", "kmir"]
status = "in_progress"
rationale = "typed collections and repeated Map cells now support KEVM current-account storage; messages, frames, calls, and the remaining account structure still require further nested-configuration coverage"
