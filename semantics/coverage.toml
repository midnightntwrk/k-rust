id = "kwasm"
package = "krs-kwasm-semantics"
authority_commit = "212271bd434bd402e27c42f6416854342733386d"
authority_k_version = "7.1.329"
source_files = 13
source_syntax_declarations = 386
source_rules = 884
krs_equations = 8
krs_machine_rules = 8
krs_claims = 1
pinned_executions = 32
complete = false
implemented = [
  "i32 and i64 integer values",
  "const, add, sub, mul, and div_u",
  "modulo word normalization",
  "operand stack transitions",
  "division traps",
]
adapters = ["recursive instruction and value-stack boundaries in place of builtin Lists"]
deferred = [
  "module instantiation and validation",
  "control instructions and labels",
  "locals, globals, tables, memory, and calls",
  "floating-point and conversion operators",
  "binary and text decoding",
  "host, WRC20, ABI, and test modules",
]

