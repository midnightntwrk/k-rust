schema = 1
qualification_k_version = "7.1.337"

[completion_contract]
required = [
  "syntax inventory parity",
  "configuration inventory parity",
  "executable-rule inventory parity",
  "pinned upstream behavior coverage",
  "native proof coverage for symbolic paths",
  "no unrecorded adapter boundary",
]

