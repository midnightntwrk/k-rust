[package]
name = "krs-kmir-semantics"
description = "Incremental KRS port of KMIR"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
name = "krs_kmir_semantics"
path = "src/lib.rs"

[dependencies]
k = { package = "krs", path = "../../crates/krs" }

[dev-dependencies]
krs-compiler = { path = "../../crates/krs-compiler" }
krs-ir = { path = "../../crates/krs-ir" }
serde_json = "1"

[package.metadata.krs]
k-namespace = "KRS-KMIR"

[package.metadata.krs.definitions.main]
root = "crate"
syntax-root = "crate"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
