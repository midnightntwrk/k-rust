[package]
name = "krs-kevm-semantics"
description = "Incremental KRS port of KEVM"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "krs_kevm_semantics"
path = "src/lib.rs"

[dependencies]
k = { package = "krs", path = "../../crates/krs" }

[dev-dependencies]
krs-collector = { path = "../../crates/krs-collector" }
krs-compiler = { path = "../../crates/krs-compiler" }
krs-ir = { path = "../../crates/krs-ir" }
serde_json = "1"

[package.metadata.krs]
k-namespace = "KRS-KEVM"

[package.metadata.krs.definitions.main]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
