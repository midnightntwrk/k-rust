[workspace]
members = [
  "crates/kink-campaign",
  "crates/kink-corpus",
  "crates/kink-flow",
  "crates/kink-native",
  "crates/kink-patch",
  "crates/kink-pattern",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
k-rust = { version = "=0.8.0", path = "../k-rust-0068938b/crates/k-rust", default-features = false }
k-rust-backend = { version = "=0.5.0", path = "../k-rust-0068938b/crates/k-rust-backend", default-features = false }
kink-native = { path = "crates/kink-native" }
kink-campaign = { path = "crates/kink-campaign" }
kink-corpus = { path = "crates/kink-corpus" }
kink-flow = { path = "crates/kink-flow" }
kink-patch = { path = "crates/kink-patch" }
kink-pattern = { path = "crates/kink-pattern" }
# `unbounded_depth`: kink-patch's `parse_json` reads kink's own JSON, which nests as deep as the
# terms it holds, without serde_json's limit of 128 (re-pin L1-3-fix-1).
serde = "1.0.229"
serde_json = { version = "1.0.149", features = ["unbounded_depth"] }
# kink-patch's `with_stack` reads the calling thread's remaining stack (re-pin L1-3-fix-2); k-rust
# already depends on it.
stacker = "0.1.25"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# k-rust's profiles (k-rust Cargo.toml), so that the tests run as they will once these crates
# are members of k-rust's workspace: the workspace at opt-level 1 with line tables only, and
# dependencies at opt-level 3. debug-assertions and overflow-checks stay on for every package.
# k-rust's own crates are dependencies here but workspace members there, so they get the
# workspace's opt-level, not the dependencies'.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.k-rust]
opt-level = 1
[profile.dev.package.k-rust-backend]
opt-level = 1
[profile.dev.package.k-rust-kore]
opt-level = 1
[profile.dev.package.k-rust-regex]
opt-level = 1

# The workspace unoptimized with full debug info, for debugger sessions that inspect local
# variables; dependencies keep the dev profile's opt-level. `cargo build --profile debugging`
# writes target/debugging.
[profile.debugging]
inherits = "dev"
opt-level = 0
debug = true
