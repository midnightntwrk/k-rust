# The loop corpus for the survivor report (flow F-06): every program ends on the
# baseline well inside a small depth bound and a generous time bound, so a mutant
# that does not end on a program stops at the depth bound: its outcome is unknown,
# never a timeout and never a kill.
[spec]
entry = "loop.k"
main_module = "LOOP"
syntax_module = "LOOP-SYNTAX"

[budget]
# the clock never decides a run of the tests (R4-WALLCLOCK)
time_ms = 600000
max_depth = 200
# A work budget so large that the depth bound stops first (FB45-KINK: the default, 5, cuts a run
# that never ends before 200 steps): these runs test the depth bound's path.
work_factor = 1000000000000

[[program]]
id = "countdown"
file = "programs/countdown.loop"

[[program]]
id = "twice"
file = "programs/twice.loop"
