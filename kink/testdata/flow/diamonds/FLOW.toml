# kink-flow corpus manifest for the diamonds fixture (fz26 KINK-PATHSET-FALLBACK, S9). With
# `work_factor = 4` a mutant's run may visit at most 4 * W + 10000 states, W the baseline's: the
# state set of `go(14, 0)` under `end-guard-dropped` visits about 60, its path set about 49 000,
# so the work budget, not a clock, decides which of the two completes.
[spec]
entry = "diamonds.k"
main_module = "DIAMONDS"
syntax_module = "DIAMONDS-SYNTAX"

[budget]
work_factor = 4

[[program]]
id = "equal-ends"
text = "go(14, 3)"

[[program]]
id = "by-zero"
text = "go(14, 0)"
