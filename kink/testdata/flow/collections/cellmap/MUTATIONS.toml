[[mutation]]
id = "balance-plus-one"
misunderstanding = "opening an account credits one unit too many"
  [[mutation.edit]]
  rule = "open"
  find = "<bal> B </bal>"
  replace = "<bal> B +Int 1 </bal>"
[[mutation]]
id = "seq-swapped"
misunderstanding = "a sequence runs its second statement first"
  [[mutation.edit]]
  rule = "seq"
  find = "P ~> Q"
  replace = "Q ~> P"
