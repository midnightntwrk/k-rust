[package]
name = "kink-native"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
k-rust.workspace = true
k-rust-backend.workspace = true
kink-patch.workspace = true
kink-pattern.workspace = true
serde_json.workspace = true

[features]
# The Z3 profile (SYM-3B-00: machine wrapper `with-z3-static-4.16.0`, no gh-release, no bundled
# build). No other workspace member enables it, so `cargo test --workspace` stays no-Z3.
z3 = ["k-rust/z3-inference"]

[dev-dependencies]
toml = { version = "=0.9.12", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
