[workload.krust]
prepare = ["growth-pred-chains"]
argv = ["kore-simplify", "-m", "PRED", "-p", "${input}", "${prepared}/growth-pred-chains/definition.kore"]
# An even number of negations simplifies to the bare \ceil.
[workload.krust.check]
stdout_squeezed = ["\\and{SortInt{}}(X:SortInt{},\\and{SortInt{}}(\\floor{SortInt{},SortInt{}}(Lblf'LParUndsRParUnds'PRED'Unds'Int'Unds'Int{}(X:SortInt{})),\\ceil{SortInt{},SortInt{}}(Lblf'LParUndsRParUnds'PRED'Unds'Int'Unds'Int{}(X:SortInt{}))))"]
