# Growth reproducers rescued from draft/open-issues-2026-10/tickets/repro/perf/ (FOLLOWUPS 2.3),
# each with its growth figures at 934d29e7 in its README. Toy definitions and generators:
# benchmarks/programs/toy/growth/ (and toy/compile-shapes/gen3.py for the owise reproducer).
# kore-simplify, kore-implies and kore-get-model are the CLI forms of the RPC methods, so they use operation "rpc".
version = 1

[[prepare]]
name = "growth-map-build"
engine = "krust"
creates = "${prepared}/growth-map-build/runtime.json"
argv = ["kcompile", "${programs}/toy/growth/map-update/map-build.k", "--main-module", "MAP-BUILD", "--syntax-module", "MAP-BUILD", "--output-directory", "${prepared}/growth-map-build", "--builtin-directory", "${builtin}"]

[[prepare]]
name = "growth-map-build-llvm"
engine = "reference"
creates = "${prepared}/growth-map-build-llvm/timestamp"
argv = ["kompile", "${programs}/toy/growth/map-update/map-build.k", "--backend", "llvm", "--main-module", "MAP-BUILD", "--syntax-module", "MAP-BUILD", "--output-definition", "${prepared}/growth-map-build-llvm"]

[[prepare]]
name = "growth-map-control"
engine = "krust"
creates = "${prepared}/growth-map-control/runtime.json"
argv = ["kcompile", "${programs}/toy/growth/map-update/control.k", "--main-module", "CTL", "--syntax-module", "CTL", "--output-directory", "${prepared}/growth-map-control", "--builtin-directory", "${builtin}"]

[[prepare]]
name = "growth-map-control-llvm"
engine = "reference"
creates = "${prepared}/growth-map-control-llvm/timestamp"
argv = ["kompile", "${programs}/toy/growth/map-update/control.k", "--backend", "llvm", "--main-module", "CTL", "--syntax-module", "CTL", "--output-definition", "${prepared}/growth-map-control-llvm"]

[[prepare]]
name = "growth-fn"
engine = "krust"
creates = "${prepared}/growth-fn/runtime.json"
argv = ["kcompile", "${programs}/toy/growth/fn-recursion/fn.k", "--main-module", "FN", "--syntax-module", "FN-SYNTAX", "--output-directory", "${prepared}/growth-fn", "--builtin-directory", "${builtin}"]

[[prepare]]
name = "growth-fn-llvm"
engine = "reference"
creates = "${prepared}/growth-fn-llvm/timestamp"
argv = ["kompile", "${programs}/toy/growth/fn-recursion/fn.k", "--backend", "llvm", "--main-module", "FN", "--syntax-module", "FN-SYNTAX", "--output-definition", "${prepared}/growth-fn-llvm"]

[[prepare]]
name = "growth-fn-control"
engine = "krust"
creates = "${prepared}/growth-fn-control/runtime.json"
argv = ["kcompile", "${programs}/toy/growth/fn-recursion/fn-control.k", "--main-module", "FN", "--syntax-module", "FN-SYNTAX", "--output-directory", "${prepared}/growth-fn-control", "--builtin-directory", "${builtin}"]

[[prepare]]
name = "growth-fn-control-llvm"
engine = "reference"
creates = "${prepared}/growth-fn-control-llvm/timestamp"
argv = ["kompile", "${programs}/toy/growth/fn-recursion/fn-control.k", "--backend", "llvm", "--main-module", "FN", "--syntax-module", "FN-SYNTAX", "--output-definition", "${prepared}/growth-fn-control-llvm"]

[[prepare]]
name = "growth-amb-llvm"
engine = "reference"
creates = "${prepared}/growth-amb-llvm/timestamp"
argv = ["kompile", "${programs}/toy/growth/ambiguous-chain/amb.k", "--backend", "llvm", "--main-module", "AMB", "--syntax-module", "AMB-SYNTAX", "--output-definition", "${prepared}/growth-amb-llvm"]

[[prepare]]
name = "growth-diamonds"
engine = "krust"
creates = "${prepared}/growth-diamonds/definition.kore"
argv = ["kcompile", "${programs}/toy/growth/import-diamonds/main.k", "--main-module", "MAIN", "--syntax-module", "MAIN", "--output-directory", "${prepared}/growth-diamonds", "--builtin-directory", "${builtin}"]

# Per ladder value: the compiled definition followed by the generated diamonds.
[[prepare]]
name = "growth-diamonds-joined"
engine = "command"
prepare = ["growth-diamonds"]
creates = "${prepared}/growth-diamonds-${d}/definition.kore"
argv = ["sh", "-c", "mkdir -p \"$(dirname \"$3\")\" && cat \"$1\" \"$2\" > \"$3\"", "sh", "${prepared}/growth-diamonds/definition.kore", "${input}", "${prepared}/growth-diamonds-${d}/definition.kore"]

[[prepare]]
name = "growth-pred-chains"
engine = "krust"
creates = "${prepared}/growth-pred-chains/definition.kore"
argv = ["kcompile", "${programs}/toy/growth/predicate-chains/pred.k", "--main-module", "PRED", "--syntax-module", "PRED", "--output-directory", "${prepared}/growth-pred-chains", "--builtin-directory", "${builtin}"]

[[prepare]]
name = "growth-pred-plain"
engine = "krust"
creates = "${prepared}/growth-pred-plain/definition.kore"
argv = ["kcompile", "${programs}/toy/growth/fill-placeholders/pred.k", "--main-module", "PRED", "--syntax-module", "PRED", "--output-directory", "${prepared}/growth-pred-plain", "--builtin-directory", "${builtin}"]

# ---------------------------------------------------------------------------------------------
# map-update.sh

[[workload]]
id = "toy/growth-map-update"
semantics = "toy"
operation = "execute"
title = "Build an N-entry map by N map updates"
stresses = "One `M[N <- N]` per step on a Map that grows by one entry per step; each update must cost about the same at any size (3.3-3.9 times per doubling at 934d29e7)."
origin = "draft/open-issues-2026-10/tickets/repro/perf/map-update.sh (FOLLOWUPS 2.3)"
tier = "standard"
pins = ["k"]
[workload.ladder]
param = "n"
values = [16000, 32000, 64000, 128000, 256000]
input = "${n}\n"
[workload.krust]
prepare = ["growth-map-build"]
argv = ["krun", "--definition", "${prepared}/growth-map-build", "--sort", "Int", "${input}"]
[workload.krust.check]
stdout_squeezed = ["Lbl'-LT-'k'-GT-'{}(kseq{}(inj{SortInt{},SortKItem{}}(\\dv{SortInt{}}(\"-${n}\")),dotk{}()))", "Lbl'-LT-'m'-GT-'{}(Lbl'Stop'Map{}())"]
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["growth-map-build-llvm"]
argv = ["krun", "--definition", "${prepared}/growth-map-build-llvm", "${input}"]
[workload.reference.check]
stdout_squeezed = ["<k>-${n}~>.K</k>", "<m>.Map</m>"]

[[workload]]
id = "toy/growth-map-update-control"
semantics = "toy"
operation = "execute"
title = "Count N steps on an Int cell (control of the map build)"
stresses = "The map build's steps without the Map, the linear baseline its growth is compared with."
origin = "draft/open-issues-2026-10/tickets/repro/perf/map-update.sh (FOLLOWUPS 2.3, the control)"
tier = "standard"
pins = ["k"]
[workload.ladder]
param = "n"
values = [16000, 32000, 64000, 128000, 256000]
input = "${n}\n"
[workload.krust]
prepare = ["growth-map-control"]
argv = ["krun", "--definition", "${prepared}/growth-map-control", "--sort", "Int", "${input}"]
[workload.krust.check]
stdout_squeezed = ["Lbl'-LT-'k'-GT-'{}(kseq{}(inj{SortInt{},SortKItem{}}(\\dv{SortInt{}}(\"-${n}\")),dotk{}()))", "Lbl'-LT-'m'-GT-'{}(\\dv{SortInt{}}(\"0\"))"]
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["growth-map-control-llvm"]
argv = ["krun", "--definition", "${prepared}/growth-map-control-llvm", "${input}"]
[workload.reference.check]
stdout_squeezed = ["<k>-${n}~>.K</k>", "<m>0</m>"]

# ---------------------------------------------------------------------------------------------
# fn-recursion.sh

[[workload]]
id = "toy/growth-fn-recursion"
semantics = "toy"
operation = "execute"
title = "Evaluate size(c^N(z)) by non-tail recursion"
stresses = "A function call N levels deep; the cost per level must not grow with the depth (3.0-3.6 times per doubling at 934d29e7)."
origin = "draft/open-issues-2026-10/tickets/repro/perf/fn-recursion.sh (FOLLOWUPS 2.3; fn.k from units/stack-cases-probes)"
tier = "standard"
pins = ["k"]
[workload.ladder]
param = "n"
values = [25000, 50000, 100000, 200000]
# At 400,000 levels krust stops with "simplification exhausted its native stack" (2026-10-16), a depth limit rather than a cost.
input = "go(${n})\n"
[workload.krust]
prepare = ["growth-fn"]
argv = ["krun", "--definition", "${prepared}/growth-fn", "--sort", "KItem", "--io", "off", "${input}"]
[workload.krust.check]
stdout_squeezed = ["Lbl'-LT-'k'-GT-'{}(kseq{}(inj{SortInt{},SortKItem{}}(\\dv{SortInt{}}(\"${n}\")),dotk{}()))"]
[workload.reference]
status = "paired"
backend = "llvm"
note = "The reference runs 25,000 levels in 0.7 s; at 200,000 levels its result could not be printed (kore-print read an empty result after 52 s), so the reference side of the ladder ends before that value."
prepare = ["growth-fn-llvm"]
argv = ["krun", "--definition", "${prepared}/growth-fn-llvm", "${input}"]
[workload.reference.check]
stdout_squeezed = ["<k>${n}~>.K</k>"]

[[workload]]
id = "toy/growth-fn-recursion-control"
semantics = "toy"
operation = "execute"
title = "Build c^N(z) and drop it (control of the recursion)"
stresses = "The same N steps building the term without the deep function evaluation, the baseline of the recursion's growth."
origin = "draft/open-issues-2026-10/tickets/repro/perf/fn-recursion.sh (FOLLOWUPS 2.3, the control)"
tier = "standard"
pins = ["k"]
[workload.ladder]
param = "n"
values = [25000, 50000, 100000, 200000]
input = "go(${n})\n"
[workload.krust]
prepare = ["growth-fn-control"]
argv = ["krun", "--definition", "${prepared}/growth-fn-control", "--sort", "KItem", "--io", "off", "${input}"]
[workload.krust.check]
stdout_squeezed = ["Lbl'-LT-'k'-GT-'{}(kseq{}(inj{SortInt{},SortKItem{}}(\\dv{SortInt{}}(\"0\")),dotk{}()))"]
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["growth-fn-control-llvm"]
argv = ["krun", "--definition", "${prepared}/growth-fn-control-llvm", "${input}"]
[workload.reference.check]
stdout_squeezed = ["<k>0~>.K</k>"]

# ---------------------------------------------------------------------------------------------
# ambiguous-chain.sh

[[workload]]
id = "toy/growth-ambiguous-chain"
semantics = "toy"
operation = "parse"
title = "Parse and refuse an ambiguous chain of N `+` and `-` operands"
stresses = "The packed forest of every bracketing between two unrelated left-associative operators is built and typed before the ambiguity is reported; cubic, a documented cost (15.7 s and 4.3 GB at 200 operands on 2026-10-16)."
origin = "draft/open-issues-2026-10/tickets/repro/perf/ambiguous-chain.sh (FOLLOWUPS 2.3)"
tier = "standard"
memory_gib = 12
pins = ["k"]
[workload.ladder]
param = "n"
values = [25, 50, 100, 200]
generator = ["python3", "-I", "${programs}/toy/growth/ambiguous-chain/gen.py", "amb", "${n}"]
[workload.krust]
argv = ["kast", "-m", "AMB", "-s", "Exp", "${programs}/toy/growth/ambiguous-chain/amb.k", "${input}"]
[workload.krust.check]
exit = 1
[workload.reference]
status = "paired"
backend = "llvm"
note = "kast reports the ambiguity with exit status 113 (3.2 s and 1.2 GB at 50 operands); at 200 operands it runs out of its 4 GiB Java heap."
prepare = ["growth-amb-llvm"]
argv = ["kast", "--definition", "${prepared}/growth-amb-llvm", "${input}"]
[workload.reference.check]
exit = 113

[[workload]]
id = "toy/growth-ambiguous-chain-control"
semantics = "toy"
operation = "parse"
title = "Parse an unambiguous chain of N `+` operands (control)"
stresses = "The same grammar and chain length with one operator only, so the parse is unambiguous: the startup and linear-chain baseline."
origin = "draft/open-issues-2026-10/tickets/repro/perf/ambiguous-chain.sh (FOLLOWUPS 2.3, the control)"
tier = "quick"
pins = ["k"]
[workload.ladder]
param = "n"
values = [25, 50, 100, 200]
generator = ["python3", "-I", "${programs}/toy/growth/ambiguous-chain/gen.py", "ctl", "${n}"]
[workload.krust]
argv = ["kast", "-m", "AMB", "-s", "Exp", "${programs}/toy/growth/ambiguous-chain/amb.k", "${input}"]
[workload.krust.check]
expect = "n - 1"
stdout = ["#token(\"${expect}\",\"Int\")"]
[workload.reference]
status = "paired"
note = "At 200 operands reference kast runs out of its 4 GiB Java heap even on the unambiguous chain."
backend = "llvm"
prepare = ["growth-amb-llvm"]
argv = ["kast", "--definition", "${prepared}/growth-amb-llvm", "${input}"]
[workload.reference.check]
expect = "n - 1"
stdout = ["${expect}"]

# ---------------------------------------------------------------------------------------------
# import-diamonds.sh

[[workload]]
id = "toy/growth-import-diamonds"
semantics = "toy"
operation = "load"
title = "Load a KORE definition with D import diamonds above its main module"
stresses = "The number of import paths doubles per diamond while the modules stay the same; loading must visit each module once (4 times per two diamonds at 934d29e7)."
origin = "draft/open-issues-2026-10/tickets/repro/perf/import-diamonds.sh (FOLLOWUPS 2.3)"
tier = "quick"
pins = ["k"]
[workload.ladder]
param = "d"
values = [16, 64, 256, 1024, 4096]
generator = ["python3", "-I", "${programs}/toy/growth/import-diamonds/gen.py", "${d}"]
[workload.krust]
prepare = ["growth-diamonds-joined"]
argv = ["kore-simplify", "-m", "TOP", "-p", "${programs}/toy/growth/import-diamonds/pattern.kore", "${prepared}/growth-diamonds-${d}/definition.kore"]
[workload.krust.check]
stdout_squeezed = ["\\dv{SortInt{}}(\"2\")"]
[workload.reference]
status = "unsupported"
reason = "no-counterpart"
note = "The reference has no one-shot command that loads a KORE definition and simplifies a pattern; its backends load definitions only inside kore-exec runs or an RPC server."

# ---------------------------------------------------------------------------------------------
# kore-implies-memory.sh

[[workload]]
id = "toy/growth-kore-implies"
semantics = "toy"
operation = "rpc"
title = "Check c^N(z) implies X and write the substitution as JSON"
stresses = "Implication and JSON output of a term N levels deep; memory once grew 3.2-3.9 times per doubling from the JSON indentation (11.1 GB at 20,000 at 934d29e7)."
origin = "draft/open-issues-2026-10/tickets/repro/perf/kore-implies-memory.sh (FOLLOWUPS 2.3)"
tier = "quick"
pins = ["k"]
[workload.ladder]
param = "n"
# At 160,000 levels kore-implies aborts on a stack overflow of its worker thread (2026-10-16); 120,000 passes.
values = [10000, 20000, 40000, 80000]
generator = ["python3", "-I", "${programs}/toy/growth/kore-implies-memory/gen.py", "${n}"]
[workload.krust]
prepare = ["growth-fn"]
argv = [
  "kore-implies", "-m", "FN",
  "--antecedent", "${input}",
  "--consequent", "${programs}/toy/growth/kore-implies-memory/consequent.kore",
  "-o", "${run}/result.json",
  "${prepared}/growth-fn/definition.kore",
]
# The result goes to a file (60 MB at 40,000); the check requires it, not its content.
[workload.krust.check]
files = ["${run}/result.json"]
[workload.reference]
status = "unsupported"
reason = "no-counterpart"
note = "The reference answers implication only through its RPC server (kore-rpc implies); it has no one-shot command."

