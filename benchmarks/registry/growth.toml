stresses = "Each copy's guarded recursions cross onto extra stack segments and return; segments should be reused rather than mapped afresh per copy (30 maps per copy at 934d29e7)."
origin = "draft/open-issues-2026-10/tickets/repro/perf/segment-churn.sh (FOLLOWUPS 2.3)"
tier = "standard"
memory_gib = 8
pins = ["k"]
[workload.ladder]
param = "m"
values = [1, 2, 4, 8, 16, 32]
generator = ["python3", "-I", "${programs}/toy/growth/segment-churn/gen.py", "${m}"]
[workload.krust]
argv = ["kast", "-m", "SEG", "-s", "T", "${programs}/toy/growth/segment-churn/seg.k", "${input}"]
[workload.krust.check]
stdout = ["`c(_)_SEG-SYNTAX_T_T`(`a_SEG-SYNTAX_T`(.KList))"]
[workload.reference]
status = "unsupported"
reason = "ref-fails"
