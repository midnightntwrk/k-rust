[[workload]]
id = "toy/growth-predicate-not-chain"
semantics = "toy"
operation = "rpc"
title = "Simplify a chain of D negations over a definedness predicate (control)"
stresses = "The linear control of the predicate chains: double negations cancel level by level (1.7 times per doubling at 934d29e7)."
origin = "draft/open-issues-2026-10/tickets/repro/perf/predicate-chains.sh (FOLLOWUPS 2.3, backend-perf-review-1 F1-F3)"
