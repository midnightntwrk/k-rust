# fill-placeholders.sh

[[workload]]
id = "toy/growth-fill-placeholders"
semantics = "toy"
operation = "rpc"
title = "Get a model of absInt^N(X) >=Int 0"
stresses = "Every level of absInt is filled into its SMT list template, so the translation must not copy each argument per level (4.1-4.5 times per doubling at 934d29e7); Z3 dominates the run."
origin = "draft/open-issues-2026-10/tickets/repro/perf/fill-placeholders.sh (FOLLOWUPS 2.3)"
tier = "standard"
pins = ["k"]
[workload.ladder]
param = "n"
# From 8,000 levels Z3 answers Unknown within krust's default resource limits (2026-10-16), so the ladder stops at 4,000.
values = [500, 1000, 2000, 4000]
generator = ["python3", "-I", "${programs}/toy/growth/fill-placeholders/gen.py", "abs", "${n}"]
[workload.krust]
prepare = ["growth-pred-plain"]
argv = ["kore-get-model", "-m", "PRED", "-p", "${input}", "${prepared}/growth-pred-plain/definition.kore"]
[workload.krust.check]
stdout_squeezed = ["\"satisfiable\":\"Sat\""]
[workload.reference]
status = "unsupported"
reason = "no-counterpart"
note = "The reference computes models only through its RPC server (kore-rpc get-model); it has no one-shot command."

