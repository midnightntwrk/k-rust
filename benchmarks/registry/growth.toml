# owise-competitors.sh

[[workload]]
id = "toy/growth-owise-competitors"
semantics = "toy"
operation = "compile"
title = "Compile N function rules beside one [owise] rule"
stresses = "Every concrete rule competes with the `[owise]` rule, whose negated conditions must not make the compile superlinear (recorded 6.7 / 12.9 / 51.8 s at 4k / 8k / 16k; linear at 934d29e7)."
origin = "draft/open-issues-2026-10/tickets/repro/perf/owise-competitors.sh (FOLLOWUPS 2.3; gen3.py from units/stack-cases-probes)"
tier = "standard"
pins = ["k"]
[workload.ladder]
param = "n"
values = [4000, 8000, 16000, 32000]
generator = ["python3", "-I", "${programs}/toy/compile-shapes/gen3.py", "owise", "${n}"]
[workload.krust]
argv = ["kcompile", "${input}", "--main-module", "MAIN", "--syntax-module", "MAIN-SYNTAX", "--output-directory", "${run}/compiled", "--builtin-directory", "${builtin}"]
[workload.krust.check]
files = ["${run}/compiled/definition.kore"]
[workload.reference]
status = "paired"
backend = "haskell"
note = "kompile --backend haskell took 14.4 s at n = 4,000 and did not finish within 300 s at n = 32,000."
argv = ["kompile", "${input}", "--backend", "haskell", "--main-module", "MAIN", "--syntax-module", "MAIN-SYNTAX", "--output-definition", "${run}/compiled"]
[workload.reference.check]
files = ["${run}/compiled/definition.kore"]
