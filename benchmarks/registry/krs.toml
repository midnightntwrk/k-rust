version = 1

# KRS: the Rust-shaped K authoring language in krs/, and its ports of KEVM, KMIR and KWasm in krs/semantics.
# The ports read only the Rust sources in krs/semantics, so no external checkout is pinned.
# The `krs/build-*` and `krs/prove-*` workloads measure the `krs` tool end to end (engine `command`): Cargo's check of the already built port collector, running the collector, lowering, and the in-process k-rust frontend or prover.
# Every `krs` workload passes `--no-reuse`, so a run does not restore the previous result of an unchanged port.
# All three ports share one Cargo target in the prepared root, which their `krs-emit-*` prepare steps build, so the timed region holds no cold Rust compilation.
# The `krs/frontend-*` workloads measure krust compiling the K that a port emits, the k-rust frontend part of `krs build` on its own.
# The KEVM port has no `krs prove` workload: `krs prove` of its 8 claims exits 2 with `error[krs::exec::result]: domain value of sort Bytes is not valid UTF-8` (2026-10-16, any --output format).
# The emitted K is much smaller than the semantics it ports (KEVM about 2,400 lines, KMIR about 1,400, KWasm about 80), so no KRS row compares with kevm/compile, kmir/compile or kwasm/compile.
# The `krs/run-machine-*` workloads measure `krs run` on a long concrete run: the machine of krs/tests/perf/fixtures/run-machine (its README states the shape and the user workload it stands for) on the program benchmarks/programs/krs/run-machine/program.py writes.
# They do not pass `--no-reuse`: `run` reuses no result, and the compiled stage is restored from the cache their prepare step fills, as it is for a user's second run of an unchanged definition, so depth 1 is the start-up a warm run pays and the deeper rows add the steps.
# `krs run` writes its status line to standard error, so their checks read `check.stderr`: the end class, the step count and the head of `<k>` there.

# Builds the `krs` tool and writes the wrapper `${prepared}/krs-tool/krs`, the argv[0] of every krs workload.
# The tool links the Z3 release krs/Krs.lock [solver] linked names on the route the KRS gates take (krs/tests/support/tools.py, z3_route).
# By default krs-cli's default features download that release at build time (z3-sys's build script, which `--offline` does not stop) and link it statically, so neither the tool nor the Cargo builds it starts need a library path.
# Under KRUST_GATE_Z3=system the tool builds with `z3-inference` alone, linked to the library directory KRS_Z3_LIB names, and the wrapper exports it.
# A mislinked tool fails the step, by the KRS gates' checks (krs/tests/support/tools.py): before the build, KRS_Z3_LIB must hold that release (z3_library_dir); after it, the tool must link it (require_linked_z3).
# Placeholders take the `${name}` form, so the script reads the environment with printenv.
[[prepare]]
name = "krs-tool"
engine = "command"
argv = [
  "bash", "-c",
  '''set -euo pipefail
export CARGO_TARGET_DIR="${prepared}/krs-tool/target"
# `z3_check library` prints the checked library directory; `z3_check linked BINARY` checks a build.
z3_check() {
  python3 - "${workspace}/krs/tests" "$@" <<'PY'
import sys
from pathlib import Path
sys.path.insert(0, sys.argv[1])
from support import GateError
from support.tools import require_linked_z3, z3_environment, z3_library_dir
try:
    if sys.argv[2] == "library":
        print(z3_library_dir())
    else:
        require_linked_z3(Path(sys.argv[3]), z3_environment())
except GateError as error:
    sys.exit(f"krs-tool: {error}")
PY
}
route=$(printenv KRUST_GATE_Z3 || true)
features= z3=
case "$route" in
  "" | gh-release) ;;
  system)
    printenv KRS_Z3_LIB >/dev/null || { echo "KRUST_GATE_Z3=system needs KRS_Z3_LIB" >&2; exit 2; }
    z3=$(z3_check library)
    features="--no-default-features --features z3-inference,kink"
    export LIBRARY_PATH="$z3" LD_LIBRARY_PATH="$z3" ;;
  *) echo "KRUST_GATE_Z3 must be gh-release or system, not $route" >&2; exit 2 ;;
esac
# $features is split into its arguments on purpose.
cargo +stable build --release --locked --offline --manifest-path "${workspace}/Cargo.toml" -p krs-cli --bin krs $features
z3_check linked "${prepared}/krs-tool/target/release/krs"
if [ -n "$z3" ]; then
  printf '#!/bin/sh\nexport LIBRARY_PATH=%s LD_LIBRARY_PATH=%s\nexec %s "$@"\n' "$z3" "$z3" "${prepared}/krs-tool/target/release/krs" >"${prepared}/krs-tool/krs.partial"
else
  printf '#!/bin/sh\nexec %s "$@"\n' "${prepared}/krs-tool/target/release/krs" >"${prepared}/krs-tool/krs.partial"
fi
chmod +x "${prepared}/krs-tool/krs.partial"
mv "${prepared}/krs-tool/krs.partial" "${prepared}/krs-tool/krs"
''',
]
creates = "${prepared}/krs-tool/krs"
timeout_seconds = 3600

# Builds the KEVM port's collector in the shared Cargo target, runs it, and writes the emitted K.
[[prepare]]
name = "krs-emit-kevm"
engine = "command"
prepare = ["krs-tool"]
argv = [
  "${prepared}/krs-tool/krs", "emit-k",
  "--manifest-path", "${workspace}/krs/semantics/Cargo.toml",
  "--package", "krs-kevm-semantics",
  "--definition", "main",
  "--output", "${prepared}/krs-emit-kevm",
]
creates = "${prepared}/krs-emit-kevm/definition.k"
env = { CARGO_TARGET_DIR = "${prepared}/krs-semantics-target", CARGO_NET_OFFLINE = "true", RUSTUP_TOOLCHAIN = "stable" }
timeout_seconds = 3600

# Builds the KMIR port's collector in the shared Cargo target, runs it, and writes the emitted K.
[[prepare]]
name = "krs-emit-kmir"
engine = "command"
prepare = ["krs-tool"]
argv = [
  "${prepared}/krs-tool/krs", "emit-k",
  "--manifest-path", "${workspace}/krs/semantics/Cargo.toml",
  "--package", "krs-kmir-semantics",
  "--definition", "main",
  "--output", "${prepared}/krs-emit-kmir",
]
creates = "${prepared}/krs-emit-kmir/definition.k"
env = { CARGO_TARGET_DIR = "${prepared}/krs-semantics-target", CARGO_NET_OFFLINE = "true", RUSTUP_TOOLCHAIN = "stable" }
timeout_seconds = 3600

# Builds the KWasm port's collector in the shared Cargo target, runs it, and writes the emitted K.
[[prepare]]
name = "krs-emit-kwasm"
engine = "command"
prepare = ["krs-tool"]
argv = [
  "${prepared}/krs-tool/krs", "emit-k",
  "--manifest-path", "${workspace}/krs/semantics/Cargo.toml",
  "--package", "krs-kwasm-semantics",
  "--definition", "main",
  "--output", "${prepared}/krs-emit-kwasm",
]
creates = "${prepared}/krs-emit-kwasm/definition.k"
env = { CARGO_TARGET_DIR = "${prepared}/krs-semantics-target", CARGO_NET_OFFLINE = "true", RUSTUP_TOOLCHAIN = "stable" }
timeout_seconds = 3600

# Writes the long-run benchmark's program and runs it for no step, which builds the definition's collector in a Cargo target of its own and stores the compiled stage, so the timed region holds neither.
[[prepare]]
name = "krs-run-machine"
engine = "command"
prepare = ["krs-tool"]
argv = [
  "bash", "-c",
  '''set -euo pipefail
mkdir -p "${prepared}/krs-run-machine"
python3 "${programs}/krs/run-machine/program.py" >"${prepared}/krs-run-machine/program.partial"
mv "${prepared}/krs-run-machine/program.partial" "${prepared}/krs-run-machine/program.bin"
"${prepared}/krs-tool/krs" run "${prepared}/krs-run-machine/program.bin" --depth 0 --output none \
  --manifest-path "${workspace}/krs/tests/perf/fixtures/run-machine/Cargo.toml" \
  --package krs-perf-run-machine --definition main --dependency krs-perf-run-cpu:cpu
touch "${prepared}/krs-run-machine/ready"
''',
]
creates = "${prepared}/krs-run-machine/ready"
env = { CARGO_TARGET_DIR = "${prepared}/krs-run-machine/target", CARGO_NET_OFFLINE = "true", RUSTUP_TOOLCHAIN = "stable", KRS_STAGE_CACHE_DIR = "${prepared}/krs-run-machine/stage-cache" }
timeout_seconds = 3600

