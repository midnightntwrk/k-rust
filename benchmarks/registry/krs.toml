env = { CARGO_TARGET_DIR = "${prepared}/krs-semantics-target", CARGO_NET_OFFLINE = "true", RUSTUP_TOOLCHAIN = "stable" }
timeout_seconds = 3600

[[workload]]
id = "krs/build-kevm-port"
semantics = "krs"
operation = "compile"
title = "Build KRS's KEVM port to KORE with `krs build`"
stresses = "The whole KRS pipeline on its largest port: collecting about 1,100 rule and syntax descriptors from the Rust sources, lowering them, and compiling the result with the k-rust frontend."
origin = "krs/tests/perf (krs-build stage, no-op scenario with --no-reuse)"
tier = "standard"
memory_gib = 8
pins = []

[workload.krust]
engine = "command"
prepare = ["krs-emit-kevm"]
argv = [
  "${prepared}/krs-tool/krs", "build",
  "--manifest-path", "${workspace}/krs/semantics/Cargo.toml",
  "--package", "krs-kevm-semantics",
  "--definition", "main",
  "--output", "${run}/out",
  "--no-reuse",
]
env = { CARGO_TARGET_DIR = "${prepared}/krs-semantics-target", CARGO_NET_OFFLINE = "true", RUSTUP_TOOLCHAIN = "stable" }
[workload.krust.check]
stdout = ["built definition.kore, syntaxDefinition.kore, macros.kore"]
files = ["${run}/out/definition.kore", "${run}/out/syntaxDefinition.kore"]

[workload.reference]
status = "unsupported"
reason = "no-counterpart"
note = "Reference K has no Rust authoring frontend; the krs/frontend-kevm-port row times the K-to-KORE part that reference kompile could pair with."

