[[workload]]
id = "krs/frontend-kevm-port"
semantics = "krs"
operation = "compile"
title = "k-rust frontend only: compile the K that KRS's KEVM port emits (about 2,400 lines of generated K) with krust"
stresses = "The k-rust frontend on machine-generated K, separated from the Rust collector and lowering that krs/build-kevm-port also times."
origin = "krs/tests/gates.sh kevm (the emitted K its --java-reference mode kompiles)"
tier = "quick"
memory_gib = 8
pins = []

[workload.krust]
prepare = ["krs-emit-kevm"]
argv = [
  "kcompile", "${prepared}/krs-emit-kevm/definition.k",
  "--main-module", "KRS-KEVM",
  "--syntax-module", "KRS-KEVM-SYNTAX",
  "--backend", "llvm",
  "--output-directory", "${run}/compiled",
  "--hook-namespaces", "KRYPTO",
  "--builtin-directory", "${builtin}",
]
[workload.krust.check]
files = ["${run}/compiled/definition.kore", "${run}/compiled/syntaxDefinition.kore"]

[workload.reference]
status = "untested"
note = "The KRS gates' --java-reference mode kompiles this emitted K with reference K (Haskell backend); no pairing has been written here."

