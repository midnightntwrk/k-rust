version = 1

# KRS: the Rust-shaped K authoring language in krs/, and its ports of KEVM, KMIR and KWasm in krs/semantics.
# The ports read only the Rust sources in krs/semantics, so no external checkout is pinned.
# The `krs/build-*` and `krs/prove-*` workloads measure the `krs` tool end to end (engine `command`): Cargo's check of the already built port collector, running the collector, lowering, and the in-process k-rust frontend or prover.
# Every `krs` workload passes `--no-reuse`, so a run does not restore the previous result of an unchanged port.
# All three ports share one Cargo target in the prepared root, which their `krs-emit-*` prepare steps build, so the timed region holds no cold Rust compilation.
# The `krs/frontend-*` workloads measure krust compiling the K that a port emits, the k-rust frontend part of `krs build` on its own.
# The KEVM port has no `krs prove` workload: `krs prove` of its 8 claims exits 1 with `error[krs::exec::result]: domain value of sort Bytes is not valid UTF-8` (2026-10-16, any --output format).
# The emitted K is much smaller than the semantics it ports (KEVM about 2,400 lines, KMIR about 1,400, KWasm about 80), so no KRS row compares with kevm/compile, kmir/compile or kwasm/compile.

# Builds the `krs` tool and writes the wrapper `${prepared}/krs-tool/krs`, the argv[0] of every krs workload.
# The tool links the Nix Z3 4.12.5 library (krs/AGENTS.local.md): the step takes it from KRS_Z3_LIB, or else from the one `*-z3-4.12.5-lib/lib` directory of the Nix store, and the wrapper exports it for the tool and the Cargo builds it starts.
[[prepare]]
name = "krs-tool"
engine = "command"
argv = [
  "bash", "-c",
  '''set -euo pipefail
z3=$(printenv KRS_Z3_LIB || ls -d /nix/store/*-z3-4.12.5-lib/lib | head -n 1)
test -d "$z3"
export LIBRARY_PATH="$z3" LD_LIBRARY_PATH="$z3" CARGO_TARGET_DIR="${prepared}/krs-tool/target"
cargo +stable build --release --locked --offline --manifest-path "${workspace}/Cargo.toml" -p krs-cli --bin krs
printf '#!/bin/sh\nexport LIBRARY_PATH=%s LD_LIBRARY_PATH=%s\nexec %s "$@"\n' "$z3" "$z3" "${prepared}/krs-tool/target/release/krs" >"${prepared}/krs-tool/krs.partial"
chmod +x "${prepared}/krs-tool/krs.partial"
mv "${prepared}/krs-tool/krs.partial" "${prepared}/krs-tool/krs"
''',
]
creates = "${prepared}/krs-tool/krs"
timeout_seconds = 3600

# Builds the KEVM port's collector in the shared Cargo target, runs it, and writes the emitted K.
[[prepare]]
name = "krs-emit-kevm"
engine = "command"
prepare = ["krs-tool"]
argv = [
  "${prepared}/krs-tool/krs", "emit-k",
  "--manifest-path", "${workspace}/krs/semantics/Cargo.toml",
  "--package", "krs-kevm-semantics",
  "--definition", "main",
  "--output", "${prepared}/krs-emit-kevm",
]
creates = "${prepared}/krs-emit-kevm/definition.k"
env = { CARGO_TARGET_DIR = "${prepared}/krs-semantics-target", CARGO_NET_OFFLINE = "true", RUSTUP_TOOLCHAIN = "stable" }
timeout_seconds = 3600

# Builds the KMIR port's collector in the shared Cargo target, runs it, and writes the emitted K.
[[prepare]]
name = "krs-emit-kmir"
engine = "command"
prepare = ["krs-tool"]
argv = [
  "${prepared}/krs-tool/krs", "emit-k",
  "--manifest-path", "${workspace}/krs/semantics/Cargo.toml",
  "--package", "krs-kmir-semantics",
  "--definition", "main",
  "--output", "${prepared}/krs-emit-kmir",
]
creates = "${prepared}/krs-emit-kmir/definition.k"
env = { CARGO_TARGET_DIR = "${prepared}/krs-semantics-target", CARGO_NET_OFFLINE = "true", RUSTUP_TOOLCHAIN = "stable" }
timeout_seconds = 3600

# Builds the KWasm port's collector in the shared Cargo target, runs it, and writes the emitted K.
[[prepare]]
name = "krs-emit-kwasm"
engine = "command"
prepare = ["krs-tool"]
argv = [
