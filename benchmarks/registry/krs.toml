[workload.krust]
engine = "command"
prepare = ["krs-emit-kevm"]
argv = [
  "${prepared}/krs-tool/krs", "build",
  "--manifest-path", "${workspace}/krs/semantics/Cargo.toml",
  "--package", "krs-kevm-semantics",
  "--definition", "main",
  "--output", "${run}/out",
  "--no-reuse",
