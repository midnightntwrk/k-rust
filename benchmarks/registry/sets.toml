# Named workload sets, for `kbench run --set NAME` and `kbench compare --set NAME`
# (schema in SCHEMA.md, "[[set]]"; `kbench sets` lists them).
#
# `ladder_max` caps a ladder for `kbench compare` only, so a compare of the set fits its time
# budget at the default five runs per binary; `kbench run --set` and `compare --full-ladders`
# run every registry value. The budgets are wall time on a host at load 5-10, measured with
# the release krust of 2026-10-16 (draft-personal/perf/krust-slowness-2026-10-16.md).

version = 1

[[set]]
name = "slowness-concrete"
description = "Concrete execution with a high cost per rewrite step: the long IMP, SIMPLE, and FUN runs and their ladders (compare: about 8 minutes)."
workloads = [
  "imp/krun-tutorial-collatz-300",
  "imp/krun-tutorial-primes-1000",
  "imp/krun-sum",
  "simple/krun-collatz-input",
  "fun/krun-tail-recursion-ladder",
  "fun/krun-callcc-loop-ladder",
  "toy/growth-map-update-control",
]
# The cost per step is constant along these ladders, so the largest values add time, not
# information: SIMPLE m = 160 alone is 22 s per run, m = 80 8 s, FUN n = 16,000 7 s.
ladder_max = { "simple/krun-collatz-input" = 40, "fun/krun-tail-recursion-ladder" = 4000, "fun/krun-callcc-loop-ladder" = 4000 }

[[set]]
name = "slowness-search"
description = "`krun --search-final` on strict-heated semantics, superlinear in the program size, with its linear controls (compare: about 10 minutes at 8 runs)."
workloads = [
  "imp/search-kink-sum",
  "imp/search-strict-heating",
  "imp/search-strict-heating-control",
  "imp/search-kink-wide8",
  "imp/search-kink-collatz",
  "imp/search-kink-primes",
  "simple/search-collatz-input",
  "imp/search-sum",
]
# Each cap keeps at least three values above 0.05 s for the growth exponent and drops the
# values that cost 8-35 s per run.
ladder_max = { "imp/search-kink-sum" = 1000, "imp/search-strict-heating" = 2048, "imp/search-kink-wide8" = 256, "simple/search-collatz-input" = 20, "imp/search-sum" = 3000 }
# Search runs allocate gigabytes per second and their CPU time varies by 20-40 % with the load
# of other jobs on the host; at five runs, two identical binaries got two false verdicts on
# 2026-10-16, at eight none (draft-personal/perf/wave1/measure.md).
runs = 8

[[set]]
name = "slowness-frontend"
description = "Parsing and compilation shapes that grow superlinearly in time or memory: ambiguous parses, list literals, many statements (compare: about 3 minutes)."
workloads = [
  "toy/parse-dn-ambiguous",
  "toy/compile-list-literal",
  "toy/growth-ambiguous-chain",
  "imp/parse-statements",
]
ladder_max = { "toy/parse-dn-ambiguous" = 50, "toy/growth-ambiguous-chain" = 100 }

[[set]]
name = "slowness-simplifier"
description = "Predicate chains and the shared-tree simplify, superlinear in the predicate or tree size (compare: about 2 minutes)."
workloads = [
  "toy/growth-predicate-ornot-chain",
  "toy/growth-predicate-implies-chain",
  "toy/shared-rpc-simplify",
]
ladder_max = { "toy/growth-predicate-ornot-chain" = 8000, "toy/growth-predicate-implies-chain" = 32000 }

[[set]]
name = "slowness"
description = "Every workload of the 2026-10-16 slowness findings: concrete execution, search, frontend, and simplifier (compare: about 23 minutes; search at 8 runs)."
sets = ["slowness-concrete", "slowness-search", "slowness-frontend", "slowness-simplifier"]

[[set]]
name = "regression"
description = "A broad, fast cross-section (parse, compile, spec-compile, load, execute, search, prove, rpc on IMP, FUN, SIMPLE, KOOL, KEVM, KWASM, KMIR) that shows a change does not slow anything else (compare: about 13 minutes)."
workloads = [
  "imp/parse-sumto10",
  "imp/parse-statements-100",
  "imp/compile",
  "imp/spec-compile",
  "imp/load",
  "imp/krun-tutorial-collatz",
  "imp/krun-tutorial-sum",
  "imp/search-spawn-interleavings",
  "imp/prove-sum-loop",
  "imp/prove-branching-program",
  "imp/execute-sum-loop",
  "imp/rpc-execute-control",
  "imp/rpc-simplify-control",
  "imp/rpc-implies-smoke",
  "fun/krun-tail-recursion",
  "fun/krun-constructor-bst-sorting",
  "fun/rpc-simplify",
  "simple/krun-sortings",
  "kool/compile-untyped",
  "kool/krun-sorting",
  "toy/compile-cell-map",
  "toy/compile-owise-functions",
  "toy/shared-rpc-execute",
  "kevm/parse-add-json",
  "kevm/compile",
  "kevm/spec-compile",
  "kevm/load",
  "kevm/prove-trivial-claim",
  "kevm/prove-infinite-gas",
  "kwasm/parse-address-c",
  "kwasm/compile",
  "kwasm/spec-compile",
  "kwasm/load",
  "kwasm/execute-address-c",
  "kwasm/prove-loops",
  "kwasm/prove-memory",
  "kmir/compile",
  "kmir/load",
]
