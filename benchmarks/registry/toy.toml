# Toy workloads from scripts/algo-workloads.toml: compiles of small K regression definitions and
# the shared-branch fixture (crates/k-rust/tests/fixtures/reference/shared-branch.k).
# shared-branch rewrites dup(n) to a, doubling the tree in <s> at each of the n steps
# (pair(T, T), one shared subterm in the backend), then branches: a => b and a => c.
# capture(n) builds the same tree and then writes "done" to the stdout stream.
version = 1

[[prepare]]
name = "shared-branch"
engine = "krust"
creates = "${prepared}/shared-branch/runtime.json"
argv = [
  "kcompile", "${workspace}/crates/k-rust/tests/fixtures/reference/shared-branch.k",
  "--main-module", "SHARED-BRANCH",
  "--syntax-module", "SHARED-BRANCH",
  "--output-directory", "${prepared}/shared-branch",
  "--builtin-directory", "${builtin}",
]

[[prepare]]
name = "shared-branch-llvm-definition"
engine = "reference"
creates = "${prepared}/shared-branch-llvm-definition/timestamp"
argv = [
  "kompile", "${workspace}/crates/k-rust/tests/fixtures/reference/shared-branch.k",
  "--backend", "llvm",
  "--enable-search",
  "--main-module", "SHARED-BRANCH",
  "--syntax-module", "SHARED-BRANCH",
  "--output-definition", "${prepared}/shared-branch-llvm-definition",
  "--warnings", "none",
]

# KORE JSON-RPC requests (see imp.toml for what scripts/algo-rpc-fixture.py does).
# shared-rpc-execute holds the initial state dup(n); shared-rpc-simplify holds the state after
# n steps, whose <s> is the full tree. Both depend on the ladder value through ${n} and ${input}.
[[prepare]]
name = "shared-rpc-execute"
engine = "command"
prepare = ["shared-branch"]
creates = "${prepared}/shared-rpc-execute-initial-${n}/request.json"
env = { K_KOMPILE = "${kbin}/kompile" }
argv = [
  "python3", "${workspace}/scripts/algo-rpc-fixture.py",
  "--krust", "${krust}",
  "--definition", "${prepared}/shared-branch",
  "--module", "SHARED-BRANCH",
  "--sort", "State",
  "--program-file", "${input}",
  "--state-depth", "0",
  "--method", "execute",
  "--max-depth", "22",
  "--output", "${prepared}/shared-rpc-execute-initial-${n}/request.json",
]

[[prepare]]
name = "shared-rpc-simplify"
engine = "command"
prepare = ["shared-branch"]
creates = "${prepared}/shared-rpc-simplify-${n}/request.json"
env = { K_KOMPILE = "${kbin}/kompile" }
argv = [
  "python3", "${workspace}/scripts/algo-rpc-fixture.py",
  "--krust", "${krust}",
  "--definition", "${prepared}/shared-branch",
  "--module", "SHARED-BRANCH",
  "--sort", "State",
  "--program-file", "${input}",
  "--state-depth", "${n}",
  "--method", "simplify",
  "--output", "${prepared}/shared-rpc-simplify-${n}/request.json",
]

# The observed-execute example (crates/k-rust/examples/observed-execute.rs), built with the
# `measure` feature as scripts/algo-receipt.sh documents; a fresh target directory takes about
# two minutes.
# It is built from the checkout's sources, not from the measured krust binary, and the step is
# skipped while the binary exists, so after a source change delete it to rebuild.
[[prepare]]
name = "observed-execute-binary"
engine = "command"
creates = "${workspace}/target/profiling/examples/observed-execute"
timeout_seconds = 3600
argv = [
  "with-z3-static-4.16.0", "cargo", "build",
  "--manifest-path", "${workspace}/Cargo.toml",
  "--profile", "profiling",
  "-p", "k-rust",
  "--no-default-features",
  "--features", "cli,measure",
  "--example", "observed-execute",
  "--locked",
]

# ---------------------------------------------------------------------------------------------
# Compiles of small definitions.
# krust's default backend writes an execution-ready definition; the reference counterpart is
# kompile --backend haskell, the pairing the haskell/rust compile differential uses.

[[workload]]
id = "toy/compile-append"
semantics = "toy"
operation = "compile"
title = "Compile the append regression definition"
stresses = "The fixed cost of a compile: prelude loading, a tiny module, and artifact writing."
origin = "scripts/algo-workloads.toml compile-append"
tier = "quick"
pins = ["k"]
[workload.krust]
argv = [
  "kcompile", "${k}/k-distribution/tests/regression-new/append/test.k",
  "--main-module", "TEST",
  "--output-directory", "${run}/compiled",
  "--builtin-directory", "${builtin}",
]
[workload.krust.check]
files = ["${run}/compiled/definition.kore", "${run}/compiled/runtime.json"]
[workload.reference]
status = "paired"
backend = "haskell"
argv = [
  "kompile", "${k}/k-distribution/tests/regression-new/append/test.k",
  "--backend", "haskell",
  "--main-module", "TEST",
  "--output-definition", "${run}/compiled",
  "--warnings", "none",
]
[workload.reference.check]
files = ["${run}/compiled/definition.kore"]

