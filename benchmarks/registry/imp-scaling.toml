# ---------------------------------------------------------------------------------------------
# IMP++ thread interleavings (CB-12 conformance recipe of pl-tutorial/1_k/4_imp++/lesson_7).

[[workload]]
id = "imp/search-spawn-interleavings"
semantics = "imp"
operation = "search"
title = "Search every interleaving of IMP++'s spawn.imp (two threads updating x)"
stresses = "Thread interleavings must recombine instead of being expanded once per path; this recipe once reached 8 GiB."
origin = "CB-12 conformance case pl-tutorial/1_k/4_imp++/lesson_7 (scripts/conformance/expectations.toml: 10.2 s, 233 MiB at 234c20d)"
tier = "quick"
pins = ["k"]
[workload.krust]
prepare = ["imp-lesson7-tutorial"]
stdin = "${k}/pyk/regression-new/pl-tutorial/1_k/4_imp++/lesson_7/tests/spawn.imp.in"
argv = [
  "krun", "--definition", "${prepared}/imp-lesson7-tutorial", "--sort", "Stmts",
  "--search-final", "--io", "off",
  "--pattern", "<output> ListItem(_) ListItem(_) ListItem(#buffer(Out:String)) </output>",
  "${k}/pyk/regression-new/pl-tutorial/1_k/4_imp++/lesson_7/tests/spawn.imp",
]
[workload.krust.check]
stdout_squeezed = [
  'VarOut:SortString{},\dv{SortString{}}("x=11\n")',
  'VarOut:SortString{},\dv{SortString{}}("x=16\n")',
  'VarOut:SortString{},\dv{SortString{}}("x=21\n")',
  'VarOut:SortString{},\dv{SortString{}}("x=33\n")',
]
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["imp-lesson7-tutorial-llvm"]
stdin = "${k}/pyk/regression-new/pl-tutorial/1_k/4_imp++/lesson_7/tests/spawn.imp.in"
argv = [
  "krun", "--definition", "${prepared}/imp-lesson7-tutorial-llvm", "--search",
  "--pattern", "<output> ListItem(_) ListItem(_) ListItem(#buffer(Out:String)) </output>",
  "${k}/pyk/regression-new/pl-tutorial/1_k/4_imp++/lesson_7/tests/spawn.imp",
]
[workload.reference.check]
stdout_squeezed = ['"x=11\n"', '"x=16\n"', '"x=21\n"', '"x=33\n"']
