prepare = ["imp-tutorial-definition"]
argv = ["krun", "--definition", "${prepared}/imp-tutorial-definition", "--sort", "Pgm", "--search-final", "${input}"]
[workload.krust.check]
stdout_squeezed = ['inj{SortId{},SortKItem{}}(\dv{SortId{}}("s")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${stmts}"))']
stdout_absent = ['\or{']
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["imp-llvm-tutorial-llvm"]
argv = ["krun", "--definition", "${prepared}/imp-llvm-tutorial-llvm", "--search", "${input}"]
[workload.reference.check]
stdout_squeezed = ["s|->${stmts}"]
stdout_absent = ["#Or"]

# ---------------------------------------------------------------------------------------------
# kink's IMP corpus (KINK-16/2 measurement, k-in-k2 905bddc): the K tutorial's lesson 4 programs
# with the loop bound as the ladder parameter, run as kink runs them: every final state.

[[workload]]
id = "imp/search-kink-sum"
semantics = "imp"
operation = "search"
title = "Search the final states of the tutorial's sum.imp, summing 1..n"
stresses = "Every iteration evaluates `sum + n` and `n + -1` through strict heating in both orders; the explored states grow faster than n (5.9 s at n = 1,000, 31 s at 2,000, 124 s at 3,000 on 2026-10-16)."
origin = "draft/kink-handoff-2026-10-15/workers/KINK-16-2-measurement.md (kink examples/imp/programs/sum.imp; raw data /var/tmp/kink26-measure-16-2/)"
tier = "standard"
pins = ["k"]
[workload.ladder]
param = "n"
values = [125, 250, 500, 1000, 2000]
input = """
int n, sum;
n = ${n};
sum = 0;
while (!(n <= 0)) {
  sum = sum + n;
  n = n + -1;
}
"""
[workload.krust]
prepare = ["imp-lesson4-tutorial"]
argv = ["krun", "--definition", "${prepared}/imp-lesson4-tutorial", "--sort", "Pgm", "--search-final", "${input}"]
[workload.krust.check]
expect = "n * (n + 1) // 2"
stdout_squeezed = ['inj{SortId{},SortKItem{}}(\dv{SortId{}}("sum")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}"))']
stdout_absent = ['\or{']
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["imp-lesson4-tutorial-llvm"]
argv = ["krun", "--definition", "${prepared}/imp-lesson4-tutorial-llvm", "--search", "${input}"]
[workload.reference.check]
expect = "n * (n + 1) // 2"
stdout_squeezed = ["sum|->${expect}"]
stdout_absent = ["#Or"]

