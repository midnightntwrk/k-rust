# ---------------------------------------------------------------------------------------------
# Strict heating (fixtures/collatz-memory, 2026-09-06).

[[workload]]
id = "imp/krun-strict-heating"
semantics = "imp"
operation = "execute"
title = "Run N copies of `s = s + a;` (two unevaluated operands per `+`)"
stresses = "Plain execution of a strict production with two heating orders, which once doubled the pending states per statement and must stay linear in N."
origin = "draft/fable51-review/conformance-host/fixtures/collatz-memory/ (strict2-K.imp at 8be7af0: 85 s and 2.6 GiB at K = 16, where K is the copy count); fixed by plain krun following one successor"
tier = "standard"
pins = ["k"]
[workload.ladder]
param = "stmts"
values = [1000, 4000, 16000, 64000]
generator = ["python3", "-I", "${programs}/imp/strict-heating/gen.py", "two", "${stmts}"]
[workload.krust]
prepare = ["imp-tutorial-definition"]
argv = ["krun", "--definition", "${prepared}/imp-tutorial-definition", "--sort", "Pgm", "${input}"]
[workload.krust.check]
expect = "stmts"
stdout_squeezed = ['inj{SortId{},SortKItem{}}(\dv{SortId{}}("s")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}"))']
stdout_absent = ['\or{']
[workload.reference]
status = "paired"
backend = "llvm"
note = "Reference krun works up to N = 4,000 (0.2 s); at N = 16,000 its kore-expand-macros step crashes with a segmentation fault, so the reference side of the ladder ends there."
prepare = ["imp-llvm-tutorial-llvm"]
argv = ["krun", "--definition", "${prepared}/imp-llvm-tutorial-llvm", "${input}"]
[workload.reference.check]
expect = "stmts"
stdout_squeezed = ["s|->${expect}"]

[[workload]]
id = "imp/search-strict-heating"
semantics = "imp"
operation = "search"
title = "Search the final states of N copies of `s = s + a;`"
stresses = "A search explores both heating orders of every strict `+`; the orders rejoin into one final state, and the cost of keeping or rejoining them grows faster than the statement count (0.7 s at 1,024, 21 s at 4,096 on 2026-10-16)."
origin = "draft/fable51-review/conformance-host/fixtures/collatz-memory/ (strict2-K.imp); search variant added when the plain-krun case became linear"
tier = "standard"
pins = ["k"]
[workload.ladder]
param = "stmts"
values = [256, 512, 1024, 2048, 4096]
generator = ["python3", "-I", "${programs}/imp/strict-heating/gen.py", "two", "${stmts}"]
[workload.krust]
prepare = ["imp-tutorial-definition"]
argv = ["krun", "--definition", "${prepared}/imp-tutorial-definition", "--sort", "Pgm", "--search-final", "${input}"]
[workload.krust.check]
expect = "stmts"
stdout_squeezed = ['inj{SortId{},SortKItem{}}(\dv{SortId{}}("s")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}"))']
stdout_absent = ['\or{']
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["imp-llvm-tutorial-llvm"]
argv = ["krun", "--definition", "${prepared}/imp-llvm-tutorial-llvm", "--search", "${input}"]
[workload.reference.check]
expect = "stmts"
stdout_squeezed = ["s|->${expect}"]
stdout_absent = ["#Or"]

[[workload]]
id = "imp/search-strict-heating-control"
semantics = "imp"
operation = "search"
title = "Search the final states of N copies of `s = s + 1;` (control)"
stresses = "The same search with one unevaluated operand per `+`, so one heating order: the baseline the two-order search is compared with."
origin = "draft/fable51-review/conformance-host/fixtures/collatz-memory/strict1-16.imp (the control of strict2-K.imp)"
