# IMP scaling workloads rescued from draft-only measurements: strict heating, kink's IMP corpus,
# and IMP++ thread interleavings. Programs and generators: benchmarks/programs/imp/.
version = 1

[[prepare]]
name = "imp-llvm-tutorial-llvm"
engine = "reference"
creates = "${prepared}/imp-llvm-tutorial-llvm/timestamp"
argv = [
  "kompile", "${k}/pyk/regression-new/imp-llvm/imp.k",
  "--backend", "llvm", "--enable-search", "--gen-glr-bison-parser",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--output-definition", "${prepared}/imp-llvm-tutorial-llvm",
]

# K tutorial IMP lesson 4 (`pl-tutorial/1_k/2_imp/lesson_4/imp.k`), kink's `examples/imp/imp.k`.
[[prepare]]
name = "imp-lesson4-tutorial"
engine = "krust"
creates = "${prepared}/imp-lesson4-tutorial/runtime.json"
argv = [
  "kcompile", "${k}/pyk/regression-new/pl-tutorial/1_k/2_imp/lesson_4/imp.k",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--output-directory", "${prepared}/imp-lesson4-tutorial",
  "--builtin-directory", "${builtin}",
]

[[prepare]]
name = "imp-lesson4-tutorial-llvm"
