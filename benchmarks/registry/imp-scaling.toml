[[workload]]
id = "imp/search-kink-primes"
semantics = "imp"
operation = "search"
title = "Search the final states of the tutorial's primes.imp, counting primes up to m"
stresses = "Nested loops of strict divisions, additions and comparisons, all heated in every order (0.8 s at m = 40, 101 s at m = 150 on 2026-10-16)."
origin = "draft/kink-handoff-2026-10-15/workers/KINK-16-2-measurement.md (kink examples/imp/programs/primes.imp)"
tier = "standard"
pins = ["k"]
[workload.ladder]
param = "m"
values = [10, 20, 40, 80]
input = """
int i, m, n, q, r, s, t, x, y, z;
m = ${m};  n = 2;
while (n <= m) {
  i = 2;  q = n/i;  t = 1;
  while (i<=q && 1<=t) {
    x = i;
    y = q;
    z = 0;
    while (!(x <= 0)) {
      q = x/2;
      r = q+q+1;
      if (r <= x) { z = z+y; } else {}
      x = q;
      y = y+y;
    }
    if (n <= z) { t = 0; } else { i = i+1;  q = n/i; }
  }
  if (1 <= t) { s = s+1; } else {}
  n = n+1;
}
"""
[workload.krust]
prepare = ["imp-lesson4-tutorial"]
argv = ["krun", "--definition", "${prepared}/imp-lesson4-tutorial", "--sort", "Pgm", "--search-final", "${input}"]
# The prime count has no closed form in m; the loop ends with n = m + 1.
[workload.krust.check]
expect = "m + 1"
stdout_squeezed = ['inj{SortId{},SortKItem{}}(\dv{SortId{}}("n")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}"))']
stdout_absent = ['\or{']
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["imp-lesson4-tutorial-llvm"]
argv = ["krun", "--definition", "${prepared}/imp-lesson4-tutorial-llvm", "--search", "${input}"]
[workload.reference.check]
expect = "m + 1"
stdout_squeezed = ["n|->${expect}"]
stdout_absent = ["#Or"]

[[workload]]
id = "imp/search-kink-collatz"
semantics = "imp"
operation = "search"
title = "Search the final states of the tutorial's collatz.imp, for all numbers up to m"
stresses = "Collatz steps through strict `+` and `/` heated in every order; the work per number varies, so growth in m is irregular (12.8 s at m = 40 on 2026-10-16)."
origin = "draft/kink-handoff-2026-10-15/workers/KINK-16-2-measurement.md (kink examples/imp/programs/collatz.imp)"
tier = "standard"
pins = ["k"]
[workload.ladder]
param = "m"
values = [5, 10, 20, 40]
input = """
int m, n, q, r, s;
m = ${m};
while (!(m<=2)) {
  n = m;
  m = m + -1;
  while (!(n<=1)) {
    s = s+1;
    q = n/2;
    r = q+q+1;
    if (r<=n) {
      n = n+n+n+1;
    } else {n=q;}
  }
}
"""
[workload.krust]
prepare = ["imp-lesson4-tutorial"]
argv = ["krun", "--definition", "${prepared}/imp-lesson4-tutorial", "--sort", "Pgm", "--search-final", "${input}"]
# The step total has no closed form in m; every number ends at n = 1 and the outer loop at m = 2.
[workload.krust.check]
stdout_squeezed = [
  'inj{SortId{},SortKItem{}}(\dv{SortId{}}("m")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("2"))',
  'inj{SortId{},SortKItem{}}(\dv{SortId{}}("n")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("1"))',
]
stdout_absent = ['\or{']
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["imp-lesson4-tutorial-llvm"]
argv = ["krun", "--definition", "${prepared}/imp-lesson4-tutorial-llvm", "--search", "${input}"]
[workload.reference.check]
stdout_squeezed = ["m|->2", "n|->1"]
stdout_absent = ["#Or"]

