prepare = ["simple-untyped-tutorial-llvm"]
stdin = "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/tests/diverse/matrix.simple.in"
argv = [
  "krun", "--definition", "${prepared}/simple-untyped-tutorial-llvm", "--output", "none",
  "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/tests/diverse/matrix.simple",
]
[workload.reference.check]
stdout = ["Line 1 (4 elements): 730 32 61 89\nLine 2 (4 elements): 32 26 37 43\nLine 3 (4 elements): 61 37 53 62\nLine 4 (4 elements): 89 43 62 73\n"]

[[workload]]
id = "simple/krun-threads-12"
semantics = "simple"
operation = "execute"
title = "Run SIMPLE's threads_12.simple (five threads with locks and rendezvous)"
stresses = "Thread creation, lock acquisition and rendezvous synchronization under plain execution, which follows one interleaving."
origin = "CB-12 conformance case pl-tutorial/2_languages/1_simple/1_untyped (scripts/conformance/expectations.toml)"
tier = "quick"
pins = ["k"]
[workload.krust]
prepare = ["simple-untyped-tutorial"]
argv = [
  "krun", "--definition", "${prepared}/simple-untyped-tutorial", "--sort", "Stmt",
  "--io", "on", "--output", "none",
  "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/tests/threads/threads_12.simple",
]
[workload.krust.check]
stdout = ["120\n"]
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["simple-untyped-tutorial-llvm"]
argv = [
  "krun", "--definition", "${prepared}/simple-untyped-tutorial-llvm", "--output", "none",
