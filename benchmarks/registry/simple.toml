# SIMPLE (untyped) tutorial programs from the CB-12 conformance throughput runs and the RUNTIME-01
# collatz.simple follow-up. Programs come from the K checkout: ${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/tests/.
# Each program reads its `.in` file on standard input and writes the console output its `.out` file holds.
version = 1

[[prepare]]
name = "simple-untyped-tutorial"
engine = "krust"
creates = "${prepared}/simple-untyped-tutorial/runtime.json"
argv = [
  "kcompile", "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/simple-untyped.md",
  "--main-module", "SIMPLE-UNTYPED",
  "--syntax-module", "SIMPLE-UNTYPED-SYNTAX",
  "--output-directory", "${prepared}/simple-untyped-tutorial",
  "--builtin-directory", "${builtin}",
  "-I", "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped",
]

[[prepare]]
name = "simple-untyped-tutorial-llvm"
engine = "reference"
creates = "${prepared}/simple-untyped-tutorial-llvm/timestamp"
argv = [
  "kompile", "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/simple-untyped.md",
  "--backend", "llvm", "--enable-search",
  "--main-module", "SIMPLE-UNTYPED",
  "--syntax-module", "SIMPLE-UNTYPED-SYNTAX",
  "--output-definition", "${prepared}/simple-untyped-tutorial-llvm",
  "-I", "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped",
]

[[workload]]
id = "simple/krun-sortings"
semantics = "simple"
operation = "execute"
title = "Run SIMPLE's sortings.simple (five array sorts with console IO)"
stresses = "Arrays in the store, function calls and console input and output; the slowest SIMPLE tutorial program in the CB-12 runs (6.2 s at b64e130, 0.9 s on 2026-10-16)."
origin = "CB-12 conformance case pl-tutorial/2_languages/1_simple/1_untyped (scripts/conformance/expectations.toml, CB-12-5 run at b64e130)"
tier = "quick"
pins = ["k"]
[workload.krust]
prepare = ["simple-untyped-tutorial"]
stdin = "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/tests/diverse/sortings.simple.in"
argv = [
  "krun", "--definition", "${prepared}/simple-untyped-tutorial", "--sort", "Stmt",
  "--io", "on", "--output", "none",
  "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/tests/diverse/sortings.simple",
]
[workload.krust.check]
stdout = ["The original unsorted array is:\n71 23 43 23 91 \n", "Sorting the array using heap sort ... Done!\nThe resulting array is:\n23 23 43 71 91 \n"]
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["simple-untyped-tutorial-llvm"]
stdin = "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/tests/diverse/sortings.simple.in"
argv = [
  "krun", "--definition", "${prepared}/simple-untyped-tutorial-llvm", "--output", "none",
  "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/tests/diverse/sortings.simple",
]
[workload.reference.check]
stdout = ["The original unsorted array is:\n71 23 43 23 91 \n", "Sorting the array using heap sort ... Done!\nThe resulting array is:\n23 23 43 71 91 \n"]

[[workload]]
id = "simple/krun-matrix"
semantics = "simple"
operation = "execute"
title = "Run SIMPLE's matrix.simple (matrix input, transpose and product)"
stresses = "Nested arrays and loops with console input read token by token (2.8 s at b64e130, 1.2 s on 2026-10-16)."
origin = "CB-12 conformance case pl-tutorial/2_languages/1_simple/1_untyped (scripts/conformance/expectations.toml, CB-12-5 and CB-15-6 runs)"
tier = "quick"
pins = ["k"]
[workload.krust]
prepare = ["simple-untyped-tutorial"]
stdin = "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/tests/diverse/matrix.simple.in"
argv = [
  "krun", "--definition", "${prepared}/simple-untyped-tutorial", "--sort", "Stmt",
  "--io", "on", "--output", "none",
  "${k}/pyk/regression-new/pl-tutorial/2_languages/1_simple/1_untyped/tests/diverse/matrix.simple",
]
[workload.krust.check]
stdout = ["Line 1 (4 elements): 730 32 61 89\nLine 2 (4 elements): 32 26 37 43\nLine 3 (4 elements): 61 37 53 62\nLine 4 (4 elements): 89 43 62 73\n"]
[workload.reference]
status = "paired"
