version = 1

# KWasm: the WebAssembly semantics at the `wasm` pin.
# Programs are the sentences of upstream's test language (test.md, WASM-TEST, parsed with WASM-TEST-SYNTAX) in tests/simple.
# Proofs are upstream's tests/proofs specs, proved against the KWASM-LEMMAS definition (kwasm-lemmas.md, syntax module WASM-TEXT-SYNTAX), the definition upstream's kdist target `kwasm-lemmas` builds for them.
# A successful program ends in the empty configuration of scripts/wasm-execution-gate.success.kore: `<k>` and `<instrs>` empty, every stack, map and store empty.
# The execution checks compare the whole terminal configuration with that file, whitespace removed.
# The [[gap]] entries at the end say why the other operations have no workload.

[[prepare]]
name = "kwasm-execution-definition"
engine = "krust"
argv = [
  "kcompile", "${wasm}/pykwasm/src/pykwasm/kdist/wasm-semantics/test.md",
  "--main-module", "WASM-TEST",
  "--syntax-module", "WASM-TEST-SYNTAX",
  "--backend", "rust",
  "--output-directory", "${prepared}/kwasm-execution-definition",
  "--builtin-directory", "${builtin}",
]
creates = "${prepared}/kwasm-execution-definition/execution.json"
timeout_seconds = 1800

[[prepare]]
name = "kwasm-lemmas-definition"
engine = "krust"
argv = [
  "kcompile", "${wasm}/pykwasm/src/pykwasm/kdist/wasm-semantics/kwasm-lemmas.md",
  "--main-module", "KWASM-LEMMAS",
  "--syntax-module", "WASM-TEXT-SYNTAX",
  "--for-proving",
  "--output-directory", "${prepared}/kwasm-lemmas-definition",
  "--builtin-directory", "${builtin}",
]
creates = "${prepared}/kwasm-lemmas-definition/krust.json"
timeout_seconds = 1800

[[prepare]]
name = "kwasm-loops-specification"
engine = "krust"
prepare = ["kwasm-lemmas-definition"]
argv = [
  "kcompile", "${wasm}/tests/proofs/loops-spec.k",
  "--compiled-definition", "${prepared}/kwasm-lemmas-definition",
  "--main-module", "LOOPS-SPEC",
  "--definition-module", "KWASM-LEMMAS",
  "--for-proving",
  "--output-directory", "${prepared}/kwasm-loops-specification",
  "-I", "${wasm}/pykwasm/src/pykwasm/kdist/wasm-semantics",
  "--builtin-directory", "${builtin}",
]
creates = "${prepared}/kwasm-loops-specification/krust.json"
timeout_seconds = 1800

[[prepare]]
name = "kwasm-lemmas-reference-definition"
engine = "reference"
argv = [
  "kompile", "${wasm}/pykwasm/src/pykwasm/kdist/wasm-semantics/kwasm-lemmas.md",
  "--backend", "haskell",
  "--main-module", "KWASM-LEMMAS",
  "--syntax-module", "WASM-TEXT-SYNTAX",
  "--output-definition", "${prepared}/kwasm-lemmas-reference-definition",
  "--warnings", "none",
]
creates = "${prepared}/kwasm-lemmas-reference-definition/definition.kore"
timeout_seconds = 3600

[[workload]]
id = "kwasm/compile"
semantics = "kwasm"
operation = "compile"
title = "Compile the KWasm test-language definition (test.md, WASM-TEST) from source"
stresses = "The frontend and execution-artifact writer on a mid-sized real semantics with float, integer and memory instructions."
origin = "scripts/reference-differential.toml wasm (haskell/rust pairing); scripts/algo-workloads.toml wasm-compile-rust"
tier = "standard"
memory_gib = 12
timeout_seconds = 1800
pins = ["k", "wasm"]

[workload.krust]
argv = [
  "kcompile", "${wasm}/pykwasm/src/pykwasm/kdist/wasm-semantics/test.md",
  "--main-module", "WASM-TEST",
  "--backend", "rust",
  "--output-directory", "${run}/compiled",
  "--emit-json",
  "--md-selector", "k & ! concrete",
  "--builtin-directory", "${builtin}",
]
[workload.krust.check]
files = ["${run}/compiled/definition.kore", "${run}/compiled/execution.json"]

[workload.reference]
status = "paired"
argv = [
  "kompile", "${wasm}/pykwasm/src/pykwasm/kdist/wasm-semantics/test.md",
  "--backend", "haskell",
  "--main-module", "WASM-TEST",
  "--output-definition", "${run}/compiled",
  "--md-selector", "k & ! concrete",
  "--emit-json",
  "--warnings", "none",
]
[workload.reference.check]
files = ["${run}/compiled/definition.kore", "${run}/compiled/compiled.json"]

[[workload]]
id = "kwasm/parse-address-c"
semantics = "kwasm"
operation = "parse"
title = "Parse KWasm's address-c.wast test program (591 lines) with the test-language grammar"
stresses = "The program parser on a long WebAssembly text program; krust kast also builds the grammar from test.md in the same run."
origin = "wasm-semantics tests/simple/address-c.wast"
tier = "quick"
memory_gib = 8
pins = ["k", "wasm"]

[workload.krust]
argv = [
  "kast", "${wasm}/pykwasm/src/pykwasm/kdist/wasm-semantics/test.md",
  "--module", "WASM-TEST-SYNTAX",
  "--sort", "Stmts",
  "--builtin-directory", "${builtin}",
  "${wasm}/tests/simple/address-c.wast",
]
[workload.krust.check]
stdout = [
  '`___WASM-COMMON-SYNTAX_Stmts_Stmt_Stmts`(`(module__)_WASM-TEXT-COMMON-SYNTAX_ModuleDecl_OptionalId_Defns`',
  '`.List{"___WASM-COMMON-SYNTAX_Stmts_Stmt_Stmts"}_Stmts`(.KList)',
]

[workload.reference]
status = "untested"
note = "Reference kast parses with an already kompiled definition, while krust kast builds the grammar from source in the same run; no pairing has been written."

[[workload]]
id = "kwasm/execute-simple-corpus"
semantics = "kwasm"
operation = "execute"
title = "Run the 27 passing KWasm test programs of tests/simple one after another"
stresses = "Concrete execution across the whole instruction set (integers, floats, memory, tables, modules), each program a separate krun on one prepared definition."
origin = "scripts/wasm-execution-gate.sh (its 28 programs minus simple/fconversions-c, a known upstream failure)"
tier = "standard"
memory_gib = 8
pins = ["k", "wasm"]

# Standard output is the concatenation of all 27 runs, so each run matches its result against a pattern instead.
# A program that ends with an empty `<k>`, `<instrs>` and value stack prints the match; any other result prints `\bottom` for the failed match, which the check rejects.
# Upstream's test programs check their own results with assertions, so a failed assertion leaves `<k>` or `<instrs>` non-empty.
[workload.krust]
prepare = ["kwasm-execution-definition"]
steps = [
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/address-c.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/arithmetic.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/bitwise.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/branching.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/comments.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/comparison.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/constants.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/control-flow.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/conversion.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/data.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/desugaring.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/f64-cs.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/f64_bitwise-cs.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/f64_cmp-cs.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/functions_call.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/i64.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/identifiers.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/imports.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/integers.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/memory.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/modules.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/polymorphic.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/start.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/table.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/text2abstract.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/unicode.wast"],
  ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "--pattern", "<k> .K </k> <instrs> .K </instrs> <valstack> .ValStack </valstack>", "${wasm}/tests/simple/variables.wast"],
]
[workload.krust.check]
exit = 0
stdout = ["\\and{SortGeneratedTopCell{}}"]
stdout_absent = ['\bottom']
[workload.reference]
status = "unsupported"
reason = "missing-hook"
backend = "haskell"
note = "The pinned Haskell backend has no evaluator for FLOAT.round, a hook of KWasm's float instructions. The pinned LLVM backend compiles and runs these programs (scripts/reference-differential.toml, [[excluded]] wasm-execution), but no LLVM pairing has been written here."

[[workload]]
id = "kwasm/execute-address-c"
semantics = "kwasm"
operation = "execute"
title = "Run KWasm's address-c.wast test program: 591 lines of memory loads and stores at many addresses"
stresses = "The longest program of the corpus: many integer and float memory accesses through KWasm's byte-map memory."
origin = "scripts/wasm-execution-gate.sh simple/address-c"
tier = "quick"
memory_gib = 8
pins = ["k", "wasm"]

[workload.krust]
prepare = ["kwasm-execution-definition"]
argv = ["krun", "--definition", "${prepared}/kwasm-execution-definition", "--sort", "Stmts", "${wasm}/tests/simple/address-c.wast"]
[workload.krust.check]
exit = 0
stdout_squeezed = ['''Lbl'-LT-'generatedTop'-GT-'{}(Lbl'-LT-'wasm-test'-GT-'{}(Lbl'-LT-'k'-GT-'{}(dotk{}()),Lbl'-LT-'wasm'-GT-'{}(Lbl'-LT-'instrs'-GT-'{}(dotk{}()),Lbl'-LT-'valstack'-GT-'{}(Lbl'Stop'ValStack{}()),Lbl'-LT-'curFrame'-GT-'{}(Lbl'-LT-'locals'-GT-'{}(Lbl'Stop'Map{}()),Lbl'-LT-'curModIdx'-GT-'{}(Lbl'Stop'Int{}())),Lbl'-LT-'moduleRegistry'-GT-'{}(Lbl'Stop'Map{}()),Lbl'-LT-'moduleIds'-GT-'{}(Lbl'Stop'Map{}()),Lbl'-LT-'moduleInstances'-GT-'{}(Lbl'Stop'ModuleInstCellMap{}()),Lbl'-LT-'nextModuleIdx'-GT-'{}(\dv{SortInt{}}("0")),Lbl'-LT-'mainStore'-GT-'{}(Lbl'-LT-'funcs'-GT-'{}(Lbl'Stop'FuncDefCellMap{}()),Lbl'-LT-'nextFuncAddr'-GT-'{}(\dv{SortInt{}}("0")),Lbl'-LT-'tabs'-GT-'{}(Lbl'Stop'TabInstCellMap{}()),Lbl'-LT-'nextTabAddr'-GT-'{}(\dv{SortInt{}}("0")),Lbl'-LT-'mems'-GT-'{}(Lbl'Stop'MemInstCellMap{}()),Lbl'-LT-'nextMemAddr'-GT-'{}(\dv{SortInt{}}("0")),Lbl'-LT-'globals'-GT-'{}(Lbl'Stop'GlobalInstCellMap{}()),Lbl'-LT-'nextGlobAddr'-GT-'{}(\dv{SortInt{}}("0")),Lbl'-LT-'elems'-GT-'{}(Lbl'Stop'ElemInstCellMap{}()),Lbl'-LT-'nextElemAddr'-GT-'{}(\dv{SortInt{}}("0"))),Lbl'-LT-'deterministicMemoryGrowth'-GT-'{}(\dv{SortBool{}}("true")))),Lbl'-LT-'generatedCounter'-GT-'{}(\dv{SortInt{}}("0")))''']

[workload.reference]
status = "unsupported"
reason = "missing-hook"
backend = "haskell"
note = "The pinned Haskell backend has no evaluator for FLOAT.round, a hook of KWasm's float instructions, which this program's f32 and f64 loads reach. The pinned LLVM backend runs it, but no LLVM pairing has been written here."

