[[workload]]
id = "imp/prove-sum-loop"
semantics = "imp"
operation = "prove"
title = "Prove sum-loop from source spec (the loop is its own invariant)"
stresses = "Spec compile plus a loop proof by circularity, the IMP claim with the most states and solver queries."
origin = "scripts/benchmark.sh --suite imp --phase prove --claim IMP-SIMPLE-SPEC.sum-loop"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
