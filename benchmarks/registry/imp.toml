# ---------------------------------------------------------------------------------------------
# Parse (kast).
# krust kast reads the source definition and builds its parser in the run; reference kast reads
# the prepared Haskell definition. Both print KAST JSON.

[[workload]]
id = "imp/parse-sumto10"
semantics = "imp"
operation = "parse"
title = "Parse sumto10.imp to KAST"
stresses = "Program parsing end to end on a small input, so the cost is mostly building the parser from the grammar and starting the tool."
origin = "scripts/reference-differential.toml [[kast]] imp, entry sumto10.imp"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
argv = [
  "kast", "${imp}/src/kimp/kdist/imp-semantics/imp.k",
  "--module", "IMP-SYNTAX",
  "--sort", "Stmt",
  "--output", "json",
  "--backend", "rust",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
  "--builtin-directory", "${builtin}",
  "${imp}/examples/sumto10.imp",
]
[workload.krust.check]
stdout_squeezed = ['"name":"while(_)__IMP-SYNTAX_Stmt_Expr_Stmt"', '"name":"_<=__EXPR-SYNTAX_Expr_Expr_Expr"']
[workload.reference]
status = "paired"
prepare = ["imp-haskell-definition"]
argv = [
  "kast",
  "--definition", "${prepared}/imp-haskell-definition",
  "--module", "IMP-SYNTAX",
  "--sort", "Stmt",
  "--output", "json",
  "--warnings", "none",
  "${imp}/examples/sumto10.imp",
]
[workload.reference.check]
stdout_squeezed = ['"name":"while(_)__IMP-SYNTAX_Stmt_Expr_Stmt"', '"name":"_<=__EXPR-SYNTAX_Expr_Expr_Expr"']

# The statement sequence `Stmt Stmt` has no associativity, so a long program is ambiguous.
[[workload]]
id = "imp/parse-statements-100"
semantics = "imp"
operation = "parse"
title = "Parse a program of 100 assignments to KAST"
stresses = "A sequence of 100 statements whose `Stmt Stmt` grouping is ambiguous, so the parser's handling of ambiguity, not tool startup, sets the cost."
origin = "new (benchmarks/programs/imp/statements.py 100)"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
argv = [
  "kast", "${imp}/src/kimp/kdist/imp-semantics/imp.k",
  "--module", "IMP-SYNTAX",
  "--sort", "Stmt",
  "--output", "json",
  "--backend", "rust",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
  "--builtin-directory", "${builtin}",
  "${programs}/imp/statements-100.imp",
]
[workload.krust.check]
stdout_squeezed = ['"token":"x100"', '"token":"x99"']
[workload.reference]
status = "paired"
prepare = ["imp-haskell-definition"]
note = "7 s and 1.9 GiB at 100 statements (2026-10-16); at 300 statements reference kast exhausts its 4 GiB heap, so imp/parse-statements is not paired."
argv = [
  "kast",
  "--definition", "${prepared}/imp-haskell-definition",
  "--module", "IMP-SYNTAX",
  "--sort", "Stmt",
  "--output", "json",
  "--warnings", "none",
  "${programs}/imp/statements-100.imp",
]
[workload.reference.check]
stdout_squeezed = ['"token":"x100"', '"token":"x99"']

[[workload]]
id = "imp/parse-statements"
semantics = "imp"
operation = "parse"
title = "Parse programs of n assignments to KAST"
stresses = "Parse cost as the ambiguous statement sequence grows; the growth exponent shows whether ambiguity handling stays linear in the program length."
origin = "new (benchmarks/programs/imp/statements.py)"
tier = "quick"
pins = ["k", "imp"]
[workload.ladder]
param = "n"
values = [10, 100, 1000, 3000, 10000]
stop_seconds = 120
generator = ["python3", "-I", "${programs}/imp/statements.py", "${n}"]
[workload.krust]
argv = [
  "kast", "${imp}/src/kimp/kdist/imp-semantics/imp.k",
  "--module", "IMP-SYNTAX",
  "--sort", "Stmt",
  "--output", "json",
  "--backend", "rust",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
  "--builtin-directory", "${builtin}",
  "${input}",
]
[workload.krust.check]
stdout_squeezed = ['"token":"x${n}"']
[workload.reference]
status = "unsupported"
reason = "ref-fails"
note = "Reference kast (4 GiB heap) parses 100 statements in 7 s and fails with OutOfMemoryError at 300 (82 s) and 1,000 (520 s) statements (2026-10-16); imp/parse-statements-100 is the paired point."

# ---------------------------------------------------------------------------------------------
# Concrete execution (krun) of imp-semantics.
# The reference side is the LLVM backend's krun with KORE output.
# krust prints the cell map as nested `_Map_` applications and the reference as one
# `\left-assoc`, so each check names one binding, which both forms contain once whitespace is removed.

[[workload]]
id = "imp/krun-sumto10"
semantics = "imp"
operation = "execute"
title = "Run sumto10.imp (sum of 0..10)"
stresses = "Concrete execution of a short loop, so the cost is mostly loading the definition and starting the tool."
origin = "scripts/reference-differential.toml [[execution]] imp (sumto10.imp)"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
prepare = ["imp-definition"]
argv = [
  "krun",
  "--definition", "${prepared}/imp-definition",
  "--sort", "Stmt",
  "-c", "ENV=.Map",
  "${imp}/examples/sumto10.imp",
]
[workload.krust.check]
stdout_squeezed = [
  'inj{SortId{},SortKItem{}}(\dv{SortId{}}("sum")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("55"))',
  "Lbl'-LT-'k'-GT-'{}(dotk{}())",
]
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["imp-llvm-definition"]
argv = [
  "krun",
  "--definition", "${prepared}/imp-llvm-definition",
  "-cENV=.Map",
  "--output", "kore",
  "${imp}/examples/sumto10.imp",
]
[workload.reference.check]
stdout_squeezed = [
  'inj{SortId{},SortKItem{}}(\dv{SortId{}}("sum")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("55"))',
  "Lbl'-LT-'k'-GT-'{}(dotk{}())",
]

# The loop runs n + 1 times and the result binds sum to n(n + 1)/2.
[[workload]]
id = "imp/krun-sum"
semantics = "imp"
operation = "execute"
title = "Run a loop summing 0..n"
stresses = "Concrete rewriting throughput on a while loop with map lookups and updates; the growth exponent should stay near 1."
origin = "scripts/algo-workloads.toml imp-krun-sum"
tier = "quick"
pins = ["k", "imp"]
[workload.ladder]
param = "n"
values = [10, 100, 1000, 3000, 10000]
stop_seconds = 120
input = """
sum = 0;
n = ${n};
k = 0;
while (k <= n) {
  sum = sum + k;
  k = k + 1;
}
"""
[workload.krust]
prepare = ["imp-definition"]
argv = [
  "krun",
  "--definition", "${prepared}/imp-definition",
  "--sort", "Stmt",
  "-c", "ENV=.Map",
  "${input}",
]
[workload.krust.check]
expect = "n * (n + 1) // 2"
stdout_squeezed = ['inj{SortId{},SortKItem{}}(\dv{SortId{}}("sum")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}"))']
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["imp-llvm-definition"]
argv = [
  "krun",
  "--definition", "${prepared}/imp-llvm-definition",
  "-cENV=.Map",
  "--output", "kore",
  "${input}",
]
[workload.reference.check]
expect = "n * (n + 1) // 2"
stdout_squeezed = ['inj{SortId{},SortKItem{}}(\dv{SortId{}}("sum")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}"))']

# ---------------------------------------------------------------------------------------------
# Search of imp-semantics.
# The reference search output annotates injections with `/*Inj:*/` comments, which stay in the
# squeezed text; its checks name the binding in that form.

[[workload]]
id = "imp/search-sumto10"
semantics = "imp"
operation = "search"
title = "Search the final states of sumto10.imp"
stresses = "Search mode on a deterministic program: every reachable state is kept and checked for successors, and exactly one final state must come out."
origin = "scripts/reference-differential.toml [[execution.search]] imp (sumto10.imp)"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
prepare = ["imp-definition"]
argv = [
  "krun",
  "--definition", "${prepared}/imp-definition",
  "--sort", "Stmt",
  "-c", "ENV=.Map",
  "--search-final",
  "${imp}/examples/sumto10.imp",
]
[workload.krust.check]
stdout_squeezed = [
  'inj{SortId{},SortKItem{}}(\dv{SortId{}}("sum")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("55"))',
  "Lbl'-LT-'k'-GT-'{}(dotk{}())",
]
stdout_absent = ['\or{']
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["imp-llvm-definition"]
argv = [
  "krun",
  "--definition", "${prepared}/imp-llvm-definition",
  "-cENV=.Map",
  "--search-final",
  "--output", "kore",
  "${imp}/examples/sumto10.imp",
]
[workload.reference.check]
stdout_squeezed = [
  '\dv{SortId{}}("sum")),/*Inj:*/inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("55"))',
  "Lbl'-LT-'k'-GT-'{}(dotk{}())",
]
stdout_absent = ['\or{']

[[workload]]
id = "imp/search-sum"
semantics = "imp"
operation = "search"
title = "Search the final states of a loop summing 0..n"
stresses = "Search-mode bookkeeping (visited states, successor sets) on a long deterministic run; it should cost a constant factor over plain execution, not more."
origin = "new (the imp/krun-sum ladder under --search-final)"
tier = "quick"
pins = ["k", "imp"]
[workload.ladder]
param = "n"
values = [10, 100, 1000, 3000, 10000]
stop_seconds = 120
input = """
sum = 0;
n = ${n};
k = 0;
while (k <= n) {
  sum = sum + k;
  k = k + 1;
}
"""
[workload.krust]
prepare = ["imp-definition"]
argv = [
  "krun",
  "--definition", "${prepared}/imp-definition",
  "--sort", "Stmt",
  "-c", "ENV=.Map",
  "--search-final",
  "${input}",
]
[workload.krust.check]
expect = "n * (n + 1) // 2"
stdout_squeezed = ['inj{SortId{},SortKItem{}}(\dv{SortId{}}("sum")),inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}"))']
stdout_absent = ['\or{']
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["imp-llvm-definition"]
argv = [
  "krun",
  "--definition", "${prepared}/imp-llvm-definition",
  "-cENV=.Map",
  "--search-final",
  "--output", "kore",
  "${input}",
]
[workload.reference.check]
expect = "n * (n + 1) // 2"
stdout_squeezed = ['\dv{SortId{}}("sum")),/*Inj:*/inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}"))']
stdout_absent = ['\or{']

