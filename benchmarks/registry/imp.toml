# IMP workloads: imp-semantics (the pinned `${imp}` checkout) and the K tutorial's IMP.
# The compile, spec-compile, load, execute and prove workloads are the IMP cases of the former
# scripts/benchmark.sh; their reference argv is the command that script ran, so the figures it
# recorded in scripts/benchmark-canonical.json belong to the same ids.
# The krun, search, parse and RPC workloads come from scripts/algo-workloads.toml or are new.
# Tracked inputs: benchmarks/programs/imp/.
version = 1

# ---------------------------------------------------------------------------------------------
# Prepared definitions.

# imp-semantics compiled for proving: the semantics prove and spec-compile start from.
[[prepare]]
name = "imp-proof-definition"
engine = "krust"
creates = "${prepared}/imp-proof-definition/parsed.provenance.json"
argv = [
  "kcompile", "${imp}/src/kimp/kdist/imp-semantics/imp.k",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--for-proving",
  "--output-directory", "${prepared}/imp-proof-definition",
  "--builtin-directory", "${builtin}",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]

# imp-simple-spec.k compiled against the prepared semantics: the bundle load and execute read.
[[prepare]]
name = "imp-specification"
engine = "krust"
prepare = ["imp-proof-definition"]
creates = "${prepared}/imp-specification/krust.json"
argv = [
  "kcompile", "${imp}/examples/specs/imp-simple-spec.k",
  "--compiled-definition", "${prepared}/imp-proof-definition",
  "--main-module", "IMP-SIMPLE-SPEC",
  "--definition-module", "IMP-VERIFICATION",
  "--for-proving",
  "--output-directory", "${prepared}/imp-specification",
  "--builtin-directory", "${builtin}",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]

# imp-semantics compiled for execution (krun and kore-rpc).
[[prepare]]
name = "imp-definition"
engine = "krust"
creates = "${prepared}/imp-definition/runtime.json"
argv = [
  "kcompile", "${imp}/src/kimp/kdist/imp-semantics/imp.k",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--output-directory", "${prepared}/imp-definition",
  "--builtin-directory", "${builtin}",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]

# The reference Haskell definition that scripts/benchmark.sh prepared for its proofs.
[[prepare]]
name = "imp-haskell-definition"
engine = "reference"
creates = "${prepared}/imp-haskell-definition/timestamp"
argv = [
  "kompile", "${imp}/src/kimp/kdist/imp-semantics/imp.k",
  "--backend", "haskell",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--output-definition", "${prepared}/imp-haskell-definition",
  "--warnings", "none",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]

# The reference LLVM definition for concrete execution and search (search needs --enable-search).
[[prepare]]
name = "imp-llvm-definition"
engine = "reference"
creates = "${prepared}/imp-llvm-definition/timestamp"
argv = [
  "kompile", "${imp}/src/kimp/kdist/imp-semantics/imp.k",
  "--backend", "llvm",
  "--enable-search",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--output-definition", "${prepared}/imp-llvm-definition",
  "--warnings", "none",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]

# The K tutorial's IMP (`int` declarations, strict operators, a `<state>` map).
[[prepare]]
name = "imp-tutorial-definition"
engine = "krust"
creates = "${prepared}/imp-tutorial-definition/runtime.json"
argv = [
  "kcompile", "${k}/pyk/regression-new/imp-llvm/imp.k",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--output-directory", "${prepared}/imp-tutorial-definition",
  "--builtin-directory", "${builtin}",
]

[[prepare]]
name = "imp-tutorial-llvm-definition"
engine = "reference"
creates = "${prepared}/imp-tutorial-llvm-definition/timestamp"
argv = [
  "kompile", "${k}/pyk/regression-new/imp-llvm/imp.k",
  "--backend", "llvm",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--output-definition", "${prepared}/imp-tutorial-llvm-definition",
  "--warnings", "none",
]

# KORE JSON-RPC requests built from a krust state.
# scripts/algo-rpc-fixture.py runs `krust krun` to the final state, converts it to KORE JSON with
# the reference kore-parser (found next to K_KOMPILE), and wraps it in a request.
[[prepare]]
name = "imp-rpc-execute-control"
engine = "command"
prepare = ["imp-definition"]
creates = "${prepared}/imp-rpc-execute-control/request.json"
env = { K_KOMPILE = "${kbin}/kompile" }
argv = [
  "python3", "${workspace}/scripts/algo-rpc-fixture.py",
  "--krust", "${krust}",
  "--definition", "${prepared}/imp-definition",
  "--module", "IMP",
  "--sort", "Stmt",
  "--program-file", "${workspace}/crates/k-rust/tests/fixtures/reference/rpc/imp-control.imp",
  "--config", "ENV=.Map",
  "--method", "execute",
  "--max-depth", "1",
  "--output", "${prepared}/imp-rpc-execute-control/request.json",
]

[[prepare]]
name = "imp-rpc-simplify-control"
engine = "command"
prepare = ["imp-definition"]
creates = "${prepared}/imp-rpc-simplify-control/request.json"
env = { K_KOMPILE = "${kbin}/kompile" }
argv = [
  "python3", "${workspace}/scripts/algo-rpc-fixture.py",
  "--krust", "${krust}",
  "--definition", "${prepared}/imp-definition",
  "--module", "IMP",
  "--sort", "Stmt",
  "--program-file", "${workspace}/crates/k-rust/tests/fixtures/reference/rpc/imp-control.imp",
  "--config", "ENV=.Map",
  "--method", "simplify",
  "--output", "${prepared}/imp-rpc-simplify-control/request.json",
]

# ---------------------------------------------------------------------------------------------
# Compile, spec-compile, load, execute, prove (scripts/benchmark.sh --suite imp).

[[workload]]
id = "imp/compile"
semantics = "imp"
operation = "compile"
title = "Compile IMP for proving"
stresses = "The whole frontend on a small semantics: parsing, type inference, compiler passes and artifact writing, from source to a proof-ready definition."
origin = "scripts/benchmark.sh --suite imp --phase compile"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
argv = [
  "kcompile", "${imp}/src/kimp/kdist/imp-semantics/imp.k",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--for-proving",
  "--output-directory", "${run}/compiled",
  "--builtin-directory", "${builtin}",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]
[workload.krust.check]
files = ["${run}/compiled/definition.kore", "${run}/compiled/krust.json"]
[workload.reference]
status = "paired"
backend = "haskell"
argv = [
  "kompile", "${imp}/src/kimp/kdist/imp-semantics/imp.k",
  "--backend", "haskell",
  "--main-module", "IMP",
  "--syntax-module", "IMP-SYNTAX",
  "--output-definition", "${run}/compiled",
  "--warnings", "none",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]
[workload.reference.check]
files = ["${run}/compiled/definition.kore"]

[[workload]]
id = "imp/spec-compile"
semantics = "imp"
operation = "spec-compile"
title = "Compile the IMP specification against prepared semantics"
stresses = "Compiling a new spec module on top of an already parsed semantics: the semantics' source parse is skipped, but the compiler passes run again on the combined definition."
origin = "scripts/benchmark.sh --suite imp --phase spec-compile"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
prepare = ["imp-proof-definition"]
argv = [
  "kcompile", "${imp}/examples/specs/imp-simple-spec.k",
  "--compiled-definition", "${prepared}/imp-proof-definition",
  "--main-module", "IMP-SIMPLE-SPEC",
  "--definition-module", "IMP-VERIFICATION",
  "--for-proving",
  "--output-directory", "${run}/specification",
  "--builtin-directory", "${builtin}",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]
[workload.krust.check]
files = ["${run}/specification/definition.kore", "${run}/specification/krust.json"]
[workload.reference]
status = "unsupported"
reason = "no-counterpart"
note = "Reference kprove compiles the specification as part of every proof and has no separate spec-compile step; imp/prove-* compares the combined cost."

[[workload]]
id = "imp/load"
semantics = "imp"
operation = "load"
title = "Load the prepared IMP proof bundle"
stresses = "Reading and parsing the proof-ready KORE and internalizing the backend, with no solver and no proof: the fixed cost under every execute workload."
origin = "scripts/benchmark.sh --suite imp --phase load"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
prepare = ["imp-specification"]
argv = [
  "kprove",
  "--compiled-definition", "${prepared}/imp-specification",
  "--main-module", "IMP-SIMPLE-SPEC",
  "--load-only",
]
# --load-only prints nothing; the exit status is the check.
[workload.krust.check]
exit = 0
[workload.reference]
status = "unsupported"
reason = "no-counterpart"
note = "Reference kprove has no load-only mode."

[[workload]]
id = "imp/execute-addition-var"
semantics = "imp"
operation = "prove"
title = "Prove addition-var from the prepared bundle (symbolic addition)"
stresses = "Loading the proof bundle, starting the solver and proving a two-state symbolic claim, with the spec compile already done."
origin = "scripts/benchmark.sh --suite imp --phase execute --claim IMP-SIMPLE-SPEC.addition-var"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
prepare = ["imp-specification"]
argv = [
  "kprove",
  "--compiled-definition", "${prepared}/imp-specification",
  "--main-module", "IMP-SIMPLE-SPEC",
  "--claim", "IMP-SIMPLE-SPEC.addition-var",
  "--depth", "100",
]
[workload.krust.check]
stdout = ["claim IMP-SIMPLE-SPEC.addition-var: proven"]
[workload.reference]
status = "unsupported"
reason = "no-counterpart"
note = "Reference kprove always compiles the specification before proving; imp/prove-addition-var is the paired comparison."

[[workload]]
id = "imp/execute-branching-program"
semantics = "imp"
operation = "prove"
title = "Prove branching-program from the prepared bundle (symbolic if/else)"
stresses = "A claim whose execution splits on a symbolic condition, so the prover explores and closes both branches (11 states)."
origin = "scripts/benchmark.sh --suite imp --phase execute --claim IMP-SIMPLE-SPEC.branching-program"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
prepare = ["imp-specification"]
argv = [
  "kprove",
  "--compiled-definition", "${prepared}/imp-specification",
  "--main-module", "IMP-SIMPLE-SPEC",
  "--claim", "IMP-SIMPLE-SPEC.branching-program",
  "--depth", "100",
]
[workload.krust.check]
stdout = ["claim IMP-SIMPLE-SPEC.branching-program: proven"]
[workload.reference]
status = "unsupported"
reason = "no-counterpart"
note = "Reference kprove always compiles the specification before proving; imp/prove-branching-program is the paired comparison."

[[workload]]
id = "imp/execute-sum-loop"
semantics = "imp"
operation = "prove"
title = "Prove sum-loop from the prepared bundle (the loop is its own invariant)"
stresses = "A loop claim proved by circularity: the prover must reach the loop head again and discharge it against the claim itself (36 states)."
origin = "scripts/benchmark.sh --suite imp --phase execute --claim IMP-SIMPLE-SPEC.sum-loop"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
prepare = ["imp-specification"]
argv = [
  "kprove",
  "--compiled-definition", "${prepared}/imp-specification",
  "--main-module", "IMP-SIMPLE-SPEC",
  "--claim", "IMP-SIMPLE-SPEC.sum-loop",
  "--depth", "100",
]
[workload.krust.check]
stdout = ["claim IMP-SIMPLE-SPEC.sum-loop: proven"]
[workload.reference]
status = "unsupported"
reason = "no-counterpart"
note = "Reference kprove always compiles the specification before proving; imp/prove-sum-loop is the paired comparison."

# The reference side prints nothing with --output none; kprove exits nonzero when a claim fails,
# so its exit status is the check.
[[workload]]
id = "imp/prove-addition-var"
semantics = "imp"
operation = "prove"
title = "Prove addition-var from source spec (symbolic addition)"
stresses = "The end-to-end command a user runs: compile the spec against prepared semantics, load, and prove a two-state symbolic claim."
origin = "scripts/benchmark.sh --suite imp --phase prove --claim IMP-SIMPLE-SPEC.addition-var"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
prepare = ["imp-proof-definition"]
argv = [
  "kprove", "${imp}/examples/specs/imp-simple-spec.k",
  "--compiled-definition", "${prepared}/imp-proof-definition",
  "--main-module", "IMP-SIMPLE-SPEC",
  "--definition-module", "IMP-VERIFICATION",
  "--claim", "IMP-SIMPLE-SPEC.addition-var",
  "--depth", "100",
  "--builtin-directory", "${builtin}",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]
[workload.krust.check]
stdout = ["claim IMP-SIMPLE-SPEC.addition-var: proven"]
[workload.reference]
status = "paired"
backend = "haskell"
prepare = ["imp-haskell-definition"]
argv = [
  "kprove", "${imp}/examples/specs/imp-simple-spec.k",
  "--definition", "${prepared}/imp-haskell-definition",
  "--spec-module", "IMP-SIMPLE-SPEC",
  "--claims", "IMP-SIMPLE-SPEC.addition-var",
  "--depth", "100",
  "--output", "none",
  "--warnings", "none",
  "-I", "${imp}/src/kimp/kdist/imp-semantics",
]
[workload.reference.check]
exit = 0

[[workload]]
id = "imp/prove-branching-program"
semantics = "imp"
operation = "prove"
title = "Prove branching-program from source spec (symbolic if/else)"
stresses = "Spec compile plus a proof that splits on a symbolic condition and closes both branches."
origin = "scripts/benchmark.sh --suite imp --phase prove --claim IMP-SIMPLE-SPEC.branching-program"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
