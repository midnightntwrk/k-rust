# ---------------------------------------------------------------------------------------------
# KORE JSON-RPC (scripts/algo-workloads.toml).
# `krust kore-rpc` is a server and takes no request file, so the measured command is
# scripts/algo-rpc-request.py, as in scripts/algo-receipt.sh: it starts
# `krust kore-rpc <definition> --module M --server-port P`, sends the one request, writes the
# response and metrics files, prints the response, and stops the server.
# The timed region therefore includes the server's startup and its definition load.
# The script names the krust binary itself, so the argv passes ${krust}, the measured binary.
# The script stops the server with SIGTERM; a release build ends by that signal, and a build with
# the `measure` feature handles it and exits 0.

[[workload]]
id = "imp/rpc-implies-smoke"
semantics = "imp"
operation = "rpc"
title = "RPC implies: one IMP implication check"
stresses = "One `implies` request through the JSON-RPC server: JSON decoding, KORE internalization, matching and the solver call behind the verdict."
origin = "scripts/algo-workloads.toml imp-rpc-implies-smoke"
tier = "quick"
pins = ["k", "imp"]
[workload.krust]
prepare = ["imp-definition"]
engine = "command"
argv = [
  "python3", "${workspace}/scripts/algo-rpc-request.py",
  "--krust", "${krust}",
  "--definition", "${prepared}/imp-definition/definition.kore",
  "--module", "IMP",
  "--request", "${workspace}/crates/k-rust/tests/fixtures/reference/rpc/imp-implies-request.json",
  "--response", "${run}/response.json",
  "--metrics", "${run}/rpc-metrics.json",
]
[workload.krust.check]
stdout = ['"status":"valid"']
files = ["${run}/response.json", "${run}/rpc-metrics.json"]
[workload.reference]
status = "untested"
note = "The counterpart is kore-rpc-booster on the reference Haskell definition with the same request sent by kore-rpc-client; it needs a step that starts the server and stops it after the response."

