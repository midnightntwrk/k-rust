# ---------------------------------------------------------------------------------------------
# KORE JSON-RPC on the build-list-length program's final state, which holds the store of closures.
# The measured command is scripts/algo-rpc-request.py, which serves one request with
# `krust kore-rpc`; imp.toml's RPC section describes it.

[[workload]]
id = "fun/rpc-execute"
semantics = "fun"
operation = "rpc"
title = "RPC execute: the final state of build-list-length"
stresses = "Decoding and internalizing a request whose state grows with n (35 MB of JSON at n = 40), looking for a step, and encoding the result."
origin = "scripts/algo-workloads.toml fun-rpc-execute"
tier = "quick"
pins = ["k"]
[workload.ladder]
param = "n"
values = [10, 15, 20, 30, 40]
stop_seconds = 120
input = """
datatype 'a mylist = Nil | Cons('a, 'a mylist)

letrec build = fun 0 -> Nil | n -> Cons(n, build (n - 1))
and length = fun Nil -> 0 | Cons(h,t) -> 1 + length t
in length (build ${n})
"""
[workload.krust]
prepare = ["fun-untyped", "fun-rpc-execute"]
engine = "command"
argv = [
  "python3", "${workspace}/scripts/algo-rpc-request.py",
  "--krust", "${krust}",
  "--definition", "${prepared}/fun-untyped/definition.kore",
  "--module", "FUN-UNTYPED",
  "--request", "${prepared}/fun-rpc-execute-${n}/request.json",
  "--response", "${run}/response.json",
  "--metrics", "${run}/rpc-metrics.json",
]
[workload.krust.check]
stdout = ['"result"']
files = ["${run}/response.json", "${run}/rpc-metrics.json"]
[workload.reference]
status = "untested"
note = "The counterpart is kore-rpc-booster on a reference definition with the same request sent by kore-rpc-client; it needs a step that starts the server and stops it after the response."

