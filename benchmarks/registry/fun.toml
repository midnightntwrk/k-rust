# FUN (untyped) workloads from scripts/algo-workloads.toml: the K tutorial's FUN programs, the
# build-list-length ladders, and the RPC ladders.
# Programs and expected outputs come from the K checkout:
# ${k}/pyk/regression-new/pl-tutorial/2_languages/3_fun/.
# The reference side is the LLVM backend's krun; `--pattern` with the LLVM backend needs a
# definition compiled with --enable-search.
version = 1

[[prepare]]
name = "fun-untyped"
engine = "krust"
creates = "${prepared}/fun-untyped/runtime.json"
argv = [
  "kcompile", "${k}/pyk/regression-new/pl-tutorial/2_languages/3_fun/1_untyped/1_environment/fun-untyped.md",
  "--main-module", "FUN-UNTYPED",
  "--output-directory", "${prepared}/fun-untyped",
  "--builtin-directory", "${builtin}",
  "-I", "${k}/pyk/regression-new/pl-tutorial/2_languages/3_fun/1_untyped/1_environment",
]

[[prepare]]
name = "fun-untyped-llvm-definition"
engine = "reference"
creates = "${prepared}/fun-untyped-llvm-definition/timestamp"
argv = [
  "kompile", "${k}/pyk/regression-new/pl-tutorial/2_languages/3_fun/1_untyped/1_environment/fun-untyped.md",
  "--backend", "llvm",
  "--enable-search",
  "--main-module", "FUN-UNTYPED",
  "--output-definition", "${prepared}/fun-untyped-llvm-definition",
  "--warnings", "none",
  "-I", "${k}/pyk/regression-new/pl-tutorial/2_languages/3_fun/1_untyped/1_environment",
]

# KORE JSON-RPC requests built from the final state of the ladder's program (see imp.toml for
# what scripts/algo-rpc-fixture.py does). They depend on the ladder value through ${n} and ${input}.
[[prepare]]
name = "fun-rpc-execute"
engine = "command"
prepare = ["fun-untyped"]
creates = "${prepared}/fun-rpc-execute-${n}/request.json"
env = { K_KOMPILE = "${kbin}/kompile" }
argv = [
  "python3", "${workspace}/scripts/algo-rpc-fixture.py",
  "--krust", "${krust}",
  "--definition", "${prepared}/fun-untyped",
  "--module", "FUN-UNTYPED",
  "--sort", "Exp",
  "--program-file", "${input}",
  "--method", "execute",
  "--max-depth", "1",
  "--output", "${prepared}/fun-rpc-execute-${n}/request.json",
]

[[prepare]]
name = "fun-rpc-simplify"
engine = "command"
prepare = ["fun-untyped"]
creates = "${prepared}/fun-rpc-simplify-${n}/request.json"
env = { K_KOMPILE = "${kbin}/kompile" }
argv = [
  "python3", "${workspace}/scripts/algo-rpc-fixture.py",
  "--krust", "${krust}",
  "--definition", "${prepared}/fun-untyped",
  "--module", "FUN-UNTYPED",
  "--sort", "Exp",
  "--program-file", "${input}",
  "--method", "simplify",
  "--output", "${prepared}/fun-rpc-simplify-${n}/request.json",
]

# ---------------------------------------------------------------------------------------------
# Tutorial programs.
# Each check requires the one result to bind V to the integer of the tutorial's expected output.
# The reference prints injections with a `/*Inj:*/` comment, which stays in the squeezed text.

[[workload]]
id = "fun/krun-ackermann"
semantics = "fun"
operation = "execute"
title = "Run the tutorial's ackermann.fun"
stresses = "Deep recursion through closures and environment lookups in a small program."
origin = "scripts/algo-workloads.toml fun-ackermann"
tier = "quick"
pins = ["k"]
[workload.krust]
prepare = ["fun-untyped"]
argv = [
  "krun",
  "--definition", "${prepared}/fun-untyped",
  "--sort", "Exp",
  "--pattern", "<k> V:K </k>",
  "${k}/pyk/regression-new/pl-tutorial/2_languages/3_fun/programs/ackermann.fun",
]
[workload.krust.check]
expect_out = "${k}/pyk/regression-new/pl-tutorial/2_languages/3_fun/1_untyped/1_environment/tests/ackermann.fun.out"
stdout_squeezed = ['\equals{SortK{},SortGeneratedTopCell{}}(VarV:SortK{},kseq{}(inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}")),dotk{}()))']
stdout_absent = ['\or{']
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["fun-untyped-llvm-definition"]
argv = [
  "krun",
  "--definition", "${prepared}/fun-untyped-llvm-definition",
  "--pattern", "<k> V:K </k>",
  "--output", "kore",
  "${k}/pyk/regression-new/pl-tutorial/2_languages/3_fun/programs/ackermann.fun",
]
[workload.reference.check]
expect_out = "${k}/pyk/regression-new/pl-tutorial/2_languages/3_fun/1_untyped/1_environment/tests/ackermann.fun.out"
stdout_squeezed = ['\equals{SortK{},SortGeneratedTopCell{}}(VarV:SortK{},kseq{}(/*Inj:*/inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}")),dotk{}()))']
stdout_absent = ['\or{']

