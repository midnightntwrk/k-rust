# ---------------------------------------------------------------------------------------------
# build-list-length: constructor-list-length with the list built by the program.
# length (build n) is n, and the list of n constructors is the growing input.
# The result carries the whole <store>, every closure the run allocated; the closures share their
# environments in the backend term, and the KORE text writes each shared subterm at every use, so
# the text grows much faster than the term (on 2026-10-16 krust printed 1.2 GB for the --pattern
# run at n = 1,000 and 109 MB for the plain run at n = 300).

[[workload]]
id = "fun/krun-build-list-length"
semantics = "fun"
operation = "execute"
title = "Build a list of n constructors and take its length, printing the matched result"
stresses = "Closure allocation and environment sharing as n grows, and printing a result whose KORE text is far larger than the shared term behind it."
origin = "scripts/algo-workloads.toml fun-build-list-length"
tier = "quick"
timeout_seconds = 900
pins = ["k"]
[workload.ladder]
param = "n"
values = [10, 30, 100, 300, 1000]
stop_seconds = 120
input = """
datatype 'a mylist = Nil | Cons('a, 'a mylist)

letrec build = fun 0 -> Nil | n -> Cons(n, build (n - 1))
and length = fun Nil -> 0 | Cons(h,t) -> 1 + length t
in length (build ${n})
"""
[workload.krust]
prepare = ["fun-untyped"]
argv = [
  "krun",
  "--definition", "${prepared}/fun-untyped",
  "--sort", "Exp",
  "--pattern", "<k> V:K </k>",
  "${input}",
]
[workload.krust.check]
expect = "n"
stdout_squeezed = ['\equals{SortK{},SortGeneratedTopCell{}}(VarV:SortK{},kseq{}(inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}")),dotk{}()))']
stdout_absent = ['\or{']
[workload.reference]
status = "paired"
backend = "llvm"
prepare = ["fun-untyped-llvm-definition"]
note = "The reference's pattern match runs outside the LLVM interpreter; at n = 1,000 it took 470 s with a 9.2 GiB peak (2026-10-16)."
argv = [
  "krun",
  "--definition", "${prepared}/fun-untyped-llvm-definition",
  "--pattern", "<k> V:K </k>",
  "--output", "kore",
  "${input}",
]
[workload.reference.check]
expect = "n"
stdout_squeezed = ['\equals{SortK{},SortGeneratedTopCell{}}(VarV:SortK{},kseq{}(/*Inj:*/inj{SortInt{},SortKItem{}}(\dv{SortInt{}}("${expect}")),dotk{}()))']
stdout_absent = ['\or{']

