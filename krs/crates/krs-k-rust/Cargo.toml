[package]
name = "krs-k-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
description = "Versioned KRS adapter for the pinned k-rust frontend"

[features]
default = ["z3-inference"]
z3-inference = ["k-rust/z3-inference"]
# The re-derivation check of a K mutation (`lift`), which reads the baseline's in-process
# lowering and re-derives sentences with krs-compiler; the native route does not need it.
lift = ["dep:krs-compiler"]

[dependencies]
k-rust = { version = "=0.8.0", path = "../../../crates/k-rust", default-features = false }
krs-compiler = { path = "../krs-compiler", optional = true }
krs-ir = { path = "../krs-ir" }
krs-ir-levels = { path = "../krs-ir-levels" }
krs-diagnostic = { path = "../krs-diagnostic" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
krs-ir = { path = "../krs-ir", features = ["test-support"] }
krs-k-rust = { path = ".", default-features = false, features = ["lift"] }
