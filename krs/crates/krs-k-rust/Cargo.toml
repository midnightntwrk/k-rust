[package]
name = "krs-k-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
description = "Versioned KRS adapter for the pinned k-rust frontend"

[features]
default = ["z3-inference"]
z3-inference = ["k-rust/z3-inference"]

[dependencies]
k-rust = { version = "=0.6.0", path = "../../../crates/k-rust", default-features = false }
krs-ir = { path = "../krs-ir" }
krs-ir-levels = { path = "../krs-ir-levels" }
krs-diagnostic = { path = "../krs-diagnostic" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
krs-ir = { path = "../krs-ir", features = ["test-support"] }
