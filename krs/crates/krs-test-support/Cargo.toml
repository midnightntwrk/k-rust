[package]
name = "krs-test-support"
description = "Shared assertions and fixture support for KRS tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[lib]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
tempfile = "3.27.0"
serde_json.workspace = true
toml_edit = { workspace = true, features = ["parse"] }
