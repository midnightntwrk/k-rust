[package]
name = "krs-unparse"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
description = "Grammar-directed printing of KORE terms, as K's kprint and kast --output program print them"

[dependencies]
k-rust = { version = "=0.8.0", path = "../../../crates/k-rust", default-features = false }
k-rust-domain.workspace = true

# A term's depth is not bounded (a collection a run built is as deep as it is long), so the
# passes that descend it grow their native stack onto heap segments; on wasm32 the engine's
# call-stack limit is invisible to the module, so the growth is absent there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
stacker.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
