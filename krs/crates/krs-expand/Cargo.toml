[package]
name = "krs-expand"
description = "Proc-macro-free expansion core shared by krs-macros and non-rustc expansion hosts"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
krs-diagnostic = { path = "../krs-diagnostic", features = ["proc-macro2"] }
krs-ir = { path = "../krs-ir", features = ["proc-macro2"] }
krs-syntax = { path = "../krs-syntax" }
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
serde_json.workspace = true
syn = { workspace = true, features = ["full", "parsing", "printing", "visit"] }

[dev-dependencies]
expect-test = { workspace = true }
prettyplease = { workspace = true }
sha2 = "0.10.9"

[lints]
workspace = true
