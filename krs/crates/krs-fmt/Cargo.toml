[package]
name = "krs-fmt"
description = "Canonical formatter for KRS macro authoring surfaces"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
krs-ir = { path = "../krs-ir", features = ["proc-macro2"] }
krs-syntax = { path = "../krs-syntax" }
proc-macro2 = { workspace = true, features = ["span-locations"] }
similar = "2.7.0"
syn = { workspace = true, features = ["full", "parsing"] }
unicode-width = "0.2.2"

[dev-dependencies]
expect-test = { workspace = true }

[lints]
workspace = true
