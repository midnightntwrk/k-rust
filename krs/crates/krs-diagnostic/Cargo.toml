[package]
name = "krs-diagnostic"
description = "Located diagnostic model and code registry for KRS producers"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[features]
proc-macro2 = ["dep:proc-macro2"]

[dependencies]
krs-ir = { path = "../krs-ir", default-features = false }
proc-macro2 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
