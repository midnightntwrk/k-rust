[package]
name = "krs"
description = "Author-facing Rust host facade for KRS definitions"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["inventory"]
# Linker-section registration for native collectors. Without it, collectors
# enumerate descriptors through generated registration tables.
inventory = ["dep:inventory"]

[dependencies]
inventory = { version = "0.3.21", optional = true }
krs-ir = { path = "../krs-ir" }
krs-macros = { path = "../krs-macros" }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
