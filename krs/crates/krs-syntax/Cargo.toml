[package]
name = "krs-syntax"
description = "Span-preserving parsers for KRS attribute and macro islands"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
krs-diagnostic = { path = "../krs-diagnostic", features = ["proc-macro2"] }
krs-ir = { path = "../krs-ir", features = ["proc-macro2"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
syn = { workspace = true, features = ["extra-traits", "full", "parsing", "printing", "visit"] }

[lints]
workspace = true

[dev-dependencies]
expect-test = { workspace = true }
krs-test-support = { path = "../krs-test-support" }
