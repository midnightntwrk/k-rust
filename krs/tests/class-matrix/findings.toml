# The findings of the red list: every `finding` that `pending.toml` names, who owns it, and what kind
# of fix it needs. The harness reads this file (`class_matrix::findings`); one table per finding,
# sorted by name:
#
#    ["NT-2-7"]
#    owner = "NT-28"
#    kind = "bug"
#    what = "one line saying what is wrong"
#    by_test = { k3 = "NT-30" }
#
# - `owner`: a ticket (`NT-28`), a step (`S1` to `S6`), or `kept: REF`, a limit kept by the decision
#   REF. A step is a finding's owner, never an entry's: `pending.toml` has no `step`.
# - `kind`: `bug` (KRS does what the language does not mean), `feature` (the table admits what KRS
#   does not do yet), `diagnostic` (the refusal is right, its code, site or advice is not) or
#   `generator` (the test's own data or harness is wrong).
# - `by_test`: the owners of the finding's entries of one test (`k2`, `k3`, `k7`, `k8`, ..), where
#   another than `owner` owns them, or where an owner of one test's entries is stated explicitly
#   (S0-9's and S0-14's K8 entries, whose advice is on S5's cell-entry messages).
# - `risk`: required on a finding that holds an under-refusal (the table refuses, KRS accepts), and
#   only there: what the K KRS writes means, and how it differs from what the spelling says.
#
# It fails (`class_matrix::findings::audit`) where a pending entry names a finding this file does
# not have, a finding (or a `by_test` owner) has no pending entry left (it is done: remove it), or
# a red's kind (`class_matrix::findings::Red`) is not one the finding's kind may hold: an
# under-refusal, a red with an internal code and a red that panicked only under a `bug`, whatever
# its test; a red of what KRS wrote or ran (an over-refusal, other K, K1, K3, K4, K6, K7, the twin
# check) never under a `diagnostic`; a K2 red of a case the table does not decide only under a
# `generator`.

["B2"]
owner = "S5"
kind = "diagnostic"
what = "an initializer value of the wrong kind or sort is rustc's E0308 at the entry's value, not a KRS error"

["B3"]
owner = "S5"
kind = "diagnostic"
what = "`Some(..)`/`None` in a readable result on a cell that is not optional is `krs::expand::not-a-declaration` at the spelling, not the presence rule"

["K-1"]
owner = "S5"
kind = "bug"
what = "alternatives over a name the sentence binds outside them (`x | 1` beside `cTAG(x, _)`) are refused as binding unequally. Ruling (orchestrator, from P5's nonlinear binders): such a name is a use in each branch, so `alternatives-bind-unequally` compares only the names a branch binds itself, at every position. The table's `x | 1` glob (38 positions, expected.toml) must be re-read case by case for whether `x` is bound outside, and the K of an accepted one is the alternatives over the shared variable. Tier 3: no real code writes it; deferred (README §13)"

["K-2"]
owner = "S5"
kind = "bug"
what = "(the bug is the table's: its accepted BitOr row for `function-argument/x | 1` predates R-K1, so the red is an over-refusal against it until the row refuses; then the finding becomes a diagnostic) a map read's key below a function's application (`Wk(x | 1)`, `Wk(Cmd::Go() | Cmd::Hold(_))`, `Wk([x, ..])`) is refused, rightly: R-K1 makes `|` in a key alternatives at every depth (bitwise OR is `bit_or`), since reading it by the head's declaration would flip its meaning silently when a constructor becomes a function; a rest is likewise a pattern's. Owed: the table refuses these three (its accepted BitOr row for `function-argument/x | 1` predates R-K1) with a class whose advice names `bit_or` for `|`, and the product answers that class instead of `invalid-pattern-or`, `ambiguous-operator` and `invalid-list-notation`"

["NT-2-26"]
owner = "kept: rustc parses the const item before any KRS attribute runs; the author sees rustc's error at the construct"
kind = "diagnostic"
what = "a constant's whole value that rustc cannot parse gets no KRS answer, and rustc then expands nothing in the crate, so every other KRS diagnostic of it waits on that error"

["S0-14"]
owner = "S5"
kind = "diagnostic"
what = "a readable map read's key at depth 2, below `@` or `|` (`map-key/as-body`, `map-key/or-branch`, `beside-fresh`), is answered by a true reason met before the table's (a function in a pattern before notation in a pattern), and its advice by that reason's; `@` and `|` in a map key are accepted as documented (TRI, 2026-11-07)"
by_test = { k8 = "S5" }

["S0-16"]
owner = "S5"
kind = "diagnostic"
what = "an author mistake reported unlocated, at the wrong entry, or under an internal code (C5)"

["S0-9"]
owner = "S5"
kind = "diagnostic"
what = "one cell-entry mistake answers with the code of whichever layer meets it first"
by_test = { k8 = "S5" }

["S5-B1"]
owner = "S5"
kind = "bug"
what = "a readable map read below an entry's head (a group record's Map child `M { mm: { y -> x, .. }, .. }`, or `Some({ z -> y, .. })` on an optional Map leaf) is a Rust parse error (`krs::syntax::rust-syntax`), though the field's value is the child's entry and its braces the Map's mark (P1, P2; S5.0g fixes review F-1); S5.2's"

["S5-C2"]
owner = "S5"
kind = "bug"
what = "a second computation cell (`code: [x, ..]` below a plain group) is refused bracket notation as `invalid-list-notation` (\"the cell `code` holds `K`, which is not a list\"), though brackets are a computation's mark wherever it is declared (P1: a cell's name and role play no part; P2); S5.2's; S5-LOW (S5.3 part 2, ruling 4): the table admits it and the compiler cannot lower it yet, product feature work after S5.2, not routing"

["S5-F2"]
owner = "S5"
kind = "bug"
what = "a `cells!` group fragment's child content written bare (`hl: [x, ..]`, `mm: k::map![..]`) is refused (`invalid-state-macro`), though readable `G { a: x, .. }` abbreviates to that fragment (P7, design §2.3 `abbreviate`) and a field's value is its child's entry (P1, P6; F-1); S5.3's. The subject half (an open fragment's `..` in a subject, R-F1/S5-F2) landed in lane F (2026-11-05, `positions.rs` `Construct::OpenFragment`); the child half stays: a fragment's children are read as terms, so `mm: k::map![y -> x]` in a pattern is the literal's calls (`function-in-pattern`) and a nested group record's `..` (`wg: Gw { wa: x, .. }`) is refused"

["S5-G3"]
owner = "S5"
kind = "bug"
what = "an instance record naming a `?` child (`Acct { id: z, acounter: Some(y), .. }`) is refused (\"`Option<_>` is not a KRS declaration of this name\", `not-a-declaration`), and one naming a `*` child's instances (`aqueue: Aqueue { ajob: [Ajob { apay: y }, ..] }`) is refused as an invalid descriptor term: the child is an entry of the instance with a meaning (P1, P2; the orchestrator's G3 ruling withdraws design §7's C-lim row), and K writes the configuration (S5.0g item 3b, G3). The same gap answers other classes with its own code: a `?` child `None` the result does not create is refused `E0308` in readable and, in `cells!`, `unsupported-rule-signature` (the fragment's `None` is read as a term binder), where P5 gives `absence-test-without-creation` (ruling 2); an update `..me` whose `?` child is written and whose base binds no record answers `not-a-declaration` where P6 gives `record-update-base` (ruling 1); and a `cells!` update `..j` of a `*` child's instance an instance record labels is refused `invalid-record-update`: S5.2's readable, S5.3's `cells!`; S5-LOW (S5.3 part 2, ruling 4): the table admits these and the compiler cannot lower them yet, product feature work after S5.2, not routing"

["S5-H1"]
owner = "S5"
kind = "feature"
what = "a result on a Map leaf whose subject entry matched the map with a readable map read (`env: { z -> y, .. }`) is refused for that match (\"a preserved map-item cell is omitted from the machine-rule result\"): the subject's map read is a frame the result may not replace, the stated M3 limitation (design:M3), so the result entry's own answer is never reached (S5.0g item 3a fixes, F-6)"

["S5-K1"]
owner = "S5"
kind = "diagnostic"
what = "a `cells!` subject on a list leaf that its own kind refuses (`KCell(x, ..)`, an instance list, `Cell(k::map![y -> x, ..])`, a cons leaf's `Cell([.., x])`), written by the result `Cell([..])`: the result's anonymous `..` with no item before it is the limit class `nested-anonymous-rest` (TRI-C2: a result's anonymous `..` below a record's own cell is not supported yet, as the docs say), and the product answers that limit first, where the table's answer is the subject's kind refusal. The limit's own rows moved to `nested-anonymous-rest`"

["S5-P1"]
owner = "S5"
kind = "bug"
what = "a `cells!` subject's map holding only a rest, `Cell(k::map![..])`, is a parse error (\"expected identifier\"): R9 admits it with the `no-effect-entry` lint (it constrains and binds nothing, P0, Q1), as `Cell(k::map![y -> x, ..])` is admitted: S5.3's (S5.0g item 3b)"

["S5-Q1"]
owner = "S5"
kind = "bug"
what = "decision Q1: a subject entry that constrains nothing on a cell the result leaves out (`_`, `[..]`, `Cell(_)`) is a lint, not a refusal. Since TRI-A an item-less `[..]` is read by the cell's kind: a collection's keeps every instance, a `Cell` leaf's is its `_` (TRI-A4, with its lint, and `[..] => [..]` too), the computation cell's is the cell left out, `Some([..])` is `Some(_)`, and `Some([..]) => Some([..])` keeps the present cell. The rows left: below a marked ancestor, `Some([..])` on an optional list is refused otherwise than the table's `collection-without-instances` at the entry"

["S5-Q2"]
owner = "S5"
kind = "feature"
what = "`job: [x, ..]` on a List collection binds its front instance and `job: [.., x]` its back instance (decision Q2), which readable refuses as bracket notation"

["S5-S1"]
owner = "S5"
kind = "bug"
what = "an entry naming a cell below a `?` or `*` ancestor by its path (readable `hpc: x`, a claim's, a `cells!` key such as `crate::Acct::apc`) is admitted, or refused with another code than its class: the cell's own kind first (P3, as at the record's level), then the ancestor's (`optional-without-presence`, `collection-without-instances`; S1 (b), design §2.3): S5.2's for readable records and claims, S5.3's for `cells!` keys. Residue for S5.3 once S5.2 fixes the path: `{readable,claim}/subject/kinds/aacct/[x, ..]` and `{readable,claim}/overwrite/kinds/hbag/[x, ..]` are `instance-list-shape` by their own stack (brackets on a Set or Map collection, the instance mark of the wrong order: S5.0g pattern review P-R4), where the compiler answers `bracket-reading` (`invalid-list-notation`) on `aacct` and a `rust-syntax` error on `hbag`; the cell's own class is then theirs to name, a `br`/`ils` disagreement this finding's cause does not cover"

["S5-U1"]
owner = "S5"
kind = "diagnostic"
what = "an initializer's record update on a leaf stack (`env`, `pc`, `seq`, `set`, `stack`: `G { a: 0, ..base }`) is refused `krs::syntax::unsupported-initializer-body` (\"nested cell initialization requires a complete plain struct literal\") where the lattice's sort class is the answer: a struct literal names no leaf's sort. On a group cell and a `*` collection's instance template the same refusal is the limit class `template-record-update` (TRI-C2, ruling R6: not supported yet, as the docs say); its rows moved there. The leaf half needs the initializer reader (krs-syntax `initializer.rs`) to know the cell's kind before refusing"

["S5-Z1"]
owner = "S5"
kind = "feature"
what = "a context alias and an equation's function context refuse every `?` and collection entry, though a kept pattern means what a rule with that pattern on both sides means (P0; S5.3 part 3, ruling B) and the K forms they lower to are configuration patterns, which match a present `?` cell and a collection's instances as a rule's left side and a context do (`cells/g6-context/..` records that K): `Some(..)` is `invalid-term` (compiler `configuration_rules.rs` `entry_state_term`, \"an optional or collection entry occurs where a cell's content belongs\"); an instance record is `invalid-function-context` in a function context (`lower_function_context_cell`, \"reads leaf cells, not the whole nested cell\") and `invalid-configuration` in a context alias (transport `rule.rs` context-alias validation, `InvalidOptionalCellEntry`), whose `None` gets the same code where P5 gives `absence-test-without-creation`; a named instance rest (`instances0 @ ..`) is `cell-collection-placement` in both (expand `collection_placement`). S5-LOW (S5.3 part 4): the table admits these and the compiler cannot lower them yet, product feature work, not routing"

