# The findings of the red list: every `finding` that `pending.toml` names, who owns it, and what kind
# of fix it needs. The harness reads this file (`class_matrix::findings`); one table per finding,
# sorted by name:
#
#    ["NT-2-7"]
#    owner = "NT-28"
#    kind = "bug"
#    what = "one line saying what is wrong"
#    by_test = { k3 = "NT-30" }
#
# - `owner`: a ticket (`NT-28`), a step (`S1` to `S6`), or `kept: REF`, a limit kept by the decision
#   REF. A step is a finding's owner, never an entry's: `pending.toml` has no `step`.
# - `kind`: `bug` (KRS does what the language does not mean), `feature` (the table admits what KRS
#   does not do yet), `diagnostic` (the refusal is right, its code, site or advice is not) or
#   `generator` (the test's own data or harness is wrong).
# - `by_test`: the owners of the finding's entries of one test (`k2`, `k3`, `k7`, `k8`, ..), where
#   another than `owner` owns them, or where an owner of one test's entries is stated explicitly
#   (S0-9's and S0-14's K8 entries, whose advice is on S5's cell-entry messages).
# - `risk`: required on a finding that holds an under-refusal (the table refuses, KRS accepts), and
#   only there: what the K KRS writes means, and how it differs from what the spelling says.
#
# It fails (`class_matrix::findings::audit`) where a pending entry names a finding this file does
# not have, a finding (or a `by_test` owner) has no pending entry left (it is done: remove it), or
# a red's kind (`class_matrix::findings::Red`) is not one the finding's kind may hold: an
# under-refusal, a red with an internal code and a red that panicked only under a `bug`, whatever
# its test; a red of what KRS wrote or ran (an over-refusal, other K, K1, K3, K4, K6, K7, the twin
# check) never under a `diagnostic`; a K2 red of a case the table does not decide only under a
# `generator`.

["K-2"]
owner = "S5"
kind = "diagnostic"
what = "a map read's key below a function's application (`Wk(x | 1)`, `Wk(Cmd::Go() | Cmd::Hold(_))`, `Wk([x, ..])`) is refused, rightly: R-K1 makes `|` in a key alternatives at every depth (bitwise OR is `bit_or`), since reading it by the head's declaration would flip its meaning silently when a constructor becomes a function; a rest is likewise a pattern's. The table refuses all three (TRI-E: its BitOr row for `function-argument/x | 1` is alternatives, built, and conforms). Owed: one class whose advice names `bit_or` for `|`, which the other two answer instead of the class the table gives their inner `_` and `..` first, and of `invalid-list-notation`. With no binding of `x` outside the alternatives, `Wk(x | 1)` is told the binding message first: the expansion cannot tell a function's head from a constructor's"

["NT-2-26"]
owner = "kept: rustc parses the const item before any KRS attribute runs; the author sees rustc's error at the construct"
kind = "diagnostic"
what = "a constant's whole value that rustc cannot parse gets no KRS answer, and rustc then expands nothing in the crate, so every other KRS diagnostic of it waits on that error"

["S0-14"]
owner = "S5"
kind = "diagnostic"
what = "a readable map read's key at depth 2, below `@` or `|` (`map-key/as-body`, `map-key/or-branch`, `beside-fresh`), is answered by a true reason met before the table's (a function in a pattern before notation in a pattern), and its advice by that reason's; `@` and `|` in a map key are accepted as documented (TRI, 2026-11-07)"
by_test = { k8 = "S5" }

["S0-9"]
owner = "S5"
kind = "diagnostic"
what = "one cell-entry mistake answers with the code of whichever layer meets it first. Since S0-9 (2026-11-08) the macro reads readable, claim and `cells!` values by their spelling and carries their notation faults until the cell's kind has answered (`CollectionErrorKind::DeferredSyntax`). The computation result's fit, a list rest's place, `[..]` naming no element, an item after a k result's `..`, a map read in a collection's result and a subject map read of a written non-Map cell wait for the kind too; on a Map leaf that map read is the M3 limit, which answers only once every entry, the result's too, is admitted (a limit never hides a principle). Left: a `Some(..)`/`None` on a `?` child inside a group record term (`unmatched-optional-result`), a map read in a group record's Map child (`M { mm: { y -> x, .. }, .. }`, beside S5-B1), the `cells!` fragment-child and `KCell` messages, an initializer's record update `G { a: 0, ..base }` on an optional cell or the computation cell, which the syntax refuses as a nested record update before the cell's kind answers (S5-U1's mechanism; since INITDIAG every other initializer value is judged by its cell's kind), and K8 advice that follows a subject's `Some([..])`"
by_test = { k8 = "S5" }

["S5-U1"]
owner = "S5"
kind = "diagnostic"
what = "an initializer's record update on a leaf stack (`env`, `pc`, `seq`, `set`, `stack`: `G { a: 0, ..base }`) is refused `krs::syntax::unsupported-initializer-body` (\"nested cell initialization requires a complete plain struct literal\") where the lattice's sort class is the answer: a struct literal names no leaf's sort. On a group cell and a `*` collection's instance template the same refusal is the limit class `template-record-update` (TRI-C2, ruling R6: not supported yet, as the docs say); its rows moved there. The leaf half needs the initializer reader (krs-syntax `initializer.rs`) to know the cell's kind before refusing"

