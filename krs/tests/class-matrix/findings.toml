# The findings of the red list: every `finding` that `pending.toml` names, who owns it, and what kind
# of fix it needs. The harness reads this file (`class_matrix::findings`); one table per finding,
# sorted by name:
#
#    ["NT-2-7"]
#    owner = "NT-28"
#    kind = "bug"
#    what = "one line saying what is wrong"
#    by_test = { k3 = "NT-30" }
#
# - `owner`: a ticket (`NT-28`), a step (`S1` to `S6`), or `kept: REF`, a limit kept by the decision
#   REF. A step is a finding's owner, never an entry's: `pending.toml` has no `step`.
# - `kind`: `bug` (KRS does what the language does not mean), `feature` (the table admits what KRS
#   does not do yet), `diagnostic` (the refusal is right, its code, site or advice is not) or
#   `generator` (the test's own data or harness is wrong).
# - `by_test`: the owners of the finding's entries of one test (`k2`, `k3`, `k7`, `k8`, ..), where
#   another than `owner` owns them, or where an owner of one test's entries is stated explicitly;
#   a finding all of whose entries one `by_test` owner holds names that owner as its `owner`.
# - `risk`: required on a finding that holds an under-refusal (the table refuses, KRS accepts), and
#   only there: what the K KRS writes means, and how it differs from what the spelling says.
#
# It fails (`class_matrix::findings::audit`) where a pending entry names a finding this file does
# not have, a finding (or a `by_test` owner) has no pending entry left (it is done: remove it), or
# a red's kind (`class_matrix::findings::Red`) is not one the finding's kind may hold: an
# under-refusal, a red with an internal code and a red that panicked only under a `bug`, whatever
# its test; a red of what KRS wrote or ran (an over-refusal, other K, K1, K3, K4, K6, K7, the twin
# check) never under a `diagnostic`; a K2 red of a case the table does not decide only under a
# `generator`.

["NT-2-26"]
owner = "kept: rustc parses the const item before any KRS attribute runs; the author sees rustc's error at the construct"
kind = "diagnostic"
what = "a constant's whole value that rustc cannot parse gets no KRS answer, and rustc then expands nothing in the crate, so every other KRS diagnostic of it waits on that error"

["S0-9"]
owner = "S5"
kind = "diagnostic"
what = "one cell-entry mistake answers with the code of whichever layer meets it first. Since S0-9 (2026-11-08) the macro reads readable, claim and `cells!` values by their spelling and carries their notation faults until the cell's kind has answered (`CollectionErrorKind::DeferredSyntax`); since INITDIAG an initializer value is judged by its cell's kind, and since INITREC its group record update `G { a: 0, ..base }` too (the R6 limit only on a group of `G` or a `*` template of one), an alias in it answers `invalid-pattern-as` beside rustc's parse error, and a `cells!` result instance record's child the term reader refuses (`T { tk: [x, ..], ..me }`) waits for the record's own judgement. Left: K8 advice that follows a subject's `Some([..])`"

["TWIN-10"]
owner = "S5"
kind = "bug"
what = "the source `krs expand` prints for a readable result that writes a `?` group's child (`og: Some(Og { ol: [x], .. })`, `on: x`, `ol: [..rest, y]` over a subject naming the group) is refused (`krs::analysis::cell-wrapper` at the item), so K3 cannot read it back; the case itself is accepted with its twin's K"

["TWIN-2"]
owner = "S5"
kind = "feature"
what = "a readable record's top-level Map cell refuses braces of exact entries, `tm: { 0 -> v }` in a subject (rust-syntax \"a machine-rule map pattern is `{ key -> value, .. }`\") and `tm: { 0 -> x }` in a result (map-read-in-result), where every record child of the same kind reads them as the map's entries (`0 |-> V`, `.Map [ 0 <- X ]`): one spelling, two readings"

["TWIN-4"]
owner = "S5"
kind = "diagnostic"
what = "`k::set![y, ..]` as a fixed or `?` group fragment's child (`gg: k::fragment![crate::Gg { ge: k::set![y, ..], .. }]`) is refused `krs::syntax::invalid-state-macro` \"an entry without a wrapper is a nested cell's\" outside the case's site, where its twin `te: Cell(k::set![y, ..])` and an instance's child say `invalid-expression-notation` (a set literal's anonymous `..` names no set)"

["TWIN-5"]
owner = "S5"
kind = "diagnostic"
what = "a readable record child of the builtin `Set` written with braces (`je: { y, .. }` in an instance, a group record or `Some(..)`) is a rust-syntax parse error (\"expected one of: identifier ..\"), where its twin `te: { y, .. }` is `instances-on-plain-cell` (braces of items are an instance list, and a Set leaf is no collection)"

["TWIN-6"]
owner = "S5"
kind = "diagnostic"
what = "a `cells!` top-level `Int`, `Map` or `Set` cell written `Cell([..])` is refused with the list's text, \"`[..]` names no element: the first matches any list, so write `_`\", false of a cell that is no list, where every child of those kinds says `bracket-reading` (brackets denote nothing there); the kind is the truer first mistake"

["TWIN-9"]
owner = "S5"
kind = "bug"
what = "the source `krs expand` prints for a readable List or Map instance's list child written `[..]` (`job: [J { jl: [..], .. }, ..]`, and `[..] => [1, ..]` over it) is refused (`krs::syntax::invalid-list-notation`, unlocated): the print writes the child's item-less brackets in `cells!` form, which names no element there, so K3 cannot read it back; the case itself is accepted with its twin's K"
