# The findings of the red list: every `finding` that `pending.toml` names, who owns it, and what kind
# of fix it needs. The harness reads this file (`class_matrix::findings`); one table per finding,
# sorted by name:
#
#    ["NT-2-7"]
#    owner = "NT-28"
#    kind = "bug"
#    what = "one line saying what is wrong"
#    by_test = { k3 = "NT-30" }
#
# - `owner`: a ticket (`NT-28`), a step (`S1` to `S6`), or `kept: REF`, a limit kept by the decision
#   REF. A step is a finding's owner, never an entry's: `pending.toml` has no `step`.
# - `kind`: `bug` (KRS does what the language does not mean), `feature` (the table admits what KRS
#   does not do yet), `diagnostic` (the refusal is right, its code, site or advice is not) or
#   `generator` (the test's own data or harness is wrong).
# - `by_test`: the owners of the finding's entries of one test (`k2`, `k3`, `k7`, `k8`, ..), where
#   another than `owner` owns them, or where an owner of one test's entries is stated explicitly
#   (S0-9's and S0-14's K8 entries, whose advice is on S5's cell-entry messages).
# - `risk`: required on a finding that holds an under-refusal (the table refuses, KRS accepts), and
#   only there: what the K KRS writes means, and how it differs from what the spelling says.
#
# It fails (`class_matrix::findings::audit`) where a pending entry names a finding this file does
# not have, a finding (or a `by_test` owner) has no pending entry left (it is done: remove it), or
# a red's kind (`class_matrix::findings::Red`) is not one the finding's kind may hold: an
# under-refusal, a red with an internal code and a red that panicked only under a `bug`, whatever
# its test; a red of what KRS wrote or ran (an over-refusal, other K, K1, K3, K4, K6, K7, the twin
# check) never under a `diagnostic`; a K2 red of a case the table does not decide only under a
# `generator`.

["B1"]
owner = "S5"
kind = "bug"
what = "an initializer refuses bracket notation (`[]`, `[0]`, `[pgm]`) with the generic `unsupported-initializer-body`, also where it denotes a List or the computation"

["B2"]
owner = "S5"
kind = "diagnostic"
what = "an initializer value of the wrong kind or sort is rustc's E0308 at the entry's value, not a KRS error"

["B3"]
owner = "S5"
kind = "diagnostic"
what = "`Some(..)`/`None` in a readable result on a cell that is not optional is `krs::expand::not-a-declaration` at the spelling, not the presence rule"

["NT-2-26"]
owner = "kept: rustc parses the const item before any KRS attribute runs; the author sees rustc's error at the construct"
kind = "diagnostic"
what = "a constant's whole value that rustc cannot parse gets no KRS answer, and rustc then expands nothing in the crate, so every other KRS diagnostic of it waits on that error"

["NT-30-2"]
owner = "S6"
kind = "bug"
what = "a readable or claim item root `Wrap::<KItem>(x)` fixes the head's instance with a strict cast (`X::KItem`), while the printed `cells!` rule writes `X:KItem`: the same set for a variable, two spellings; which one the routes share is S6's question"

["S0-14"]
owner = "S5"
kind = "bug"
what = "a readable map read's key refuses the `@` and `|` patterns the reference documents for map keys: it is read as the term it looks its entry up by, which binds no alias's name"
by_test = { k8 = "S5" }

["S0-15"]
owner = "S5"
kind = "bug"
what = "`job: []`, a List collection with no instance, is refused in a subject, though the reference documents it"

["S0-16"]
owner = "S5"
kind = "diagnostic"
what = "an author mistake reported unlocated, at the wrong entry, or under an internal code (C5)"

["S0-17"]
owner = "S6"
kind = "bug"
what = "a readable or `for Stmt` result, or a readable subject's Set collection instance cell, accepts `k::matches!` and `let` blocks that the `cells!` rule `krs expand` prints refuses (a subject's computed key no longer differs: NT-31)"

["S0-9"]
owner = "S5"
kind = "diagnostic"
what = "one cell-entry mistake answers with the code of whichever layer meets it first"
by_test = { k8 = "S5" }

["S5-A1"]
owner = "S5"
kind = "feature"
what = "a readable result over a collection the subject does not match (Q1's overwrite of a `*` cell: `acct: { Gm { ma: x, mb: y } }`, `bag: { Gs { .. } }`, `job: [x]`) replaces every instance the collection holds; the table admits it, and KRS refuses it at the entry (`krs::analysis::collection-entry`, S5.2 part a) rather than lower it as another rule: a collection's instance clause keeps the instances it does not name with `..` or names every one, so no lowering matches the whole collection whatever it holds (`<bank> _ => <acct> .. </acct> </bank>` where the parent holds only the collection). S5.2c's, with the instance-list form over a whole collection; `job: [x]` also needs Q2's value instance"

["S5-B1"]
owner = "S5"
kind = "bug"
what = "a readable map read below an entry's head (a group record's Map child `M { mm: { y -> x, .. }, .. }`, or `Some({ z -> y, .. })` on an optional Map leaf) is a Rust parse error (`krs::syntax::rust-syntax`), though the field's value is the child's entry and its braces the Map's mark (P1, P2; S5.0g fixes review F-1); S5.2's"

["S5-C2"]
owner = "S5"
kind = "bug"
what = "a second computation cell (`code: [x, ..]` below a plain group) is refused bracket notation as `invalid-list-notation` (\"the cell `code` holds `K`, which is not a list\"), though brackets are a computation's mark wherever it is declared (P1: a cell's name and role play no part; P2); S5.2's; S5-LOW (S5.3 part 2, ruling 4): the table admits it and the compiler cannot lower it yet, product feature work after S5.2, not routing"

["S5-E1"]
owner = "S5"
kind = "bug"
what = "a subject's exact empty instance list on a List collection (`job: []`, readable and `cells!`) is refused (\"the collection entry `job` names no instance\", `collection-entry`): P2 and P6 read it as the collection holding no instance, a constraint K matches, so the subject is admitted (R9: no lint, it constrains): S5.2's readable, S5.3's `cells!` (S5.0g item 3b); S5-LOW (S5.3 part 2, ruling 4): the table admits it and the compiler cannot lower it yet, product feature work after S5.2, not routing"

["S5-F2"]
owner = "S5"
kind = "bug"
what = "a `cells!` group fragment is read as the reference notation that names every field: in a subject its `..` is refused (`k::fragment![crate::G { a: x, .. }]`, `invalid-record-update`, so a matched result whose subject entry writes it is refused for that entry), and a child's content written bare (`hl: [x, ..]`, `mm: k::map![..]`) is refused (`invalid-state-macro`), though readable `G { a: x, .. }` abbreviates to that fragment (P7, design §2.3 `abbreviate`) and a field's value is its child's entry (P1, P6; F-1); S5.3's; Its accept rows of an open subject fragment are S5-LOW's (S5.3 part 2, ruling 4): the table admits them and the compiler cannot lower a subject fragment's `..` yet, product feature work after S5.2, not routing"

["S5-G1"]
owner = "S5"
kind = "bug"
what = "an instance update whose base is a record of the instance's constructor matched in another cell (`stack: [me @ Acct { id: z, .. }, ..]`, then `account: { Acct { aframe: Ag { aa: x }, ..me }, .. }`) is refused (\"`..me` names no instance of `account` labelled `me @` in the pattern\", `invalid-record-update` since S5.2 part a, continued; `unknown-instance-label` before): the label names no subject instance and its base is matched elsewhere, so it is a created instance taking `me`'s other fields (S5.0g pattern review P-R3, P0; P6 `..base` updates); in `cells!` it is refused `invalid-record-update` (KEVM's restore shape `frame: k::fragment![crate::G { a: x, ..saved }]` alike), and a readable twin it leaves without K is a K3 red. The same reading answers a base matched elsewhere as a record of another constructor (`job: [me @ Job { payload: z }, ..]`, then `bag: { Obj { key: 1, ..me }, .. }`) with `unknown-instance-label` where P6 gives `record-update-base` (`invalid-record-update`), a code-only red the table's judgement answers since S5.2 part a (S5.0g item 3b ruling 1): S5.2's readable, S5.3's `cells!` (S5.0g item 3b, G1); S5-LOW (S5.3 part 2, ruling 4): the table admits these and the compiler cannot lower them yet, product feature work after S5.2, not routing"

["S5-G3"]
owner = "S5"
kind = "bug"
what = "an instance record naming a `?` child (`Acct { id: z, acounter: Some(y), .. }`) is refused (\"`Option<_>` is not a KRS declaration of this name\", `not-a-declaration`), and one naming a `*` child's instances (`aqueue: Aqueue { ajob: [Ajob { apay: y }, ..] }`) is refused as an invalid descriptor term: the child is an entry of the instance with a meaning (P1, P2; the orchestrator's G3 ruling withdraws design §7's C-lim row), and K writes the configuration (S5.0g item 3b, G3). The same gap answers other classes with its own code: a `?` child `None` the result does not create is refused `E0308` in readable and, in `cells!`, `unsupported-rule-signature` (the fragment's `None` is read as a term binder), where P5 gives `absence-test-without-creation` (ruling 2); an update `..me` whose `?` child is written and whose base binds no record answers `not-a-declaration` where P6 gives `record-update-base` (ruling 1); and a `cells!` update `..j` of a `*` child's instance an instance record labels is refused `invalid-record-update`: S5.2's readable, S5.3's `cells!`; S5-LOW (S5.3 part 2, ruling 4): the table admits these and the compiler cannot lower them yet, product feature work after S5.2, not routing"

["S5-H1"]
owner = "S5"
kind = "feature"
what = "a result on a Map leaf whose subject entry matched the map with a readable map read (`env: { z -> y, .. }`) is refused for that match (\"a preserved map-item cell is omitted from the machine-rule result\"): the subject's map read is a frame the result may not replace, the stated M3 limitation (design:M3), so the result entry's own answer is never reached (S5.0g item 3a fixes, F-6)"

["S5-H2"]
owner = "S5"
kind = "feature"
what = "a readable result writing an updated instance's Map child with a map read and a rest (`{ Acct { aenv: { v -> x, .. }, ..me }, .. }`) is refused (\"in a term, `map![..]` is a literal\"): P6 reads it as the child's frame write over the subject's `aenv: { v -> y, .. }`, which the M3 limitation refuses at the record's level (design:M3); `cell_entries` admits it at an instance's child, so no `[cell-exception]` can name it until both depart alike (S5.0g item 3b, G4)"

["S5-K1"]
owner = "S5"
kind = "bug"
what = "a result's anonymous `..` that keeps the subject's anonymous rest at a content root is refused outside a readable record's top-level cell (`an anonymous `..` keeps the rest only in a readable record cell`): a `cells!` result (`Cell([x, ..])`, `KCell(x, ..)`) and a readable result below presence or in a group record's child (`Some([..])`, `H { hl: [x, ..], hb: 0 }`), though P6 reads `..` in a result as the subject's unnamed rest kept, at every content root and in every form (design D2); S5.5's"

["S5-M1"]
owner = "S5"
kind = "bug"
what = "an initializer that also places the program in a second computation cell beside `k` (`prog: k::k![pgm]`) is refused `krs::analysis::main-cell` (\"more than one reads the program\"), though `k` is the computation cell by its name and the other cell holds a copy of the program (P1: a cell's role plays no part); S5.4's"

["S5-P1"]
owner = "S5"
kind = "bug"
what = "a `cells!` subject's map holding only a rest, `Cell(k::map![..])`, is a parse error (\"expected identifier\"): R9 admits it with the `no-effect-entry` lint (it constrains and binds nothing, P0, Q1), as `Cell(k::map![y -> x, ..])` is admitted: S5.3's (S5.0g item 3b)"

["S5-Q1"]
owner = "S5"
kind = "bug"
what = "decision Q1, both halves: a subject entry that constrains nothing on a cell the result leaves out (`_`, `[..]`, `Cell(_)`) is a lint, not a refusal (readable and `cells!` warn since S5.2 parts a and b; `[..]` on a List collection or the computation is still refused `collection-entry` by the compiler); and a result over a cell the subject does not match is the overwrite, which readable lowers since S5.2 part a (4) and `cells!` refuses under the internal `krs::analysis::unsupported-shape` (\"the result selects a fixed cell absent from the subject\"). An internal code an author reaches is a KRS bug, hence `bug`"

["S5-Q2"]
owner = "S5"
kind = "feature"
what = "`job: [x, ..]` on a List collection binds its front instance and `job: [.., x]` its back instance (decision Q2), which readable refuses as bracket notation"

["S5-S1"]
owner = "S5"
kind = "bug"
what = "an entry naming a cell below a `?` or `*` ancestor by its path (readable `hpc: x`, a claim's, a `cells!` key such as `crate::Acct::apc`) is admitted, or refused with another code than its class: the cell's own kind first (P3, as at the record's level), then the ancestor's (`optional-without-presence`, `collection-without-instances`; S1 (b), design §2.3): S5.2's for readable records and claims, S5.3's for `cells!` keys. Residue for S5.3 once S5.2 fixes the path: `{readable,claim}/subject/kinds/aacct/[x, ..]` and `{readable,claim}/overwrite/kinds/hbag/[x, ..]` are `instance-list-shape` by their own stack (brackets on a Set or Map collection, the instance mark of the wrong order: S5.0g pattern review P-R4), where the compiler answers `bracket-reading` (`invalid-list-notation`) on `aacct` and a `rust-syntax` error on `hbag`; the cell's own class is then theirs to name, a `br`/`ils` disagreement this finding's cause does not cover"

["S5-U1"]
owner = "S5"
kind = "bug"
what = "an initializer's record update on a group or a collection-of-group cell (`frame: G { a: 0, ..base }`, an instance template `Gl { la: 0, ..base }`) is refused `krs::syntax::unsupported-initializer-body` (\"nested cell initialization requires a complete plain struct literal\"), though P5 reads `..base` as the base the record updates, so the record names its fields through it and uses the configuration variable (S5.0g item 3a fixes, ruling 2 and F-1); on a leaf stack the same refusal stands where the lattice's sort class is the answer"

["S5-V2"]
owner = "S5"
kind = "bug"
what = "a readable instance record's List child written with brackets, in a result or a subject (`acc: { A { aid: 5, al: [x] }, .. }`, the subject `al: [y, ..]` of `c19-acc`) is refused \"a `[..]` sequence occurs in a cell that is not the computation cell\": the compiler misreads the child's kind, reading the brackets of a List leaf as a K sequence, though P2 gives brackets inside a List leaf as its mark and the `cells!` twin is accepted with `<al> ListItem(V0:Int) </al>` (P7)"

["S5-X1"]
owner = "S5"
kind = "bug"
what = "a result that creates an optional group cell with a record that leaves its other fields to their defaults (`ogroup: Some(Gp { pa: x, .. })` over `None`, and its `cells!` fragment) is refused \"the cell term must name every child field exactly once\", though P6 and R4 read a created record's bare `..` as the defaults of the fields it does not name; S5-LOW (S5.3 part 2, ruling 4): the table admits it and the compiler cannot lower it yet, product feature work after S5.2, not routing"

["S5-Z1"]
owner = "S5"
kind = "feature"
what = "a context alias and an equation's function context refuse every `?` and collection entry, though a kept pattern means what a rule with that pattern on both sides means (P0; S5.3 part 3, ruling B) and the K forms they lower to are configuration patterns, which match a present `?` cell and a collection's instances as a rule's left side and a context do (`cells/g6-context/..` records that K): `Some(..)` is `invalid-term` (compiler `configuration_rules.rs` `entry_state_term`, \"an optional or collection entry occurs where a cell's content belongs\"); an instance record is `invalid-function-context` in a function context (`lower_function_context_cell`, \"reads leaf cells, not the whole nested cell\") and `invalid-configuration` in a context alias (transport `rule.rs` context-alias validation, `InvalidOptionalCellEntry`), whose `None` gets the same code where P5 gives `absence-test-without-creation`; a named instance rest (`instances0 @ ..`) is `cell-collection-placement` in both (expand `collection_placement`). S5-LOW (S5.3 part 4): the table admits these and the compiler cannot lower them yet, product feature work, not routing"
