# The findings of the red list: every `finding` that `pending.toml` names, who owns it, and what kind
# of fix it needs. The harness reads this file (`class_matrix::findings`); one table per finding,
# sorted by name:
#
#    ["NT-2-7"]
#    owner = "NT-28"
#    kind = "bug"
#    what = "one line saying what is wrong"
#    by_test = { k3 = "NT-30" }
#
# - `owner`: a ticket (`NT-28`), a step (`S1` to `S6`), or `kept: REF`, a limit kept by the decision
#   REF. A step is a finding's owner, never an entry's: `pending.toml` has no `step`.
# - `kind`: `bug` (KRS does what the language does not mean), `feature` (the table admits what KRS
#   does not do yet), `diagnostic` (the refusal is right, its code, site or advice is not) or
#   `generator` (the test's own data or harness is wrong).
# - `by_test`: the owners of the finding's entries of one test (`k2`, `k3`, `k7`, `k8`, ..), where
#   another than `owner` owns them, or where an owner of one test's entries is stated explicitly
#   (S0-9's and S0-14's K8 entries, whose advice is on S5's cell-entry messages).
# - `risk`: required on a finding that holds an under-refusal (the table refuses, KRS accepts), and
#   only there: what the K KRS writes means, and how it differs from what the spelling says.
#
# It fails (`class_matrix::findings::audit`) where a pending entry names a finding this file does
# not have, a finding (or a `by_test` owner) has no pending entry left (it is done: remove it), or
# a red's kind (`class_matrix::findings::Red`) is not one the finding's kind may hold: an
# under-refusal, a red with an internal code and a red that panicked only under a `bug`, whatever
# its test; a red of what KRS wrote or ran (an over-refusal, other K, K1, K3, K4, K6, K7, the twin
# check) never under a `diagnostic`; a K2 red of a case the table does not decide only under a
# `generator`.

["B1"]
owner = "S5"
kind = "bug"
what = "an initializer refuses bracket notation (`[]`, `[0]`, `[pgm]`) with the generic `unsupported-initializer-body`, also where it denotes a List or the computation"

["B2"]
owner = "S5"
kind = "diagnostic"
what = "an initializer value of the wrong kind or sort is rustc's E0308 at the entry's value, not a KRS error"

["B3"]
owner = "S5"
kind = "diagnostic"
what = "`Some(..)`/`None` in a readable result on a cell that is not optional is `krs::expand::not-a-declaration` at the spelling, not the presence rule"

["B7"]
owner = "S5"
kind = "bug"
what = "a bare entry on a `*` collection (`job: x`) is accepted with an undocumented one-instance meaning (decision D4: refuse it with the instance-list hint)"
risk = "KRS writes `X:JobCell`, one instance, for the entry the reference reads as an instance list: what the rule matches over a collection of no or several instances is not what `job: x` says, and nothing tells the author"

["B8"]
owner = "S5"
kind = "bug"
what = "an optional cell's pattern accepts a leaf spelling (`counter: x`, `counter: 0`) as present (decision D5: require `Some(..)`/`None`)"
risk = "KRS writes the presence pattern `<counter> X </counter>`, which `Some(x)` says: `counter: x` reads as \"whatever the counter holds\", but the rule never applies to an absent counter, silently"

["NT-2-26"]
owner = "kept: rustc parses the const item before any KRS attribute runs; the author sees rustc's error at the construct"
kind = "diagnostic"
what = "a constant's whole value that rustc cannot parse gets no KRS answer, and rustc then expands nothing in the crate, so every other KRS diagnostic of it waits on that error"

["NT-30-2"]
owner = "S6"
kind = "bug"
what = "a readable or claim item root `Wrap::<KItem>(x)` fixes the head's instance with a strict cast (`X::KItem`), while the printed `cells!` rule writes `X:KItem`: the same set for a variable, two spellings; which one the routes share is S6's question"

["NT-37-2"]
owner = "NT-42"
kind = "bug"
what = "`krs run` of a program whose static result has no value, which a rule's condition then reads, is an internal error (\"the backend returned 2 defined states\"): the backend keeps the rule's step under a condition over the application no equation evaluates beside the state it leaves, where the run is undefined"

["NT-42-2"]
owner = "NT-42"
kind = "bug"
what = "a static result whose lifted `k::matches!` has no value is an application of the lifted function that no equation evaluates, which the backend does not decide has no value: `krs run` reports the state holding it (`when(krsLocal(go))`) as built, where the same test at a rule's result keeps its projection and the run is undefined; a run whose state holds such an application states a value it does not have"

["NT-43-2"]
owner = "NT-42"
kind = "bug"
what = "K7's run of a sentence whose result builds an application of a partial function that no equation defines (`Size(x)`, `Size` partial with no equation) continues with the application in its state as if it were a value, ending at its depth bound, and one whose computed key is such an application reports two defined states; by KRS's meaning the term has no value, so the sentence's next state is undefined (NT-37 D3) and a key with no value looks nothing up: NT-42-2's class (a ground state that holds a valueless application of a partial function is no value) on K7's in-process route"

["S0-14"]
