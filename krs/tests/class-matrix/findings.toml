# The findings of the red list: every `finding` that `pending.toml` names, who owns it, and what kind
# of fix it needs. The harness reads this file (`class_matrix::findings`); one table per finding,
# sorted by name:
#
#    ["NT-2-7"]
#    owner = "NT-28"
#    kind = "bug"
#    what = "one line saying what is wrong"
#    by_test = { k3 = "NT-30" }
#
# - `owner`: a ticket (`NT-28`), a step (`S1` to `S6`), or `kept: REF`, a limit kept by the decision
#   REF. A step is a finding's owner, never an entry's: `pending.toml` has no `step`.
# - `kind`: `bug` (KRS does what the language does not mean), `feature` (the table admits what KRS
#   does not do yet), `diagnostic` (the refusal is right, its code, site or advice is not) or
#   `generator` (the test's own data or harness is wrong).
# - `by_test`: the owners of the finding's entries of one test (`k2`, `k3`, `k7`, `k8`, ..), where
#   another than `owner` owns them, or where an owner of one test's entries is stated explicitly
#   (S0-9's and S0-14's K8 entries, whose advice is on S5's cell-entry messages).
# - `risk`: required on a finding that holds an under-refusal (the table refuses, KRS accepts), and
#   only there: what the K KRS writes means, and how it differs from what the spelling says.
#
# It fails (`class_matrix::findings::audit`) where a pending entry names a finding this file does
# not have, a finding (or a `by_test` owner) has no pending entry left (it is done: remove it), or
# a red's kind (`class_matrix::findings::Red`) is not one the finding's kind may hold: an
# under-refusal, a red with an internal code and a red that panicked only under a `bug`, whatever
# its test; a red of what KRS wrote or ran (an over-refusal, other K, K1, K3, K4, K6, K7, the twin
# check) never under a `diagnostic`; a K2 red of a case the table does not decide only under a
# `generator`.

["B1"]
owner = "S5"
kind = "bug"
what = "an initializer refuses bracket notation (`[]`, `[0]`, `[pgm]`) with the generic `unsupported-initializer-body`, also where it denotes a List or the computation"

["B2"]
owner = "S5"
kind = "diagnostic"
what = "an initializer value of the wrong kind or sort is rustc's E0308 at the entry's value, not a KRS error"

["B3"]
owner = "S5"
kind = "diagnostic"
what = "`Some(..)`/`None` in a readable result on a cell that is not optional is `krs::expand::not-a-declaration` at the spelling, not the presence rule"

["B7"]
owner = "S5"
kind = "bug"
what = "a bare entry on a `*` collection (`job: x`) is accepted with an undocumented one-instance meaning (decision D4: refuse it with the instance-list hint)"
risk = "KRS writes `X:JobCell`, one instance, for the entry the reference reads as an instance list: what the rule matches over a collection of no or several instances is not what `job: x` says, and nothing tells the author"

["B8"]
owner = "S5"
kind = "bug"
what = "an optional cell's pattern accepts a leaf spelling (`counter: x`, `counter: 0`) as present (decision D5: require `Some(..)`/`None`)"
risk = "KRS writes the presence pattern `<counter> X </counter>`, which `Some(x)` says: `counter: x` reads as \"whatever the counter holds\", but the rule never applies to an absent counter, silently"

["NT-2-26"]
owner = "kept: rustc parses the const item before any KRS attribute runs; the author sees rustc's error at the construct"
kind = "diagnostic"
what = "a constant's whole value that rustc cannot parse gets no KRS answer, and rustc then expands nothing in the crate, so every other KRS diagnostic of it waits on that error"

["NT-30-2"]
owner = "S6"
kind = "bug"
what = "a readable or claim item root `Wrap::<KItem>(x)` fixes the head's instance with a strict cast (`X::KItem`), while the printed `cells!` rule writes `X:KItem`: the same set for a variable, two spellings; which one the routes share is S6's question"


["S0-14"]
owner = "S5"
kind = "bug"
what = "a readable map read's key refuses the `@` and `|` patterns the reference documents for map keys: it is read as the term it looks its entry up by, which binds no alias's name"
by_test = { k8 = "S5" }

["S0-15"]
owner = "S5"
kind = "bug"
what = "`job: []`, a List collection with no instance, is refused in a subject, though the reference documents it"

["S0-16"]
owner = "S5"
kind = "diagnostic"
what = "an author mistake reported unlocated, at the wrong entry, or under an internal code (C5)"

["S0-17"]
owner = "S6"
kind = "bug"
what = "a readable or `for Stmt` result, or a readable subject's Set collection instance cell, accepts `k::matches!` and `let` blocks that the `cells!` rule `krs expand` prints refuses (a subject's computed key no longer differs: NT-31)"

["S0-8"]
owner = "S4"
kind = "bug"
what = "the coverage lint's sort graph lacks the implicit `S ≤ KItem` edges the other judges have"

["S0-9"]
owner = "S5"
kind = "diagnostic"
what = "one cell-entry mistake answers with the code of whichever layer meets it first"
by_test = { k8 = "S5" }

["S5-A"]
owner = "S5"
kind = "diagnostic"
what = "a `cells!` wrapper of a layer the cell's stack has nowhere (`KCell(..)` on an optional leaf, `Cell(..)`/`KCell(..)` on a collection) answers with the missing presence or instances, not with `cell-wrapper` (decision (A), P3 b). On the collection the missing layer's advice is refused again; on the optional leaf the product advises `Some(k::configuration::Cell(..))`, which is admitted, so its 8 K8 deviations are the class's, and S5.3 settles `cell-wrapper`'s advice per form without deleting that one; and (S5.0g pattern review P-R5) a `Cell(..)` on the optional leaf whose inside the leaf refuses (`Cell([x, ..])`, `Cell(k::map![..])`) answers with the missing presence and advises `Some(k::configuration::Cell(..))`, which is refused again, where the inside's `bracket-reading` or `map-notation-at-non-map` is the mistake (10 K2 and 10 K8 entries)"

["S5-C2"]
owner = "S5"
kind = "bug"
what = "a second computation cell (`code: [x, ..]` below a plain group) is refused bracket notation as `invalid-list-notation` (\"the cell `code` holds `K`, which is not a list\"), though brackets are a computation's mark wherever it is declared (P1: a cell's name and role play no part; P2); S5.2's"

["S5-D2"]
owner = "S5"
kind = "bug"
what = "a `cells!` map result without `..` after a subject's anonymous rest silently keeps the rest, where the spelling says the result is the whole map (decision D2, P6)"
risk = "KRS writes K's `...` frame for the subject's anonymous rest and the result's entries over it, so the rule keeps every other entry of the map: the author's exact `k::map![5 -> old, x -> y]` reads as the whole new content in Rust, and nothing tells them the rest is kept"

["S5-L4"]
owner = "S5"
kind = "bug"
what = "a readable subject record that names some of its group's children and writes no `..` (`frame: G { a: x }` on `G { a, b }`) is accepted (L4: `record-missing-children`; P6, records follow Rust: without `..` a record names every field); S5.2's"
risk = "KRS leaves the unnamed child `b` unconstrained, as `G { a: x, .. }` says: the rule matches whatever `b` holds, while the record without `..` reads in Rust as naming every field, so the missing `b` is a mistake nobody is told about"

["S5-M1"]
owner = "S5"
kind = "bug"
what = "an initializer that also places the program in a second computation cell beside `k` (`prog: k::k![pgm]`) is refused `krs::analysis::main-cell` (\"more than one reads the program\"), though `k` is the computation cell by its name and the other cell holds a copy of the program (P1: a cell's role plays no part); S5.4's"

["S5-Q1"]
owner = "S5"
kind = "bug"
what = "decision Q1, both halves: a subject entry that constrains nothing on a cell the result leaves out (`_`, `[..]`, `Cell(_)`) is a lint, not a refusal: readable refuses it, `cells!` accepts it without the warning; and a result over a cell the subject does not match is the overwrite, which readable refuses (\"a machine-rule result cannot introduce an unmatched cell\") and `cells!` refuses under the internal `krs::analysis::unsupported-shape` (\"the result selects a fixed cell absent from the subject\"), so the class the table states is never reached. An internal code an author reaches is a KRS bug, hence `bug`"

["S5-Q2"]
owner = "S5"
kind = "feature"
what = "`job: [x, ..]` on a List collection binds its front instance (decision Q2), which readable refuses as bracket notation"

["S5-S1"]
owner = "S5"
kind = "bug"
what = "an entry naming a cell below a `?` or `*` ancestor by its path (readable `hpc: x`, a claim's, a `cells!` key such as `crate::Acct::apc`) is admitted, or refused with another code than its class: the cell's own kind first (P3, as at the record's level), then the ancestor's (`optional-without-presence`, `collection-without-instances`; S1 (b), design §2.3): S5.2's for readable records and claims, S5.3's for `cells!` keys"
risk = "below `*`, KRS reads the named cell as a child of one implicit instance, so the rule silently needs exactly the instance it picks and matches or writes that one; below `?`, it silently requires the optional ancestor to be present (B8's reason). The entry names one cell's content, which no single cell has"
