# NT-35-1 (K7, the printed state): the printer reverses the case's alias, whose subject writes
# `k::builtin::set::item(x)`, so the `<k>` head prints `SetItem ( .. )`, which the program grammar,
# the one `krs run` reads a program with, has no syntax for: a program writes a set only through a
# function (the base's `sone`). The print does not read back as a program (NT-24's rule, a clause
# whose subject a program does not read back is not reversed, met by a collection constructor
# instead of a token). The main module's grammar read it back until NT-35 made the program grammar
# the reader. Probe: the case.

