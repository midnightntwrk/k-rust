# NT-3-3: a Set collection's instance is read as matched cells, not as the set's element
# A Set collection is looked up by its instances as a set by its elements, so an instance whose
# every part is computed from names bound elsewhere denotes the element it computes, and a function,
# an operator, a sort test or a record update there is admitted as in a key; the oracle reads it so
# (`readable/set-instance-child`). KRS writes a Set collection's instance as the cells it holds, the
# cell content of the collection's parent, which a rule matches as it stands: emitted that way, a
# function there describes a term that never occurs (also observed: k-rust's native frontend refuses
# the emitted rule, `IllegalFunctionOnLhs`). The product keeps reading the instance as matched cells
# (`function_patterns::instances`, the walker's and the parser's pattern reading). Admitting it needs
# the instance written as an element the lowering looks up, which is new design. Proposal: lower a
# Set collection's computed instance as the element of the collection's set, or keep the refusal and
# say so in the class message. Plan: new (stop rule of the NT-3 review).

