# NT-3-1: a set's element in a pattern refuses what a key admits: computed constructs and notation (P5)
# A set is looked up by its elements as a map by its keys, so an element that computes (a sort
# test, a record update, an operator or a method) denotes the value it computes, as a map key does;
# the oracle accepts these. The product reads a key's reading from the syntax that makes it a key
# (a readable map read, `k::map!`), before any name resolves, and tells a construct's placement there;
# `k::builtin::set::item(e)` is an application whose head only resolution tells from a constructor's,
# so its argument is read as a constructor's field, matched: the walker refuses a `let` block,
# `k::matches!`, a sort test and a record update there, and the parser a notation form. Reading the
# head's path before resolution would give one term two meanings by its spelling (an imported or
# renamed `set::item`). Proposal: give a set's element in a pattern a syntax of its own,
# `set![e, ..]`, whose elements read as `k::map!` keys do. Plan: new (stop rule of NT-3; NT-6
# assessed it and left it, see below).
# NT-6: `set![..]` is now a built literal, which a pattern reads as the calls it denotes:
# `set![e]` is `set::item(e)`, a value, and `set![a, b]` a `set::union`, a function. Its element is
# read as an expression, so an operator there is the call it denotes (`seen: set![n + 1]` is
# accepted and looked up, `SetItem(N +Int 1)`), but the walker still reads the element as a
# constructor's field, so a sort test, a `let` block or a record update there is refused as in
# `set::item(e)`. These cases turn green only with design beyond NT-6's: (1) the walker reading a
# set literal's element as a key, which the macro's syntax tells before resolution as `k::map!`'s
# does; (2) a pattern meaning for the anonymous rest of `set![e, ..]`, the join
# `set::concat(set![e], _)` with distinct elements (D1), which NT-6 refuses as a built term's rest;
# (3) the generator's `set-element` opener written `set![HOLE, ..]`, since these cases are written
# with `set::item`, which keeps its placement-first reading.
# The review's mixed keys (`set::item(Cmd::Pair { a: HOLE, b: z })`, `z` bound nowhere else) show the
# same: notation there is the parser's refusal, though the key is a selection where a function never
# matches. Deferring a sort test or a record update in a set element to the compiler, as a function
# is, would move every pattern's sort test and record update refusal from placement to resolution,
# which their classes do not have: kept as is.

