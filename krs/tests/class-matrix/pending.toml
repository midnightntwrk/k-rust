# A `#[k::rule]` fn that returns `()` needs a `k::rewrite!` in its subject, and the `local-rule`
# template has none but the case's own, so every other construct is refused for the template's
# missing rewrite, at the fn's name, whatever the construct is (a generator defect: these cases have
# two points of interest).

["import/local-rule/subject/Go()"]
finding = "unassigned"
deviation = "krs::syntax::invalid-local-rewrite @ item"

["import/local-rule/subject/Hold(x)"]
finding = "unassigned"
