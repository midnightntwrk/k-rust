# The class-test cases known not to conform: the red list. An exact entry is keyed by the case ID
# and names the finding the deviation belongs to and the deviation exactly as the harness prints it:
#
#    ["readable/result/pc/Some(x)"]
#    finding = "B3"
#    deviation = "krs::expand::not-a-declaration @ spelling"
#
# A family entry pends, under one finding, every red of one diagnostic kind whose key a glob
# (expected.toml's syntax) matches:
#
#    [[family]]
#    match = 'init/{counter,frame}/pgm'
#    finding = "B2"
#    kind = "diagnostic"
#
# Every finding is registered in findings.toml, with its owner (a ticket, or the step S1 to S6
# whose design makes its cases conform), its kind and what it is.
#
# A pending case that conforms, or deviates differently, fails until this file records it; see
# `class_matrix::pending`. Keys: a case ID (K2, read by both tiers), `full/ID` (K2 where the full
# tier observes a case otherwise than the front), `k1/ID`, `k3/ID`, `k6/ID`, `k7/ID`, `k8/ID` (K8's
# advice check), `lattice/..` (K4) and `entry/..` (K5).
#
# Family entries are for diagnostic reds only: a program refused as it should be, with the wrong
# code, site or advice (kind `diagnostic`, `diagnostic+rust-syntax`, `lint-missing`, `lint-unowed`,
# or `k8`), where one fix moves the whole family. A red of what KRS accepts, writes or runs (an
# under- or over-refusal, other K, K1, K3, K4, K6, K7, the twin check) or a bug (an internal code,
# a panic) stays exact, one entry per case, and `full/..` entries stay exact. An exact entry wins
# over a family that matches its key; no key is matched by two families. What a family gives up:
# - it does not notice one of its reds moving from one wrong code, site or advice to another;
# - it does not notice one of its cases conforming while another case of the family is red.
# What it still catches: a red of its family that turns into a red of another kind (a meaning
# red, a bug) fails as no longer the family's; a family a whole run of a shard reaches with no red
# left fails as stale (a filtered run cannot tell, and does not judge it); a case outside every
# glob that deviates fails as before.
#
# A lane that fixes a diagnostic family deletes its family entry; one whose fix leaves part of a
# family red narrows the glob to the cases still red, or leaves it while the stale rule does not
# fire. A new diagnostic red is proposed exact (`<shard>.pending.toml`); a lane may collapse it into
# a family with scripts/krs-class-collapse-pending.py, whose proof is the ignored test
# `the_collapsed_red_list_pends_what_the_exact_one_did` (krs-test-support, `--test class_matrix`).

# Family entries, by finding: each pends the reds of its kind whose key its glob matches
# (see the header); the count is the reds each pended when
# scripts/krs-class-collapse-pending.py last wrote this section.

