# NT-3-2: a map key in a pattern refuses a `let` block and `k::matches!`, which compute the key looked up
# A key that computes denotes the value it computes, so the oracle accepts a `let` block and a
# `k::matches!` there, at the key's root as below a construct that computes, and in a Set
# collection's instance, which the set is looked up by. Both carry binders: `#let P = E #in B` is
# `#fun(P => B)(E)`, a function whose own rule binds `P`'s names, and `:=K` binds its pattern's names.
# KRS's sentences put every name of a rule's left side in the rule's pattern variables, so in a
# left side those binders would read as the rule's variables, bound by the match, not by the
# construct (the IR also places `#let` and `:=K` in built terms and conditions only). The
# walker refuses both anywhere in a pattern's key (`let-outside-term`, `matches-outside-condition`),
# and the class messages say why. Proposal: give the lowering local binders a left side's key can
# carry (renamed apart from the rule's variables, as a result's `let` binders are), then admit both
# in a key; a differential run of the Java frontend and k-rust's native frontend over the emitted
# rule would support it. Plan: new (stop rule of NT-3).
