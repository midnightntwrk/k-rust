# S0-14: a readable map read's key refuses the `@` and `|` patterns the reference documents for map keys
# NT-3: a readable key beside a name bound nowhere else (`Cmd::Pair { a: HOLE, b: z }`) cannot spell
# `_`, `@` or alternatives below its root, and reads `x | 1` as the operator.

# NT-6: the collection literals and the calls they denote, at the same openers as NT-5's notation.

# S0-16: an author mistake reported unlocated, at the wrong entry, or under an internal code (C5)
# The two left: S5 reads `job: [x, ..]` results by declared kind

# NT-6: the collection literals and the calls they denote, printed in a `for Stmt` result's `let` or
# `k::matches!`.

# B2: an initializer value of the wrong kind or sort is rustc E0308 at the entry's value (its inferred wrapper is spanned there), not a KRS error
# The value's kind (a cell wrapper, map notation, presence, a group or instance record, a leaf
# value) must be judged against the cell's declared kind, which the `#[k::init]` macro cannot see
# and only the collector knows: S5's, with S0-9's other cell-entry spellings.
# NT-17: `k::absent!(t)` on a plain cell is checked as the `Some(t)` it expands to, so an author who
# wrote no `Option` reads "expected `T`, found `Option<..>`". The expansion could word it in KRS's
# terms without seeing the field's type: expand to a facade fn generic in its result, bounded by a
# trait only `Option<T>` implements and marked `#[diagnostic::on_unimplemented]`, so rustc infers
# the field's type and says "`k::absent!` starts an optional (`?`) cell absent; `T` is not an
# `Option`". That is rustc's E0277, still not `presence-on-plain-cell`, so the six
# `init/*/k::absent!(0)` entries stay pending for S5 either way; only the wording would move.

# B3: `Some(..)`/`None` in a readable result on a cell that is not optional is `krs::expand::not-a-declaration` at the spelling (rustc resolves it to `Option`'s variant), not the presence rule
# `Some(..)`/`None` written as a result entry is presence, decided against the cell's declared kind
# (optional or not), which the readable macro cannot see: it reads the spelling as a term only
# because the subject did not name the cell as optional. S5's, with S0-9's other cell-entry spellings.

# B7: a bare entry on a `*` collection is accepted with a one-instance meaning

# B8: an optional cell's pattern accepts a leaf spelling (`counter: x`, `Cell(0)`) as present

# NT-2-4: an open record in a built term or a `cells!` value is admitted and fails in lowering with an internal descriptor message
# `Ctor { f: e, .. }` leaves the unlisted fields open, which only a pattern can: a result or a
# condition has no value for them, and a `cells!` term names every field. The table admits it outside
# a pattern and a `cells!` value, and lowering reports `krs::analysis::invalid-term` "application
# expects 2 arguments but received 1", a descriptor message, also in a `cells!` value, where the
# table's own class is `record-remainder-in-cells-term`. Probe: `Cmd::Hold(Cmd::Pair { a: x, .. })` in
# a rule's result. Plan: new.
# NT-3: an expression's record now keeps its `..` (it read `Ctor { f: e, .. }` as a record of the
# listed fields), so a `cells!` value refuses it with its own class and its cases conform; a rule's
# result still admits it and fails in lowering.

# NT-2-6: a construct no Rust pattern or expression spells, nested below a slot's root, is the parser's syntax error rather than its class
# Where a pattern is parsed below a subject's root (a `let` or `k::matches!` pattern, a rewrite's
# left side, an alias's body, a list element, a computation item) a notation form, a `let` block, a
# predicate or a record update is reported as `krs::syntax::rust-syntax` ("expected `,`") or
# `krs::syntax::invalid-state-macro`, and where an expression is parsed (a `let` body, a closure's
# body, a record update's field) `y @ P` is too; at the slot's root each answers with its class's
# code. The class says what the construct means where it stands, which "expected `,`" does not. Probe:
# `k::matches!(x, x + 1)` in a rule's condition. Plan: new (diagnostics).
# NT-5: an index or a collection method there, whose meaning is the call's (`function-in-pattern`), is
# the same syntax error where its position mixes a pattern and an expression no one Rust parser reads
# (`y @ m[x]`, `k::rewrite!(m[x] => ..)`, a `let` or `k::matches!` pattern). A pattern a method call
# or an index continues (`x.add::<Int>(1)`, `m[x]` in a `cells!` item or map value, a list element)
# is now read as the term it continues into, so those cases answer with their class.

# NT-2-7: `_` where no production field gives it a sort is the descriptor validator's internal message
# `k::matches!(x, _)` and a `cells!` computation item `KCell(_, ..)` (also the `cells!` rule `krs
# expand` prints for the readable `{ k: [_, ..] }`) report `krs::analysis::invalid-term` "wildcard has
# no expected production-field sort": `_` matches any term, which the readable item and a constructor's
# field accept. Probe: `terms/cells/item-root/_`. Plan: new.
# NT-4: `_` at a `for Sort` clause's root is admitted, and `krs expand` prints the clause as a `cells!`
# rule whose computation item is that `_`, so its K3 fails the same way. The fix must also keep the
# clause's sort there: the clause emits `_:Stmt` for `for Stmt` (a bare name, `S:Stmt`), while a
# `cells!` item `_` reads as any `KItem`.

