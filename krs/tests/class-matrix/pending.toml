# NT-7-1: no prover takes a `let` block or `k::matches!` in a claim
# A claim's start and end states are terms over its variables, as a rule's sides are, and its
# conditions Bools: a `let` block denotes the term it computes and `k::matches!` a Bool, so the
# oracle admits both in a readable claim's states and in a claim's conditions (a `cells!` claim's
# cell values keep S0-17's boundary). They lower as in a rule, to `#let` and `:=K`, and no tool that
# reads a claim takes them: the native prover (`krs prove`) refuses `#let` in a claim's condition and
# end state at k-rust's definition check ("a claim's local function is lowered to no function its
# proof can apply") and fails on `:=K` ("cannot find a production for KLabel _:=K_"); Java K's
# `kprove` refuses both in a claim's start state, end state, `requires` and `ensures` ("Could not
# find productions for KApply with label #let" / "_:=K_"; "Found #fun expression in a pattern
# location" for `#let` in the start state). Both lower `#let`, `#fun` and `:=K` to generated
# functions only in a definition's sentences, never in a claim. So the product refuses them in a
# claim, by the classes `let-in-claim` and `matches-in-claim`, whose message says so. The entries
# include cases the oracle refuses for another reason, the `let` whose pattern holds `@` or `|`
# (`alias-in-let-pattern`, `alternatives-in-let-pattern`), the closure body's `let` and
# `k::matches!` (`object-term-as-predicate`) and the guard's `let` whose value is no Bool
# (`let-sort`): the product refuses the block in a claim before it reads its pattern, its sort or
# the predicate it stands in. Plan: lower a claim's local functions where the provers read the claim (k-rust's
# `resolve_fun` over claims, or KRS generating the functions into the definition), then admit them.

