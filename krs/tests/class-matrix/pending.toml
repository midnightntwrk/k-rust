# The class-test cases known not to conform: the red list. Each entry is keyed by the case ID and
# names the finding that owns the deviation (`unassigned` while none does), the deviation exactly as
# the harness prints it, and optionally the step (S1 to S6) whose design makes the case conform:
#
#    ["readable/result/pc/Some(x)"]
#    finding = "unassigned"
#    deviation = "E0277 @ item"
#
# A pending case that conforms, or deviates differently, fails until this file records it; see
# `class_matrix::pending`.

# Lane "fast" (U2): the fast tier, `krs/crates/krs-expand/tests/class_front.rs` (K1 and K2 at the
# front).
#
# `k::or_bool!` outside a claim is refused with `claim-only-term` at the invocation's call site (the
# `#[k::...]` attribute or the `k::...!` path), not at the island: the term builder reports it at
# `Span::call_site()`.

