# alternatives are refused (`x | 1` there). Probe:
# `terms/init/item/Cmd::Pair { a: x, .. }`. Plan: new.
# NT-3: an expression's record now keeps its `..`, so a constant and an initializer refuse the open
# record by its placement, before its names, and their cases conform.

