# The `local-rule` template rewrites the command's first field, `k::rewrite!(x => Cmd::Go())`. An
# existential closure in its second field is refused with `invalid-local-rewrite` at that rewrite,
# not at the closure.

["terms/local-rule/subject/k::ml::exists(|v: Int| k::ml::equals(v, 0))"]
finding = "unassigned"
deviation = "krs::syntax::invalid-local-rewrite @ item"

