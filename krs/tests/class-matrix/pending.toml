# Lane "full" (U3): the full tier, `krs/crates/krs-cli/tests/class_matrix.rs` (K2 through rustc,
# the collector and lowering; K1 after lowering, keyed `k1/CASE`; K3, keyed `k3/CASE`; K4 against
# k-rust, keyed `lattice/class-BASE/..`). Its findings:
# - B2: an initializer value of the wrong kind of cell is rustc E0308 at the generated types of
#   `#[k::init]`, not at the value;
# - B3: `Some(..)`/`None` in a readable result on a cell that is not optional is rustc E0277 on a
#   hidden facade trait at the whole block;
# - B4: `k: x`, or `{ y -> x, .. }` on a cell that is not a Map, is an unlocated `unsupported-shape`;
# - B6: a `cells!` wrapper that disagrees with the cell's kind (`KCell` on a leaf, `Cell` on the
#   computation or a group) is an unlocated `parser-reference-disagreement` or `invalid-term`;
# - B7: a bare entry on a `*` collection, accepted with a one-instance meaning (K3 below);
# - N22: a module-level `use Cmd::*;` does not reach the term positions (rustc E0573);
# - N26: two literals in one initializer term give one semantic key twice;
# - N27: an initializer value of a strict subsort of its cell's sort is refused by the IR
#   validator, unlocated;
# - S0-1: `Some(x)`/`None` in a result on the optional cell, when the subject binds the whole cell,
#   is rustc E0277 at the whole block;
# - S0-4: an initializer that reads a configuration variable twice is rustc E0382;
# - X1: initializer fields out of declaration order are an unlocated collector error;
# - X2: an initializer that leaves a declared configuration variable unused is an unlocated IR
#   validation error.
# `y @ Cmd::Hold(_)` outside a subject is refused at the front with one KRS error, which the fast
# tier sees; rustc's parser adds a second, uncoded error, so those cases are keyed `full/CASE`.

