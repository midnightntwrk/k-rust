# NT-2-4: an open record in a built term or a `cells!` value is admitted and fails in lowering with an internal descriptor message
# `Ctor { f: e, .. }` leaves the unlisted fields open, which only a pattern can: a result or a
# condition has no value for them, and a `cells!` term names every field. The table admits it outside
# a pattern and a `cells!` value, and lowering reports `krs::analysis::invalid-term` "application
# expects 2 arguments but received 1", a descriptor message, also in a `cells!` value, where the
# table's own class is `record-remainder-in-cells-term`. Probe: `Cmd::Hold(Cmd::Pair { a: x, .. })` in
# a rule's result. Plan: new.
# NT-3: an expression's record now keeps its `..` (it read `Ctor { f: e, .. }` as a record of the
# listed fields), so a `cells!` value refuses it with its own class and its cases conform; a rule's
# result still admits it and fails in lowering.

# NT-2-6: a construct no Rust pattern or expression spells, nested below a slot's root, is the parser's syntax error rather than its class
# Where a pattern is parsed below a subject's root (a `let` or `k::matches!` pattern, a rewrite's
# left side, an alias's body, a list element, a computation item) a notation form, a `let` block, a
# predicate or a record update is reported as `krs::syntax::rust-syntax` ("expected `,`") or
# `krs::syntax::invalid-state-macro`, and where an expression is parsed (a `let` body, a closure's
# body, a record update's field) `y @ P` is too; at the slot's root each answers with its class's
# code. The class says what the construct means where it stands, which "expected `,`" does not. Probe:
# `k::matches!(x, x + 1)` in a rule's condition. Plan: new (diagnostics).
# NT-5: an index or a collection method there, whose meaning is the call's (`function-in-pattern`), is
# the same syntax error where its position mixes a pattern and an expression no one Rust parser reads
# (`y @ m[x]`, `k::rewrite!(m[x] => ..)`, a `let` or `k::matches!` pattern). A pattern a method call
# or an index continues (`x.add::<Int>(1)`, `m[x]` in a `cells!` item or map value, a list element)
# is now read as the term it continues into, so those cases answer with their class.

