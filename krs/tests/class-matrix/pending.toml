# NT-5-1: alternatives one of which is an index or a collection method are read as the operator `|`
# `k::builtin::map::empty()[x] | Cmd::Go()` in a subject is no Rust pattern, so the subject's reader
# parses the whole as a term expression, where `|` is `Int`'s bitwise operator: the case answers
# with the operator's errors (`ambiguous-operator`, ..). The tokens are alternatives (`|` at a
# pattern's root), the second binds no `x` (`alternatives-bind-unequally`), and the index is a
# function in a pattern. The refusal is right; its class is not. Plan: read a pattern's top-level
# `|` as alternatives before the expression fallback reads its branches (`parse_pattern_tokens_at`).

# NT-5-2: a simplification rooted at a collection's function fails the semantic theory's validation, unlocated
# A simplification rewrites an unevaluated application, and `map::get(m, k)`, `list::size(l)` or
# `set::to_list(s)` is one, as `int::add(x, 1)` is; the oracle admits it. Lowering writes a
# collection operation as the collection term it builds (not as an application), so the semantic
# theory's validator refuses the simplification ("must be rooted at a function or builtin
# function"), an internal error with no location; the index and the methods answer as their calls.
# Proposal: let a simplification's root be a collection operation's term (its K is `M [ K ]`,
# `size(L)`, ..), or refuse it at the root with the class value-rooted simplifications have
# (`simplification-root-not-function`, NT-2-12's), with a message naming the collection function.
# Its six notation cases and their calls are the accepted pairs `accepted-terms.toml` relates by
# `same_k_as`, which K3 compares once both are accepted.

# NT-6: a simplification rooted at a map literal's or a set literal's `map::update` or
# `set::union` answers as its call does; the pairs are compared once both are accepted.

# NT-5-3: a context alias's computation item gives a projected collection read no sort
# `map::get(..)` and `list::get(..)` read a `KItem` that the position projects to its sort; in a
# context alias's `k` item there is no expected sort, so inference refuses the read ("requires an
# expected result sort", `invalid-term`) before the function in the pattern is told; in a rule's
# computation item the same read is `function-in-pattern`. The index answers as its call. Plan:
# give a context alias's items their cell's item sort (`KItem`), as a rule's are.

# NT-6-1: a constant refuses the empty map and set, which are values
# A constant's value is a ground term every use can match. The empty map and set are values, K's
# `.Map` and `.Set`, the units a pattern matches as they stand, as a constructor is; the oracle
# admits them in a constant. The product refuses every builtin call in a constant's value as an
# operation it applies (`krs::analysis::invalid-constant`, "applies a builtin operation"), the empty
# collection's included; the literals `map![]` and `set![]` are decided as their calls and are
# refused with them. Predates NT-6 (`const C: Map = map::empty();`), first generated by NT-6's
# spellings. Proposal: admit the builtin collections' values in a constant: the empty map, set and
# list, and a set's or a list's singleton of ground terms (`set![1]`, `[1]`). Plan: new.

