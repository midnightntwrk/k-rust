# Cell-entry exceptions: the cell-entry rows that depart from the cells oracle
# (`class_matrix::cells_oracle`), each with the principle it departs by: `E3` (no `..pgm` in an
# initializer's `k!`), or `C-lim: REASON`, a stated
# limitation refusing a spelling the principles give a meaning to. Check 1 of `tests/cells_oracle.rs`
# fails on a disagreement no entry names, and on an entry that names no disagreement (stale). A run
# case is named through its twin.
[cell-exception]

[cell-exception.'{claim,readable}/result/job/[..\, Job \{ payload: 0\, .. \}]']
principle = "C-lim: a List collection rule that changes instances at both ends is not lowered (cell_states.rs lower_instances_clause); split it into two rules. Here the subject matches the front instance and the result creates one at the back; the product creates or removes instances at the back, and reads and updates them at the front"

[cell-exception.'{claim,readable}/subject/job/[..\, Job \{ payload: 0\, .. \}]']
principle = "C-lim: a List collection's back instance kept in place is not lowered (cell_states.rs lower_instances_clause): here the subject reads it and the result leaves the cell out, so it is kept; the product creates or removes instances at the back, and reads and updates them at the front"

[cell-exception.'cells/g6-context/kinds/job/[..\, k::fragment![crate::Job \{ payload: x \}]]']
principle = "C-lim: a List collection's back instance kept in place is not lowered (cell_states.rs lower_instances_clause): a context keeps every cell its pattern names and is lowered as a rule's pattern is, so the back instance it matches is kept, as a rule's subject keeps one its result leaves out; the product creates or removes instances at the back, and reads and updates them at the front. A function context and a context alias are lowered by lowerings of their own, which reach no List lowering"

[cell-exception.'{claim,readable}/result/env/\{ y -> x\, .. \}']
principle = "C-lim: a map read has no result side until M3; P6 reads `{ k -> v, .. }` in a result as the frame write `Cell(k::map![k -> v, ..])`"

[cell-exception.'{claim,readable}/overwrite/kinds/env/\{ y -> x\, .. \}']
principle = "C-lim: a map read has no result side until M3; P6 reads `{ k -> v, .. }` in a result over an unmatched map as the frame write `Cell(k::map![k -> v, ..])` with a rest the subject never wrote (`rest-mismatch`)"

[cell-exception.'{claim,readable}/result/kinds/aomap/\{ y -> x\, .. \}']
principle = "C-lim: a map read has no result side until M3; on a `?` Map leaf it lacks `Some(..)` (optional-without-presence by P3c), and its advice `Some({ y -> x, .. })` is refused again by that limitation, so the limitation is named first (P3's reason at every depth, S5.0g pattern review P-R5)"

[cell-exception.'cells-run/result/bag/\{ k::fragment![crate::Obj \{ key: x\, m: k::map![x -> y\, ..] \}]\, ..instances0 \}']
principle = "C-lim: a `cells!` result's map literal with a rest is refused at the form until M3, at a content root too (design:M3); there P6 judges it by pairing: the field's value is the Map child's entry (P1), and the instance is created, so the child had no content and its `..` keeps none (rest-mismatch; S5.0g fixes review F-1)"

[cell-exception.'cells/g4-d/kinds/account/\{ k::fragment![crate::Acct \{ aenv: k::map![v -> x\, ..]\, ..me \}]\, ..instances0 \}']
principle = "C-lim: a `cells!` result's map literal with a rest is refused at the form until M3 (design:M3); a fragment field's value is its Map child's content root (S5.0g fixes review F-1), two levels deep here (an updated instance's Map child), which P6 judges by pairing: the update keeps the child's rest through `..me`"

[cell-exception.'init/k/k::k![Cmd::Go()\, ..pgm]']
principle = "E3"

[cell-exception.'{claim,readable}/subject/typed/map/{1,Go(),Unit()}']
principle = "C-lim: a readable record's top-level map read takes its value as a binder; inside an instance record the value is matched (P5), as `readable-run/subject/bag/{ Obj { key: 1, m: { 1 -> 2, .. } }, .. }` shows"

[cell-exception.'sweep/cells/{overwrite,result}/*/k::configuration::Cell(k::map![y -> x\, ..])']
principle = "C-lim: a `cells!` result's map literal with a rest is refused at the form until M3 (design:M3), at a content root too, where P6 judges it by kind and pairing (S5.0g pattern review P-R2)"

[cell-exception.'sweep/cells/result/{f02-mcell,f03-mcell,f06-mcell}/k::fragment![crate::M \{ mm: k::map![y -> x\, ..]\, mn: 0 \}]']
principle = "C-lim: a `cells!` result's map literal with a rest is refused at the form until M3 (design:M3); a fragment field's value is its Map child's content root, which P6 judges by pairing (S5.0g fixes review F-1)"

[cell-exception.'sweep/{claim,readable}/result/{f02-mcell,f03-mcell,f06-mcell}/M \{ mm: \{ y -> x\, .. \}\, mn: 0 \}']
principle = "C-lim: a map read has no result side until M3; a group record's field value is its Map child's content root (P1, P7; S5.0g fixes review F-1), so P6 reads the child's `{ k -> v, .. }` in a result as the frame write `Cell(k::map![k -> v, ..])`, as its `cells!` twin's fragment child, judged by kind and pairing"

[cell-exception.'sweep/{claim,readable}/{overwrite,result}/{env,omap}/\{ y -> x\, .. \}']
principle = "C-lim: a map read has no result side until M3; P6 reads `{ k -> v, .. }` in a result as the frame write `Cell(k::map![k -> v, ..])`, judged by kind and pairing (on the `?` Map leaf its advice `Some({ y -> x, .. })` is refused again by that limitation, so the limitation is named first, P-R5)"

[cell-exception.'sweep/{claim,readable}/result/job/[..\, x]']
principle = "C-lim: a List collection rule that changes instances at both ends is not lowered (cell_states.rs lower_instances_clause); split it into two rules. Here the subject matches the front instance and the result's value `x` creates one at the back (P2, P6; Q2 makes the instance a value); the product creates or removes instances at the back, and reads and updates them at the front"

[cell-exception.'sweep/{claim,readable}/subject/job/[..\, x]']
principle = "C-lim: a List collection's back instance kept in place is not lowered (cell_states.rs lower_instances_clause): here the subject's value `x` binds the back instance (P2, P6; Q2) and the result leaves the cell out, so it is kept; the product creates or removes instances at the back, and reads and updates them at the front"

[cell-exception.'sweep/init/init/{acct,bag,counter,env,frame,job,ogroup,olist,omap,pc,seq,set,stack}/k::k![Cmd::Go()\, ..pgm]']
principle = "E3: a stated exception, a spelling rule applied before P3: an initializer's `k![..]` takes no `..pgm` on any cell, so the product answers `initializer-remainder` at the form, where `outcome`, which leaves E3 out by design, judges the value by the stack (P3b: the computation's mark off the computation)"

[cell-exception.'sweep-paths/cells/{overwrite,result}/*/k::configuration::Cell(k::map![y -> x\, ..])']
principle = "C-lim: a `cells!` result's map literal with a rest is refused at the form until M3 (design:M3), at a content root too and below a marked ancestor too, where P6 judges the entry by its kind and then its path (S1 (b)); the form's refusal comes first"

[cell-exception.'sweep-paths/{claim,readable}/{overwrite,result}/{lenv,lomap,qenv,qomap}/\{ y -> x\, .. \}']
principle = "C-lim: a map read has no result side until M3, below a marked ancestor too; P6 reads `{ k -> v, .. }` in a result as the frame write `Cell(k::map![k -> v, ..])`, judged by its kind and then its path (S1 (b)), and the limitation, a refusal of the form, comes first"

[cell-exception.'{claim,readable}/g4-d/kinds/account/\{ Acct \{ aenv: \{ v -> x\, .. \}\, ..me \}\, .. \}']
principle = "C-lim: a map read has no result side until M3; an instance record's field value is its Map child's content root (S5.0g fixes review F-1), so P6 reads the updated instance's `aenv: { v -> x, .. }` as the frame write `Cell(k::map![v -> x, ..])`, as its `cells!` twin's fragment child, and the product refuses it as at a group record's child (TRI-C)"

# Limit classes (TRI-C2): a class whose refusal is a limit of the product's, not a principle. Its
# cases are cell entries the cells oracle admits, and its rows record the product's honest refusal.
# Each restates its class's `code`, says where the limit is stated, `message` (a fragment of the
# product's message, which the full tier checks) or `docs` (a fragment of the language reference's
# sentence, which names the code), saying "not supported yet", and names the findings whose rows it
# states. Check 1 counts its row as agreeing with an admission and fails where the principles
# refuse a case of it; check 2 asks the product's admission for the principles' answer.
[limit]

[limit.collection-overwrite]
code = "krs::analysis::collection-entry"
docs = "A collection's overwrite replaces every instance it holds"
findings = ["S5-A1"]

[limit.collection-rest-dropped]
code = "krs::analysis::collection-entry"
message = "not supported yet: the pattern binds the other instances of the collection"
findings = ["S5-Q2"]

[limit.computation-brackets-per-rule]
code = "krs::analysis::invalid-list-notation"
docs = "brackets read one computation cell per rule"
findings = ["S5-C2"]

[limit.fixed-cells-only]
code = "krs::expand::cell-collection-placement"
docs = "A context alias and an equation's function context read fixed cells only"
findings = ["S5-Z1"]

[limit.instance-beside-outer-cell]
code = "krs::analysis::collection-entry"
message = "a rule whose cells lie both inside an instance and outside every instance is not supported yet"
findings = ["IC-1"]

[limit.instance-child-multiplicity]
code = "krs::analysis::collection-entry"
docs = "An instance record does not name a `?` or `*` child yet"
findings = ["S5-G3"]

[limit.instance-update-base-elsewhere]
code = "krs::analysis::invalid-record-update"
docs = "an update whose label names a record of the instance's constructor matched in another cell"
findings = ["S5-G1"]

[limit.nested-anonymous-rest]
code = "krs::syntax::invalid-list-notation"
docs = "An anonymous `..` keeps a rest this way only in a cell of the record itself"
findings = ["S5-F2"]

[limit.optional-group-defaults]
code = "krs::analysis::invalid-term"
docs = "A `?` group created with a record that leaves its other children"
