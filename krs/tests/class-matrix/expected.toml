# overlapping-static-clauses (NT-22): the case's clause `Cmd::NAME(x, HOLE)` beside a second clause
# of its production, `Cmd::NAME(x, Cmd::Pair(7, 7))`. A name or `_` in the hole matches the pair
# too (`x` binds the first argument, and the term `cTAG(pair(7, 7), pair(7, 7))` matches both), and
# neither clause states an order, so which applies there is arbitrary; the error is at the later
# clause's subject, outside the spelling. `1` and `Cmd::Hold(x)` match no pair, and each clause
# applies where its own subject matches.
[[refuse]]
