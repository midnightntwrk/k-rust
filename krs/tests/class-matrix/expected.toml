# reading's slot pins the names rules: `Hold(x)` at the subject's root beside the result
# `Cmd::Go()` binds `x` its result does not read, told before the root's head is resolved, and
# `Go()` at the result's root leaves the subject's `x` unread, at the subject, outside the spelling.
