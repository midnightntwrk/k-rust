# The expected outcome of every class-test case (`krs_test_support::class_matrix`), in three parts.
# The schema and how a case is decided are documented in `class_matrix::table`.
#
# 1. Mistake classes: one registered author code each. A class names an author mistake, not a site;
#    `proposed = true` marks a code its step has yet to register, so every case of it is red.
#    `advice = "ID"` names the case that writes the form the class's refusal advises writing
#    instead (`class_matrix::advice`), which this table must accept and K8 judges.
# 2. Refusal rules: a glob over case IDs, the class of the mistake the matched cases make, and the
#    range the error must lie inside (entry, spelling, item, or header). The most specific entry
#    that covers a case decides it; two entries of which neither is more specific are a tie. Here
#    the rules are disjoint, one per class and slot group.
# 3. Accepted cases with the K sentences each adds to its base, normalized: written by the record
#    mode (`scripts/krs-class.sh --record`) and reviewed as a diff, never by hand. An entry without
#    `k` is a case that should be accepted and is refused today. `same_k_as` names the cases whose
#    documented equal spelling must emit the same normalized K.
#
# The term families (`terms/..`, `import/..`, `notation/..`) are judged by the oracle
# (`class_matrix::oracle`) first, from each case's position and its construct's nodes, so no rule
# here refuses a term case for where its construct stands; the attribute axis (`attrs/..`) by the
# attribute oracle (`class_matrix::attributes`), from each case's form and attribute. For such a
# case:
# 1. a refusal the oracle tells from the spelling and its position decides, at the spelling (at the
#    entry when the refused construct is the outer one a depth-2 case's construct stands in);
# 2. otherwise the most specific refusal rule decides: the rules left for these families name a
#    term's sort and names (`condition-sort`, `let-sort`, `unbound-name`, `record-update-base`,
#    `binder-sort`, `list-notation-sort`, `matches-pattern-binder`, ..), never its position;
# 3. otherwise a refusal the oracle tells by what a path resolves to or an operand's sort decides,
#    at the spelling or the outer construct's entry (a name or sort mistake is met first);
# 4. otherwise the case is accepted, and its accept entry records its K. An accept entry of a
#    refused term case is a table error.
#
# How a cell entry's outcome is decided (design S5, the principles P0-P7): in four steps, each
# answered by the first layer that can know it: the form (what the spelling and its side alone
# refuse: `_` in a result or an initializer, `None` or a rest in an initializer), the kind (the
# entry's marks against the cell's declared layers, outermost first), the pairing of the two sides
# (rests, absence, an entry that constrains nothing), and the sort (the lattice). The rule-level
# classes (`group-and-descendant`, `always-enabled-rule`, `rule-changes-no-cell`,
# `unused-configuration-variable`, `main-cell-not-k`) judge the whole sentence after its entries
# are admitted. The cells oracle (`class_matrix::cells_oracle`) states the first three from the
# principles; `tests/cells_oracle.rs` checks every cell-entry row against it, and
# `[cell-exception."GLOB"]` lists the rows that depart from it, each with the principle it departs
# by.
#
# How a case's outcome is decided, from what its construct means in its slot:
# - A spelling that belongs to one kind of cell (`Some`/`None`, an instance list, map notation,
#   brackets) written on a cell of another kind is that kind's mistake (`presence-on-plain-cell`,
#   `instances-on-plain-cell`, `map-notation-at-non-map`, `bracket-reading`).
# - A spelling that belongs to no kind (a binder, `_`, a literal, a record) on a cell whose kind
#   has a spelling of its own (the computation cell's sequence, an optional cell's `Some`/`None`,
#   a collection's instance list, a `cells!` wrapper) is that cell's mistake (`cell-wrapper`,
#   `optional-without-presence`, `collection-without-instances`).
# - Otherwise the term itself decides: its sort against the cell's (`content-sort`, `binder-sort`),
#   and the construct's own placement rules (where `_`, `@`, `|`, `k::matches!`, `let`, islands,
#   predicates and rewrites may stand) before its sort. For a term case, the oracle states the
#   placement rules, per construct.

[class]

[class.absence-test-without-creation]
code = "krs::analysis::optional-presence"
doc = "a subject tests an optional cell's absence (`None`) and the result does not create it: K tests absence only by creating the cell"
examples = ["readable ; subject ; - ; ? leaf Int ; None ; -", "cells ; subject ; - ; ? group G ; None ; -"]
advice = "none"

[class.always-enabled-rule]
code = "krs::analysis::always-enabled-rule"
doc = "a rule whose every subject entry constrains nothing (`_`, `[..]`), with no condition: it matches every configuration, so execution never ends (Q1); judged on the whole rule"
advice = "none"

[class.alias-at-subject-root]
code = "krs::syntax::invalid-pattern-as"
doc = "`name @ pattern` for the whole subject of a fn, a context or a static clause, whose root names the production the sentence is written for: the fn already binds its whole subject (decision D3)"
advice = "terms/sort-rule/subject-root/y @ Cmd::Hold(_)"

[class.alias-in-alias-subject]
code = "krs::expand::irreversible-alias"
doc = "`name @ pattern` in an alias clause's subject, which is also built when a result is printed: the alias prints each term its result matches as its subject, built from the match's bindings, and the pattern's test of the term prints as the conjunction `term #And pattern`, no term (NT-8)"
advice = "terms/desugar/subject/y @ Cmd::Hold(_)"

[class.alias-subject-name-unbound]
code = "krs::expand::irreversible-alias"
doc = "a name an alias clause's subject binds and its result does not use: printing builds the subject from what the result matched, which gives the name no value, so it prints as a variable (NT-8)"
advice = "terms/desugar/subject/y @ Cmd::Hold(_)"

[class.alias-in-let-pattern]
code = "krs::syntax::invalid-let"
doc = "`name @ pattern` in a `let` pattern, which destructures one value that a bare name already names whole"
advice = "terms/rule/guard/let-pattern/Cmd::Hold(x)"

[class.alias-outside-pattern]
code = "krs::syntax::invalid-pattern-as"
doc = "`name @ pattern` (K's `#as`) outside a left-hand side, or in a subject the sentence keeps as it is: a single-body rule's outside its rewrites, and a context's or a context alias's around its hole, which heating matches and cooling puts back, a built term where `#as` cannot stand; a context names the term bare and tests its shape in its guard, and a context alias, which states no guard, writes the pattern alone (NT-28)"
examples = ["readable ; result ; - ; leaf Int ; y @ x ; old", "readable ; result ; - ; leaf List ; [x, r @ ..] ; [y, ..]", "init ; init ; - ; leaf Int ; x @ 0 ; -"]
advice = ["terms/context/guard/k::matches!(x, Cmd::Hold(_))"]

# A compiler class no generated case makes: the term families place their constructs below a
# subject's root, never as alternatives of a whole equation subject.

[class.alternatives-across-equations]
code = "krs::analysis::invalid-pattern-or"
doc = "`A | B` joining whole equation subjects that no one equation matches: alternatives that apply different functions, or that differ in more than one argument, which one equation matches each on its own"
advice = "none"

[class.alternatives-bind-unequally]
code = "krs::syntax::invalid-pattern-or"
doc = "alternatives that do not bind the same names, so a name one binds is unbound when another matches"
advice = "none"

[class.alternatives-in-alias-subject]
code = "krs::expand::irreversible-alias"
doc = "`A | B` in an alias clause's subject, which is also built when a result is printed: it prints as the disjunction `A #Or B`, no term (NT-8)"
advice = "terms/desugar/subject/Cmd::Go() | Cmd::Hold(_)"

[class.alternatives-in-let-pattern]
code = "krs::syntax::invalid-let"
doc = "`A | B` in a `let` pattern, which reads its value by one shape"
advice = "none"

[class.alternatives-in-one-term-rewrite]
code = "krs::analysis::invalid-pattern-or"
doc = "`A | B` in a simplification's or single-body rule's subject, which is rewritten as one term, or in a context's or a context alias's subject, which heating and cooling rewrite around its hole as one term (NT-28)"
advice = "none"

# No generated case makes this mistake alone: outside a pattern, the term family's only `|`
# construct, `Cmd::Go() | Cmd::Hold(_)`, holds a `_`, whose placement is decided first.

[class.alternatives-outside-pattern]
code = "krs::analysis::ambiguous-operator"
doc = "`A | B` in a result, a condition or an initializer, where `|` is the bitwise operator"
advice = "none"

[class.anonymous-rest-in-map-literal]
code = "krs::syntax::invalid-expression-notation"
doc = "an anonymous `..` in a `map![..]` that is a literal, not lexically a content root (P6), the spellings of its examples: in a readable record at a configuration position (a cell's content, a record's, `Some(..)`'s, brackets' or braces' child), which writes a map's root as `{ k -> v, .. }` (in a subject's term, below a call's argument, it is a map pattern, MAP-PARAM-PATTERN), and in a `cells!` result where the map is no cell entry's content, below a content root, in a term (a list's element, a constructor's or a call's argument), or at an entry's head without its leaf's `Cell(..)`: a literal's entries are written over the map its rest names, and `..` names none (NT-19). A cell entry's content is a content root, judged by its kind and pairing: `Cell(..)`'s argument (S5.0g pattern review P-R2), and the direct value of a field of a group record, an instance record or a fragment at a configuration position, which P1 makes its child's entry (the fixes review's F-1)"
examples = ["readable ; subject ; - ; leaf Map ; map![y -> x, ..] ; -", "cells ; result ; - ; leaf Map ; k::map![y -> x, ..] ; k::configuration::Cell(k::map![z -> y, ..])", "cells ; result ; - ; group H ; k::fragment![crate::H { l: [k::map![y -> x, ..]], b: 0 }] ; k::fragment![crate::H { l: [y, ..], .. }]"]
advice = "readable-run/subject/bag/{ Obj { key: 1, m: { 1 -> 2, .. } }, .. }"

[class.anywhere-outside-term-rule]
code = "krs::syntax::invalid-rule-key"
doc = "`anywhere` on a sentence that is no term-shaped transition, or on a `for Sort` clause: it makes a transition rewrite its subject's root application wherever it occurs, which a configuration-shaped rule (it matches cells, which occur only at their place), a `for Sort` clause (its header anchors it at the head of the computation cell), a function's equation (which applies wherever its application occurs already) and the other forms do not have"
advice = "none"

[class.binder-bound-twice]
code = "krs::syntax::invalid-pattern-as"
doc = "a name bound twice in one pattern: an alias inside its own subpattern"
advice = "none"

[class.binder-sort]
code = "krs::analysis::incompatible-binder"
doc = "a binder of one sort written where a sort it is not below is needed"
advice = "cells/subject/pc/k::configuration::Cell(x)"

[class.bracket-reading]
code = "krs::analysis::invalid-list-notation"
doc = "brackets on a cell they denote nothing in: one with no layer brackets mark (no computation, list leaf or List collection) and no instance layer (on a Set or Map collection brackets are the instance mark of the wrong order, `instance-list-shape`), or an initializer's template, whose instance layer is not written (P5); or elements that are none of its items, elements or instances"
examples = ["readable ; subject ; - ; leaf Int ; [x, ..] ; -", "readable ; subject ; - ; group G ; [x] ; -", "cells ; subject ; - ; leaf Map ; k::configuration::Cell([x, ..]) ; -", "init ; init ; - ; * Set of G ; [0] ; -"]
advice = "none"

[class.cell-wrapper]
code = "krs::analysis::cell-wrapper"
doc = "an entry whose wrapper is not its cell's, the spellings of its examples: the computation's wrapper, or a `cells!` leaf's `Cell(..)`, on a cell where no layer has it (P3b; on an optional cell or a collection too, design ruling 6 withdrawn); or a value where the computation's or a `cells!` leaf's wrapper is missing (P3c), where its inside passes form and kind (P3). Readable brackets are not this class's off the computation: they are the List leaf's or the List collection's mark, `bracket-reading` or `instance-list-shape` elsewhere"
examples = ["readable ; subject ; - ; computation ; x ; -", "cells ; subject ; - ; leaf Int ; x ; -", "cells ; subject ; - ; leaf Int ; k::configuration::KCell(x, ..) ; -", "cells ; subject ; - ; * List of G ; k::configuration::Cell(x) ; -", "cells ; subject ; - ; ? leaf Int ; k::configuration::KCell(x, ..) ; -", "init ; init ; - ; computation ; 0 ; -"]
# A `cells!` refusal advises the spelling of the cell's own kind, its marks outermost first (P2):
# `Cell(..)`, `KCell(..)`, `Some(..)`, instance records in brackets or braces, a group's record.
advice = ["cells/subject/pc/k::configuration::Cell(x)", "cells/result/counter/Some(k::configuration::Cell(x))", "cells/subject/job/[k::fragment![crate::Job { payload: x, .. }], instances0 @ ..]", "cells/shorthand/kinds/bag/{ k::fragment![crate::Obj { key, .. }], .. }", "sweep/cells/result/c08-ohcell/Some(k::fragment![crate::Ho { ohl: [x], ohb: 0 }])"]

[class.claim-only-term]
code = "krs::expand::claim-only-term"
doc = "a claim-only island (`k::or_bool!`) outside a claim"
advice = "none"

[class.claim-subject-only-term]
code = "krs::expand::claim-subject-only-term"
doc = "`k::anonymous!` outside a claim's subject"
advice = "none"

[class.collection-element-sort]
code = "krs::analysis::collection-element-sort"
doc = "an element, key or value of a typed collection whose sort is not below the declared one"
advice = "none"

[class.collection-overwrite]
code = "krs::analysis::collection-entry"
doc = "a result entry over a `*` collection the subject does not match (`acct: { Gm { ma: x, mb: y } }`, `job: [x]`), which replaces every instance the collection holds, whatever it holds: not supported yet; the rule matches the instances it replaces in its pattern instead"
advice = "none"

[class.collection-rest-dropped]
code = "krs::analysis::collection-entry"
doc = "a pattern that names a collection's other instances (`job: [x, r @ ..]`) and a result that does not put them back with `..r` (`job: []`), which removes them: not supported yet; the Semantic IR's collection clause frames the other instances or holds none"
advice = "none"

[class.collection-without-instances]
code = "krs::analysis::collection-entry"
doc = "a `*` collection written without its instance list, the spellings of its examples, where the entry's inside passes form and kind against the instance group (P3c, with P3's reason at every depth: otherwise the inside's own refusal is named, S5.0g pattern review P-R5); or a rule's or claim's entry naming a cell below a `*` ancestor (S1 b, the rule forms'; an initializer, a struct literal of the configuration, names no cell by a path), where no single cell has the content it names, other than the leading Map collections of its path, whose one instance the rule matches as a rule for the instance's group does (IC-5; a function context and a context alias judge those too): name the instance with an instance record, `account: { Account { balance: .., .. }, .. }` (S1 b)"
examples = ["readable ; subject ; - ; * List of G ; x ; -", "readable ; subject ; - ; * Set of G ; _ ; -", "readable ; subject ; - ; * Map of G ; 0 ; -", "readable ; subject ; - ; * List of G ; G { a: x, .. } ; -", "readable ; subject ; * ; leaf Int ; x ; -", "cells ; result ; * ; leaf Int ; k::configuration::Cell(x) ; k::configuration::Cell(old)"]
# A `cells!` result's path refusal below `*` advises the update of the instance the subject names
# (P-R6): `{ me @ k::fragment![T { .. }], .. }` => `{ k::fragment![T { child: v, ..me }], .. }`.
# A kind refusal advises the cell's own instance list, an advised case per collection's form.
advice = ["cells/g4-b/kinds/account/{ k::fragment![crate::Acct { aframe: Ag { aa: x }, ..me }], ..instances0 }", "readable/subject/job/[Job { payload: x, .. }, ..]", "claim/subject/kinds/bag/{ Obj { key: x, .. }, .. }", "claim/g4-a/kinds/account/{ Acct { id: x, aframe: Ag { aa: x }, .. }, .. }", "cells/subject/job/[k::fragment![crate::Job { payload: x, .. }], instances0 @ ..]", "cells-run/subject/bag/{ k::fragment![crate::Obj { key: 1, m: k::map![1 -> 2, ..] }], instances0 @ .. }", "cells/g4-a/kinds/account/{ k::fragment![crate::Acct { id: x, aframe: Ag { aa: x }, .. }], ..instances0 }", "sweep/claim/result/job/[..]", "sweep/claim/result/acct/{ Gm { ma: x, .. }, .. }", "sweep/claim/result/bag/{ Gs { sa: x, .. }, .. }"]

[class.continuation-in-readable]
code = "krs::analysis::continuation-in-readable"
doc = "a readable entry that captures or drops the computation's continuation (a named rest, `k: [x, rest @ ..]`, or a splice): a readable rule never does (Q3); `cells!` writes it with `KCell(.., rest @ ..)`"
examples = ["readable ; subject ; - ; computation ; [x, r @ ..] ; -", "readable ; result ; - ; computation ; [x, ..r] ; [y, r @ ..]", "readable ; result ; - ; computation ; [x] ; -"]
advice = "none"

[class.computation-back-item]
code = "krs::collect::invalid-configuration"
doc = "an item after the rest of the computation cell, in any form, the spellings of its examples: the computation is read from its front, where the next step is, so `..` ends it (E1, stated of the computation and so of every form: P3 is one judgement in every form); the computation mark's own shape, so it is refused before pairing and stands under a path"
examples = ["readable ; subject ; - ; computation ; [.., x] ; -", "readable ; result ; - ; computation ; [x, .., y] ; [y, ..]", "cells ; subject ; - ; computation ; k::configuration::KCell(.., x) ; -", "cells ; result ; - ; computation ; k::configuration::KCell(x, .., y) ; k::configuration::KCell(y, ..)", "cells ; subject ; ? ; computation ; k::configuration::KCell(.., x) ; -"]
advice = "none"

[class.computation-brackets-per-rule]
code = "krs::analysis::invalid-list-notation"
doc = "brackets on a second computation cell of a readable record, beside the computation cell whose items the rule's brackets read (`k: [Go(), ..]` and `code: [x, ..]`): a rule reads one computation cell's items, so the second one's are not supported yet; a `k::cells!` rule matches both with `KCell(..)`, and a rule that brackets only the other cell reads it as its computation cell"
advice = "none"

[class.cons-list-back-item]
code = "krs::analysis::invalid-list-notation"
doc = "an item after a cons list's rest (`[.., x]`, `[x, .., y]`, a result's `[..rest, x]`) on a cell whose sort is a cons list, in any form: a cons list is a constructor term built from its front, `x : rest`, so its back is no constructor pattern and, with no append declared, builds no term (P0, P2); the leaf mark's own shape, so it is refused before pairing and stands under a path"
examples = ["readable ; subject ; - ; leaf Cons ; [.., x] ; -", "readable ; subject ; - ; leaf Cons ; [x, .., y] ; -", "readable ; result ; - ; leaf Cons ; [..r, x] ; [y, r @ ..]", "readable ; result ; - ; leaf Cons ; [.., x] ; -", "readable ; subject ; ? ; leaf Cons ; [.., x] ; -", "cells ; subject ; - ; leaf Cons ; k::configuration::Cell([.., x]) ; -"]
advice = "none"

[class.collection-in-static-subject]
code = "krs::analysis::collection-in-static-subject"
doc = "a collection of two or more parts below an alias's or a desugar's subject root, a set's or a list's concatenation (`set::concat(a, b)`, `[x, ..]`, `[1, 2]`) or a map of several entries: static expansion matches it as written, without reordering a set's parts or regrouping a list's (`[1, 2, 3]` misses `list::concat([1, 2], [3])`), so it stands for one of its spellings rather than for the collection; told by its head (NT-14)"
advice = "terms/desugar/subject/k::builtin::set::item(x)"

[class.condition-on-static-clause]
code = "krs::syntax::invalid-rule-key"
doc = "`#[k::requires]` on a static clause, which rewrites every application of its production as a term is read, unconditionally: no condition is tested there"
advice = "none"

[class.condition-sort]
code = "krs::analysis::invalid-term"
doc = "a `#[k::requires]` condition that is not a Bool term"
advice = "none"

[class.constant-applies-function]
code = "krs::analysis::invalid-constant"
doc = "a `#[k::constant]` value that applies a function"
advice = "none"

[class.constant-not-ground]
code = "krs::syntax::invalid-constant"
doc = "a `#[k::constant]` value that is no ground constructor term"
advice = "none"

[class.configuration-variable-sort]
code = "krs::analysis::invalid-term"
doc = "a configuration variable, which stands for the value given at startup as a term of its declared sort and is never narrowed, where a sort it is not below is needed (an operator's or a builtin's `Int` or `Bool` operand): declare the parameter at that sort (`x: Int`), or narrow the read with `k::project!(Int, x)`"
advice = "terms/init/variable-item/k::project!(Int, x)"

[class.content-sort]
code = "krs::analysis::invalid-term"
doc = "a term whose sort is not below the sort of the cell or position it fills"
advice = "terms/init/variable-item/k::project!(Int, x)"

[class.context-hole-unbound]
code = "krs::analysis::invalid-context"
doc = "a context whose pattern does not bind the hole its `hole = x` names: K requires exactly one HOLE"
advice = "none"

[class.context-rewrite-not-hole]
code = "krs::analysis::invalid-context"
doc = "a context's `k::rewrite!` of anything but its hole: K requires HOLE => a term containing HOLE"
advice = "none"

[class.desugar-wildcard-undeclared]
code = "krs::syntax::unsupported-term-expression"
doc = "`_` in a desugar clause's result that its `unbound_variables` does not list"
advice = "none"

[class.duplicate-key]
code = "krs::syntax::duplicate-argument"
doc = "a key written twice in one attribute"
advice = "none"

[class.equation-root-not-function]
code = "krs::analysis::subject-root-not-function"
doc = "a constructor, a literal or a builtin operation at the root of an equation's subject, which is the application of the function the equation defines: a value defines no function"
advice = ["terms/simplification/subject-root/k::builtin::int::add(1, 2)", "terms/rule/subject-root/Cmd::Hold(x)"]

[class.evaluation-key-without-evaluation]
code = "krs::syntax::invalid-rule-key"
doc = "`result = S`, the sort a heated hole's evaluation ends in, on a sentence that heats nothing: no heating or cooling rule, context or context alias"
advice = "attrs/{form}/heat, hole = x, result = Word"

[class.existential-outside-step]
code = "krs::expand::existential-placement"
doc = "`#[k::ensures]` or `#[k::exists]`, which state what a step's result satisfies and which of its values are existential, on a sentence that reaches no result state: an equation, a simplification, a static clause, a context; or `#[k::exists]` on an `anywhere` rule of either form, which replaces an application in place by the one term its result writes, as an equation gives an application its value, so that no value of its result is existential"
advice = "none"

[class.fixed-cells-only]
code = "krs::expand::cell-collection-placement"
doc = "a `?` cell's `Some(..)` or a collection's instance list, with or without a named rest, in a context alias or an equation's function context (`counter: Some(Cell(x))`, `bag: { k::fragment![Obj { .. }], .. }`): it means there what it means in a rule's subject, the present cell or the instances it names, matched and kept, but those sentences' lowerings read fixed cells only, so it is not supported yet; a `#[k::context]` over `k::cells!`, lowered as a rule's subject is, admits it"
advice = "none"

[class.fragment-in-initializer]
code = "krs::expand::initializer-fragment"
doc = "`k::fragment!` in an initializer, which builds nested cells with their structs"
advice = "none"

[class.fresh-outside-step]
code = "krs::expand::fresh-placement"
doc = "`#[k::fresh]`, a value a transition step draws, on a sentence that is no transition: a claim, an equation, a simplification, a static clause, a context, a context alias; or on an `anywhere` rule of either form, which replaces an application in place by the one term its result writes and takes no step that draws one"
advice = "none"

[class.function-in-pattern]
code = "krs::analysis::function-in-pattern"
doc = "a function application at a matched position of a rewrite rule's, an equation's or a context's pattern, or of a `let` or `k::matches!` pattern, a slot's root as below it, a collection's value or element included, other than an equation's subject root (the function it defines) and a map key or a set element, which is computed and looked up: a pattern matches terms as written, and an application is evaluated; or a function application (a collection literal that builds, an index or a method included) below an alias's or a desugar's subject root, which static expansion matches against a program's terms as written, before anything evaluates, so the application would stand for its spelling rather than its value (decision NT-11-5); or a collection's unit, a set's singleton or a concatenation (`set::item(x)`, `set![]`, `map![]`, `set::concat(..)`) as the whole subject of a `#[k::rule]` fn or a context, where it is the application of the collection's function (`SetItem`, `.Set`, `.Map`): a rule rooted at a function is that function's equation, and a context is rooted at the production it heats (decision NT-11-2)"
advice = ["notation/rule/guard/k::builtin::map::empty()[x]", "terms/simplification/subject/k::builtin::int::add(x, 1)", "terms/equation/subject/x", "readable/subject/env/{ y -> x, .. }"]

[class.group-and-descendant]
code = "krs::analysis::group-and-descendant"
doc = "a rule or claim whose entries, on either side, name a group (or a collection) and a cell below it: an entry denotes the content of one cell, so the group's entry already names the cell below it, and the two denote overlapping content (P1); judged on the whole rule"
advice = "none"

[class.helper-on-constant]
code = "krs::syntax::invalid-constant"
doc = "a sentence's helper attribute (`#[k::requires]`, `#[k::ensures]`, `#[k::exists]`, `#[k::fresh]`) on a `#[k::constant]`, which declares a value and applies to nothing"
advice = "none"

[class.helper-on-context-alias]
code = "krs::expand::orphan-helper"
doc = "a rule's or a claim's helper (`#[k::requires]`, `#[k::ensures]`, `#[k::exists]`) on a `#[k::context_alias]`, which names the configuration around a strict argument and applies to nothing"
advice = "none"

[class.helper-on-initializer]
code = "krs::syntax::unsupported-initializer-signature"
doc = "a sentence's helper attribute on a `#[k::init]` initializer, which declares the initial configuration and applies to nothing"
advice = "none"

[class.helper-on-shorthand]
code = "krs::syntax::invalid-function-shorthand"
doc = "`#[k::ensures]`, `#[k::exists]`, `#[k::fresh]` or `#[k::priority]` on a function shorthand, whose one equation reaches no result state, draws no value and is ordered by no such key"
advice = "none"

[class.helper-on-table-row]
code = "krs::syntax::invalid-equation-table"
doc = "`#[k::ensures]`, `#[k::exists]`, `#[k::fresh]` or `#[k::priority]` on a `k::equations!` row, an equation, which reaches no result state, draws no value and is ordered by `#[k::equation(..)]`"
advice = "none"

[class.initializer-remainder]
code = "krs::syntax::unsupported-initializer-body"
doc = "an anonymous rest (`..`) in an initializer's value, `k::k![x, ..]` or `[0, ..]`: its value is complete (P5); and, a stated exception (E3), a configuration variable spliced into its `k::k![..]` (`k::k![x, ..pgm]`): an item-sorted variable is an item, which `k::k![x, pgm]` writes. A map base, `k::map![k -> v, ..env]`, is an update and stays (P5)"
examples = ["init ; init ; - ; computation ; k::k![Cmd::Go(), ..] ; -", "init ; init ; - ; leaf List ; [0, ..] ; -"]
advice = "init/k/k::k![pgm]"

[class.instance-child-multiplicity]
code = "krs::analysis::collection-entry"
doc = "an instance record naming a child that is a `?` cell, its presence or absence (`acounter: Some(y)`, `acounter: None`), or a group child's `*` collection (`aqueue: Aqueue { ajob: [Ajob { apay: y }, ..] }`): inside one instance it means whether, or which, cells that instance holds there (P1, P2), and no lowering writes it; not supported yet, said at the child"
advice = "none"

[class.instance-beside-outer-cell]
code = "krs::analysis::collection-entry"
doc = "a rule whose cells lie both inside a Map collection's instance, named at the record's level (`apc` of one account, beside the top-level `k`), and outside every instance: it would match the outer cell beside one instance, which K states, but writing the instance's clauses beside an outer one is not supported yet (IC finding 1), said at the outer cell; the instance is matched through its holder's instance list instead"
advice = "none"

[class.instance-list-shape]
code = "krs::analysis::collection-entry"
doc = "an instance list of the wrong shape for its collection's order (P2, P3b): braces on a List collection, or brackets on a Set or Map collection, whatever they hold (value items, rests, instance records: S5.0g pattern review P-R4); a value item other than a name or `_` in an unordered collection's braces (Q2: its instance is chosen by a written record, and a name or `_` is a whole instance, `x @ Decl { .. }`); or, a stated limitation, a List collection rule the product does not lower: one that changes instances at both ends, or keeps a back instance in place (it creates or removes instances at the back, and reads and updates them at the front)"
examples = ["readable ; subject ; - ; * List of G ; { G { a: x, .. }, .. } ; -", "readable ; subject ; - ; * Set of G ; [x, ..] ; -", "readable ; subject ; - ; * Set of G ; [..] ; -", "readable ; subject ; - ; * Map of G ; [G { a: x, .. }, ..] ; -", "readable ; subject ; - ; * Set of G ; { 0, .. } ; -", "cells ; subject ; - ; * Set of G ; [k::fragment![crate::G { a: x, .. }], ..] ; -"]
advice = ["readable/subject/job/[Job { payload: x, .. }, ..]", "claim/subject/kinds/bag/{ Obj { key: x, .. }, .. }", "claim/g4-a/kinds/account/{ Acct { id: x, aframe: Ag { aa: x }, .. }, .. }", "cells/subject/job/[k::fragment![crate::Job { payload: x, .. }], instances0 @ ..]", "cells-run/subject/bag/{ k::fragment![crate::Obj { key: 1, m: k::map![1 -> 2, ..] }], instances0 @ .. }", "sweep/claim/result/job/[..]", "sweep/claim/result/acct/{ Gm { ma: x, .. }, .. }", "sweep/claim/result/bag/{ Gs { sa: x, .. }, .. }"]

[class.instance-update-base-elsewhere]
code = "krs::analysis::invalid-record-update"
doc = "a readable instance update whose label names a record of the instance's constructor matched in another cell (`stack: [me @ Acct { id: z, .. }, ..]`, then `account: { Acct { aframe: Ag { aa: x }, ..me }, .. }`): it creates an instance taking that record's other fields, which is not supported yet; `..me` updates the instance its own cell's instance list labels `me @`"
advice = "none"

[class.instances-on-plain-cell]
code = "krs::analysis::collection-entry"
doc = "an instance list on a cell that is no `*` collection, the spellings of its examples: readable instance braces, or a `cells!` instance list or set (P3b). Readable brackets there are no instance list: they are `bracket-reading`, or the computation's or a list leaf's own mark"
examples = ["readable ; subject ; - ; leaf Int ; { G { a: x, .. }, .. } ; -", "readable ; subject ; - ; leaf Set ; { G { a: x, .. }, .. } ; -", "cells ; subject ; - ; group G ; [k::fragment![crate::G { a: x, .. }], ..] ; -"]
advice = "none"

[class.island-at-subject-root]
code = "krs::syntax::unsupported-rule-pattern"
doc = "a compiler-owned island (`k::fragment!`, `k::bytes!`, `k::is!`, `k::matches!`, ..) for the whole subject of a fn, a context or a static clause, whose root names the production the sentence is written for, which the island does not (decision D3)"
advice = "terms/sort-rule/subject-root/k::bytes!(b\"ab\")"

[class.key-value-shape]
code = "krs::syntax::invalid-argument-value"
doc = "a key whose value has another shape than the key takes: a string where an integer is, an integer where a string or a name is, a value on a bare flag, an empty list"
advice = "attrs/cells-claim/trusted"

[class.keys-together]
code = "krs::syntax::invalid-rule-key"
doc = "keys that cannot stand on one sentence: `owise` and `priority`, `heat` and `cool`, `anywhere` or a heating or cooling step with an order, `circularity` on a one-path or trusted claim"
advice = "attrs/rule/heat, hole = x"

[class.let-outside-term]
code = "krs::expand::let-outside-term"
doc = "a `let` block (K's `#let`) in a pattern outside a key or a set's element that a pattern over evaluated terms computes and looks up (in a key that selects by matching, a Map collection's instance, a simplification's or a static clause's subject), on either notation: it applies a function generated for it alone, which no matched term holds"
advice = "none"

[class.let-sort]
code = "krs::analysis::invalid-let"
doc = "a `let` block whose names or result have no sort its position admits"
advice = "none"

[class.list-notation-sort]
code = "krs::analysis::invalid-list-notation"
doc = "list brackets at a position whose sort is no list (a `KItem` hole), so they name no list"
advice = "none"

[class.main-cell-ambiguous]
code = "krs::analysis::main-cell"
doc = "a configuration with several `KSequence` cells of which more than one reads the `main` variable (`prog: k::k![pgm]` beside `k: k::k![pgm]`): the main cell is the `KSequence` cell that reads it, and a cell's name plays no part (P1), so two readers do not say which one is the computation (S5-M1)"
advice = "init/main-k/k/k::k![pgm]"

[class.main-cell-not-k]
code = "krs::analysis::main-cell"
doc = "a cell named `k` that is not the configuration's main cell (the `KSequence` cell that holds the program): K takes the cell named `k` as the computation cell by its name, so the definition would run its cell-free sentences in another cell than its initializer states"
advice = "init/main-k/k/k::k![pgm]"

[class.map-collection-key]
code = "krs::analysis::map-collection-key"
doc = "a Map collection's instance that does not keep its key, its first child, which is its identity, written at creation and never changed by an update (§7): a created instance that does not write it (a bare `..` takes the template's fields, which state no identity, P5), or an instance update (`..me`) that writes it as anything but what is provably the key the subject matched (another literal, another name, a computed value, or a key the labelled instance does not name); written as the subject's own key binder, or as the same literal it matched, it is unchanged (P0)"
examples = ["readable ; result ; - ; * Map of G ; { G { b: x, .. }, .. } ; { G { a: y, .. }, .. }", "readable ; result ; - ; * Map of A ; { A { id: 5, ..me }, .. } ; { me @ A { id: z, .. }, .. }"]
# A created instance's refusal advises writing its key child (`id: ..`), which each advised case
# writes for one Map collection's key; an update's advises in prose (keep or leave out the key).
advice = ["claim/g4-a/kinds/account/{ Acct { id: x, aframe: Ag { aa: x }, .. }, .. }", "claim/subject/kinds/bag/{ Obj { key: x, .. }, .. }", "sweep/cells/result/c23-acc/{ k::fragment![crate::A { aid: 5, .. }], .. }", "sweep/cells/result/acct/{ k::fragment![crate::Gm { ma: x, .. }], .. }"]

[class.map-notation-at-non-map]
code = "krs::analysis::invalid-term"
doc = "map notation (`{ k -> v, .. }`, `k::map![..]`) on a cell that is no Map"
examples = ["readable ; subject ; - ; leaf Int ; { y -> x, .. } ; -", "cells ; subject ; - ; leaf List ; k::configuration::Cell(k::map![y -> x, ..]) ; -", "init ; init ; - ; leaf Int ; k::map![0 -> 1] ; -"]
advice = "none"

[class.map-read-in-result]
code = "krs::syntax::rust-syntax"
doc = "a map read `{ k -> v, .. }`, which is a pattern, written in a result"
advice = "none"

[class.map-read-value-binder]
code = "krs::syntax::rust-syntax"
doc = "a readable map read at a record's top level whose value is not a fresh binder: the value names what the entry maps to. A stated limitation of the readable record's top-level route; inside an instance record the map read's value is matched (P5)"
advice = "none"

[class.map-read-value-bound]
code = "krs::syntax::rust-syntax"
doc = "a readable map read whose value names a binder the record binds elsewhere: the read introduces its value's name"
advice = "none"

[class.matches-outside-condition]
code = "krs::expand::matches-outside-condition"
doc = "`k::matches!` (K's `:=K`) in a pattern outside a key or a set's element that a pattern over evaluated terms computes and looks up (in a key that selects by matching, a Map collection's instance, a simplification's or a static clause's subject), on either notation: it applies a function generated for it alone, which no matched term holds"
advice = "none"

[class.matches-pattern-binder]
code = "krs::analysis::invalid-matches"
doc = "a `k::matches!` pattern that rebinds a name the sentence binds (a pattern's name binds, it never compares) or binds a name nothing reads"
advice = "terms/rule/guard/k::matches!(x, Cmd::Hold(_))"

[class.missing-key]
code = "krs::syntax::invalid-rule-key"
doc = "a key without the key it needs: `heat` or `cool` without `hole = x`, `hole` without `heat` or `cool`"
advice = "attrs/rule/heat, hole = x"

[class.ml-in-condition]
code = "krs::analysis::ml-placement"
doc = "a matching-logic predicate in the condition of a transition or equation"
advice = "terms/rule/guard/x == 1"

[class.ml-in-initializer]
code = "krs::expand::ml-placement"
doc = "a matching-logic predicate in an initializer"
advice = "none"

[class.ml-predicate-as-term]
code = "krs::analysis::invalid-ml-predicate"
doc = "a matching-logic predicate as an operand of an object constructor or function"
advice = "none"

[class.nested-anonymous-rest]
code = "krs::syntax::invalid-list-notation"
doc = "a result's anonymous `..` that keeps a list's rest at a content root other than a readable record's top-level cell, a readable instance update's List child (`A { al: [x, ..], ..me }`) and a `cells!` list cell's root brackets (`Cell([x, ..])`, `Cell([..])`): a group record's child (`H { hl: [x, ..], hb: 0 }`), an instance's `k` child (`T { tk: [x, ..], ..me }`), a fragment's child, inside a readable `Some([..])` (but over the subject's `Some([..])`, which keeps the present cell); not supported yet, the rest is named there, `rest @ ..` in the pattern and `..rest` in the result"
advice = "none"

[class.never-cools]
code = "krs::analysis::never-cools"
doc = "a lint, never a refusal: a context, or a position of a strict production, heats its hole while it is no result and cools it once it is a result of the step's sort `R` (`result = R` on the context, the strictness or the context alias the position is evaluated through, `KResult` otherwise); both steps match the hole at its sort `H`, so where no sort that has terms is below both `H` and `R` nothing the heating moves is ever plugged back, and a run that reaches it stays under the freezer; `krs check` reports it as a warning at the context's `hole` key or at the strict position"
examples = ["attrs/context/hole of sort Word", "attrs/context/hole of sort Int with result = Word", "attrs/context/strict position of sort Word"]
advice = "none"

[class.no-effect-entry]
code = "krs::analysis::no-effect-entry"
doc = "a lint, never a refusal (Q1): a subject entry that matches every content its cell allows and binds nothing (`_`, `[..]`, `Cell(_)`, a group record whose children do), on a cell the result leaves out or in a pattern the sentence keeps (a context, a context alias, a function context), so the sentence is the same without it; `krs check` reports it as a warning at the entry"
examples = ["readable ; subject ; - ; leaf Int ; _ ; -", "readable ; subject ; - ; leaf List ; [..] ; -", "readable ; subject ; - ; group G ; G { .. } ; -", "cells ; subject ; - ; leaf Int ; k::configuration::Cell(_) ; -"]
advice = "none"

[class.nondet-on-function]
code = "krs::syntax::invalid-rule-key"
doc = "`nondet = g` on a function's equation or a simplification: a function is deterministic, so its equations are never chosen among"
advice = "none"

[class.none-in-initializer]
code = "krs::syntax::unsupported-initializer-body"
doc = "`None` as an initial value: K needs a template for every cell, so an optional cell that starts absent is written `k::absent!(template)` (decision NT-12-6)"
examples = ["init ; init ; - ; ? leaf Int ; None ; -"]
advice = "init/counter/k::absent!(0)"

[class.notation-in-pattern]
code = "krs::syntax::invalid-expression-notation"
doc = "a notation form (an operator, `&&`, `||`, `!`, a method call) where a pattern is read: it denotes a builtin application but is no pattern, so a pattern spells the call"
advice = "terms/simplification/subject/k::builtin::int::add(x, 1)"

[class.object-term-as-predicate]
code = "krs::analysis::invalid-ml-predicate"
doc = "an object term where a predicate is expected: a quantifier's body is a predicate, and an object Bool enters matching logic as `ml::equals(true, b)`"
advice = "none"

[class.open-record-in-alias-subject]
code = "krs::expand::irreversible-alias"
doc = "an open record `Ctor { f: p, .. }` in an alias clause's subject, which is also built when a result is printed: the fields `..` leaves open have no value from the result's match and print as variables (NT-8)"
advice = "terms/desugar/subject/Cmd::Pair { a: x, .. }"

[class.open-record-outside-pattern]
code = "krs::syntax::invalid-record-update"
doc = "an open record (`Ctor { f: e, .. }`) in a built term or a condition, which has no value for the fields `..` leaves open: only a pattern leaves fields unconstrained"
examples = ["readable ; result ; - ; leaf List ; [G { a: x, .. }, ..] ; [y, ..]", "readable ; result ; - ; group G ; G { a: x, .. } ; G { a: y, .. }", "readable ; result ; - ; ? leaf Int ; Some(G { .. }) ; Some(old)"]
advice = "none"

[class.optional-group-defaults]
code = "krs::analysis::invalid-term"
doc = "a result that creates a `?` group with a record that leaves its other children to template defaults (`ogroup: Some(Gp { pa: x, .. })` over `None`, and its `cells!` fragment): not supported yet; a rule writes a `?` group as a whole group term, which names every child or takes them from a matched group"
advice = "none"

[class.optional-without-presence]
code = "krs::analysis::optional-presence"
doc = "an optional (`?`) cell written without its presence (`Some(..)`/`None`; in an initializer, `Some(..)`/`k::absent!(..)`), the spellings of its examples, where the entry's inside passes form and kind against the underlying kind (P3c, with P3's reason at every depth: otherwise the inside's own refusal is named, S5.0g pattern review P-R5); or a rule's or claim's entry naming a cell below a `?` ancestor (S1 b, the rule forms'; an initializer names no cell by a path), which would silently require it present: write it inside `Some(G { child: .., .. })` (S1 b)"
examples = ["readable ; subject ; - ; ? leaf Int ; x ; -", "readable ; subject ; - ; ? group G ; G { a: x, .. } ; -", "cells ; subject ; - ; ? leaf Int ; k::configuration::Cell(x) ; -", "init ; init ; - ; ? leaf Int ; 0 ; -", "readable ; subject ; ? ; leaf Int ; x ; -"]
advice = "cells/result/counter/Some(k::configuration::Cell(x))"

[class.order-on-unordered-sentence]
code = "krs::syntax::invalid-rule-key"
doc = "`owise`, `priority = N` or `nondet = g` on a sentence that is chosen against no other: a claim, which is proved, a context or a context alias, ordered by its hole, and a static clause, whose production's clauses expand each application into one term and so may not overlap"
advice = "none"

[class.owise-on-simplification]
code = "krs::syntax::invalid-rule-key"
doc = "`owise` on a simplification: a simplification is a lemma a prover may use where it applies, and `owise` says where no other sentence applies, which no prover decides"
advice = "none"

[class.presence-on-plain-cell]
code = "krs::analysis::optional-presence"
doc = "`Some(..)`/`None` (in an initializer, `Some(..)`/`k::absent!(..)`) on a cell that is not `multiplicity = \"?\"`"
examples = ["readable ; subject ; - ; leaf Int ; Some(x) ; -", "cells ; subject ; - ; * List of G ; None ; -", "init ; init ; - ; leaf Int ; k::absent!(0) ; -"]
advice = "none"

[class.priority-range]
code = "krs::syntax::invalid-rule-key"
doc = "a priority outside the range rule priorities are ranked in, `0..=254`"
advice = "none"

[class.redundant-initial]
code = "krs::syntax::invalid-cell-attribute"
doc = "`initial` on an optional (`?`) cell, whose initializer already says whether it starts present: `Some(value)` present, `k::absent!(template)` absent (decision NT-12-6)"
advice = "init/counter/Some(0)"

[class.record-missing-children]
code = "krs::analysis::record-missing-children"
doc = "a group record at a configuration position that names some of its children and no `..`: write `..` to leave the others unconstrained (L4)"
examples = ["readable ; subject ; - ; group G ; G { a: x } ; -", "cells ; subject ; - ; group G ; k::fragment![crate::G { a: x }] ; -", "init ; init ; - ; group G ; G { a: 0 } ; -"]
advice = "none"

[class.record-remainder-in-cells-term]
code = "krs::analysis::invalid-record-update"
doc = "a record update (`Ctor { f: e, ..t }`) or an open record (`Ctor { f: e, .. }`) in a `cells!` cell value, the reference notation, which names every field; an open group record (`k::fragment![crate::G { a: x, .. }]`) only in a result, since a pattern's leaves the group's other children unconstrained (S5-F2); and, judged at pairing, a `cells!` result's group record update (`k::fragment![crate::G { a: x, ..saved }]`) or instance update whose label names no subject instance of its cell (`..me` of a record matched in another cell): Sebastien ruled (2026-11-06) that `cells!` stays explicit, so its one update rewrites in place the instance its subject labels `me @` (R10), and readable keeps `..base` as record notation"
examples = ["cells ; result ; - ; group H ; k::fragment![crate::H { b: x, ..y }] ; _"]
advice = "none"

[class.record-remainder-in-initializer]
code = "krs::expand::initializer-record-update"
doc = "an open record (`Ctor { f: e, .. }`) in an initializer, which builds its record and has no value for the fields `..` leaves open"
advice = "terms/init/variable-item/Cmd::Pair { a: x, ..x }"

[class.record-update-base]
code = "krs::analysis::invalid-record-update"
doc = "a record update (`Ctor { f: e, ..t }`) whose base is no alias `t @ Ctor { .. }` of one record of its constructor matched by the sentence, an instance update `{ T { f: e, ..me }, .. }` whose label `me` the sentence matches nowhere included (S5.0g pattern review P-R3); a value the sentence computes is destructured with a `let` instead, except in a claim, which holds no `let`"
examples = ["readable ; result ; - ; * List of T ; [T { k: [x], ..me }, ..] ; [..]"]
advice = ["terms/{form}/result/{ let Cmd::Pair { a: _, b } = x; Cmd::Pair { a: 1, b } }", "terms/local-rule/subject/rewrite-right/{ let Cmd::Pair { a: _, b } = x; Cmd::Pair { a: 1, b } }"]

[class.record-update-in-pattern]
code = "krs::syntax::invalid-record-update"
doc = "a record update (`Ctor { f: e, ..t }`) in a matched position, which denotes no record by it: `..base` is defined only in a built term, from a matched record"
advice = "none"

[class.recursive-outside-production]
code = "krs::syntax::invalid-rule-key"
doc = "`recursive`, a property of a static production, on a sentence: a static clause, a rule, an equation, a claim, a context"
advice = "attrs/{form}/recursive production"

[class.rest-mismatch]
code = "krs::syntax::invalid-list-notation"
doc = "a `..` rest on one side of a cell only: a result rest the subject's entry did not match, or a subject rest the result drops"
examples = ["readable ; result ; - ; leaf List ; [x] ; [y, ..]", "readable ; result ; - ; leaf List ; [x, ..] ; [y]", "readable ; result ; - ; leaf List ; [x, ..] ; -"]
advice = ["readable/result/job/[..]", "claim/result/job/[..]"]

[class.rest-in-alias-subject]
code = "krs::expand::irreversible-alias"
doc = "a list's anonymous rest `..` in an alias clause's subject, which is also built when a result is printed: the elements it leaves unnamed have no value from the result's match and print as a variable (NT-8); a list of an element and a rest, named or not, is moreover one spelling of the list (`collection-in-static-subject`)"
advice = "terms/desugar/subject/x"

[class.rest-outside-pattern]
code = "krs::syntax::invalid-list-notation"
doc = "an anonymous `..` in list brackets outside a pattern (and outside a list cell's own brackets, whose result keeps what its pattern's `..` matched): a built list has no rest it keeps"
advice = "none"

[class.restriction-binder]
code = "krs::analysis::invalid-match-restriction"
doc = "a `concrete(..)` or `symbolic(..)` list naming a name the equation's subject does not bind"
advice = "none"

[class.restriction-outside-function]
code = "krs::syntax::invalid-rule-key"
doc = "`concrete`, `symbolic` or `smt_lemma` on a sentence that is no equation or simplification: on a transition a restriction leaves the steps it applies to out of a symbolic search, which is unsound, and the other forms apply no function"
advice = "none"

[class.restriction-shape]
code = "krs::syntax::invalid-match-restriction"
doc = "a `concrete` or `symbolic` key of another shape than bare or a list of names: with a value, or with an empty list"
advice = "attrs/equation/concrete"

[class.retired-attribute]
code = "krs::syntax::retired-attribute"
doc = "the retired `#[k::priority(N)]`, which is no attribute any more: an order is a key of the sentence's own marker"
advice = "attrs/{form}/priority = 20"

# A class of the position table (`krs_syntax::positions`) and the oracle that no generated case
# makes: the term families hold no map in a single-body rule's subject.
[class.rewrite-in-map-key]
code = "krs::syntax::invalid-local-rewrite"
doc = "`k::rewrite!` in a map key of a single-body rule's subject: a key is what the map is looked up by, and re-keying an entry may meet a key the map holds"
advice = "none"

[class.rewrite-outside-local-rule]
code = "krs::syntax::invalid-local-rewrite"
doc = "`k::rewrite!` outside the subject of a single-body `#[k::rule]` fn"
advice = "none"

[class.rule-changes-no-cell]
code = "krs::analysis::rule-changes-no-cell"
doc = "a rule that writes no cell; judged on the whole rule"
advice = "none"

[class.simplification-root-not-function]
code = "krs::analysis::subject-root-not-function"
doc = "a constructor, a literal, a collection's unit, element or concatenation, or a collection literal that writes entries (`map![k -> v]`, `set![a, b]`, the collection it builds, whatever calls KRS builds it with; NT-28) at the root of a simplification's subject, which rewrites a function's unevaluated application: a value has nothing to simplify; the update or the union is written as its call"
advice = ["terms/rule/subject-root/Cmd::Hold(x)", "notation/simplification/subject-root/k::builtin::map::update(k::builtin::map::empty(), x, 1)", "notation/simplification/subject-root/k::builtin::set::union(k::builtin::set::item(x), k::builtin::set::item(1))"]

[class.single-body-without-rewrite]
code = "krs::syntax::invalid-local-rewrite"
doc = "a single-body rule whose subject holds no `k::rewrite!`, so the rule changes nothing: a sentence's mistake, not a construct's position"
advice = "terms/local-rule/subject/k::rewrite!(_ => 1)"

[class.smt-lemma-untranslatable]
code = "krs::analysis::smt-lemma-untranslatable"
doc = "`smt_lemma` on an equation or a simplification of a function the solver has no symbol for (no `smtlib` or `smt_hook`), so no lemma about it can be stated to the solver"
advice = "attrs/{form}/smt_lemma of an smtlib function"

[class.sort-test-in-pattern]
code = "krs::analysis::invalid-sort-test"
doc = "`k::is!`/`k::project!`, which apply a generated function, in a matched position over evaluated terms: a rule's or an equation's pattern, or a local pattern; or in an alias's or a desugar's subject, which static expansion matches as written, where the test would stand for its spelling (decision NT-11-5); or in a key a context alias looks up: the projection has a value only where its operand has the sort, which the sentence's condition must require, and an alias states none (NT-28)"
advice = ["cells/subject/pc/k::configuration::Cell(x)", "terms/rule/guard/k::is!(Int, x)", "terms/desugar/subject-typed/x"]

[class.static-result-sort]
code = "krs::analysis::invalid-term"
doc = "a desugar's or an alias's result root whose sort is not below its production's: the clause says the production's application is the result, which a term of another sort cannot be where the production's sort is required"
advice = ["terms/{form}/result-root/x + 1", "terms/{form}/result/x"]

[class.static-clause-root-not-marked]
code = "krs::analysis::invalid-static-clause"
doc = "a desugar or alias clause whose subject's root is no production marked as the clause is (a constructor of an unmarked production, a function, a value): the root is the production the clause expands"
advice = ["terms/alias/subject/1", "terms/desugar/subject/x"]

[class.template-record-update]
code = "krs::syntax::unsupported-initializer-body"
doc = "an initializer's record update `G { a: 0, ..base }` on a group cell or a `*` collection's instance template: not supported yet; a nested cell group's struct literal writes every cell of the group"
advice = "none"

[class.unexpandable-static-application]
code = "krs::analysis::invalid-static-clause"
doc = "an application of an alias or desugar production below a static clause's subject root whose expansion needs a value: a program's application is expanded before the clause is tried, so the clause matches the expansion, which KRS writes in the clause where its arguments are ground, or the production is not recursive and has one clause whose parameters are plain names; otherwise which term the application stands for depends on what a program writes (NT-14)"
advice = "terms/desugar/subject/Cmd::Dn(1)"

[class.overlapping-static-clauses]
code = "krs::analysis::invalid-static-clause"
doc = "two clauses of one alias or desugar production whose subjects some term matches: a static clause takes no `priority` or `owise`, so nothing states which of the two a program's expansion applies to that term, and the definition would apply one by an order the author never wrote (NT-22)"
advice = "terms/desugar/subject-beside/1"

[class.turbofish-instance-sort]
code = "krs::analysis::parametric-instance"
doc = "a turbofish whose instance gives the application a sort its position does not admit"
advice = "none"

[class.unbound-name]
code = "krs::expand::unbound-name"
doc = "a binder that nothing in the sentence or initializer binds, a name a map key or a set element reads only below a function application or another construct that computes it included"
advice = "none"

[class.unbound-variables-outside-desugar]
code = "krs::syntax::invalid-unbound-variables"
doc = "`unbound_variables = [..]`, the names a desugar clause's result leaves to the sentence it is expanded in, on a sentence that is no desugar clause"
advice = "attrs/desugar/unbound_variables = [y]"

[class.unbound-variables-shape]
code = "krs::syntax::invalid-unbound-variables"
doc = "an `unbound_variables` list of another shape than names the result uses and the pattern does not bind: empty, repeated, or naming a bound name"
advice = "none"

[class.unknown-key]
code = "krs::syntax::unknown-argument"
doc = "a key the marker does not take, where no more specific mistake is made: a claim's key elsewhere than on a claim, `heat` or `cool` elsewhere than on a transition, a label on a sentence no label names, a misspelled key, a second name (a context alias is named by its `name`), and any sentence key on a declaration's marker (an initializer's, a constant's, a function shorthand's)"
advice = "none"

[class.unmatched-optional-result]
code = "krs::analysis::optional-presence"
doc = "a result writing an optional (`?`) cell the subject does not match, whose presence the rule does not know (Q1, P5): match it with `Some(..)` or `None`"
examples = ["readable ; result ; - ; ? leaf Int ; Some(x) ; -"]
advice = "none"

[class.unused-configuration-variable]
code = "krs::analysis::unused-configuration-variable"
doc = "an initializer parameter (configuration variable) that no cell reads (X2)"
advice = "none"

[class.wildcard-at-subject-root]
code = "krs::syntax::unsupported-rule-pattern"
doc = "`_` for the whole subject of a fn, a context or a static clause, whose root names the production the sentence is written for (decision D3; a `for Sort` clause's bare-name root says \"any term of the sort\")"
advice = "terms/sort-rule/subject-root/_"

[class.wildcard-in-alias-subject]
code = "krs::expand::irreversible-alias"
doc = "`_` in an alias clause's subject, which is also built when a result is printed: it names no term the result's match gives a value, and prints as a variable (NT-8)"
advice = "terms/desugar/subject/_"

[class.wildcard-outside-pattern]
code = "krs::syntax::unsupported-term-expression"
doc = "`_` in a result, a condition or an initializer"
examples = ["readable ; result ; - ; leaf Int ; _ ; old", "readable ; result ; - ; ? leaf Int ; Some(_) ; Some(old)", "init ; init ; - ; leaf Int ; _ ; -"]
advice = "none"

