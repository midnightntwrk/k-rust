[workspace]
members = [
    "packages/framing",
    "packages/group-board",
    "packages/group-core",
    "packages/group-harts/hart",
    "packages/group-harts/nested",
    "packages/group-harts/opt",
    "packages/group-harts/smp",
    "packages/group-small",
    "packages/groups",
    "packages/objects",
    "packages/optional",
    "packages/queue",
    "packages/set-instances",
    "packages/shared-memory",
    "packages/threads",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
