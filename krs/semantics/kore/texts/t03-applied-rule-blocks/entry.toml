id = "t03-applied-rule-blocks"
kind = "text"
subject = "A rule that applies (its left side matches, its requires is true) with a result that has no value, beside a rule of a larger priority number: whether it blocks that rule."
retro = ["R1", "P6"]
rests_on = ["kk:t05-rule-ensures-result"]

[text]
files = ["t03-applied-rule-blocks.k"]
kompile = "accepts"
frontend = "differs"
frontend_difference = "The manual gives a(0) no successor by the first rule (user_manual.md:1166-1173); the first axiom kompile writes has b(10 /Int X) in its right side (kore.txt:104), empty at X = 0, and read as a rewrite axiom it is false in every model where a(0) in the k cell is an element: as written the text has no model holding a(0), rather than one where a(0) has no successor by that rule."

[ruling]
status = "unsettled"
reason = """
What every reading shares:
(1) At a(0) the first rule's left side matches and it has no requires, so by user_manual.md:1154-1157 nothing stops it from applying; its right side b(10 /Int 0) has no value, division by zero being #False (domains.md:1233-1234) and an application to an argument without a value having none (user_manual.md:2337-2341, a symbol's interpretation extended to sets of arguments).
(2) The transition a rule represents ends in a state RHS #And ENS (user_manual.md:1166-1173). Where that pattern has no value there is no such state, so the first rule gives a(0) no successor. At a(2) the first rule gives b(5), and the second rule, of priority 50 (user_manual.md:1748-1749), is not tried: there every reading gives b(5) alone.
(3) For a result that has no value through the ensures the manual states that the rule is still applied (user_manual.md:1161-1163): that case is kk:t05-rule-ensures-result's, and a rule applied is not one shown not to apply (user_manual.md:1722-1724). No sentence has the right side as its subject.
What the text does not determine:
(4) Whether the first rule blocks the second at a(0). A rule of a larger priority number is tried when those of a smaller one "have been tried and failed" (user_manual.md:1711-1713), "shown not to apply" (user_manual.md:1722-1724). The manual's only "does not apply" is a requires that is not true (user_manual.md:1156-1157); the third check of a transition, that alpha(RHS #And ENS) is satisfiable (user_manual.md:1173), is not said to decide whether the rule applied or failed. The written sentences state no blocking at all: priority is an attribute (kore-syntax.md:222-228), and a rewrite axiom only says what the transition system must do (introduction-to-matching-logic.tex:2146-2148). So the readings below differ at a(0). What the written sentences alone state is in [ruling.kore]."""

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1166-1173 (K 7.1.337)"
quote = "Overall, the transition represented by such a rule is from a state `LHS #And REQ` ending in a state `RHS #And ENS`. When backends apply this rule as a transition/rewrite, they should: - Check if pattern `LHS` matches (or unifies) with the current term, giving substitution `alpha`. - Check if the instantiation `alpha(REQ)` is valid (or satisfiable). - Build the new term `alpha(RHS #And ENS)`, and check if it's satisfiable."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1154-1157 (K 7.1.337)"
quote = "If the requires clause does not evaluate to `true`, then the rule does not apply."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1159-1164 (K 7.1.337)"
quote = "The ensures clause is to be interpreted as a post-condition, and will be automatically added to the path condition if the rule applies. It *may* cause the entire term to become undefined, but the backend will not stop itself from applying the rule in this case."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1711-1713 (K 7.1.337)"
quote = "Very roughly, rules without an attribute indicating their priority apply first, followed by rules with the `owise` attribute only if all the other rules have been tried and failed."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1722-1724 (K 7.1.337)"
quote = "In particular, the second rule above will only be tried after the first rule has been shown not to apply."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1748-1749 (K 7.1.337)"
quote = "a rule with no attributes indicating its priority is assigned the priority 50."

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1233-1234 (K 7.1.337)"
quote = "Compute the quotient `/Int` or modulus `%Int` of two integers using t-division, which rounds towards zero. Division by zero is `#False`."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:2337-2341 (K 7.1.337)"
quote = "In Matching Mu Logic, terms evaluate to sets of values. This is useful for both capturing partiality (as in `3/0`) and capturing non-determinism (as in `3 #Or 5`). Consequently, symbol interpretation is extended to have a collective interpretation over sets of input values."

[[ruling.basis]]
source = "kore-syntax"
locator = "haskell-backend/docs/kore-syntax.md:222-228 (K 7.1.337)"
quote = "The meaning of particular attributes is implementation-defined."

[[ruling.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:2146-2148 (K 7.1.337)"
quote = "Note that \\prule{Axiom A} is a \\emph{positive axiom}, meaning that it merely says what the transition system \\emph{must do}, but not constrains what it \\emph{cannot do}."

[[reading]]
name = "applied-blocks"
statement = "Whether a rule applies is decided by its left side and its requires (user_manual.md:1156-1157); the result is one pattern RHS #And ENS (user_manual.md:1166-1167), and what user_manual.md:1161-1163 says of a result emptied by the ensures holds of one emptied by the right side. The first rule applies at a(0), gives nothing, and the second is not tried."
answer = "a(0) has no successor, and a rule applies to it."
consequence = "A configuration where rules apply and all their results have no value has no successor; it is not one where no rule can be applied (kk:t06-final-configuration)."

[[reading]]
name = "undefined-rhs-does-not-block"
statement = "A rule whose right side has no value under its match has been tried and failed (user_manual.md:1711-1713, the third check of user_manual.md:1173); the next priority is tried. A result emptied by the ensures still applies the rule (user_manual.md:1161-1163)."
answer = "a(0) steps to c(0) alone."
consequence = "The rule of priority 40 makes no difference at a(0); the reading must take an empty right side and an empty ensures apart, which no sentence does or denies."

[ruling.kore]
statement = "Each rule is one rewrite axiom; neither names the other, and the first carries priority 40 as an attribute (kore.txt:99-105, 108-114). The right side of the first holds 10 /Int X (kore.txt:104), which denotes nothing at X = 0. So at that instance the first axiom holds only where its left side has no element: the written sentences have no model in which a(0) in the k cell is an element, and state no blocking of one rule by another."

[[ruling.kore.basis]]
source = "kompiled"
locator = "kore.txt:104-105"
quote = '''Lblb'LParUndsRParUnds'T03-APPLIED-RULE-BLOCKS'Unds'Cmd'Unds'Int{}(Lbl'UndsSlsh'Int'Unds'{}(\dv{SortInt{}}("10"),VarX:SortInt{})) ... priority{}("40")'''

[[ruling.kore.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:1965-1969 (K 7.1.337)"
quote = '''$\overline{\rho}(\varphi) \subseteq \snext_M(\overline{\rho}(\varphi'))$ for any $M$-valuation $\rho$, iff for any $a\in\overline{\rho}(\varphi)$ there is some $b \in \overline{\rho}(\varphi')$ such that $a\mathrel{R_s}b$'''

[[ruling.kore.basis]]
source = "kore-syntax"
locator = "haskell-backend/docs/kore-syntax.md:222-228 (K 7.1.337)"
quote = "The meaning of particular attributes is implementation-defined."

[[note]]
implementation = "kompile"
text = "The same two rules with #Bottom for the right side (kcore-spec fixture e3-ml-rule-rhs-bottom) kompile to the same shape: an axiom whose right side is empty under the k cell, beside one of priority 60."
