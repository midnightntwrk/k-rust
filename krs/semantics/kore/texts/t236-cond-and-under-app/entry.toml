[ruling.kore]
statement = '''The requires is written \equals{Bool,GeneratedTopCell}(f(\and{Int}(X, Y)) ==Int 0, \dv{Bool}("true")) conjoined with the left side go(X, Y) (kore.txt:93-96): the conjunction stands under f, at sort Int, as in the K text. f's equation is written with the premise X0 in X and the right side X -Int 1 (kore.txt:102-116). X and Y are free in the axiom, bound by the left side, so the axiom holds at every valuation of them and states what the ruling states.'''

