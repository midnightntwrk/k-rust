quote = '''Lbl'-LT-'generatedTop'-GT-'{}(Lbl'-LT-'k'-GT-'{}(kseq{}(\and{SortKItem{}}(inj{SortExp{}, SortKItem{}}(VarHOLE:SortExp{}),Var'Unds'Gen0:SortKItem{}),kseq{}(Lbl'Hash'freezerplus0'Unds'{}(kseq{}(inj{SortExp{}, SortKItem{}}(VarK1:SortExp{}),dotk{}())),Var'Unds'DotVar1:SortK{}))),Var'Unds'DotVar0:SortGeneratedCounterCell{}), \equals{SortBool{},SortGeneratedTopCell{}}( Lbl'Unds'andBool'Unds'{}(\dv{SortBool{}}("true"),LblisKResult{}(kseq{}(Var'Unds'Gen0:SortKItem{},dotk{}()))),'''

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1773-1776 (K 7.1.337)"
quote = "The strictness attributes allow defining evaluation strategies without having to explicitly make rules which implement them. This is done by injecting *heating* and *cooling* rules for the subterms. For this to work, you need to define what a *result* is for K, by extending the `KResult` sort."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1785-1797 (K 7.1.337)"
quote = 'This generates two heating rules (where the hole syntaxes `"[]" "+" AExp` and `AExp "+" "[]"` is automatically added to create an evaluation context): ```k rule [addExp1-heat]: <k> HOLE:AExp + AE2:AExp => HOLE ~> [] + AE2 ... </k> [heat] rule [addExp2-heat]: <k> AE1:AExp + HOLE:AExp => HOLE ~> AE1 + [] ... </k> [heat] ``` And two corresponding cooling rules: ```k rule [addExp1-cool]: <k> HOLE:AExp ~> [] + AE2 => HOLE + AE2 ... </k> [cool] rule [addExp2-cool]: <k> HOLE:AExp ~> AE1 + [] => AE1 + HOLE ... </k> [cool]'

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1812-1817 (K 7.1.337)"
quote = "One other thing to note is that in the above sentences, `HOLE` is just a variable, but it has special meaning in the context of sentences with the `heat` or `cool` attribute. In heating or cooling rules, the variable named `HOLE` is considered to be the term being heated or cooled and the compiler will generate `isKResult(HOLE)` and `notBool isKResult(HOLE)` side conditions appropriately to ensure that the backend does not loop infinitely. The module"
