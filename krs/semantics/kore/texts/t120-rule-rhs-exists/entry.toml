id = "t120-rule-rhs-exists"
kind = "text"
subject = "A rewrite rule whose right side holds an existential variable ?Y, constrained by its ensures: what the existential right side states, and the scope of its binder."
retro = ["M1"]

[text]
files = ["t120-rule-rhs-exists.k"]
kompile = "accepts"

[ruling]
status = "settled"
form = "means"
statement = "The rule states that every configuration a(x) has a successor among the configurations d(y) with y > x; it names no particular y, and it does not state that a(x) steps to each of them. ?Y is bound at the top of the right side, so it is no variable of the left side, and the regular variable X is quantified over the whole rule, outside the binder."
reason = '''
(1) A ? variable is existential; in a rewrite rule it is quantified at the top of the right side, and the regular variables are universally quantified on top of the whole rule (user_manual.md:2438-2446). So the rule is: for every x, a(x) => (exists y. d(y) with the ensures y >Int x).
(2) A rewrite axiom \rewrites(L, R) is L -> next R, and a model satisfies it when, at every valuation, every element of L has a successor in R (introduction-to-matching-logic.tex:1965-1970, 1978-1980).
(3) An existential pattern denotes the union, over every value of its variable, of what its body denotes (introduction-to-matching-logic.tex:737-741). The ensures stands as the equality of y >Int x with true, a predicate: the whole carrier where both sides denote the same set, empty otherwise (:880-885). >Int compares two integers (domains.md:1324-1325). So at x the right side denotes the configurations d(y) for the integers y > x.
(4) By (2), each a(x) has a successor in that set: at least one, not named. A binder that binds a variable of a sort with elements adds no condition.'''

[ruling.kore]
statement = '''The rule is written \rewrites(\and(L, \top), \exists ?Y:Int. \and(R, \equals(?Y >Int X, true))) (kore.txt:89-97): the binder stands over the right side and its ensures, and the left side's variable X is free in the axiom. It states what the ruling states.'''

