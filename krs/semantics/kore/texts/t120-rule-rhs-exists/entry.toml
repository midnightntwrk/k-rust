[[ruling.kore.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:1965-1970 (K 7.1.337)"
quote = '''We have $M \models \varphi \ra \snext \varphi'$ iff $\overline{\rho}(\varphi) \subseteq \snext_M(\overline{\rho}(\varphi'))$ for any $M$-valuation $\rho$, iff for any $a\in\overline{\rho}(\varphi)$ there is some $b \in \overline{\rho}(\varphi')$ such that $a\mathrel{R_s}b$, which is precisely the interpretation of a rewrite rule $\varphi \Rightarrow \varphi'$ in $M$.'''

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:2438-2446 (K 7.1.337)"
quote = "K uses question mark variables of the form `?X` to refer to existential variables, and uses `ensures` to specify logical constraints on those variables. These variables are only allowed to appear in the RHS of a K rule. If the rules represent rewrite (semantic) steps or verification claims, then the `?` variables are existentially quantified at the top of the RHS; otherwise, if they represent equations, the `?` variables are quantified at the top of the entire rule."

[[ruling.basis]]
