id = "t122-rule-lhs-exists"
kind = "text"
subject = "A rewrite rule whose left side holds #Exists Y. d(Y, b()) under a constructor: what an existential binder on a left side states."
retro = ["M2"]
origin = "kcore-spec fixture e3-ml-rule-lhs-exists"

[text]
files = ["t122-rule-lhs-exists.k"]
kompile = "accepts"

[ruling]
status = "settled"
form = "means"
statement = "The rule states that every configuration c(d(y, b())), for every y of sort Exp, has the successor a(). The binder ranges over every element of Exp; the same rule with a free variable Y of the left side in place of the binder states the same in every model."
reason = '''
(1) The left side is written c(\exists Y. d(Y, b())) under the cells (kore.txt:51).
(2) \exists Y. d(Y, b()) denotes the union over every element y of Exp of d(y, b()) (introduction-to-matching-logic.tex:737-741). The extension of a symbol's interpretation to sets of arguments is named and not written out (introduction-to-matching-logic.tex:714-716); it is taken here as the union over the elements of the argument sets, the extension that notation names, so that an application to a union of arguments is the union of the applications, and an application to an argument that denotes nothing denotes nothing. So c of it, and the cells around it, denote the configurations holding c(d(y, b())) for every y.
(3) A rewrite axiom \rewrites(L, R) is L -> next R, and a model satisfies it when, at every valuation, every element of L has a successor in R (introduction-to-matching-logic.tex:1965-1970, 1978-1980). So each of those configurations has a successor holding a().
(4) With a free variable Y of the left side in place of the binder, the axiom holds at a valuation where each c(d(y, b())) at the value y of Y has the successor a(); an axiom holds at every valuation (introduction-to-matching-logic.tex:767-768). That is (3) again, so the two state the same in every model.'''

[ruling.kore]
statement = 'The rule is one \rewrites axiom whose left side holds Lblc{}(\exists{SortExp{}}(VarY:SortExp{}, Lbld{}(VarY:SortExp{}, Lblb{}()))) (kore.txt:51); it states what the ruling states.'

