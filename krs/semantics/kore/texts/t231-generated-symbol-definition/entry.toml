id = "t231-generated-symbol-definition"
kind = "text"
subject = "The symbols kompile generates for a configuration and for the sorts, on configuration <top> <k> $PGM:Cmd </k> <ts> <t multiplicity=\"*\" type=\"Set\"> <v> $V:Int </v> <p> $P:Cmd </p> </t> </ts> </top> with one rule: the initializer initXCell of each cell, the projection project:S of each sort, and the getter of the generated counter. What the text states of such a symbol (its declaration, its equation, its functional axiom), what those sentences state of the other symbols, and whether the text decides which of these symbols belong to the theory of the rules and the functions."
origin = "kcore-spec fixture e1-starinit (starinit.k), the module names and the first comment changed"
rests_on = ["kk:t11-eq-applies"]

[text]
files = ["t231-generated-symbol-definition.k"]
kompile = "accepts"
frontend = "manual-silent"

[ruling]
status = "settled"
form = "means"
statement = "The K text names none of these symbols. It states that at the start of rewriting a cell holds what the configuration declaration writes in it, a configuration variable standing for its value, and that K generates for every sort S a function {_}:>S that gives back a term of sort S. The one rule, go, is written over the contents of <k> and applies no function; no sentence of the K text applies an initializer, a projection or the counter's getter. What the generated symbols are is stated by the KORE sentences alone, and is ruled in [ruling.kore]."
reason = """
(1) A configuration declaration declares the cells and that, at the start of rewriting, the contents of a cell are initialized with the value of the configuration variable written in it (15_configurations/README.md:27-32). The text's declaration writes $PGM:Cmd in <k>, $V:Int in <v> and $P:Cmd in <p>.
(2) K generates, for every sort of the definition, a predicate and a projection function; the projection {F}:>Foo is given by the rule { F:Foo }:>Foo => F (user_manual.md:1350-1373). The text declares the sort Cmd and no function.
(3) The rule go is <k> go() => done() </k>: its two sides are built of the cell <k> and the constructors go and done. The text has no other rule and no function declaration, so no sentence the user wrote applies a function, generated or not.
(4) The manual names no initializer function and no getter of the generated counter: these are symbols of the kompiled text only. What the kompiled sentences state of them is [ruling.kore]."""

[[ruling.basis]]
source = "tutorial"
locator = "k-distribution/k-tutorial/1_basic/15_configurations/README.md:27-32 (K 7.1.337)"
quote = "This configuration declaration declares a single cell, the `<k>` cell. It also declares that at the start of rewriting, the contents of that cell should be initialized with the value of the `$PGM` **configuration variable**. Configuration variables function as inputs to `krun`."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1350-1351 (K 7.1.337)"
quote = "K automatically generates certain predicate and projection functions from the syntax you declare."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1359-1373 (K 7.1.337)"
quote = '''syntax Foo ::= "{" K "}" ":>Foo" [function] ... rule { F:Foo }:>Foo => F ... The first two types of functions are generated automatically for every sort in your K definition'''

[ruling.kore]
statement = '''
(1) Declaration. Each generated symbol is declared without a source and with function{}(): symbol LblinitTsCell{}(SortMap{}) : SortTsCell{} [function{}()] (kore.txt:66), and in the same form LblinitTCell (kore.txt:62) and Lblproject'Coln'TsCell (kore.txt:124). The declaration puts the symbol in the signature; a model interprets it by a function from elements to sets of elements (introduction-to-matching-logic.tex:704-710).

(2) Equation. Each generated symbol f is the applied symbol of the left side of exactly one axiom, of the form \implies(\and(\top, \and(\in(X0, P), \top)), \equals(f(X0), \and(t, \top))) (kk:t11-eq-applies; an initializer without argument has no \in). An axiom holds in a model when it denotes the whole carrier at every valuation (:767-768), \in holds exactly where the variable's element is in the pattern's denotation (:897-902), and \equals exactly where the two denotations are the same set (:880-885). So:
 (a) An initializer's P is the variable Init (initTsCell, kore.txt:472-487: X0 in VarInit, right side <ts>(initTCell(VarInit))). The premise holds exactly where X0 is Init, so the axiom states that at every map m the set f denotes at m is the set t denotes at m, whichever set that is. Given the interpretations of the symbols t applies, exactly one interpretation of f satisfies the axiom.
 (b) A projection's and the getter's P is a constructor pattern: kseq(inj{S,KItem}(K), dotk) with right side K (project:TsCell, kore.txt:1426-1441), <generatedTop>(_DotVar0, Cell) with right side Cell (the getter, kore.txt:364-379). The axiom states f(a) = v at each element a that P denotes at a valuation where the right side is v, and nothing at another element (kk:t11-eq-applies). Given the interpretations of the symbols of P, an interpretation of f satisfies it exactly where no element is denoted by P at two valuations with different right sides; f is then fixed on the elements P denotes and free elsewhere. For the getter that condition is what the no-confusion axiom of <generatedTop> states (kore.txt:174; :1017-1024). For a projection it is that kseq(inj{S,KItem}(K), dotk) denotes no element at two values of K, and no axiom of the text states it: kseq is declared with the attributes constructor, functional and injective, and inj with sortInjection (prelude.kore:8, 50); an attribute is a hint whose semantic content should correspond to axioms declared explicitly (kore-syntax.md:222-228), and the text has no no-confusion axiom of kseq and none that makes inj injective. So a projection's equation states that condition itself, of kseq and inj.

(3) A definition outside the theory. Call a set G of generated symbols closed when a member is applied only by the left side of its own equation, by its own functional axiom, and by right sides of equations of members. In this text the one rule applies no generated symbol, and closed sets are, for instance: initGeneratedTopCell alone; that with initTopCell and initGeneratedCounterCell, which its equation alone applies (kore.txt:395); that with initKCell and initTsCell, which initTopCell's equation alone applies (kore.txt:467); any of these with the getter and a projection no equation applies (project:TsCell); and that with initTCell, which initTsCell's equation alone applies (kore.txt:485). Let the theory be the text without the declarations, equations and functional axioms of a closed G. The right side of a member's equation applies symbols of the theory, functions among them: with initTCell in the theory, initTsCell's applies it (kore.txt:485), and initKCell's applies the projection project:Cmd and Map:lookup (kore.txt:413). By (2), over any model of the theory the equations of G are satisfied by interpreting the members in the order in which their equations apply one another, uniquely in case (a), and in case (b) under its condition, which is a statement about the symbols of P, symbols of the theory. Conversely a model of the text is a model of the theory when the members' interpretations are forgotten. So the equations of G define G from the theory's symbols: beyond the condition of (b) they state nothing of the theory's symbols, and the theory states nothing of G. That an equation of G applies a function of the theory does not change this: the equation takes that function's value, whatever the theory makes it, and states none.

(4) Functional axiom. \exists Val. Val = f(...) states that f denotes exactly one element at every argument (:960-964). With the equation of case (a) it states that t denotes exactly one element at every argument: a statement about the symbols t applies. Where the theory's sentences already give t exactly one element at every argument, the pair adds nothing to the theory; where they do not, the pair states of the theory's symbols something the theory does not, and (3) does not cover it. In this text the five initializers kore.txt declares (kore.txt:60-68, those of <p>, <t>, <top>, <ts> and <v>) take Init, are declared with function{}() alone, and have no functional axiom. In the text of e2-cells, initTsCell() = <ts>(.ThCellSet()) has one (e2-cells kore.txt:1022, 594, 164): the pair states that <ts>(.ThCellSet()) is one element, which holds in a theory where <ts> is a total function (its own functional axiom, e2-cells kore.txt:488) and .ThCellSet, the unit of a sort hooked SET.Set, is one set (e2-cells kore.txt:76).

(5) The text does not say which generated functions are the theory's. initTCell (kore.txt:62, 436-451) and initTsCell (kore.txt:66, 472-487) are declared in the same form and each has one equation of form (a); in the text of e2-cells initThCell is declared and has its equation and its functional axiom (e2-cells kore.txt:162, 1007-1009, 592) and no other sentence applies it. By (3), a reading that keeps a generated function with an equation of form (a) in the theory and a reading that leaves symbol and equation out have the same models up to the interpretation of that function, which the equation determines. The same holds of the getter, determined on the elements <generatedTop> builds, since the theory states the condition of (2)(b) for it. A reading that leaves a projection out also leaves out what its equation states of kseq and inj ((2)(b)), and loses nothing only where its theory gives that condition otherwise. With that, either is a reading of the text, and whether some other sentence applies the symbol decides neither. What a reading must keep fixed: the set of symbols it leaves out is closed, so no sentence it keeps applies one of them, and a functional axiom of a symbol left out is accounted as in (4).'''

