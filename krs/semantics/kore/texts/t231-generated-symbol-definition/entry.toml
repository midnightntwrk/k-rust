[[note]]
implementation = "kcore"
text = "Which generated symbols KCore's theory has is the reader's numbering (Parse.envOf), not whether a sentence applies the symbol. A function of the theory, with the text's equation as its clause, applied or not: every symbol declared without a source that has an equation and is no sort predicate, projection, counter getter, initializer of the top cell tree, cell of the configuration or registry symbol (envOf's genSyms over its test known; treeInits are the initializers of the cells of the numbered cell tree, which stops at a cell collection, and of GeneratedTopCell and GeneratedCounterCell). On the two texts read below those are the initializers of cells below a cell collection, a Map collection's XCellMapKey, and getExitCode. An initializer of the top cell tree is a function of the theory only where a user sentence applies it or the equation of one so numbered does (treeFns); a projection only where a user sentence or the equation of a function initializer applies it (projNames); the counter's getter under no arm of envOf. The theory lacks every other projection and top-tree initializer, and the getter. Sort predicates isX are not this entry's subject."

[[note]]
implementation = "kcore"
text = "On the text of fixture e1-starinit, this entry's K text but for the module names (kcore-spec f2-examples/e1-starinit.kompile.kore; kcore sem-fields): the theory's functions are initTCell, initVCell, initPCell, project:Cmd and project:Int. initTCell is applied by one sentence, initTsCell's equation, whose symbol the theory lacks; the theory lacks initTsCell, initTopCell, initKCell, initGeneratedTopCell, initGeneratedCounterCell, the getter and the other projections, although initTopCell's equation applies initTsCell and initKCell. On e2-cells' text (f2-examples/cells.kompile.kore) initThCell, initLtCell, initMtCell, initIdCell, initKeyCell, initVCell, MtCellMapKey and getExitCode are the theory's generated functions; LblinitThCell occurs three times in that text (declaration, functional axiom, left side of its own equation). kcore account refuses no sentence of either text."

[[note]]
implementation = "kcore"
text = "The equation of a symbol the theory lacks is accounted where it is the symbol's only equation, without requires, ensures or exclusion, over distinct variables (Parse.initEqnOK; the getter's by getterEqnOK, over the top cell's constructor at distinct variables; a projection's by predProjOK?, by its shape project:X(P) = V), its right side applying symbols of the registry or of the theory (its functions included), initializers of cells below, and projections whose equations are accounted. A functional axiom of an initializer the theory lacks is taken only where the right side has exactly one value by the theory's constructors, total interpreted symbols and the initializers of cells strictly below that have their own functional axiom, or is ground and computed (Parse.initFunctionalOK: initTotalOK or initGroundOK); otherwise the account refuses the text at that axiom (initFaults, generatedEquation). Neither fixture text has an axiom refused there. Whether KCore's theory entails the condition of [ruling.kore] (2)(b) for a projection it lacks was not checked for this entry: predProjOK? reads the equation's shape."

[[note]]
implementation = "kcore"
text = "In a tie file a sentence that applies a symbol the theory lacks is of the class 'no direction'; account_absent states per text, decided by the kernel, that the class is exactly those sentences, and absent_closed that no sentence of another class applies such a symbol (kcore-spec test/TieE1Starinit.lean). That is the closure of G in [ruling.kore] (3). GenEqs.model_with_inits_step and model_with_eqns_step state a model of the theory with Step's steps in which names outside the theory denote given partial functions; reading an equation's right side into such a function, GenEqs.armHead reads a name, a constructor of the theory or an interpreted hook, and no function of the theory. So for a right side that applies a function of the theory (initTsCell's, initKCell's here) the extension of (3) is argued in this entry and is not yet a Lean statement."
