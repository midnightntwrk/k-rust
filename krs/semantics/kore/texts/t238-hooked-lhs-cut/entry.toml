[ruling.kore]
statement = '''The left sides are written <list>(List:set(_Gen0, I, inj{Int,KItem}(J))) #as _Gen1 (kore.txt:135) and <list>(List:set(L, I, inj{Int,KItem}(J))) #as _Gen0 (kore.txt:144), the list cell kept on the right side by its as-variable (kore.txt:138, 147). In the first, _Gen0 is free and occurs nowhere else in the axiom: the axiom holds at every valuation of it, so its left side at a valuation of I and J is in effect the union over every element e of the carrier of List of the configurations with List:set(e, i, j) in the list cell. The LIST module states the update's value where its arguments are lists. That every element of List's carrier is a list is what the hooked sort List is (an implementation of lists, domains.md:902-904, 914), not a sentence the text writes; the written sentences state nothing of List:set at an element of the carrier that is no list, if a model has one. So at a configuration whose list v no list L gives as L [ i <- j ] (i an index of v whose element is not j), whether some other element e of the carrier gives List:set(e, i, j) = v, and so whether the first rule applies there, is not stated by the written sentences: one model may have such an e and another not. The second rule's L is the list the k cell holds, so at a configuration whose k cell holds m(l, i, j) with l a list, the update's value is the module's and whether the rule applies is stated; only where the k cell holds an element of List that is no list is it open in the same way.'''

