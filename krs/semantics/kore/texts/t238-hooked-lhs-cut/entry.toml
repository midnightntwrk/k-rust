id = "t238-hooked-lhs-cut"
kind = "text"
subject = "List:set (hook LIST.update) in a rewrite rule's left side: <list> _ [ I <- J ] </list>, whose list argument nothing else holds (K's regression text list-set), and <list> L [ I <- J ] </list> with L, I and J bound in the k cell. Where each rule applies, and what the written sentences leave open."
origin = "K 7.1.337 regression text pyk/regression-new/list-set/test.k, with a second rule"
rests_on = ["kk:t02-step-successors", "kk:t10-fn-innermost", "kk:t34-collection-values", "kk:t233-rule-conn-cut"]

[text]
files = ["t238-hooked-lhs-cut.k"]
kompile = "accepts"
frontend = "as-ruled"

[ruling]
status = "settled"
form = "means"
statement = """(1) A list update applied to a variable is one of the list patterns the manual allows on a left side. As a pattern, L [ I <- J ] denotes at a valuation the list the update gives at L, I and J; the application stands at its position as any application does, so the left side is the cut of kk:t233-rule-conn-cut: the list cell holds some V with V in L [ I <- J ].
(2) The first rule, whose list argument (the wildcard) nothing else holds, applies at a configuration whose k cell begins with l(i, j) and whose list cell holds the list v exactly where v is L [ i <- j ] for some list L. Where i is an index of v (0 <= i < size of v): if v's element at i is j, L = v is such a list (the update puts at i the element v already has there) and the rule applies; if v's element at i is not j, no list L gives v, since L [ i <- j ] has j at i, and the rule states nothing there. At an i that is no index of v (negative, or not below the size), what the rule states is not ruled here. On the text's list ListItem(0) ListItem(1) ListItem(2): l(0, 0), l(1, 1) and l(2, 2) have the successor .K in the k cell, the list unchanged; of l(0, 1) the rule states nothing.
(3) The second rule, whose list argument L the k cell binds, applies at a configuration whose k cell begins with m(l, i, j), l a list, exactly where the list cell holds l [ i <- j ], the list the update gives at l, i and j where it gives one.
(4) What the written KORE sentences leave open beside this: see [ruling.kore]."""
reason = '''
(1) Patterns on a left side may refer to complex terms of sort List although terms which are functions should not appear on a left side, and such terms are destructured into pattern matching operations (user_manual.md:2212-2216); among the forms allowed are one or more list update operations applied to a variable (user_manual.md:2228-2229). List:set is that update, a function of the LIST module (domains.md:978), which creates a new List with a new value at a particular index (domains.md:974-975). So the text's two left sides are allowed patterns.
(2) A List is a finite sequence of items in which the order counts (kk:t34-collection-values). An application at a valuation denotes the symbol's value at its arguments' values (kk:t10-fn-innermost, point (1)), so L [ I <- J ] at a valuation denotes the list the update gives there; a variable held by the left side only is quantified over every value (kk:t02-step-successors, point (4): the rule holds at every valuation), so the first left side holds every v that some L gives. This is the cut C[V] with V in L [ I <- J ] (kk:t233-rule-conn-cut, point (1)).
(3) The new list has the new value at the index (domains.md:974-975): where L [ i <- j ] is v, v holds j at i. Where i is an index of v and v holds j there, the update of v at i by j gives v, its items at the other positions being v's (a step: the update changes the value at the one index it names). Indices of a list are counted from 0 at its beginning (domains.md:961-962, said of a lookup); what the update gives at a negative index or one not below the size is not said in the update's section, so the entry rules only where i is an index of v.
(4) The second rule's L is bound by the k cell to the list m holds, so the left side holds the configurations whose list cell is the update's value at that l, i and j.
(5) A rewrite rule states that at every valuation every element of its left side has a successor in its right side (kk:t02-step-successors, point (4)): the configurations of (3) and (4) each have the successor whose k cell holds the rest and whose list cell is unchanged.'''

