id = "t126-rule-lhs-not"
kind = "text"
subject = "A rewrite rule whose left side holds #Not(a()) under a constructor, c(#Not(a())) => a(); kompile writes it as c(#Not(a() #as _Gen0)) => _Gen0, with a variable the K text does not hold."
retro = ["M6"]
origin = "kcore-spec fixture e3-ml-rule-lhs-not"

[text]
files = ["t126-rule-lhs-not.k"]
kompile = "accepts"
frontend = "differs"
frontend_difference = "The K text states that c(x) steps to a() for every x other than a(); the written axiom, with its free variable _Gen0 on both sides, states in addition that every c(x), c(a()) included, steps to every element e of Exp other than a()."

[ruling]
status = "settled"
form = "means"
statement = "By the K text, every configuration c(x), for every element x of Exp other than a(), has the successor a(); of c(a()) the rule states nothing."
reason = '''
(1) #Not is the matching-logic negation of ML-SYNTAX (kast.md:140), the complement in the carrier of its sort (introduction-to-matching-logic.tex:732-733). a() is a constructor of Exp and denotes one element. So #Not(a()) denotes every element of Exp but a().
(2) The extension of a symbol's interpretation to sets of arguments is named and not written out (introduction-to-matching-logic.tex:714-716); it is taken here as the union over the elements of the argument sets, the extension that notation names, so that an application to a union of arguments is the union of the applications, and an application to an argument that denotes nothing denotes nothing. So c(#Not(a())), under the cells, denotes the configurations holding c(x) for every x other than a().
(3) A rewrite axiom \rewrites(L, R) is L -> next R, and a model satisfies it when, at every valuation, every element of L has a successor in R (introduction-to-matching-logic.tex:1965-1970, 1978-1980). So each such configuration has the successor a().'''

[ruling.kore]
statement = '''The written axiom is \rewrites(c(\not(\and(a(), _Gen0))), _Gen0) under the cells (kore.txt:51, 54), _Gen0 a free variable of sort Exp. It holds at every valuation of _Gen0. At _Gen0 = a(), \and(a(), a()) is {a()} and the axiom states the K text's sentence: c(x) for x other than a() steps to a(). At _Gen0 = e for an element e other than a(), \and(a(), e) is empty, its negation is the whole carrier, and the axiom states that every c(x), c(a()) included, has the successor e. So the written text states that c(x) steps to every element of Exp other than a(), for every x, besides what the K text states.'''

