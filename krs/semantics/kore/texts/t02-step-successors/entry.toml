id = "t02-step-successors"
kind = "text"
subject = "The successors of a configuration: one for each rule that applies at the least priority number at which a rule applies; a rule of a larger priority number gives none there."

[text]
files = ["t02-step-successors.k"]
kompile = "accepts"

[ruling]
status = "settled"
form = "means"
statement = "The successors of a configuration are the results of the rules that apply to it at the least priority number at which some rule applies, one for each such rule; where two rules of that number apply, both results are successors, and a rule of a larger priority number gives no successor there. In the text a(0) has the two successors b(0) and c(1), and not d(0)."
reason = """
(1) The configuration is matched against all the top-level rewrite rules; the substitution of a matching rule is applied to its right side, and the result is the new configuration (k-tutorial 13_rewrite_rules/README.md:77-82). Where more than one rule applies it is non-deterministic which applies, and it could be any of them; the search explores every choice (README.md:87-93). So each applying rule gives a successor, and a successor comes from an applying rule.
(2) Rules are tried in increasing order of priority (user_manual.md:1727-1730), and one of a larger priority number is tried only after those of a smaller one have been shown not to apply (user_manual.md:1722-1724). So at a configuration where a rule of number P applies, no rule of a larger number is tried, and the successors are those of the rules of the least such P.
(3) In the text the first two rules have priority 50 (user_manual.md:1748-1749) and both apply at a(0): its successors are b(0) and c(0 +Int 1) = c(1). The third rule, of priority 60, is not tried there.
(4) The written sentences state each rule as an axiom that every instance of its left side has a successor in its right side (introduction-to-matching-logic.tex:1965-1970), and such an axiom only says what the transition system must do (introduction-to-matching-logic.tex:2146-2148); priority is an attribute, whose meaning the KORE text leaves to each implementation (kore-syntax.md:222-228). That the successors are exactly those of (1) and (2) is the manual's, not a consequence of the axioms."""

[[ruling.basis]]
source = "manual"
locator = "k-distribution/k-tutorial/1_basic/13_rewrite_rules/README.md:77-82 (K 7.1.337)"
quote = "Once the initial program has been inserted into the K cell, the resulting term, called the **configuration**, will be matched against all the top-level rewrite rules in the definition. If only one rule matches, the substitution generated by the matching will be applied to the right-hand side of the rule and the resulting term is **rewritten** to be the new configuration."

[[ruling.basis]]
source = "manual"
locator = "k-distribution/k-tutorial/1_basic/13_rewrite_rules/README.md:87-93 (K 7.1.337)"
quote = "If more than one top-level rule applies, by default, `K` will pick just one of those rules, apply it, and continue rewriting. However, it is **non-deterministic** which rule applies. In theory, it could be any of them. By passing the `--search` flag to `krun`, you are able to tell `krun` to explore all possible non-deterministic choices, and generate a complete list of all possible final configurations reachable by each nondeterminstic choice that can be made."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1727-1730 (K 7.1.337)"
quote = "Rules are tried in increasing order of priority, starting at zero and trying each increasing numerical value successively."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1722-1724 (K 7.1.337)"
quote = "In particular, the second rule above will only be tried after the first rule has been shown not to apply."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1748-1749 (K 7.1.337)"
quote = "a rule with no attributes indicating its priority is assigned the priority 50."

[[ruling.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:1965-1970 (K 7.1.337)"
quote = '''We have $M \models \varphi \ra \snext \varphi'$ iff $\overline{\rho}(\varphi) \subseteq \snext_M(\overline{\rho}(\varphi'))$ for any $M$-valuation $\rho$, iff for any $a\in\overline{\rho}(\varphi)$ there is some $b \in \overline{\rho}(\varphi')$ such that $a\mathrel{R_s}b$, which is precisely the interpretation of a rewrite rule $\varphi \Rightarrow \varphi'$ in $M$.'''

[[ruling.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:2146-2148 (K 7.1.337)"
quote = "Note that \\prule{Axiom A} is a \\emph{positive axiom}, meaning that it merely says what the transition system \\emph{must do}, but not constrains what it \\emph{cannot do}."

[[ruling.basis]]
source = "kore-syntax"
locator = "haskell-backend/docs/kore-syntax.md:222-228 (K 7.1.337)"
quote = "All semantic information contained in attributes should correspond to axioms declared explicitly. ... The meaning of particular attributes is implementation-defined."
