[[ruling.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:727 (K 7.1.337)"
quote = '\item $\overline{\rho}(x) = \{\rho(x)\}$, for all $x\in\Var_s$'

[[ruling.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:732-736 (K 7.1.337)"
quote = '\item $\overline{\rho}(\neg\varphi) = M_s \ \backslash\ \overline{\rho}(\varphi)$ for all $\varphi\in\Pattern_s$ \item $\overline{\rho}(\varphi_1 \wedge \varphi_2) = \overline{\rho}(\varphi_1) \cap \overline{\rho}(\varphi_2)$ for all $\varphi_1, \varphi_2$ patterns of the same sort'

[[ruling.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:840-845 (K 7.1.337)"
quote = '''$\overline{\rho}(\lceil\varphi\rceil_{s_1}^{s_2})$ is either $\emptyset$ (i.e., $\overline{\rho}(\bot_{s_2})$) when $\overline{\rho}(\varphi) = \emptyset$ (i.e., $\varphi$ undefined in $\rho$), or is $M_{s_2}$ (i.e., $\overline{\rho}(\top_{s_2})$) when $\overline{\rho}(\varphi) \neq \emptyset$ (i.e., $\varphi$ defined).'''

[[ruling.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:880-885 (K 7.1.337)"
quote = '''Equality is also a predicate. if $\varphi,\varphi' \in \Pattern_{s_1}$ and $\rho : \Var \ra M$ then $\overline{\rho}(\varphi =_{s_1}^{s_2} \varphi') = \emptyset$ iff $\overline{\rho}(\varphi) \neq \overline{\rho}(\varphi')$, and $\overline{\rho}(\varphi =_{s_1}^{s_2} \varphi') = M_{s_2}$ iff $\overline{\rho}(\varphi) = \overline{\rho}(\varphi')$.'''

[ruling.kore]
statement = '''The four left sides are written as the K text has them, with no variable on a right side that the K text does not hold: \and{KItem}(inj{Exp,KItem}(go(X)), \ceil{Exp,KItem}(go(X))) (kore.txt:175) and \and{KItem}(inj{Exp,KItem}(go2(X)), \equals{Int,KItem}(X, 1)) (kore.txt:184), the predicate at the sort KItem of the conjunction around the injected term; c(\and{Exp}(X, d(_Gen0, b()))) (kore.txt:193) with the right side X (kore.txt:196); and e(\and{Exp}(d(X, _Gen0), d(_Gen1, b()))) (kore.txt:202). The wildcards are the free variables _Gen0 and _Gen1, held by the left side only, so the axiom at every valuation of them states (2), (3) and (4). The injection inj{Exp,KItem} of go(X) denotes one element where go(X) does, so the predicate at sort KItem holds where it holds at Exp.'''

