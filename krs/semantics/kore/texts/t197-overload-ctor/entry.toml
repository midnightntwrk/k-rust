id = "t197-overload-ctor"
kind = "text"
subject = "Two overloaded constructor productions, sum(Exp, Int) and sum(Exp, Exp): whether sum(e, i) built by the first is the term sum(e, i) built by the second at an injected integer, or another term."
retro = ["F9"]
origin = "kcore-spec fixture c3-anywhere-ctor"
rests_on = ["kk:t16-match-inj", "kk:t228-ctor-distinct"]

[text]
files = ["t197-overload-ctor.k"]
kompile = "accepts"
frontend = "manual-silent"

[ruling]
status = "unsettled"
reason = """
(1) The two productions carry overload(sum), and (Exp, Exp, Int) is below (Exp, Exp, Exp) elementwise: sumEI is the more specific overload of sumEE, and a term from sumEI is a restriction of one from sumEE (user_manual.md:381-390). That says sumEI(e, i) is sumEE(e, i) at the injected i.
(2) Both productions are constructors. Of two constructors of one sort the tutorial says that each is logically distinct from the other (kk:t228-ctor-distinct, which leaves overloaded productions out of its scope for this reason): read that way, sumEE and sumEI build different terms. No sentence says which of the two sentences, the overload restriction of (1) or the distinctness of constructors, gives way in an overload pair.
(3) The kompiled text states both as well: that sumEE(e, inj(i)) = sumEI(e, i), and that no element is both a sumEE and a sumEI ([ruling.kore]). Since Exp and Int have elements, those two sentences have no common model. The text does not say which gives way. The readings below differ in which holds."""

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:381-390 (K 7.1.337)"
quote = "That is, a term from production `P` is a restriction of one from production `Q`; when its arguments are more precise, we can give the result a more precise sort."

[ruling.kore]
statement = "kompile writes the overload axiom sumEE(K0, inj{Int,Exp}(K1)) = sumEI(K0, K1) (kore.txt:90) and the no-confusion axiom that no element is both a sumEE and a sumEI (kore.txt:78); sumEE is declared functional and anywhere, without constructor (kore.txt:8), and both are functional (kore.txt:74, 80). At any e and i the first makes sumEE(e, inj(i)) and sumEI(e, i) one element and the second makes them share none: as written the sentences have no model."

[[ruling.kore.basis]]
source = "kompiled"
locator = "kore.txt:90"
quote = '''axiom{R} \equals{SortExp{}, R} (LblsumEE{}(K0:SortExp{},inj{SortInt{}, SortExp{}} (K1:SortInt{})), LblsumEI{}(K0:SortExp{},K1:SortInt{})) [symbol-overload{}(LblsumEE{}(),LblsumEI{}())]'''

[[ruling.kore.basis]]
source = "kompiled"
locator = "kore.txt:78"
quote = '''axiom{}\not{SortExp{}} (\and{SortExp{}} (LblsumEE{}(X0:SortExp{}, X1:SortExp{}), LblsumEI{}(Y0:SortExp{}, Y1:SortInt{}))) [constructor{}()]'''

[[ruling.kore.basis]]
source = "kompiled"
locator = "kore.txt:8"
quote = '''symbol LblsumEE{}(SortExp{}, SortExp{}) : SortExp{} [anywhere{}(), functional{}(), injective{}(), symbol'Kywd'{}("sumEE")]'''

[[ruling.kore.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:882-883 (K 7.1.337)"
quote = '''$\overline{\rho}(\varphi =_{s_1}^{s_2} \varphi') = \emptyset$ iff $\overline{\rho}(\varphi) \neq \overline{\rho}(\varphi')$'''

[[reading]]
name = "overload-equal"
statement = "The overload axiom holds: sumEE(e, inj(i)) is sumEI(e, i); the two symbols share no element only at arguments the overload does not cover, sumEE(e, f) with f no injected integer."
answer = "sum(e, i) built by either production is one term; the rule rewrites sum(E:Exp, I:Int) to sum(E, E) at it."
consequence = "A pattern sumEE(X, Y) matches sumEI(e, i) with Y the injected i."

[[reading]]
name = "distinct"
statement = "The no-confusion sentence holds as written and the overload axiom is dropped: sumEE and sumEI build different terms everywhere."
answer = "sumEE(e, inj(i)) and sumEI(e, i) are two terms."
consequence = "A pattern sumEE(X, Y) does not match sumEI(e, i)."

[[reading]]
name = "as-written"
statement = "Both kompiled sentences hold."
answer = "No model: Exp and Int have elements, and at every pair of them the two sentences conflict."
consequence = "Nothing is concluded about a configuration of the text."
