id = "t91-set-variable-lemmas"
kind = "text"
subject = "What a [simplification] sentence with a set variable (@X) states: the range of the set variable, and, at that range, the library sentences of domains.md 1393 (#Ceil(@I1 %Int @I2)), 1177 ({notBool @B #Equals true}) and 449 ({false #Equals @Key in_keys(.Map)})."

[text]
files = ["t91-set-variable-lemmas.k"]
kompile = "accepts"

[ruling]
status = "settled"
form = "means"
statement = "A sentence with a set variable states its two sides equal at every assignment of a set of values of the variable's sort to each set variable: the empty set, a set of one value, and a set of two or more values. A [simplification] attribute changes nothing of what the sentence states. At that range the sentence of domains.md 1393 is false: at @I1 = @I2 = {0, 1} its left side holds and its right side does not. The sentences of domains.md 1177 and 449 hold at every assignment of sets of values. The sentence read at sets of at most one value only is a consequence of the written sentence and is not the sentence."
reason = """
(1) The range. A variable that begins with `@` is a set variable and refers to a set of values (kast.md:181-183). Terms evaluate to sets of values, the set being empty for a partial term such as `3/0` and of several values for a non-deterministic one such as `3 #Or 5`, and a symbol is interpreted collectively over sets of input values (user_manual.md:2338-2341). A set variable stands for any kind of pattern, undefined or non-deterministic (user_manual.md:2346-2348). So the assignments of a set variable of sort S are the sets of values of S, among them the empty set and the sets of two values, and an application at sets denotes the values of the symbol at each choice of one value per argument.
(2) The standing of the attribute. A rule with the simplification attribute is outside the main semantics (user_manual.md:1388-1389), the lemmas of INT do not affect the semantics of integers (domains.md:1357-1361), and that such a rule is sound is not checked (user_manual.md:1442-1443). So the text gives the attribute a use and gives the sentence no other meaning than the one written: it is a claim about the symbols it applies, which their meaning makes true or false.
(3) domains.md 1393 at @I1 = @I2 = {0, 1}. The modulus is that of t-division (domains.md:1233-1234), so `0 %Int 1` is 0; hence `@I1 %Int @I2` denotes at least the value 0 and `#Ceil` of it holds. `=/=Int` computes whether two integers are unequal (domains.md:1324-1325), so `0 =/=Int 0` is false and `1 =/=Int 0` is true; hence `@I2 =/=Int 0` denotes false and true, which is not what `true` denotes, and `{(@I2 =/=Int 0) #Equals true}` does not hold. The left side holds and the right side does not. The derivation uses no point at which `%Int` is undefined: it uses that `0 %Int 1` has a value, that `0 =/=Int 0` is false, and that false is not true.
(4) domains.md 1177, `{notBool @B #Equals true} => {@B #Equals false}`. The values of Bool are true and false, and `notBool` exchanges them (domains.md:1139-1140). At the empty set both sides fail. At {true} the left side denotes false and the right compares true with false: both fail. At {false} both hold. At {true, false} `notBool @B` denotes both values and so does `@B`: both fail. The two sides agree at every set of values.
(5) domains.md 449, `{false #Equals @Key in_keys(.Map)} => #Ceil(@Key)`. `in_keys` is total (domains.md:357) and checks whether a key is present in a map (domains.md:353), so at every value K, `K in_keys(.Map)` is false. At the empty set the application denotes nothing and `#Ceil(@Key)` fails. At a set of one or more values the application denotes false alone and `#Ceil(@Key)` holds. The two sides agree at every set of values.
(6) The reading at sets of at most one value. It asks the written sentence at fewer assignments, so it follows from the written sentence. No sentence of the text restricts a set variable to such sets; (1) says the contrary, naming the non-deterministic pattern.
"""

[[ruling.basis]]
source = "manual"
locator = "k-distribution/include/kframework/builtin/kast.md:182-184 (K 7.1.337)"
quote = "Set variables. These are denoted by variables that begin with a `@`. These variables refer to a set of values and are generally used when writing simplification rules in the Haskell Backend."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:2338-2341 (K 7.1.337)"
quote = "In Matching Mu Logic, terms evaluate to sets of values. This is useful for both capturing partiality (as in `3/0`) and capturing non-determinism (as in `3 #Or 5`). Consequently, symbol interpretation is extended to have a collective interpretation over sets of input values."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:2346-2348 (K 7.1.337)"
quote = "However, it is sometimes useful to have simplification rules which work over any kind of pattern, be it undefined or non-deterministic. This behavior can be achieved by using set variables to stand for any kind of pattern."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1388-1389 (K 7.1.337)"
quote = "The simplification attribute identifies rules outside the main semantics that are used to simplify function patterns."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1441-1442 (K 7.1.337)"
quote = "The frontend and Haskell backend **do not check** that supplied simplification rules are sound, this is the developer's responsibility."

