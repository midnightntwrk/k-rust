[ruling.kore]
statement = '''Each of the three rules stands in the kompiled text as one axiom `axiom{R,Q0} \implies{R}(\top{R}(), \equals{Q0,R}(L, \and{Q0}(P, \top{Q0}())))` with the attribute `simplification{}("")`, where L and P are the rule's two sides, `#Ceil` and `#Equals` written `\ceil{S,Q0}` and `\equals{S,Q0}` (kast.md:122, 124 gives the correspondence), and each set variable written `@VarX:SortS{}` (kore.txt:1-3). `@` marks a set variable in the KORE syntax, so the three axioms have free set variables and no free element variable. Read by the meaning matching logic gives the connectives (`\ceil` of a pattern holds where the pattern denotes at least one element, `\equals` of two patterns where they denote the same elements; no sentence of the K or KORE documents read for this entry states it, they name the connectives only), each axiom states, for every sort R and Q0 and every assignment of a set of elements to each set variable, that L and P hold at the same assignments. That is the statement of the K rule, with one difference of range: an axiom is stated at every set of elements of the sort, and a model may hold elements of a sort that no value denotes, at which the meaning of a hooked symbol is not stated. At sets of elements of values the three axioms stand as the ruling says: kore.txt:1 fails at @VarI1 = @VarI2 = {0, 1}, kore.txt:2 and kore.txt:3 hold.'''

