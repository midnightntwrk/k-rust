id = "t129-setvar-owise"
kind = "text"
subject = "A function equation over a set variable named twice, f(@S, @S) => one(), beside f(_, _) => two() [owise]: what the two sentences state."
retro = ["M8"]
origin = "kcore-spec fixture e3-setvar-owise"

[text]
files = ["t129-setvar-owise.k"]
kompile = "accepts"

[ruling]
status = "settled"
form = "no-model"
statement = "The sentences as written have no model: at f(a(), b()) the first states the value one() and the second the value two(), and the text states one() and two() distinct."
reason = '''
(1) A variable that begins with @ is a set variable and refers to a set of values (kast.md:182-185); terms evaluate to sets of values (user_manual.md:2338-2341). So @S ranges over every set of elements of Exp, among them {a(), b()}.
(2) The first equation is written \implies(X0 in @S and X1 in @S, \equals(f(X0, X1), one())) (kore.txt:47-65). Membership holds exactly where the element is in the set (introduction-to-matching-logic.tex:898-902), and an axiom holds at every valuation (:767-768). At @S = {a(), b()}, X0 = a(), X1 = b() the premise holds, so f(a(), b()) = one().
(3) The owise equation is written with the premise that no element G is equal to both arguments, X0 in G and X1 in G with G an element variable (kore.txt:69-90): that excludes the arguments that are equal, and only those. a() and b() are distinct (kore.txt:22), so at X0 = a(), X1 = b() the premise holds and f(a(), b()) = two().
(4) one() and two() are distinct elements (kore.txt:38), each denoting one element. So no model satisfies both (2) and (3). The diagonal premise the owise equation carries excludes the points where the arguments are one element; the first equation, by its set variable, holds at pairs of distinct elements too.'''

[ruling.kore]
statement = "The two equations and the constructor axioms are written as in the reason (kore.txt:22, 38, 47-65, 69-110)."

