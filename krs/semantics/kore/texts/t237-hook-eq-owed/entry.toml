id = "t237-hook-eq-owed"
kind = "text"
subject = "Equations of the text's own for two symbols of the INT module whose values the module states: X +Int 0 => X with no attribute, and X *Int 1 => X [simplification]. What each states, whether the attribute changes it, and how the sentences stand against the values the module gives."
origin = "kcore-spec fixture c3-hook-eq-lib (its rule), and a simplification rule"
rests_on = ["kk:t10-fn-innermost", "kk:t11-eq-applies", "kk:t91-set-variable-lemmas", "kk:t193-hook-eq-user"]

[text]
files = ["t237-hook-eq-owed.k"]
kompile = "accepts"
frontend = "as-ruled"

[ruling]
status = "settled"
form = "means"
statement = "Each rule is a sentence of the text about a symbol whose value the INT module states at every pair of integers: the first states x +Int 0 = x, the second x *Int 1 = x, each at every integer x. The simplification attribute does not change what the second states: it says how the sentence is used, and the sentence is the equality written. Neither sentence defines its symbol anew: each is a claim about the values the INT module gives, true or false of them. Both are true here (x + 0 = x and x * 1 = x), so the text has a model in which +Int and *Int are the sum and the product. Had either been false of those values at some integer (as X +Int 1 => X would be at every one), the text would state two values there and have no model, whatever the sentence's attributes. That is the same ruling kk:t193-hook-eq-user gives for a symbol of the text's own hooked to INT.add, here for the module's own symbols and with or without the attribute."
reason = '''
(1) An equation states its right side at every argument its patterns denote, under a valuation of its variables at which its requires holds (kk:t11-eq-applies). Neither rule has a requires: the first states x +Int 0 = x and the second x *Int 1 = x at every integer x.
(2) The simplification attribute identifies a rule outside the main semantics used to simplify function patterns (user_manual.md:1388-1389). It gives the sentence a use and no other meaning than the one written (kk:t91-set-variable-lemmas, point (2)). An attribute of a written sentence is a hint whose semantic content should correspond to axioms declared explicitly, and the meaning of a particular attribute is left to each implementation (kore-syntax.md:223-228). So the second rule states the same equality it would state without the attribute.
(3) +Int computes the sum and *Int the product of two integers (domains.md:1232, 1238), declared with hook(INT.add) and hook(INT.mul) (domains.md:1253, 1266). x + 0 = x and x * 1 = x at every integer, so both sentences are true of the module's values and the text has the model in which the two symbols are the sum and the product (as kk:t193-hook-eq-user, point (3)).
(4) A sentence false of those values at some integers would state there a second value beside the one the module states; a function application denotes at most one value (user_manual.md:540-544; kk:t10-fn-innermost, point (3)), so the text would have no model (kk:t193-hook-eq-user, point (3)). By (2) the attribute does not change this.'''

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1388-1389 (K 7.1.337)"
quote = "The simplification attribute identifies rules outside the main semantics that are used to simplify function patterns."

[[ruling.basis]]
source = "kore-syntax"
locator = "haskell-backend/docs/kore-syntax.md:223-228 (K 7.1.337)"
quote = "Attributes are hints to the backend, often collected by the frontend. Some attributes express syntactic information, while others express semantic information. All semantic information contained in attributes should correspond to axioms declared explicitly. The hints indicate when the backend may use faster algorithms, more efficent data structures, and so on. The meaning of particular attributes is implementation-defined."

