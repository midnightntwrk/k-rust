[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:540-544 (K 7.1.337)"
quote = "Semantically, it means that evaluation of that symbol will result in at most one return value (that is, the symbol is a *partial function*)."

[ruling.kore]
statement = '''kompile writes the first rule as an equation of +Int, \implies(X0 in X and X1 in 0, +Int(X0, X1) = X) (kore.txt:71-89), and the second as \implies(\top, *Int(X, 1) = X) with the attribute simplification{}("") (kore.txt:61-68). The premises of the first say no more than X0 = X and X1 = 0 (a membership in a variable or a literal holds exactly at its one element), so the two sentences are the equalities of the ruling, each holding at every valuation of X in the carrier of Int. The INT module states the values of +Int and *Int at integers. That every element of Int's carrier is an integer is what the hooked sort Int is (an implementation of arbitrary-precision integer arithmetic, domains.md:1196-1197), not a sentence the text writes: at an element of Int's carrier that is no integer, if a model has one, the module states no value of the two symbols, and the two sentences are claims of the text's own there.'''

