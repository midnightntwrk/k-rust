[ruling.kore]
statement = '''The requires is written \equals{Bool,GeneratedTopCell}(\not{Bool}(X >Int 0), \dv{Bool}("true")) conjoined with the left side (kore.txt:98-100), and states what the ruling states where the carrier of Bool is the two values true and false. That the carrier is those two is what the hooked sort Bool is (the boolean values of the BOOL module, domains.md:1084-1088), not a further sentence the text writes. In a model whose carrier of Bool held an element besides the two, the complement of {false} would hold that element too and the condition would hold at no valuation.'''

