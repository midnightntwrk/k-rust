locator = "haskell-backend/docs/introduction-to-matching-logic.tex:965-966 (K 7.1.337)"
quote = '''Likewise, ``$\forall x\,.\,\exists y\,.\,\lceil f(x) \rceil \rightarrow f(x) = y$'' states that $f_M(a)$ contains at most one element ($f$ is a partial function).'''

[[ruling.kore.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:960-964 (K 7.1.337)"
quote = '''For example, if $f$ is a unary symbol, then the pattern equation ``$\forall x\,.\,\exists y\,.\,f(x) = y$'' (the convention for free variables allows us to drop the universal quantifier) states that in any model $M$, the set $f_M(a)$ contains precisely one element for any $a\in M$; i.e. $f$ is a total function.'''

[[note]]
implementation = "kcore"
text = "The cases. The text's equations are those of three kcore-spec fixtures, each a text of its own: e3-ml-eq-rhs-or (f, g, h as here; f2-examples/e3-ml-eq-rhs-or.kompile.kore), e3-eq-exists-ml-in-or (p and px under the names f and fx) and e3-eq-exists-ml-in-or-int (s under the name f). KCore's theory of a kompiled text takes nothing from attributes, and holds no functional or at-most-one item of a function; it reads each of these equations as a clause with an existential variable (account.txt: existentialClause) and names the clause's match independence as owed. What is kernel-checked on the three texts is about the value the reading computes (Eval), for every H, and not about models: test/ExClauseFxOr.lean, ExClauseFixtures.Or.h_zero and h_zero_alone (h(0) has the one result 0), h_differ (h(n) has no result at n other than 0, neither a value nor none), not_fnHyp; test/ExClauseFxInOr.lean, ExClauseFixtures.InOr.fx_value and fx_alone (fx(b) is b alone), f_no_result, f_not_matchIndependent, not_fnHyp; test/ExClauseFxInOrInt.lean, ExClauseFixtures.InOrInt.no_result, not_matchIndependent, not_fnHyp. No result where the instances differ is how a reading that gives an application at most one value records two; it is not a statement that the text has no model."

[[note]]
implementation = "kcore"
text = "The contrasts, kernel-checked. Fixture e3-ml-eq-rhs-or-total is e3-ml-eq-rhs-or with f, g and h declared total (f2-examples/mleqort.kompile.kore): KCore.TieE3MlEqRhsOrTotalNoModel.no_model (test/TieE3MlEqRhsOrTotalNoModel.lean) states, for every H, that no interpretation satisfies the text's sentences 207 (h's equation), 80 (h's functional axiom), 203 and 205 (the equations of f and g) with the signature items and the domain items of Int (each Int value one element, distinct values distinct elements, the graph of _-Int_ at [0, 1], none of which a sentence of the text states); inconsistent and not_fnHypH follow in the same file. Fixture e3-ml-eq-rhs-or-many (k(_) => 1 #Or ... #Or 9, k total): ExClauseFixtures.OrMany.no_model (test/ExClauseFxOrMany.lean), from sentences 235 (the equation) and 95 (k's functional axiom) with the signature and the distinctness of Int values. The functional sentences 80 and 95 are the premises with no counterpart in the three texts of the first note: [ruling.kore] (4)."

[[note]]
implementation = "kcore"
text = "Not kernel-checked yet. [ruling.kore] (3) argues that the four equations add no contradiction (a model of the rest gives a model of the whole); it does not show that a model exists, and no Lean theorem states Consistent for one of the three texts. That a model exists is owed by the ticket LIB.fn-many.consistent (Faithful.Model.consistent_of_fnMany: the value model with the one function reinterpreted as the set of its instances' values), which rests on LIB.fn-many.sat-off (FnSolvesAt, Faithful.Model.sat_off in KcoreSpec/ModelSatOff.lean: submitted and not on k-rust main when this entry was written, 2026-11-20) and LIB.fn-many.over (stdIOver, interpret_over, avoids_of_leaf: pending); the three texts' ties with `consistent` for every H are owed by FIX-core.wave-D.ce-ties.or, .in-or and .in-or-int. [ruling] (1) on those texts, that in every model of the theory h(n) is the elements of n and of 0 - n (h_values; f_values for the other two), is owed by the same three tie tickets. Until they land the rows of the three fixtures stay untied with consistency named as owed. The theory KCore reasons in is not the kompiled text sentence for sentence (it adds the domains' graphs and the constructors' items), so its Consistent is a statement beside (3), not the same one."
