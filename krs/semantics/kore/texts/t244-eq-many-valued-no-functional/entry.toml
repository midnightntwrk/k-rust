quote = "Attributes are hints to the backend, often collected by the frontend. Some attributes express syntactic information, while others express semantic information. All semantic information contained in attributes should correspond to axioms declared explicitly. The hints indicate when the backend may use faster algorithms, more efficent data structures, and so on. The meaning of particular attributes is implementation-defined."

[[ruling.kore.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:955-959 (K 7.1.337)"
quote = '''Note that, by default, symbols are interpreted as relations in matching logic. It is often the case, though, that we want symbols to be interpreted as (partial or total) \emph{functions}. This can be easily done by axiomatically constraining those symbols to evaluate to singletons.'''

[[ruling.kore.basis]]
