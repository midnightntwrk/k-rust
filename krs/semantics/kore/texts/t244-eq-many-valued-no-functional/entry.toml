id = "t244-eq-many-valued-no-functional"
kind = "text"
subject = "Equations whose right side is a disjunction, or a disjunction with an existential in an alternative, of functions declared without total: h(X) => f(X) #Or g(X); p(X) => X #Or (#Exists B:Bool. (B #And {B #Equals notBool X})), and px with {B #Equals X}; s(X) => X #Or (#Exists B:Int. (B #And {B #Equals X +Int 1})). What each equation states of the application, how that stands to the function attribute, and whether the sentences as written have a model where the alternatives differ."
rests_on = ["kk:t11-eq-applies", "kk:t10-fn-innermost"]

[text]
files = ["t244-eq-many-valued-no-functional.k"]
kompile = "accepts"
frontend = "differs"
frontend_difference = "The manual gives a function at most one value (user_manual.md:540-544), and with that sentence the K text has no model, h(1), p(true) and s(0) being given two values each. kompile writes the attribute function{}() on the declarations of h, p, px and s (kore.txt:6, 8, 10, 12) and no axiom that bounds any of them to one element, so the sentences as written do not hold the manual's bound: they have a model wherever the text without the four equations has one, and in it h(1), p(true) and s(0) are two elements each."

[ruling]
status = "settled"
form = "means"
statement = "(1) What each equation states. A disjunction denotes the elements of either alternative, and an existential the elements its body denotes at any value of its variable. An equation with such a right side states, at each argument where it applies (here every argument), that the application is the set of all those elements: h(x) is the elements of f(x) and of g(x), which are x and 0 -Int x; p(b) is b and notBool b; px(b) is b; s(x) is x and x +Int 1. It does not state that the application is one of them, and it states no choice among them. (2) Where the alternatives are one element the equation gives the function that value: h(0) is 0, and px(b) is b at both Booleans. (3) Where they are two elements (h(x) at every x other than 0, p(b) at both Booleans, s(x) at every integer) the equation gives the application two values. That an application has at most one value is said by the function attribute, in the manual's sentence on it, and by nothing in the equation. The K text holds both and has no model. In a text that holds the equations and no sentence of that bound the equations contradict nothing: they are satisfied by interpreting each application as the two elements, and such a text has a model wherever it has one without them. The sentences kompile writes are such a text ([ruling.kore])."
reason = '''
(1) The connectives. #Or and #Exists are connectives of ML-SYNTAX, #Or at one sort and #Exists binding a variable of one sort in a pattern of another (kast.md:148-149, 154). A pattern denotes a set of elements of its sort. A conjunction denotes the intersection and a negation the complement (introduction-to-matching-logic.tex:732-736), and a disjunction is the negation of the conjunction of the negations (:679-684): the union of what its alternatives denote. An existential denotes the union of what its body denotes over every value of its variable (:737-741). An equality is a predicate, the whole carrier where its two sides denote the same elements and nothing otherwise (:880-885). So B #And {B #Equals t} denotes B's element where t denotes exactly that element and nothing elsewhere, and #Exists B. (B #And {B #Equals t}) denotes t's element where t denotes exactly one element, and nothing where t denotes none or several.
(2) The right sides. An equation states that the application equals its right side at the arguments its argument patterns denote (kk:t11-eq-applies). Each equation of the text has a variable as its argument pattern and no requires: it states the equality at every argument. So f(x) is x and g(x) is 0 -Int x. An application at arguments that have values is the application at those values (kk:t10-fn-innermost); -Int, +Int and notBool are total (domains.md:1267, 1266, 1120) and are the difference, the sum and the negation (domains.md:1238, 1106). So at each argument the right side of h denotes x and 0 -Int x; that of p, b and notBool b; that of px, b and b, one element; that of s, x and x +Int 1.
(3) Equality, not membership. The equation's two sides are equal where they denote the same elements (:880-885): the application denotes every element the right side denotes and no other. That the application is one of the alternatives would be another sentence, the application included in the right side, and the text does not hold it.
(4) One element or two. 0 -Int x is x at x = 0 and at no other integer; notBool true is false and notBool false is true (domains.md:1138-1139), and the two Booleans are two values (domains.md:1084); x +Int 1 is x at no integer. So h(0) is the one integer 0 and px(b) the one Boolean b, and h(x) at x other than 0, p(b) and s(x) are two values each.
(5) The bound. The function attribute means that evaluating the symbol gives at most one value (user_manual.md:540-544). A symbol is interpreted at every element of its argument sort (:704-713), so every model interprets h at 1, where the equation gives the two values 1 and -1 and the attribute's sentence at most one: no model satisfies both, and likewise at p(true) and s(0). None of the functions is declared total. total would say that an application has at least one value (user_manual.md:546-551), which the equations already give at every argument; what the equations contradict is the bound from above, and in the K text only the function attribute's sentence states it.
(6) Without the bound. A symbol's interpretation is a function into the subsets of its result sort's carrier (:704-713), and a subset of two elements is one of them. So the equations by themselves, as (3) reads them, are satisfied by interpreting each application as the set of (2). [ruling.kore] says this of the written sentences, which hold the equations and not the bound.'''

