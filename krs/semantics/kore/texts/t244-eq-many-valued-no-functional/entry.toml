[ruling.kore]
statement = "(1) No sentence of the bound. The declarations of h, p, px and s carry function{}() (kore.txt:6, 8, 10, 12), and the text holds no functional axiom of any of them and no other axiom that bounds what they denote; the functional axioms it holds are of other symbols, those of _+Int_, _-Int_ and notBool among them (kore.txt:18, 20, 68). An attribute is not a sentence of the text: what an attribute says of meaning should correspond to an axiom declared explicitly (kore-syntax.md:223-228), and none is declared here. The axiom that would state the bound is the pattern equation for a partial function, for all x there is y with f(x) = y where f(x) is defined (introduction-to-matching-logic.tex:965-966); a symbol under no such axiom is interpreted as a relation (:955-959). (2) The equations. Each is one axiom, an implication from X0 in X to the equality of the application at X0 with the right side (kore.txt:109-123 for h, 127-141 for p, 145-159 for px, 163-177 for s). X is an element variable, so the premise holds exactly where X0 and X are one element, and the axiom states at every element x that the application at x denotes exactly what the right side denotes at X = x: the sets of [ruling] (1). (3) The equations add no contradiction. h, p, px and s occur in the text only in their declarations and at the left sides of their own equations, and no right side applies one of the four (those of h apply f and g, whose equations make f(x) the one element x and g(x) what 0 -Int x denotes, one element by kore.txt:20). So take any model of the text's other sentences and interpret each of the four, at each element x, as the set its right side denotes at x. Each such set is a subset of the result sort's carrier, as the declaration asks; the four equations hold by the choice of the sets; and the truth of every other sentence is unchanged, the four symbols not occurring in it. The text has a model exactly where the text without the four equations has one. In such a model h(1) holds the element of 1 and that of 0 -Int 1, two elements wherever those differ, as over the integers; p(true) holds true and what notBool true denotes; s(0) holds 0 and what 0 +Int 1 denotes. That those pairs are two elements is a fact of the integers and the Booleans; whether a sentence of the text states it does not matter to (3), which holds either way. (4) The contrast. A text that holds, beside the same equation, the functional axiom of h, one element Val equal to h(K0) at every K0 (the form of kore.txt:20; introduction-to-matching-logic.tex:960-964), states that h(1) is one element, and has no model in which 1 and 0 -Int 1 are two elements. The two texts differ by that one sentence."

