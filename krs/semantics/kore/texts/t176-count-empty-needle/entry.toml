id = "t176-count-empty-needle"
kind = "text"
subject = 'countAllOccurrences with an empty needle, here countAllOccurrences("ab", ""): the symbol is total and its equation, read at the empty needle, gives c = 1 + c.'
retro = ["ST5"]

[text]
declaration = { source = "builtin-module", locator = "k-distribution/include/kframework/builtin/domains.md:1855 (K 7.1.337)", quote = 'syntax Int ::= "countAllOccurrences" "(" haystack: String "," needle: String ")" [function, total, hook(STRING.countAllOccurrences)]' }
kompile = "not-run"

[ruling]
status = "unsettled"
reason = '''
What is stated. countAllOccurrences is total (domains.md:1855; user_manual.md:546-548). Its second equation states countAllOccurrences(S, T) = 1 + countAllOccurrences(substrString(S, findString(S, T, 0) + lengthString(T), lengthString(S)), T) where findString(S, T, 0) >= 0 (1898-1899). The empty string occurs at index 0 of every string, so findString("ab", "", 0) is 0 (1763-1765), and the substring from 0 to the length is "ab" itself (1751-1755): the equation states c = 1 + c for c = countAllOccurrences("ab", ""). No integer satisfies it.
Where the readings part. The equations read as written have no model with that value, since the symbol is total. The prose counts the number of times a string occurs within another (1848-1849) and does not say how many times the empty string occurs: read by the prose, a value exists and is not given. replaceAll(S, "", R) is replace at that count (1917) and shares the point.'''

