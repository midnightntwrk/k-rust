id = "t07-undefined-initial-term"
kind = "text"
subject = "An initial term with no value (a division by zero inside a function it applies) is no configuration: there is no run and no final configuration."

[text]
files = ["t07-undefined-initial-term.k"]
kompile = "accepts"

[ruling]
status = "settled"
form = "means"
statement = "An initial term that denotes no value puts nothing in the k cell: the initial configuration denotes no value, so there is no configuration to rewrite and no final configuration. In the text the program a(inv(0)) is such a term (inv(0) is 1 /Int 0), and a(inv(2)) is the configuration a(0), which steps to b(0)."
reason = """
(1) The initial program is inserted into the k cell, and the resulting term is the configuration (k-tutorial 13_rewrite_rules/README.md:77-80).
(2) The equation of inv gives inv(0) the value of 1 /Int 0, and division by zero is #False (domains.md:1233-1234): inv(0) denotes no value. Terms evaluate to sets of values, which is how a term captures partiality as in 3/0, and a symbol's interpretation is extended to sets of arguments (user_manual.md:2337-2341; introduction-to-matching-logic.tex:714-716). An application to an argument that denotes the empty set denotes the empty set, the extension being taken point by point (a step, not a quoted sentence): a(inv(0)) and the configuration that holds it denote no value.
(3) A configuration with no value has no instance for a rule's left side to match, so no rule applies to anything, and there is no configuration to be final (README.md:82-85).
(4) At a(inv(2)): inv(2) is 1 /Int 2, which t-division rounds to 0 (domains.md:1233-1234), so the configuration is a(0), and the rule for a steps it to b(0)."""

[[ruling.basis]]
source = "manual"
locator = "k-distribution/k-tutorial/1_basic/13_rewrite_rules/README.md:77-80 (K 7.1.337)"
quote = "Once the initial program has been inserted into the K cell, the resulting term, called the **configuration**, will be matched against all the top-level rewrite rules in the definition."

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1233-1234 (K 7.1.337)"
quote = "Compute the quotient `/Int` or modulus `%Int` of two integers using t-division, which rounds towards zero. Division by zero is `#False`."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:2337-2341 (K 7.1.337)"
quote = "In Matching Mu Logic, terms evaluate to sets of values. This is useful for both capturing partiality (as in `3/0`) and capturing non-determinism (as in `3 #Or 5`). Consequently, symbol interpretation is extended to have a collective interpretation over sets of input values."

[[ruling.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:714-716 (K 7.1.337)"
quote = '''We tacitly use the same notation $\sigma_M$ for its extension to argument sets,'''

[[ruling.basis]]
source = "manual"
locator = "k-distribution/k-tutorial/1_basic/13_rewrite_rules/README.md:82-85 (K 7.1.337)"
quote = "Rewriting proceeds by iteratively applying rules, also called **taking steps**, until no top-level rewrite rule can be applied. At this point the configuration becomes the **final configuration** and is output by `krun`."
