id = "t179-memset-bounds"
kind = "text"
subject = 'memsetBytes(dest, index, count, v) where index + count is not a valid index, or v is outside -128 to 127: here memsetBytes(b"abcd", 2, 2, 0) and memsetBytes(b"abcd", 0, 1, 200).'
retro = ["BY3"]
rests_on = ["kk:t177-bytes-valid-index"]

[text]
declaration = { source = "builtin-module", locator = "k-distribution/include/kframework/builtin/domains.md:2167 (K 7.1.337)", quote = "syntax Bytes ::= memsetBytes(dest: Bytes, index: Int, count: Int, v: Int) [function, hook(BYTES.memset)]" }
kompile = "not-run"

[ruling]
status = "unsettled"
reason = '''
What is stated. The result is dest except count bytes starting at index replaced with count bytes of value Int2Bytes(1, v, LE/BE); the operation will throw an exception if index + count is not a valid index, or if v is outside -128 to 127, and is implemented only for one implementation (domains.md:2158-2164). memsetBytes is not total (2167). index + count = 4 is not a valid index of a Bytes of length 4 (kk:t177-bytes-valid-index).
Where the readings part. The sentence states an exception, which is a run's behaviour and names no value and no absence of one; unlike replaceAtBytes it writes no #False. So at those points the text states neither.'''

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:2158-2164 (K 7.1.337)"
quote = "You can modify a `Bytes` to return a `Bytes` which is equal to `dest` except the `count` bytes starting at `index` are replaced with `count` bytes of value `Int2Bytes(1, v, LE/BE)` in O(count) time. This does not create a new `Bytes` object and will instead modify the original if `--llvm-mutable-bytes` is active. This will throw an exception if `index` + `count` is not a valid index. The acceptable range of values for `v` is -128 to 127. This will throw an exception if `v` is outside of this range. This is implemented only for the LLVM backend."

[[ruling.basis]]
source = "builtin-module"
locator = "k-distribution/include/kframework/builtin/domains.md:2167 (K 7.1.337)"
quote = "syntax Bytes ::= memsetBytes(dest: Bytes, index: Int, count: Int, v: Int) [function, hook(BYTES.memset)]"

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:2101-2105 (K 7.1.337)"
quote = "You can set the value of a particular byte in a `Bytes` object in O(1) time, either with index and value as `Int` or as an `MInt`. Currently, only 64-bit and 256-bit `MInt` types are supported. The result is `#False` if `value` is not in the range [0..255] or if `index` is not a valid index (ie, less than zero or greater than or equal to the length of the `Bytes` term)."

[[reading]]
name = "no-value"
statement = "An exception is no value: memsetBytes has none there."
answer = 'memsetBytes(b"abcd", 2, 2, 0) and memsetBytes(b"abcd", 0, 1, 200) denote nothing'
consequence = "A rule whose right side holds such an application has no successor there."

[[reading]]
name = "some-value"
statement = "The exception describes a run only; a value exists or not, as an interpretation gives."
answer = 'memsetBytes(b"abcd", 2, 2, 0) has no stated value'
consequence = "Any Bytes, or none, is consistent with the text there."
