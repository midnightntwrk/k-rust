[ruling.kore]
statement = '''The four axioms hold no variable the K text does not hold, and each states what (2) and (3) state, with the connective at the sort written there. c(\not{Exp}(a())) (kore.txt:93) and e(\implies{Exp}(a(), b())) (kore.txt:102) are left sides at sort Exp under c and e; \or{Exp}(a(), b()) (kore.txt:123) is a right side at sort Exp under inj{Exp,KItem} and kseq. #Top is written \top{SortK{}}() under append (kore.txt:114): the parser gave it the sort K, not Exp. append is the prelude's concatenation of K sequences, a function whose two equations give append(dotk, T) = T and append(kseq(I, KS), T) = kseq(I, append(KS, T)) (prelude.kore:10-45). So the right side denotes, at a valuation of the rest _DotVar1, the configurations whose k cell holds append(k, _DotVar1) for the elements k of K, and go has a successor among them: where k is a sequence of items built by kseq and dotk, the k cell holds that sequence, possibly empty and possibly of items of any sort below KItem, followed by the rest. By (1) each axiom is the same axiom as the one with Z in place of the connective and the membership Z in P conjoined, under an existential binder for Z on the right side, and with Z free on the left side, where a free variable is quantified over every value at which the axiom must hold (introduction-to-matching-logic.tex:767-768).'''

