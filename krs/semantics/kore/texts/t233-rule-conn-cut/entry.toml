id = "t233-rule-conn-cut"
kind = "text"
subject = "Matching-logic connectives at a term position of a rewrite rule's side, under symbol applications: #Top and #Or on a right side (go => #Top, go2 => a() #Or b()), #Not and #Implies under a constructor on a left side (c(#Not(a())) => done, e(a() #Implies b()) => done). What each rule states, and that a pattern P of sort S (a connective among them) at a position under applications C denotes what #Exists Z:S. C[Z] #And (Z in P) denotes."
origin = "kcore-spec fixtures e3-ml-rule-rhs-top (its rule), e3-ml-rule-rhs-or and e3-ml-rule-lhs-not-other (their rules, renamed), and a rule with #Implies"
rests_on = ["kk:t02-step-successors", "kk:t10-fn-innermost", "kk:t120-rule-rhs-exists", "kk:t124-rule-lhs-top", "kk:t126-rule-lhs-not"]

[text]
files = ["t233-rule-conn-cut.k"]
kompile = "accepts"
frontend = "manual-silent"

[ruling]
status = "settled"
form = "means"
statement = """(1) The cut. A pattern P of sort S, a connective or any other, at an argument position under symbol applications C (a context of applications with one hole of sort S) denotes, at each valuation, the set of C[z] for the elements z that P denotes. That is what #Exists Z:S. (C[Z] #And (Z in P)) denotes, Z a variable the rule does not otherwise hold, where the membership Z in P holds exactly where Z's element is one of what P denotes. Membership of one element goes through the connectives: z is in #Top always; z is in #Not(P) exactly where z is not in P; z is in P #Or Q exactly where z is in P or in Q; z is in P #Implies Q exactly where z in P implies z in Q.
(2) On a left side the rule applies at each instance C[z]: c(x) has the successor done for every element x of Exp other than a(), and e(x) has the successor done for every x other than a(), since a() #Implies b() denotes every element but a() (b() being an element other than a()). c(a()) and e(a()) are no instances; of them the two rules state nothing.
(3) On a right side the configuration has a successor among the C[z], and the rule names none of them: go2 has a successor whose k cell holds a() or b() before the rest, and the rule states neither that a() is one nor that b() is. go has a successor whose k cell holds some element of the sort of #Top, followed by the rest of the cell; the K text leaves that sort to the parser, and the manual does not state which sort it is (see [ruling.kore])."""
reason = '''
(1) #Top, #Not, #And, #Or and #Implies are the matching-logic connectives of ML-SYNTAX, each at one sort parameter Sort (kast.md:138-140, 148-150). A pattern denotes a set: a symbol's interpretation is extended to sets of arguments (introduction-to-matching-logic.tex:714-716, 728-730; user_manual.md:2337-2341), and an application to a set of arguments is the union of the applications at its elements (kk:t10-fn-innermost, point (2)). So C[P] denotes the C[z] for z in what P denotes.
(2) An existential denotes the union over every value of its variable (introduction-to-matching-logic.tex:737-741), and a membership Z in P is the whole carrier where Z's element is in what P denotes and empty otherwise (:897-902). So #Exists Z. (C[Z] #And (Z in P)), Z not free in C or P, denotes the union of C[z] over the z in what P denotes: the set of (1). A negation is the complement in the carrier of its sort and a conjunction the intersection (:732-736); top is the existential over a variable of the sort, disjunction and implication are derived from negation and conjunction (:679-684). So z is in #Top always, in #Not(P) where it is not in P, in P #Or Q where it is in either, in P #Implies Q (that is #Not(P) #Or Q) where z in P implies z in Q.
(3) A rewrite rule states that at every valuation every element of its left side has a successor in its right side (kk:t02-step-successors, point (4)). On the left: c(#Not(a())) denotes c(x) for the x other than a() (kk:t126-rule-lhs-not, point (1), for the same left side); a() and b() are constructors of Exp and denote one element each, and a() #Implies b() denotes the complement of {a()} joined with {b()}, which is every element but a(). Each such configuration has the successor done; at c(a()) and e(a()) the left sides are empty and the rules state nothing (kk:t124-rule-lhs-top states the same of #Top on a left side).
(4) On the right: a right side that denotes several configurations gives a successor among them and does not state that each is one (kk:t120-rule-rhs-exists, point (4), where the right side is an existential, the form of (2)). go2 => a() #Or b() denotes, by (1), the configurations holding a() and b(): go2 has a successor among them. The sort of #Top in go => #Top is the sort the parser gives the parameter Sort at that position; kast.md declares #Top at every sort, and the manual's account of sort inference is for variables (user_manual.md:1575), so the K text does not say which.'''

