[[reading]]
name = "evaluates-to-true"
statement = "A requires holds where it denotes the value true and nothing else."
answer = "The requires never holds: it denotes {true} only where both comparisons are true, which no integer gives. go(x) has no successor by this rule at any x."
consequence = "An #Or of two exclusive conditions in a requires makes the rule apply nowhere; the requires X >Int 0 orBool X <Int -5 would apply at x > 0 or x < -5."

[[reading]]
name = "can-evaluate-to-true"
statement = "A requires holds where true is among the values it denotes."
answer = "go(x) steps to done exactly where x > 0 or x < -5."
consequence = "The requires X >Int 0 #Or X <Int -5 and the requires X >Int 0 orBool X <Int -5 give the same rule; a requires of two values, one of them true, holds."

