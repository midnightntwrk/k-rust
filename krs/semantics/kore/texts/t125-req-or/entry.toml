id = "t125-req-or"
kind = "text"
subject = "A rewrite rule whose requires is X >Int 0 #Or X <Int -5, a matching-logic disjunction of two Bool terms; kompile writes it conjoined with a free Bool variable _Gen0 that the K text does not hold."
retro = ["M5"]
origin = "kcore-spec fixture e3-ml-req-or"

[text]
files = ["t125-req-or.k"]
kompile = "accepts"
frontend = "manual-silent"

[ruling]
status = "unsettled"
reason = '''
What is stated, under both readings. #Or is the matching-logic disjunction (kast.md:149), the union of what its two sides denote (introduction-to-matching-logic.tex:684 with :732-736). >Int and <Int compare two integers (domains.md:1324-1325), so at each integer x the two sides denote one value each, and the requires denotes {true} where both are true, {true, false} where exactly one is, and {false} where neither is. No x makes both true.
Where the readings part. The manual says the requires clause is a predicate, a function-like term of sort Bool, evaluated before the rule applies, and that the rule does not apply if the requires clause does not evaluate to true (user_manual.md:1154-1157). It does not say what a requires that denotes two values evaluates to: whether {true, false} evaluates to true. At x = 1 and at x = -10 the requires denotes {true, false}.
What the written sentence states is ruled in [ruling.kore]; it is one of the two readings.'''

[ruling.kore]
statement = 'The written axiom states the reading can-evaluate-to-true: go(x) has the successor done exactly where x > 0 or x < -5. The requires is written \equals(\and{SortBool}(\or{SortBool}(X >Int 0, X <Int -5), _Gen0), true) with _Gen0 a free Bool variable (kore.txt:98-100). An axiom holds at every valuation of its free variables. At _Gen0 = true the equality holds exactly where true is among the values of the disjunction; at _Gen0 = false the intersection never equals {true}, so at that valuation the left side is empty and the axiom states nothing. Together: the rule applies where one of the two comparisons is true.'

[[ruling.kore.basis]]
source = "kompiled"
locator = "kore.txt:98-100"
quote = '''\equals{SortBool{},SortGeneratedTopCell{}}( \and{SortBool{}}(\or{SortBool{}}(Lbl'Unds-GT-'Int'Unds'{}(VarX:SortInt{},\dv{SortInt{}}("0")),Lbl'Unds-LT-'Int'Unds'{}(VarX:SortInt{},\dv{SortInt{}}("-5"))),Var'Unds'Gen0:SortBool{}), \dv{SortBool{}}("true"))),'''

