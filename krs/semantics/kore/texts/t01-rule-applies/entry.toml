id = "t01-rule-applies"
kind = "text"
subject = "When a rewrite rule applies: its left side matches and its requires evaluates to true. A requires that evaluates to false, or has no value, makes the rule not apply, give no step and block nothing."
retro = ["R2"]

[text]
files = ["t01-rule-applies.k"]
kompile = "accepts"
frontend = "as-ruled"

[ruling]
status = "settled"
form = "means"
statement = "A rewrite rule applies to a configuration where its left side matches the configuration and its requires, under the match, evaluates to true. Where the requires evaluates to anything else, false or no value, the rule does not apply: it gives no step there, and the rules of a larger priority number are tried as where its left side does not match. In the text: a(1) steps to b(1) alone (10 /Int 1 >Int 0 is true; the rule of priority 40 applies, so the rule of priority 50 is not tried); a(-1) steps to c(-1) alone (10 /Int -1 >Int 0 is false); a(0) steps to c(0) alone (10 /Int 0 has no value, so the requires does not evaluate to true)."
reason = """
(1) The requires clause is a Bool term evaluated before the rule is applied, and if it does not evaluate to true the rule does not apply (user_manual.md:1154-1157). Of a rule that does not apply the manual says that a rule of a larger priority number is tried after it "has been shown not to apply" (user_manual.md:1722-1724), and rules are tried in increasing order of priority (user_manual.md:1727-1730). A rule with no priority attribute has priority 50 (user_manual.md:1748-1749), so the text's second rule has priority 50 and the first 40.
(2) At a(1) the first rule's requires is 10 /Int 1 >Int 0, that is 10 >Int 0, true: the rule applies and a(1) steps to b(1); the second rule is not tried. At a(-1) the requires is -10 >Int 0, false: the first rule does not apply, the second is tried and applies, and a(-1) steps to c(-1).
(3) At a(0): division by zero is #False (domains.md:1233-1234), so 10 /Int 0 denotes no value. A symbol's interpretation is extended to sets of arguments, which is how a term captures partiality as in 3/0 (user_manual.md:2337-2341; introduction-to-matching-logic.tex:714-716): an application to an argument that denotes the empty set denotes the empty set, the extension being taken point by point (a step, not a quoted sentence). So 10 /Int 0 >Int 0 has no value, it does not evaluate to true, and by (1) the first rule does not apply: a(0) steps to c(0) alone. That the first rule gives no step at a(0) needs no more than "does not evaluate to true"; that the second is tried is (1).
(4) What the written KORE sentence states is ruled in [ruling.kore], and agrees."""

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1154-1157 (K 7.1.337)"
quote = "Next is the *requires clause*, represented here as `REQ`. The requires clause is an additional predicate (function-like term of sort `Bool`), which is to be evaluated before applying the rule. If the requires clause does not evaluate to `true`, then the rule does not apply."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1722-1724 (K 7.1.337)"
quote = "In particular, the second rule above will only be tried after the first rule has been shown not to apply."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1727-1730 (K 7.1.337)"
quote = "In practice, each rule in your semantics is implicitly or explicitly assigned a numerical priority. Rules are tried in increasing order of priority, starting at zero and trying each increasing numerical value successively."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1748-1749 (K 7.1.337)"
quote = "There is one more rule by which priorities are assigned: a rule with no attributes indicating its priority is assigned the priority 50."

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1233-1234 (K 7.1.337)"
quote = "Compute the quotient `/Int` or modulus `%Int` of two integers using t-division, which rounds towards zero. Division by zero is `#False`."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:2337-2341 (K 7.1.337)"
quote = "In Matching Mu Logic, terms evaluate to sets of values. This is useful for both capturing partiality (as in `3/0`) and capturing non-determinism (as in `3 #Or 5`). Consequently, symbol interpretation is extended to have a collective interpretation over sets of input values."

[[ruling.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:714-716 (K 7.1.337)"
quote = '''We tacitly use the same notation $\sigma_M$ for its extension to argument sets,'''

[ruling.kore]
statement = "The first rule is one rewrite axiom whose left side is the configuration pattern and the conjunct \\equals(10 /Int X >Int 0, true) at sort Bool (kore.txt:99-107). Where 10 /Int X >Int 0 denotes false or nothing (X = 0), the equality denotes the empty set, so does the left side, and the axiom asks nothing of that instance: the written sentence gives no step there, as the manual does. The second axiom's left side has the conjunct top (kore.txt:110-116). The axioms name no other rule; priority 40 is an attribute (kore.txt:107)."

[[ruling.kore.basis]]
source = "kompiled"
locator = "kore.txt:102-104"
quote = '''\equals{SortBool{},SortGeneratedTopCell{}}( Lbl'Unds-GT-'Int'Unds'{}(Lbl'UndsSlsh'Int'Unds'{}(\dv{SortInt{}}("10"),VarX:SortInt{}),\dv{SortInt{}}("0")), \dv{SortBool{}}("true"))),'''

[[ruling.kore.basis]]
source = "kompiled"
locator = "kore.txt:107"
quote = '''priority{}("40")'''

[[ruling.kore.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:882-883 (K 7.1.337)"
quote = '''$\overline{\rho}(\varphi =_{s_1}^{s_2} \varphi') = \emptyset$ iff $\overline{\rho}(\varphi) \neq \overline{\rho}(\varphi')$'''

[[ruling.kore.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:1965-1969 (K 7.1.337)"
quote = '''$\overline{\rho}(\varphi) \subseteq \snext_M(\overline{\rho}(\varphi'))$ for any $M$-valuation $\rho$, iff for any $a\in\overline{\rho}(\varphi)$ there is some $b \in \overline{\rho}(\varphi')$ such that $a\mathrel{R_s}b$'''
