[[reading]]
name = "signed"
statement = "String2Base reads an optional sign before the digits, as String2Int does."
answer = 'String2Base("-10", 2) = -2'
consequence = "Base2String and String2Base are inverse on negative numbers too."

[[reading]]
name = "digits-only"
statement = "String2Base reads the digits of the radix only; a sign is no digit."
answer = 'String2Base("-10", 2) has no stated value'
consequence = "A consumer may compute String2Base only on strings of digits."
