id = "t173-string2base-sign"
kind = "text"
subject = 'String2Base of a string with a sign, here String2Base("-10", 2), and String2Base at a radix outside 2 to 36.'
retro = ["ST4"]

[text]
declaration = { source = "builtin-module", locator = "k-distribution/include/kframework/builtin/domains.md:1837 (K 7.1.337)", quote = "syntax Int ::= String2Base ( String , base: Int ) [function, hook(STRING.string2base)]" }
kompile = "not-run"

[ruling]
status = "unsettled"
reason = '''
What is stated. The radix can be anywhere between 2 and 36, with the digits 0 to N-1 for a radix up to 10 and the first N-10 letters beyond, of either case (domains.md:1825-1829). String2Int reads the syntax of INT, a nonempty sequence of digits optionally prefixed by a sign (1820-1822). String2Base is not total (1837). At a radix outside 2 to 36 nothing is stated.
Where the readings part. The radix sentence names the digits and does not mention a sign; the sentence before it gives String2Int a sign. Whether String2Base reads a sign is not said.'''

