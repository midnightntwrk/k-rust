id = "t111-user-generated-counter"
kind = "text"
subject = "A rule that names the cell <generatedCounter> beside a rule with a fresh variable !X: whether the frontend delivers a KORE text."
retro = ["T4"]
origin = "kcore-spec fixture e3-counter"

[text]
files = ["t111-user-generated-counter.k"]
kompile = "rejects"
frontend = "manual-silent"

[ruling]
status = "settled"
form = "rejected"
statement = "There is no KORE text: kompile 7.1.337 refuses the K text (exit 113, 'Found klabel <generatedCounter> not defined in any production'). KAST declares the cell's production as internal, a production that vanishes after parsing (kast.md:281-289); no sentence of the manual says that a rule naming the cell is refused."
reason = """
(1) KAST declares <generatedCounter> Int </generatedCounter> with the attribute internal, and its comment says the production will vanish after parsing and an actual production will be generated by the compiler later (kast.md:281-289).
(2) The text's second rule names the cell; kompile refuses it (kompile.txt). No sentence of the manual states the refusal: the statement is about what the frontend delivers, and the manual is silent on it. The comment of (1) describes the tool's handling of the production, not a meaning of the cell."""

[[ruling.basis]]
source = "builtin-module"
locator = "k-distribution/include/kframework/builtin/kast.md:281-289 (K 7.1.337)"
quote = 'this production will "vanish" after parsing finishes and not be picked up // by the compiler, which is the behavior we want in this case since an actual // production will be generated by the compiler later on. syntax GeneratedCounterCell ::= "<generatedCounter>" Int "</generatedCounter>" [cell, symbol(<generatedCounter>), internal]'

[[observe]]
file = "kompile.txt"
contains = "Found klabel <generatedCounter> not defined in any"
