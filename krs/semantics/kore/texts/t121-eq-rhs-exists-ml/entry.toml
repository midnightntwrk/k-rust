id = "t121-eq-rhs-exists-ml"
kind = "text"
subject = "A function equation whose right side is #Exists B. (B #And {B #Equals notBool X}): what it states of f."
retro = ["M1"]
origin = "kcore-spec fixture e3-eq-exists-bool-ml"

[text]
files = ["t121-eq-rhs-exists-ml.k"]
kompile = "accepts"

[ruling]
status = "settled"
form = "means"
statement = "The equation states f(X) = notBool X for every Bool X: the existential right side denotes exactly the value notBool X."
reason = '''
(1) #Exists, #And and #Equals are the connectives of ML-SYNTAX (kast.md:144, 148, 154), and the equation is written with \exists, \and and \equals (kore.txt:35-38).
(2) At a valuation, \exists B. phi denotes the union over every value b of B of what phi denotes there (introduction-to-matching-logic.tex:737-741). \and denotes the intersection (:734-736), and the equality is the whole carrier where its two sides denote the same set and empty otherwise (:880-885).
(3) notBool exchanges true and false (domains.md:1139-1140), so notBool x denotes one value. At b = notBool x the body denotes {b}; at the other value of Bool the equality is empty and so is the body. The union is {notBool x}.
(4) So f(x) = notBool x at every x of Bool. The binder's variable is a variable of the right side only; the argument X is quantified outside it.'''

[ruling.kore]
statement = 'The equation is written \implies(X0 in X, \equals(f(X0), \and(\exists B. \and(B, \equals(B, notBool X)), \top))) (kore.txt:25-39); it states what the ruling states.'

