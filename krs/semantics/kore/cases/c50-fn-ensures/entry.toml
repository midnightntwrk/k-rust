id = "c50-fn-ensures"
kind = "case"
subject = "A function equation with an ensures (the sentences of kcore-spec's f2-examples/ens.k): `half(N) => N /Int 2 ensures N >=Int 0`, whose axiom is `half(N) = \\and(N /Int 2, N >=Int 0 = true)`. The ensures is part of the right side: where the equation decides and N >=Int 0 holds, half(N) is N /Int 2; where it is false, half(N) has no value. Expected from the text: run(4) steps to done(2), a final configuration; run(-4) applies its rule with an undefined result, so it has no successor and is not final. The finals are done(2) alone."

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "pending"

[[disposition]]
implementation = "llvm"
is = "difference"
reason = """
The llvm backend does not evaluate the equation's ensures: it gives half(-4) the value -2 and \
steps run(-4) to done(-2), although -4 >Int 0 is false. The axiom kompile writes is \
half(N) = (N /Int 2 and (N >=Int 0 = true)): the ensures stands in the right side of the \
equality, so where the equation applies and N >=Int 0 is false half(N) is \\bottom, run(-4)'s \
rule applies with an undefined result, and run(-4) has no successor and is not final. The \
haskell backend gives done(2) alone, as kore.k does."""
