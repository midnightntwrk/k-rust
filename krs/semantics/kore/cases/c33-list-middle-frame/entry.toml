id = "c33-list-middle-frame"
kind = "case"
subject = "A List pattern with elements on both sides of its frame: ListItem(X) L ListItem(Y) takes the first and the last element and binds the middle to L."

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "pending"

[[disposition]]
implementation = "haskell"
is = "difference"
reason = """
The haskell backend's search stops with ErrorRewritesInstantiation: its unifier finds no \
solution for a List pattern with elements on both sides of the frame. List concatenation is \
associative, so ListItem(X) L ListItem(Y) matches every list of at least two elements, with X \
the first, Y the last and L the middle; kore.k gives r(1, 4, ListItem(2) ListItem(3)), as the \
llvm backend does."""
