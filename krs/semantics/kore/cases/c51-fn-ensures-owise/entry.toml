id = "c51-fn-ensures-owise"
kind = "case"
subject = "c50 with an [owise] equation beside the one with an ensures (the sentences of kcore-spec's f2-examples/ens-owise.k): `half(_) => 0 [owise]`. The ensures is part of the first equation's right side and never part of whether it applies: at -4 the first equation's argument pattern matches and it has no requires, so it decides, and the [owise] equation does not apply there. Expected from the text: the same as c50, done(2) alone; half(-4) has no value, not 0, so run(-4) has no successor and is not final. Reading the ensures as a requires would give done(0) too."

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "pending"

[[disposition]]
implementation = "llvm"
is = "difference"
reason = """
As for c50, the llvm backend does not evaluate the ensures and gives half(-4) the value -2. The \
first equation decides at -4 (its argument pattern matches, it has no requires), so the [owise] \
equation half(_) = 0 does not apply there: the negation kompile writes as its premise names the \
first equation's argument pattern and requires, not its ensures. half(-4) is \\bottom, not 0, \
and run(-4) has no successor; the haskell backend gives done(2) alone, as kore.k does."""
