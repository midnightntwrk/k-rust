id = "c42-total-no-equation"
kind = "case"
subject = "A function declared total that no equation applies to, used in a requires: the definition states that even(3) has a value but not which, and the rule whose requires it is applies or not as that value is true or false."
retro = ["F2"]
rests_on = ["kk:t01-rule-applies", "kk:t02-step-successors", "kk:t04-rule-priority-owise", "kk:t06-final-configuration", "kk:t11-eq-applies", "kk:t14-total-no-equation"]

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "unsettled"
reason = """
What every reading shares:
(1) even's one equation, even(I) => true requires I %Int 2 ==Int 0, states even(I) = true where its requires is true and nothing elsewhere (kk:t11-eq-applies). At 3, 3 %Int 2 is 1 (domains.md:1233-1234) and 1 ==Int 0 is false (domains.md:1324-1325), so it states nothing of even(3). even is declared function and total, so even(3) is exactly one Bool value (user_manual.md:546-551): having no value is excluded.
(2) The rule go(I) => yes(I) requires even(I) has priority 50 and the [owise] rule go(I) => no(I) has 200 (user_manual.md:1739-1741, 1748-1749). The first applies at go(3) where even(3) is true, and then the [owise] rule is not tried; where even(3) is not true the first does not apply (user_manual.md:1154-1157) and the [owise] rule does (kk:t01-rule-applies, kk:t04-rule-priority-owise). Either way go(3) has one successor, which no rule's left side matches and which is final (kk:t02-step-successors, kk:t06-final-configuration).
What the text does not determine:
(3) Which Bool value even(3) is: kk:t14-total-no-equation's question, at this very application. The readings are that entry's, with the final configuration each gives."""
interpreter = "outside"

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:546-551 (K 7.1.337)"
quote = "The `total` attribute indicates that a symbol cannot be equal to matching logic bottom; in other words, it has *at least* one value for every possible set of arguments. It can be added to a production with the `function` attribute to indicate to the symbolic reasoning engine that a given symbol is a *total function*, that is it has *exactly* one return value for every possible input."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1154-1157 (K 7.1.337)"
quote = "If the requires clause does not evaluate to `true`, then the rule does not apply."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1739-1741 (K 7.1.337)"
quote = "In fact, when you use the `owise` attribute, what you are doing is implicitly setting the priority of the rule to `200`."

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1233-1234 (K 7.1.337)"
quote = "Compute the quotient `/Int` or modulus `%Int` of two integers using t-division, which rounds towards zero. Division by zero is `#False`."

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1324-1325 (K 7.1.337)"
quote = "You can compute whether two integers are less than or equal to, less than, greater than or equal to, greater than, equal, or unequal to another integer."

[[reading]]
name = "value-true"
statement = "even(3) is true (kk:t14-total-no-equation, reading value-true)."
finals = ["yes(3)"]
consequence = "The rule of priority 50 applies at go(3), which steps to yes(3) alone."

[[reading]]
name = "value-false"
statement = "even(3) is false (kk:t14-total-no-equation, reading value-false)."
finals = ["no(3)"]
consequence = "The rule of priority 50 does not apply at go(3), and the [owise] rule steps it to no(3) alone."

[[reading]]
name = "rest"
statement = "The text does not choose: in each interpretation even(3) is true or false (kk:t14-total-no-equation, reading rest)."
answer = "Per interpretation, yes(3) where even(3) is true and no(3) where it is false: each final configuration under the condition on even(3) that selects it."
consequence = "Only what holds under both value-true and value-false is a consequence of the text: go(3) has exactly one successor, and that successor is final."

[[disposition]]
implementation = "haskell"
is = "reading:rest"
reason = "It gives yes(3) under the condition even(3) = true and no(3) under its negation: each final configuration under the condition on even(3) that selects it, which is the reading rest and cannot be compared mechanically with a list of finals."

[[disposition]]
implementation = "llvm"
is = "difference"
reason = "The llvm backend aborts on even(3), at which no equation of even applies (Called finish_rewriting with no output file specified): an error, which is no reading's answer."

[[disposition]]
implementation = "kore.k"
is = "coincides:value-false"
reason = "kore.k gives even(3), at which no equation applies, no value, total or not; the requires even(3) then does not evaluate to true and the [owise] rule gives no(3). The finals equal those of value-false, reached by taking even(3) to have no value, which the total attribute excludes (user_manual.md:546-551): no reading of the text."
