id = "c42-total-no-equation"
kind = "case"
subject = "A function declared total that no equation applies to, used in a requires: the definition states that even(3) has a value but not which; kore.k keeps the application, which is not true, so the rule does not apply and the [owise] rule does."

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "pending"

[[disposition]]
implementation = "haskell"
is = "difference"
reason = """
even is declared total and no equation applies to even(3): the definition states that even(3) \
has a value, not which. The haskell backend splits the search on it and gives yes(3) under the \
condition even(3) = true and no(3) under its negation. kore.k gives an application no equation \
applies to no value, total or not, so the requires even(3) is undefined, does not hold, and the \
[owise] rule gives no(3). A total function without an equation for its arguments is outside \
what kore.k's reading decides (README, "The fragment"); the haskell backend's two conditional \
results cover every value even(3) may have."""

[[disposition]]
implementation = "llvm"
is = "difference"
reason = """
The llvm backend aborts (Called finish_rewriting with no output file specified) on even(3), \
which no equation of even applies to, as on c11; kore.k gives no(3), as the entry for the \
haskell backend says."""
