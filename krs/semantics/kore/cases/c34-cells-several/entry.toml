id = "c34-cells-several"
kind = "case"
subject = "Several cells: rules that read and rewrite cells besides <k> in one step, a requires over a cell the rule rewrites, a cell a rule matches without rewriting it, the cells a rule does not mention kept, and the initial values the configuration declares for the cells besides <k>."
rests_on = ["kk:t01-rule-applies", "kk:t02-step-successors", "kk:t06-final-configuration", "kk:t10-fn-innermost"]

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "settled"
finals = ["<t> <k> done(4) </k> <acc> 13 </acc> <cnt> 4 </cnt> </t>"]
reason = """
(1) The configuration declares <t> holding <k>, <acc> and <cnt>; <k> holds the program and <acc> and <cnt> the values the declaration gives them, 0 and 1 (k-tutorial 15_configurations/README.md:76-79): the initial configuration is <t> <k> go(2) </k> <acc> 0 </acc> <cnt> 1 </cnt> </t>. A rule names the cells it reads or rewrites, and stands for a rule over the whole configuration in which the cells it does not name are kept as they are (user_manual.md:50-52; k-tutorial 15_configurations/README.md:165-168).
(2) go(2): the rule for go matches, with A = 0, and applies (kk:t01-rule-applies): <k> becomes step(2) and <acc> 0 +Int 10 = 10 (domains.md:1238); <cnt> is kept, 1.
(3) step(2) with <acc> 10, <cnt> 1: the rule for step(N) matches with N = 2, A = 10, C = 1, and its requires 2 >Int 0 andBool 10 <Int 100 is true (domains.md:1324-1325, 1107), the requires being evaluated under the match, at the values before the rewrite: step(1), <acc> 12, <cnt> 2 (domains.md:1232). The rule for step(0) does not match step(2). step(1) with <acc> 12, <cnt> 2: likewise step(0), <acc> 13, <cnt> 4.
(4) step(0) with <acc> 13, <cnt> 4: the rule for step(N) matches with N = 0, and 0 >Int 0 is false, so it does not apply (user_manual.md:1154-1157). step(0) => done(C) matches, reading <cnt> without rewriting it, C = 4: <k> becomes done(4), <acc> and <cnt> are kept.
(5) Each configuration has the one successor given (kk:t02-step-successors). No rule's left side matches done(4) in <k>, so <t> <k> done(4) </k> <acc> 13 </acc> <cnt> 4 </cnt> </t> is final (kk:t06-final-configuration), and it is the one final configuration."""

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:50-52 (K 7.1.337)"
quote = "K semantic rules are implicitly defined over the entire configuration structure, but omit unused cells, enabling a highly modular definitional style."

[[ruling.basis]]
source = "tutorial"
locator = "k-distribution/k-tutorial/1_basic/15_configurations/README.md:76-79 (K 7.1.337)"
quote = "Here we have declared two cells: `<k>` and `<sum>`. Unlike `<k>`, `<sum>` does not get initialized via a configuration variable, but instead is initialized statically with the value `0`."

[[ruling.basis]]
source = "tutorial"
locator = "k-distribution/k-tutorial/1_basic/15_configurations/README.md:165-168 (K 7.1.337)"
quote = "K allows you to specify any number of cells in a rule (except zero) in any order you want, and K will compile the rules into a form that matches the structure of the configuration specified by the configuration declaration."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1154-1157 (K 7.1.337)"
quote = "If the requires clause does not evaluate to `true`, then the rule does not apply."

