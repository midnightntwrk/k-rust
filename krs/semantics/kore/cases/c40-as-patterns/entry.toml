id = "c40-as-patterns"
kind = "case"
subject = "As-patterns written with #as: an alias of a Map pattern with a frame, bound to the whole map for each entry the pattern takes; an alias in a function's argument whose variable occurs earlier in the same left side, so that it matches only a value equal to that occurrence."
rests_on = ["kk:t02-step-successors", "kk:t06-final-configuration", "kk:t10-fn-innermost", "kk:t11-eq-applies", "kk:t12-eq-priority-owise", "kk:t17-nonlinear", "kk:t18-as-pattern", "kk:t34-collection-values", "kk:t38-collection-patterns"]

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "settled"
finals = ["got(1, 1 |-> 10 2 |-> 20)", "got(2, 1 |-> 10 2 |-> 20)", "r(3, 0)"]
reason = """
(1) The two rules for go have priority 50 and no requires (user_manual.md:1748-1749): at go(M0, pair(3, 3), pair(3, 4)), M0 the map of the pairs 1 |-> 10 and 2 |-> 20, each rule gives a successor for each substitution under which its left side matches (kk:t02-step-successors, kk:t38-collection-patterns).
(2) (K |-> _ _:Map) #as M matches what the map pattern matches and binds M to the matched term (kk:t18-as-pattern; user_manual.md:2097-2099). The map pattern matches M0 at each split into one pair and the rest: K = 1 with the rest 2 |-> 20, and K = 2 with the rest 1 |-> 10 (kk:t38-collection-patterns, kk:t34-collection-values). In both M is M0 itself. So the first rule gives got(1, M0) and got(2, M0).
(3) same's first equation has the left side same(pair(Y, X #as Y)): Y occurs at the first argument of pair and, through the alias, at the second, and stands for one value at both (kk:t17-nonlinear, kk:t18-as-pattern); X is bound to the second argument. At pair(3, 3) it matches with Y = X = 3: same(pair(3, 3)) = 3. At pair(3, 4) the two places hold 3 and 4, which differ, so it does not match and the [owise] equation applies: same(pair(3, 4)) = 0 (kk:t11-eq-applies, kk:t12-eq-priority-owise).
(4) The second rule matches with P = pair(3, 3), Q = pair(3, 4), and its right side r(same(P), same(Q)) denotes r(3, 0) (kk:t10-fn-innermost).
(5) No rule's left side matches got(_, _) or r(_, _); the three are final (kk:t06-final-configuration). The final configurations are got(1, M0), got(2, M0) and r(3, 0): got(1, 2 |-> 20) would need M bound to the frame, and r(3, 4) or r(3, 3) the first equation of same to match pair(3, 4), which (2) and (3) exclude."""

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:2097-2099 (K 7.1.337)"
quote = "In this case, Pattern, including any variables, is matched and the resulting variables are added to the substitution if matching succeeds."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:2238-2240 (K 7.1.337)"
quote = "// 0 or more elements in any order plus by 0 or 1 variables of sort Map // in any order K1 |-> E1 K2 |-> E2 M::Map K3 |-> E3 K4 |-> E4"

[[ruling.basis]]
