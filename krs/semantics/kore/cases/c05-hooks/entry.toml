id = "c05-hooks"
kind = "case"
subject = "The Int and Bool hooks of the fragment, on negative operands too (truncating /Int and %Int)."
rests_on = ["kk:t01-rule-applies", "kk:t02-step-successors", "kk:t06-final-configuration", "kk:t10-fn-innermost", "kk:t31-int-division", "kk:t32-keq-ite"]

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "settled"
finals = ["q(false, false, false, false, false, true, false, true, true)"]
reason = """
(1) go(-7, 2): the rule's requires -7 <Int 0 is true (domains.md:1324-1325), so it applies (kk:t01-rule-applies). Its right side denotes r(-5, -9, -14, -3, -1): -7 +Int 2 = -5 and -7 -Int 2 = -9 (domains.md:1238), -7 *Int 2 = -14 (domains.md:1232), -7 /Int 2 = -3, the quotient rounded towards zero, and -7 %Int 2 = -7 -Int 2 *Int -3 = -1, of the sign of the dividend (domains.md:1233-1234; kk:t31-int-division).
(2) r(-5, -9, -14, -3, -1): the requires #if -5 >Int 0 #then false #else true #fi is #if false #then false #else true #fi, which is true (domains.md:2314-2316; kk:t32-keq-ite), so the rule applies. Its right side denotes q of: -5 <Int -9 false; -5 <=Int -9 false; -14 >Int -3 false; -14 >=Int -3 false; -3 ==Int -1 false; -3 =/=Int -1 true (domains.md:1324-1325); false andBool false = false; -5 >Int -9 orBool -14 <Int -3 = true orBool true = true; notBool (-1 ==Int 0) = notBool false = true (domains.md:1106-1109).
(3) Each configuration has the one successor given (kk:t02-step-successors), and no rule's left side matches q(...), which is final (kk:t06-final-configuration). The final configurations are q(false, false, false, false, false, true, false, true, true) alone."""

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1232-1234 (K 7.1.337)"
quote = "* Compute the product `*Int` of two integers. * Compute the quotient `/Int` or modulus `%Int` of two integers using t-division, which rounds towards zero. Division by zero is `#False`."

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1238 (K 7.1.337)"
quote = "Compute the sum `+Int` or difference `-Int` of two integers."

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1324-1325 (K 7.1.337)"
quote = "You can compute whether two integers are less than or equal to, less than, greater than or equal to, greater than, equal, or unequal to another integer."

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1106-1109 (K 7.1.337)"
quote = "* Negate a boolean value. * AND two boolean values. * XOR two boolean values. * OR two boolean values."

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:2314-2316 (K 7.1.337)"
quote = "`#if #then #else #fi` - polymorphic conditional function. If the first argument evaluates to `true`, the second argument is returned. Otherwise, the third argument is returned."
