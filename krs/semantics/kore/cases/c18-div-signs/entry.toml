id = "c18-div-signs"
kind = "case"
subject = "/Int truncates toward zero and %Int takes the sign of the dividend, for each sign of the operands."
rests_on = ["kk:t01-rule-applies", "kk:t02-step-successors", "kk:t06-final-configuration", "kk:t10-fn-innermost", "kk:t31-int-division"]

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "settled"
finals = ["r(3, 1, -3, -1, -3, 1, 3, -1)"]
reason = """
(1) For B not 0, A /Int B is the quotient of A by B rounded towards zero, and A %Int B is A -Int B *Int (A /Int B) (domains.md:1233-1234; kk:t31-int-division).
(2) go(7, 2): the one rule applies (kk:t01-rule-applies). 0 -Int 7 = -7 and 0 -Int 2 = -2 (domains.md:1238). The eight operands: 7 /Int 2 = 3 and 7 %Int 2 = 7 - 6 = 1; -7 /Int 2 = -3 and -7 %Int 2 = -7 + 6 = -1; 7 /Int -2 = -3 and 7 %Int -2 = 7 - 6 = 1; -7 /Int -2 = 3 and -7 %Int -2 = -7 + 6 = -1. The right side denotes r(3, 1, -3, -1, -3, 1, 3, -1) (kk:t10-fn-innermost).
(3) go(7, 2) has that one successor (kk:t02-step-successors), and no rule's left side matches r(...), which is final (kk:t06-final-configuration). The final configurations are r(3, 1, -3, -1, -3, 1, 3, -1) alone; Euclidean division would give -4 and 1 at -7 and 2, which (1) excludes."""

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1233-1234 (K 7.1.337)"
quote = "Compute the quotient `/Int` or modulus `%Int` of two integers using t-division, which rounds towards zero. Division by zero is `#False`."

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1238 (K 7.1.337)"
quote = "Compute the sum `+Int` or difference `-Int` of two integers."
