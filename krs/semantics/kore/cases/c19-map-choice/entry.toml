id = "c19-map-choice"
kind = "case"
subject = "A rule whose left side is K |-> V M, with M a frame variable, matches every entry of the map: one successor per entry, each with the rest of the map bound to M."
rests_on = ["kk:t02-step-successors", "kk:t06-final-configuration", "kk:t34-collection-values", "kk:t38-collection-patterns"]

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "settled"
finals = ["out(1, 10, 2 |-> 20 3 |-> 30)", "out(2, 20, 1 |-> 10 3 |-> 30)", "out(3, 30, 1 |-> 10 2 |-> 20)"]
reason = """
(1) The map of s(1 |-> 10 2 |-> 20 3 |-> 30) is the map of three pairs, one for each key (kk:t34-collection-values).
(2) The pattern K:Int |-> V:Int M:Map, one element pattern and a frame, matches the map at every split of it into one pair and the rest: K = 1, V = 10 with M the map of 2 |-> 20 and 3 |-> 30; K = 2, V = 20 with M of 1 |-> 10 and 3 |-> 30; K = 3, V = 30 with M of 1 |-> 10 and 2 |-> 20 (kk:t38-collection-patterns; user_manual.md:2238-2240). The rule has no requires and gives a successor for each such substitution (kk:t02-step-successors, kk:t38-collection-patterns).
(3) No rule's left side matches out(_, _, _); the three successors are final (kk:t06-final-configuration). The final configurations are those three."""

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:2238-2240 (K 7.1.337)"
quote = "// 0 or more elements in any order plus by 0 or 1 variables of sort Map // in any order K1 |-> E1 K2 |-> E2 M::Map K3 |-> E3 K4 |-> E4"

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:223-225 (K 7.1.337)"
quote = "The `Map` sort represents a generalized associative array. Each key can be paired with an arbitrary value, and can be used to reference its associated value. Multiple bindings for the same key are not allowed."
