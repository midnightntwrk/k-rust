id = "c24-map-fn-pattern"
kind = "case"
subject = "Function equations whose argument pattern is K |-> V M: total sums the values, whichever entry each step takes; keyOfBig takes the entry whose value satisfies its requires, which is not the first entry of the map, and its [owise] equation applies to no map that has such an entry."
rests_on = ["kk:t01-rule-applies", "kk:t02-step-successors", "kk:t06-final-configuration", "kk:t10-fn-innermost", "kk:t11-eq-applies", "kk:t12-eq-priority-owise", "kk:t34-collection-values", "kk:t38-collection-patterns"]

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "settled"
finals = ["r(30, 2)"]
reason = """
(1) M0 is the map of 1 |-> 10 and 2 |-> 20 (kk:t34-collection-values). An equation states its right side at every substitution under which its argument pattern denotes the argument and its requires is true (kk:t11-eq-applies); a pattern of one element and a frame denotes a map at each split of it into one pair and the rest (kk:t38-collection-patterns).
(2) total: total(.Map) = 0, and total(_:Int |-> V:Int M:Map) = V +Int total(M) at each split. At M0 the two splits give total(M0) = 10 +Int total(2 |-> 20) and total(M0) = 20 +Int total(1 |-> 10); at a map of one pair the one split gives total(2 |-> 20) = 20 +Int total(.Map) = 20 and total(1 |-> 10) = 10 (domains.md:1238). Both splits give total(M0) = 30, so the equations agree and total(M0) = 30.
(3) keyOfBig: the first equation, keyOfBig(K:Int |-> V:Int _:Map) = K requires V >Int 15, matches M0 at both splits; its requires is false at V = 10 and true at V = 20 (domains.md:1324-1325), so it applies at the split of key 2 and states keyOfBig(M0) = 2, and states nothing at the split of key 1. The [owise] equation applies only where the first has been shown not to apply (kk:t12-eq-priority-owise; user_manual.md:1711-1713), and the first applies at M0: keyOfBig(M0) = 2, not 0.
(4) The rule matches go(M0) and applies (kk:t01-rule-applies); its right side denotes r(30, 2) (kk:t10-fn-innermost). go(M0) has that one successor (kk:t02-step-successors), and no rule's left side matches r(30, 2), which is final (kk:t06-final-configuration). The final configurations are r(30, 2) alone."""

