id = "c30-list-positions"
kind = "case"
subject = "List patterns match by position: ListItem(X) L takes the first element and L ListItem(X) the last; a pattern without a frame matches only a list of exactly its length."
rests_on = ["kk:t02-step-successors", "kk:t06-final-configuration", "kk:t34-collection-values", "kk:t38-collection-patterns"]

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "settled"
finals = ["r(1, ListItem(2) ListItem(3))", "r(3, ListItem(3) ListItem(1) ListItem(2))", "d(ListItem(1) ListItem(2) ListItem(3))"]
reason = """
(1) L0 is the list of 1, 2 and 3 in that order, the order counting (kk:t34-collection-values; domains.md:919). The three rules for go have priority 50 and no requires (user_manual.md:1748-1749): go(L0) has the successors a(L0), b(L0) and d(L0) (kk:t02-step-successors).
(2) In a list pattern the element patterns take the items at their positions and the frame the items between (kk:t38-collection-patterns; user_manual.md:2221-2223). ListItem(X:Int) L:List matches L0 with X = 1, the first item, and L the list of 2 and 3, and at no other substitution: a(L0) steps to r(1, ListItem(2) ListItem(3)). L:List ListItem(X:Int) matches with X = 3, the last item, and L the list of 1 and 2: b(L0) steps to r(3, ListItem(3) ListItem(1) ListItem(2)).
(3) ListItem(X:Int) ListItem(_:Int) has two element patterns and no frame: it denotes the lists of exactly two items, and L0 has three, so the rule for d does not match and d(L0) is final (kk:t06-final-configuration).
(4) No rule's left side matches r(_, _). The final configurations are the two of (2) and d(L0): r(2, _) would need an element pattern to take an item at another position, which (2) excludes."""

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:919 (K 7.1.337)"
quote = "The `List` sort is an ordered collection that may contain duplicate elements."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:2221-2223 (K 7.1.337)"
quote = "// 0 or more elements followed by 0 or 1 variables of sort List followed by // 0 or more elements ListItem(E1) ListItem(E2) L:List ListItem(E3) ListItem(E4)"

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1748-1749 (K 7.1.337)"
quote = "There is one more rule by which priorities are assigned: a rule with no attributes indicating its priority is assigned the priority 50."
