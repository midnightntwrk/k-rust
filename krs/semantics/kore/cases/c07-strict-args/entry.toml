id = "c07-strict-args"
kind = "case"
subject = "A function's argument is evaluated before its equations are matched: f(g(1)) matches f(kk())."
rests_on = ["kk:t01-rule-applies", "kk:t02-step-successors", "kk:t06-final-configuration", "kk:t10-fn-innermost", "kk:t11-eq-applies", "kk:t12-eq-priority-owise"]

[text]
files = ["def.k", "pgm"]
kompile = "accepts"

[ruling]
status = "settled"
finals = ["res(30)"]
reason = """
(1) g(1) = kk() by the equation g(1) => kk(), of priority 50, which applies at 1; the [owise] equation is not tried there (kk:t11-eq-applies, kk:t12-eq-priority-owise). At 2 the argument pattern 1 does not match, so the [owise] equation applies: g(2) = mm(). g(1 +Int 1) is g(2) (domains.md:1238).
(2) An application whose arguments each have one value denotes the application at those values (kk:t10-fn-innermost). So f(g(1)) denotes what f(kk()) does, and the equation f(kk()) => 10 applies at kk(): f(g(1)) = 10. Likewise f(g(1 +Int 1)) = f(mm()) = 20. The argument pattern kk() of f's equation is matched against the value of g(1), not against the term g(1).
(3) The one rule matches go(1) and applies (kk:t01-rule-applies); its right side denotes res(10 +Int 20) = res(30). go(1) has that one successor (kk:t02-step-successors), and no rule's left side matches res(30), which is final (kk:t06-final-configuration). The final configurations are res(30) alone."""

[[ruling.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:727-730 (K 7.1.337)"
quote = '''\item $\overline{\rho}(x) = \{\rho(x)\}$, for all $x\in\Var_s$ \item $\overline{\rho}(\sigma(\varphi_{1},\ldots,\varphi_{n}))= \sigma_M(\overline{\rho}(\varphi_1),\ldots \overline{\rho}(\varphi_n))$'''

