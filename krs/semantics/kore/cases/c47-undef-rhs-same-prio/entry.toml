id = "c47-undef-rhs-same-prio"
kind = "case"
subject = "Two rules of one priority apply, one with an undefined right side: the other's successor is kept."
rests_on = ["kk:t02-step-successors", "kk:t06-final-configuration", "kk:t10-fn-innermost", "kk:t31-int-division"]

[text]
files = ["def.k", "pgm"]
kompile = "accepts"
frontend = "differs"
frontend_difference = "The manual gives a(1) no successor by the first rule (user_manual.md:1166-1173); the first axiom kompile writes has b(X /Int 0) in its right side (kore.txt:104), which denotes nothing at every X, and read as a rewrite axiom it is false in every model where a(x) in the k cell is an element: as written the text has no model holding a(1), rather than one where a(1) has the one successor c(1)."

[ruling]
status = "settled"
finals = ["c(1)"]
reason = """
(1) Both rules have priority 50 (user_manual.md:1748-1749), and both left sides match a(1), with no requires. The successors of a(1) are the results of the rules that apply at the least priority number at which some rule applies (kk:t02-step-successors). Since both rules have the one number 50, the second rule is tried at a(1) whatever the first rule does there, and it applies: c(1) is a successor.
(2) The first rule's right side is b(1 /Int 0). Division by zero has no value (domains.md:1233-1234; kk:t31-int-division), and b applied to an argument that denotes nothing denotes nothing (kk:t10-fn-innermost; user_manual.md:2337-2341). The transition a rule represents ends in a state RHS #And ENS (user_manual.md:1166-1173); where that pattern has no value there is no such state, so the first rule gives a(1) no successor, and b(n) is reached for no n.
(3) So a(1) has the one successor c(1). No rule's left side matches c(1), so it is final (kk:t06-final-configuration), and a(1), having a successor, is not. The final configurations are c(1) alone.
(4) The written sentences state more than (2): [ruling.kore], and frontend_difference."""

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1166-1173 (K 7.1.337)"
quote = "Overall, the transition represented by such a rule is from a state `LHS #And REQ` ending in a state `RHS #And ENS`. ... Build the new term `alpha(RHS #And ENS)`, and check if it's satisfiable."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:1748-1749 (K 7.1.337)"
quote = "There is one more rule by which priorities are assigned: a rule with no attributes indicating its priority is assigned the priority 50."

[[ruling.basis]]
source = "domains"
locator = "k-distribution/include/kframework/builtin/domains.md:1233-1234 (K 7.1.337)"
quote = "Compute the quotient `/Int` or modulus `%Int` of two integers using t-division, which rounds towards zero. Division by zero is `#False`."

[[ruling.basis]]
source = "manual"
locator = "docs/user_manual.md:2337-2341 (K 7.1.337)"
quote = "In Matching Mu Logic, terms evaluate to sets of values. This is useful for both capturing partiality (as in `3/0`) and capturing non-determinism (as in `3 #Or 5`). Consequently, symbol interpretation is extended to have a collective interpretation over sets of input values."

[ruling.kore]
statement = "Each rule is one rewrite axiom, of one priority (kore.txt:99-105, 108-114). The right side of the first holds X /Int 0 (kore.txt:104), which denotes nothing at every X, so the first axiom holds only where its left side has no element; a is a constructor with a functional axiom (kore.txt:60), so the written sentences have no model in which a(1) in the k cell is an element, while the manual's transition gives a(1) the one successor c(1)."

[[ruling.kore.basis]]
source = "kompiled"
locator = "kore.txt:104"
quote = '''Lblb'LParUndsRParUnds'CASE-SYNTAX'Unds'S'Unds'Int{}(Lbl'UndsSlsh'Int'Unds'{}(VarX:SortInt{},\dv{SortInt{}}("0")))'''

[[ruling.kore.basis]]
source = "kompiled"
locator = "kore.txt:60"
quote = '''axiom{R} \exists{R} (Val:SortS{}, \equals{SortS{}, R} (Val:SortS{}, Lbla'LParUndsRParUnds'CASE-SYNTAX'Unds'S'Unds'Int{}(K0:SortInt{}))) [functional{}()]'''

[[ruling.kore.basis]]
source = "matching-logic"
locator = "haskell-backend/docs/introduction-to-matching-logic.tex:1965-1969 (K 7.1.337)"
quote = '''$\overline{\rho}(\varphi) \subseteq \snext_M(\overline{\rho}(\varphi'))$ for any $M$-valuation $\rho$, iff for any $a\in\overline{\rho}(\varphi)$ there is some $b \in \overline{\rho}(\varphi')$ such that $a\mathrel{R_s}b$'''

[[disposition]]
implementation = "llvm"
is = "difference"
reason = """
The llvm backend aborts on X /Int 0 in the right side of one of two rules of one priority \
([hook_INT_tdiv]: Division by zero). That rule applies with an undefined result, which is no \
successor; the other rule of the same priority applies with c(1), which is the one final \
configuration."""
