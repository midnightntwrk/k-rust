# Mutations of kore.k: each is a wrong reading of KORE's semantics (`misunderstanding`).
#
# Every mutation is killed by a case (kink.lock, kill-matrix.json), or is marked equivalent
# (`expect = "survive"`) with the argument in its `misunderstanding`. Each `misunderstanding` ends
# with `[premise: NAME, ...]`: the premises of kore.k's reading (its header; README.md, "The
# reading of KORE") that the mutation breaks. tools/test_mutations.py checks both. The premises:
#
#   innermost: a function application is evaluated innermost, arguments first; an undefined argument makes it undefined; a constructor application is a value
#   equation: an equation applies when its argument patterns match and its requires evaluates to true; one applicable equation of the least priority gives the result ([owise] is priority 200, no attribute 50); an application no equation applies to has no value
#   rule: a rewrite rule applies when its left side matches and its requires evaluates to true; the successors are the defined results of the applicable rules of the least priority; a rule whose result is undefined still blocks the rules of larger priority
#   order: equations and rules are tried by ascending priority, the equations of one priority in the order of the text, and the first that applies decides
#   final: a configuration is final when no rule applies to it; one to which rules apply, all with undefined results, has no successor and is not final; an undefined term is no configuration
#   rule-ensures: a rule's ensures is part of its result: where it is not true the rule has applied with an empty result
#   equation-ensures: an equation's ensures is part of its right side: where the equation applies and it is not true the application has no value, and no other equation gives one
#   total: a function declared total is evaluated as any other
#   matching: matching is syntactic up to injections along the reflexive-transitive closure of the stated subsorts; injections compose; a variable seen twice is bound to equal values; an as-pattern binds its variable to what its pattern matches
#   hooks: a hook is strict and computes the operation its hook names; /Int and %Int are undefined on a zero divisor
#   keq: ==K and =/=K compare two values, and equal values are equal terms
#   string-bool: a String domain value is its text; ==String is the equality of texts, <String their lexicographic order, ==Bool the equality of Bool values
#   tokens: a domain value of a token sort is a value of that sort; a sort predicate isS is a function with the equations kompile writes
#   collections: a Map, Set or List value is canonical; _Map_ and _Set_ are defined on disjoint maps and sets only; _List_ is total, associative and not commutative; a lookup of a missing key is undefined; a collection is strict in its elements
#   collection-patterns: a collection pattern of element patterns and at most one frame matches every split of its subject; a rule gives one result for each substitution whose requires holds, an equation the result of the first
#   cells: a cell collection is a Map from its key cell to its instances
#
# No mutation breaks `total`: it has no rule of its own in kore.k, where a total function is
# evaluated by the rules of every function (`equation`).

# --- priorities and [owise] ---------------------------------------------------------------

[[mutation]]
id = "owise-first"
misunderstanding = "an [owise] axiom is tried first (priority 0) instead of last [premise: equation, rule]"
  [[mutation.edit]]
  rule = "KORE.prio-owise"
  find = "=> 200"
  replace = "=> 0"

[[mutation]]
id = "owise-as-default"
misunderstanding = "[owise] is read as an ordinary axiom of the default priority 50 [premise: equation, rule]"
  [[mutation.edit]]
  rule = "KORE.prio-owise"
  find = "=> 200"
  replace = "=> 50"

[[mutation]]
id = "priority-ignored"
misunderstanding = "the priority attribute is ignored: every axiom without [owise] has priority 50 [premise: equation, rule]"
  [[mutation.edit]]
  rule = "KORE.prio-given"
  find = "=> P"
  replace = "=> 50"

[[mutation]]
id = "rule-owise-ignored"
misunderstanding = "[owise] is honoured for function equations but ignored for rewrite rules [premise: rule]"
  [[mutation.edit]]
  rule = "KORE.rprio"
  find = "=> prio(P, O)"
  replace = "=> P"

[[mutation]]
id = "fn-owise-ignored"
misunderstanding = "[owise] is honoured for rewrite rules but ignored for function equations [premise: equation]"
  [[mutation.edit]]
  rule = "KORE.cprio"
  find = "=> prio(P, O)"
  replace = "=> P"

[[mutation]]
id = "rule-priority-reversed"
misunderstanding = "among applicable rewrite rules the largest priority number wins [premise: rule]"
  [[mutation.edit]]
  rule = "KORE.rprio"
  find = "=> prio(P, O)"
  replace = "=> 0 -Int prio(P, O)"

[[mutation]]
id = "fn-priority-reversed"
misunderstanding = "among applicable equations the largest priority number wins [premise: equation]"
  [[mutation.edit]]
  rule = "KORE.cprio"
  find = "=> prio(P, O)"
  replace = "=> 0 -Int prio(P, O)"

[[mutation]]
id = "fn-first-applicable"
misunderstanding = "equations are tried in the order of the text and the first applicable one gives the value, whatever the priorities [premise: equation]"
  [[mutation.edit]]
  rule = "KORE.cprio"
  find = "=> prio(P, O)"
  replace = "=> 0"

[[mutation]]
id = "fn-last-of-priority"
misunderstanding = "among applicable equations of the least priority the last one gives the value. Equivalent on every consistent object definition, by this argument: two equations of one priority that both apply with different values make the definition inconsistent (the function would have two values), so on a consistent object definition the first and the last applicable equation of a priority agree; no case of a consistent definition kills it [premise: order]"
expect = "survive"
  [[mutation.edit]]
  rule = "KORE.else-some"
  find = "orElse(some(T), _, _, _, _) => some(T)"
  replace = "orElse(some(T), D, As, Cs, P) => #if tryAt(D, As, Cs, P) ==K none #then some(T) #else tryAt(D, As, Cs, P) #fi"

[[mutation]]
id = "rule-priority-ignored"
misunderstanding = "every applicable rewrite rule gives a successor, whatever its priority [premise: rule]"
  [[mutation.edit]]
  rule = "KORE.rprio"
  find = "=> prio(P, O)"
  replace = "=> 0"

# --- requires -----------------------------------------------------------------------------

[[mutation]]
id = "rule-requires-ignored"
misunderstanding = "a rewrite rule's requires is not checked: a failing requires is treated as true [premise: rule]"
  [[mutation.edit]]
  rule = "KORE.fire-holds"
  find = "eval(D, inst(R, B)) ==K bv(true)"
  replace = "true"
  [[mutation.edit]]
  rule = "KORE.fire-refuted"
  find = "eval(D, inst(R, B)) =/=K bv(true)"
  replace = "false"

[[mutation]]
id = "fn-requires-ignored"
misunderstanding = "an equation's requires is not checked: a failing requires is treated as true [premise: equation]"
  [[mutation.edit]]
  rule = "KORE.try-holds"
  find = "eval(D, inst(Req, B)) ==K bv(true)"
  replace = "true"
  [[mutation.edit]]
  rule = "KORE.try-refuted"
  find = "eval(D, inst(Req, B)) =/=K bv(true)"
  replace = "false"

[[mutation]]
id = "rule-undefined-requires-holds"
misunderstanding = "a rewrite rule applies unless its requires is false: an undefined requires holds [premise: rule]"
  [[mutation.edit]]
  rule = "KORE.fire-holds"
  find = "==K bv(true)"
  replace = "=/=K bv(false)"
  [[mutation.edit]]
  rule = "KORE.fire-refuted"
  find = "=/=K bv(true)"
  replace = "==K bv(false)"

[[mutation]]
id = "fn-undefined-requires-holds"
misunderstanding = "an equation applies unless its requires is false: an undefined requires holds [premise: equation]"
  [[mutation.edit]]
  rule = "KORE.try-holds"
  find = "==K bv(true)"
  replace = "=/=K bv(false)"
  [[mutation.edit]]
  rule = "KORE.try-refuted"
  find = "=/=K bv(true)"
  replace = "==K bv(false)"

# --- subsorts and injections -------------------------------------------------------------

[[mutation]]
id = "subsort-dropped"
misunderstanding = "inj{A,B}(P) matches only injections from A itself: a subsort injection is dropped from matching [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.m-inj-sub"
  delete = true

[[mutation]]
id = "subsort-not-transitive"
misunderstanding = "only the stated subsorts hold: the subsort relation is not closed under transitivity [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.above-hit"
  find = "Y ==Int B orBool above(Y, B, All, All, F)"
  replace = "Y ==Int B"

[[mutation]]
id = "subsort-unchecked"
misunderstanding = "an injected value matches a pattern of any sort below the same target, whatever its own sort [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.m-inj-sub"
  find = " andBool leq(C, A, S)"
  replace = ""

[[mutation]]
id = "subsort-reversed"
misunderstanding = "the subsort relation is read backwards when matching an injection [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.m-inj-sub"
  find = "leq(C, A, S)"
  replace = "leq(A, C, S)"

[[mutation]]
id = "subsort-walk-out-holds"
misunderstanding = "a walk of the subsort table that has taken as many entries as the table holds is read as having reached the sort sought: a sort from which a path of the table's length starts is read as below every sort [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.above-dry"
  find = "=> false"
  replace = "=> true"

[[mutation]]
id = "inj-not-composed"
misunderstanding = "inj{A,B}(inj{C,A}(V)) is kept nested instead of being inj{C,B}(V) [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.inj-compose"
  delete = true

[[mutation]]
id = "inj-composed-outer-source"
misunderstanding = "composing injections keeps the outer source sort: inj{A,B}(inj{C,A}(V)) is inj{A,B}(V) [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.inj-compose"
  find = "mkInj(_, B, ij(C, _, T)) => ij(C, B, T)"
  replace = "mkInj(A, B, ij(_, _, T)) => ij(A, B, T)"

# --- matching ------------------------------------------------------------------------------

[[mutation]]
id = "nonlinear-ignored"
misunderstanding = "a variable seen twice in a left side is matched independently; the first binding is kept [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.bind-same"
  find = "requires T ==K U"
  replace = ""
  [[mutation.edit]]
  rule = "KORE.bind-clash"
  delete = true

[[mutation]]
id = "dv-any-value"
misunderstanding = "a domain value in a pattern matches any domain value of its sort [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.m-int"
  find = " requires I ==Int J"
  replace = ""

[[mutation]]
id = "bool-dv-any-value"
misunderstanding = "a Bool domain value in a pattern matches either Bool [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.m-bool"
  find = " requires X ==Bool Y"
  replace = ""

[[mutation]]
id = "symbol-unchecked"
misunderstanding = "an application pattern matches an application of any symbol with arguments that match [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.m-app"
  find = " requires F ==Int G"
  replace = ""

# --- evaluation and undefinedness ------------------------------------------------------------

[[mutation]]
id = "args-unevaluated"
misunderstanding = "applications are not evaluated innermost: an application's arguments are left as built [premise: innermost]"
  [[mutation.edit]]
  rule = "KORE.ev-app"
  find = "apply(D, F, evalTs(D, As))"
  replace = "apply(D, F, As)"

[[mutation]]
id = "init-unevaluated"
misunderstanding = "the initial term's function applications are not evaluated before the first step [premise: innermost]"
  [[mutation.edit]]
  rule = "KORE.init"
  find = "start(D, eval(D, T))"
  replace = "start(D, T)"

[[mutation]]
id = "rule-rhs-unevaluated"
misunderstanding = "a rewrite rule's right side is a configuration as built: its function applications are not evaluated [premise: innermost]"
  [[mutation.edit]]
  rule = "KORE.fire-holds"
  find = "=> eval(D, inst(Rhs, B)) ;"
  replace = "=> inst(Rhs, B) ;"

[[mutation]]
id = "undefined-arg-passed"
misunderstanding = "an undefined argument does not make an application undefined: functions are applied to it [premise: innermost]"
  [[mutation.edit]]
  rule = "KORE.apply-bot"
  delete = true
  [[mutation.edit]]
  rule = "KORE.apply-look"
  find = "requires notBool hasBot(As)"
  replace = ""

[[mutation]]
id = "no-equation-kept"
misunderstanding = "a function application no equation applies to stays as it is, a value, instead of having no value (bot); the equations leave such a point open, so the mutant differs from the HookParams.none member of KCore's family, which kore.k is, not from the text [premise: equation]"
  [[mutation.edit]]
  rule = "KORE.result-none"
  find = "result(_, _, none) => bot"
  replace = "result(F, As, none) => ap(F, As)"

[[mutation]]
id = "ite-lazy"
misunderstanding = "#if is evaluated lazily: an undefined branch it does not select does not make it undefined [premise: hooks]"
  [[mutation.edit]]
  rule = "KORE.hook-bot"
  find = "requires hasBot(As)"
  replace = "requires hasBot(As) andBool O =/=Int 30"
  [[mutation.edit]]
  rule = "KORE.hook-bot"
  find = "strictHook(_, As)"
  replace = "strictHook(O, As)"
  [[mutation.edit]]
  rule = "KORE.hook-def"
  find = "requires notBool hasBot(As)"
  replace = "requires notBool hasBot(As) orBool O ==Int 30"

[[mutation]]
id = "hook-undefined-is-zero"
misunderstanding = "a hook applied outside its domain (a division by zero) gives 0 instead of \\bottom [premise: hooks]"
  [[mutation.edit]]
  rule = "KORE.op-undef"
  find = "=> bot"
  replace = "=> iv(0)"

[[mutation]]
id = "tdiv-as-ediv"
misunderstanding = "INT.tdiv (/Int) is read as Euclidean division [premise: hooks]"
  [[mutation.edit]]
  rule = "KORE.op-div"
  find = "X /Int Y"
  replace = "X divInt Y"

[[mutation]]
id = "tmod-as-emod"
misunderstanding = "INT.tmod (%Int) is read as the Euclidean remainder [premise: hooks]"
  [[mutation.edit]]
  rule = "KORE.op-mod"
  find = "X %Int Y"
  replace = "X modInt Y"

# --- steps and final configurations ---------------------------------------------------------

[[mutation]]
id = "nondeterminism-first-match"
misunderstanding = "non-determinism collapsed: only the first applicable rule of the least priority gives a successor [premise: rule]"
  [[mutation.edit]]
  rule = "KORE.drop-keep"
  find = "=> T ; drop(X, Ts)"
  replace = "=> T ; .Ts"

[[mutation]]
id = "undefined-step-is-final"
misunderstanding = "a configuration whose applicable rules all have undefined results is final [premise: final]"
  [[mutation.edit]]
  rule = "KORE.visit-step"
  find = "visit(D, _, next(Ss), Fr, Seen, F) => push(D, Ss, Fr, Seen, F)"
  replace = "visit(D, T, next(Ss), Fr, Seen, F) => push(D, Ss, Fr, Seen, #if Ss ==K .Ts #then insert(T, F) #else F #fi)"

[[mutation]]
id = "undefined-result-does-not-block"
misunderstanding = "a rule whose result is undefined does not apply, so it does not block rules of larger priority [premise: rule]"
  [[mutation.edit]]
  rule = "KORE.fa-take"
  find = "app(fire(D, L, R, Rhs, T),"
  replace = "app(drop(bot, fire(D, L, R, Rhs, T)),"

[[mutation]]
id = "bottom-is-configuration"
misunderstanding = "an undefined result is a successor configuration (\\bottom is a state) [premise: rule]"
  [[mutation.edit]]
  rule = "KORE.step-some"
  find = "next(drop(bot, R ; Rs))"
  replace = "next(R ; Rs)"

[[mutation]]
id = "undefined-result-empties-step"
misunderstanding = "an undefined result among the rules of the least priority that apply makes the whole step undefined: the defined results of the other rules of that priority are dropped [premise: rule]"
  [[mutation.edit]]
  rule = "KORE.step-some"
  find = "next(drop(bot, R ; Rs))"
  replace = "#if hasBot(R ; Rs) #then next(.Ts) #else next(R ; Rs) #fi"

[[mutation]]
id = "undefined-init-is-final"
misunderstanding = "an undefined initial term is itself a final configuration [premise: final]"
  [[mutation.edit]]
  rule = "KORE.init-bot"
  find = "done(.Ts)"
  replace = "done(bot ; .Ts)"

# --- equality, tokens and as-patterns ----------------------------------------------------

[[mutation]]
id = "keq-undefined-false"
misunderstanding = "==K is total in the sense of always giving a Bool: an undefined operand makes it false instead of undefined [premise: hooks, keq]"
  [[mutation.edit]]
  rule = "KORE.hook-bot"
  find = "strictHook(_, As) => bot requires hasBot(As)"
  replace = "strictHook(O, As) => bot requires hasBot(As) andBool O =/=Int 70"
  [[mutation.edit]]
  rule = "KORE.hook-def"
  find = "requires notBool hasBot(As)"
  replace = "requires notBool hasBot(As) orBool O ==Int 70"

[[mutation]]
id = "token-any-value"
misunderstanding = "a token literal in a pattern matches any token of its sort [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.m-tok"
  find = "requires S ==Int T andBool X ==String Y"
  replace = "requires S ==Int T"

[[mutation]]
id = "token-sort-ignored"
misunderstanding = "a token is its text: tokens of two sorts with one text are one value, in matching and in ==K, whatever the sorts of the tokens and of the injections that place them in a larger sort [premise: tokens, keq]"
  [[mutation.edit]]
  rule = "KORE.m-tok"
  find = "requires S ==Int T andBool X ==String Y"
  replace = "requires X ==String Y"
  [[mutation.edit]]
  rule = "KORE.cmp-tok"
  find = "lex(cmpI(S, T), "
  replace = "lex(0, "
  [[mutation.edit]]
  rule = "KORE.cmp-inj"
  find = "=> lex(cmpI(A, C), lex(cmpI(B, E), cmp(T, U)))"
  replace = "=> cmp(T, U)"

[[mutation]]
id = "as-first-subst-only"
misunderstanding = "an as-pattern binds its variable under the first substitution of its pattern only, so an alias of a collection pattern with a frame gives one successor instead of one for each split [premise: matching, collection-patterns]"
  [[mutation.edit]]
  rule = "KORE.as-bind"
  find = "=> cat(bindVar(X, T, B, look(X, B)), bindAfter(X, T, Ms))"
  replace = "=> bindVar(X, T, B, look(X, B))"

[[mutation]]
id = "as-alias-rebinds"
misunderstanding = "an as-pattern's variable is bound afresh even when the left side has already bound it, instead of having to equal that binding [premise: matching]"
  [[mutation.edit]]
  rule = "KORE.as-bind"
  find = "cat(bindVar(X, T, B, look(X, B)),"
  replace = "cat(bindVar(X, T, B, none),"

# --- ensures --------------------------------------------------------------------------------

[[mutation]]
id = "ensures-ignored"
misunderstanding = "an ensures is not evaluated: a rule or an equation gives its right side whatever the ensures is [premise: rule-ensures, equation-ensures]"
  [[mutation.edit]]
  rule = "KORE.ev-en"
  find = "=> ensure(eval(D, E), eval(D, T))"
  replace = "=> eval(D, T)"

[[mutation]]
id = "ensures-false-not-applied"
misunderstanding = "a rule whose ensures is false has not applied, as one whose requires is false: it gives no result and does not block the rules of larger priority, and a configuration to which only such rules apply is final [premise: rule-ensures]"
  [[mutation.edit]]
  rule = "KORE.ensure-fails"
  find = "=> bot"
  replace = "=> vr(-1)"
  [[mutation.edit]]
  rule = "KORE.fa-take"
  find = "app(fire(D, L, R, Rhs, T),"
  replace = "app(drop(vr(-1), fire(D, L, R, Rhs, T)),"

[[mutation]]
id = "ensures-as-requires"
misunderstanding = "an equation whose ensures is not true has not applied, as one whose requires is not true: the next equation of its priority, a larger priority or the [owise] equation gives the value, instead of the application having no value (rules keep their reading: the marker of a false ensures is no successor and still blocks) [premise: equation-ensures]"
  [[mutation.edit]]
  rule = "KORE.ensure-fails"
  find = "=> bot"
  replace = "=> vr(-1)"
  [[mutation.edit]]
  rule = "KORE.step-some"
  find = "next(drop(bot, R ; Rs))"
  replace = "next(drop(vr(-1), drop(bot, R ; Rs)))"
  [[mutation.edit]]
  rule = "KORE.else-some"
  find = "=> some(T)"
  replace = "=> some(T) requires T =/=K vr(-1)"
  [[mutation.edit]]
  rule = "KORE.else-none"
  find = "orElse(none, D, As, Cs, P) => tryAt(D, As, Cs, P)"
  replace = "orElse(R, D, As, Cs, P) => tryAt(D, As, Cs, P) requires R ==K none orBool R ==K some(vr(-1))"

# --- collections: matching -----------------------------------------------------------------

[[mutation]]
id = "subst-first-only"
misunderstanding = "a rewrite rule gives one successor, from the first substitution of its left side whose requires holds, instead of one for each such substitution [premise: collection-patterns]"
  [[mutation.edit]]
  rule = "KORE.fire-holds"
  find = "; fireM(D, R, Rhs, Ms)"
  replace = "; .Ts"

[[mutation]]
id = "fn-first-subst-only"
misunderstanding = "an equation is tried with the first substitution of its argument patterns only: when that substitution's requires fails, the equation does not apply [premise: collection-patterns]"
  [[mutation.edit]]
  rule = "KORE.try-refuted"
  find = "=> tryM(D, Req, Rhs, Ms)"
  replace = "=> none"

[[mutation]]
id = "frame-dropped"
misunderstanding = "the frame variable of a collection pattern is dropped: the pattern matches whatever elements are left, and the frame is bound to the empty collection [premise: collection-patterns]"
  [[mutation.edit]]
  rule = "KORE.mc-frame"
  find = "match(F, co(K, C, Es), B, S)"
  replace = "match(F, co(K, C, .Ts), B, S)"

[[mutation]]
id = "col-pattern-open"
misunderstanding = "a collection pattern without a frame variable matches a collection that has more elements than its element patterns, as if it had a frame [premise: collection-patterns]"
  [[mutation.edit]]
  rule = "KORE.mc-done"
  find = "matchCol(_, _, .Ts, .Ts, B, _)"
  replace = "matchCol(_, _, .Ts, _, B, _)"

[[mutation]]
id = "col-first-split-only"
misunderstanding = "an element pattern of a Map or Set pattern is matched against the first element only: only the first split of the subject is tried [premise: collection-patterns]"
  [[mutation.edit]]
  rule = "KORE.ch-cons"
  find = ", choose(K, C, P, Ps, app(Pre, E ; .Ts), Post, B, S))"
  replace = ", .Ms)"

# --- collections: values and Map hooks -----------------------------------------------------

[[mutation]]
id = "map-duplicate-keys"
misunderstanding = "Map concatenation is total: maps with a common key concatenate to a map holding both entries of that key [premise: collections]"
  [[mutation.edit]]
  rule = "KORE.inse-overlap"
  find = "insE(_, E, F ; Fs) => bot ; F ; Fs"
  replace = "insE(K, E, F ; Fs) => #if K ==K map #then E ; F ; Fs #else bot ; F ; Fs #fi"

[[mutation]]
id = "map-concat-overrides"
misunderstanding = "Map concatenation is a right-biased union: of two entries with one key, the right-hand one is kept [premise: collections]"
  [[mutation.edit]]
  rule = "KORE.inse-overlap"
  find = "insE(_, E, F ; Fs) => bot ; F ; Fs"
  replace = "insE(K, E, F ; Fs) => #if K ==K map #then E ; Fs #else bot ; F ; Fs #fi"

[[mutation]]
id = "col-unordered"
misunderstanding = "a collection value keeps its elements in the order they were added, so that the one map built in two orders gives two different values [premise: collections]"
  [[mutation.edit]]
  rule = "KORE.inse-before"
  find = "insE(_, E, F ; Fs) => E ; F ; Fs"
  replace = "insE(K, E, F ; Fs) => F ; insE(K, E, Fs)"

[[mutation]]
id = "map-lookup-missing-defined"
misunderstanding = "a lookup of a missing key is not undefined: the application stays as it is, as an application of a function no equation applies to does [premise: collections]"
  [[mutation.edit]]
  rule = "KORE.op-lookup"
  find = "=> valueOr(A, bot, Es)"
  replace = "=> valueOr(A, hk(40, co(map, C, Es) ; A ; .Ts), Es)"
  [[mutation.edit]]
  rule = "KORE.op-lookup"
  find = "co(map, _, Es)"
  replace = "co(map, C, Es)"

[[mutation]]
id = "map-update-duplicates"
misunderstanding = "a Map update of a present key adds a second entry for it instead of replacing its value [premise: collections]"
  [[mutation.edit]]
  rule = "KORE.pute-replace"
  find = "=> E ; Fs"
  replace = "=> E ; F ; Fs"

# --- cell collections ----------------------------------------------------------------------
# A cell collection (multiplicity="*", type="Map") is a Map keyed by its key cell; these are wrong
# readings of a Map that a cell collection's rules tell apart: finding an instance, keeping the
# instances a rule does not mention, and the uniqueness of keys.

[[mutation]]
id = "map-entry-by-position"
misunderstanding = "an entry pattern of a Map pattern (an instance of a cell collection) takes the entry at its position, as a List's element pattern does, instead of any entry: the instance of a key is found only when it comes first [premise: collection-patterns, cells]"
  [[mutation.edit]]
  rule = "KORE.mc-choose"
  find = "requires isElem(P) andBool K =/=K list"
  replace = "requires isElem(P) andBool K ==K set"
  [[mutation.edit]]
  rule = "KORE.mc-head"
  find = "matchCol(list, C, P ; Ps, E ; Es, B, S) => rest(list, C,"
  replace = "matchCol(K, C, P ; Ps, E ; Es, B, S) => rest(K, C,"
  [[mutation.edit]]
  rule = "KORE.mc-head"
  find = "requires isElem(P)"
  replace = "requires isElem(P) andBool K =/=K set"

[[mutation]]
id = "col-frame-not-rebuilt"
misunderstanding = "a collection built on a right side holds only the elements written there: a part of the collection's sort, such as the frame that holds the instances a rule does not mention, contributes nothing [premise: cells]"
  [[mutation.edit]]
  rule = "KORE.join-col"
  find = "=> join(co(K, C, Es), app(Fs, Ps))"
  replace = "=> join(co(K, C, Es), Ps)"

[[mutation]]
id = "map-keyed-by-entry"
misunderstanding = "Map entries (instances of a cell collection) are told apart by the whole entry and not by the key: two entries of one key with different values are both kept, and only two equal entries overlap [premise: collections, cells]"
  [[mutation.edit]]
  rule = "KORE.ckey-kv"
  find = "ckey(kv(A, _), kv(B, _)) => cmp(A, B)"
  replace = "ckey(kv(A, V), kv(B, W)) => cmp(kv(A, V), kv(B, W))"

# --- collections: Set and List -------------------------------------------------------------

[[mutation]]
id = "set-idempotent"
misunderstanding = "Set concatenation is idempotent: sets with a common element concatenate to their union [premise: collections]"
  [[mutation.edit]]
  rule = "KORE.inse-overlap"
  find = "insE(_, E, F ; Fs) => bot ; F ; Fs"
  replace = "insE(K, E, F ; Fs) => #if K ==K set #then F ; Fs #else bot ; F ; Fs #fi"

[[mutation]]
id = "set-union-partial"
misunderstanding = "the union |Set is read as the concatenation of sets: undefined on a common element [premise: hooks]"
  [[mutation.edit]]
  rule = "KORE.op-union"
  find = "=> co(set, C, union(Es, Fs))"
  replace = "=> join(co(set, C, Es), Fs)"

[[mutation]]
id = "list-match-commutative"
misunderstanding = "a List pattern is matched as a Set pattern is: an element pattern takes any element of the list, not the one at its position [premise: collection-patterns]"
  [[mutation.edit]]
  rule = "KORE.mc-choose"
  find = "requires isElem(P) andBool K =/=K list"
  replace = "requires isElem(P)"
  [[mutation.edit]]
  rule = "KORE.mc-head"
  delete = true

[[mutation]]
id = "list-split-at-head"
misunderstanding = "a List frame followed by more patterns is split off at the head only: it takes the empty prefix, and the patterns after it the whole list [premise: collection-patterns]"
  [[mutation.edit]]
  rule = "KORE.sp-next"
  find = "=> split(C, F, Ps, app(Pre, E ; .Ts), Post, B, S)"
  replace = "=> .Ms"

[[mutation]]
id = "list-as-set"
misunderstanding = "List concatenation is read as Set concatenation: commutative, its elements ordered by value, undefined on a repeated element [premise: collections]"
  [[mutation.edit]]
  rule = "KORE.join-list"
  find = "=> join(co(list, C, app(Es, E ; .Ts)), Ps)"
  replace = "=> join(mkCol(list, C, insE(list, E, Es)), Ps)"

# --- String and Bool equality -------------------------------------------------------------

[[mutation]]
id = "string-lt-reversed"
misunderstanding = "<String is read as the reverse of the lexicographic order of texts [premise: string-bool]"
  [[mutation.edit]]
  rule = "KORE.op-str-lt"
  find = "bv(X <String Y)"
  replace = "bv(Y <String X)"

[[mutation]]
id = "string-eq-prefix"
misunderstanding = "==String holds when the texts share their first character, not when they are equal [premise: string-bool]"
  [[mutation.edit]]
  rule = "KORE.op-str-eq"
  find = "bv(X ==String Y)"
  replace = "bv(substrString(X, 0, 1) ==String substrString(Y, 0, 1))"

[[mutation]]
id = "bool-eq-as-and"
misunderstanding = "==Bool is read as andBool: two false operands are not equal [premise: string-bool]"
  [[mutation.edit]]
  rule = "KORE.op-bool-eq"
  find = "bv(X ==Bool Y)"
  replace = "bv(X andBool Y)"
