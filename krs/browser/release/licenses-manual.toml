# Hand-maintained input of the browser-lesson license inventory.
#
# browser/release/release.py licenses generates licenses.toml from this file plus
# `cargo metadata` / `cargo tree` (the Cargo closures), the fork's library/Cargo.lock
# and its generate-copyright vendor directory (the sysroot and named compiler crates),
# and the staged asset directory. This file holds only what no metadata records:
# components that are not Cargo packages, license facts read from the fork source,
# version pins, and the acknowledged gaps.
#
# The inventory is a record of obligations, not a licensing conclusion.
# Publication needs Sebastien's review; nothing here or in the generator sets
# publication_review to anything but "required".
#
# Placeholders in paths:
#   <fork-source>  the fork source checkout at the pack's compiler.fork_revision
#   <fork-build>   the fork build root that produced the pack's rustc.wasm and bundle
#   <repo>         the KRS checkout
#
# Asset patterns are fnmatch patterns over staged asset ids (paths relative to the
# staged asset directory, as stage-assets.ts writes it). A pattern that starts with
# "site:" names a file that the docs site ships beside the release, not a
# release asset; the checker lists it but does not require it in the release.

schema_version = 1

# ------------------------------------------------------------------ fork library (sysroot bundle, sysroot supplement)

[fork_library]
# library/Cargo.lock holds two wasi versions (p1 and p2). The wasm32-wasip1 std uses the p1 one.
pins = { wasi = "0.11.1+wasi-snapshot-preview1" }
pin_evidence = "<fork-source>/library/std/Cargo.toml: [target.'cfg(all(target_os = \"wasi\", target_env = \"p1\"))'.dependencies] wasi = { version = \"0.11.0\" }"
# In-tree library crates without a license field (test, proc_macro) are covered by the
# REUSE annotation of the fork.
default_spdx = "MIT OR Apache-2.0"
default_basis = "<fork-source>/REUSE.toml: library/** SPDX-License-Identifier MIT OR Apache-2.0 (precedence override); the crate declares no license field"
in_tree_notices = ["<fork-source>/LICENSE-APACHE", "<fork-source>/LICENSE-MIT", "<fork-source>/COPYRIGHT", "<fork-build>/build/COPYRIGHT-library.html"]

# ------------------------------------------------------------------ compiler (rustc.wasm)

# crates.io crates vendored into the fork build that the ticket names individually.
# Their license field and notice files are read from <fork-build>/build/tmp/generate-copyright-vendor.
# Every other third-party crate of rustc.wasm is covered by fork:rustc's generated COPYRIGHT.html.
[compiler]
named_vendored_crates = [
  "cranelift-codegen@0.130.0",
  "cranelift-frontend@0.130.0",
  "cranelift-module@0.130.0",
  "waffle@0.3.0",
  "wasmparser@0.248.0",
]
named_evidence = "<fork-source>/compiler/rustc_codegen_cranelift/Cargo.toml (cranelift 0.130.0) and clif2wasm/Cargo.toml (waffle =0.3.0, wasmparser 0.248, cranelift-frontend =0.130.0)"

[[component]]
id = "fork:rustc"
name = "rustc and its compiler crates (AngelOnFira/rust fork)"
origin = "fork"
spdx = "MIT OR Apache-2.0"
license_status = "declared"
basis = "<fork-source>/COPYRIGHT; <fork-source>/REUSE.toml annotates compiler/** as MIT OR Apache-2.0"
notices = ["<fork-source>/LICENSE-APACHE", "<fork-source>/LICENSE-MIT", "<fork-source>/COPYRIGHT", "<fork-build>/build/COPYRIGHT.html"]
assets = ["pack/compiler/rustc.wasm"]
note = "COPYRIGHT.html is generated by the fork build (bootstrap generate-copyright) from the fork's own Cargo metadata and vendored sources; it lists the third-party crates of the compiler workspaces with their license texts and is the notice for the crates.io closure of rustc.wasm, which this inventory does not re-derive per crate."

[[component]]
id = "fork:rustc_codegen_cranelift"
name = "rustc_codegen_cranelift (cg_clif, in the fork)"
origin = "fork"
spdx = "MIT OR Apache-2.0"
license_status = "declared"
basis = "<fork-source>/compiler/rustc_codegen_cranelift/LICENSE-APACHE and LICENSE-MIT (its Cargo.toml has no license field)"
notices = ["<fork-source>/compiler/rustc_codegen_cranelift/LICENSE-APACHE", "<fork-source>/compiler/rustc_codegen_cranelift/LICENSE-MIT"]
assets = ["pack/compiler/rustc.wasm"]

[[component]]
id = "fork:clif2wasm"
name = "clif2wasm (vendored into the fork by commit 57f0242ea6a)"
origin = "fork"
spdx = "MIT OR Apache-2.0"
license_status = "declared"
basis = "License approved by the fork author (AngelOnFira), relayed by Sebastien on 2026-09-23, under the fork's MIT OR Apache-2.0 terms (<fork-source>/REUSE.toml compiler/** and the enclosing compiler/rustc_codegen_cranelift LICENSE-APACHE and LICENSE-MIT). <fork-source>/compiler/rustc_codegen_cranelift/clif2wasm/Cargo.toml has no license field and the directory has no license file of its own; the notices are the enclosing cg_clif license texts."
notices = ["<fork-source>/compiler/rustc_codegen_cranelift/LICENSE-APACHE", "<fork-source>/compiler/rustc_codegen_cranelift/LICENSE-MIT"]
assets = ["pack/compiler/rustc.wasm"]

[[component]]
id = "fork:riwl"
name = "riwl, the in-process Wasm linker (vendored into the fork by commit 45e90e17e8f)"
origin = "fork"
spdx = "MIT OR Apache-2.0"
license_status = "declared"
basis = "License approved by the fork author (AngelOnFira), relayed by Sebastien on 2026-09-23, under the fork's MIT OR Apache-2.0 terms (<fork-source>/REUSE.toml compiler/** and the enclosing compiler/rustc_codegen_cranelift LICENSE-APACHE and LICENSE-MIT). <fork-source>/compiler/rustc_codegen_cranelift/riwl/Cargo.toml has no license field and the directory has no license file of its own; the notices are the enclosing cg_clif license texts."
notices = ["<fork-source>/compiler/rustc_codegen_cranelift/LICENSE-APACHE", "<fork-source>/compiler/rustc_codegen_cranelift/LICENSE-MIT"]
assets = ["pack/compiler/rustc.wasm"]

# ------------------------------------------------------------------ wasi-sdk 32.0 (wasi-libc, compiler-rt)

# The texts below were fetched from wasi-libc 2fc32bc81b9f (the wasi-libc submodule of the
# wasi-sdk-32 tag) on 2026-09-23; <repo>/browser/release/third-party/wasi-libc-2fc32bc81b9f/SOURCES.toml records URL and sha256 of each.

[[component]]
id = "wasi-sdk:wasi-libc"
name = "wasi-libc (wasi-sdk 32.0, wasi-libc 2fc32bc81b9f): libc.a and crt1-command.o"
origin = "wasi-sdk"
spdx = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
license_status = "declared"
basis = "wasi-libc 2fc32bc81b9f LICENSE (\"multi-licensed under the Apache License v2.0 with LLVM Exceptions, the Apache License v2.0, and the MIT License\"); the revision is the wasi-sdk-32 tag's src/wasi-libc submodule and the VERSION file of the extracted wasi-sdk. The bundle's lib/rustlib/wasm32-wasip1/lib/self-contained/libc.a (12d34112...) and crt1-command.o (f817b0c2...) are byte-identical to <fork-source>/wasi-sdk-32.0-x86_64-linux/share/wasi-sysroot/lib/wasm32-wasip1/. rustc.wasm is itself a wasm32-wasip1 program linked by <fork-source>/wasi-sdk-32.0-x86_64-linux/bin/clang against the same self-contained libc (bootstrap.krs.toml [target.'wasm32-wasip1'] wasi-root and linker)."
notices = ["<repo>/browser/release/third-party/wasi-libc-2fc32bc81b9f/LICENSE", "<repo>/browser/release/third-party/wasi-libc-2fc32bc81b9f/LICENSE-APACHE", "<repo>/browser/release/third-party/wasi-libc-2fc32bc81b9f/LICENSE-APACHE-LLVM", "<repo>/browser/release/third-party/wasi-libc-2fc32bc81b9f/LICENSE-MIT"]
assets = ["pack/sysroot/sysroot-wasip1.bundle", "pack/compiler/rustc.wasm"]

[[component]]
id = "wasi-sdk:wasi-libc-musl"
name = "musl 1.2.5 portions of wasi-libc (libc-top-half/musl)"
origin = "wasi-sdk"
spdx = "MIT"
license_status = "declared"
basis = "wasi-libc 2fc32bc81b9f LICENSE (\"libc-top-half/musl/ - MIT; see the COPYRIGHT file\") and libc-top-half/musl/COPYRIGHT, byte-identical to musl v1.2.5's COPYRIGHT on git.musl-libc.org"
notices = ["<repo>/browser/release/third-party/wasi-libc-2fc32bc81b9f/libc-top-half/musl/COPYRIGHT"]
assets = ["pack/sysroot/sysroot-wasip1.bundle", "pack/compiler/rustc.wasm"]

[[component]]
id = "wasi-sdk:wasi-libc-dlmalloc"
name = "dlmalloc 2.8.6 portion of wasi-libc (malloc; libc.a member dlmalloc.c.obj)"
origin = "wasi-sdk"
spdx = "CC0-1.0"
license_status = "declared"
basis = "wasi-libc 2fc32bc81b9f LICENSE (\"dlmalloc/ - CC0; see the notice in malloc.c\") and the notice at the head of dlmalloc/src/malloc.c (public domain, CC0 1.0)"
notices = ["<repo>/browser/release/third-party/wasi-libc-2fc32bc81b9f/dlmalloc-notice.txt"]
assets = ["pack/sysroot/sysroot-wasip1.bundle", "pack/compiler/rustc.wasm"]

[[component]]
id = "wasi-sdk:wasi-libc-cloudlibc"
name = "cloudlibc portions of wasi-libc (libc-bottom-half/cloudlibc)"
origin = "wasi-sdk"
spdx = "BSD-2-Clause"
license_status = "declared"
basis = "wasi-libc 2fc32bc81b9f LICENSE (\"libc-bottom-half/cloudlibc/ - BSD-2-Clause\") and libc-bottom-half/cloudlibc/LICENSE; libc.a contains members built from it (e.g. opendirat.c.obj, scandirat.c.obj, fdclosedir.c.obj, whose sources exist only under cloudlibc)"
notices = ["<repo>/browser/release/third-party/wasi-libc-2fc32bc81b9f/libc-bottom-half/cloudlibc/LICENSE"]
assets = ["pack/sysroot/sysroot-wasip1.bundle", "pack/compiler/rustc.wasm"]

[[component]]
id = "wasi-sdk:wasi-libc-musl-fts"
name = "musl-fts 1.2.7 portion of wasi-libc (fts; libc.a member fts.c.obj)"
origin = "wasi-sdk"
spdx = "BSD-3-Clause"
license_status = "declared"
basis = "wasi-libc 2fc32bc81b9f LICENSE (\"fts/musl-fts/ - BSD-3-Clause; see the COPYING file\") and fts/musl-fts/COPYING"
notices = ["<repo>/browser/release/third-party/wasi-libc-2fc32bc81b9f/fts/musl-fts/COPYING"]
assets = ["pack/sysroot/sysroot-wasip1.bundle", "pack/compiler/rustc.wasm"]

[[component]]
id = "wasi-sdk:compiler-rt-builtins"
name = "LLVM compiler-rt builtins (libclang_rt.builtins.a of wasi-sdk 32.0), if linked into rustc.wasm"
origin = "wasi-sdk"
spdx = "Apache-2.0 WITH LLVM-exception"
license_status = "declared"
basis = "<fork-source>/src/llvm-project/compiler-rt/LICENSE.TXT (Apache-2.0 WITH LLVM-exception; its legacy section dual-licenses pre-2019 compiler-rt code under NCSA or MIT, and the notice carries both texts). The file is read from the fork's LLVM submodule (1cb4e3833, LLVM 22.1.2), not from the LLVM revision wasi-sdk 32.0 was built from (4434dabb6991, LLVM 22.1.0), which is not on this host; both are the LLVM 22.1 release line. rustc.wasm is linked by wasi-sdk clang, whose driver adds <fork-source>/wasi-sdk-32.0-x86_64-linux/lib/clang/22/lib/wasm32-unknown-wasip1/libclang_rt.builtins.a. rustc.wasm has no name section, so whether any member is linked is not verified. The sysroot's compiler_builtins rlib carries no compiler-rt object (266 members, all Rust codegen units plus lib.rmeta), and no pack rlib links a C runtime."
notices = ["<fork-source>/src/llvm-project/compiler-rt/LICENSE.TXT"]
assets = ["pack/compiler/rustc.wasm"]

# ------------------------------------------------------------------ KRS packages (krs:<package> from cargo metadata)

[krs]
# KRS is dual-licensed MIT OR Apache-2.0 (Sebastien, 2026-09-23). Its crates carry no
# license file of their own; the repository-root texts are the notice of every krs:<package>.
notices = ["<repo>/LICENSE-APACHE", "<repo>/LICENSE-MIT"]

# ------------------------------------------------------------------ KRS repository files that are not crate outputs

[[component]]
id = "krs:repository"
name = "KRS repository files (generated pack manifests, lesson fixture)"
origin = "krs"
spdx = "MIT OR Apache-2.0"
license_status = "declared"
basis = "<repo>/Cargo.toml [workspace.package] license = \"MIT OR Apache-2.0\"; <repo>/LICENSE-MIT and <repo>/LICENSE-APACHE"
notices = ["<repo>/LICENSE-APACHE", "<repo>/LICENSE-MIT"]
assets = ["pack.json", "pack/pack-manifest.toml", "lessons/*"]

# ------------------------------------------------------------------ docs-site worker bundle, not a release asset

[[component]]
id = "npm:browser_wasi_shim"
name = "@bjorn3/browser_wasi_shim (minified copy vendored by Weblings, patched for path_readlink)"
origin = "vendored-js"
spdx = "MIT OR Apache-2.0"
license_status = "declared"
basis = "Upstream https://github.com/bjorn3/browser_wasi_shim at b068ec2c22 (the revision the vendored copy was built from; <repo>/browser/worker/vendor/browser_wasi_shim/VENDOR.toml [upstream_revision]): package.json license \"MIT OR Apache-2.0\" and LICENSE-MIT and LICENSE-APACHE, fetched 2026-09-23 into the vendored directory"
notices = ["<repo>/browser/worker/vendor/browser_wasi_shim/LICENSE-APACHE", "<repo>/browser/worker/vendor/browser_wasi_shim/LICENSE-MIT"]
assets = ["site:worker.js"]

[[component]]
id = "weblings"
name = "Weblings (container of the vendored shim copy and the browser host design the worker follows)"
origin = "vendored-js"
spdx = "MIT"
license_status = "declared"
basis = "<repo>/browser/worker/vendor/browser_wasi_shim/LICENSE-weblings (Weblings repository LICENSE, sha256 bcba9b44...)"
notices = ["<repo>/browser/worker/vendor/browser_wasi_shim/LICENSE-weblings"]
assets = ["site:worker.js"]

# ------------------------------------------------------------------ overrides for crates without a license field

# [[crate_override]]
# id = "crate:<name>@<version>"
# spdx = "..."
# basis = "why, read from which file"
# No crate in the current closures needs one: the generator fails on a crate with only
# license_file until an entry is added here.

# ------------------------------------------------------------------ acknowledged gaps
#
# The generator fails on any component whose license is not declared or whose notice
# text is missing, unless it is listed here. Each entry is a decision to ship the
# inventory as incomplete, not a resolution.
# None open (2026-09-23): the fork author approved clif2wasm and riwl, and the wasi-libc and
# browser_wasi_shim texts were fetched from upstream.
