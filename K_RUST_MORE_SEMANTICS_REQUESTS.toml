[[local_boundary]]
id = "krs-definition-ir-adapter"
reason = "Typed KRS Definition IR conversion for hooks, Maps, Lists, Sets, Bytes, cells, multiplicity, generated labels, provenance, and schema versions is a KRS integration layer, not a missing generic K-Rust feature."

[[local_boundary]]
id = "krs-persistent-drivers"
reason = "KRS's compile and execute worker protocols, corpus orchestration, and behavior hashes remain KRS-owned."

[[local_boundary]]
id = "krs-simplification-override"
reason = "KRS should retain its 4,096 request override until the performance-and-diagnostics request is resolved and requalified."

[[local_boundary]]
id = "krs-z3-version"
reason = "The exact Z3 4.12.5 selection is part of KRS's compatibility unit. Upstream is asked only to make acquisition selectable and reproducible."

[[local_boundary]]
id = "krs-default-configuration-workaround"
status = "retired"
reason = "KRS removed manual DEFAULT-CONFIGURATION surgery after adopting the upstream structured-definition loading API."

[[validation_stage]]
id = "focused-upstream"
owner = "k-rust change agent"
requirements = [
  "Run each new focused regression.",
  "Run the affected crate's existing unit and integration tests.",
  "Run cargo fmt checking, clippy for affected targets, and git diff --check.",
]

[[validation_stage]]
id = "more-semantics-regression"
owner = "k-rust change agent"
requirements = [
  "Run the normal non-Java K-Rust acceptance gates.",
  "Run focused structural differentials only when the pinned reference environment is available and the changed frontend area warrants them.",
  "Do not require the heavyweight Java differential matrix for every edit; schedule it as final reference validation after the focused suite is green.",
]

[[validation_stage]]
id = "krs-integration"
owner = "KRS integration agent"
requirements = [
  "Integrate the resulting K-Rust commit through a dedicated KRS checkout, not the shared development checkout.",
  "Run the krs-k-rust adapter suite.",
  "Run the native KEVM, KMIR, and KWasm gates.",
  "Update Krs.lock and the KRS issue ledger only after the native gates pass.",
  "Schedule the pinned Java reference run as final validation when the complete native path is green.",
]
