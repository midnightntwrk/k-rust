source_ledger = "K_RUST_UPSTREAM.toml"
objective = "Make the more-semantics K-Rust branch sufficient for KRS's native KEVM, KMIR, and KWasm frontend/backend path without relying on KRS-only patches for general K-Rust behavior."

[target]
repository = "/home/sebastiengllmt/git/workspaces/starstream-fv/inspirations/midnightntwrk/k-rust"
branch = "more-semantics"
