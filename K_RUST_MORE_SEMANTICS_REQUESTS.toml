[[request]]
id = "backend-krypto-bn128"
kind = "missing-feature"
priority = "required"
status = "fixed-upstream"
requalified_at_active_commit = "The backend implements the requested BN128 hook family, and the KEVM address-6 through address-8 vectors pass."
area = "crates/k-rust-backend/src/builtin/krypto.rs"
verified_at_target = "The backend has no BN128 dispatcher branches, implementation dependency, or focused tests."
contract = "Implement the pinned K 7.1.337 KRYPTO.bn128valid, KRYPTO.bn128g2valid, KRYPTO.bn128add, KRYPTO.bn128mul, and KRYPTO.bn128ate contracts with Ethereum-compatible BN254 behavior."
implementation_constraints = [
  "Select a maintained, reviewed cryptographic implementation; do not author field, curve, or pairing arithmetic locally.",
  "Derive coordinate ordering, infinity encoding, invalid-input behavior, and result shapes from the pinned K and KEVM definitions.",
  "Handle the complete unsigned 256-bit multiplication scalar according to the pinned contract without narrowing it to a machine integer.",
  "Validate G2 subgroup membership, not only field bounds and curve membership.",
  "Check interruption before an expensive pairing operation.",
]
acceptance = [
  "G1 and G2 (0, 0, ...) infinity encodings are accepted where the pinned contract accepts them.",
  "Out-of-field, off-curve, and known non-subgroup points are rejected.",
  "G1 addition matches a standard Ethereum vector and preserves the expected K constructor shape.",
  "G1 multiplication covers zero, two, an invalid point, and a scalar at or above the group order.",
  "An empty pairing product is true; a generator product is false; a cancelling product is true.",
  "Pairing accepts injected concrete List elements and distinguishes opaque lists from malformed concrete lists.",
  "Mismatched list lengths and invalid concrete points follow the pinned failure contract.",
]
reference_evidence = [
  "reference_checkout:crates/k-rust-backend/src/builtin/krypto.rs",
  "reference_checkout:crates/k-rust-backend/Cargo.toml",
  "krs_repository:K_RUST_UPSTREAM.toml issue krypto-bn128-hooks-not-implemented",
