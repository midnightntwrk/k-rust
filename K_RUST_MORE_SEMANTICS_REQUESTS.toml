[[request]]
id = "frontend-parameterized-repeated-cell-initializer"
kind = "bug"
priority = "required"
status = "fixed-upstream"
requalified_at_active_commit = "Cell concretization recognizes parameterized repeated-cell initializer productions, and the complete KEVM configuration compiles without a KRS frontend patch."
area = "crates/k-rust/src/kompile/passes/concretize_cells.rs"
verified_at_target = "CellModel catalogs only initializer productions without nonterminals, so a parameterized initializer returning a cell-collection sort is not associated with its repeated member cell."
contract = "Cell concretization must recognize a generated initializer returning a repeated cell's collection sort as an occurrence of that repeated member, including when the initializer has configuration parameters."
reproducer = "Compile <accounts><account multiplicity=\"*\" type=\"Map\"><id> $ID:Int </id></account></accounts>. Configuration expansion generates initAccountCell(Init:Map):AccountCellMap; concretization currently rejects it under <accounts>."
acceptance = [
  "Add a CLI-independent concretizer regression for the Map-parameterized account configuration.",
  "The generated initializer is ordered as the repeated AccountCell child rather than rejected as an unexpected term.",
  "Cover parameterized Bag, Set, and List repeated-cell initializers when those collection forms are supported.",
  "Retain all repeated-cell rewrite behavior added by more-semantics.",
]
reference_evidence = [
  "reference_checkout:crates/k-rust/src/kompile/passes/concretize_cells.rs",
  "reference_checkout:crates/k-rust/tests/kompile_passes.rs test concretizes_parameterized_repeated_cell_initializers",
  "krs_repository:K_RUST_UPSTREAM.toml issue parameterized-repeated-cell-initializer-concretization",
]

