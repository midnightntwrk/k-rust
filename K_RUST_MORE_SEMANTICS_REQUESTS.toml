priority = "required"
status = "fixed-upstream"
requalified_at_active_commit = "The frontend derives its default hook namespaces from the backend inventory, and the KRS KRYPTO corpus executes through emitted hooks."
area = "crates/k-rust/src/kompile/module_to_kore.rs"
verified_at_target = "HOOK_NAMESPACES omits KRYPTO although the backend dispatches KRYPTO hooks."
contract = "A production carrying hook(KRYPTO.<operation>) must be emitted as a hooked KORE symbol whenever that namespace is implemented by the selected backend."
reproducer = "Compile a total Bytes-to-Bytes function carrying hook(KRYPTO.keccak256raw). The emitted symbol currently lacks the hook attribute and remains uninterpreted."
acceptance = [
  "Add KRYPTO to the frontend's real-hook classification.",
  "Add a ModuleToKORE regression for KRYPTO.keccak256raw.",
  "Add an end-to-end frontend/backend test that concretely evaluates the emitted hook.",
  "Audit the frontend namespace catalog against every namespace dispatched by k-rust-backend and document deliberate exclusions.",
]
reference_evidence = [
  "reference_checkout:crates/k-rust/src/kompile/module_to_kore.rs",
  "krs_repository:K_RUST_UPSTREAM.toml issue krypto-hook-namespace-not-emitted",
]

