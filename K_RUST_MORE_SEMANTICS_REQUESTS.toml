k_commit = "4a46d1231473b599c699160132fd6e76a5c46406"
reference_checkout = "/home/sebastiengllmt/git/workspaces/starstream-fv/inspirations/midnightntwrk/k-rust-krs"
reference_base_commit = "3cce7a47941c4dc0664e6e870d4e0529d74753c6"
krs_repository = "/home/sebastiengllmt/git/workspaces/starstream-fv/krs"
base_policy = "If more-semantics has moved beyond audited_commit, recheck every verified_at_target claim before implementation."

[active_requalification]
k_rust_commit = "efda6192785d4113eeea2fa090e4662d30dc8801"
date = "2026-09-15"
scope = "The historical more-semantics request packet was requalified against current origin/main. Fixed requests are present in upstream main; partial and open requests still require the named KRS boundaries."

[latest_main_candidate]
k_rust_commit = "41ee041068db671f7ba8e417d1e31e98f2e3a8f8"
date = "2026-09-22"
qualification = "static-source-screen"
scope = "The clean shared k-rust main candidate was screened without changing Krs.lock or claiming a full KRS gate requalification. The semantic-cast request remains open; the simplification-budget request remains partially fixed because the default is 100."

[coordination]
target_checkout_may_be_modified = true
krs_checkout_is_read_only_reference = true
reference_checkout_is_read_only_reference = true
derive_solutions_from_contracts = true
evidence_path_syntax = "reference_checkout:<path> is relative to target.reference_checkout; krs_repository:<path> is relative to target.krs_repository."
reference_patch_policy = "The KRS patches and tests are evidence and candidate regressions. Review them, but derive the upstream design from the pinned K contract and K-Rust architecture rather than copying them blindly."
preserve = [
  "The more-semantics parser, frontend, execution, proof, and RPC differential work.",
  "The normal source-loader behavior that supplies DEFAULT-CONFIGURATION when an ordinary source definition has no visible configuration.",
  "NotApplicable for non-concrete builtin arguments unless the pinned hook contract requires another result.",
  "The public per-request simplification-budget override.",
]

[coverage_at_audited_commit]
structural_differentials = "Complete WASM and MIR definitions, EVM optimization semantics, IMP, and focused frontend cases."
program_parser_differentials = "IMP, WASM, EVM schedules, and MIR fixtures."
execution_proof_rpc_differentials = "IMP only."
not_covered = [
  "Full KEVM frontend compilation.",
  "KEVM precompile execution.",
  "KRS structured Definition IR preparation.",
  "KMIR or KWasm execution through their real generated configurations.",
]

[delivery]
recommended_order = [
  "backend-deep-result",
  "frontend-krypto-hook-namespace",
  "backend-krypto-raw-hashes",
  "backend-krypto-ecdsa-invalid",
  "backend-krypto-bn128",
  "frontend-parameterized-repeated-cell-initializer",
  "frontend-complete-nested-cells",
  "frontend-semantic-cast-projection",
  "structured-definition-loading-api",
  "simplification-budget-exhaustion",
  "selectable-z3-acquisition",
]
definition_of_done = [
  "Every correctness request has a focused Rust regression that fails at the audited commit and passes after the change.",
  "Existing more-semantics tests continue to pass.",
  "The implementation documents any intentional difference from K 7.1.337.",
  "KRS can integrate the resulting commit in a dedicated checkout and pass its native KEVM, KMIR, and KWasm gates.",
]

[[request]]
id = "backend-deep-result"
kind = "bug"
priority = "required"
status = "fixed-upstream"
requalified_at_active_commit = "The persistent Backend result encoder accepts KORE JSON beyond serde_json's default recursion depth, and KRS qualifies the 1,024-element result boundary."
area = "crates/k-rust/src/backend.rs"
verified_at_target = "The RPC input path supports unbounded JSON depth, but Backend::encode_pattern still converts generated KORE JSON with recursion-limited serde_json::from_str."
contract = "Backend::execute must return a successfully evaluated KORE result whose nesting exceeds serde_json's default recursion limit. Generated backend output must not be rejected solely because it is deeper than 128 levels."
reproducer = "Execute a definition that returns a KORE application nested beyond 128 levels. The KRS reproducer returns a concrete 1,024-element WordStack and currently fails while encoding the already-computed result."
acceptance = [
  "Add a public-Backend regression with a result nested beyond 128 levels.",
  "Require the execution result to round-trip as serde_json::Value without a recursion-limit error.",
  "Keep bounded parsing where input is untrusted unless that path explicitly opts into unbounded depth.",
]
reference_evidence = [
  "reference_checkout:crates/k-rust/src/backend.rs",
  "krs_repository:K_RUST_UPSTREAM.toml issue persistent-api-deep-result",
]

[[request]]
