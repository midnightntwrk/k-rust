[[request]]
id = "structured-definition-loading-api"
kind = "api-gap"
priority = "required"
status = "fixed-upstream"
requalified_at_active_commit = "outer::load_structured prepares already-structured definitions without an implicit fallback configuration, and KRS has removed its manual loader surgery."
area = "crates/k-rust/src/outer/loader.rs and structured compilation entry points"
verified_at_target = "The public source loader correctly injects DEFAULT-CONFIGURATION for an empty source bootstrap, but no public path prepares an already-structured definition with the builtin closure without retaining that fallback configuration."
contract = "A structured-definition consumer must be able to establish the embedded builtin module closure and all compilation invariants without acquiring an implicit default <k> configuration that conflicts with the authored configuration."
acceptance = [
  "Expose a supported structured-definition preparation API or an explicit loader policy that disables the fallback configuration for this use case.",
  "Compile an authored fixed configuration whose computation cell is <instrs>.",
  "The prepared definition and emitted KORE contain the authored configuration and no unreachable DEFAULT-CONFIGURATION or generated <k> initializer.",
  "Ordinary source loading without a visible configuration continues to receive DEFAULT-CONFIGURATION.",
  "The KRS adapter can remove its manual module and dangling-import deletion after adopting the API.",
]
reference_evidence = [
  "krs_repository:crates/krs-k-rust/src/lib.rs prepare_definition",
  "krs_repository:crates/krs-k-rust/src/tests.rs test permanent_structured_compile_replaces_the_bootstrap_default_configuration",
  "krs_repository:K_RUST_UPSTREAM.toml issue implicit-default-configuration-survives-structured-replacement",
]

[[request]]
id = "simplification-budget-exhaustion"
kind = "performance-and-diagnostics"
priority = "important"
status = "partially-fixed-upstream"
requalified_at_active_commit = "Upstream exposes typed budget-exhaustion diagnostics and deterministic work counters, but the default remains 100 and the KRS 4,096 request override remains required for the deep KEVM boundary."
latest_main_candidate_status = "partially-fixed-upstream"
latest_main_candidate_evidence = "Candidate 41ee041068db671f7ba8e417d1e31e98f2e3a8f8 retains typed budget-exhaustion machinery while DEFAULT_MAX_SIMPLIFICATION_ITERATIONS remains 100."
area = "Backend::execute and k-rust-backend simplification"
verified_at_target = "The default budget remains 100. The more-semantics execution differential does not contain a deep recursive concrete-function benchmark or report budget exhaustion."
contract = "A bounded simplification budget must not make repeated partial work indistinguishable from an interpreter hang. Callers must be able to identify exhaustion, and deep concrete recursion must have a predictable efficient path."
reproducer = "Evaluate a concrete recursive function over 1,024 elements with ExecuteRequest::default(). KRS observed runs exceeding five minutes; a 4,096 budget completed the full 103-case corpus in 2.09 seconds."
acceptance = [
  "Add a benchmark or deterministic work-count regression for a concrete recursive chain deeper than 100 steps.",
  "Determine whether repeated exhausted simplification restarts duplicate work and remove avoidable repetition.",
  "Expose budget exhaustion in diagnostics, trace data, or the halt result.",
  "Retain the request-level override.",
  "Do not encode a machine-specific wall-clock threshold as the sole regression oracle.",
]
reference_evidence = [
  "krs_repository:crates/krs-k-rust/src/bin/krs-native-runner.rs",
  "krs_repository:K_RUST_UPSTREAM.toml issue deep-functional-simplification-budget",
]

