[[driver_followup]]
id = "DF-06"
title = "No per-step ceiling: one non-terminating program consumes the whole case budget and starves the corpus"
state = "closed"
found = "2026-09-19, sequence 23 (label discovery-3600): FUN untyped under a 3600 s discovery budget spends 3587.7 s on ackermann.fun, its first program, and the other 49 programs are skipped-with-reason exactly as under the 300 s default (sequence 21, 289.6 s). A step is only ever limited by `case.remaining()` (scripts/conformance/run.py:384-388, :742), so a divergent program hides every program behind it and the budget cannot distinguish one divergence from a slow corpus. The same shape cost sequence 21 its readings of matrix.simple and matrix.kool, which sequence 23 showed terminate at 470 to 764 s."
work = "Done on 2026-09-19 on branch chore/simple-budget-ceilings: expectations `step_budget` caps each krust program execution inside the case budget (scripts/conformance/run.py Case.step_timeout, run_krust_program, krust_timeout_reason); a capped kill is recorded as `krust krun exceeded the step budget (N s)` with the step's `step_budget` field, and the programs behind it still run. The driver rejects a step budget above its case budget. Regression: conformance_driver_caps_each_program_by_the_step_budget_inside_the_case_budget. Sequence 24 (60 s) and 25 (20 s) measured FUN under it; 25 measures all 51 steps in 751.5 s, and the 1800 s sweep under the sequence-25 run directory confirmed the 35 kills are non-termination, so FUN now carries step_budget 60 / budget 2700 from that measurement. Reference re-runs and kompile steps keep the case budget. Original plan: Add a per-step ceiling next to the case budget: an optional `step_budget` in expectations.toml (default: the case budget, so nothing changes for cases that do not set it) applied as the timeout of every krust and reference step, with the kill recorded as krust-error `krust krun exceeded the step budget` so the remaining programs are still measured. Then set FUN untyped to a step budget that lets its 49 other programs run (about 60 s while ackermann.fun is CB-14's problem) and re-measure it. Drivers must not reorder programs to achieve this; the Makefile order is part of the recipe."
