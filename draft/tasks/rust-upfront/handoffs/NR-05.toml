initial_declared_profile_probe = "cargo test -p kink-native with the KRS wrapper dependency compiled Rust successfully but final linking failed because rust-lld could not find -lz3"

[exact_blockers]
items = [
  "The selected KRS checkout is at the exact revision but is currently dirty in three KEVM test files. The production pin gate correctly rejects it, so no validated native output was issued from that checkout.",
  "The KRS wrapper's declared z3-inference feature requires system libz3, which is absent in this sandbox. No software was installed. The implemented structured native path therefore uses the exact k-rust checkout without z3-inference and records that distinct profile.",
  "KRS still does not bind OriginMapping into k-rust SourceTable, TermSpan, production metadata, and OriginRecord across compilation. Sidecar indexing cannot become complete native provenance, and ProvenanceStatus remains SidecarOnlyMissingBridge.",
  "No generic portable SemanticJson-to-KRS DefinitionIr/native edit translator exists. NR-05 supplies the atomic clone/patch/validate/lower transaction and requires the caller to provide the native edit mapping for each admitted patch family.",
  "The no-z3 structured profile fails closed on inputs whose source parsing requires Z3 parametric ambiguity inference. The path is strongest for already-structured KRS definitions and is not equivalent to the KRS wrapper's declared source-parser profile.",
]

[not_claimed]
