declared_k_rust_profile = "version =0.4.0, default-features=false, features=[z3-inference]"
implemented_integration_profile = "version =0.4.0, default-features=false, structured-no-z3-inference"
pin_rule = "PinnedNativeValidator construction reruns exact HEAD, full porcelain cleanliness, KRS manifest version/path/feature, declared canonical-path, compiled path, and rustc --version --verbose identity checks. Any mismatch returns a typed failure before a baseline is captured."

[implementation]
inventory = "Exhaustive matches cover all 12 k-rust Sentence variants and all 8 Term variants. The admitted source subset contains every structured sentence and term variant; unresolved textual Bubble sentences fail closed."
semantic_index = "NativeIndex records module-name-qualified sentence declarations, sort declarations and synonyms, production signatures, direct semantic subsort edges using k-rust's published compute_subsorts implementation, nested term inventory, and resolved symbol uses keyed by deterministic term paths."
ownership = "NativeSymbolId is owner-module plus label. Duplicate labels in one owner reject, and an unqualified use that sees the same label from multiple imported owners rejects with the exact sorted owner set. Module-vector relocation does not change symbol or use identity."
sidecar = "ProvenanceSidecarIndex keys copied KRS OriginMapping summaries by module name, optional sentence ordinal, and a closed NativeNodeRole mirror. Missing modules, out-of-bounds ordinals, module-role/index inconsistency, and duplicate destinations reject. This sidecar is explicitly non-authoritative."
native_transaction = "PinnedNativeValidator accepts NR-02 StagedNativeInput, clones its immutable native baseline, invokes one caller-supplied native patch function, inventories and indexes the candidate, prepares it with k-rust load_structured plus the pinned prelude and backend exclusion, runs the full k-rust compilation/check/transformation/KORE-lowering pipeline, and constructs ValidatedNativeOutput only after success."
failure_boundary = "NativeFailure contains no staged native definition, portable output, KORE artifact, or output-derived identity. committed_edit_count is always zero. ValidatedNativeOutput binds exact pins, rustc verbose identity, the full CompileOptions backend/profile, semantic index, committed native definition, and lowered artifacts while retaining SidecarOnlyMissingBridge provenance status."
nr02_connection = "The validator's public validate method consumes kink_patch::StagedNativeInput and is suitable as the closure passed to apply_patch_with_native_validation. Existing kink-patch files and NativeIrValidation::RustProofPending remain unchanged."

[tests]
passed = [
  "closed inventory visits InjectedLabel, Rewrite, As, Variable, Sequence, Apply, Token, and Annotated terms",
  "Bubble rejection",
  "duplicate label rejection",
  "duplicate sort rejection",
  "circular subsort rejection",
  "application arity mismatch rejection",
  "ambiguous visible owner rejection",
  "module-vector relocation stability",
  "direct subsort and signature indexing",
