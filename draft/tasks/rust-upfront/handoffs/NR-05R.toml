restrictions = ["Consume only role-qualified NativeTermUseId values.", "Treat every unknown, incomplete, external, solver-relative, or sidecar-only result as not-proven unless a later closed contract authorizes more.", "Do not issue native-proven observations or exhaustive absence from this adapter."]

