items = [
  "The in-process seam prevents recovery through its returned failure value; it does not isolate validator side effects, aborts, process exits, or panic payloads.",
  "Validator panics and panics from dropping a validator error are not converted into typed NativeTransactionFailure values.",
  "The boundary does not itself parse, validate, resolve, type-check, lower, execute, or grant authority over native K IR.",
