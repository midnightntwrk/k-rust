[implementation]
rejection_boundary = "NativeTransactionFailure is no longer generic over the validator error. The seam accepts any validator error type internally, explicitly drops it, and returns only a boundary-constructed NativeValidationRejection."
classification = "NativeValidationRejectionKind is a closed enum with the sole ValidatorRejected classification. Its spelling and supplemental diagnostic are fixed boundary-owned static strings, so validator-controlled data cannot enter the failed transaction result."
portable_failure = "Portable application still delegates to apply_patch and retains PatchFailure classification, zero applied edits, no output, and no output-derived identity. The validator is not invoked after portable failure."
success = "Native validator success remains generic and opaque. NativeValidatedPatch still publishes the AppliedPatch and native output together only after validator success, and the portable record remains NativeIrValidation::RustProofPending."
compatibility = "Existing validators returning Result<N, E>, including the NR-05 NativeFailure surface, remain accepted because E is still generic at invocation and is erased only from the public failure result."

[adversarial_evidence]
runtime_leak = "The focused rejection test returns a boxed validator error containing a complete cloned staged AppliedPatch and its output_definition_digest. Its Drop implementation verifies those values were present internally; the test verifies the error was dropped and only ValidatorRejected with fixed diagnostics escaped."
compile_leak = "A compile_fail Rustdoc reproduces the NR-R0 recovery shape by matching NativeTransactionFailure::Native and attempting leak.staged. Compilation fails because the branch payload is NativeValidationRejection and has no staged field."
zero_commit = "Both the stale portable failure test and the sanitized native rejection test assert committed_edit_count equals zero; the portable failure additionally asserts applied_edit_count equals zero."

