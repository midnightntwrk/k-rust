schema_version = 1
packet_id = "NR-05A"
title = "Pinned native adapter pre-consumer audit"
status = "repair-required"
source_packet = "handoffs/NR-05.toml"
protected_artifact_sha256 = "dcc35b3bd0c01793c50d3d8096283bd650f591a529d036c79e703ac50fa6d0ec"

[scope]
audited = ["crates/kink-native/src/lib.rs", "crates/kink-native/Cargo.toml", "KRS crates/krs-k-rust/Cargo.toml as read-only evidence"]
untouched = ["KRS", "k-rust", "investigations/k-rust-target/k-rust-agent-requests.toml"]

[[finding]]
id = "NR-05A-F1"
severity = "critical-local-index-integrity"
summary = "Sentence term roots alias in resolved_symbol_uses."
evidence = "index_definition_with_sidecar creates one empty path per sentence, while visit_sentence_terms invokes body, requires, and ensures with that same root path. Root applications therefore share (NativeSentenceId, []) and later fields overwrite earlier fields; nested paths can collide in the same way."
required_repair = "Add one closed typed body/requires/ensures root discriminator to every native term-use identity and reject any duplicate identity insertion."

[[finding]]
id = "NR-05A-F2"
severity = "critical-fail-open-coverage"
summary = "Unknown and invisible label uses are silently omitted."
evidence = "resolve_label returns Ok when ownership has no label and when declared owners have an empty intersection with visible modules. The admitted index can therefore claim successful coverage while omitting unresolved native symbol uses."
required_repair = "Reject unknown and non-visible labels with closed typed failures unless a separately inventoried and explicitly admitted builtin-label class is proven necessary."

[[finding]]
id = "NR-05A-F3"
severity = "high-pin-verification"
summary = "KRS dependency verification uses independent substring matches instead of TOML structure."
evidence = "verify_pins accepts path, version, default-features, and feature strings anywhere in the manifest. Comments or unrelated dependency tables can satisfy the checks while the k-rust dependency differs."
required_repair = "Use a selected TOML implementation and validate the exact dependencies.k-rust table, exact allowed keys, version, path, default-features value, and feature set before canonical path comparison."

[[finding]]
id = "NR-05A-F4"
severity = "documented-upstream-boundary"
summary = "The crate mirrors KRS sidecar records instead of consuming a provenance-bearing KRS adapter result."
evidence = "PinnedNativeValidator accepts caller-supplied ProvenanceSidecarRecord values and consumes k-rust directly. ProvenanceStatus remains SidecarOnlyMissingBridge and no native authority is issued."
required_repair = "Retain the sidecar as explicitly non-authoritative. Do not convert this limitation into local provenance authority; replace it only after KRS exposes and qualifies a provenance-bearing bridge."

[classification]
retained = "The complete sentence/term variant inventory, Bubble rejection, declaration/signature/subsort indexing, clean revision checks, compile pipeline, sidecar non-authority, and zero-output failure boundary remain useful local work."
changed = "NR-05 is repair-required before NR-06 consumes resolved symbol paths or pin evidence."
upstream_holds_discharged = []

[next_packet]
id = "NR-05R"
requirements = [
  "Repair F1 through F3 with focused collision, unknown-label, invisible-owner, commented-manifest, duplicate-table, and unrelated-dependency adversaries.",
  "Retain F4 as an explicit upstream hold and grant no provenance or native authority.",
  "Run only memory-bounded serialized gates while the shared agent slice remains near its throttle threshold.",
]
