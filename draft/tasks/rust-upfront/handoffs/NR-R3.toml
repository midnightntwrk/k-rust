[decision]
classification = "accepted-local-repair-wave"
summary = "A fresh audit reproduced every NR-R0 exploit and both NR-R2 transaction-closure adversaries against the repaired public boundaries. Every adversary rejected, the focused unchanged portable vectors remained green, and no audit-only test repair was required."
authority = "This acceptance covers only the local publication, locking, transaction-closure, and staged-rejection repairs. It grants no KRS, k-rust, compiler, lowering, evaluator, search-exhaustion, provenance, receipt, or other upstream native authority."

[[adversary]]
id = "NR-R0-direct-and-alias-locators"
result = "pass"
evidence = "The ArtifactLocator direct-construction compile-fail doctest passed, and concurrent_alias_writers_reject_before_storage_can_be_addressed rejected dot, empty-component, backslash, escaped, and absolute aliases before storage could be addressed."

[[adversary]]
id = "NR-R0-artifact-conflict-selection"
result = "pass"
evidence = "valid_candidate_conflict_quarantines_both_observations_and_selects_neither retained two observations, selected neither value, and remained fail closed after canonical-ledger corruption; both conflict-marker boundary failpoints also selected neither observation."

[[adversary]]
id = "NR-R0-late-multi-output-visibility"
result = "pass"
evidence = "late_multi_output_failure_accepts_no_output and late_artifact_failures_expose_no_reusable_record_or_accepted_output left every public transaction-aware artifact ingress uncommitted and the cache record nonreusable."

[[adversary]]
id = "NR-R0-incomplete-lock-aba"
result = "pass"
evidence = "ownerless_advisory_lock_file_and_orphan_staging_are_recoverable accepted an ownerless persistent lock file, while killing_a_paused_lock_owner_releases_without_aba_cleanup blocked a competing writer until kernel-owned lock release and then completed without lock-file deletion."

[[adversary]]
id = "NR-R0-staged-validator-output-leak"
result = "pass"
evidence = "validator_owned_error_cannot_escape_with_cloned_staged_output_or_identity proved a validator-owned error containing the complete cloned AppliedPatch and identity was dropped and only the fixed closed rejection escaped; the former returned-payload recovery shape also failed to compile."

[[adversary]]
id = "NR-R2-unauthorized-transaction-sibling"
result = "pass"
evidence = "committed_transaction_rejects_an_unauthorized_sibling_row rejected a canonical self-identified transaction containing one authorized queried row and one out-of-authority sibling as corrupt."

[[adversary]]
id = "NR-R2-unrelated-committed-sidecar"
result = "pass"
evidence = "canonical_record_sidecar_cannot_borrow_an_unrelated_committed_transaction rejected a canonical record sidecar redirected to a separately committed subset transaction as CorruptRecord."

