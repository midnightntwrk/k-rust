[workspace]
members = [
    "crates/krs-core",
    "crates/krs-macros",
    "crates/semantics-lib",
    "crates/semantics-app",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
inventory = "0.3.21"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

