  "Every required request has a regression that fails on the audited base or is otherwise demonstrated missing there.",
  "Every required request passes its acceptance criteria on one clean, immutable commit descended from more-semantics.",
  "Existing more-semantics structured frontend tests and backend tests continue to pass.",
  "The KRS KEVM, KWasm, and KMIR qualification suites pass against the same immutable k-rust commit without relying on the older detached dependency worktree.",
  "Any intentionally unsupported behavior returns a typed error or an explicit unknown/incomplete disposition; it must not silently discard evidence or claim completeness.",
  "Public Rust and persistent host APIs document their stability, ordering, completeness, identity, and error contracts.",
]

[priorities]
p0 = "Correctness or evidence blockers. K-in-K2 must not claim native acceptance until these are satisfied."
p1 = "Target integration and API completeness. Required for the combined production target, but separable from the four core evidence contracts."
p2 = "Performance or diagnostics whose current behavior can make valid workloads unusable without changing their denotation."
implementation_order = [
  "Preserve and continuously test the more-semantics baseline.",
  "Implement KRUST-UP-003 and KRUST-UP-004 together because search completeness and witness identity share result semantics.",
  "Implement KRUST-UP-002 using branch-local state and the stable identities established by KRUST-UP-001 and KRUST-UP-004.",
  "Implement KRUST-UP-001 across parsing, generated passes, public IR, and structured export.",
  "Port or independently implement all KRUST-COMPAT requests on the same branch.",
  "Expose KRUST-UP-005 if TypeScript/WASM remains the orchestration boundary.",
]

[design_constraints]
requirements = [
  "Public evidence must be structured. Pretty-printed K, KORE text, logs, and debug strings must not be required to recover semantic identity, provenance, transitions, or stop reasons.",
  "Semantic equality may ignore provenance, but a separate lossless representation must preserve it and round-trip it.",
  "All collections with observable ordering must define deterministic ordering.",
  "Optimization by state deduplication is allowed only when it does not erase required path witnesses or misreport search completeness.",
  "Instrumentation must be observational: enabling it must not change terminal patterns, constraints, branching, rule selection, halt reasons, or solver behavior.",
  "Unsupported inputs, lossy conversions, and resource stops must fail closed with typed dispositions.",
]
non_prescriptions = [
  "The request does not prescribe concrete Rust types, module boundaries, serialization formats, or algorithms.",
  "The older KRS patches are reference evidence, not normative implementations.",
  "A different implementation is acceptable when it satisfies the behavioral contracts and differential tests.",
]

[baseline_to_preserve]
summary = "more-semantics is the required frontend-compatibility base, not by itself the accepted K-in-K2 backend."
capabilities = [
  "Structured definition loading and compilation without routing semantic values through pretty text.",
  "Existing execute, simplify, implies, model, and prove operations.",
  "Bounded graph and pattern search and positive symbolic witnesses.",
  "The expanded pinned-reference structural differential coverage for IMP, WASM, MIR, and the selected EVM surface.",
]
qualification_warning = "The more-semantics execution and proof differential gates are currently IMP-focused. Structural compilation coverage alone must not be presented as execution or proof equivalence for WASM, MIR, or EVM."

[[request]]
id = "KRUST-UP-001"
kind = "feature-and-correctness"
priority = "p0"
title = "Lossless nested and generated provenance in the public semantic IR"
required_for = ["native semantic identity", "source-to-runtime receipts", "mutation provenance", "stable rule observation"]
problem = "Term metadata currently contains only a fragment-relative span, a production index, and an optional sort. Ordinary KAST serialization and equality ignore it, nested attributes are not completely preserved, and generated or rebuilt nodes do not expose structured origins. A consumer cannot prove where every supported semantic node came from."
contract = "For every supported parsed, lowered, rebuilt, or generated node, expose a lossless provenance record through a public structured API. Parsed records must identify the logical source and absolute range within that source. Generated records must identify the generating pass and ordered origin links, or explicitly state that the node is origin-free."
acceptance = [
  "A nested parsed term exposes a canonical logical-source identity and absolute byte range after loading and rule parsing.",
  "All attributes in the declared supported subset survive parsing, public IR access, lowering, and lossless structured export without parsing pretty text.",
  "Configuration expansion, strictness/context expansion, macro processing, fresh-variable generation, sort helpers, and other node-generating passes emit deterministic structured origin records.",
  "Two equal generated values inserted at different destinations remain distinguishable by destination anchor or equivalent structured provenance.",
  "Checkout relocation does not change logical identity when source contents and project-relative logical source identity are unchanged.",
  "Duplicate labels do not alias nodes from different modules, sources, ranges, or generated destinations.",
  "Unsupported or lossy forms return a typed diagnostic instead of silently dropping provenance or attributes.",
  "A lossless structured round trip preserves provenance even if ordinary semantic equality deliberately ignores it.",
]
minimal_reproducers = [
  "Parse a rule containing at least three nested applications and assert exact source ranges for the rule and each nested term.",
  "Generate two structurally equal terms at different insertion sites and assert distinct, stable origin paths.",
  "Load identical content from two checkout roots and assert identical logical identities but source locations resolvable in each checkout.",
]

[[request.evidence]]
path = "crates/k-rust/src/kast/ast.rs"
observation = "TermMetadata has fragment-relative span, production ID, and sort; normal serialization/equality ignore it."

[[request.evidence]]
path = "crates/k-rust/src/definition/ast.rs"
observation = "Definition attributes use a map representation; preservation or explicit rejection of multiplicity/order-sensitive forms must be established."

[[request.evidence]]
path = "README.md"
observation = "The upstream TODO still names absolute nested locations, remaining nested attributes, and nested provenance."

[[request]]
id = "KRUST-UP-002"
kind = "feature-and-correctness"
priority = "p0"
title = "Branch-local observation of committed semantic transitions"
required_for = ["RuleApplied events", "domain-event derivation", "conservative trace matching", "branch-local monitoring"]
problem = "AppliedRule contains useful structured data and execution leaves have traces, but observers receive only result-global BuiltinEffect values. BuiltinEffect currently represents only UserLog. A consumer cannot observe the committed transition payload or reliably associate effects with a branch and transition."
contract = "Expose an ordered observation stream owned by each execution branch. Emit a structured transition only after a semantic rule application commits. Identify the branch/path, rule, source provenance, bindings, introduced predicates, before pattern, after pattern, transition class, and effects produced by that transition."
acceptance = [
  "One unconditional rewrite emits exactly one committed transition observation with stable rule identity, bindings, introduced predicates, and before/after constrained patterns.",
  "Failed candidates and rolled-back attempts do not emit committed transitions.",
  "Sibling branches own independent ordered streams; observations and builtin effects never leak or merge between siblings.",
  "Every builtin effect identifies the branch and committed transition that produced it, or is explicitly classified as occurring outside a semantic transition.",
  "Rewrite, simplification, function/equation, claim, and remainder activity are classified distinctly.",
  "Disabling observation preserves results, constraints, branch topology, traces, halt reasons, solver calls, and deterministic ordering.",
  "Installing an observation filter or rule allowlist is atomic: an unsupported member rejects the whole installation.",
]
minimal_reproducers = [
  "A rule branches into two successors whose next rules and user logs differ; each leaf must contain only its own ordered events.",
  "A candidate rule matches but fails its side condition; no committed RuleApplied event may be emitted for it.",
  "Run the same request with observation enabled and disabled and compare all non-observation outputs byte-for-byte after canonical encoding.",
]

[[request.evidence]]
path = "crates/k-rust-backend/src/rewrite.rs"
observation = "AppliedRule has substitutions and predicates and leaves have branch-local traces, while ExecutionResult effects are global and the observer accepts only BuiltinEffect."

[[request.evidence]]
path = "crates/k-rust-backend/src/builtin.rs"
observation = "BuiltinEffect currently has only UserLog and cannot represent committed semantic applications."

[[request]]
id = "KRUST-UP-003"
kind = "correctness"
priority = "p0"
title = "Explicit search completeness and honest stop reasons"
required_for = ["exhaustive absence", "complete match denotation", "finite not-reached", "safe bounded search"]
problem = "Result-limit truncation stops traversal without an incomplete reason, max_results = 0 can return no results and no incomplete marker, and the stop model lacks explicit exhaustive, timeout, cancellation, and resource dispositions. An empty diagnostic list can be mistaken for proof of exhaustion."
contract = "Every search result must explicitly state either exhaustive completion or incompleteness. Every early stop must have a closed typed reason and must account for unvisited work with a retained frontier or equivalent exact accounting. Search errors must remain distinct from valid incomplete results."
acceptance = [
  "Clean finite traversal returns explicit exhaustive evidence; exhaustion is not inferred from an empty list of warnings.",
  "Reaching max_results reports result-limit incompleteness and accounts for the unvisited frontier.",
  "A zero result limit never reports exhaustive absence unless the engine independently establishes that no reachable work or result exists.",
  "Depth, breadth, result, timeout, cancellation, host-resource, solver, simplification, match, and backend-failure dispositions are distinct and closed to silent fallthrough.",
  "Pattern search explicitly reports whether returned matches are the complete denotation.",
  "Timeout and cooperative cancellation are supported with semantics compatible with execute and prove.",
  "Canonical replay of a deterministic request returns the same disposition, retained frontier ordering, and witnesses.",
]
minimal_reproducers = [
  "A finite graph with no target returns exhaustive no-match.",
  "The same graph with max_results = 0 returns incomplete unless emptiness was separately established.",
  "A target exists only on a sibling skipped by the result limit; the result must not claim complete absence.",
  "Cancel and time out equivalent searches and assert distinct typed dispositions.",
]

[[request.evidence]]
path = "crates/k-rust-backend/src/search.rs"
observation = "SearchOptions includes max_results, but IncompleteSearch has no result-limit, timeout, cancellation, resource, or explicit exhaustive variant; traversal breaks at result bounds without recording incompleteness."

[[request.evidence]]
command = "cargo test -p k-rust-backend --locked search::tests::"
observation = "All 15 audited tests pass, including a result-bound test that asserts incomplete.is_empty(), confirming that current tests encode the defect rather than the requested contract."

[[request]]
id = "KRUST-UP-004"
kind = "correctness"
priority = "p0"
title = "Preserve distinct path witnesses across converging states and bindings"
required_for = ["path-sensitive event occurrence", "complete witness sets", "deterministic replay", "counterexample receipts"]
problem = "Graph search deduplicates by state pattern, and pattern search deduplicates by substitution plus constraints. Distinct executions that converge on the same semantic state or binding can therefore collapse to one returned witness and lose a valid trace."
contract = "Separate exploration-state deduplication from witness identity. The backend may share or merge exploration work, but a path-sensitive request must preserve every distinct qualifying execution witness, or return an explicit aggregation object that retains stable identities and complete predecessor/trace alternatives."
acceptance = [
  "A diamond graph with two rule-distinct paths to one state returns two path witnesses for a path-sensitive query.",
  "Two paths producing equal substitutions and constraints but different transition traces remain distinguishable.",
  "Every witness has a stable identity derived from semantic path content or an equivalently deterministic scheme, not allocation order.",
  "Cycle control terminates bounded searches without inventing duplicate witnesses or erasing distinct acyclic prefixes.",
  "If an API requests state-set rather than path-set semantics, the response explicitly declares that modality and does not present deduplicated states as complete path witnesses.",
  "Result limits count and truncate the declared result modality consistently and interact with KRUST-UP-003's incompleteness accounting.",
]
minimal_reproducers = [
  "Rules A and B reach different intermediate states; rules C and D converge on the same terminal pattern. A path query must return A/C and B/D.",
  "Two paths satisfy one search pattern with identical bindings; both trace identities must be recoverable.",
]

[[request.evidence]]
path = "crates/k-rust-backend/src/search.rs"
observation = "push_unique deduplicates states by pattern; pattern search deduplicates matches by substitution and constraints."

[[request]]
id = "KRUST-UP-005"
kind = "public-api"
priority = "p1"
requirement = "conditional: required if the persistent TypeScript/WASM API remains K-in-K2's orchestration boundary"
title = "Persistent host API parity for search and structured observation"
problem = "The persistent Node/WASM API exposes execute, simplify, implies, model, prove, and module installation, but not search or rich branch-local observation. The Rust backend alone is insufficient if orchestration cannot access its evidence without process-local glue."
contract = "Expose graph search, pattern search, completeness dispositions, path witness identities, and branch-local structured observations through the persistent host API with lossless parity to the Rust API."
acceptance = [
  "A host client can submit graph and pattern search requests without invoking a separate CLI process.",
  "The host response preserves all KRUST-UP-002 through KRUST-UP-004 fields and distinctions.",
  "Large or streaming result sets have explicit memory/backpressure behavior and cancellation.",
  "Rust-to-host encoding round trips without using pretty text for semantic data.",
  "Version negotiation rejects incompatible schemas instead of silently dropping fields.",
]

[[request.evidence]]
path = "crates/k-rust-napi/typescript/index.ts"
observation = "The persistent API exposes execute, simplify, implies, model, prove, and add-module, but no search or structured transition-observation operation."

[[request]]
id = "KRUST-COMPAT-001"
source_id = "persistent-api-deep-result"
kind = "bug"
priority = "p1"
title = "Deep successful results must survive persistent API JSON decoding"
problem = "Backend::execute rejects a successfully executed KORE result nested beyond serde_json's default recursion limit."
acceptance = [
  "Execute and decode a valid KORE application nested beyond 128 levels through the public persistent API.",
  "The KRS KEVM 1,024-word WordStack boundary returns its successful result instead of a recursion-limit error.",
  "Malformed deep input still returns a bounded structured error and does not overflow the native stack.",
]

[[request]]
id = "KRUST-COMPAT-002"
source_id = "kevm-structured-frontend-rejection"
kind = "bug"
priority = "p1"
title = "Semantic casts of heterogeneous collection projections must lower with the required sort"
problem = "A cast such as #SemanticCastToInt(List:get(L, I)) loses the required projection during structured lowering and can make a valid function equation fail at ModuleToKORE."
acceptance = [
  "Compile an Int-returning function equation whose right side casts List:get from KItem to Int.",
  "The emitted KORE has the same typed projection behavior as the pinned K 7.1.337 reference frontend.",
  "Variable casts, already-correctly-sorted operands, and invalid casts retain their intended distinct behavior.",
]

[[request]]
id = "KRUST-COMPAT-003"
source_id = "deep-functional-simplification-budget"
kind = "performance-and-diagnostics"
priority = "p2"
title = "Deep concrete simplification must not repeatedly exhaust an opaque default budget"
problem = "A concrete recursive function over 1,024 elements can run for more than five minutes under the default 100-iteration simplification budget, while a larger explicit budget completes the full corpus in seconds."
acceptance = [
  "A benchmark covers a concrete recursive evaluation deeper than the default simplification budget.",
  "Budget exhaustion is exposed as a typed diagnostic or stop reason rather than appearing as unexplained non-progress.",
  "The engine avoids pathological repeated work or selects an adaptive/default policy that completes the KRS KEVM boundary in an explicitly documented bound.",
  "A caller may still set a deterministic explicit budget.",
]

[[request]]
id = "KRUST-COMPAT-004"
source_id = "parameterized-repeated-cell-initializer-concretization"
kind = "bug"
priority = "p1"
title = "Concretize parameterized repeated-cell initializers"
problem = "A generated initializer returning a repeated cell's collection sort is not recognized as that repeated child and is rejected during child ordering."
acceptance = [
  "Compile a repeated AccountCell map initialized from a Map-typed configuration variable.",
  "Cover parameterized Bag, Set, List, and Map repeated-cell initializers.",
  "Invalid initializers and wrong collection sorts still reject with structured cell-concretization diagnostics.",
]

[[request]]
id = "KRUST-COMPAT-005"
source_id = "krypto-hook-namespace-not-emitted"
kind = "bug"
priority = "p1"
title = "Emit backend hook metadata for every implemented KRYPTO hook"
problem = "The frontend hook namespace catalog omits KRYPTO even though the backend dispatches KRYPTO hooks, causing implemented functions to remain uninterpreted."
acceptance = [
  "A production with hook(KRYPTO.keccak256raw) emits hook metadata and evaluates end-to-end.",
  "The frontend namespace catalog is checked against every namespace implemented by the backend.",
  "Unknown namespaces remain ordinary symbols or reject according to one documented policy.",
]

[[request]]
id = "KRUST-COMPAT-006"
source_id = "implicit-default-configuration-survives-structured-replacement"
kind = "bug-and-api"
priority = "p1"
title = "Structured definition loading must not retain an unreachable implicit default configuration"
problem = "Loading the prelude through an empty bootstrap and then replacing it with a structured definition can retain DEFAULT-CONFIGURATION, whose unreachable generated <k> initializer breaks whole-definition passes for a different computation cell."
acceptance = [
  "A public structured-loading route establishes builtin and module-graph invariants without forcing DEFAULT-CONFIGURATION into the compiled definition.",
  "A fixed configuration whose main computation cell is <instrs> compiles after structured replacement.",
  "No dangling imports or generated sentences from the removed implicit configuration remain.",
  "The ordinary text-loading route retains its documented default-configuration behavior.",
]

[[request]]
id = "KRUST-COMPAT-007"
source_id = "complete-nested-cell-concretization"
kind = "bug"
priority = "p1"
title = "Accept already-complete fixed-arity nested cell applications"
problem = "Cell concretization interprets every recognized cell application as the three-argument parser-style incomplete form and rejects compiler-owned complete nested cells."
acceptance = [
  "Compile a semantic rule containing a complete fixed-arity parent cell and complete leaf children.",
  "Complete applications are recursively validated against expanded arity, child order, and sorts.",
  "Parser-style incomplete cells continue through the existing completion behavior.",
  "Malformed mixtures of complete and incomplete shapes reject deterministically.",
]

[[request]]
id = "KRUST-COMPAT-008"
source_id = "krypto-sha256raw-not-implemented"
kind = "missing-hook"
priority = "p1"
title = "Implement KRYPTO.sha256raw"
problem = "The pinned K prelude declares the byte-returning hook, but the backend returns NotApplicable."
acceptance = [
  "The empty Bytes input returns the standard 32-byte SHA-256 digest as Bytes.",
  "Non-empty standard vectors match K 7.1.337 behavior.",
  "Non-concrete arguments remain NotApplicable rather than being treated as invalid concrete input.",
]

[[request]]
id = "KRUST-COMPAT-009"
source_id = "krypto-ripemd160raw-not-implemented"
kind = "missing-hook"
priority = "p1"
title = "Implement KRYPTO.ripemd160raw"
problem = "The pinned K prelude declares the byte-returning hook, but the backend returns NotApplicable."
acceptance = [
  "The empty Bytes input returns the standard 20-byte RIPEMD-160 digest as Bytes.",
  "Non-empty standard vectors match K 7.1.337 behavior.",
  "Non-concrete arguments remain NotApplicable rather than being treated as invalid concrete input.",
]

[[request]]
id = "KRUST-COMPAT-010"
source_id = "krypto-ecdsa-recover-invalid-signature-is-bottom"
kind = "semantic-bug"
priority = "p1"
title = "KRYPTO.ecdsaRecover invalid concrete inputs must return empty Bytes"
problem = "Invalid recovery IDs, scalars, signatures, or recovery failures currently become Bottom, but K 7.1.337 and KEVM require a successful hook result containing empty Bytes."
acceptance = [
  "Recovery ID 29 returns empty Bytes.",
  "A zero r scalar and other invalid concrete signatures return empty Bytes.",
  "A pinned valid secp256k1 vector returns the expected recovered key bytes.",
  "Symbolic or otherwise non-concrete arguments remain NotApplicable.",
  "An end-to-end KEVM ECREC vector completes successfully with empty returndata for an invalid signature.",
]

[[request]]
id = "KRUST-COMPAT-011"
source_id = "krypto-bn128-hooks-not-implemented"
kind = "missing-hooks"
priority = "p1"
title = "Implement the pinned Ethereum BN128 hook family"
problem = "The backend does not implement the K 7.1.337 BN128 validity, addition, multiplication, G2 validity, or pairing hooks needed by KEVM precompiles 6 through 8."
required_hooks = [
  "KRYPTO.bn128valid",
  "KRYPTO.bn128add",
  "KRYPTO.bn128mul",
  "KRYPTO.bn128g2valid",
  "KRYPTO.bn128ate",
]
acceptance = [
  "Behavior matches Ethereum/K 7.1.337 for field bounds, curve membership, subgroup validity, and infinity encodings.",
  "Addition and scalar multiplication pass valid, infinity, zero-scalar, and invalid-coordinate vectors.",
  "Pairing passes empty input, identity/non-identity product, cancelling product, and malformed or mismatched list vectors.",
  "Concrete K List elements, injected elements, opaque lists, and non-concrete inputs have explicitly tested dispositions.",
  "End-to-end KEVM ECADD, ECMUL, and ECPAIRING vectors execute through the structured frontend/backend path.",
]

