schema_version = 1
matrix_id = "k-in-k/backend-target-capability-matrix/v1"
status = "qualification-open"
last_reviewed = 2026-09-02
issue_register = "upstream-issues.toml"
portable_contract_commit = "0da432cae8619ff837f59de9a1efdb1085471fa4"
full_development_block = false
full_native_acceptance_block = true

[roles]
k_in_k2 = "Owns portable semantics, mutation contracts, adapters, orchestration, evidence, receipts, caches, and fail-closed acceptance."
KRS = "Provides the Rust-based language, compiler, typed semantic IR, Definition IR, and adapter used to author K definitions for the target."
k_rust = "Provides the K frontend and backend engine used to load, lower, execute, prove, and search those definitions."

[decision]
development_now = [
  "Implement and test portable RS-01 identities and artifact ingress.",
  "Implement RS-02 patch algebra and atomic transactions.",
  "Implement the RS-04 trace-reference evaluator without claiming native event production.",
  "Implement RS-06 discovery and candidate protocols.",
  "Implement the non-semantic RS-07 worker, receipt, cache, replay, and reporting layers behind not-proven gates.",
  "Retain the passing current-pin NR-07A fixture-level positive transport gate and NR-07Q selected-surface structural gate without widening their authority.",
  "Retain NR-07Q-T1's five passing component exercises and NR-07Q-T2's continuous application/literal/reference route as local evidence only.",
  "Use the passing distinct NR-07Q-T3 cell/list/map component routes to build continuous cell and collection routes, then complete the remaining selected rows and structured failures.",
  "Run NR-07I as positive-only K-owned discovery, compiler, and evaluator integration; decode only K-produced sites and joined tuples.",
]
must_wait = [
  "Native provenance-complete acceptance waits for KRS-BRIDGE-001 even though the selected k-rust engine provenance surface is public.",
  "Exhaustive absence, complete-denotation, and finite not-reached acceptance wait for KRUST-UP-003.",
  "Production authority waits for checked lowering, separately qualified K-authored compiler and independent evaluator evidence, and a sealed issuer.",
  "Final native readiness waits for NR-04 isolation authority and final NR-07 production authority.",
]

[snapshots]
krs_revision = "be5f8449854567f198e841d2a96fbe188cfa96ac"
dedicated_k_rust_revision = "c41caa8bede96e279e0b058577dce504e4144f65"
shared_k_rust_surveillance_revision = "c41caa8bede96e279e0b058577dce504e4144f65"
authority_pin = "selected current k-rust c41caa8; local qualification gates grant no production authority"
audit = "../../draft/tasks/rust-upfront/handoffs/NR-U5.toml"

[[gate]]
id = "KRS-QUAL-001"
owner = "KRS"
kind = "qualification-gate"
status = "partial-current-pin-evidence-full-qualification-blocked"
functional_defect_established = false
blocks = ["selection of KRS as an accepted K-in-K2 authoring surface"]
does_not_block = ["portable K-in-K2 implementation", "k-rust issue reproducers", "provisional adapter experiments"]
reason = "Exact KRS be5f844 and dedicated k-rust c41caa8 are the selected current qualification subjects. The current-pin structural, NR-07A, NR-07Q-T1, NR-07Q-T2, and NR-07Q-T3 gates pass, but remaining selected rows, structured failures, and continuous cell and collection routes are absent. These partial gates do not close KRS-QUAL-001."
required_fixture = "NR-07Q must exercise the declared selected K-in-K2 fragment through typed KRS syntax, semantic IR, Definition IR, the KRS-to-k-rust adapter, and k-rust frontend/backend execution without an untracked raw-K escape."
acceptance = [
  "The fixture records an immutable KRS commit and exact k-rust dependency commit.",
  "The fixture covers modules, imports, sorts, subsorts, productions, configuration cells, rules, claims, requires/ensures, variables, applications, rewrites, sequences, collections, attributes, and every selected hook actually required by K-in-K2.",
  "Every selected authored node has a typed KRS origin and every supported adapter destination has a deterministic structural sidecar entry.",
  "Unsupported KRS or adapter forms reject with structured diagnostics rather than text fallback or silent metadata loss.",
  "The emitted structured definition compiles and executes through k-rust while preserving the fixture's expected terminal and branch results.",
  "The gate distinguishes a KRS language/compiler/IR/adapter failure from a downstream k-rust frontend/backend failure.",
  "Qualification grants no provenance-complete authority while KRS-BRIDGE-001 remains open.",
]

[[gate.evidence]]
repository = "../krs"
path = "crates/krs-k-rust/src/lib.rs"
lines = "54-148,203-253,549-700,998-1033"
observation = "The live KRS adapter pins k-rust, declares structured preparation, retains authored-to-Definition-IR origins in a structural sidecar, and compiles structured Definition IR without reparsing emitted KRS source."
authority = "exact-pinned-read-only"

[[gate.evidence]]
repository = "../krs"
path = "K_RUST_HANDOFF.md"
observation = "The live handoff reports concrete KEVM, KMIR, KWasm, and adapter gates through the dedicated k-rust frontend/backend dependency."
authority = "exact-be5f844-read-only"

[[gate]]
id = "KRS-BRIDGE-001"
owner = "KRS"
kind = "integration-authority-gate"
status = "open"
functional_defect_established = false
blocks = ["provenance-complete native receipts", "portable emitting-sentence provenance", "final NR-07 production authority"]
does_not_block = ["NR-07Q selected-surface qualification", "NR-07I positive-only integration", "NR-06 positive-bounded observation and search"]
reason = "KRS be5f844 retains NodeOrigin in OriginMapping, and dedicated k-rust c41caa8 exposes public provenance types, but the adapter does not bind the sidecar into SourceTable, TermSpan, production metadata, and OriginRecord or return equivalent linked evidence."
acceptance = [
  "Every selected KRS origin maps deterministically to its applicable public k-rust provenance carrier or an equivalent checked relation; legitimate one-to-many expansion remains explicit and ordered.",
  "Generated and rebuilt nodes preserve structured origins and deterministic destination anchors.",
  "Unsupported, ambiguous, or lossy mappings reject without producing native authority.",
  "Relocation and duplicate-identity adversaries preserve the same logical provenance relation.",
]

[[gate]]
id = "KRUST-QUAL-001"
owner = "k-rust"
kind = "upstream-capability-gate"
status = "positive-engine-capabilities-available-residual-authority-blocked"
functional_defect_established = true
blocks = ["the exhaustive claims named by KRUST-UP-003", "checked-lowering claims"]
does_not_block = ["public provenance indexing", "committed branch-local observation", "structured compilation", "concrete execution", "positive bounded state, path, pattern, and pattern-path witnesses", "portable K-in-K2 layers"]
reason = "Dedicated k-rust c41caa8 exposes public provenance, committed branch-local observation, and typed positive search surfaces. ResultBound remains frontier-free, there is no explicit Exhausted record, and no checked lowering proof/checker is available."

[[capability]]
id = "TARGET-01"
name = "Typed K definition authoring"
required_by = ["RS-01", "RS-03", "RS-04", "RS-06", "RS-07 K-authored evaluators"]
primary_provider = "KRS"
supporting_provider = "k-rust"
status = "partial-current-pin-evidence-qualification-blocked"
blocker = "KRS-QUAL-001"
available_now = "Exact KRS be5f844 exposes typed semantic and Definition IR plus a structured adapter and pins c41caa8. Current-pin structural and fixture gates pass through NR-07Q-T3, including a continuous nine-stage application/literal/reference route and distinct cell/list/map component routes."
missing_for_acceptance = "Remaining selected rows, structured failures, and continuous cell and collection routes are incomplete; KRS-QUAL-001 remains open, and provenance-complete acceptance separately waits for KRS-BRIDGE-001."

[[capability]]
id = "TARGET-02"
name = "Structured frontend compilation and baseline execution"
required_by = ["RS-01", "RS-02 native validation", "RS-07 concrete campaigns"]
primary_provider = "k-rust"
supporting_provider = "KRS"
status = "available-for-development"
blocker = "none for bounded concrete development"
available_now = "k-rust exposes structured compilation, execution, simplification, implication, model, and proof APIs. KRS exposes a pinned Definition-IR adapter into that frontend."
missing_for_acceptance = "NR-07A passes its current-pin fixture runtime gate, but NR-07Q must still qualify the full selected surface and production receipts remain sealed."

[[capability.evidence]]
repository = "../inspirations/midnightntwrk/k-rust-krs-main"
path = "crates/k-rust/src/backend.rs"
lines = "44-234,245-482"
observation = "The public backend declares execution, simplification, implication, model, and proving request/result surfaces."

[[capability]]
id = "TARGET-03"
name = "Lossless semantic identity and provenance"
required_by = ["RS-01", "RS-02 receipts", "RS-03 selection", "RS-06 edit receipts", "RS-07 production receipts"]
primary_provider = "k-rust"
supporting_provider = "KRS"
status = "engine-available-krs-bridge-blocked"
blocker = "KRS-BRIDGE-001"
available_now = "Dedicated k-rust c41caa8 publicly exposes SourceTable, TermSpan, production metadata, and OriginRecord. KRS be5f844 retains authored NodeOrigin values in deterministic OriginMapping sidecars."
missing_for_acceptance = "KRS does not bridge OriginMapping into the k-rust provenance objects or return an equivalent provenance-bearing compilation result."

[[capability]]
id = "TARGET-04"
name = "Typed patch application and mutation discovery"
required_by = ["RS-02", "RS-06"]
primary_provider = "K-in-K2"
supporting_provider = "KRS"
status = "ready-local"
blocker = "none for portable implementation"
available_now = "The frozen package defines original-relative paths, closed edits, overlap rejection, atomic transactions, deterministic discovery, and receipts."
missing_for_acceptance = "Native type/lowering validation needs NR-07Q qualification and a checked lowering proof/checker; provenance-complete receipts remain gated by KRS-BRIDGE-001."

[[capability]]
id = "TARGET-05"
name = "Committed branch-local rule observation"
required_by = ["RS-03", "RS-04 native production", "RS-05 monitoring", "RS-07 execution-pattern oracles"]
primary_provider = "k-rust"
supporting_provider = "K-in-K2"
status = "engine-capable-positive-adapter-accepted"
blocker = "KRS-BRIDGE-001 for portable emitting-sentence provenance and production authority"
available_now = "Dedicated k-rust c41caa8 exposes ordered branch-local committed Transition observations with identities, classes, bindings, introduced predicates, before/after states, and effects; NR-06 adapts them as positive-bounded evidence."
missing_for_acceptance = "Portable emitting-sentence provenance and production receipts remain blocked on the KRS bridge and sealed final authority."

[[capability.evidence]]
repository = "../inspirations/midnightntwrk/k-rust-krs-main"
path = "crates/k-rust/src/backend/wire.rs"
lines = "126-166,393-467"
observation = "The selected public wire surface returns ordered committed and uncommitted observation records per state or path."

[[capability]]
id = "TARGET-06"
name = "Concrete event occurrence and pattern-plan evaluation"
required_by = ["RS-04", "RS-07 concrete execution-pattern campaigns"]
primary_provider = "K-in-K2"
supporting_provider = "k-rust"
status = "portable-and-positive-native-ready-production-blocked"
blocker = "KRS-BRIDGE-001 and final NR-07 for production authority"
available_now = "K-in-K2 can implement and qualify the complete trace-reference evaluator, DNF plan typing, witness ordering, and occurrence semantics."
missing_for_acceptance = "End-to-end native RuleApplied and domain-event production cannot be accepted until emitting-sentence provenance and sealed production issuance validate."

[[capability]]
id = "TARGET-07"
name = "Symbolic branching, pattern search, and honest completeness"
required_by = ["RS-05", "RS-07 symbolic campaigns", "BAG-16 native collections"]
primary_provider = "k-rust"
supporting_provider = "K-in-K2"
status = "positive-witnesses-only"
blocker = "KRUST-UP-003 for exhaustive or absence claims"
available_now = "Dedicated k-rust c41caa8 exposes state, path, pattern, and pattern-path results plus ResultBound, Cancelled, and other typed incomplete reasons. Positive witnesses are usable with an explicit bounded modality."
missing_for_acceptance = "ResultBound is a unit record with no frontier or unvisited-work accounting, and no explicit Exhausted record exists; empty results cannot establish exhaustion, no-match, or not-reached."

[[capability.evidence]]
repository = "../inspirations/midnightntwrk/k-rust-krs-main"
path = "crates/k-rust-backend/src/search.rs"
lines = "45-92,343-355,428-438"
observation = "The search API returns structured state, path, and pattern evidence and records ResultBound, but ResultBound has no frontier and no explicit Exhausted result exists."

[[capability]]
id = "TARGET-08"
name = "Campaign isolation, receipts, cache, replay, and reporting"
required_by = ["RS-07", "BAG-14", "BAG-15", "BAG-16"]
primary_provider = "K-in-K2"
supporting_provider = "k-rust"
status = "ready-local-with-native-gates"
blocker = "none for implementation; upstream issues gate only the semantic evidence they affect"
available_now = "The frozen portable schemas and vectors define keys, receipts, cache publication, scheduling, replay, comparison, and failure semantics."
missing_for_acceptance = "Durable local layers exist, but NR-04 has no delegated isolation authority and final production issuance remains sealed behind NR-07."

[[external_register]]
owner = "KRS"
path = "../krs/K_RUST_UPSTREAM.toml"
status = "informational-read-only-exact-revision"
issue_count_observed = 11
provider = "k-rust"
classification = "These are k-rust defects or performance findings discovered by KRS. Their locally-fixed or local-workaround state does not make them KRS-language blockers. They become K-in-K2 blockers only if the selected target fragment depends on the affected behavior and the dedicated mitigation is not included in the pinned target."

[scope]
retired_backend_path = "must-not-extend"
streaming_rs_08 = "held"
next_milestone = "Complete the remaining NR-07Q selected rows and structured failures plus continuous KRS-authored cell and collection routes before NR-07I positive-only integration."
