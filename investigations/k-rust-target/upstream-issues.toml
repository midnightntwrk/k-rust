does_not_block = ["NR-07Q selected-surface qualification", "NR-07I positive-only integration", "NR-06 positive-bounded observation and search"]
summary = "KRS be5f844 exposes OriginMapping with authored NodeOrigin and deterministic structural destinations, while dedicated k-rust c41caa8 exposes public provenance objects. The adapter does not bind those surfaces or return equivalent linked compilation evidence."
