[local_constraint.external_z3]
owner = "KRS"
provider = "KRS dependency integration"
consumer = "KRS"
upstream_issue = false
blocks_k_in_k2 = false
policy = "The dedicated k-rust-krs worktree disables z3 crate gh-release acquisition and consumes externally supplied Z3 4.12.5 through the KRS Nix compatibility unit."
acceptance = [
  "The Nix unit pins the Z3 4.12.5 artifact and exposes its library and headers to z3-sys.",
  "The KRS dependency closure is reproducible without selecting a solver release at build time.",
  "Z3-enabled backend tests pass inside that pinned environment.",
  "The KRS lock or equivalent Nix dependency closure remains consistent with the manifest while upstream Cargo.lock stays an upstream artifact.",
]

[scope]
retired_backend_path = "must-not-extend"
streaming_rs_08 = "held"
notes = "K-in-K2 owns portable contracts and product orchestration. KRS owns its authoring-language and adapter boundary. k-rust owns its frontend/backend engine surfaces. The upstream requests are limited to engine evidence that cannot be reconstructed honestly by either adapter."
