request = "Bridge every selected OriginMapping into its applicable public k-rust source, term, production, sentence, or generated-origin carrier, or return an equivalent checked relation with fail-closed unsupported-form handling."
acceptance = ["Every selected authored node maps deterministically into the applicable public engine provenance carrier, with legitimate one-to-many expansion explicit and ordered.", "Generated and rebuilt nodes carry structured origins and deterministic destination anchors.", "Unsupported, ambiguous, and lossy mappings reject.", "Relocation and duplicate-identity adversaries preserve the relation."]

