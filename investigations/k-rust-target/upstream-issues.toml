[[issue]]
id = "KRUST-UP-003"
provider = "k-rust"
consumer = "K-in-K2"
state = "open-narrowed"
priority = "hard-blocker-for-exhaustive-claims"
component = "backend search completeness and stop fidelity"
suggested_upstream_title = "Expose explicit search exhaustion and frontier-bearing result bounds"
blocks = ["RS-05 exhaustive symbolic absence", "RS-07 exhaustive no-match", "RS-07 finite not-reached", "BAG-16 native collection completeness"]
does_not_block = ["positive match evidence", "bounded prefix collection", "concrete execution without an absence claim", "portable aggregation logic"]
summary = "Dedicated k-rust c41caa8 reports ResultBound and Cancelled and exposes state, path, pattern, and path-pattern results. ResultBound is a unit variant with no frontier or unvisited-work accounting, and no explicit Exhausted record exists, so completeness and absence remain unprovable."
temporary_policy = "K-in-K2 must treat empty, result-bounded, cancelled, externally stopped, or otherwise incomplete responses as unknown. Positive witnesses remain usable as bounded evidence."
request = "Return explicit exhausted completion or equivalent checked completion evidence. ResultBound must retain a live frontier or exact unvisited-work accounting; empty incomplete diagnostics must not be the sole proof of exhaustion."
acceptance = [
  "Reaching max_results reports result-bound incompleteness and preserves the unvisited frontier or an exact unvisited count.",
  "A zero result bound is incomplete whenever reachable work exists and cannot serialize as exhaustive empty search.",
  "Depth, breadth, result, cancellation, solver, simplification, match, and backend failures retain distinct closed dispositions.",
  "A clean finite traversal carries explicit exhaustive evidence rather than requiring inference from an empty diagnostic vector.",
  "Pattern search reports whether its returned match set is the complete denotation; truncating matches cannot return complete coverage.",
  "Tests cover finite absence, bounded absence, a match on one truncated sibling, and deterministic replay of every retained witness.",
]

[[issue.evidence]]
path = "crates/k-rust-backend/src/search.rs"
lines = "45-92"
observation = "IncompleteSearch includes ResultBound and Cancelled, but ResultBound carries no state or frontier and there is no Exhausted arm."

[[issue.evidence]]
path = "crates/k-rust-backend/src/search.rs"
lines = "343-355,428-438"
observation = "Zero and reached result bounds append ResultBound, but the record remains frontier-free."

