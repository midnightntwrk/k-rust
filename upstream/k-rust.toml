[[request]]
id = "nested-provenance-residual"
title = "Lossless nested definition provenance and context-alias persistence"
kind = "correctness"
status = "fixed"
fixed_in = "present at 347f693e"
status_basis = "test run at 347f693e on 2026-09-27 (cargo test --workspace; kink-native all_transitions_uses_typed_provenance_without_source_attributes and rule_identities_resolve_by_source_position_per_compiled_side), plus k-rust KRUST-PROVENANCE v7 contract; K-in-K2 has no serialization test yet"
blocking = false
needed_by = ["emitting-sentence provenance"]
summary = "KRUST-PROVENANCE v7 round-trips definitions and source tables, including context aliases and nested spans. KAST v4 is not a lossless context-alias archive; its unsupported marker is rejected on decode. K-in-K2 currently uses the in-process typed sentence relation and has not implemented SemanticInput serialization."
reproducer = "Historical at 985e0086: export a definition containing a context alias through KAST v4. At this pin KRUST-PROVENANCE v7 is the lossless format; KAST v4 rejects unsupported aliases on decode."
local_workaround = "none"
requested_action = "Satisfied by KRUST-PROVENANCE v7 for lossless persistence; use to_provenance_string/from_provenance_str with the source table. KAST v4 remains unsuitable as a lossless context-alias archive."
sources = ["k-rust-agent-requests.toml KRUST-UP-001", "upstream-issues.toml KRUST-UP-001"]

