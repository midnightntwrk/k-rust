summary = "At 927b9ce6, max_depth bounds one path and max_breadth the pending frontier, but nothing bounds the total work of an execution. kink's only stops were wall time and process memory, both host-dependent and uncacheable (glibc kept 8.3 GB resident after a stopped run). At 501f18b9, maxWork bounds the states an execution visits: work counts every state taken from the worklist, merged arrivals included, and is reported on every result, with expanded beside it. Exceeding the budget ends the run with one work-bound leaf, which is always the last leaf and never merged; the pending states are dropped, and the result is never a complete exploration. The work-bound leaf's state is unexpanded and unnormalised."
reproducer = "None (missing feature; HANDOFF.md KINK-16). k-rust's criterion 2: budgets w and w + 1, where w is the unbounded run's work, give identical results, and w - 1 gives one work-bound leaf."
local_workaround = "kink sends max_work None and maps WorkBound fail-closed: the adapter answers ContractViolation and the runner Infrastructure, so the status is Error (R0a). When lane 1 sets max_work, it maps WorkBound like BreadthBound: BackendLimit, no real prefix, never discarded (findings A-05; R0b deviation 6)."
requested_action = "Handoff KINK-16 (P1). ExecuteRequest accepts an optional work budget, counted deterministically over the whole execution with all paths together (states explored, or rewrite steps). Exceeding it ends the run with a distinct, documented disposition, neither Timeout nor a normal halt. The work after the stop is bounded (KINK-15), and the result reports the count used. Acceptance: (1) the same request and budget stop at the same point, with the same leaves and count, on every run, platform and thread count; (2) a budget at least as large as an unbounded run's count changes nothing; (3) the disposition is distinct, documented and never a complete exploration; (4) the cost of counting is negligible. Unresolved: what to count (k-rust proposes, Sebastien confirms; ADDENDUM-2 delegated it to k-rust)."
where_requested_shape_differs = "The count is states visited, decided by k-rust's orchestrator on 2026-10-16 from measurement (ADDENDUM-2 delegated the choice); expanded is reported beside it. Criterion 1 is scoped to one build, solver profile and modality, within the Execute promise's exclusions, and was not tested across platforms. Criterion 4 was measured on kink's IMP corpus (317 runs, 14.7-17.3 us per unit) rather than on the reference-differential cases. RPC responses and krun --output kore carry no work count."
sources = ["draft/tasks/k-rust-handoff-2026-10-15/HANDOFF.md KINK-16; ADDENDUM-1.md; ADDENDUM-2.md section 2", "k-in-k2 draft/tasks/flow/handoffs/F-11.toml proposed_requests[1] (reworded 2026-10-15)", "draft/tasks/upstream-pending.md (2026-10-15)", "k-rust draft/k-in-k/answers-2026-10.toml KINK-16"]
handoff = "KINK-16"
update_2026_10_17 = "Folded from k-rust draft/k-in-k/answers-2026-10.toml KINK-16 ('done'). kink adopts it with restrictions. A work-bound result is incomplete: its leaf's state is never compared and gives no real prefix (findings A-05). A work-bound outcome is cached only under the Execute promise, keyed on budget, modality and solver profile, and not in Z3 builds while tier 1 is off there (B-08). Budgets are calibrated per definition from baseline work, in the mutants' modality (A-16, B-15). k-rust's one-sided kill (a clean ground Stuck leaf before the work-bound leaf, absent from the baseline's complete set) is accepted for ground tests and complete baselines only (ANALYSIS decision 6; lane 1). Still open at k-rust: a deterministic per-step poll budget (trigger: watchdog stops inside one step), FU-11 and FU-15."

[[request]]
id = "unadmitted-hook-namespace-visibility"
title = "A hook in an unadmitted namespace is silently compiled as an unhooked function"
kind = "tooling"
status = "fixed"
fixed_in = "present at 927b9ce6"
status_basis = "static screen of source at 927b9ce6 on 2026-10-15: kompile emits Diagnostic::warning_at(DiagnosticCode::UnadmittedHookNamespace, ..., attributes) (k-rust kompile/compile.rs:739-745), and Diagnostic carries code, source and location (diagnostic.rs:197, :288-295); observed in K-in-K2 CS-01 against 927b9ce6 on 2026-10-08"
blocking = false
needed_by = ["K-in-K2 corpus admission records (fidelity: say when a definition's declared hooks were dropped)"]
summary = "A function hook outside the builtin and admitted namespaces only produces the warning UnadmittedHookNamespace, and the production compiles as an unhooked function. Not a soundness issue for kink (baseline and mutant see the same uninterpreted function). The hook name is only in the message text, but the structured code and the production's location let a host read the hook attribute from the resolved definition it holds; warnings_to_errors gives the strict option globally. Same logic at 9ea39ec7 (compile.rs:822-856)."
reproducer = "syntax Int ::= inert(Int) [function, hook(KINKTEST.unimplemented)]; compile with default options: one UnadmittedHookNamespace warning with a location; the BackendDefinition symbol has no hook."
local_workaround = "kink records kompile warnings with code and message in admission records (kink-corpus admission.rs:280-291); kink-side: also record the location and resolve the hook from it (CS-T11)."
requested_action = "Satisfied by the existing structured diagnostic (code plus location); no k-rust request. If handoff KINK-12's proposal D12b (hook capability query) lands, dropped hooks can appear in it."
sources = ["k-rust draft/k-in-k/requests-2026-10-07.toml row unadmitted-hook-namespace-visibility", "k-in-k2 draft/tasks/upstream-pending.md", "draft/tasks/corpus-scale/handoffs/CS-01.toml (CS01-INERT-HOOK-NAMESPACE); corpus-scale/decisions/human-decisions-2026-10-08.md", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-1.md section 10"]
status_at_main = "fixed"
