[[request]]
id = "malformed-deep-json"
title = "Malformed deeply nested KORE JSON can overflow the stack on the persistent host routes"
kind = "bug"
status = "fixed"
status_basis = "static re-screen at 927b9ce6 on 2026-10-06: request KORE fields are kore::ast::Pattern decoded from raw text by the iterative KORE decoder with serde's recursion limit on (k-rust backend/wire.rs:159-172); napi and wasm read every backend request through it (k-rust-napi lib.rs:442-447); disable_recursion_limit survives only in tests/kast_json.rs:39; regressions backend/mod.rs:2123 deep_malformed_kore_request_fields_are_ordinary_errors, :3575 deep_invalid_requests_are_ordinary_errors_on_every_route, k-rust-wasm lib.rs:693 and the rpc.rs 200,000-level tests. Not run by K-in-K2, which has no host JSON ingress."
blocking = false
needed_by = ["none in the goal; K-in-K2 calls k-rust in process and has no host JSON request ingress"]
summary = "The in-process K-in-K2 execution path does not parse host request JSON. At 927b9ce6 the napi, wasm and JSON-RPC routes decode request KORE fields iteratively into kore::ast::Pattern and keep serde's recursion limit for every other value, so malformed input of any depth is an ordinary error; valid deep input runs on a grown stack segment and is refused (InsufficientStack) only above 4 GiB. The fix differs from the requested action: the decoder was not the cause, the recursive serde_json::Value round trips were. Outside this request: on wasm32 a valid pattern too deep for the engine's stack traps (docs/backend-port.md:139, 165), and an execution that deepens terms far beyond its input's depth can still overflow a pass other than the simplifier."
reproducer = "Submit a 200,000-deep malformed KORE JSON request through the napi execute route."
local_workaround = "none"
requested_action = "Satisfied as redesigned: host request KORE is decoded into kore::ast::Pattern from raw text, and no recursive JSON value is built for KORE terms or responses."
sources = ["k-rust-agent-requests.toml KRUST-COMPAT-001", "krs draft/upstream/k-rust.toml backend-deep-result"]
fixed_in = "3796d5b7 (k-rust main fast-forward of kink/requests-integration on 2026-10-05: 64e0c977, ba1921ad, 10df3340, e7ab2f29, 7a1c3287, f042dc85), with 1bf3f94a, 13cd6e5f and 9f176c06 on main before 927b9ce6"


