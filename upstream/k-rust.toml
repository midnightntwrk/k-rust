[[request]]
id = "variable-identity"
title = "Variable names are not identities: lossy printing and name reuse along a path"
kind = "correctness"
status = "fixed"
fixed_in = "3796d5b7 (k-rust main fast-forward of kink/requests-integration on 2026-10-05; redesigned variable identity 8e911bdb..ef9f2fa2, VARIABLE_IDENTITY = 3 at 7e580870), with cf6525fe (request spellings as received, before alias unfolding) on main before 927b9ce6"
status_basis = "static re-screen at 927b9ce6 on 2026-10-06: k-rust main; VARIABLE_IDENTITY = 3 (k-rust-backend term/names.rs:33-62): names read verbatim (a non-identifier is DefinitionError::VariableName), injective escape printing with capture-avoiding binder renaming, one FreshCounter per request skipping every request spelling as received (fresh.rs:31-112), equation instances with unbound result variables Indeterminate(UnboundResultVariables) and unused; contract tests tests/backend/names.rs:543, :718, :751 and k-rust tests/unbound_equations.rs:131 present. kink asserts VARIABLE_IDENTITY == 3; test run at 927b9ce6 on 2026-10-06 (VI-03F; decoded_leaf_and_step_names_round_trip, initial_names_do_not_conflate_with_narrowing_mints, fresh_counters_do_not_conflate_distinct_narrowing_mints, scope_name_forgery_does_not_prove_an_identical_relation and existential_rules_keep_initial_variable_comparisons in both profiles): workspace 290/0/0, Z3 kink-native 132/0/0 and Z3 kink-campaign 99/0/0; all clippy gates and fmt pass."
blocking = false
needed_by = ["state-observations SO-08", "variable-identity VI-04"]
summary = "k-rust externalizes variables with a lossy Booster/Kore spelling: it drops provenance markers and prints fresh counters as bare digits, so distinct internal names can share one KORE name and an output mint can share a request name. Reading KORE back does not invert that spelling. Separately, freshen_existential strips the Ex# marker, keeps a rule variable's name, and avoids only names in the current pattern, so a name can be reused for different values along one path. Both mechanisms break docs/compatibility.md:485-489's output contract that only request variables have names shared with the query. Resolved on k-rust main as VARIABLE_IDENTITY = 3, a redesign of the provisional v2 (9494bb48) K-in-K2 tested. v2 decoded printed names back into markers on reading (a bijection); v3 reads every name verbatim, so a printed mint read back is an ordinary request variable spelled like it, and a response read back is the internal one up to a bijective renaming that is the identity on the request's names. Every variable a rewrite introduces is minted from one per-request counter that skips every spelling of the request, so no mint is reused on a path or prints like a request name. Also unlike v2: an equation instance with unbound result variables is Indeterminate(UnboundResultVariables) and left unused, reported as an UndecidedCondition diagnostic (v2's SearchFailureOutput::IndeterminateEquation is gone), requires-only variables are decided as before, and search and state-set results are one result up to renaming of non-request variables (PathSet, which kink uses, is unchanged)."
reproducer = "In the map-selection execution with an initial frame named ExFrame0, a fresh Ex#Frame!0 prints as ExFrame0: the printed leaf asserts ExFrame0 = mapConcat(mapItem(ExKEY1,ExVALUE2), ExFrame0) and ¬(ExKEY1 ∈ ExFrame0), while the remainder's ∃ ExFrame0 captures the user's free frame. With SUBJECTREST as the initial frame name, the output is correct. Distinct mints Ex#VarI1!0 and Ex#VarI!10 both print ExVarI10."
local_workaround = "retired: VI-04 (ecc4cc8) deleted identifies_one_variable, the exact-name check, the existentials flag and the runner's per-pair baseline re-evaluation; SO-08 (9d58e03) retired the EI difference certificate and its module. kink asserts VARIABLE_IDENTITY == 3 at compile time (feasibility.rs) and restates the v3 premises in feasibility.rs and bridge.rs. The only stable-name input is feasibility::TestInitialState, the test's initial state: kink identifies across requests only its variables (InitialVariables), and its only production construction is the runner's, from TestCase::initial_state (a code-review invariant: the constructor accepts any pattern)."
requested_action = "Satisfied as redesigned on k-rust main (VARIABLE_IDENTITY = 3; docs/compatibility.md 'Variable names', 'Result variables', 'Unbound equation variables'). The original VI-K1..VI-K3 specification (draft/tasks/variable-identity/README.md 5.1-5.3) is in this file's history at eb94ba1."
sources = ["draft/tasks/variable-identity/README.md", "draft/tasks/variable-identity/decisions/human-decisions-2026-09-29.md", "draft/tasks/slot-evidence/README.md 3.1-3.2"]

where_requested_shape_differs = "D-C: v3 reads identifiers verbatim instead of decoding; no RequestScope is needed because read names cannot contain # or !. One growing counter skips every request spelling as received. VI-D3 is superseded: instances with unbound result/ensures variables stay unused with an UndecidedCondition diagnostic; requires-only variables are decided by validity. Printing renames binders to avoid capture."
update_2026_10_17 = "Re-pin to 501f18b9: VARIABLE_IDENTITY is 3 (k-rust-backend term/names.rs:62), and kink's compile-time assertion holds. The naming is unchanged (answers-2026-10.toml section_2_2_summary (7)). The tests cited above pass in the K-in-K2 1ee9955 gate of record (draft/tasks/repin-501f18b9/handoffs/R0c-fix-4.toml: workspace 777/0/9; Z3 kink-native 229/0/1, kink-campaign 220/0/1, kink-corpus 56/0/8). Still fixed."

