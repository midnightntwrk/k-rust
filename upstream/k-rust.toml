[[request]]
id = "unsat-definedness-contract"
title = "State as a facade contract that execution-leaf constraints meet the definedness premise for a conclusive SMT Unsat"
kind = "correctness"
status = "open"
status_basis = "static screen of source at 927b9ce6 on 2026-10-06 (adversarial verification: PLAUSIBLE; no violating leaf produced)"
blocking = false
needed_by = ["K-in-K2 SO-08 (pattern kills rest directly on relation Unsat->Absent and leaf Unsat discards once the EI certificate is deleted)", "K-in-K2 SO-09 trust-base audit"]
summary = "k-rust's docs disagree on when an SMT Unsat is conclusive. N/crates/k-rust-backend/src/smt.rs:180-183 (ceca4fef): a partial function translated as a total SMT operation 'is not an over-approximation ... Unsat stays conclusive for it only under the definedness premise that SmtSolver::check_predicates documents'; smt.rs:740-744: that premise is that the definedness of the predicate's partial terms is explicit in it. N/docs/compatibility.md:626 (unchanged from O/docs/compatibility.md:422) still says 'A solver Unsat is sound under every approximation of the translation'. The facade promises only that a leaf predicate implies the definedness of every partial term 'relied on by its conditions, right-hand sides, and simplified states' (N/crates/k-rust/src/backend/mod.rs:133-136; N/docs/backend-port.md:194), which is weaker than 'every partial term in the predicate has its definedness explicit'. definedness::condition_definedness is pub(crate) (N/crates/k-rust-backend/src/definedness.rs:373), so a consumer cannot apply it. K-in-K2 calls SmtSolver::is_sat on leaf constraints and treats Unsat as refuting the leaf (K/crates/kink-native/src/feasibility.rs:284-285, 327-328 -> bridge.rs:132-133) and on relation queries that include the leaf path predicate (feasibility.rs:677-699, 735-736). A leaf wrongly discarded on one side of a mutant pair could make leaf sets differ, which in kink is a spurious kill. Verification found the premise probably holds: rule conditions are hoisted with their definedness (N/crates/k-rust-backend/src/condition.rs:171-182, 255-261), the applicability A is built from them (rewrite/apply.rs:1245-1249) and a remainder is not A (rewrite/roles.rs:66-72), so each partial term's ceil sits inside the negation next to its atom. k-rust's own requires refutation and claim-leaf pruning (compatibility.md:1008) rely on the same premise. Not a regression: O already translated partial functions as total (O/crates/k-rust-backend/src/smt.rs:602-612)."
reproducer = "Static. The shape to rule out is a leaf predicate with a partial term under a negation and without its definedness, e.g. not(X /Int 0 ==Int 5) and not(X /Int 0 =/=Int 5): K-satisfiable where X /Int 0 is undefined, SMT-Unsat. No k-rust execution was shown to print such a leaf. A regression test should execute a rule whose requires uses a partial function (e.g. requires X /Int Y >Int 0) on a symbolic state with strategy All and PathSet, take every leaf including the remainder, and check that is_sat on each leaf's constraints is not Unsat when the leaf has a K instance (e.g. Y = 0)."
local_workaround = "none yet. Options for K-in-K2 (its decision D3): name the premise in kink's trust base and pin it with a regression test, or treat Unsat as Unknown when a partial function occurs under a negation (loses Z3 precision)."
requested_action = "Document as a facade contract, with a regression test that includes the remainder of a requires over a partial term, that the constraints of every execution leaf (and the residual constraints of unify_term_pairs) satisfy the definedness premise of smt.rs:740-744, so that is_sat = Unsat on them refutes the leaf. Reconcile docs/compatibility.md:626 with smt.rs:180-183. Only if that cannot be promised: export a public 'refute these constraints' query that applies condition_definedness."
sources = ["k-in-k2 draft/tasks/k-rust-927b9ce6-intake/findings/verify.md section 2", "findings/api-semantics.md (K9, issue unsat-definedness-contract)"]


