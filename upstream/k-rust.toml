[[request]]
id = "unifier-injective-contract"
title = "State when unify_term_pairs decomposes on the injective attribute"
kind = "api"
status = "fixed"
fixed_in = "b7eff00e (KK-67)"
status_basis = "test run at b7eff00e on 2026-09-28 (cargo test --workspace and the kink-native z3 gate; non_free_injective_symbols_leave_relations_undecided, non_free_injective_symbol_does_not_prove_a_clash)"
blocking = false
needed_by = ["narrowing decomposes_freely without losing soundness"]
summary = "unify_term_pairs documents its three grounds for decomposing equal heads: constructor, instance-normal anywhere applications (injective ignored there), and a declared injective on any other symbol, taken on the declaration alone. kompile still emits injective on some overload-greater productions and passes a user-written attribute through."
reproducer = "Hand-written KORE: relate(tag(s(s(X))), tag(z)) for an anywhere injective tag with a collapsing equation is Unequal; relate(perm(X), perm(Y)) for a non-anywhere injective function stays Indeterminate."
local_workaround = "narrowed (KK-68): see anywhere-injective-attribute."
requested_action = "Satisfied."
sources = ["k-rust draft/k-in-k/workers/KK-67-report.md, KK-68-report.md"]

[[request]]
id = "generated-lambda-totality"
title = "A generated #let/#fun lambda is total only when its body is defined"
kind = "correctness"
status = "fixed"
fixed_in = "b7eff00e (KK-71)"
status_basis = "test run at b7eff00e on 2026-09-28 (cargo test --workspace and the kink-native z3 gate; let_bound_partial_condition_keeps_its_definedness, and against 78cd00ca the same rule under Z3 gave one unconditioned stuck halt leaf; kink-campaign probe3_symbolic_test_does_not_kill_an_equivalent_mutant, probe2_symbolic_test_does_not_spare_a_killed_mutant, unrelated_and_claim_asserting_mutants; kink-patch claims)"
blocking = false
needed_by = ["symbolic verdicts over rules that use #let or #fun", "claim withdrawal in symbolic mutation campaigns"]
summary = "Before KK-71 k-rust declared every variable-pattern lambda total whatever its body, so a condition over #let Y = A #in 10 /Int Y lost A =/=Int 0. At b7eff00e a lambda is total only when its body is built from constructors, total functions and total lambdas. The lambda is generated after a patch from the mutant's own body, so it needs no withdrawal; its body's user claims are withdrawn by K-in-K2's claim support (KK-70), which replaced the interim refusal of symbolic campaign states (KK-69)."
reproducer = "sympartial.k halflet(X) after a write: Z3 splits into halt under X =/=Int 0 and a stuck remainder; no-Z3 one Indeterminate leaf; both unknown."
local_workaround = "retired: KK-69's SymbolicTestState refusal is replaced by KK-70's withdrawal; no #let/#fun rule was ever added to K-in-K2."
requested_action = "Satisfied."
sources = ["k-rust draft/k-in-k/workers/KK-69-report.md, KK-70-report.md, KK-71-report.md"]

[[request]]
id = "portable-rule-grammar"
title = "The no-Z3 rule grammar parses #let, #fun and anonymous whole-cell contents"
kind = "bug"
status = "fixed"
fixed_in = "b7eff00e (KK-72, KK-76)"
status_basis = "test run at b7eff00e on 2026-09-28 (cargo test --workspace; let_bound_partial_condition_keeps_its_definedness loads a #let rule in the portable build, which failed to parse at 78cd00ca); <cell> _ </cell> by static screen of k-rust rule_cell_content at b7eff00e, K-in-K2 has no such rule"
blocking = false
needed_by = ["loading real semantics in K-in-K2's qualified no-Z3 profile"]
summary = "At 74f1356e the portable rule grammar lacked #let, #fun, :=K and :/=K, and pinned an anonymous whole-cell variable to its scaffolding sort #Rule<S>, so <k> _ </k> did not load. At b7eff00e both load and compile to the same KORE as the Z3 build. The loaded (pre-compilation) rule may read #fun(P => B)(A) as #fun3 where the Z3 build keeps #fun2 over a rewrite; the compiled lambda is the same."
reproducer = "sympartial.k halflet rule under cargo test --workspace (no Z3)."
local_workaround = "none; K-in-K2 had no rule avoiding #let, #fun or anonymous whole-cell contents. A consumer of loaded labels must treat #fun2 over a rewrite and #fun3 as one construct; K-in-K2 matches no such label."
requested_action = "Satisfied."
sources = ["k-rust draft/k-in-k/workers/KK-72-report.md, KK-76-report.md"]

[[request]]
id = "trivial-leaf-rule-identity"
title = "A Trivial execution leaf names the rule of its undefined step"
kind = "missing-feature"
status = "fixed"
fixed_in = "b7eff00e (KK-75)"
status_basis = "test run at b7eff00e on 2026-09-28 (cargo test --workspace and the kink-native z3 gate; undefined_step_names_its_rule_in_the_report, observation_erasure_preserves_live_leaves)"
blocking = false
needed_by = ["reporting an undefined step with its rule (KK-66 open point)"]
summary = "ExecutionLeaf.rule_id and rule_label are the compiled rule-catalog identity and qualified label of the rule whose application is a Trivial leaf's undefined step; absent otherwise. The KORE RPC wire is unchanged."
reproducer = "symbottom.k stop(1) and apart(X, Y): the leaves name SYMBOTTOM.stop and SYMBOTTOM.apart with their catalog ids."
local_workaround = "retired: kink-native keeps the rule as AdaptedLeaf::undefined_rule (also in BaselineLeaf, so erasure compares it) and the step-3 report (schema version 6) has the path field undefined_rule. It is not part of the exit-stop class, because a mutant's compiled ids differ from the baseline's."
requested_action = "Satisfied."
sources = ["k-rust draft/k-in-k/workers/KK-66-report.md open points, KK-75-report.md"]

