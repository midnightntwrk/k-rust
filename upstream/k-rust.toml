[[request]]
id = "hook-result-sort-check"
title = "A hook's value replaces its application without a sort check"
kind = "correctness"
status = "open"
status_basis = "test run by K-in-K2 TB-02 review 5 at k-in-k2 1d0318f against 927b9ce6 on 2026-10-07 (portable and Z3, Full and FirstKill) and by the VI-T13 soundness-lens probes at 1d0318f (V3', V4); static screen of main 957d53aa on 2026-10-07 (no result-sort check at simplify_root)"
blocking = false
needed_by = ["no K-unreachable rule fires because a hook value sits at a sort it does not have (measured spurious kills at 927b9ce6)", "K-in-K2 retirement of the soundness role of census rule H (VI-T13), which refuses the whole specification at kink-flow check"]
summary = "simplify_root places a hook's BuiltinResult::Value with no sort check (kb/simplify.rs:3372-3402, kb/simplify/result.rs:119-155), and the parent is rebuilt around it unchecked (kb/simplify.rs:3233-3297). evaluate_hook_with_context receives the application's declared sort (kb/builtin.rs:225) but never compares the value with it. FIX hooks write the builtin sort they pick by name, FIXCOLL hooks write K's standard List/Map/Set definition (kb/builtin/list.rs:210-234), and PASS hooks return an argument or stored element unchanged (KEQUAL.ite kb/builtin.rs:873-891, MAP.lookup/lookupOrDefault kb/builtin/map.rs:351-389, LIST.get kb/builtin/list.rs:139-190). Under a non-natural declaration the value therefore sits in a position whose declared sort it does not have; the matcher's runtime sort check (kb/matching/mod.rs:1785-1802) rejects every pattern of the declared sort, so a lower-priority or owise rule that K never reaches fires. K-in-K2 measured equivalent mutants Killed from canonical Int input three ways: b2t(Bool, Bytes, Bytes) : Tok [hook(KEQUAL.ite)] feeding token2string; i2b(Bool, Int, Int) : Bool [hook(KEQUAL.ite)]; addB(Int, Int) : Bool [hook(INT.add)]."
reproducer = "syntax Bool ::= addB(Int, Int) [function, total, hook(INT.add)]; syntax Prog ::= start(Int) | chk(KItem) | done(Int); rule start(I) => chk(addB(I, I)); rule [hit]: chk(B:Bool) => done(1); rule [range]: chk(X:KItem) => done(7) requires X ==K X [priority(60)]; rule chk(_) => done(0) [owise]. krun start(5): k-rust takes [range] (the value is \\dv{SortInt}(\"10\") in a Bool position), which K never reaches because [hit] applies to every Bool; the Haskell backend refuses the declaration. Same shape with syntax Bool ::= i2b(Bool, Int, Int) [function, total, hook(KEQUAL.ite)] and start(I) => chk(i2b(true, I, I)). Fixtures: k-in-k2 testdata/k/t13owk.k and t13ite.k once TB-03 lands (decisions/VI-T13-evidence/lens-soundness.md section 1)."
local_workaround = "K-in-K2 TB-03 clauses G-H and G-C refuse, before execution, any side whose BackendDefinition declares a hooked symbol whose signature differs from kink's natural-signature table for 927b9ce6, an unclassified hook, or a collection role symbol of the wrong sort (a refused baseline or Unknown, never a kill)."
requested_action = "K2: in simplify_root after BuiltinResult::Value (kb/simplify.rs:3386-3391), and at every other site that installs a hook value (Simplification::hook, kb/simplify/result.rs:119-155), compare value.sort() with the application's declared sort: equal, keep; a strict subsort, wrap with inject_to_sort; otherwise return Unsupported with a new reason (for example ResultSortMismatch { hook, declared, actual }), so the application stays unevaluated and surfaces as UnsupportedHook. This is a backstop for hook results only: collection role construction in Term::application does not pass through it (see collection-role-symbol-sorts), and it does not replace load-time validation (hook-signature-validation). Backend only: KRUST-PROVENANCE text, PROVENANCE_VERSION and compiled definition.kore stay unchanged. Acceptance: (1) the three reproducers give UnsupportedHook (or are refused at load), never the [range] result; (2) a unit test per result kind (FIX, FIXCOLL, PASS) with a mismatched declared sort; (3) the conformance corpus and every kompile-generated collection helper execute unchanged (the check never fires on a natural signature)."
sources = ["k-in-k2 draft/tasks/variable-identity/decisions/VI-T13-options.md", "decisions/VI-T13-evidence/{hook-inventory,lens-soundness,lens-cost}.md", "handoffs/TB-02-review-5.json", "corpus-scale/handoffs/CS-01-review-1.json, CS-01-review-2.json and CS-01-fix-1.toml proposed_requests[0], limits[0] and the :70 proposal (merged here; see collection-role-symbol-sorts.update_2026_10_09)", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-1.md section 6"]
status_at_main = "fixed"
status_at_main_basis = "static screen of source at 9ea39ec7 on 2026-10-15: with a definition, the evaluation entry turns a hook value whose sort differs from the application's, or whose domain values have another kind, into NotApplicable and leaves the application unevaluated (k-rust-backend builtin.rs:370-381, eabb06afe); every simplifier route passes a definition; LIST, SET and MAP hooks build in the declared result sort's collection, and a declaration under which a collection hook gives no value of its result sort is refused at compile and load (docs/compatibility.md:1291-1306; fd59f660f, ca659a98f). The requested typed Unsupported reason was not added; that visibility residual is handoff KINK-12. Not run: whether an unevaluated addB(5, 5) matches chk(B:Bool); kink re-runs t13owk.k, t13ite.k and the CS-01 B1 fixture at the re-pin"

[[request]]
id = "hook-signature-validation"
title = "Hooked symbols are not checked against their hook's signature at load"
kind = "correctness"
status = "open"
status_basis = "static audit of all 157 implemented hooks at 927b9ce6 on 2026-10-07 (decisions/VI-T13-evidence/hook-inventory.md section 3), plus the measured kills of hook-result-sort-check; static screen of main 957d53aa on 2026-10-07 (no signature validation)"
