# K-in-K2 requests to k-rust: the single ledger.
# Vocabulary and field contract are in README.md beside this file.
# Supersedes investigations/k-rust-target/{k-rust-agent-requests,upstream-issues,capability-matrix}.toml
# and status-report.html; those files remain in git history.

schema = 1
updated = "2026-09-27"

[reference_pin]
# Status is judged against this commit of the on-disk checkout that the workspace builds against: kink-pattern, kink-patch, kink-native and kink-campaign all depend on k-rust.
k_rust_commit = "347f693e21ae220f1844005499da262f15ca3988"
k_rust_version = "0.4.0"
# kink-native also depends on k-rust-backend from the same checkout, for execution cancellation and diagnostics.
k_rust_backend_version = "0.3.0"
k_release = "7.1.337"
# The workspace builds against a read-only `git archive` export of this commit instead of the live checkout.
checkout = "../k-rust-347f693e"
live_checkout = "../inspirations/midnightntwrk/k-rust"
source = "Cargo.toml [workspace.dependencies] path dependency"

[retired_pins]
"985e0086f06e1ec05c2c533f26fb6f949c6b84fa" = "Former K-in-K2 read-only archive pin; retired by KINK-1 on 2026-09-27."
"5fc7a083c3bdfe07b485df271e0299924823d327" = "more-semantics head audited on 2026-08-29; the branch was never merged and its fixes were reimplemented on main."
"c41caa8bede96e279e0b058577dce504e4144f65" = "Former kink-native pin through the shared k-rust-krs-main worktree; not on main after the 2026-09-08 history rewrite (patch-equivalent: dd6215d8)."

