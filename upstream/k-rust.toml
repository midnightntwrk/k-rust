summary = "No hooked declaration's signature is checked at load, by kompile or by the backend: kb/verify.rs:621-711 checks only the hooked-symbol keyword, constructor result sorts, the binder's KVar argument and element-symbol arity; kc/kompile/compile.rs:1383-1395 compiles nullary KRYPTO hooks at sort Value. STRING.token2string reads any DomainValue whatever its sort (kb/builtin/string.rs:268-277) and STRING.string2token writes into any result sort (:279-291). The Haskell backend verifies each hook's signature (hb/Builtin.hs:66-83; KEqual.hs:102-123), and docs/compatibility.md:17 leaves the behaviour of such definitions undefined, so refusing them costs no valid definition. In 596 compiled conformance definitions the prelude's 279 hooks carry one signature each (two legitimate pairs: IO.traceTerm, string2token into Id and KVar); the only non-natural user declarations are KREFLECTION.printKORE retyped as crash(Int) : Pgm (kprove-error-status) and KWasm's typed lists (ListInt:make, ListInt:get : WrappedInt and the ListRef twins). FIXCOLL hooks such as LIST.make build Term::list(k_item_definition(), ..) whatever the declared result (kb/builtin/list.rs:210-234), so a typed list built by make is a SortList value in a ListInt position."
reproducer = "The reproducers of hook-result-sort-check; and syntax Tok [token]; syntax String ::= tok2s(Tok) [function, total, hook(STRING.token2string)]; syntax Tok ::= b2t(Bool, Bytes, Bytes) [function, total, hook(KEQUAL.ite)]; rule start(I) => stringRange(tok2s(b2t(true, Int2Bytes(1, I, BE), Int2Bytes(1, I, BE)))); rule stringRange(S) => done(7) requires lengthString(S) ==Int 1 andBool \"\\u007f\" <String S andBool S <String \"\\u0080\"; rule stringRange(_) => done(0) [owise]. krun start(128): k-rust gives done(7); no K String satisfies the guard."
local_workaround = "K-in-K2 TB-03 clause G-H (natural-signature table: FIX exact builtin names, ite (Bool, S, S) -> S, collection positions from collection metadata, FIXCOLL only on standard collections, token hooks only over unhooked non-builtin token sorts, unimplemented hooks admitted only when evaluate_hook answers NotImplemented)."
requested_action = "Narrowed on 2026-10-15 to handoff KINK-12 (P3); the original K1/K3/K4 text is in this file's history at ea62fa0. Closed or moot at main: the soundness half (hook-result-sort-check), K4 and K1 for collection hooks (ca659a98f, 73b4fadcf, fd59f660f); withdrawn: K3 (token2string over builtin value sorts; payloads are canonical at main) and the nullary plugin hooks of kompile/compile.rs (a unit-test fixture). Remaining: report, as a structured diagnostic from kcompile and at backend load, each hooked declaration whose evaluation can never give a value of its declared result sort (the evaluation entry's own rule), naming symbol, hook, declared sort, value sort and location, without changing KORE, KRUST-PROVENANCE or evaluation. Acceptance: addB, i2b and b2t each give one diagnostic; the prelude, generated collection helpers, KEVM's krypto.md and the conformance corpus give none and compile byte-identically; a test pins that the reported declarations are exactly those the evaluation entry turns into NotApplicable. Open decision D12a: warning (recommended) or refusal. Proposal D12b: a public per-symbol hook capability query."
original_requested_action = "K1: in verify_declaration (kb/verify.rs:665-666), or after collection metadata is attached (kb/definition.rs:3108-3114), validate each hooked symbol of an implemented hook against a table hook -> (result check, [argument checks]): exact builtin sort, keyed on the sort's hook with a name check where readers key on names; KEQUAL.ite branches = result; collection element, key and value positions = metadata, PASS results = the collection sort, every collection-sort argument = that sort, FIXCOLL hooks only on the standard SortList/SortMap/SortSet; token2string's argument and string2token's result an unhooked token sort. Refuse with DefinitionError::Verification naming the symbol and the expected signature. Unimplemented hook names (for example KEVM's blake2, bls12, sha3, sha512, ed25519, p256 and KZG KRYPTO hooks) must keep loading. If kompile adopts the table, it must refuse before constant folding and never coerce declarations. K3: token_to_string returns NotApplicable on a builtin value sort. K4: FIXCOLL hooks build at the declared collection's definition, or refuse when the declared result is non-standard. Acceptance: (1) the reproducers and K-in-K2's tb02bytestoken.k, tb02stringtoken.k and t13*.k fixtures are refused at load; (2) every domains.md, kast.md, substitution.md, timer.md, unification.k, ffi.md, rat.md and json.md declaration, every kompile-generated collection helper, KEVM's vendored krypto.md and the conformance corpus load unchanged; (3) compile.rs:1383-1395's nullary plugin hooks move to natural signatures or are refused deliberately; (4) with K4, KWasm's ListInt:make yields a ListInt-definition list; (5) KRUST-PROVENANCE text and definition.kore are byte-identical before and after for natural-signature definitions. Supersedes the unfiled token-hook-sort-check of K-in-K2 handoffs/TB-02-fix-4.toml."
sources = ["k-in-k2 draft/tasks/variable-identity/decisions/VI-T13-options.md", "decisions/VI-T13-evidence/{options,hook-inventory,census,lens-usability}.md", "tickets/VI-T13-hook-result-sorts.md", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-1.md section 7"]
