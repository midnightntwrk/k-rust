# K-in-K2 requests to k-rust: the single ledger.
# Vocabulary and field contract are in README.md beside this file.
# Supersedes investigations/k-rust-target/{k-rust-agent-requests,upstream-issues,capability-matrix}.toml
# and status-report.html; those files remain in git history.
#
# Reconciled on 2026-10-15 with the k-rust handoff draft/tasks/k-rust-handoff-2026-10-15/HANDOFF.md, judged at k-rust main
# 9ea39ec716c713981bb11efee03ac05a59fb2ba6. HANDOFF.md is the copy given to a k-rust agent; draft/tasks/k-rust-handoff-2026-10-15/DISPOSITIONS.md records why each
# id was kept, merged, deferred, satisfied or withdrawn. Deferred items that are not requests are listed in
# draft/tasks/upstream-pending.md.
#
# Re-pinned on 2026-10-17 to k-rust main 501f18b9 (re-pin package draft/tasks/repin-501f18b9/, packet LEDGER).
# Every open and partial row was re-judged at the new pin; each row with a handoff field folds k-rust's answer
# from k-rust draft/k-in-k/answers-2026-10.toml (judged against k-rust's code at 501f18b9 and kink's R0 evidence,
# not taken as given) and records it in update_2026_10_17. A re-judged row's status and status_basis are replaced;
# their 927b9ce6 values are in this file at K-in-K2 1ee9955. KINK-15 and KINK-16 had no row before 2026-10-17;
# they are added below. Requests KINK-17..KINK-20 of draft/tasks/k-rust-handoff-2026-10-15/ADDENDUM-3.md are not
# filed here until Sebastien has given ADDENDUM-3 to k-rust.
# status_at_main rows record the judgement at main 9ea39ec7 (2026-10-15); the pin is now later than that main.
#
# Fields added on 2026-10-15 (now in README.md's field table):
#   handoff               the request's id in HANDOFF.md (KINK-NN); present only on requests HANDOFF.md asks for.
#   status_at_main        open, partial, fixed or unknown, judged at the k-rust main named in status_at_main_basis.
#                         `status` stays judged at [reference_pin]: a request fixed at main but not at the pin stays
#                         open here until the pin moves, and kink confirms it then with the request's reproducer and
#                         acceptance. For rows satisfied at main and not narrowed, requested_action is kept as asked
#                         for that reason. Rows narrowed or merged on 2026-10-15 replace requested_action with the
#                         narrowed ask; their pin-judged status keeps its basis in original_requested_action.
#   original_requested_action  the requested_action as asked before 2026-10-15 (verbatim from this file at
#                         K-in-K2 ea62fa0), present only on rows whose requested_action was rewritten on 2026-10-15;
#                         `status` at the pin is judged against this text.
#   status_at_main_basis  same forms as status_basis.
# Fields already in use, documented here: update_YYYY_MM_DD (a later measurement appended without rewriting the
# original fields) and where_requested_shape_differs (how an accepted fix differs from the request).

