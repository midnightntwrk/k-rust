[[request]]
id = "undefined-step-coverage"
title = "Execution covers the instances a rule applies to but leaves without a defined result"
kind = "correctness"
status = "fixed"
fixed_in = "9b91332e (KK-63, KK-64; KK-73 for strategy any)"
status_basis = "test run at c2638626 on 2026-09-28 (cargo test --workspace and the kink-native z3 gate; ground_undefined_step_prefix_witnesses_a_match, apart_undefined_step_is_complete_evidence, root_undefined_step_completes_an_absence, guarded_division_covers_disjoint_and_shared_addresses, undefined_sub_cases_of_one_step_are_distinct_paths, a_classified_undefined_step_is_rejected, an_undefined_step_path_is_complete_evidence; kink-campaign dropping_a_division_guard_is_killed_by_its_undefined_step, an_undefined_step_is_its_own_exit_stop_class)"
blocking = false
