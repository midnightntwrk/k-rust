summary = "k-rust/src/kompile/term_to_kore.rs:713 decodes STRING.String tokens with unquote_bytes (k-rust/src/kast/string.rs:110, :113-119), so \"\\xe9\" is the single byte E9 while \"é\", \"\\u00e9\" and chrString(233) are C3 A9. domains.md:1698-1699 and k-rust's own KAST reader unquote (kast/string.rs:71) read \\xHH as U+00HH. Consequences: lengthString(\"\\xc3\\xa9\") is 1 (K: 2), ordChar(\"\\xe9\") is stuck (K: 233), and f(\"\\xe9\") never matches f(chrString(233))."
