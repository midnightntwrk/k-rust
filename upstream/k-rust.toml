[[request]]
id = "unsat-definedness-contract"
title = "State as a facade contract that execution-leaf constraints meet the definedness premise for a conclusive SMT Unsat"
kind = "correctness"
status = "fixed"
status_basis = "static screen of source at 501f18b9 on 2026-10-17: docs/compatibility.md '## Solver decisions over partial operations' (:2255). Rule and equation conditions, steps, remainders, pattern facts and every admitted request predicate are definedness-explicit. The form is closed under conjunction, which covers the unifier's equalities between subterms of terms whose definedness is a conjunct. The section also gives 'Two gaps remain' and the leaf contract. The Unsat sentence is reconciled at :1587. The test crates/k-rust/tests/symbolic_definedness.rs every_leaf_constraint_is_satisfiable_when_the_leaf_has_an_instance (pos, ens and rhs, the remainder included) is present; it was not run by kink. On the kink side at 501f18b9, mutant leaves and relation queries are admitted on the mutant's own definition (R0b, A-12; kink-campaign run_tests_decides_mutant_leaves_on_the_mutant_definition, under Z3), and a definition with an \\equals condition is excluded (R0c-fix-3, Exclusion::EqualsCondition). Both are covered by the K-in-K2 1ee9955 gate of record (draft/tasks/repin-501f18b9/handoffs/R0c-fix-4.toml: workspace 777/0/9; Z3 kink-native 229/0/1, kink-campaign 220/0/1, kink-corpus 56/0/8)"
fixed_in = "921abb2dd for the leaf contract and request admission (KINK-10/1 57c235b17, 10/2 de0306a7b, 10/3 7efa619f9); baaae40d3 for all of KINK-10"
blocking = false
needed_by = ["K-in-K2 symbolic survivor analysis and kink-campaign pattern-slot kills (secondary features): both treat a solver Unsat on leaf constraints as refutation", "K-in-K2 trust-base audit of T-UNSAT at each re-pin"]
summary = "k-rust's docs disagree on when an SMT Unsat is conclusive. N/crates/k-rust-backend/src/smt.rs:180-183 (ceca4fef): a partial function translated as a total SMT operation 'is not an over-approximation ... Unsat stays conclusive for it only under the definedness premise that SmtSolver::check_predicates documents'; smt.rs:740-744: that premise is that the definedness of the predicate's partial terms is explicit in it. N/docs/compatibility.md:626 (unchanged from O/docs/compatibility.md:422) still says 'A solver Unsat is sound under every approximation of the translation'. The facade promises only that a leaf predicate implies the definedness of every partial term 'relied on by its conditions, right-hand sides, and simplified states' (N/crates/k-rust/src/backend/mod.rs:133-136; N/docs/backend-port.md:194), which is weaker than 'every partial term in the predicate has its definedness explicit'. definedness::condition_definedness is pub(crate) (N/crates/k-rust-backend/src/definedness.rs:373), so a consumer cannot apply it. K-in-K2 calls SmtSolver::is_sat on leaf constraints and treats Unsat as refuting the leaf (K/crates/kink-native/src/feasibility.rs:284-285, 327-328 -> bridge.rs:132-133) and on relation queries that include the leaf path predicate (feasibility.rs:677-699, 735-736). A leaf wrongly discarded on one side of a mutant pair could make leaf sets differ, which in kink is a spurious kill. Verification found the premise probably holds: rule conditions are hoisted with their definedness (N/crates/k-rust-backend/src/condition.rs:171-182, 255-261), the applicability A is built from them (rewrite/apply.rs:1245-1249) and a remainder is not A (rewrite/roles.rs:66-72), so each partial term's ceil sits inside the negation next to its atom. k-rust's own requires refutation and claim-leaf pruning (compatibility.md:1008) rely on the same premise. Not a regression: O already translated partial functions as total (O/crates/k-rust-backend/src/smt.rs:602-612)."
reproducer = "Static. The shape to rule out is a leaf predicate with a partial term under a negation and without its definedness, e.g. not(X /Int 0 ==Int 5) and not(X /Int 0 =/=Int 5): K-satisfiable where X /Int 0 is undefined, SMT-Unsat. No k-rust execution was shown to print such a leaf. A regression test should execute a rule whose requires uses a partial function (e.g. requires X /Int Y >Int 0) on a symbolic state with strategy All and PathSet, take every leaf including the remainder, and check that is_sat on each leaf's constraints is not Unsat when the leaf has a K instance (e.g. Y = 0)."
local_workaround = "kink names the premise as trust-base item T-UNSAT (kink-native feasibility.rs, bridge.rs; decision D-B), pins it with regression tests (kink-native tests/trust_base.rs), and refuses test states whose caller-written initial predicate puts a partial term under a negation (TV-01 R2-F1: the one violation found, in a caller-written predicate, not a k-rust-produced leaf). The concrete corpus loop does not depend on it: kink-flow runs the portable build and its ground leaves carry no constraints."
requested_action = "Handoff KINK-10 (P2, secondary). Document on execute and search results that every partial-function application in a returned leaf's constraints has its definedness among or implied by them, so that Unsat refutes the leaf, or state where this does not hold; reconcile docs/compatibility.md:1522 with k-rust-backend smt.rs:200-204 (lines at main); state the caller's obligation for caller-written initial constraints (open decision D1); only if the first item cannot be stated, export a public refute query that applies condition_definedness. Acceptance: a Z3 regression test on pos(X, Y) => yes(X /Int Y) requires X /Int Y >Int 0 including the remainder; the same for ensures and right-hand sides; the two documents agree."
original_requested_action = "Document as a facade contract, with a regression test that includes the remainder of a requires over a partial term, that the constraints of every execution leaf (and the residual constraints of unify_term_pairs) satisfy the definedness premise of smt.rs:740-744, so that is_sat = Unsat on them refutes the leaf. Reconcile docs/compatibility.md:626 with smt.rs:180-183. Only if that cannot be promised: export a public 'refute these constraints' query that applies condition_definedness."
sources = ["k-in-k2 draft/tasks/k-rust-927b9ce6-intake/findings/verify.md section 2", "findings/api-semantics.md (K9, issue unsat-definedness-contract)", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-2.md section 8", "k-rust draft/k-in-k/answers-2026-10.toml KINK-10"]
handoff = "KINK-10"
status_at_main = "open"
status_at_main_basis = "static screen of source at 9ea39ec7 on 2026-10-15: docs/compatibility.md:1522 unchanged in substance; premise text at k-rust-backend smt.rs:200-204, :898-903; definedness::condition_definedness still pub(crate) (definedness.rs:988); initial-term definedness decided before the first step since e4766a728 and ffd80eb64 (rewrite/mod.rs:822-848), which does not cover caller-written constraints"
where_requested_shape_differs = "Item 1 is stated as the leaf contract (docs/backend-port.md '## Final search depth cuts' and the ExecutionLeaf rustdoc). It covers definitions outside the two documented gaps and excludes proof leaves. The two gaps are an \\equals of two possibly undefined terms in a rule or equation condition, and, in axioms, an \\equals that reads a term as a predicate or a term-level \\and. Item 3, the caller obligation of open decision D1, is replaced: k-rust states the definedness of a request's own constraints at admission, and refuses three shapes (DefinitionError::UnstatedDefinedness). Item 4, the public refute query, is declined: Backend::implies(state, \\bottom) decides a state a client writes, and condition_definedness stays pub(crate)."
update_2026_10_17 = "Folded from k-rust draft/k-in-k/answers-2026-10.toml KINK-10 ('done, reframed'). Judged fixed at 501f18b9 against original_requested_action: the contract is documented with a regression test that includes the remainder, and the two documents agree. kink's own premise T-UNSAT and its trust_base.rs tests are unchanged in R0. Replacing T-UNSAT with a citation of the leaf contract, scoped to its exclusions, is kink-side work (answers KINK-10 kink_advice 1; findings A-09). Delivered beyond the request: 10/3, under which an undefined result is no successor and gives a Trivial leaf over the pre-step configuration; kink guards it under ANALYSIS decision 2. Still open at k-rust: KINK-10/deferred-1 ({A #Equals B} conditions, which kink's mutation generator could produce; kink excludes every such definition) and deferred-2."


[[request]]
id = "anywhere-value-production-precision"
title = "A self-rewriting anywhere value production in the initial state gives an empty depth-0 remainder (Z3) or an Indeterminate first step (no Z3)"
kind = "precision"
status = "fixed"
status_basis = "test run at 501f18b9 on 2026-10-17 in the K-in-K2 1ee9955 gate of record (draft/tasks/repin-501f18b9/handoffs/R0c-fix-4.toml: workspace 777/0/9; Z3 kink-native 229/0/1, kink-campaign 220/0/1, kink-corpus 56/0/8), in both profiles, re-pinned in R0a (C-15). kink-native symbolic.rs non_free_injective_symbol_does_not_prove_a_clash: the ground program ends in one Stuck leaf at depth 2 with no Indeterminate leaf, the write and load payloads are both wrap(z), and the pattern is a Match. Under Z3, the symbolic program gives one Stuck leaf under \\ceil(wrap(s(X))) carrying UndefinedInitialInstances, and no depth-0 leaf. kink-campaign coupled.rs audit_ei_at11_constructor_lemma_is_refused gives [[A,U,U]]"
fixed_in = "8113ed089, e4766a728, ffd80eb64 (first main commit f376bd52b, 2026-10-13; after 927b9ce6)"
blocking = false
needed_by = ["K-in-K2 symbolic survivor analysis precision (testdata symwrap.k; audit AT11)", "concrete corpus runs of specifications that rewrite value productions with anywhere rules (none among kink's current flow targets; inferred, not measured)"]
summary = "Since 4d80cea6 (feat(totality): require equation evidence and preserve value normal forms; in base 4cea2f4c, not in O) kompile withholds functional from a production that an anywhere equation headed by itself rewrites: symwrap.k's Lblwrap compiles as [anywhere{}(), function{}(), value-production{}()] (was functional{}() at O). Executing seq(write(wrap(s(X)),V), seq(load(wrap(z),W), halt)) with strategy All, PathSet, Z3 at 927b9ce6 gives two leaves: stuck@2 under \\ceil(wrap(s(X))) /\\ \\ceil(wrap(z)), and stuck@0 (trace 'remainder') whose term still contains wrap(s(X)) and wrap(z) under \\not(\\ceil(wrap(s(X))) /\\ \\ceil(wrap(z))). That remainder denotes nothing: a pattern t /\\ phi denotes \\ceil(t) /\\ t /\\ phi, feb0eeec's own premise. But feb0eeec uses the initial pattern's facts only to refute admission (N/crates/k-rust-backend/src/rewrite/execute.rs:556-565: FactsVerdict::NotRefuted(_) => {}), and \\ceil(subject) enters path knowledge only under assume_initial_defined (rewrite/apply.rs:572-588). Ground run seq(write(wrap(s(z)),V), ...): no-Z3 gives one Indeterminate leaf at depth 0 with cause Smt{error: Unavailable}; Z3 adds a Stuck remainder leaf under \\not(\\ceil(wrap(z))). dfd3365b fixed the same class of empty remainder for implication only. K-in-K2 reads these leaves as SolverUnknown (precision loss, never a spurious kill): its symwrap clash test goes Match -> Unknown and audit AT11 goes [[A,U,U]] -> [[U,U,U]]."
reproducer = "Compile k-in-k2 testdata/k/symwrap.k at 927b9ce6 (rule wrap(s(z)) => wrap(z) [anywhere]; rule seq(write(A,V),P) => P) and execute seq(write(wrap(s(X)),V), seq(load(wrap(z),W), halt)) with z3, strategy all, PathSet: observe the depth-0 remainder leaf. Without z3: execute the ground seq(write(wrap(s(z)),V), seq(load(wrap(z),W), halt)) and observe Indeterminate@0, smt unavailable. In k-in-k2 worktree W: cargo test -p kink-native --test symbolic -- --exact non_free_injective_symbol_does_not_prove_a_clash (Unknown, pinned Match)."
local_workaround = "K-in-K2 re-pins symwrap and AT11 as measured Unknown, citing 4d80cea6. Adding the public ceil_term(leaf term) to a leaf query would refute the symbolic depth-0 remainder, but cannot discharge \\ceil(wrap(z)) on the surviving leaf."
requested_action = "Handoff KINK-11 (P2, secondary). Verify first: if the acceptance already passes at main, k-rust reports the satisfying commit. Preferred: when assume_state_defined is false, use the initial pattern's undecided definedness facts (UndecidedFacts::of_pattern) as path knowledge for the first step, and conjoin them to the path predicate so leaves still imply them. Alternative or additional: the 'evaluated-normal-form precision extension' that 4d80cea6 defers, so a value-production application that no equation rewrites counts as defined. Acceptance: portable build, the ground seq(write(wrap(s(z)), z), seq(load(wrap(z), z), halt)) ends in one stuck leaf at depth 2 and no indeterminate leaf; Z3 build, the input with X, V and W gives no depth-0 leaf contradicting the initial term's definedness. Folds the intake's initial-definedness-as-step-knowledge and value-production-definedness."
original_requested_action = "Preferred: when assume_state_defined is false, use the initial pattern's undecided definedness facts (UndecidedFacts::of_pattern) as path knowledge for the first step, and conjoin them to the path predicate so leaves still imply them (as mod.rs:133-136 and backend-port.md:194-196 describe). This is sound by the pattern semantics and removes both the empty remainder and the no-Z3 indeterminacy. Alternative or additional: implement the 'evaluated-normal-form precision extension' that 4d80cea6 defers, so a value-production application that no equation rewrites counts as defined."
sources = ["k-in-k2 draft/tasks/k-rust-927b9ce6-intake/findings/verify.md section 3", "findings/probe.md section 4.2", "findings/soundness-regressions.md (symwrap)", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-2.md section 9", "k-rust draft/k-in-k/answers-2026-10.toml KINK-11"]
handoff = "KINK-11"
status_at_main = "unknown"
status_at_main_basis = "static screen of source at 9ea39ec7 on 2026-10-15: e4766a728 and ffd80eb64 decide the initial configuration's definedness obligations before the first step (k-rust-backend rewrite/mod.rs:822-848), which plausibly removes the Z3 empty remainder; whether the portable build still ends Indeterminate was not determined; not run"
where_requested_shape_differs = "The evaluated-normal-form alternative landed only in its evidence-gated form. An irreducible value-production application counts as defined only where the load-time critical-pair check leaves its head's value claims standing (k-rust answers KINK-11 decisions[1]). e4766a728 and ffd80eb64 restrict the first step to the initial term's defined instances."
update_2026_10_17 = "Folded from k-rust draft/k-in-k/answers-2026-10.toml KINK-11 ('already satisfied at the judged base 9ea39ec7'). kink's measurement above confirms it at the pin, superseding status_at_main's 'unknown'. The ground pins moved from Unknown to Match only as ANALYSIS decision 3 and findings C-15 allow: the exact outcome is asserted, and the relation stays Indeterminate, never Unequal. Residual (k-rust KINK-11/deferred-1): the symbolic symwrap-WL-after row stays undecided in both profiles (BackendLimit with UndefinedInitialInstances at 501f18b9; SolverUnknown at 927b9ce6), and kink keeps it pinned. The instances that UndefinedInitialInstances names belong to no leaf, and kink marks the diagnosed leaf incomplete, so they never count as a difference."


[[request]]
id = "deep-execution-overflow"
title = "Execution that deepens terms beyond the depth measured up front can overflow the native stack outside the simplifier"
kind = "bug"
status = "fixed"
status_basis = "static screen of source at 501f18b9 on 2026-10-17: docs/backend-port.md '## Simplification stack depth' (:187-210). The simplifier continues on 16 MiB segments within a 1 GiB per-thread and 4 GiB per-process budget, then stops with StopCause::StackExhausted(StackLimit). Every stack stop of an execution is counted as ExecutionResult::stack_stops. Backend terms are dropped from a work list. '## Stack bounds' (:236): the other walks over a term that execution deepened are accepted by measurement (a state wrapped 1,000,000 times runs and prints on an 8 MiB thread). Not run by kink"
fixed_in = "df39e6de1, 94895813f, 245a9a8cf, 7bdb220a4, 607978161, ab015f56c (all before 9ea39ec7); stack-stop counting 934e25d96 (KINK-06/5, merged at 07135f1b3)"
blocking = false
needed_by = ["kink-flow reliability: check, results and run execute in one process on one 256 MiB thread, so a native stack overflow aborts the whole command and the LLM loses the run in progress (never a verdict)"]
summary = "stop::check_stack is called only from N/crates/k-rust-backend/src/simplify.rs:1422 and :2829 (grep over src/). nesting::with_stack sizes the stack from a depth measured before the work starts (N/crates/k-rust-backend/src/nesting.rs:11-14, 101-138), and the facade applies it once per operation (N/crates/k-rust/src/backend/mod.rs:1336-1337). Matching, rewriting, externalization or recursive TermData drop on terms that grew during execution may therefore overflow and abort the process. For K-in-K2 this is availability only (the campaign dies; never a Killed verdict). Not a regression: O had no stack sizing at all."
reproducer = "Not run. A definition whose rule wraps the configuration in one more constructor per step (rule <k> run(T) => run(c(T)) </k>), executed in process with max_depth None on a 16 MiB thread under a wall-clock watchdog: the thread may overflow before it is cancelled."
local_workaround = "K-in-K2 can bound depth (ExecutionBudget.max_depth, K/crates/kink-native/src/execution.rs:158) and may pass leaf patterns to with_solver_over; neither covers growth inside one execute call."
requested_action = "Re-measure the depth between steps and grow the stack segment or refuse; or make matching, externalization and TermData drop iterative; so that deep growth ends as StopCause::StackExhausted instead of a process abort."
sources = ["k-in-k2 draft/tasks/k-rust-927b9ce6-intake/findings/verify.md section 5", "R/RESULT.md 'Open issues'", "k-rust draft/open-issues-2026-10/RESULT.md:586-594 (k-rust's answer, carried)", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-2.md section 1"]
status_at_main = "fixed"
status_at_main_basis = "static screen of source at 9ea39ec7 on 2026-10-15: the simplifier continues on 16 MiB segments up to 1 GiB per thread and 4 GiB per process, then stops with StopCause::StackExhausted(StackLimit) (docs/backend-port.md:181-200; k-rust-backend stop.rs:50-80); dropping backend and KAST terms is iterative (term.rs:902); the other walks are accepted by documented measurement (docs/backend-port.md:215); commits df39e6de1, 94895813f, 245a9a8cf, 7bdb220a4, 607978161, ab015f56c; not run. A stack-exhausted leaf is published as HaltReasonOutput::SimplificationError with the cause in its detail text (k-rust backend/mod.rs:1666-1683)"
