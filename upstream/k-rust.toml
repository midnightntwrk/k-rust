[[request]]
id = "float-domain-value-canonical"
title = "Float domain values are compared by spelling: a definition literal never matches the equal value a FLOAT hook returns"
kind = "correctness"
status = "open"
status_basis = "test run in K-in-K2 probe worktrees at k-in-k2 4f2b4b0 and 5b837cf against 927b9ce6 on 2026-10-07 (portable and Z3, Full and FirstKill); static screen of main 50229d6c on 2026-10-07 (term.rs:903-911 still canonicalizes only Int)"
blocking = false
needed_by = ["kink-flow admission of user specifications holding Float literals (TB-03 refuses the whole specification at kink-flow check)", "comparable Float values in final configurations (unknown today)"]
summary = "Term::domain_value (kb/term.rs:879-887 at 927b9ce6) canonicalizes only SortInt; every other domain value keeps its text, and every structural comparator compares (sort, bytes): matcher kb/matching/mod.rs:833-846, unifier kb/unification.rs:276-290, ==K kb/builtin.rs:906-911, map/set keys kb/builtin/map.rs:129-139,:361-399, kb/builtin/set.rs:138-145. FLOAT hooks return canonical text (kb/builtin/float.rs canonical/canonical_f64: 1.0 -> 1.0000000000000000e+00p53x11, 0.0 -> 0e+00p53x11, NaN -> NaNp53x11), while a definition literal arrives verbatim (k-rust/src/kompile/term_to_kore.rs:721). So floatCheck(1.0) never matches Int2Float(1,53,11), Int2Float(1,53,11) ==K 1.0 is false, a hook-inserted Map key is not found by a literal key, and two literal spellings of one value (1.0, 1.0e0) never match each other. docs/compatibility.md:291 says \\dv{S}(\"s\") denotes the element of S that s names, so all of these are one value. STRING.string2token at a Float sort (kb/builtin/string.rs:279-290) also builds unvalidated verbatim text. K-in-K2 measured 20 Float equivalent mutants Killed through Int terminals (decisions/VI-T12-evidence/probes.md rows A1, A2, F1-F2, F4-F13, F15; census V2, V4, V5a, V5b; lens-soundness T1)."
reproducer = "Definition: rule start(I) => floatCheck(Int2Float(I, 53, 11)); rule floatCheck(1.0) => done(7); rule floatCheck(_) => done(0) [owise]. krun start(1): k-rust gives done(0); K reads 1.0 as the binary64 value int2float returns, so done(7) is expected (not run against the reference backend). Hook-free variant: rule s(_) => c(1.0); rule c(1.0e0) => done(7); rule c(_) => done(0) [owise]; s(1) gives done(0). Token variant: syntax Float ::= parseF(String) [function, hook(STRING.string2token)]; parseF(\"1.0\") ==K Int2Float(1,53,11) is false. Fixtures: k-in-k2 draft/tasks/variable-identity/decisions/VI-T12-evidence/probes/{tb02float.k,t12probe.k}."
local_workaround = "K-in-K2 TB-03 refuses, before execution, any side whose compiled KORE holds a FLOAT.Float or MINT.MInt domain value or declares a token-creating hook at those sorts, and refuses Float/MInt token construction in test states (Unknown or a refused baseline, never a kill). This refuses KWasm."
requested_action = "In backend internalization, Term::domain_value, canonicalize every domain value of a FLOAT.Float-hooked sort to the canonical_f32/canonical_f64 spelling of its value (a chokepoint shared by definition loading, request internalization, hook results, string2token and substitution). Text that fails is_float_syntax (86edb97c) or uses a format other than 24x8/53x11 is refused at load by validate_domain_value (kb/definition.rs:2316-2346) and at request internalization, not kept verbatim. Key on the sort's hook, not on the name SortFloat; if Term::domain_value cannot see the hook, refuse at load any FLOAT.Float-hooked sort not named SortFloat so that name and hook coincide. Placement: do NOT rewrite KAST tokens in the frontend loader or kompile; KRUST-PROVENANCE text, PROVENANCE_VERSION and compiled definition.kore stay unchanged. Add a normalization note for printed Float output to docs/compatibility.md. Acceptance: (1) each of 1.0, 1.00, 1.0d, 1.0D, 1e0, +1.0, 1., 10.0e-1, 1.0p53x11, 1.0P53X11 internalizes byte-equal to FLOAT.int2float(1,53,11); 1.0f to int2float(1,24,8); 0.0, -0.0, NaN, Infinity, -Infinity and 0.1 byte-equal to their hook results; (2) the three reproducers give done(7) / true; M[1.0] orDefault finds a key inserted by Int2Float; (3) 0.0 vs -0.0 and p24x8 vs p53x11 stay distinct; (4) a contract test pins that the KRUST-PROVENANCE text and compiled definition.kore of a Float-literal definition are byte-identical before and after the change."
sources = ["k-in-k2 draft/tasks/variable-identity/decisions/VI-T12-options.md", "decisions/VI-T12-evidence/{krust-audit,probes,census,lens-soundness,lens-cost}.md", "tickets/VI-T12-float-token-canonicalization.md", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-1.md section 1"]
