[[request]]
id = "rewrite-rule-classification"
title = "Public rule classification and diagnostic evaluation events"
kind = "missing-feature"
status = "fixed"
fixed_in = "present at 347f693e"
status_basis = "test run at 347f693e on 2026-09-27 (cargo test --workspace; kink-native all_undecided_rewrite_rules_are_selected_in_definition_order, observed_rule_merged_with_unobserved_author_is_unknown, two_equal_observed_rules_with_same_spec_attribute_normally, and selected_rewrite_reclassified_as_equation_fails_closed)"
blocking = false
needed_by = ["AllTransitions as every rewrite rule without a second internalize"]
summary = "Backend::rule_catalog classifies compiled rules without a second internalization; Evaluation events use branch ordinals and are diagnostic evidence. Equal written rules, including label-only differences, share one compiled execution identity with all authors. The requested per-written-position execution identity was declined because equal executable rules are indistinguishable. K-in-K2 attributes a multi-author event to one authored rule only when all authors have the same observation specification; otherwise attribution is Unknown."
reproducer = "Historical at 985e0086: an observed execute filtered to the isZero(z) equation rejected its ID as UnknownRule. At this pin rule_catalog classifies equations and Evaluation records can report successor normalization; selected_rewrite_reclassified_as_equation_fails_closed preserves K-in-K2 transition-only observation policy."
local_workaround = "retired: kink-native uses rule_catalog and typed sentence_provenance; K-in-K2 multi-author attribution is the local policy for shared identities, not a workaround."
requested_action = "Satisfied by rule_catalog and Evaluation records. Per-written-position execution identity declined; K-in-K2 retains written positions as provenance and applies its multi-author attribution policy."
sources = ["k-in-k2 milestone 4, AllTransitions as every rewrite rule"]

