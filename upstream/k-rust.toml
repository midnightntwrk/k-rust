[[request]]
id = "collection-role-symbol-sorts"
title = "A collection's element, unit and concat symbols are not sort-checked, and every application of one builds a collection"
kind = "correctness"
status = "fixed"
status_basis = "test run at 501f18b9 on 2026-10-17 in the K-in-K2 1ee9955 gate of record (draft/tasks/repin-501f18b9/handoffs/R0c-fix-4.toml: workspace 777/0/9; Z3 kink-native 229/0/1, kink-campaign 220/0/1, kink-corpus 56/0/8), in both profiles, re-pinned in R0a (E-06). testdata/k/b1coll.k and t13role.k (the reproducer) fail compilation at stage 'hook namespace checks' with the CollectionRoleMisfit detail naming mkFoo's element role (testdata/k/support.rs EXPECTED_COMPILE_FAILURES; kink-native census.rs census_fixture_verdicts and collections.rs b1_non_natural_role_is_not_a_terminal_value; kink-campaign collections.rs c1_c4_collection_campaign_rows, where C4 is BaselineInvalid). Every other testdata definition, the prelude collections included, compiles as before"
fixed_in = "3195ff280 (f07565265, 031133a58, 55a57846b, bc90d4226, 5568597b1, 1c90f0328; merges bde624b4f, 3195ff280)"
blocking = false
needed_by = ["soundness margin of kink's ground-collection comparison (corpus-scale CS-16 relies on the census role predicate today)", "K-in-K2 retirement of census rule C (whole-specification refusal at kink-flow check)"]
summary = "kompile copies the element, unit and concat labels of the production of a LIST.List/MAP.Map/SET.Set-hooked sort that carries element(..) onto the sort with no check of the named symbols' sorts or hooks (kc/kompile/module_to_kore.rs:1416-1484; kc/definition/checks/collections.rs checks parametricity only). attach_collection_metadata attaches the metadata to those symbols by name (kb/definition.rs:3008-3105), and Term::application builds a collection for every application of a symbol that carries metadata (kb/term.rs:776-783, collection_application :800-857), whatever its declared result sort. An unhooked constructor mkFoo(Int) : Foo named as element(mkFoo) of a sort LI therefore yields an LI value in a Foo position, so a Foo-sorted pattern variable rejects it and a K-unreachable rule fires. No hooked symbol is involved, so hook-level checks (and the result-sort backstop at simplify_root) never see it."
reproducer = "syntax Foo ::= mkFoo(Int) [symbol(mkFoo)]; syntax Prog ::= start(Int) | chk(KItem) | done(Int); syntax LI [hook(LIST.List)]; syntax LI ::= LI LI [function, total, left, assoc, symbol(_LI_), element(mkFoo), unit(.LI)]; syntax LI ::= \".LI\" [function, total, symbol(.LI)]; rule start(I) => chk(mkFoo(I)); rule [hit]: chk(F:Foo) => done(1); rule [range]: chk(X:KItem) => done(7) requires X ==K X [priority(60)]; rule chk(_) => done(0) [owise]. krun start(5): k-rust takes [range]; in K, mkFoo(5) is a Foo and [hit] applies. Fixture: k-in-k2 testdata/k/t13role.k once TB-03 lands."
local_workaround = "K-in-K2 TB-03 clause G-C refuses any side in which a symbol carrying collection metadata has a result other than the collection sort, role arguments other than the metadata's, or no role hook."
requested_action = "K5: in attach_collection_metadata (kb/definition.rs:3008-3105), refuse at load a role symbol whose result sort is not the collection sort, a unit symbol with arguments, an element symbol whose arguments differ from the metadata sorts, or a concat symbol whose arguments are not (C, C); optionally require the namespace's role hook (LIST.unit/element/concat, and so on). kompile's collection_attribute_overrides may refuse earlier but must never rewrite. Acceptance: the reproducer is refused at load; K's prelude collections, every kompile-generated cell collection and KWasm's ListInt/ListRef load unchanged; KRUST-PROVENANCE text and definition.kore unchanged for accepted definitions."
sources = ["k-in-k2 draft/tasks/variable-identity/decisions/VI-T13-evidence/lens-soundness.md sections 1-4", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-1.md section 8", "k-rust draft/k-in-k/answers-2026-10.toml KINK-07"]
update_2026_10_09 = "MEASURED further (K-in-K2 CS-01 review 1): an extra symbol that is not the typed collection's metadata role symbol but carries hook LIST.element, LIST.unit, MAP.element or SET.element over a typed collection sort C is evaluated by evaluate_hook, which builds the STANDARD SortList/SortMap/SortSet value (kb/builtin/list.rs element()/unit() use k_item_definition()), placed at declared sort C. An equivalent mutant is Killed (portable and Z3, Full and FirstKill; fixtures in corpus-scale/handoffs/CS-01-review-1.json). hook-result-sort-check, or refusing non-metadata role hooks at load, would close it. [Folded verbatim on 2026-10-15 from k-rust draft/k-in-k/requests-2026-10-07.toml. The route is a hook route: it is merged into hook-result-sort-check and closed at main by fd59f660f; it does not change this request.]"
handoff = "KINK-07"
status_at_main = "open"
status_at_main_basis = "static screen of source at 9ea39ec7 on 2026-10-15: attach_collection_metadata checks only element arity, closed element sorts and one collection per symbol (k-rust-backend definition.rs:3549-3640); Term::application builds a collection for any role-symbol application (term.rs:1098-1119); kompile copies role labels unchecked (kompile/module_to_kore.rs:1459-1503); definition/checks/collections.rs unchanged since the pin; t13role.k not run"
where_requested_shape_differs = "Rules R1-R4 (docs/compatibility.md '## A collection's role symbols have their roles' signatures'): a role symbol has no sort parameters and result sort exactly C; the unit is nullary; the element has arity 1 (2 for a map); the concat is exactly (C, C); the hook is absent or the role's own. The optional role-hook requirement was declined, so a well-sorted hookless role symbol loads. kcompile refuses exactly what the loader would refuse (InvalidAttribute at 'hook namespace checks'). Executable role-rooted equations are reported per definition (value_claims().violations(), KINK-05), not refused."
update_2026_10_17 = "Folded from k-rust draft/k-in-k/answers-2026-10.toml KINK-07 ('done'). kink keeps census rule C, which requires the role hook, as a refusal (ANALYSIS decision 4; findings C-09); its compiling fixture is now testdata/k/r0b/hooklessrole.k (R0b). fd59f660f closed the hook route of update_2026_10_09 (see hook-result-sort-check). Still open at k-rust: a collection with fitting roles but no unit compiles and is then refused at load as MalformedCollection (a kcompile-invariant gap, with no ticket)."

