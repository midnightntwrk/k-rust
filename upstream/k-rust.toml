blocking = false
needed_by = ["kink-flow reliability: check, results and run execute in one process on one 256 MiB thread, so a native stack overflow aborts the whole command and the LLM loses the run in progress (never a verdict)"]
summary = "stop::check_stack is called only from N/crates/k-rust-backend/src/simplify.rs:1422 and :2829 (grep over src/). nesting::with_stack sizes the stack from a depth measured before the work starts (N/crates/k-rust-backend/src/nesting.rs:11-14, 101-138), and the facade applies it once per operation (N/crates/k-rust/src/backend/mod.rs:1336-1337). Matching, rewriting, externalization or recursive TermData drop on terms that grew during execution may therefore overflow and abort the process. For K-in-K2 this is availability only (the campaign dies; never a Killed verdict). Not a regression: O had no stack sizing at all."
reproducer = "Not run. A definition whose rule wraps the configuration in one more constructor per step (rule <k> run(T) => run(c(T)) </k>), executed in process with max_depth None on a 16 MiB thread under a wall-clock watchdog: the thread may overflow before it is cancelled."
local_workaround = "K-in-K2 can bound depth (ExecutionBudget.max_depth, K/crates/kink-native/src/execution.rs:158) and may pass leaf patterns to with_solver_over; neither covers growth inside one execute call."
requested_action = "Re-measure the depth between steps and grow the stack segment or refuse; or make matching, externalization and TermData drop iterative; so that deep growth ends as StopCause::StackExhausted instead of a process abort."
sources = ["k-in-k2 draft/tasks/k-rust-927b9ce6-intake/findings/verify.md section 5", "R/RESULT.md 'Open issues'", "k-rust draft/open-issues-2026-10/RESULT.md:586-594 (k-rust's answer, carried)", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-2.md section 1"]
status_at_main = "fixed"
status_at_main_basis = "static screen of source at 9ea39ec7 on 2026-10-15: the simplifier continues on 16 MiB segments up to 1 GiB per thread and 4 GiB per process, then stops with StopCause::StackExhausted(StackLimit) (docs/backend-port.md:181-200; k-rust-backend stop.rs:50-80); dropping backend and KAST terms is iterative (term.rs:902); the other walks are accepted by documented measurement (docs/backend-port.md:215); commits df39e6de1, 94895813f, 245a9a8cf, 7bdb220a4, 607978161, ab015f56c; not run. A stack-exhausted leaf is published as HaltReasonOutput::SimplificationError with the cause in its detail text (k-rust backend/mod.rs:1666-1683)"


