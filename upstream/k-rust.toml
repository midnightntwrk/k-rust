summary = "k-rust's docs disagree on when an SMT Unsat is conclusive. N/crates/k-rust-backend/src/smt.rs:180-183 (ceca4fef): a partial function translated as a total SMT operation 'is not an over-approximation ... Unsat stays conclusive for it only under the definedness premise that SmtSolver::check_predicates documents'; smt.rs:740-744: that premise is that the definedness of the predicate's partial terms is explicit in it. N/docs/compatibility.md:626 (unchanged from O/docs/compatibility.md:422) still says 'A solver Unsat is sound under every approximation of the translation'. The facade promises only that a leaf predicate implies the definedness of every partial term 'relied on by its conditions, right-hand sides, and simplified states' (N/crates/k-rust/src/backend/mod.rs:133-136; N/docs/backend-port.md:194), which is weaker than 'every partial term in the predicate has its definedness explicit'. definedness::condition_definedness is pub(crate) (N/crates/k-rust-backend/src/definedness.rs:373), so a consumer cannot apply it. K-in-K2 calls SmtSolver::is_sat on leaf constraints and treats Unsat as refuting the leaf (K/crates/kink-native/src/feasibility.rs:284-285, 327-328 -> bridge.rs:132-133) and on relation queries that include the leaf path predicate (feasibility.rs:677-699, 735-736). A leaf wrongly discarded on one side of a mutant pair could make leaf sets differ, which in kink is a spurious kill. Verification found the premise probably holds: rule conditions are hoisted with their definedness (N/crates/k-rust-backend/src/condition.rs:171-182, 255-261), the applicability A is built from them (rewrite/apply.rs:1245-1249) and a remainder is not A (rewrite/roles.rs:66-72), so each partial term's ceil sits inside the negation next to its atom. k-rust's own requires refutation and claim-leaf pruning (compatibility.md:1008) rely on the same premise. Not a regression: O already translated partial functions as total (O/crates/k-rust-backend/src/smt.rs:602-612)."
reproducer = "Static. The shape to rule out is a leaf predicate with a partial term under a negation and without its definedness, e.g. not(X /Int 0 ==Int 5) and not(X /Int 0 =/=Int 5): K-satisfiable where X /Int 0 is undefined, SMT-Unsat. No k-rust execution was shown to print such a leaf. A regression test should execute a rule whose requires uses a partial function (e.g. requires X /Int Y >Int 0) on a symbolic state with strategy All and PathSet, take every leaf including the remainder, and check that is_sat on each leaf's constraints is not Unsat when the leaf has a K instance (e.g. Y = 0)."
local_workaround = "kink names the premise as trust-base item T-UNSAT (kink-native feasibility.rs, bridge.rs; decision D-B), pins it with regression tests (kink-native tests/trust_base.rs), and refuses test states whose caller-written initial predicate puts a partial term under a negation (TV-01 R2-F1: the one violation found, in a caller-written predicate, not a k-rust-produced leaf). The concrete corpus loop does not depend on it: kink-flow runs the portable build and its ground leaves carry no constraints."
requested_action = "Handoff KINK-10 (P2, secondary). Document on execute and search results that every partial-function application in a returned leaf's constraints has its definedness among or implied by them, so that Unsat refutes the leaf, or state where this does not hold; reconcile docs/compatibility.md:1522 with k-rust-backend smt.rs:200-204 (lines at main); state the caller's obligation for caller-written initial constraints (open decision D1); only if the first item cannot be stated, export a public refute query that applies condition_definedness. Acceptance: a Z3 regression test on pos(X, Y) => yes(X /Int Y) requires X /Int Y >Int 0 including the remainder; the same for ensures and right-hand sides; the two documents agree."
original_requested_action = "Document as a facade contract, with a regression test that includes the remainder of a requires over a partial term, that the constraints of every execution leaf (and the residual constraints of unify_term_pairs) satisfy the definedness premise of smt.rs:740-744, so that is_sat = Unsat on them refutes the leaf. Reconcile docs/compatibility.md:626 with smt.rs:180-183. Only if that cannot be promised: export a public 'refute these constraints' query that applies condition_definedness."
sources = ["k-in-k2 draft/tasks/k-rust-927b9ce6-intake/findings/verify.md section 2", "findings/api-semantics.md (K9, issue unsat-definedness-contract)", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-2.md section 8"]
handoff = "KINK-10"
status_at_main = "open"
status_at_main_basis = "static screen of source at 9ea39ec7 on 2026-10-15: docs/compatibility.md:1522 unchanged in substance; premise text at k-rust-backend smt.rs:200-204, :898-903; definedness::condition_definedness still pub(crate) (definedness.rs:988); initial-term definedness decided before the first step since e4766a728 and ffd80eb64 (rewrite/mod.rs:822-848), which does not cover caller-written constraints"


[[request]]
id = "anywhere-value-production-precision"
title = "A self-rewriting anywhere value production in the initial state gives an empty depth-0 remainder (Z3) or an Indeterminate first step (no Z3)"
kind = "precision"
status = "open"
status_basis = "test run in K-in-K2 probe worktree W at b7c3b88 against 927b9ce6 on 2026-10-06, plus decoded execution JSON (adversarial verification: CONFIRMED)"
blocking = false
needed_by = ["K-in-K2 symbolic survivor analysis precision (testdata symwrap.k; audit AT11)", "concrete corpus runs of specifications that rewrite value productions with anywhere rules (none among kink's current flow targets; inferred, not measured)"]
summary = "Since 4d80cea6 (feat(totality): require equation evidence and preserve value normal forms; in base 4cea2f4c, not in O) kompile withholds functional from a production that an anywhere equation headed by itself rewrites: symwrap.k's Lblwrap compiles as [anywhere{}(), function{}(), value-production{}()] (was functional{}() at O). Executing seq(write(wrap(s(X)),V), seq(load(wrap(z),W), halt)) with strategy All, PathSet, Z3 at 927b9ce6 gives two leaves: stuck@2 under \\ceil(wrap(s(X))) /\\ \\ceil(wrap(z)), and stuck@0 (trace 'remainder') whose term still contains wrap(s(X)) and wrap(z) under \\not(\\ceil(wrap(s(X))) /\\ \\ceil(wrap(z))). That remainder denotes nothing: a pattern t /\\ phi denotes \\ceil(t) /\\ t /\\ phi, feb0eeec's own premise. But feb0eeec uses the initial pattern's facts only to refute admission (N/crates/k-rust-backend/src/rewrite/execute.rs:556-565: FactsVerdict::NotRefuted(_) => {}), and \\ceil(subject) enters path knowledge only under assume_initial_defined (rewrite/apply.rs:572-588). Ground run seq(write(wrap(s(z)),V), ...): no-Z3 gives one Indeterminate leaf at depth 0 with cause Smt{error: Unavailable}; Z3 adds a Stuck remainder leaf under \\not(\\ceil(wrap(z))). dfd3365b fixed the same class of empty remainder for implication only. K-in-K2 reads these leaves as SolverUnknown (precision loss, never a spurious kill): its symwrap clash test goes Match -> Unknown and audit AT11 goes [[A,U,U]] -> [[U,U,U]]."
reproducer = "Compile k-in-k2 testdata/k/symwrap.k at 927b9ce6 (rule wrap(s(z)) => wrap(z) [anywhere]; rule seq(write(A,V),P) => P) and execute seq(write(wrap(s(X)),V), seq(load(wrap(z),W), halt)) with z3, strategy all, PathSet: observe the depth-0 remainder leaf. Without z3: execute the ground seq(write(wrap(s(z)),V), seq(load(wrap(z),W), halt)) and observe Indeterminate@0, smt unavailable. In k-in-k2 worktree W: cargo test -p kink-native --test symbolic -- --exact non_free_injective_symbol_does_not_prove_a_clash (Unknown, pinned Match)."
local_workaround = "K-in-K2 re-pins symwrap and AT11 as measured Unknown, citing 4d80cea6. Adding the public ceil_term(leaf term) to a leaf query would refute the symbolic depth-0 remainder, but cannot discharge \\ceil(wrap(z)) on the surviving leaf."
requested_action = "Handoff KINK-11 (P2, secondary). Verify first: if the acceptance already passes at main, k-rust reports the satisfying commit. Preferred: when assume_state_defined is false, use the initial pattern's undecided definedness facts (UndecidedFacts::of_pattern) as path knowledge for the first step, and conjoin them to the path predicate so leaves still imply them. Alternative or additional: the 'evaluated-normal-form precision extension' that 4d80cea6 defers, so a value-production application that no equation rewrites counts as defined. Acceptance: portable build, the ground seq(write(wrap(s(z)), z), seq(load(wrap(z), z), halt)) ends in one stuck leaf at depth 2 and no indeterminate leaf; Z3 build, the input with X, V and W gives no depth-0 leaf contradicting the initial term's definedness. Folds the intake's initial-definedness-as-step-knowledge and value-production-definedness."
original_requested_action = "Preferred: when assume_state_defined is false, use the initial pattern's undecided definedness facts (UndecidedFacts::of_pattern) as path knowledge for the first step, and conjoin them to the path predicate so leaves still imply them (as mod.rs:133-136 and backend-port.md:194-196 describe). This is sound by the pattern semantics and removes both the empty remainder and the no-Z3 indeterminacy. Alternative or additional: implement the 'evaluated-normal-form precision extension' that 4d80cea6 defers, so a value-production application that no equation rewrites counts as defined."
sources = ["k-in-k2 draft/tasks/k-rust-927b9ce6-intake/findings/verify.md section 3", "findings/probe.md section 4.2", "findings/soundness-regressions.md (symwrap)", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-2.md section 9"]
