reproducer = "sympartial.k: write X, half(X), load 0. At 74f1356e no-Z3 is one Indeterminate leaf (unknown, SolverUnknown); Z3 splits into halt under X =/=Int 0 and a stuck remainder at half under X = 0, and WL-after is no-match."
local_workaround = "retired: AdaptedExecution::conditions_kept and DefinitionFacts::total_rules are removed, so symbolic runs keep real prefixes below depth 0 again; applicability_conditions no longer excludes partial functions in requires. The ensures and right-hand-side undefined_symbols exclusions of applicability_conditions were kept at 74f1356e and are retired at b7eff00e with DefinitionFacts (K-in-K2 KK-65): those instances now have a Trivial leaf (request undefined-step-coverage)."
requested_action = "Satisfied. The contract takes total, functional and preserves-definedness as the definition's meaning (README R20), as K-in-K2's removed guard also did."
