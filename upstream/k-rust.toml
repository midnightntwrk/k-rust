[[request]]
id = "execution-leaf-completeness"
title = "Execution leaves have no typed halt reason and may be dropped or merged without a record"
kind = "correctness"
status = "open"
status_basis = "test run at 985e0086 on 2026-09-25 (kink-native converging_branches_never_yield_pattern_no_match; kink-native every_halt_spelling_is_produced_live, which makes k-rust produce all 13 halt spellings; a scratch reproducer in which one stuck branch hides a depth-bound branch and one converging observed branch loses its events) plus static screen of k-rust-backend/src/rewrite/execute.rs, docs/backend-port.md and crates/k-rust/src/backend/mod.rs at 985e0086 on 2026-09-25"
blocking = true
needed_by = ["execution-pattern NoMatch on branching executions", "binding sets on branching executions", "state-set oracles without a trust assumption"]
summary = """
ExecutionLeaf.reason is a String (crates/k-rust/src/backend/mod.rs:150-153), so a caller classifies halts by spelling. The hand-written TypeScript union (k-rust-napi/typescript/index.ts:193-205) lists 12 of the 13 Rust spellings and omits unsupported-hook.
Every DepthBound leaf is dropped without a record once any leaf is stuck, trivial or vacuous, in two places: SelectedExecutionLeaves::push (k-rust-backend/src/rewrite/execute.rs:937-951) drops them as leaves arrive on the normal run path, and select_got_stuck_over_depth_bound (execute.rs:917-928) applies the same selection again in collect (:883-885). A finite max_depth under an explore-all execution can therefore hide unfinished branches.
merge_equal_final_leaves (execute.rs:973-1003, applied by collect at :883-885 and at :197) keys leaves on term, constraints, effects and io only. Branch identity, trace and observation events are not in the key, so of two branches that converge on one final state only one branch's events survive.
The merge is documented behaviour (docs/backend-port.md:110-111: equal final configurations collapse "while preserving the first leaf's trace and halt reason"), and its key was later extended with effects and console state, so leaving the branch out looks deliberate for unobserved runs; what is missing is a record of the merged branches when observation is enabled.
Nothing documents or tests that an unbounded explore-all execute returns every distinct final state.
"""
reproducer = """
Definition with start => mid1, start => mid2, mid1 => done and mid2 => done, labelled left and right on the first step. An explore-all execute_observed from start that observes ND.right returns one stuck leaf whose events are [], although right fires on a real path (kink-native tests/bridge.rs converging_branches_never_yield_pattern_no_match, over testdata/k/nd.k).
"""
local_workaround = """
kink-native's ExecutionAdapter runs with stop_at_branch first: a ground initial state that ends in exactly one stuck leaf, with no backend diagnostic and within the time budget, is a single-path witness and complete evidence.
Otherwise it reruns explore-all without a depth bound. State-set oracles are then complete only under the assumption that every distinct final state is returned; an execution-pattern oracle reaches at most Match, NoMatch and binding sets are Unknown, and the collection stop is ExhaustionUnrecorded.
kink-native HaltClass::parse accepts exactly the 13 spellings of the private halt_reason (crates/k-rust/src/backend/mod.rs:984-1002) at the pin. every_halt_reason_string_maps_to_exactly_one_class checks kink's copy of that list, not k-rust output.
All 13 spellings are live-checked: kink-native tests/bridge.rs every_halt_spelling_is_produced_live makes k-rust produce each one over an inline KORE definition and asserts the class it maps to.
Seven are produced through ExecutionAdapter::execute: stuck, trivial, vacuous, indeterminate, unsupported-hook, simplification-error and cancelled.
Six are produced only through Backend::execute_observed with one field of the adapter's explore-all request changed: branch (stop_at_branch; the adapter discards its stop_at_branch run unless that run ended in one stuck leaf), cut-point (cut_point_rules), terminal (terminal_rules), depth-bound (max_depth), breadth-bound (max_breadth) and timeout (step_timeout_ms); for these the row checks HaltClass::parse, which the adapter applies to every leaf.
A moved spelling fails that test and makes the execution adapter fail closed with UnknownHaltReason, which the runner reports as Error. A new halt reason is noticed by no test, so re-read halt_reason when moving the pin.
"""
requested_action = """
Give ExecutionLeaf a typed halt reason.
Document, and test, that an unbounded explore-all execute returns every distinct final state.
Report DepthBound leaves dropped by SelectedExecutionLeaves::push and by select_got_stuck_over_depth_bound, as a count or as the leaves.
When observation is enabled, include branch identity and observations in the merge key of merge_equal_final_leaves, or report the merged leaves with their traces.
"""
sources = ["k-in-k2 k-rust migration design, section 8 risk 3 and critique C1"]

[[request]]
id = "execution-diagnostics"
title = "Execution and search responses do not carry the backend diagnostics of the run"
kind = "missing-feature"
status = "open"
status_basis = "test run at 985e0086 on 2026-09-25 (a scratch crate running the reproducer below; kink-native tests/bridge.rs undecided_live_occurrences_are_no_witness and a scratch crate running the reproducer below, where only diagnostic::collect returns the backend diagnostic) plus static screen of k-rust-backend/src/diagnostic.rs, simplify.rs, crates/k-rust/src/backend/mod.rs and README.md at 985e0086 on 2026-09-25"
blocking = false
needed_by = ["execution oracle slots that must tell budget exhaustion from a result"]
summary = """
Simplification-budget exhaustion, undecided conditions and predicates, and unevaluated hooks are emitted as BackendDiagnostic into a thread-local sink (k-rust-backend/src/diagnostic.rs:12-31, emitted at simplify.rs:271, :479, :755, :826, :2590).
Only a caller that wraps the call in diagnostic::collect (diagnostic.rs:59-66) sees them; no production route does, and ExecutionResult (crates/k-rust/src/backend/mod.rs:141-147) and the search response have no diagnostics field.
After budget exhaustion execution continues with a partially simplified term, so a leaf can look stuck when it is not, and a Final search returns the partially simplified state with an empty incomplete list.
README.md:257 says exhaustion "is reported as a simplification iteration-limit stop", but no response field carries such a stop.
"""
reproducer = "Define a function g with the simplification equation g(X) = g(g(X)) and the rule start => g(a). Execute from start with max_simplification_iterations = 3: the one leaf is stuck with 1226 unevaluated g calls, and only diagnostic::collect returns SimplificationBudgetExhausted { limit: 3, .. }. A Final search from start under the same budget returns that state with an empty incomplete list."
local_workaround = "kink-native wraps every execute call in diagnostic::collect and treats any diagnostic as an incomplete run: every path is a BackendLimit, so state-set slots and a pattern Match or NoMatch become Unknown."
requested_action = "Return the run's diagnostics as a typed field on ExecutionResult and on the search response, so a caller on another thread or across the wire sees them (KRS KR-07, in review, adds the diagnostic kinds for equation conditions). Count budget exhaustion as a reason a search is incomplete, and align README.md:257 with the behaviour."
sources = ["k-in-k2 k-rust migration design, section 8 risk 4 and critique C3"]

[[request]]
id = "structured-term-sort-check"
title = "Structured rule terms are not sort-checked by load_structured or compile_loaded_definition"
kind = "correctness"
status = "open"
status_basis = "test run at 985e0086 on 2026-09-24 (kink-patch local_sort_check_rejects_what_k_rust_compiles, rows bool-token-in-nat-position and non-bool-requires)"
blocking = false
needed_by = ["mutant validity without a local sort check"]
summary = """
A rule term supplied as a KAST term, rather than parsed by the inner parser, is not sort-checked.
A Bool token in a Nat position compiles with an injection between unrelated sorts, and a non-Bool requires clause compiles.
"""
reproducer = "Load counter.k, replace the term at path [0, 1, 0] of COUNTER.increment (the s(N) argument on the right side) with the Bool token true, or its requires clause with z, relink the loaded definition, and call compile_loaded_definition: it succeeds."
local_workaround = "kink-patch sort.rs re-implements a conservative local sort check: an undecidable sort is a rejection, and a rewrite must not widen its left sort. The two rows above pin the upstream behaviour and fail once k-rust rejects the edits."
requested_action = "Sort-check sentence terms that load_structured or compile_loaded_definition did not parse, or expose the inner parser's sort inference for a given term in a module."
sources = ["k-in-k2 k-rust migration design, section 8 risk 2"]

