sources = ["k-in-k2 decisions/VI-T12-evidence/krust-audit.md section 3 String, section 5.C", "draft/tasks/k-rust-handoff-2026-10-15/assessed/group-1.md section 4"]
update_2026_10_08 = "MEASURED (K-in-K2 TB-03 review 1, handoffs/TB-03-review-1.json): the same mis-decoding is reached with no escape in the source. kompile's constant folding (kompile/passes/constant_folding.rs wrap()) re-quotes a folded String result with kast::string::quote, which spells U+0080..U+00FF as \\xHH, and term_to_kore reads it back with unquote_bytes as one byte. Example: rule p: chk(S) => done(7) requires S ==K chrChar(233); owise done(0); start(I) => chk(chrChar(I)). The compiled KORE holds \\dv{SortString{}}(\"\\xe9\") from the fold beside \\dv(\"\\xc3\\xa9\") from a raw \"\u00e9\" literal, so an equivalent mutant (chrChar(233) replaced by \"\u00e9\") is Killed, portable and Z3, Full and FirstKill. The requested decoding fix also fixes this route; acceptance should add: a folded chrChar(233) and \"\u00e9\" +String \"\" compile to the same bytes as the literal \"\u00e9\"."
