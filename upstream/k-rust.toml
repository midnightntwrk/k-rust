[[request]]
# Added on 2026-10-17 from HANDOFF.md KINK-15 (filed 2026-10-15 in draft/tasks/upstream-pending.md, not in this file).
id = "cancellation-bounded-work"
title = "After a cancellation, execution still turns its leaves into facade output before it returns"
kind = "performance"
status = "fixed"
status_basis = "static screen of source at 501f18b9 on 2026-10-17: ExecuteRequest::cancelled_result (CancelledResultOutput {Partial, Error}) and ExecuteRequest::trace are in crates/k-rust/src/backend/mod.rs. docs/backend-port.md '## Cancellation' (:211): under error, a cancellation observed in the exploration, in a pass after it, or in the facade conversion answers Err with stop_cause Cancelled, and nothing is built after it but the stopped state's own leaf. The tests in crates/k-rust/tests/cancellation_contract.rs are present. Not run by kink, which sends cancelled_result Partial and trace true at 1ee9955 (R0a: the request is written out field by field)"
fixed_in = "deb53f2c9 (KINK-15/1 d0e9e5620, 15/2 c6fb6c228 with 3691753f5, 15/3 e0ff5a138; merges 577ee1fdf, 9165aed24, 25455cc0d, deb53f2c9)"
blocking = false
needed_by = ["kink-flow reliability: a stop must take effect promptly, or a mutant whose loop no longer ends takes the host down", "lane 1 result-run options (cancelled_result Error, trace false)"]
summary = "Measured by kink at 927b9ce6 (flow packet F-11). After a cancel, the IMP primes mutant div-becomes-mul returned 7.8 s later with 1,025 leaves, and its memory grew from 4.3 to 8.4 GB; a fork fixture returned 2.2 s later with 3,076 leaves. k-rust corrected the premise: neither 927b9ce6 nor main externalises the pending frontier after a cancel. The IMP figure was the max_breadth = 1024 breadth-bound drain, plus the facade converting leaves that had already finished (quadratic through per-leaf traces). That reading fits F-11, whose kink-flow DEFAULT_MAX_BREADTH was Some(1024), and 1,025 is 1,024 drained states plus the stopped one; kink did not re-measure it. At 501f18b9, under cancelledResult error nothing is built after the cancel is observed except the stopped state's own leaf, which is discarded. trace: false empties leaf traces and changes no other field. Under StateSet, a cancelled leaf is never merged away."
reproducer = "HANDOFF.md KINK-15: at 927b9ce6, the IMP lesson_4 mutant with / rewritten to *Int on primes (m = 4), and a two-rule fork-forever fixture, each cancelled through the request's token."
local_workaround = "None needed for soundness. A cancelled run is a Timeout, never a kill or a cached result (R0b: Timeout iff kink's watchdog fired, or the run is an Err with stop_cause Cancelled, or it has a Cancelled leaf). kink-flow keeps its watchdog and advises an OS memory limit. Lane 1 sets cancelled_result Error and trace false on result runs."
requested_action = "Handoff KINK-15 (P1). After a request's cancellation is observed, the work k-rust does before returning is bounded independently of the frontier size, or at least builds no per-leaf output for leaves the caller asked not to receive. One acceptable shape is a request option under which a cancelled run returns a single Cancelled outcome. Acceptance: (1) on a fork-forever definition, a cancel after the frontier holds at least 10^4 states returns within a stated small bound and allocates no per-frontier-entry output; (2) without the option, behaviour is unchanged; (3) a cancelled result is never a normal completion."
where_requested_shape_differs = "An option, not a changed default (cancelledResult is partial by default). Its error shape replaces kink's proposed single Cancelled outcome with counts, since counts after a cancel depend on timing (KINK-16's work is the reproducible count). Acceptance 1 is replaced: the bound is structural ('the current phase plus releasing what the run built, with no output constructed'; every pass after the exploration polls once per leaf), pinned by test-only counters rather than by wall time or a counting allocator. Cancellable loads (KINK-15/4) are deferred."
sources = ["draft/tasks/k-rust-handoff-2026-10-15/HANDOFF.md KINK-15; ADDENDUM-1.md", "k-in-k2 draft/tasks/flow/handoffs/F-11.toml proposed_requests[0]", "draft/tasks/upstream-pending.md (2026-10-15)", "k-rust draft/k-in-k/answers-2026-10.toml KINK-15"]
handoff = "KINK-15"
update_2026_10_17 = "Folded from k-rust draft/k-in-k/answers-2026-10.toml KINK-15 ('partly done, reframed: criteria 2 and 3 pass, criterion 1 replaced'). Judged fixed against the requested contract, which allowed the 'no per-leaf output' shape. k-rust's 15/3 probe (fork fixture, traces on, cancel at 4 s) measured the error shape at 880-1,048 ms, against 1.3-1.7 s plus 1.5-2.1 s of drop under partial. k-rust advises taking one-sided kills from work-bound runs, not cancelled ones, and kink agrees (ANALYSIS decision 6; findings A-15). Under partial, a cancel observed during externalisation can leave a Stuck leaf with an unnormalised pattern (k-rust-backend rewrite/execute.rs:2547-2556), so kink rejects the 'even from cancelled runs' half of answers-2026-10.md section 6. Still open at k-rust: KINK-15/4, cancellable loads (trigger: loads over kink's time budget, or backends built inside a watchdog scope; kink builds them outside, findings C-14)."

