summary = "Since 4d80cea6 (feat(totality): require equation evidence and preserve value normal forms; in base 4cea2f4c, not in O) kompile withholds functional from a production that an anywhere equation headed by itself rewrites: symwrap.k's Lblwrap compiles as [anywhere{}(), function{}(), value-production{}()] (was functional{}() at O). Executing seq(write(wrap(s(X)),V), seq(load(wrap(z),W), halt)) with strategy All, PathSet, Z3 at 927b9ce6 gives two leaves: stuck@2 under \\ceil(wrap(s(X))) /\\ \\ceil(wrap(z)), and stuck@0 (trace 'remainder') whose term still contains wrap(s(X)) and wrap(z) under \\not(\\ceil(wrap(s(X))) /\\ \\ceil(wrap(z))). That remainder denotes nothing: a pattern t /\\ phi denotes \\ceil(t) /\\ t /\\ phi, feb0eeec's own premise. But feb0eeec uses the initial pattern's facts only to refute admission (N/crates/k-rust-backend/src/rewrite/execute.rs:556-565: FactsVerdict::NotRefuted(_) => {}), and \\ceil(subject) enters path knowledge only under assume_initial_defined (rewrite/apply.rs:572-588). Ground run seq(write(wrap(s(z)),V), ...): no-Z3 gives one Indeterminate leaf at depth 0 with cause Smt{error: Unavailable}; Z3 adds a Stuck remainder leaf under \\not(\\ceil(wrap(z))). dfd3365b fixed the same class of empty remainder for implication only. K-in-K2 reads these leaves as SolverUnknown (precision loss, never a spurious kill): its symwrap clash test goes Match -> Unknown and audit AT11 goes [[A,U,U]] -> [[U,U,U]]."
reproducer = "Compile k-in-k2 testdata/k/symwrap.k at 927b9ce6 (rule wrap(s(z)) => wrap(z) [anywhere]; rule seq(write(A,V),P) => P) and execute seq(write(wrap(s(X)),V), seq(load(wrap(z),W), halt)) with z3, strategy all, PathSet: observe the depth-0 remainder leaf. Without z3: execute the ground seq(write(wrap(s(z)),V), seq(load(wrap(z),W), halt)) and observe Indeterminate@0, smt unavailable. In k-in-k2 worktree W: cargo test -p kink-native --test symbolic -- --exact non_free_injective_symbol_does_not_prove_a_clash (Unknown, pinned Match)."
local_workaround = "K-in-K2 re-pins symwrap and AT11 as measured Unknown, citing 4d80cea6. Adding the public ceil_term(leaf term) to a leaf query would refute the symbolic depth-0 remainder, but cannot discharge \\ceil(wrap(z)) on the surviving leaf."
requested_action = "Preferred: when assume_state_defined is false, use the initial pattern's undecided definedness facts (UndecidedFacts::of_pattern) as path knowledge for the first step, and conjoin them to the path predicate so leaves still imply them (as mod.rs:133-136 and backend-port.md:194-196 describe). This is sound by the pattern semantics and removes both the empty remainder and the no-Z3 indeterminacy. Alternative or additional: implement the 'evaluated-normal-form precision extension' that 4d80cea6 defers, so a value-production application that no equation rewrites counts as defined."
sources = ["k-in-k2 draft/tasks/k-rust-927b9ce6-intake/findings/verify.md section 3", "findings/probe.md section 4.2", "findings/soundness-regressions.md (symwrap)"]


[[request]]
id = "deep-execution-overflow"
title = "Execution that deepens terms beyond the depth measured up front can overflow the native stack outside the simplifier"
kind = "bug"
status = "open"
status_basis = "static screen of source at 927b9ce6 on 2026-10-06 (adversarial verification: PLAUSIBLE; not reproduced); listed as open in R/RESULT.md 'Open issues'"
blocking = false
needed_by = ["K-in-K2 campaign availability on definitions whose rules grow the configuration without a depth bound"]
summary = "stop::check_stack is called only from N/crates/k-rust-backend/src/simplify.rs:1422 and :2829 (grep over src/). nesting::with_stack sizes the stack from a depth measured before the work starts (N/crates/k-rust-backend/src/nesting.rs:11-14, 101-138), and the facade applies it once per operation (N/crates/k-rust/src/backend/mod.rs:1336-1337). Matching, rewriting, externalization or recursive TermData drop on terms that grew during execution may therefore overflow and abort the process. For K-in-K2 this is availability only (the campaign dies; never a Killed verdict). Not a regression: O had no stack sizing at all."
reproducer = "Not run. A definition whose rule wraps the configuration in one more constructor per step (rule <k> run(T) => run(c(T)) </k>), executed in process with max_depth None on a 16 MiB thread under a wall-clock watchdog: the thread may overflow before it is cancelled."
local_workaround = "K-in-K2 can bound depth (ExecutionBudget.max_depth, K/crates/kink-native/src/execution.rs:158) and may pass leaf patterns to with_solver_over; neither covers growth inside one execute call."
requested_action = "Re-measure the depth between steps and grow the stack segment or refuse; or make matching, externalization and TermData drop iterative; so that deep growth ends as StopCause::StackExhausted instead of a process abort."
sources = ["k-in-k2 draft/tasks/k-rust-927b9ce6-intake/findings/verify.md section 5", "R/RESULT.md 'Open issues'"]


