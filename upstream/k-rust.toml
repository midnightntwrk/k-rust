local_workaround = "retired: kink-native reads leaf, candidate, and remainder diagnostic fields and marks only diagnosed paths BackendLimit."
requested_action = "Satisfied by per-path diagnostics. Inspect candidates and remainders as well as leaves; a run-wide list is not part of the contract."
sources = ["k-in-k2 k-rust migration design, section 8 risk 4 and critique C3"]

