# k2lean regression gate baseline of the confluence area (k2lean/tests/gate.sh, k2lean/tests/gate-check.py).
# Accept a new one after a deliberate change: run the tier, read its FAIL lines, then
#   k2lean/tests/gate.sh accept --area confluence
# (with the same GATE_WORK/GATE_ROOT as the run); a light run replaces only the light entries.
# The recorded outputs that `outputs` names are in expected/confluence/ beside this directory.


[demo.RaceConf]
tier = "light"
guarded = 12
preserve = []

[demo.SimpleConf]
tier = "heavy"
guarded = 12
preserve = []

[demo.UtxoConf]
tier = "light"
guarded = 8
preserve = []

[outputs]
"simple-confluence.toml" = { tier = "heavy", compare = "exact" }

