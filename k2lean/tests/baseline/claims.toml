# k2lean regression gate baseline of the claims area (k2lean/tests/gate.sh, k2lean/tests/gate-check.py).
# Accept a new one after a deliberate change: run the tier, read its FAIL lines, then
#   k2lean/tests/gate.sh accept --area claims
# (with the same GATE_WORK/GATE_ROOT as the run); a light run replaces only the light entries.
# The recorded outputs that `outputs` names are in expected/claims/ beside this directory.


[claims]
tier = "heavy"
claims = 25
stated = 25
inv_stated = 2
induction_obligations = 33
guarded = 63
kc_auto = 50
kc_auto_open = 0

[demo.ImpRelClaims]
tier = "heavy"
guarded = 29
preserve = []

[demo.ImpUnrollClaims]
tier = "heavy"
guarded = 342
preserve = []

[outputs]
"claims.toml" = { tier = "heavy", compare = "exact" }
