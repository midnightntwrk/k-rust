# Termination inputs for KEVM's recursive functions that no generic rule covers
# (`k2lean gen --arity-terms … --termination kevm-termination.toml`, run by kevm.sh beside this
# file). The lemmas are stated over the arity-indexed universe (`Term.c2.sizeOf_spec`).
#
# Keys are K function labels as the generated `-- `label` (recursive)` comment prints them.
# `termination_by` is a Lean term over the parameters x0, x1, …; `decreasing_by` a tactic that
# replaces the generated one; `before` declarations emitted before the function's group (all its
# callees are defined by then). Nothing here changes what a function computes.
# A lemma that does not mention a hook parameter says `omit [Hooks] in` (`Functions.lean` has
# `variable [Hooks]`, which a theorem would otherwise take as an argument).

# Quicksort on a JSON object's entries: both recursive calls are on a filtered tail, so they need
# "a filter returns at most its input" for `#entriesLT` and `#entriesGE`.
[functions."qsortJSONs"]
before = """
omit [Hooks] in
/-- `#entriesLT` keeps a sublist: its result is no larger than its input (termination of `qsortJSONs`). -/
theorem K.«#entriesLT».sizeOf_le (k : SortString) : ∀ (l r : SortJSONs), K.«#entriesLT» k l = some r → sizeOf r ≤ sizeOf l
  | SortJSONs.«.List{"JSONs"}», r, h => by
    rw [K.«#entriesLT».eq_def] at h; simp at h; subst h; omega
  | SortJSONs.JSONs y REST, r, h => by
    rw [K.«#entriesLT».eq_def] at h
    simp only at h
    repeat' k2l_split_hyp
    all_goals (simp only [Option.some.injEq, reduceCtorEq] at *)
    all_goals (try subst_vars)
    all_goals (try (simp only [Option.some.injEq, reduceCtorEq] at *); try subst_vars)
    all_goals (try (have := K.«#entriesLT».sizeOf_le k _ _ ‹K.«#entriesLT» k _ = some _›))
    all_goals (first | (simp only [SortJSONs.JSONs, Term.c2.sizeOf_spec] at *; omega) | (simp_all; done) | (simp_all; omega))
termination_by l => sizeOf l
decreasing_by all_goals (simp_wf; (try simp only [SortJSONs.JSONs, Term.c2.sizeOf_spec]); first | omega | (simp_all; done) | (simp_all; omega))

omit [Hooks] in
/-- `#entriesGE` keeps a sublist: its result is no larger than its input (termination of `qsortJSONs`). -/
theorem K.«#entriesGE».sizeOf_le (k : SortString) : ∀ (l r : SortJSONs), K.«#entriesGE» k l = some r → sizeOf r ≤ sizeOf l
  | SortJSONs.«.List{"JSONs"}», r, h => by
    rw [K.«#entriesGE».eq_def] at h; simp at h; subst h; omega
  | SortJSONs.JSONs y REST, r, h => by
    rw [K.«#entriesGE».eq_def] at h
    simp only at h
    repeat' k2l_split_hyp
    all_goals (simp only [Option.some.injEq, reduceCtorEq] at *)
    all_goals (try subst_vars)
    all_goals (try (simp only [Option.some.injEq, reduceCtorEq] at *); try subst_vars)
    all_goals (try (have := K.«#entriesGE».sizeOf_le k _ _ ‹K.«#entriesGE» k _ = some _›))
    all_goals (first | (simp only [SortJSONs.JSONs, Term.c2.sizeOf_spec] at *; omega) | (simp_all; done) | (simp_all; omega))
termination_by l => sizeOf l
decreasing_by all_goals (simp_wf; (try simp only [SortJSONs.JSONs, Term.c2.sizeOf_spec]); first | omega | (simp_all; done) | (simp_all; omega))
"""
termination_by = "sizeOf x0"
decreasing_by = """
all_goals
  simp_wf
  (try have := K.«#entriesLT».sizeOf_le _ _ _ ‹K.«#entriesLT» _ _ = some _›)
  (try have := K.«#entriesGE».sizeOf_le _ _ _ ‹K.«#entriesGE» _ _ = some _›)
  (try simp only [SortJSONs.JSONs, Term.c2.sizeOf_spec] at *)
  omega
"""

# The jump-destination scan: `computeValidJumpDestsAux` stops at the end of the code, and
# `computeValidJumpDestsWithinBound` steps past one opcode, whose width (`#widthOpCode`) is at
# least 1. Measure: twice the distance to the end, plus one in the outer function.
[functions."computeValidJumpDestsAux"]
before = """
omit [Hooks] in
/-- An opcode is at least one byte wide (termination of `computeValidJumpDests`). -/
theorem K.«#widthOpCode».one_le (w : Int) : (1 : Int) ≤ K.«#widthOpCode» w := by
  simp only [K.«#widthOpCode», K.«#widthOpCode».rule1]
  split
  · next r h =>
    split at h
    · next hc =>
      simp only [Option.some.injEq] at h
      simp only [KPrelude.BoolHook.and, KPrelude.IntHook.ge, KPrelude.IntHook.le, Bool.and_eq_true, decide_eq_true_eq] at hc
      subst h; simp only [KPrelude.IntHook.sub]; omega
    · simp at h
  · omega
"""
termination_by = "2 * (KPrelude.BytesHook.length x0 - x1).toNat + 1"
decreasing_by = """
all_goals
  (try have := K.«#widthOpCode».one_le r_1)
  k2l_decreasing
"""

[functions."computeValidJumpDestsWithinBound"]
termination_by = "2 * (KPrelude.BytesHook.length x0 - x1).toNat"
decreasing_by = """
all_goals
  (try have := K.«#widthOpCode».one_le r_1)
  k2l_decreasing
"""

# The bloom filter folds a list in which a log entry is replaced by its address bytes followed by
# its topics as bytes (`listAsBytes`), so the list can grow. Measure: the total weight of the
# items, a log entry weighing two more than its topic count and any other item one; `listAsBytes`
# returns one `Bytes` item per topic.
[functions."#bloomFilterAux"]
before = """
omit [Hooks] in
/-- An item's weight in `#bloomFilterAux`'s measure. -/
def K.«#bloomFilterAux».itemWeight : SortKItem → Nat
  | SortKItem.inj_SubstateLogEntry (SortSubstateLogEntry.logEntry _ T _) => 2 + (ListIso.toList T).length
  | _ => 1

omit [Hooks] in
theorem K.«#bloomFilterAux».itemWeight_bytes (b : SortBytes) :
    K.«#bloomFilterAux».itemWeight (SortKItem.inj_Bytes b) = 1 := rfl

omit [Hooks] in
/-- `#bloomFilterAux`'s measure: the total weight of a list's items. -/
def K.«#bloomFilterAux».weight (l : SortList) : Nat := ((ListIso.toList l).map K.«#bloomFilterAux».itemWeight).sum

omit [Hooks] in
theorem K.«#bloomFilterAux».weight_concat (a b : SortList) :
    K.«#bloomFilterAux».weight (ListHook.concat a b) = K.«#bloomFilterAux».weight a + K.«#bloomFilterAux».weight b := by
  simp only [K.«#bloomFilterAux».weight, ListHook.concat, ListIso.toList_ofList, List.map_append, List.sum_append]

omit [Hooks] in
theorem K.«#bloomFilterAux».weight_element (x : SortKItem) :
    K.«#bloomFilterAux».weight (ListHook.element x) = K.«#bloomFilterAux».itemWeight x := by
  simp only [K.«#bloomFilterAux».weight, ListHook.element, ListIso.toList_ofList, List.map_cons, List.map_nil,
    List.sum_cons, List.sum_nil, Nat.add_zero]

omit [Hooks] in
theorem K.«#bloomFilterAux».weight_uncons {m t : SortList} {x : SortKItem} (h : ListHook.uncons m = some (x, t)) :
    K.«#bloomFilterAux».weight m = K.«#bloomFilterAux».itemWeight x + K.«#bloomFilterAux».weight t := by
  rw [← ListHook.concat_element_of_uncons h, K.«#bloomFilterAux».weight_concat]
  simp only [K.«#bloomFilterAux».weight, ListHook.element, ListIso.toList_ofList, List.map_cons, List.map_nil,
    List.sum_cons, List.sum_nil, Nat.add_zero]

omit [Hooks] in
theorem K.«#bloomFilterAux».length_uncons {m t : SortList} {x : SortKItem} (h : ListHook.uncons m = some (x, t)) :
    (ListIso.toList m).length = (ListIso.toList t).length + 1 := by
  rw [← ListHook.concat_element_of_uncons h]
  simp only [ListHook.concat, ListHook.element, ListIso.toList_ofList, List.singleton_append, List.length_cons]

omit [Hooks] in
/-- `listAsBytes` turns each topic into one `Bytes` item (termination of `#bloomFilterAux`). -/
theorem K.listAsBytes.weight_le (l r : SortList) (h : K.listAsBytes l = some r) :
    K.«#bloomFilterAux».weight r ≤ (ListIso.toList l).length := by
    rw [K.listAsBytes.eq_def] at h
    simp only at h
    repeat' k2l_split_hyp
    all_goals (simp only [Option.some.injEq, reduceCtorEq] at *)
    all_goals (try subst_vars)
    all_goals (try (simp only [Option.some.injEq, reduceCtorEq] at *); try subst_vars)
    all_goals (try subst r)
    all_goals (try (have := K.listAsBytes.weight_le _ _ ‹K.listAsBytes _ = some _›))
    all_goals (try (have := K.«#bloomFilterAux».length_uncons ‹ListHook.uncons _ = some _›))
    all_goals (try rw [K.«#bloomFilterAux».weight_concat])
    all_goals (first
      | (rw [id_eq, K.«#bloomFilterAux».weight_element, K.«#bloomFilterAux».itemWeight_bytes]; omega)
      | (simp only [K.«#bloomFilterAux».weight, ListHook.unit, ListHook.element, ListIso.toList_ofList, List.map_cons,
          List.map_nil, List.sum_cons, List.sum_nil, K.«#bloomFilterAux».itemWeight_bytes] at *; omega)
      | (simp_all; done))
termination_by sizeOf l
decreasing_by all_goals (simp_wf; k2l_facts; omega)
"""
termination_by = "K.«#bloomFilterAux».weight x0"
decreasing_by = """
all_goals
  simp_wf
  have hw := K.«#bloomFilterAux».weight_uncons ‹ListHook.uncons x0 = some _›
  rw [hw]
  (try rw [K.«#bloomFilterAux».weight_concat, K.«#bloomFilterAux».weight_concat])
  (try have := K.listAsBytes.weight_le _ _ ‹K.listAsBytes _ = some _›)
  simp only [K.«#bloomFilterAux».weight, K.«#bloomFilterAux».itemWeight, K.«#bloomFilterAux».itemWeight_bytes, ListHook.element, ListIso.toList_ofList,
    List.map_cons, List.map_nil, List.sum_cons, List.sum_nil] at *
  omega
"""

# `#fakeExponential(I, OUTPUT, ACCUM, NUMER, DENOM)` (EIP-4844) recurses while ACCUM > 0 with
# I + 1 and ACCUM' = ACCUM * NUMER / (DENOM * I). It terminates for every integer input: while
# I <= |NUMER| the counter's distance to |NUMER| + 1 decreases; after that |DENOM * I| > |NUMER|,
# so |ACCUM'| < ACCUM. Measure: that distance, then ACCUM.
[functions."#fakeExponential(_,_,_,_,_)_EVM_Int_Int_Int_Int_Int_Int"]
before = """
omit [Hooks] in
/-- Once the counter exceeds the numerator's absolute value, the accumulator decreases
(termination of `#fakeExponential`). -/
theorem K.«#fakeExponential».acc_lt {a n d i r : Int} (ha : 0 < a) (hi : (n.natAbs : Int) < i)
    (h : KPrelude.IntHook.tdiv (KPrelude.IntHook.mul a n) (KPrelude.IntHook.mul d i) = some r) : r < a := by
  unfold KPrelude.IntHook.tdiv KPrelude.IntHook.mul at h
  split at h
  · simp at h
  · next hne =>
    simp only [Option.some.injEq] at h
    subst h
    have hd : d ≠ 0 := fun e => hne (by simp [e])
    have hd1 : 1 ≤ d.natAbs := Nat.pos_of_ne_zero (Int.natAbs_ne_zero.2 hd)
    have hi' : n.natAbs < i.natAbs := by omega
    have ha' : 0 < a.natAbs := by omega
    have key : (a * n).natAbs / (d * i).natAbs < a.natAbs := by
      rw [Nat.div_lt_iff_lt_mul (by rw [Int.natAbs_mul]; exact Nat.mul_pos hd1 (by omega)), Int.natAbs_mul, Int.natAbs_mul]
      calc a.natAbs * n.natAbs < a.natAbs * i.natAbs := Nat.mul_lt_mul_of_pos_left hi' ha'
        _ ≤ a.natAbs * (d.natAbs * i.natAbs) := Nat.mul_le_mul_left _ (Nat.le_mul_of_pos_left _ hd1)
    have e : ((a * n).tdiv (d * i)).natAbs = (a * n).natAbs / (d * i).natAbs := Int.natAbs_tdiv _ _
    rw [← e] at key
    have := Int.le_natAbs (a := (a * n).tdiv (d * i))
    omega
"""
termination_by = "(((x3.natAbs : Int) + 1 - x0).toNat, x2.toNat)"
decreasing_by = """
all_goals
  simp_wf
  have hpos : (0 : Int) < x2 := by simpa [KPrelude.IntHook.gt] using hreq
  have hstep := fun h => K.«#fakeExponential».acc_lt hpos h hr
  simp only [Prod.lex_def, KPrelude.IntHook.add]
  omega
"""


# RLP decoding: `#rlpDecode` decodes one item's prefix at position 0 and, for a list, decodes the
# list's items from the payload start on (`#rlpDecodeList`), each item from its own slice. A slice
# can be the whole input (an item at position 0 that spans it), so the measure is not the length
# alone: with n the input's length, `#rlpDecode` weighs 4n + 1, `#rlpDecodeList` at position s
# 4(n - s) + 3, `#rlpDecodeListAux` 4(n - s) + 2 when its item ends after s (4(n - s) + 4 when it
# does not, a case only a direct call can reach), and `#rlpDecodeAux` on a list prefix whose payload
# starts at P 4(n - P) + 4. The facts about `#decodeLengthPrefix` it needs: the start is in range,
# the item ends after it, and a list's payload starts after it.
[functions."#rlpDecode"]
before = """
omit [Hooks] in
theorem K.asWord.nonneg {b : SortBytes} {w : Int} (h : K.asWord b = some w) : 0 ≤ w := by
  simp [K.asWord, K.asWord.rule1, K.chop, K.chop.rule1, KPrelude.IntHook.emod] at h
  subst h; exact Int.emod_nonneg _ (by decide)

omit [Hooks] in
theorem K.«#decodeLengthPrefixLength».facts {T : SortLengthPrefixType} {b : SortBytes} {s B0 : Int} {p : SortLengthPrefix}
    (h : K.«#decodeLengthPrefixLength» T b s B0 = some p) :
    ∃ L : Int, 0 ≤ L ∧ ((T = SortLengthPrefixType.«#str» ∧ p = SortLengthPrefix.«_(_,_)» T L (s + 1 + (B0 - 128 - 56 + 1))) ∨
      (T = SortLengthPrefixType.«#list» ∧ p = SortLengthPrefix.«_(_,_)» T L (s + 1 + (B0 - 192 - 56 + 1)))) := by
  unfold K.«#decodeLengthPrefixLength» K.«#decodeLengthPrefixLength».rule1 K.«#decodeLengthPrefixLength».rule2 at h
  repeat' k2l_split_hyp
  all_goals (simp only [Option.some.injEq, reduceCtorEq] at *)
  all_goals (try subst_vars)
  all_goals (try (simp only [Option.some.injEq, reduceCtorEq] at *); try subst_vars)
  all_goals (first | (exact ⟨_, K.asWord.nonneg ‹_›, Or.inl ⟨trivial, rfl⟩⟩) | (exact ⟨_, K.asWord.nonneg ‹_›, Or.inr ⟨trivial, rfl⟩⟩))

omit [Hooks] in
theorem K.«#decodeLengthPrefixAux».ctor_inj {T T' : SortLengthPrefixType} {L L' P P' : Int} :
    SortLengthPrefix.«_(_,_)» T L P = SortLengthPrefix.«_(_,_)» T' L' P' ↔ T = T' ∧ L = L' ∧ P = P' := by
  simp [SortLengthPrefix.«_(_,_)»]

omit [Hooks] in
theorem K.«#decodeLengthPrefixAux».facts {b : SortBytes} {s B0 : Int} {p : SortLengthPrefix}
    (h : K.«#decodeLengthPrefixAux» b s B0 = some p) :
    ∀ (T : SortLengthPrefixType) (L P : Int), p = SortLengthPrefix.«_(_,_)» T L P → s < L + P ∧ (T = SortLengthPrefixType.«#list» → s < P) := by
  intro T L P hp
  subst hp
  unfold K.«#decodeLengthPrefixAux» K.«#decodeLengthPrefixAux».rule1 K.«#decodeLengthPrefixAux».rule2
    K.«#decodeLengthPrefixAux».rule3 K.«#decodeLengthPrefixAux».rule4 K.«#decodeLengthPrefixAux».rule5 at h
  repeat' k2l_split_hyp
  all_goals (simp only [Option.some.injEq, reduceCtorEq] at *)
  all_goals (try subst_vars)
  all_goals (try (simp only [Option.some.injEq, reduceCtorEq] at *); try subst_vars)
  all_goals first
    | (obtain ⟨rfl, rfl, rfl⟩ := K.«#decodeLengthPrefixAux».ctor_inj.1 ‹SortLengthPrefix.«_(_,_)» _ _ _ = SortLengthPrefix.«_(_,_)» T L P›
       simp only [IntHook.lt, IntHook.ge, IntHook.add, IntHook.sub, BoolHook.and, Bool.and_eq_true, decide_eq_true_eq] at *
       exact ⟨by omega, fun hT => by first | (simp at hT) | omega⟩)
    | (obtain ⟨L', hL', ⟨hT', hp'⟩ | ⟨hT', hp'⟩⟩ := K.«#decodeLengthPrefixLength».facts ‹K.«#decodeLengthPrefixLength» _ _ _ _ = some _› <;>
       obtain ⟨rfl, rfl, rfl⟩ := K.«#decodeLengthPrefixAux».ctor_inj.1 hp' <;>
       simp only [IntHook.lt, IntHook.ge, IntHook.add, IntHook.sub, BoolHook.and, Bool.and_eq_true, decide_eq_true_eq] at * <;>
       first | (simp at hT'; done) | exact ⟨by omega, fun hT => by first | (simp at hT) | omega⟩)

omit [Hooks] in
/-- What `#decodeLengthPrefix` returns (termination of `#rlpDecode`): the start is in range, the
item ends after it, and a list's payload starts after it. -/
theorem K.«#decodeLengthPrefix».facts {b : SortBytes} {s : Int} {p : SortLengthPrefix}
    (h : K.«#decodeLengthPrefix» b s = some p) :
    0 ≤ s ∧ s < KPrelude.BytesHook.length b ∧
      ∀ (T : SortLengthPrefixType) (L P : Int), p = SortLengthPrefix.«_(_,_)» T L P → s < L + P ∧ (T = SortLengthPrefixType.«#list» → s < P) := by
  unfold K.«#decodeLengthPrefix» K.«#decodeLengthPrefix».rule1 at h
  repeat' k2l_split_hyp
  all_goals (simp only [Option.some.injEq, reduceCtorEq] at *)
  all_goals (try subst_vars)
  all_goals (try (simp only [Option.some.injEq, reduceCtorEq] at *); try subst_vars)
  all_goals first
    | (have hs := KPrelude.BytesHook.substr_facts ‹KPrelude.BytesHook.substr _ _ _ = some _›
       simp only [IntHook.add, BytesHook.length] at hs ⊢
       exact ⟨by omega, by omega, K.«#decodeLengthPrefixAux».facts ‹_›⟩)
    | (simp_all; done)

omit [Hooks] in
/-- `#rlpDecodeAux`'s measure (termination of `#rlpDecode`). -/
def K.«#rlpDecodeAux».measure (b : SortBytes) : SortLengthPrefix → Nat
  | SortLengthPrefix.«_(_,_)» SortLengthPrefixType.«#list» _ P => 4 * (KPrelude.BytesHook.length b - P).toNat + 4
  | _ => 0

omit [Hooks] in
/-- `#rlpDecodeListAux`'s measure (termination of `#rlpDecode`). -/
def K.«#rlpDecodeListAux».measure (b : SortBytes) (s : Int) : SortLengthPrefix → Nat
  | SortLengthPrefix.«_(_,_)» _ L P =>
    if s < L + P then 4 * (KPrelude.BytesHook.length b - s).toNat + 2 else 4 * (KPrelude.BytesHook.length b - s).toNat + 4
"""
termination_by = "4 * (KPrelude.BytesHook.length x0).toNat + 1"
decreasing_by = """
all_goals
  simp_wf
  obtain ⟨h0, h1, h2⟩ := K.«#decodeLengthPrefix».facts hr
  unfold K.«#rlpDecodeAux».measure
  split
  · next T L P =>
    have := (h2 _ _ _ rfl).2 rfl
    simp only [KPrelude.BytesHook.length] at *
    omega
  · omega
"""

[functions."#rlpDecodeAux"]
termination_by = "K.«#rlpDecodeAux».measure x0 x1"
decreasing_by = """
all_goals
  simp_wf
  simp only [K.«#rlpDecodeAux».measure]
  omega
"""

[functions."#rlpDecodeList"]
termination_by = "4 * (KPrelude.BytesHook.length x0 - x1).toNat + 3"
decreasing_by = """
all_goals
  simp_wf
  obtain ⟨h0, h1, h2⟩ := K.«#decodeLengthPrefix».facts hr
  unfold K.«#rlpDecodeListAux».measure
  split
  next T L P =>
    have := (h2 _ _ _ rfl).1
    split <;> omega
"""

[functions."#rlpDecodeListAux"]
termination_by = "K.«#rlpDecodeListAux».measure x0 x1 x2"
decreasing_by = """
all_goals
  simp_wf
  have hs := KPrelude.BytesHook.substr_facts hr
  simp only [K.«#rlpDecodeListAux».measure, KPrelude.IntHook.add, KPrelude.BytesHook.length] at *
  split <;> omega
"""

# `senderTxData` normalizes the signature's v value: 0/1 become 27/28, and 2·CHAINID + 35/36
# become (v - 35) mod 2. At CHAINID = -4 the two rules cycle (0 → 27 → 0, 1 → 28 → 1), so K's
# rewriting diverges and the function has no value there; no measure exists. It is the least
# fixed point of its equations, which is `none` exactly on those arguments
# (`kevm-sender-diverges.lean` beside this file proves `senderTxData t 0 r s (-4) = none`).
[functions."senderTxData"]
partial_fixpoint = true
