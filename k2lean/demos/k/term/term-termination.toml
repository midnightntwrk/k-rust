# Termination inputs of the gate library kterm-ar (`k2lean gen --termination`, tests/libs.sh):
# the functions of term.k on which K's rewriting itself diverges. Every other recursive function
# of term.k gets its measure from the generator.
#
# `partial_fixpoint` makes a function (every member of its group) the least fixed point of its
# equations: `none` exactly where the rewriting does not terminate. `align`, `size` and `sizeTy`
# recurse on a type read from a table, an arbitrary map, so at M = ty(0) |-> arr(ty(0), 2) the
# rewriting cycles (align(M, arr(ty(0), 2)) => align(M, arr(ty(0), 2)), and sizeTy(M, ty(0)) =>
# size(M, arr(ty(0), 2)) => 2 *Int sizeTy(M, ty(0))); term-diverges.lean proves both have no value
# there.

[functions."align"]
partial_fixpoint = true

[functions."size"]
partial_fixpoint = true

[functions."sizeTy"]
partial_fixpoint = true
