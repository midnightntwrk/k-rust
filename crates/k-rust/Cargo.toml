[package]
name = "k-rust"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust implementation of the K Framework frontend"
readme = "../../README.md"
repository = "https://github.com/midnightntwrk/k-rust"
license = "BSD-3-Clause"
keywords = ["compiler", "k-framework", "kore", "parser", "semantics"]
categories = ["compilers", "development-tools", "parser-implementations"]

[[bin]]
name = "krust"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { workspace = true, optional = true }
gmp-mpfr-sys = { workspace = true, optional = true }
k-rust-backend.workspace = true
k-rust-kore.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
petgraph.workspace = true
regex.workspace = true
regex-automata.workspace = true
rug = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
z3 = { workspace = true, optional = true }

[dev-dependencies]
indoc.workspace = true
insta.workspace = true
proptest.workspace = true
toml.workspace = true

[features]
default = ["cli", "z3-inference-gh-release"]
cli = ["dep:clap", "mpfr-folding", "z3-inference"]
mpfr-folding = ["dep:gmp-mpfr-sys", "dep:rug"]
z3-inference = ["dep:z3", "k-rust-backend/z3"]
z3-inference-gh-release = [
  "z3-inference",
  "z3/gh-release",
  "k-rust-backend/z3-gh-release",
]
