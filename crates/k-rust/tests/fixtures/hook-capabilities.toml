  "KRYPTO.bls12G2OnCurve", "KRYPTO.bls12MapFp2ToG2", "KRYPTO.bls12MapFpToG1",
  "KRYPTO.bls12PairingCheck",
]

[[crypto.unsupported]]
reason = "the EIP-4844 KZG verifier is not implemented by the in-process backend"
hooks = ["KRYPTO.verifyKZGProof"]
