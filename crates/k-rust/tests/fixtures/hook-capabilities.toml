# These hooks require the branch-local state supplied only by ordinary execution.
# The context-free evaluator intentionally continues to report them as unsupported.
execution_only = [
  "IO.getc",
  "IO.putc",
  "IO.read",
  "IO.write",
]

# These hooks identify KORE builtin sorts, or name the literal syntax of a
# builtin sort's `token` production (MINT.literal); the backend internalizer
# handles them structurally and they are never evaluator calls.
structural = [
  "BOOL.Bool",
  "BUFFER.StringBuffer",
  "BYTES.Bytes",
  "FLOAT.Float",
  "INT.Int",
  "K.K",
  "K.KItem",
  "LIST.List",
  "MAP.Map",
  "MINT.MInt",
  "MINT.literal",
  "RANGEMAP.RangeMap",
  "SET.Set",
  "STRING.String",
]

# StringBuffer on the Rust backend: docs/compatibility.md, "Backend scope", the
# STRING-BUFFER paragraph.
[[unsupported]]
reason = "declared only in STRING-BUFFER-HOOKED, a [concrete] module that --backend rust excludes; STRING-BUFFER resolves to STRING-BUFFER-IN-K, whose equations define StringBuffer over String; no evaluator exists for KORE that keeps the hooked module (kcompile --backend llvm output) or for a user production that declares one of these hooks"
hooks = ["BUFFER.concat", "BUFFER.empty", "BUFFER.toString"]

[[unsupported]]
reason = "MInt-specialized and utility byte operations are not implemented"
hooks = [
  "BYTES.bytes2hex",
  "BYTES.getMInt",
  "BYTES.lengthMInt",
  "BYTES.memset",
  "BYTES.padLeftMInt",
  "BYTES.padRightMInt",
  "BYTES.replaceAtMInt",
  "BYTES.substrMInt",
  "BYTES.updateMInt",
]

# FLOAT.root evaluates IEEE 754 rootn of every integer degree for binary32 and
# binary64, correctly rounded.
[[unsupported]]
reason = "WASM-unused arbitrary-precision, transcendental, remainder, and exponent hooks are not implemented"
hooks = [
  "FLOAT.acos",
  "FLOAT.asin",
  "FLOAT.atan",
  "FLOAT.atan2",
  "FLOAT.cos",
  "FLOAT.exp",
  "FLOAT.exponent",
  "FLOAT.log",
  "FLOAT.minValue",
  "FLOAT.pow",
  "FLOAT.rem",
  "FLOAT.sin",
  "FLOAT.tan",
]

[[unsupported]]
reason = "randomness is not implemented"
hooks = ["INT.rand", "INT.srand"]

[[unsupported]]
reason = "filesystem, process, clock, logging, and stream-management effects are not exposed by the backend"
hooks = [
  "IO.accept",
