# Runtime hook capabilities for the K 7.1.337 prelude embedded by k-rust.
# Every hook in prelude.md and its transitive requires must occur exactly once.
version = 1

implemented = [
  "BOOL.and",
  "BOOL.andThen",
  "BOOL.eq",
  "BOOL.implies",
  "BOOL.ne",
  "BOOL.not",
  "BOOL.or",
  "BOOL.orElse",
  "BOOL.xor",
  "BYTES.bytes2int",
  "BYTES.bytes2string",
  "BYTES.concat",
  "BYTES.decodeBytes",
  "BYTES.empty",
  "BYTES.encodeBytes",
  "BYTES.get",
  "BYTES.int2bytes",
  "BYTES.length",
  "BYTES.padLeft",
  "BYTES.padRight",
  "BYTES.replaceAt",
  "BYTES.reverse",
  "BYTES.string2bytes",
  "BYTES.substr",
  "BYTES.update",
  "INT.abs",
  "INT.add",
  "INT.and",
  "INT.ediv",
  "INT.emod",
  "INT.eq",
  "INT.ge",
  "INT.gt",
  "INT.le",
  "INT.log2",
  "INT.lt",
  "INT.max",
  "INT.min",
  "INT.mul",
  "INT.ne",
  "INT.not",
  "INT.or",
  "INT.pow",
  "INT.powmod",
  "INT.shl",
  "INT.shr",
  "INT.sub",
  "INT.tdiv",
  "INT.tmod",
  "INT.xor",
  "IO.logString",
  "KEQUAL.eq",
  "KEQUAL.ite",
  "KEQUAL.ne",
  "LIST.concat",
  "LIST.element",
  "LIST.get",
  "LIST.in",
  "LIST.make",
  "LIST.range",
  "LIST.size",
  "LIST.unit",
  "LIST.update",
  "LIST.updateAll",
  "MAP.concat",
  "MAP.element",
  "MAP.in_keys",
  "MAP.inclusion",
  "MAP.keys",
  "MAP.keys_list",
  "MAP.lookup",
  "MAP.lookupOrDefault",
  "MAP.remove",
  "MAP.removeAll",
  "MAP.size",
  "MAP.unit",
  "MAP.update",
  "MAP.updateAll",
  "MAP.values",
  "SET.concat",
  "SET.difference",
  "SET.element",
  "SET.in",
  "SET.inclusion",
