"KRYPTO.sha512raw" = 1
"KRYPTO.verifyKZGProof" = 4
"SECP256K1.ecdsaRecover" = 4

[[crypto.unsupported]]
reason = "the reference plugin's remaining hash algorithms and raw forms have no in-process evaluator"
hooks = [
  "KRYPTO.blake2b256", "KRYPTO.blake2b256raw", "KRYPTO.blake2compress",
  "KRYPTO.sha3", "KRYPTO.sha3raw",
  "KRYPTO.sha512", "KRYPTO.sha512_256", "KRYPTO.sha512raw",
]

[[crypto.unsupported]]
reason = "signing and the additional signature schemes are not implemented by the in-process backend"
hooks = ["KRYPTO.ecdsaSign", "KRYPTO.ed25519verify", "KRYPTO.p256verify"]

[[crypto.unsupported]]
reason = "BN128 curve operations are tracked as unsupported semantics capabilities"
hooks = [
  "KRYPTO.bn128ate",
]

[[crypto.unsupported]]
reason = "BLS12-381 curve operations are not implemented by the in-process backend"
hooks = [
  "KRYPTO.bls12G1Add", "KRYPTO.bls12G1InSubgroup", "KRYPTO.bls12G1Msm",
  "KRYPTO.bls12G1Mul", "KRYPTO.bls12G1OnCurve", "KRYPTO.bls12G2Add",
