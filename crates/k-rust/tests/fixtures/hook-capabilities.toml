# MAP.choice and SET.choice evaluate on an empty collection (undefined) and on a
# one-item collection (its item); docs/compatibility.md, "Hook values at the
# edges of their domains".
[[unsupported]]
reason = "choice among two or more items is not implemented"
hooks = ["MAP.choice", "SET.choice"]

[[unsupported]]
reason = "Unicode properties, floating conversion, and UUID generation are not implemented"
hooks = [
  "STRING.category",
  "STRING.directionality",
  "STRING.float2string",
  "STRING.floatFormat",
  "STRING.string2float",
  "STRING.uuid",
]

# Hooks without a backend evaluator that the equations of the named module of
# the prelude define where they apply: where the module is imported, a ground
# application evaluates through those equations; where it is not, the
# application is the unsupported-hook error; and where no equation applies, it
# stays unevaluated (replace(S, T, R, N) with N < 0 has none).
[[equation_defined]]
module = "LIST"
reason = "no backend evaluator; defined by the module's equations where they apply"
hooks = ["LIST.push"]

[[equation_defined]]
module = "STRING-COMMON"
reason = "no backend evaluator; defined by the module's equations where they apply"
hooks = [
  "STRING.findChar",
  "STRING.replace",
  "STRING.replaceFirst",
  "STRING.rfindChar",
]

# Crypto evaluators in the K v7.1.337 reference stack come from its pinned
# Haskell backend input, not from K's embedded prelude. The broader KRYPTO
# vocabulary is declared by blockchain-k-plugin. These immutable revisions
# make the union classified below reviewable:
# - runtimeverification/haskell-backend 38afc81, Kore.Builtin.Krypto
# - runtimeverification/blockchain-k-plugin 207ae512, plugin/krypto.md
[crypto]
sources = [
  "runtimeverification/haskell-backend@38afc81:Kore.Builtin.Krypto",
  "runtimeverification/blockchain-k-plugin@207ae512:plugin/krypto.md",
]
implemented = [
  "HASH.keccak256",
  "HASH.ripemd160",
  "HASH.sha256",
  "HASH.sha3_256",
  "KRYPTO.bn128add",
  "KRYPTO.bn128ate",
  "KRYPTO.bn128g2valid",
  "KRYPTO.bn128mul",
  "KRYPTO.bn128valid",
  "KRYPTO.ecdsaPubKey",
  "KRYPTO.ecdsaRecover",
  "KRYPTO.keccak256",
  "KRYPTO.keccak256raw",
  "KRYPTO.ripemd160",
  "KRYPTO.ripemd160raw",
  "KRYPTO.sha256",
  "KRYPTO.sha256raw",
  "KRYPTO.sha3256",
  "KRYPTO.sha512_256raw",
  "SECP256K1.ecdsaRecover",
]

