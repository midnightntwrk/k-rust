case = "non-ascii-stdout"
subsystem = "cli"
harvested_from = "hand-written krun CLI probe: console bytes of non-ASCII String characters written through a stdout stream cell; the LLVM backend's krun, since the pinned Haskell backend has no IO.write hook"
k_revision = "4a46d1231473b599c699160132fd6e76a5c46406"
haskell_backend = "0.1.155 (38afc81)"

[[artifact]]
file = "stdout.bin"
command = '''
kompile test.k --backend llvm --main-module NON-ASCII-STDOUT --syntax-module NON-ASCII-STDOUT-SYNTAX --output-definition ref --warnings none >/dev/null &&
krun program.pgm --definition ref --output none </dev/null > stdout.bin
'''
tool = "krun"
exit_code = 0
