# UNIQUE_ID of every generated cell initializer axiom of ref/definition.kore and
# ref-bare/definition.kore, keyed by the initializer label. K's TypeInferenceVisitor wraps a bare
# configuration variable in #SemanticCastTo<inferred sort> (KConfigVar constants are variables,
# TypeInferenceVisitor.java:221-233, SortInferencer.java:228 and :563), so
# GenerateSentencesFromConfigDecl.getLeafInitializer hashes
# `initKCell(Init) => <k> #SemanticCastToK(project:KItem(Init[$PGM])) </k>`; initNCell ($N:Int,
# an explicit cast) is the control. The bare `<p> $P </p>` cell takes content sort K from that
# cast (`symbol Lbl'-LT-'p'-GT-'{}(SortK{}) : SortPCell{}`), and configVars.sh declares every
# bare variable at KItem (CompiledDefinition.java:110-112 maps K to KItem).

