[package]
name = "k-rust-backend"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "An in-process symbolic execution backend for k-rust"
repository = "https://github.com/midnightntwrk/k-rust"
license = "BSD-3-Clause"
keywords = ["k-framework", "kore", "rewriting", "symbolic-execution"]
categories = ["compilers", "development-tools"]

[dependencies]
k-rust-kore.workspace = true
k256.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
petgraph.workspace = true
ripemd.workspace = true
rustc-hash.workspace = true
sha2.workspace = true
sha3.workspace = true
substrate-bn.workspace = true
z3 = { workspace = true, optional = true }

[dev-dependencies]
indoc.workspace = true
# Test builds count work through `k_rust_kore::measure`; `cargo build` stays feature-off.
k-rust-backend = { path = ".", features = ["measure"] }
k-rust-kore = { workspace = true, features = ["measure"] }
proptest.workspace = true

[features]
measure = ["k-rust-kore/measure"]
z3 = ["dep:z3"]
z3-gh-release = ["z3", "z3/gh-release"]
