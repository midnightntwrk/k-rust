[package]
name = "k-rust-backend"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "An in-process symbolic execution backend for k-rust"
repository = "https://github.com/midnightntwrk/k-rust"
license = "BSD-3-Clause"
keywords = ["k-framework", "kore", "rewriting", "symbolic-execution"]
categories = ["compilers", "development-tools"]

[dependencies]
k-rust-kore.workspace = true
k256.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
petgraph.workspace = true
ripemd.workspace = true
rustc-hash.workspace = true
sha2.workspace = true
sha3.workspace = true
substrate-bn.workspace = true
z3 = { workspace = true, optional = true }
# MPFR, linked only for the test feature `mpfr-oracle`: an independent oracle of the canonical
# Float text (`builtin/float/canonical/mpfr_oracle.rs`). No build of the backend computes with it.
rug = { workspace = true, optional = true }

# The simplifier's stack guard reads the current thread's real stack bounds. On wasm32 the
# engine's call-stack limit is invisible to the module, so the guard is absent there and the
# wasm build carries no C build step.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
stacker.workspace = true

# The memory allowance (`allowance`) reads the process's resource limits and the machine's
# physical memory through `getrlimit` and `sysconf`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
indoc.workspace = true
insta.workspace = true
# Test builds count work through `k_rust_kore::measure`, check every normal-form claim
# (`check-normal-forms`), may turn the simplifier's memoization off (`test-switches`) and build
# domain values without a definition (`raw-domain-values`); `cargo build` stays feature-off.
k-rust-backend = { path = ".", features = [
  "measure",
  "check-normal-forms",
  "test-switches",
  "raw-domain-values",
] }
k-rust-kore = { workspace = true, features = ["measure"] }
lean-conformance.workspace = true
proptest.workspace = true
serde_json.workspace = true

[features]
# Panic when a term marked evaluated or minted instance-normal is matched at its root by some
# term equation of the definition (`term::head::check`). For tests; off in every normal build.
check-normal-forms = []
# Expose `simplify::without_unspecified_reuse`, which turns off the reuse of `Unspecified`
# evaluations so that a test can compare the simplifier with and without it. For tests; off in
# every normal build, where reuse is always on and the switch costs nothing.
test-switches = []
# Check the canonical Float text against MPFR (`builtin/float/canonical/mpfr_oracle.rs`). For
# tests; CI runs it, and no other build links MPFR.
mpfr-oracle = ["dep:rug"]
# Expose `Term::raw_domain_value`, which stores a domain value's text as given, without a kind,
# so that the test suites of this crate and of its dependents build terms without a definition.
# For tests; off in every normal build, where every domain value is built with its sort's kind.
raw-domain-values = []
measure = ["k-rust-kore/measure"]
z3 = ["dep:z3"]
z3-gh-release = ["z3", "z3/gh-release"]
