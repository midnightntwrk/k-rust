[package]
name = "k-rust-wasm"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly bindings for the portable k-rust frontend"
repository = "https://github.com/midnightntwrk/k-rust"
license = "BSD-3-Clause"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
k-rust = { path = "../k-rust", default-features = false }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
