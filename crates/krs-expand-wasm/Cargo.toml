[package]
name = "krs-expand-wasm"
description = "Browser-lesson KRS expander: whole-file expansion behind a JSON Wasm ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
krs-expand = { path = "../krs-expand" }
# Without the default `abi` feature, so this module does not re-export the
# policy module's `krs_lesson_policy_*` symbols.
krs-lesson-policy = { path = "../krs-lesson-policy", default-features = false }
krs-wasm-abi = { path = "../krs-wasm-abi" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
syn = { version = "2.0.119", features = ["full", "parsing"] }

# The workspace table forbids `unsafe_code`; the Wasm exports that
# `krs_wasm_abi::export!` declares carry `#[unsafe(no_mangle)]`, which that
# lint reports and `forbid` cannot allow locally. This table repeats the
# workspace policy with `deny`, and only those exports carry
# `#[allow(unsafe_code)]`. The crate has no `unsafe` block.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
