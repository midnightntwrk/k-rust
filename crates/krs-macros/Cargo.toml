[package]
name = "krs-macros"
description = "Procedural macro facade for Rust-hosted KRS definitions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
krs-ir = { path = "../krs-ir" }
krs-syntax = { path = "../krs-syntax" }
proc-macro-crate = "3.4.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full", "parsing", "printing"] }

[lints]
workspace = true
