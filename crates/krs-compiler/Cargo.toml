[package]
name = "krs-compiler"
description = "Target-neutral semantic analysis, lowering, and K emission for KRS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = ["krs-ir/test-support", "krs-ir-levels/test-support"]

[dependencies]
krs-diagnostic = { path = "../krs-diagnostic" }
krs-ir = { path = "../krs-ir", features = ["proc-macro2"] }
krs-ir-levels = { path = "../krs-ir-levels" }
krs-syntax = { path = "../krs-syntax" }
proc-macro2 = { workspace = true, features = ["span-locations"] }
prettyplease = { workspace = true }
quote = { workspace = true }
regex = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true }
syn = { workspace = true, features = ["full", "parsing"] }

[lints]
workspace = true

[dev-dependencies]
expect-test = { workspace = true }
krs-compiler = { path = ".", features = ["test-support"] }
krs-ir = { path = "../krs-ir", features = ["test-support"] }
krs-ir-levels = { path = "../krs-ir-levels", features = ["test-support"] }
krs-test-support = { path = "../krs-test-support" }
