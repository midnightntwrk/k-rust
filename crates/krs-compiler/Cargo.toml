[package]
name = "krs-compiler"
description = "Deterministic host collection and target-neutral semantic analysis for KRS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
krs-ir = { path = "../krs-ir", features = ["proc-macro2"] }
krs-syntax = { path = "../krs-syntax" }
proc-macro2 = { workspace = true, features = ["span-locations"] }
prettyplease = { workspace = true }
quote = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true }
syn = { workspace = true, features = ["full", "parsing", "visit"] }
toml_edit = { workspace = true, features = ["parse"] }

[lints]
workspace = true

[dev-dependencies]
expect-test = { workspace = true }
krs-ir = { path = "../krs-ir", features = ["test-support"] }
krs-test-support = { path = "../krs-test-support" }
