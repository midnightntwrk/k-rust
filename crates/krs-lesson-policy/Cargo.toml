[package]
name = "krs-lesson-policy"
description = "Syntactic pre-pass that bounds the editable surface of KRS browser lessons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["abi"]
# Exports the `krs_lesson_policy_{alloc,run,dealloc}` Wasm ABI. Crates that
# link the policy as an rlib (the path-C expander) disable it.
abi = ["dep:krs-wasm-abi"]

[dependencies]
krs-syntax = { path = "../krs-syntax" }
krs-wasm-abi = { path = "../krs-wasm-abi", optional = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
serde.workspace = true
serde_json.workspace = true
syn = { workspace = true, features = ["full", "parsing", "visit"] }

[dev-dependencies]
toml_edit = { workspace = true, features = ["parse"] }

# The workspace table forbids `unsafe_code`; the Wasm exports that
# `krs_wasm_abi::export!` declares carry `#[unsafe(no_mangle)]`, which that
# lint reports and `forbid` cannot allow locally. This table repeats the
# workspace policy with `deny`, and only those exports carry
# `#[allow(unsafe_code)]`. The crate has no `unsafe` block.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
