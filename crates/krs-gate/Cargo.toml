[package]
name = "krs-gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Native KRS gate protocol and compiler"

[features]
default = ["z3-inference"]
z3-inference = ["k-rust/z3-inference", "krs-exec/z3-inference", "krs-k-rust/z3-inference"]

[dependencies]
k-rust = { version = "=0.4.0", path = "../../../inspirations/midnightntwrk/k-rust-krs-main/crates/k-rust", default-features = false }
krs-cli = { path = "../krs-cli" }
krs-compiler = { path = "../krs-compiler" }
krs-diagnostic = { path = "../krs-diagnostic" }
krs-exec = { path = "../krs-exec", default-features = false }
krs-expand = { path = "../krs-expand" }
krs-ir = { path = "../krs-ir" }
krs-ir-levels = { path = "../krs-ir-levels" }
krs-k-rust = { path = "../krs-k-rust", default-features = false }
krs-unparse = { path = "../krs-unparse" }
quote.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true

[dev-dependencies]
krs-ir = { path = "../krs-ir", features = ["test-support"] }
krs-test-support = { path = "../krs-test-support" }

[lints]
workspace = true
