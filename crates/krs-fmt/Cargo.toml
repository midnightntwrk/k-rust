[package]
name = "krs-fmt"
description = "Canonical formatter for KRS macro authoring surfaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
krs-ir = { path = "../krs-ir", features = ["proc-macro2"] }
krs-syntax = { path = "../krs-syntax" }
proc-macro2 = { workspace = true, features = ["span-locations"] }
similar = "2.7.0"
syn = { workspace = true, features = ["full", "parsing", "visit"] }
unicode-width = "0.2.2"

[dev-dependencies]
expect-test = { workspace = true }

[lints]
workspace = true
