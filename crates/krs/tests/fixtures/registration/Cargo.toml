[workspace]
members = ["collector", "semantics-dependency"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
k = { package = "krs", path = "../../.." }
semantics-dependency = { path = "semantics-dependency" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
