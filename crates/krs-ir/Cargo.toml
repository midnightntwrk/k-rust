[package]
name = "krs-ir"
description = "Stable descriptor and intermediate-representation contracts for KRS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
expect-test = { workspace = true }
krs-ir = { path = ".", features = ["test-support"] }
proc-macro2 = { workspace = true }
serde-reflection = "0.6.0"
static_assertions = "1.1.0"
syn = { workspace = true, features = ["full", "parsing"] }
toml_edit = { workspace = true, features = ["parse"] }

[lints]
workspace = true
