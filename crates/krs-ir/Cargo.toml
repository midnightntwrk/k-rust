[package]
name = "krs-ir"
description = "Stable descriptor and intermediate-representation contracts for KRS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
expect-test = "1.5.1"
krs-ir = { path = ".", features = ["test-support"] }
proc-macro2 = "1.0.107"
serde-reflection = "0.6.0"
static_assertions = "1.1.0"
syn = { version = "2.0.119", features = ["full", "parsing"] }
toml_edit = { version = "0.25.13", default-features = false, features = ["parse"] }

[lints]
workspace = true
