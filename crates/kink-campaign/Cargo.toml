[package]
name = "kink-campaign"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
k-rust.workspace = true
kink-native.workspace = true
kink-patch.workspace = true
kink-pattern.workspace = true

serde_json.workspace = true

[dev-dependencies]
# The source scan of tests/identity.rs (packet CACHE-ID-fix-1): syn parses every member's
# sources, toml reads the workspace's members and k-rust paths. Both are already in Cargo.lock.
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
toml = { version = "=0.9.12", default-features = false, features = ["parse", "serde", "std"] }

[features]
z3 = ["kink-native/z3"]
