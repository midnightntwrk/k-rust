[package]
name = "krs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cargo-native command and collection pipeline for KRS definitions"

[[bin]]
name = "krs"
path = "src/main.rs"
doc = false

[features]
default = ["z3-inference"]
z3-inference = ["krs-k-rust/z3-inference"]

[dependencies]
krs = { path = "../krs" }
krs-compiler = { path = "../krs-compiler" }
krs-fmt = { path = "../krs-fmt" }
krs-ir = { path = "../krs-ir" }
krs-k-rust = { path = "../krs-k-rust", default-features = false }
krs-syntax = { path = "../krs-syntax" }
lexopt = "0.3.2"
proc-macro2 = "1.0.107"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
toml_edit = { version = "0.25.13", default-features = false, features = ["display", "parse"] }

[dev-dependencies]
krs-test-support = { path = "../krs-test-support" }
syn = { version = "2.0.119", features = ["full", "parsing"] }

[lints]
workspace = true
