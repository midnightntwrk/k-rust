[package]
name = "krs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cargo-native command and collection pipeline for KRS definitions"

[[bin]]
name = "krs"
path = "src/main.rs"
doc = false

[features]
default = ["z3-inference"]
z3-inference = ["krs-k-rust/z3-inference"]

[dependencies]
krs = { path = "../krs" }
krs-compiler = { path = "../krs-compiler" }
krs-fmt = { path = "../krs-fmt" }
krs-ir = { path = "../krs-ir" }
krs-k-rust = { path = "../krs-k-rust", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"

[lints]
workspace = true
