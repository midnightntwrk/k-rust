[package]
name = "k-rust-regex"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "K token regular expressions: syntax, parsing, printing, and definition-independent checks"
repository = "https://github.com/midnightntwrk/k-rust"
license = "BSD-3-Clause"
keywords = ["k-framework", "regex", "lexer", "parser"]
categories = ["compilers", "parser-implementations"]

# The regex language needs nothing beyond `std`, so this crate deliberately has no dependencies:
# proc macros and WebAssembly builds can validate K token regexes without building the frontend.
[dependencies]
