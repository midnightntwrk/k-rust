[package]
name = "krs-expand"
description = "Proc-macro-free expansion core shared by krs-macros and non-rustc expansion hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
krs-ir = { path = "../krs-ir" }
krs-syntax = { path = "../krs-syntax" }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde_json.workspace = true
syn = { version = "2.0.119", features = ["full", "parsing", "printing", "visit"] }

[dev-dependencies]
expect-test = "1.5.1"
prettyplease = "0.2.37"
sha2 = "0.10.9"

[lints]
workspace = true
