[package]
name = "krs-k-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Versioned KRS adapter for the pinned k-rust frontend"

[features]
default = ["z3-inference"]
z3-inference = ["k-rust/z3-inference"]

[dependencies]
k-rust = { version = "=0.4.0", path = "../../../inspirations/midnightntwrk/k-rust-krs-main/crates/k-rust", default-features = false }
krs-ir = { path = "../krs-ir" }
krs-ir-levels = { path = "../krs-ir-levels" }
krs-diagnostic = { path = "../krs-diagnostic" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
krs-ir = { path = "../krs-ir", features = ["test-support"] }
