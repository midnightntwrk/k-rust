# cargo-nextest configuration for the workspace.
#
# nextest runs every test in its own process, up to `--test-threads` (by default the number of
# CPUs) at a time, and counts each test as one thread unless an override below says otherwise.
# A test that spawns `krust` waits for the child, so it uses one CPU at a time and needs no
# override. Doc-tests do not run under nextest; run them with `cargo test --doc`.

# `priority` below needs nextest 0.9.91; CI installs the recommended version.
nextest-version = { required = "0.9.91", recommended = "0.9.143" }

[test-groups]
# Tests that measure the machine: peak RSS and the wall-clock timing residual of a `krust
# kcompile` child, judged against fixed bounds.
machine-measurement = { max-threads = 1 }
# kink's tests whose assertion compares elapsed wall time with a bound or with another run's: they
# run one at a time, so that other tests' CPU contention does not move the time they compare.
wall-clock = { max-threads = 1 }

[profile.default]
# Report a test as slow after each minute, and stop it after ten. The slowest tests take about
# two minutes on a loaded workstation, so ten minutes turns only a hang into a failure.
slow-timeout = { period = "60s", terminate-after = 10 }

# The measurement tests run alone, so that other tests' CPU and memory contention does not move
# the quantities they bound. `measure.py` stops their child after 900 seconds, so nextest waits
# longer than that before stopping the test itself.
#
# A test that needs every slot waits until all running tests finish, and nothing else starts
# meanwhile. The tests below that reserve more than one slot therefore have the highest
# priority: they start first, before any long test holds a slot.
[[profile.default.overrides]]
filter = 'package(k-rust) & (binary(kompile_memory) | binary(timings_residual) | binary(kompile_scaling))'
test-group = "machine-measurement"
threads-required = "num-test-threads"
priority = 100
slow-timeout = { period = "60s", terminate-after = 20 }

# This test reruns its own binary under libtest, whose default thread count is the number of
# CPUs, so it reserves that many slots instead of one.
[[profile.default.overrides]]
filter = 'package(k-rust) & binary(inner_rules) & test(=every_rule_test_passes_under_checked_inference)'
threads-required = "num-cpus"
priority = 100

# The freshness gate's advisory report line names the report file; print it on success too.
[[profile.default.overrides]]
filter = 'package(algo-graph) & binary(freshness)'
success-output = "final"

# kink (kink/README.md, "Gate"). Its tests' default slow timeout is the one above. Every filter
# below names kink packages, binaries and test paths only; `kink/scripts/kink-tier.py lint` fails
# when one of them stops matching a test.
#
# kink-flow: the slow program's recorded wall time must exceed the fast one's.
[[profile.default.overrides]]
filter = 'package(kink-flow) & binary(usability) & test(=kink_tier::the_cheaper_killer_is_found_and_hinted_first)'
test-group = "wall-clock"

# kink's heavy tests that take longer than the default ten minutes on a quiet host: the one-sided
# differential over IMP and its mutants takes about 21 minutes alone.
[[profile.default.overrides]]
filter = 'package(kink-flow) & binary(one_sided) & test(=heavy::every_one_sided_kill_on_imp_agrees_with_the_unbounded_verdict)'
slow-timeout = { period = "60s", terminate-after = 40 }

# A profile for continuous integration: run every test even after a failure, as
# `cargo test --no-fail-fast` does, and print each failure's output at the end as well.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"

# The profile of CI's Z3 workspace step, which runs under `KRUST_TYPE_INFERENCE_MODE=checked`:
# every sort inference runs both engines and fails on a disagreement, and returns what the
# default mode returns when they agree. k-rust's `measure_ratchet` pins the work of one engine,
# so it returns early under checked mode; it is left out here, and `scripts/measure-ratchet.sh`
# runs it in the default mode. `k-rust-wasm` ships without Z3, and in a workspace build Cargo
# compiles it with the Z3 features other members select, so its tests run in CI's portable steps
# instead.
[profile.ci-checked]
fail-fast = false
failure-output = "immediate-final"
default-filter = 'not (binary_id(k-rust::measure_ratchet) | package(k-rust-wasm))'

# The profile of kink's tier runs (`kink/scripts/kink-tier.py run`): as `ci`, and it writes a
# JUnit report (target/nextest/kink/junit.xml) whose per-test times the tier budget check reads.
[profile.kink]
fail-fast = false
failure-output = "immediate-final"

[profile.kink.junit]
path = "junit.xml"
